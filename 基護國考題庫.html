穿透力佳，對組織的傷害亦較小②冰袋及冰枕，不能直接用於皮膚③冰領適用於甲狀腺術後的止痛與止血④臨床上低溫毯用於心臟手術病人的目的是促進新陳代謝率","o":["①②","①③","②③","③④"],"a":"C","k":"C","t":"","x":"冰袋、冰枕需加套子包覆，不可直接接觸皮膚以免凍傷（②）；冰領置於頸部，適用於甲狀腺或扁桃腺術後的止痛與止血（③）。①濕冷的穿透力較乾冷強，但對組織的傷害也較大；④低溫毯用於心臟手術是為了降低新陳代謝率、減少組織耗氧，而非促進代謝。"},{"i":"113-3|17","e":"113-3","n":17,"c":2,"s":"有關冷熱應用能量轉換原理之敘述，下列何者錯誤？","o":["失溫病人，使用電毯來提高其體溫，主要是利用傳導（conduction）原理","中暑體溫過高時，利用溫水拭浴協助降溫，主要是利用轉換（conversion）原理","病人感覺寒冷時，以烤燈協助其提高體溫，主要是利用輻射（radiation）原理","發燒病人，調降室內空調溫度以降溫，主要是利用對流（convection）原理"],"a":"B","k":"B","t":"","x":"溫水拭浴主要是藉由皮膚與溫水接觸的傳導，以及水分蒸發帶走熱能來降溫，並非轉換原理，故B錯誤。轉換是指將其他形式能量（如超音波、微波）轉為熱能。電毯為傳導、烤燈為輻射、調降空調溫度為對流，皆正確。"},{"i":"113-3|18","e":"113-3","n":18,"c":2,"s":"有關局部濕熱敷之使用，下列何者錯誤？","o":["可於濕熱敷處先塗凡士林，避免燙傷","保持濕熱敷溫度，濕熱敷料應經常更換","濕熱敷溫度散失快，故溫度以50.5～63℃為宜","使用時間每次約20～30分鐘"],"a":"C","k":"C","t":"","x":"局部濕熱敷的溫度一般約40.5～46℃，由於水的導熱性佳，溫度不宜過高，50.5～63℃易造成燙傷，故C錯誤。熱敷前可塗凡士林保護皮膚，敷料應經常更換以維持溫度，每次使用約20～30分鐘，避免反彈現象。"},{"i":"113-2|14","e":"113-2","n":14,"c":2,"s":"關於用熱的合併症，下列敘述何者錯誤？","o":["用熱超過1小時，血管會收縮組織會缺氧","出現全身症狀可能會心跳停止、體液失衡","引起局部皮膚發紅、敏感、疼痛或水泡","微血管通透性增加，可能會導致水腫加劇"],"a":"B","k":"B","t":"","x":"用熱的合併症以局部為主，如皮膚發紅、敏感、疼痛、水泡；大面積用熱可能使血管擴張、血壓下降而頭暈或昏倒，但不會「心跳停止」，故B錯誤。用熱過久會產生反彈現象使血管收縮；用熱使微血管通透性增加，可能加重水腫。"},{"i":"113-1|14","e":"113-1","n":14,"c":2,"s":"熱敷時間超過45分鐘，會引起血管收縮屬於下列何種狀況？","o":["適應現象（adaptation phenomenon）","反彈現象（rebound phenomenon）","交感反應（consensual response）","保護性反應（protective response）"],"a":"B","k":"B","t":"","x":"用熱超過約45～60分鐘，原本擴張的血管會反射性收縮，稱為反彈現象，可防止組織受傷。適應現象是溫度接受器持續受刺激後敏感度下降；交感（共感）反應是對一側用冷熱時，對側相同部位亦出現類似反應。"},{"i":"113-1|15","e":"113-1","n":15,"c":2,"s":"關於冷熱療法效果與目的，下列敘述何者錯誤？","o":["使用熱敷處理疼痛，主要作用是促進血液循環，減少充血腫脹","冷敷用於靜脈炎的作用是減緩血流，降低白血球活性阻止炎症進展","所有冷熱敷的設備均要直接與皮膚接觸，才能達到最大治療效果","進行濕熱敷時為預防燙傷，可於皮膚塗上凡士林以達到保護目的"],"a":"C","k":"C","t":"","x":"冷熱設備（如熱水袋、冰枕、低溫毯）不可直接接觸皮膚，應以布套或毛巾包覆，避免燙傷或凍傷，故C錯誤。熱敷可促進血液循環以減輕疼痛；冷敷可減緩血流與白血球活性以控制發炎；濕熱敷前可於皮膚塗凡士林保護。"},{"i":"113-1|16","e":"113-1","n":16,"c":2,"s":"病人因高燒使用低溫毯，護理師在使用低溫毯期間，下列照護事項何者正確？①為達到降溫效益，低溫毯應直接與病人皮膚接觸 ②剛使用時應每5分鐘測量病人的生命徵象，待穩定後則可以每15分鐘監測一次③使用過程中若病人出現發抖現象，為正常現象，可持續使用，但需每15分鐘監測體溫一次 ④應每30～60分鐘協助病人翻身，以免造成壓力性損傷","o":["①②","③④","①③","②④"],"a":"D","k":"D","t":"","x":"使用低溫毯時，開始應每5分鐘測量生命徵象，穩定後每15分鐘監測；並每30～60分鐘翻身，預防皮膚長時間受冷受壓，故②④正確。低溫毯與皮膚間應鋪上被單，不可直接接觸；病人若發抖表示產熱增加，應暫停或調整，不可繼續使用。"},{"i":"113-1|17","e":"113-1","n":17,"c":2,"s":"在冷敷過程中，患處出現下列何種症狀，可持續使用？","o":["患處有涼的感覺","麻木感","藍斑","疼痛"],"a":"A","k":"A","t":"","x":"冷敷時患處有涼的感覺屬正常反應，可繼續使用。若出現麻木感、皮膚藍斑（發紺）或疼痛，表示局部循環不良或組織受損，應立即停止冷敷並評估皮膚狀況。"},{"i":"112-3|16","e":"112-3","n":16,"c":2,"s":"有關人體溫度調控的敘述，下列何者正確？","o":["出現極度冷熱刺激時，脊髓反射作用會產生保護機制以避免傷害","皮膚上熱的接受器位於四肢較多，因此對熱的刺激反應比較顯著","時間愈久溫度接受器產生適應時，對溫度的敏感度會隨之增加","當室溫增加時會促進血管收縮，藉由流汗從皮膚蒸發來散熱"],"a":"A","k":"A","t":"","x":"遇到極度冷或熱的刺激時，會經脊髓反射立即產生縮回等保護動作，以避免組織傷害。身體對冷熱的感受與溫度接受器分布有關，冷接受器多於熱接受器；接受器持續受刺激後會產生適應，敏感度降低；室溫上升時皮膚血管擴張並流汗以散熱。"},{"i":"112-2|25","e":"112-2","n":25,"c":2,"s":"有關能量轉移方式的原理和運用之敘述，下列何者正確？","o":["輻射方式不須透過其他物質作為媒介就可達成能量喪失，如減少或增加被蓋","蒸發則是藉由液體或氣體為介質，讓能量由冷熱不同處轉移，如呼吸時水分的喪失","傳導則是藉由皮膚表面和物體的直接接觸產生能量轉移，如空調的使用","對流則是指水分由液體變為氣體而導致能量喪失，如化學劑加熱包（暖暖包）的使用"],"a":"A","k":"A","t":"","x":"輻射是以電磁波形式傳遞熱能，不需透過介質，增減被蓋即可改變輻射散熱，故A正確。B所述「藉液體或氣體為介質流動傳熱」是對流的定義，蒸發是水分由液體變為氣體而散熱（呼吸失水才是蒸發的例子）；C的定義屬傳導，但空調是對流的例子；D所述「水分由液體變為氣體」是蒸發的定義，暖暖包則屬傳導，故B、C、D皆錯誤。"},{"i":"112-2|26","e":"112-2","n":26,"c":2,"s":"下列何種冷熱的應用方法，是使用輻射的方式？①冰枕 ②紅外線 ③溫水拭浴 ④烤燈 ⑤熱水袋","o":["①③","②④","③④","④⑤"],"a":"B","k":"B","t":"","x":"紅外線與烤燈不需直接接觸皮膚，以電磁波將熱能傳至身體，屬輻射方式。冰枕與熱水袋是直接接觸皮膚的傳導方式；溫水拭浴主要藉由傳導與蒸發散熱。"},{"i":"112-2|27","e":"112-2","n":27,"c":2,"s":"有關冷熱應用的注意事項，下列何者最正確？","o":["一般治療依醫囑而定，若無醫囑則以40～50分鐘為原則","治療過程中，應每30分鐘評估病人狀況","若需重複使用，應間隔30～60分鐘","告知病人，可以依自己的需求與感覺調整溫度"],"a":"C","k":"C","t":"","x":"冷熱療法若需重複使用，應間隔30～60分鐘，讓組織恢復，避免反彈現象與組織傷害。一般治療時間為20～30分鐘，超過易產生反彈現象；治療過程應每5～10分鐘評估皮膚狀況；溫度須由護理人員控制，不可讓病人自行調整，以免因溫度適應而燙傷或凍傷。"},{"i":"112-2|28","e":"112-2","n":28,"c":2,"s":"方先生，體溫39.5℃，依醫囑給予溫水拭浴。下列措施何者正確？","o":["頭放熱水袋、足部放冰枕，避免寒顫","以擦拭取代輕拍方式進行，散熱效果更佳","拭浴時，腋下、手心與腹股溝處須多停留數秒鐘","後頸、後背部和足部不擦拭"],"a":"C","k":"C","t":"","x":"溫水拭浴時應在腋下、肘窩、腹股溝、膕窩等大血管處多停留，以加速散熱。應頭部置冰枕、足部置熱水袋以減輕頭部充血並避免寒顫；拭浴採輕拍而非擦拭，避免摩擦產熱；應擦拭四肢及背部，避開前胸、腹部與後頸。"},{"i":"112-1|21","e":"112-1","n":21,"c":2,"s":"長時間局部用冷，易造成局部皮膚組織受損，其徵象不包含下列何者？","o":["出現汗珠","產生麻木感","產生僵硬感","疼痛感覺"],"a":"A","k":"A","t":"","x":"長時間局部用冷會使血管持續收縮、組織缺血，出現皮膚蒼白或發紺、麻木感、僵硬感及疼痛等組織受損徵象，嚴重時可能凍傷。出汗是用熱時血管擴張、散熱增加的反應，並非用冷造成的組織損傷徵象，故選A。"},{"i":"112-1|26","e":"112-1","n":26,"c":2,"s":"用冷會降低炎症過程的主要原理，下列何者正確？","o":["增加細胞代謝","增加微血管通透性","降低白血球數量和活動","減少血液黏稠度"],"a":"C","k":"C","t":"","x":"用冷會使血管收縮、血流減慢，降低白血球的數量與活動，並減緩細胞代謝，因而抑制炎症反應，故選C。增加細胞代謝與增加微血管通透性是用熱的作用；用冷會使血液黏稠度增加而非減少。"},{"i":"112-1|27","e":"112-1","n":27,"c":2,"s":"有關冷熱應用適應症，下列何者最適宜？","o":["靜脈炎適合用冷療","骨骼肌肉拉傷48小時後，應使用冷療","心臟手術時，應使用低溫療法促進其新陳代謝率","類風濕性關節炎急性期，應使用熱療"],"a":"A","k":"A","t":"","x":"靜脈炎可先使用冷敷以減輕局部疼痛與腫脹，故A為選項中最適宜者。肌肉拉傷48小時後應改用熱療；心臟手術使用低溫療法是為了降低新陳代謝率；類風濕性關節炎急性發炎期不宜用熱，以免加重發炎腫脹。"},{"i":"112-1|28","e":"112-1","n":28,"c":2,"s":"接受會陰切開術的產後婦女採坐浴，使用的溶液及其作用之敘述，下列何者正確？","o":["4% Hibiscrub（Chlorhexidine gluconate），具收斂作用","1：100水溶性優碘（beta-iodine），具消毒作用","1：40高錳酸鉀（P.P. solution）溶液，具消腫防腐作用","80%硫酸鎂溶液（MgSO4），具抑菌作用"],"a":"B","k":"B","t":"","x":"會陰切開術後的溫水坐浴可加入1：100水溶性優碘，以達消毒作用，並藉溫水促進局部循環、減輕腫痛，故B正確。Hibiscrub為消毒劑而非收斂劑；高錳酸鉀坐浴應稀釋至約1：5,000～1：10,000；硫酸鎂溶液主要用於消腫。"},{"i":"111-2|25","e":"111-2","n":25,"c":2,"s":"冷療可以抑制炎症反應的主要原理，下列何者正確？","o":["增加血流，將氧氣、抗體輸送至組織","增加微血管的通透性，促進代謝","增加心臟的輸出量，提高組織的延展度","增加血管收縮，減緩將白血球、淋巴球等送至組織"],"a":"D","k":"D","t":"","x":"冷療使血管收縮、血流減慢，減少白血球、淋巴球等送至組織，並降低細胞代謝，因而抑制發炎反應，故選D。增加血流、增加微血管通透性及促進代謝，皆屬用熱的作用。"},{"i":"111-2|26","e":"111-2","n":26,"c":2,"s":"有關常見的熱療法方式與目的之敘述，下列何者錯誤？","o":["溫水浸泡可促進燒傷病人焦痂的軟化","熱敷墊可以促進肌肉鬆弛減少下背痛","熱水袋可以促進循環，以減緩懷孕宮縮","烤燈可促進循環與乾燥，改善嬰兒紅臀"],"a":"C","k":"C","t":"","x":"懷孕宮縮時不宜在腹部使用熱水袋，用熱會促進子宮血流與收縮，無法減緩宮縮，故C錯誤。溫水浸泡可軟化焦痂；熱敷墊可放鬆肌肉減輕下背痛；烤燈可促進循環並使皮膚乾燥，改善嬰兒紅臀。"},{"i":"111-2|27","e":"111-2","n":27,"c":2,"s":"有關不宜使用熱療法的高危險情況與原因的理論依據，下列敘述何者正確？","o":["開放性傷口，因對溫度改變不敏感，且溫覺接受器增加，所以容易引起燙傷","局部惡性腫瘤，會促進血流增加，癌細胞獲得更多氧氣與養分，加速其轉移","頭部外傷，會降低血管的通透性，抑制血管與組織間液體的交換，導致腦水腫","末梢血管疾病，因循環及局部組織缺損，增加的熱能易於散發，易導致組織損傷"],"a":"B","k":"B","t":"","x":"局部惡性腫瘤處用熱會使血管擴張、血流增加，癌細胞獲得更多氧氣與養分，可能加速生長與轉移，故B正確。開放性傷口用熱易燙傷是因組織缺乏保護；頭部外傷用熱會增加血管通透性而加重腦水腫；末梢血管疾病是因循環差、熱能不易散發而易燙傷。"},{"i":"111-2|28","e":"111-2","n":28,"c":2,"s":"邱先生發高燒，體溫39℃，醫囑開立溫水拭浴使用，護理師為病人執行溫水拭浴時，水溫應該準備幾度？","o":["41～43℃","38～40℃","27～37℃","18～26℃"],"a":"C","k":"C","t":"","x":"溫水拭浴的水溫為27～37℃，以溫水輕拍四肢與背部，藉由傳導與蒸發散熱，大血管處多停留，30分鐘後再測量體溫，故選C。水溫過高無法降溫，過低則易引起寒顫反而增加產熱。"},{"i":"111-1|25","e":"111-1","n":25,"c":2,"s":"有關用熱治療所產生全身性反應的敘述，下列何者正確？①血壓上升 ②頭暈 ③呼吸變慢 ④脈搏加速","o":["①②","①③","②④","③④"],"a":"C","k":"C","t":"","x":"大範圍或全身用熱時，周邊血管擴張使血液分布至體表，可能導致血壓下降而出現頭暈；同時新陳代謝增加，使脈搏加快、呼吸加速，故選②④。血壓上升與呼吸變慢並非用熱的全身性反應。"},{"i":"111-1|26","e":"111-1","n":26,"c":2,"s":"病人沐浴後因寒顫而使用烤燈，下列何者正確？","o":["此法運用蒸發原理提供熱源","使用過程中，隨時保持皮膚濕潤","使用60 W燈泡，距離病人18～24吋","使用時間以15～20分鐘為宜"],"a":"D","k":"D","t":"","x":"烤燈屬乾熱療法，以輻射方式提供熱能，使用時間以15～20分鐘為宜，故D正確。使用時皮膚應保持乾燥以防燙傷；18～24吋（45～60公分）為40 W燈泡的距離，60 W燈泡應距離約24～30吋（60～75公分）。"},{"i":"111-1|27","e":"111-1","n":27,"c":2,"s":"針對冷敷應用的描述，下列何者錯誤？","o":["冰領常用在甲狀腺手術傷口，以傳導方式降溫促進止血","心臟手術使用低溫毯時，墊上絨布可增加冷的傳導效果","執行溫水拭浴時，為了避免腦部充血可於頭部置放冰枕","冰敷時不宜直接接觸皮膚，需要使用布類包裹後才使用"],"a":"B","k":"B","t":"","x":"使用低溫毯時，墊上絨布或床單是為了保護皮膚、避免凍傷，會減少而非增加冷的傳導，故B錯誤。冰領常用於甲狀腺或扁桃腺術後止血；溫水拭浴時頭部置冰枕可避免腦部充血；冰敷應以布類包裹，不直接接觸皮膚。"},{"i":"111-1|28","e":"111-1","n":28,"c":2,"s":"古先生，腳踝扭傷，護理師給予冷敷其腳踝。30 分鐘後，古先生主訴其肢體出現發紅的現象，此現象是屬於何種效應？","o":["反彈現象","溫度的適應性","遠處效應","交感性反應"],"a":"A","k":"A","t":"","x":"用冷持續過久（約30～60分鐘以上）時，局部血管會由收縮轉為擴張，出現皮膚發紅等現象，稱為反彈現象，故選A。溫度的適應性是指持續接觸冷熱後感覺變遲鈍；遠處效應與交感性反應是指非施用部位也產生反應。"},{"i":"110-2|30","e":"110-2","n":30,"c":2,"s":"有關冷熱效用的敘述，下列何者最適當？","o":["空氣的導熱力與滲透力高於水，故乾冷熱效果較好","冷接受器在皮膚淺層，故人體對冷刺激較為敏感","溼冷的效果比乾冷佳，使用濕冷時應較乾冷溫度低，以防凍傷","皮膚接觸冷熱時間越久，其對溫度的敏感性越高"],"a":"B","k":"B","t":"","x":"皮膚的冷接受器位置較淺、數量也較多，故人體對冷刺激較熱刺激敏感，B正確。水的導熱力與滲透力高於空氣，溼冷熱效果較乾冷熱強，因此使用溼冷時溫度應較乾冷高以防凍傷；接觸冷熱時間越久，皮膚會產生適應而敏感性下降。"},{"i":"110-2|31","e":"110-2","n":31,"c":2,"s":"鼻黏膜出血的病人，於前額冰敷以達止血的原理為何？","o":["收縮淺層皮膚血管使血液循環變慢","降低微血管通透性，抑制血管和組織間液體交換","提升「凝血因子」的活性，減緩血流速度","減少血流與組織淋巴液，降低細胞的新陳代謝"],"a":"A","k":"A","t":"","x":"鼻出血時於前額冰敷，是利用冷使淺層皮膚血管收縮、血流變慢，以達止血效果，故選A。降低微血管通透性主要用於減輕腫脹；冷並不會提升凝血因子活性；降低細胞新陳代謝則是用冷減少組織需氧與發炎的機轉。"},{"i":"110-2|32","e":"110-2","n":32,"c":2,"s":"產後會陰傷口使用烤燈之目的，下列何者錯誤？","o":["可促進傷口乾燥","可促進血管收縮","可減輕腫脹","可促進血液循環"],"a":"B","k":"B","t":"","x":"烤燈屬乾熱療法，可使血管擴張、促進血液循環，並使傷口乾燥、減輕腫脹與疼痛，因此產後會陰傷口常使用烤燈。烤燈會使血管擴張而非收縮，故B錯誤。"},{"i":"110-2|33","e":"110-2","n":33,"c":2,"s":"病人便秘、痔瘡凸出疼痛，下列冷熱處理方式，何者最適當？","o":["肛門處給予乾熱敷","於肛門處使用熱水袋","給予溫水坐浴","肛門處使用冷敷墊"],"a":"C","k":"C","t":"","x":"溫水坐浴可促進會陰及肛門部位血液循環、放鬆肛門括約肌，減輕痔瘡腫痛並有助排便與清潔，故最適當。肛門處不易以乾熱敷或熱水袋固定且有燙傷之虞；冷敷會使括約肌收縮，不利於便祕者排便。"},{"i":"110-1|23","e":"110-1","n":23,"c":2,"s":"局部用冷會產生那些生理現象？①減輕組織腫脹 ②鬆弛僵硬的組織 ③降低細胞新陳代謝 ④容易導致寒顫發生 ⑤減輕疼痛","o":["①③④","①③⑤","②③④","③④⑤"],"a":"B","k":"B","t":"","x":"局部用冷可使血管收縮、微血管通透性降低而減輕組織腫脹，降低細胞新陳代謝，並使神經傳導變慢而減輕疼痛，故選①③⑤。鬆弛僵硬組織是用熱的作用；寒顫多見於大範圍或全身性用冷，並非局部用冷的生理現象。"},{"i":"110-1|25","e":"110-1","n":25,"c":2,"s":"有關常見的用熱方式與治療目的之敘述，下列何者錯誤？","o":["石蠟浴的目的在協助類風濕性關節炎病人，作為關節疼痛與僵硬的物理治療","溫水浸泡可促進糖尿病人足部的血液循環","烤燈可應用於植皮供皮區，促進血液循環與傷口的癒合","熱水袋能安全地使用於老人和嬰幼兒，且不須考慮燙傷的問題"],"a":"D","k":"D","t":"","x":"老人與嬰幼兒對溫度的感受及耐受力較差，皮膚較薄，使用熱水袋更易發生燙傷，須特別注意水溫並加套、密切觀察，故D敘述錯誤。石蠟浴可緩解關節疼痛僵硬，溫水浸泡及烤燈可促進局部血液循環與傷口癒合。"},{"i":"110-1|29","e":"110-1","n":29,"c":2,"s":"下列何種情況下，病人適宜使用熱療？","o":["不明原因腹痛","持續出血","齒齦發炎","3天前腳踝扭傷"],"a":"D","k":"D","t":"","x":"扭傷24～48小時內應冷敷以減少出血腫脹，之後可改用熱敷促進循環與吸收，3天前扭傷適合用熱。不明原因腹痛用熱可能掩蓋病情或使發炎的闌尾破裂；持續出血用熱會加重出血；齒齦發炎用熱易促使化膿擴散。"},{"i":"110-1|30","e":"110-1","n":30,"c":2,"s":"溫水拭浴是同時運用下列那二種能量轉移方式，而達到降溫效果？①輻射 ②蒸發 ③傳導 ④對流","o":["①②","①④","②③","③④"],"a":"C","k":"C","t":"","x":"溫水拭浴以溫水接觸皮膚，藉傳導將熱移至水中，並利用皮膚上的水分蒸發帶走體熱而達到降溫效果，故為蒸發與傳導（②③）。輻射是體熱直接以電磁波散失，對流則依賴空氣或液體的流動。"},{"i":"109-2|8","e":"109-2","n":8,"c":2,"s":"有關使用熱水袋之敘述，下列何者正確？","o":["意識不清病人的適用溫度約為40.5～46.1℃","使用時間以一小時為宜","熱水袋貼放於皮膚後再放置橡皮治療巾，以減緩熱度散失","留少許空氣於熱水袋內，以減緩熱度散失"],"a":"A","k":"A","t":"","x":"意識不清、感覺障礙者及老人、嬰幼兒使用熱水袋時，水溫應降低為約40.5～46.1℃，以免燙傷。熱水袋使用時間約20～30分鐘；外層須加布套，不可直接接觸皮膚；灌水後應排出袋內空氣，以利熱傳導並避免袋子膨脹。"},{"i":"109-2|25","e":"109-2","n":25,"c":2,"s":"有關冷熱應用部位及其相對身體反射區域的組合，下列何者錯誤？","o":["四肢：腦","前額：鼻黏膜組織","胸後區：心臟","後腰部：腎"],"a":"C","k":"C","t":"","x":"在身體某部位應用冷熱，可經由反射作用影響相對應的器官，例如四肢對應腦部、前額對應鼻黏膜、後腰部對應腎臟。心臟的反射區位於胸前區，而非胸後區，故C錯誤。"},{"i":"109-2|26","e":"109-2","n":26,"c":2,"s":"小美到氣溫零下5℃（-5℃）的合歡山上賞雪超過1小時，臉部皮膚發紅，此現象稱為：","o":["反彈現象（rebound phenomenon）","適應現象（adaptation phenomenon）","交感性反應（consensual response）","持續性反應（consistant effect）"],"a":"A","k":"A","t":"","x":"長時間用冷超過一定時間（約1小時）後，局部血管會由收縮轉為擴張，使皮膚發紅，以防止組織缺血受損，稱為反彈現象。適應現象是指持續冷熱刺激後感受逐漸減弱；交感性反應是指一側用冷熱，另一側未接觸部位也出現類似反應。"},{"i":"109-2|28","e":"109-2","n":28,"c":2,"s":"人體對於用熱所產生的生理反應之敘述，下列何者正確？①減緩充血與腫脹 ②增加血液黏稠度 ③抑制炎症反應 ④增加淋巴流動與白血球機動性","o":["①②","③④","①④","②③"],"a":"C","k":"C","t":"","x":"用熱使血管擴張、促進循環，可加速組織液吸收而減緩充血與腫脹，並增加淋巴流動與白血球的活動性，有助於清除感染。用熱會降低血液黏稠度，且會促進而非抑制炎症反應（加速化膿），故②③錯。"},{"i":"109-1|24","e":"109-1","n":24,"c":2,"s":"下列何者不是執行熱療法的高危險族群？","o":["裝置心臟節律器患者","關節炎患者","脊髓損傷患者","糖尿病足部病變患者"],"a":"B","k":"B","t":"","x":"用熱的高危險族群包括感覺或循環功能障礙者，如脊髓損傷、糖尿病足部病變，以及裝置心臟節律器等體內金屬植入物者，易發生燙傷或干擾。關節炎患者用熱可促進循環、減輕僵硬與疼痛，是熱療的適用對象而非高危險族群。"},{"i":"108-2|3","e":"108-2","n":3,"c":2,"s":"臨床上常用的濕熱療法包括那些？①熱水袋 ②溫水坐浴 ③烤燈 ④石蠟浴 ⑤溫水浸泡","o":["①②④","①②⑤","②③④","②④⑤"],"a":"D","k":"D","t":"","x":"濕熱療法以水為傳熱媒介，包括溫水坐浴、石蠟浴、溫水浸泡及濕熱敷等。熱水袋與烤燈不以水直接接觸皮膚傳熱，屬於乾熱療法。"},{"i":"108-2|6","e":"108-2","n":6,"c":2,"s":"有關病人接受冷敷或熱敷，下列敘述何者正確？","o":["冷熱敷設備皆需直接與皮膚接觸，才能達到最大治療效果","冷敷用於疼痛處理，主要是可以鬆弛肌肉，減輕疼痛","熱敷用於疼痛處理，主要是可以降低炎症反應","使用於嬰幼兒或老年病人時，應特別小心"],"a":"D","k":"D","t":"","x":"嬰幼兒及老年人皮膚較薄、對溫度的感受與耐受力較差，使用冷熱療法時應特別小心，避免燙傷或凍傷。冷熱敷設備不可直接接觸皮膚，須以布套隔開；冷敷主要藉降低神經傳導、減輕腫脹來止痛，熱敷則是鬆弛肌肉止痛，並會加速炎症反應。"},{"i":"108-1|22","e":"108-1","n":22,"c":2,"s":"某婦女產後痔瘡疼痛，現有一醫囑「sitz bath bid」，下列措施何者錯誤？","o":["準備的水溫應為50℃","產婦的臀部應完全浸入水中","坐浴時間設定為20分鐘","向產婦解釋坐浴目的是促進血液循環與減輕局部充血"],"a":"A","k":"A","t":"","x":"溫水坐浴的水溫約為40～43℃，50℃過高易燙傷會陰部組織，故A錯。坐浴時臀部需完全浸入水中，時間約15～20分鐘，可促進局部血液循環、減輕充血與疼痛，適用於產後或痔瘡病人。"},{"i":"108-1|26","e":"108-1","n":26,"c":2,"s":"有關局部用熱所產生的生理反應，下列何者正確？①血管擴張，血流增加 ②增加血液黏稠性 ③使神經傳導變慢 ④減少肌肉張力 ⑤增加組織氧量 ⑥減輕疼痛","o":["①③④","①⑤⑥","②④⑤","③⑤⑥"],"a":"B","k":"B","t":"","x":"局部用熱使血管擴張、血流增加，因而增加組織的氧氣與養分供應，並可使肌肉放鬆、減輕疼痛。用熱會降低血液黏稠度、加快神經傳導，故②③錯；減少肌肉張力雖為用熱效果，但選項組合中僅①⑤⑥全部正確。"},{"i":"108-1|28","e":"108-1","n":28,"c":2,"s":"有關電熱墊使用注意事項，下列敘述何者正確？①一般使用中溫51.8～57.3˚C（125～135˚F），以免燙傷 ②使用前皮膚必須擦乾以免造成電擊休克 ③使用時應避免置於身體下而影響散熱 ④使用電熱墊時應以別針固定，以防絨布套滑脫而被燙傷","o":["①②","①④","②③","③④"],"a":"C","k":"C","t":"","x":"使用電熱墊前皮膚須擦乾，以免潮濕導電造成電擊；也應避免將電熱墊壓在身體下方，以免熱度無法散發而燙傷。電熱墊一般以低溫使用即可；絕不可用別針固定，以免刺破電線造成電擊，故①④錯。"},{"i":"108-1|29","e":"108-1","n":29,"c":2,"s":"有關影響冷熱效用因素的敘述，下列何者正確？","o":["空氣的傳導和滲透性較水為佳，故乾冷熱療法比濕冷熱療法在應用上效果較好","水的傳導和滲透性較空氣為佳，故濕冷熱較乾冷熱在運用上的危險性也較高","使用濕熱療法時，溫度應較乾熱為高","乾冷比濕冷所需的溫度為高"],"a":"B","k":"B","t":"","x":"水的傳導與穿透力比空氣佳，濕冷熱的效果較快、較強，但也較易造成燙傷或凍傷，危險性較高。因此濕熱所用溫度應比乾熱低，乾冷所需溫度則比濕冷低，A、C、D皆錯誤。"},{"i":"107-2|23","e":"107-2","n":23,"c":2,"s":"濕熱敷的應用比乾熱要更為小心，其理由下列何者錯誤？","o":["因水的傳導能力比空氣強，效果快速","因濕熱所用的溫度比乾熱高，才能達到相同效果","因水為良好導體，容易燙傷","因濕熱法比乾熱法對組織的傷害性更大"],"a":"B","k":"B","t":"","x":"水的傳導力比空氣強、穿透力佳，濕熱效果較快，但也較易燙傷、對組織傷害性較大，因此濕熱所用的溫度應比乾熱低，而非較高。A、C、D皆為濕熱需更謹慎使用的正確理由。"},{"i":"107-2|24","e":"107-2","n":24,"c":2,"s":"有關冷、熱敷之共同作用，下列何者正確？","o":["減緩充血和腫脹","減緩炎症反應","增加肌肉收縮力","增加基礎代謝率"],"a":"A","k":"A","t":"","x":"冷熱共同的作用是減輕充血與腫脹：冷使血管收縮、減少充血與水腫；熱使血管擴張促進循環與吸收，亦可減輕局部充血腫脹。冷可抑制發炎而熱會加速發炎化膿，冷降低代謝而熱增加代謝，兩者也都不會增加肌肉收縮力。"},{"i":"107-2|25","e":"107-2","n":25,"c":2,"s":"有關全身和局部用冷熱療法的敘述，下列何者正確？①冷熱應用面積越大，效果越好，耐受力也越佳 ②全身用熱則會使血管擴張血循改變，腦血流減少導致頭暈 ③全身用熱時間如果過長，就會產生交感反應，而讓血管擴張更加厲害 ④全身用冷熱的危險性較局部使用冷熱療法為大","o":["①②","①③","②④","③④"],"a":"C","k":"C","t":"","x":"全身用熱使周邊血管擴張，血液分布至體表，腦部血流相對減少而可能頭暈；全身用冷熱影響範圍廣，危險性大於局部使用。應用面積越大，耐受力反而越差，①錯；長時間用熱會產生反彈現象使血管收縮，而非擴張更厲害，③錯。"},{"i":"107-1|20","e":"107-1","n":20,"c":2,"s":"下列那一部位的不適症狀，可以用熱療法緩解其不適？","o":["腹痛而到急診室求診","牙髓發炎","下背部疼痛","鼻出血"],"a":"C","k":"C","t":"","x":"下背部疼痛多與肌肉緊張、痙攣有關，熱療可促進血液循環、使肌肉鬆弛而減輕疼痛，故選(C)。不明原因的腹痛（可能為闌尾炎）用熱可能使發炎擴散或破裂；牙髓發炎等急性化膿性發炎用熱會加重腫脹；鼻出血用熱會使血管擴張而加重出血。"},{"i":"107-1|23","e":"107-1","n":23,"c":2,"s":"李奶奶90歲，有中風的病史。因泌尿道感染住院治療，瘦弱，皮膚薄，常常四肢冰冷、忽冷忽熱，發燒時會有意識混亂的情形。有關病人之冷熱護理，下列何者較適當？","o":["發冷時熱水浸泡為較佳選擇","發高燒時給予酒精拭浴為佳","使用乾熱時，宜低於成人建議溫度5℃","持續於四肢放置熱水袋保暖"],"a":"C","k":"C","t":"","x":"老年人皮膚薄、感覺遲鈍且循環較差，對冷熱的耐受力低，使用乾熱時溫度宜低於成人建議溫度，以防燙傷，故選(C)。熱水浸泡屬大面積用熱，易使血管擴張而頭暈；酒精拭浴會刺激皮膚、使皮膚乾燥，老年人不宜；持續放置熱水袋易造成燙傷，應定時移除並評估皮膚。"},{"i":"107-1|24","e":"107-1","n":24,"c":2,"s":"為達冰敷最好療效，每次冰敷時間以多久為宜？","o":["5～10分鐘","20～30分鐘","40～50分鐘","1小時"],"a":"B","k":"B","t":"","x":"冰敷（冰枕）每次以20～30分鐘為宜，可達到止血、消腫、止痛的效果；若持續使用過久，會出現反彈現象，使血管反而擴張，故選(B)。如需長時間使用，應間隔30～60分鐘再使用。"},{"i":"107-1|25","e":"107-1","n":25,"c":2,"s":"頭部不宜直接使用熱療法的原因，下列何者正確？","o":["會降低微血管通透性，抑制血管和組織間液體的交換，造成腫脹","會使血循降低，使供給腦細胞氧氣和營養不足，而導致代謝速度變慢","會使頭部顱內壓上升，產生頭痛、噁心嘔吐、甚至引起腦充血","會降低破壞酶（destructive enzymes）的活性，增加對腦細胞的破壞"],"a":"C","k":"C","t":"","x":"頭部直接用熱會使頭部血管擴張、血流增加，導致顱內壓上升，出現頭痛、噁心嘔吐，甚至引起腦充血，故選(C)。降低微血管通透性、使血循降低、降低酶的活性皆為用冷的作用，與用熱無關。"},{"i":"106-2|22","e":"106-2","n":22,"c":2,"s":"護理師為病人的右手熱敷，其左手血管亦產生擴張現象，此現象稱為：","o":["交感性反應（consensual response）","適應現象（adaptation）","反彈現象（rebound phenomenon）","續發性反應（secondary effect）"],"a":"A","k":"A","t":"","x":"局部用熱或用冷時，對側未接受治療的相對應部位也會產生類似的血管反應，稱為交感性反應（consensual response），故右手熱敷而左手血管亦擴張，選(A)。適應現象是溫度接受器對持續刺激的反應減弱；反彈現象是冷熱使用過久時出現相反的反應。"},{"i":"106-2|25","e":"106-2","n":25,"c":2,"s":"有關乾冷或乾熱在人體應用上的敘述，下列何者正確？","o":["不會造成皮膚浸潤","可減少乾燥，軟化傷口滲出物","溫度容易受到蒸發現象的干擾","比濕熱法更容易造成燙傷，在使用時須小心"],"a":"A","k":"A","t":"","x":"乾冷、乾熱不接觸水分，不會造成皮膚浸潤，且不受蒸發影響，能維持溫度較久，故選(A)。可軟化傷口滲出物的是濕熱；溫度易受蒸發干擾的是濕冷、濕熱；濕熱因水的傳導性佳，比乾熱更容易造成燙傷。"},{"i":"106-2|26","e":"106-2","n":26,"c":2,"s":"鼻黏膜出血的病人，應於何處冰敷以達止血目的？","o":["鼻子","前額","前頸","臉頰二側"],"a":"B","k":"B","t":"","x":"鼻黏膜出血時，可讓病人頭稍前傾並捏住鼻翼，同時於前額（及鼻樑）冰敷，藉冷刺激使血管反射性收縮而達止血效果，故選(B)。"},{"i":"106-2|27","e":"106-2","n":27,"c":2,"s":"扭傷48小時後，使用熱敷的主要目的，下列何者正確？","o":["使血液黏稠度增加，促進血液凝固","促進血液循環，減輕充血腫脹","降低微血管通透性，使液體進入組織速度減緩，減輕炎症反應","降低神經傳導速度，減輕疼痛"],"a":"B","k":"B","t":"","x":"扭傷48小時後出血已停止，此時熱敷可使血管擴張、促進血液循環，加速腫脹吸收並減輕充血，故選(B)。增加血液黏稠度、降低微血管通透性減輕炎症反應、降低神經傳導速度減輕疼痛，皆為用冷的作用。"},{"i":"106-2|28","e":"106-2","n":28,"c":2,"s":"有關溫水坐浴治療之敘述，下列何者錯誤？","o":["若為清潔用途，則水溫溫度應選擇介於37.8˚C～40.5˚C","協助病人採舒適坐姿，且肛門及會陰須完全浸於溶液中","若醫囑無特殊要求，一般坐浴時間為15～20分鐘","坐浴當中若病人感到頭暈，可保持足部低於心臟"],"a":"D","k":"D","t":"","x":"溫水坐浴屬大面積用熱，會使骨盆腔及下肢血管擴張，若病人感到頭暈，表示腦部血流不足，應立即停止坐浴，協助病人躺下休息，而非讓足部保持低於心臟，故(D)錯誤。清潔用途水溫約37.8～40.5℃，肛門及會陰須完全浸於溶液中，一般坐浴時間為15～20分鐘。"},{"i":"106-1|23","e":"106-1","n":23,"c":2,"s":"外出旅遊泡溫泉時，易出現頭暈等不舒服症狀之原因為何？①排汗增加，血壓上升 ②體溫增加，散熱增加 ③血管擴張 ④肌肉鬆弛 ⑤頭部血流減少","o":["①③","②⑤","③④","③⑤"],"a":"D","k":"D","t":"","x":"泡溫泉屬大面積全身用熱，會使周邊血管擴張（③），血液大量積聚於周邊，回心血量及頭部血流減少（⑤），血壓下降而出現頭暈，故選③⑤。排汗增加會使血壓下降而非上升；散熱增加與肌肉鬆弛並非造成頭暈的主要原因。"},{"i":"106-1|27","e":"106-1","n":27,"c":2,"s":"有關冷熱應用部位的敘述，下列何者錯誤？","o":["手掌相較於頸部，對冷熱的耐受力較低","血液循環好的部位，對於冷熱應用效果較好","皮膚深層對熱比對冷之反應更為敏感","冷熱應用面積越大，效果越佳"],"a":"A","k":"A","t":"","x":"手掌皮膚角質層較厚、溫度接受器較少，對冷熱的耐受力較高；頸部、前臂內側等皮膚較薄處對冷熱較敏感、耐受力較低，故(A)錯誤。血液循環好的部位效果較佳；冷熱應用面積越大，效果越明顯，但全身反應也越大。"},{"i":"105-2|2","e":"105-2","n":2,"c":2,"s":"使用熱水袋時，下列那個溫度較為適宜？","o":["30℃","50℃","70℃","100℃"],"a":"B","k":"B","t":"","x":"熱水袋一般成人適宜水溫約46～52℃，50℃最為適宜，故選(B)。30℃溫度過低達不到熱療效果；70℃與100℃溫度過高，易造成燙傷。"},{"i":"105-2|24","e":"105-2","n":24,"c":2,"s":"下列何者不適合局部冷療法？","o":["靜脈炎","扭傷初期","流鼻血","開放性傷口"],"a":"D","k":"D","t":"","x":"開放性傷口局部用冷會使血管收縮、組織血流與養分供應減少，延緩傷口癒合，故不適合使用冷療，選(D)。扭傷初期、流鼻血可用冷止血、消腫；靜脈炎早期亦可局部冷敷減輕腫痛。"},{"i":"105-2|27","e":"105-2","n":27,"c":2,"s":"7個月嬰兒有紅臀時，下列何者為較佳的熱療法？","o":["熱水袋","烤燈","電熱毯","化學劑加熱包"],"a":"B","k":"B","t":"","x":"烤燈為乾熱，利用輻射熱使局部乾燥、促進血液循環，適用於紅臀或會陰部，且不需直接接觸皮膚，故選(B)。熱水袋、電熱毯及化學加熱包直接接觸嬰兒皮膚，嬰兒皮膚薄嫩且無法表達不適，易造成燙傷。"},{"i":"105-1|29","e":"105-1","n":29,"c":2,"s":"右腳踝扭傷有明顯腫脹情形時，下列護理指導何者正確？①扭傷處 1～2 天內先熱敷，待 1～2 天後再給予冷敷 ②扭傷處 1～2 天內先冷敷，待 1～2 天後再給予熱敷 ③熱敷止痛原理與藉由熱麻痺末梢局部神經而減緩疼痛有關 ④冷敷止痛原理與降低神經傳導速度而減緩疼痛有關","o":["①③","①④","②③","②④"],"a":"D","k":"D","t":"","x":"扭傷24～48小時內應先冷敷，使血管收縮、減少出血與腫脹，之後再熱敷促進循環以吸收腫脹，故②正確；冷能降低神經傳導速度而減輕疼痛，④正確。熱敷止痛是藉促進血液循環、移除代謝產物及使肌肉鬆弛，麻痺末梢神經是冷的作用，故③錯誤。"},{"i":"105-1|30","e":"105-1","n":30,"c":2,"s":"有關冷熱療法優、缺點之敘述，下列何者正確？①乾冷、乾熱不會受蒸發的影響，能保持溫度較久 ②乾冷、乾熱較容易造成凍傷與燙傷 ③濕冷、濕熱深入組織層，穿透力效果佳 ④濕冷、濕熱較容易導致體液流失","o":["①②","①③","②④","③④"],"a":"B","k":"B","t":"","x":"乾冷、乾熱不受蒸發影響，溫度可維持較久（①）；濕冷、濕熱因水的傳導性佳，穿透力較強（③），故選①③。濕冷、濕熱因傳導性佳，反而較容易造成凍傷或燙傷；乾熱易使皮膚出汗、水分散失，較容易導致體液流失，故②④錯誤。"},{"i":"104-2|22","e":"104-2","n":22,"c":2,"s":"王先生因鼻黏膜出血使用冰敷，1小時之後發現鼻黏膜的微血管反而有擴張的現象，此現象稱為：","o":["溫度接受器的適應","交感神經反應","用冷的禁忌","反彈反應"],"a":"D","k":"D","t":"","x":"冰敷超過最大治療效應時間後，原本收縮的血管反而擴張，此為反彈反應，故用冷需注意時間並間歇使用。溫度接受器適應是對溫度感覺變遲鈍；交感反應是指身體他處出現相同效應。"},{"i":"104-2|23","e":"104-2","n":23,"c":2,"s":"下列那些因素會影響身體對冷熱的感受度？①身體部位的敏感度 ②用冷或用熱範圍的大小 ③心情的好壞 ④身高的差異 ⑤皮膚是否受損","o":["①②④","①②⑤","②③④","③④⑤"],"a":"B","k":"B","t":"","x":"影響冷熱耐受性的因素包括身體部位（皮膚薄處較敏感）、應用範圍大小（範圍越大耐受性越低）、皮膚完整性（受損處較敏感）、年齡、個人耐受力及應用時間等，故①②⑤正確。心情好壞與身高並非主要影響因素。"},{"i":"104-2|24","e":"104-2","n":24,"c":2,"s":"有關溫水坐浴治療原理的敘述，下列何者錯誤？","o":["可鬆弛骨盆肌肉減輕充血、痙攣和疼痛（如痔瘡）","促進肛門會陰區的血液循環，有助於傷口癒合","可收縮膀胱括約肌，對尿瀦留個案可刺激排尿","清潔肛門會陰區，預防傷口感染"],"a":"C","k":"C","t":"","x":"溫水坐浴的熱可使肌肉及括約肌放鬆，對尿瀦留者是藉放鬆尿道括約肌以促進排尿，而非使膀胱括約肌收縮，故C錯誤。溫水坐浴可鬆弛骨盆肌肉減輕痔瘡疼痛、促進會陰部血循幫助傷口癒合並清潔會陰。"},{"i":"104-2|27","e":"104-2","n":27,"c":2,"s":"人體對於用冷所產生的生理反應，下列敘述何者正確？①血液黏稠度增加 ②刺激副交感神經，產生雞皮疙瘩 ③血管收縮，血壓上升 ④淋巴流動與白血球機動性增加","o":["①②","①③","②④","③④"],"a":"B","k":"B","t":"","x":"用冷會使血管收縮、周邊阻力增加而血壓上升，並使血液黏稠度增加、血流變慢，故①③正確。雞皮疙瘩是交感神經興奮所致；用冷會使淋巴流動與白血球活動性降低，增加是用熱的作用。"},{"i":"104-1|28","e":"104-1","n":28,"c":2,"s":"陳先生行痔瘡切除術後，醫囑溫水坐浴，下列敘述何者正確？","o":["促進血液循環水溫為37.8～40℃","可以刺激排尿與促進肌肉鬆弛","可以刺激腸蠕動","坐浴時間愈長效果愈好"],"a":"B","k":"B","t":"","x":"溫水坐浴可放鬆尿道及肛門括約肌、促進骨盆會陰部肌肉鬆弛與血液循環，有助刺激排尿並減輕痔瘡術後的疼痛。坐浴水溫約40.5～43℃，時間約15～20分鐘，並非越久越好；其主要作用不在刺激腸蠕動。"},{"i":"104-1|29","e":"104-1","n":29,"c":2,"s":"有關冰敷產生的反彈現象，下列敘述何者正確？","o":["皮膚在接觸冷熱時，溫度接受器會在數秒內適應新的溫度之現象","冷熱法除直接應用的部位會有生理改變外，身體其他部位也會產生同樣效應","身體遇冷時，身體嘗試維持其核心溫度的反應","超過冷熱應用最大治療效應的時間後，所產生之相反的反應"],"a":"D","k":"D","t":"","x":"反彈現象是指冷熱應用超過產生最大治療效應的時間後，身體出現相反的反應，例如冰敷過久使原本收縮的血管反而擴張。A為溫度接受器的適應，B為交感反應，C為身體維持核心溫度的調節反應。"},{"i":"104-1|30","e":"104-1","n":30,"c":2,"s":"頭部外傷的病人，不宜用冷療法的原因，下列何者正確？","o":["會增加微血管通透性，產生腫脹，引起不適","會使血管緊縮，阻礙血循，腦細胞氧氣和養分會減少，加重病情","會促進細胞新陳代謝速率加快，使得腦部需氧量增加，引起不適","會使頭部顱內壓上升，產生頭痛、噁心嘔吐、甚至引起腦充血，造成危險"],"a":"B","k":"B","t":"","x":"頭部外傷病人頭部用冷會使血管收縮，阻礙腦部血液循環，使腦細胞獲得的氧氣與養分減少而加重病情。用冷會降低而非增加微血管通透性與代謝速率，選項A、C、D的機轉皆不正確。"},{"i":"104-1|31","e":"104-1","n":31,"c":2,"s":"有關烤燈使用，下列敘述何者正確？①運用輻射原理提供輻射熱以促血循 ②適用於植皮受皮區 ③小烤燈（40瓦）須距離皮膚25～30吋 ④使用烤燈前須清潔皮膚並擦乾以防燙傷","o":["①②","①④","②③","③④"],"a":"B","k":"B","t":"","x":"烤燈運用輻射原理提供輻射熱以促進血液循環；使用前須清潔皮膚並擦乾，以免水分或藥膏導熱造成燙傷，故①④正確。植皮受皮區感覺及循環不佳，不宜使用烤燈；40瓦小烤燈距離約18～24吋，25～30吋為60瓦大烤燈的距離。"},{"i":"103-2|23","e":"103-2","n":23,"c":2,"s":"有關協助病患使用烤燈的相關事項，下列敘述何者正確？","o":["25W烤燈與照射部位的安全距離為16吋","烤燈的使用時間需持續30分鐘","烤燈適用於昏迷的低體溫病患","烤燈的作用是利用蒸發的原理"],"a":"A","k":"A","t":"","x":"烤燈利用輻射熱促進血液循環，瓦數越大距離應越遠，25W小烤燈與照射部位距離約14～18吋，16吋屬安全範圍。使用時間一般為20～30分鐘並需隨時觀察；昏迷、感覺障礙者易燙傷，不宜使用；其原理為輻射而非蒸發。"},{"i":"103-2|24","e":"103-2","n":24,"c":2,"s":"當肢體末端接受濕冷敷時，皮膚顏色不會出現何種變化？","o":["膚色變成蒼白","膚色發紅","膚色發黑","膚色變成藍紫色"],"a":"C","k":"C","t":"","x":"用冷時血管收縮使皮膚蒼白，之後可能因反彈現象出現發紅；若循環受阻則呈藍紫色（發紺），需停止用冷。膚色發黑代表組織壞死，並非濕冷敷過程中會出現的正常膚色變化。"},{"i":"103-1|24","e":"103-1","n":24,"c":2,"s":"使用冷療法的過程中，護理師評估病人的皮膚出現下列那一個現象，不需先暫停治療？","o":["青紫","疼痛","麻木","皺褶"],"a":"D","k":"D","t":"","x":"用冷時若皮膚出現青紫、斑點、疼痛或麻木，表示組織缺血或凍傷的危險，應立即暫停用冷。皮膚因接觸濕冷敷而出現皺褶屬常見現象，不代表組織傷害，不需暫停治療。"},{"i":"103-1|31","e":"103-1","n":31,"c":2,"s":"當因運動傷害造成肌肉拉傷時，用冷的目的為何？","o":["降低微血管通透性，減輕水腫","增加氧氣的供應並移除組織廢物","增進白血球和吞噬細胞的活性","增加神經傳導，促進肌肉放鬆"],"a":"A","k":"A","t":"","x":"運動傷害急性期（24～48小時內）用冷，可使血管收縮、降低微血管通透性，減少組織液滲出而減輕水腫與出血，並降低神經傳導減輕疼痛。增加氧氣供應、增進白血球活性與促進肌肉放鬆則是用熱的作用。"},{"i":"102-2|19","e":"102-2","n":19,"c":2,"s":"某護理師因運動扭傷踝關節，立即採用冰敷患部，此時冰敷主要作用機轉為：","o":["降低血小板凝集之作用","降低微血管之通透性","增加吞噬細胞之作用","增加感覺神經傳導"],"a":"B","k":"B","t":"","x":"扭傷24～48小時內應冰敷，冷可使血管收縮、降低微血管通透性，減少組織液滲出而減輕腫脹與出血，同時降低神經傳導以減輕疼痛。用冷會降低吞噬細胞活性與感覺神經傳導，並非增加。"},{"i":"102-2|33","e":"102-2","n":33,"c":2,"s":"人體對冷熱較為敏感的部位為何？①頸部 ②手掌 ③手腕內側 ④前臂內側 ⑤腳底 ⑥會陰部位","o":["①②③⑤","①③④⑥","②③④⑥","③④⑤⑥"],"a":"B","k":"B","t":"","x":"皮膚較薄或神經末梢較多的部位，如頸部、手腕內側、前臂內側及會陰部，對冷熱較敏感；手掌與腳底角質層厚，對溫度較不敏感，故選①③④⑥。"},{"i":"102-1|23","e":"102-1","n":23,"c":2,"s":"溫水坐浴適用於下列何種情況？①經痛時，用以鬆弛骨盆肌肉與減輕痙攣 ②痔瘡疼痛時，用以促進血液循環與減輕疼痛 ③發燒超過 39℃時，用以促進排汗降低體溫 ④尿瀦留時，用以鬆弛膀胱括約肌，促進排尿 ⑤坐骨神經痛時，用以減輕發炎與疼痛","o":["①②④","①③⑤","②③⑤","②④⑤"],"a":"A","k":"A","t":"","x":"溫水坐浴可鬆弛骨盆肌肉、減輕經痛時的痙攣（①），促進痔瘡部位血液循環並減輕疼痛（②），並可放鬆尿道括約肌以促進排尿（④）。發燒時降溫應採溫水拭浴等全身用冷，而非坐浴；坐骨神經痛的發炎與疼痛並非溫水坐浴的適應症，故③⑤錯誤。"},{"i":"102-1|24","e":"102-1","n":24,"c":2,"s":"有關冷、熱療法之應用，下列敘述何者正確？①全身用熱的目的主要可促進化膿與組織癒合 ②使用冰枕若未將袋內空氣排出，會影響溫度的傳導，妨礙治療的效果 ③痔瘡病人可採冷水浸泡方式，減輕局部疼痛與充血 ④一般經痛可先以熱敷方式減輕疼痛","o":["①②","①③","②④","③④"],"a":"C","k":"C","t":"","x":"冰枕若未排出袋內空氣，空氣導熱性差會妨礙冷的傳導，影響治療效果（②）；一般經痛可熱敷下腹部，鬆弛平滑肌、減輕痙攣疼痛（④）。全身用熱主要目的為保暖或促進循環，局部用熱才用於促進化膿；痔瘡病人宜採溫水坐浴而非冷水浸泡，故①③錯誤。"},{"i":"102-1|25","e":"102-1","n":25,"c":2,"s":"進行溫水坐浴的過程中，若病人感到眩暈不適，下列處置何者最適宜？","o":["安撫病人，向其說明這是正常現象","此為缺氧現象，教導病人進行深呼吸","可能因坐浴溶液的溫度太高，需添加冷水以降低溫度","協助病人身體前傾，使頭部低於心臟"],"a":"D","k":"D","t":"","x":"溫水坐浴時骨盆腔血管擴張，血液積聚於下半身，使腦部血流減少而出現眩暈，應立即協助病人身體前傾、使頭部低於心臟，增加腦部血流，必要時停止坐浴。眩暈並非正常現象，也不是缺氧所致；單純加冷水降溫無法立即改善腦部缺血。"},{"i":"101-2|23","e":"101-2","n":23,"c":2,"s":"李先生因痔瘡入院接受手術，術後依醫囑執行溫水坐浴，下列敘述何者正確？","o":["使用浴缸注滿無菌水全身浸泡","治療溫度應維持於40.5-43℃，以促進血液循環","治療藥物可使用石蠟油和礦物油，以1：1比例調合使用","使用時間應至少維持1小時，才有治療效果"],"a":"B","k":"B","t":"","x":"痔瘡術後溫水坐浴的主要目的是促進局部血液循環、清潔傷口並減輕疼痛，以促進循環為目的時水溫宜維持在40.5～43℃。坐浴只需浸泡臀部與會陰部，不需全身浸泡；一般以溫水或醫囑溶液進行，不用石蠟油或礦物油；每次約15～20分鐘，時間過長易使血管過度擴張而產生反彈作用。"},{"i":"101-2|24","e":"101-2","n":24,"c":2,"s":"有關冷、熱療法的共同功能，下列敘述何者正確？","o":["抑制炎症反應","止血消腫","促進新陳代謝","緩解疼痛"],"a":"D","k":"D","t":"","x":"用冷可降低神經傳導速度、減輕腫脹壓迫，用熱可放鬆肌肉、減輕痙攣與充血，兩者皆能緩解疼痛。抑制炎症反應、止血消腫是用冷的作用；促進新陳代謝則是用熱的作用，皆非兩者共同的功能。"},{"i":"101-2|34","e":"101-2","n":34,"c":2,"s":"有關冷、熱的生理反應，下列敘述何者正確？①冷、熱覺的傳遞，皆藉由外側脊髓視丘徑傳至下視丘 ②熱覺接受器之數目多於冷覺接受器 ③極冷或極熱刺激會引發脊髓反射作用 ④四肢皮膚對熱覺的反應比對冷覺敏感","o":["①②","①③","②④","③④"],"a":"B","k":"B","t":"","x":"冷、熱覺的神經衝動皆經由外側脊髓視丘徑傳至下視丘及大腦皮質（①）；極冷或極熱的強烈刺激會引發脊髓反射，使肢體迅速縮回以保護身體（③）。皮膚的冷覺接受器數目多於熱覺接受器，因此皮膚對冷覺較敏感，故②④錯誤。"},{"i":"101-1|18","e":"101-1","n":18,"c":2,"s":"趙女士自然產後，入住病房時，主訴發冷寒顫，醫囑開立給予烤燈使用，下列敘述何者錯誤？","o":["需先清潔趙女士的身體並擦乾","每2~5分鐘檢查趙女士的皮膚反應","使用40 W燈泡，距離趙女士18~24吋","照射到趙女士說不冷為止"],"a":"D","k":"D","t":"","x":"使用烤燈時應每2～5分鐘檢查皮膚反應，使用40 W燈泡時燈距約18～24吋，照射前清潔擦乾皮膚以防燙傷；每次照射時間一般為20～30分鐘，不可照射到病人說不冷為止，以免時間過久造成燙傷或反彈作用，故(D)錯誤。"},{"i":"101-1|19","e":"101-1","n":19,"c":2,"s":"（情境：趙女士自然產後，入住病房時，主訴發冷寒顫。）醫囑開立溫水坐浴，下列那種溶液最適合趙女士使用？","o":["溫開水","10-50%硫酸鎂溶液（MgSO4）","1:400高錳酸鉀溶液（P.P. solution）","1:100水溶性優碘（β-iodine）"],"a":"D","k":"D","t":"","x":"產後會陰傷口坐浴的主要目的是清潔傷口、預防感染並促進癒合，常使用具消毒作用的1:100水溶性優碘溶液。溫開水缺乏消毒效果；硫酸鎂溶液多用於濕敷消腫；高錳酸鉀溶液常用濃度約1:4,000～1:8,000，1:400濃度過高，易刺激皮膚黏膜。"},{"i":"101-1|20","e":"101-1","n":20,"c":2,"s":"（情境：趙女士自然產後，入住病房時，主訴發冷寒顫。）下列何者為趙女士使用溫水坐浴的最主要目的？","o":["減輕肌肉痙攣","促進傷口癒合","促進排泄","升高體溫"],"a":"B","k":"B","t":"","x":"產婦會陰部有傷口，溫水坐浴可清潔會陰、促進局部血液循環，最主要的目的是促進傷口癒合並減輕疼痛。減輕肌肉痙攣、促進排泄並非產後坐浴的主要目的；坐浴屬局部用熱，也不是用來升高體溫。"},{"i":"100-2|20","e":"100-2","n":20,"c":2,"s":"病人因點滴輸液滲漏，使用黃藥水敷於患處之方式，下列何者正確？","o":["乾冷敷","濕冷敷","乾熱敷","濕熱敷"],"a":"B","k":"B","t":"","x":"黃藥水（Rivanol）敷於點滴滲漏處，是以紗布浸潤藥液後濕敷於患部，常溫藥液敷於皮膚可藉蒸發與傳導達到降溫、消腫效果，屬於濕冷敷。乾冷敷是使用冰枕、冰囊等不接觸水分的方式；熱敷會使血管擴張，不適用於急性滲漏腫脹。"},{"i":"100-2|21","e":"100-2","n":21,"c":2,"s":"有關腳踝扭傷的護理，下列何者正確？","o":["受傷24~48小時內應冷敷，以促進肌肉鬆弛，減輕疼痛","受傷48小時後應熱敷，以減輕炎症反應","可立即使用毛巾裝碎冰，直接在患部進行濕冷敷","可使用烤燈，直接對著傷處進行熱療"],"a":"C","k":"C","t":"","x":"腳踝扭傷屬急性損傷，應立即冷敷，可用毛巾包碎冰敷於患部，使血管收縮以減少出血與腫脹並減輕疼痛。受傷24～48小時內冷敷的作用是減輕腫脹、出血與疼痛，而非促進肌肉鬆弛；48小時後熱敷是為了促進血液循環與吸收，而非減輕炎症；急性期不可使用烤燈熱療。"},{"i":"100-2|22","e":"100-2","n":22,"c":2,"s":"有關不宜用熱的情況，下列何者正確？","o":["女性經痛熱敷下腹部","糖尿病人足部使用溫水泡腳","腦血管疾病病人頭部置放熱水袋","痔瘡術後使用溫水坐浴"],"a":"C","k":"C","t":"","x":"頭部用熱會使腦血管擴張、腦部血流量增加，可能使腦血管疾病病人的顱內壓上升或加重出血，故不宜在頭部放置熱水袋。經痛熱敷下腹部可減輕痙攣疼痛，痔瘡術後溫水坐浴可清潔並減輕疼痛；糖尿病人泡腳雖須注意水溫以防燙傷，但並非禁止。"},{"i":"100-2|23","e":"100-2","n":23,"c":2,"s":"有關用冷的敘述，下列何者正確？","o":["溫水拭浴是一種冷療法","用冷時間愈久，組織對冷覺的敏感度愈好","對於減輕組織腫脹或充血的成效不佳","冰塊直接置於皮膚上不可超過5分鐘"],"a":"A","k":"A","t":"","x":"溫水拭浴是利用略低於體溫的溫水（27～37℃）擦拭皮膚，藉傳導與蒸發散熱降低體溫，屬於濕冷的全身冷療法。用冷時間愈久，組織對冷的敏感度反而愈差；用冷可使血管收縮，有效減輕組織腫脹與充血；冰塊不宜直接置於皮膚上，需以布包裹。"},{"i":"100-2|24","e":"100-2","n":24,"c":2,"s":"有關身體對於局部熱敷所產生的反應，下列敘述何者正確？①減輕組織炎症反應 ②增加微血管通透性 ③增加白血球活動性 ④減輕組織水腫","o":["①②③","①②④","①③④","②③④"],"a":"D","k":"D","t":"","x":"局部熱敷會使血管擴張、微血管通透性增加（②），血流量增加使白血球活動性與吞噬作用增加（③），並促進組織液的吸收，減輕組織水腫（④）。熱敷會加速炎症反應的進行以促進化膿與吸收，而非減輕炎症反應，故①錯誤。"},{"i":"100-1|5","e":"100-1","n":5,"c":2,"s":"用熱療法時，身體會出現下列那些反應？①心臟負擔減少 ②神經傳導速度變慢 ③血液黏稠度降低 ④組織代謝增加","o":["①②","①③","②④","③④"],"a":"D","k":"D","t":"","x":"用熱會使局部血管擴張、血流增加，血液黏稠度降低，並使組織新陳代謝增加（③④）。用熱時神經傳導速度會加快而非變慢；全身大範圍用熱時周邊血管擴張、心跳加快，反而會增加心臟負擔，故①②錯誤。"},{"i":"100-1|8","e":"100-1","n":8,"c":2,"s":"王先生接受痔瘡切除術，有關術後溫水坐浴的護理，下列何者正確？","o":["使用溫水坐浴的目的是為了促進排尿與減輕疼痛","溫水坐浴的範圍應含蓋腰至大腿中段，皆須沒入溫水中","常使用的溶液為1：100 Beta-Iodine","為促進血液循環的目的，其水溫應比以清潔為目的之水溫稍高"],"a":"D","k":"D","t":"","x":"溫水坐浴依目的不同水溫不同，以促進血液循環、減輕充血疼痛為目的時，水溫應較以清潔為目的時稍高。痔瘡術後坐浴主要是清潔傷口、減輕疼痛及促進循環，而非促進排尿；浸泡範圍為臀部及會陰部，不需由腰至大腿中段；一般使用溫水即可，不需常規使用1:100 Beta-Iodine。"},{"i":"100-1|25","e":"100-1","n":25,"c":2,"s":"有關術後第一天傷口的照顧，下列敘述何者正確？","o":["禁止熱敷，因術後傷口感覺功能受損，容易燙傷","必須熱敷，因術後傷口循環功能不良，熱敷可促進傷口癒合","禁止熱敷，因可能增加出血與傷口腫脹","必須熱敷，可促進傷口排膿，並有止痛的效果"],"a":"C","k":"C","t":"","x":"手術後24～48小時內的傷口處於急性期，用熱會使血管擴張、血流增加，可能加重出血與傷口腫脹，因此術後第一天禁止熱敷，故(C)正確。禁止熱敷的主因並非感覺功能受損，而熱敷促進循環與癒合的效果適用於急性期過後。"},{"i":"100-1|78","e":"100-1","n":78,"c":2,"s":"個案在使用熱敷過程中，表示熱敷處劇烈疼痛時，下列何項處置最適當？","o":["告知時間還沒到，須做完療程","先暫時移除熱敷用物","以冰敷代替熱敷","立刻給予止痛藥服用"],"a":"B","k":"B","t":"","x":"熱敷過程中病人主訴劇烈疼痛，可能已造成燙傷或組織傷害，應立即暫停並移除熱敷用物，再評估皮膚狀況並通知醫師。不可要求病人忍耐做完療程，也不可未經評估就改為冰敷或直接給予止痛藥。"},{"i":"115-2|4","e":"115-2","n":4,"c":3,"s":"利用化學製劑進行物件消毒時，需遵守下列那些原則？①一次只能浸泡一種物件②器械浸泡前需先洗乾淨③中空的管腔需完全充滿消毒液④濃度愈高，滅菌效果愈好","o":["②③","①④","③④","①②"],"a":"A","k":"A","t":"","x":"化學消毒前器械須先洗淨，去除有機物，中空管腔也要完全充滿消毒液，消毒液才能充分接觸物品（②③）。可同時浸泡多件物品，只要完全浸沒即可；消毒劑濃度並非愈高愈好，例如75%酒精的效果優於95%。"},{"i":"115-2|46","e":"115-2","n":46,"c":3,"s":"下列何種疾病不是透過病媒傳染？","o":["腮腺炎","登革熱","日本腦炎","斑疹傷寒"],"a":"A","k":"A","t":"","x":"腮腺炎由病毒經飛沫及直接接觸唾液傳染，不需要病媒。登革熱、日本腦炎經蚊子傳播，斑疹傷寒經蚤、蝨等病媒傳播，都屬於病媒傳染。"},{"i":"115-1|4","e":"115-1","n":4,"c":3,"s":"有關外科無菌之敘述，下列何者正確？","o":["是指一系列清潔的技術","是將非無菌的物件侷限在清潔區域內","避免微生物由一處傳播到另一處","應用於術後第一天傷口換藥時"],"a":"D","k":"D","t":"","x":"外科無菌技術是保持滅菌物品或無菌區域於無菌狀態的技術，用於侵入性治療、外傷處理及傷口換藥，例如術後第一天換藥。清潔技術、將微生物侷限在特定區域、避免微生物由一處傳到另一處，都是內科無菌技術的概念。"},{"i":"115-1|33","e":"115-1","n":33,"c":3,"s":"病人因上呼吸道傳染性疾病住院，出院後其病室之終期消毒方式，下列敘述何者正確？","o":["以0.5%的來舒（lysol）擦拭病房物品表面","沾有分泌物的地板以0.01%的漂白水清洗","床褥及枕頭送洗前以紫外線燈照射60分鐘","病室及用物清理前應以紫外線燈照射15分鐘"],"a":"C","k":"C","t":"","x":"終期消毒時，床褥、枕頭等厚重不易清洗的物品，可於送洗前以紫外線燈照射（正反面各約30分鐘，共約60分鐘）或日光曝曬消毒，故C為官方答案。A：來舒擦拭環境物品表面，教科書多建議較高濃度（約2～3%），0.5%濃度偏低；B：沾有分泌物的地板需用較高濃度漂白水（約0.5%），0.01%濃度不足；D：紫外線穿透力差，不能取代清潔，應先清潔消毒，照射15分鐘亦不足。"},{"i":"114-3|1","e":"114-3","n":1,"c":3,"s":"有關隔離措施，下列敘述何者最適當？","o":["化學治療病人應採接觸傳染防護措施","疥瘡的病人應採保護性隔離措施","骨髓移植病人應採接觸傳染防護措施","肺結核病人應採空氣傳染防護措施"],"a":"D","k":"D","t":"","x":"肺結核經空氣（飛沫核）傳染，應採空氣傳染防護措施，安置於負壓隔離病房，照護者戴N95口罩。化學治療與骨髓移植病人免疫力低下，應採保護性隔離；疥瘡經直接接觸傳染，應採接觸傳染防護措施。"},{"i":"114-2|1","e":"114-2","n":1,"c":3,"s":"有關內科與外科無菌技術的敘述，下列何者正確？","o":["內科無菌洗手法需於沖水時，雙手手指尖朝下，且須低於肘部","內科無菌技術通常應用在侵入性的治療，例如：放置導尿管","外科無菌技術又稱清潔技術，將致病微生物侷限在一特定區域","戴手套取代洗手，為最快速且方便的預防感染方法"],"a":"A","k":"A","t":"","x":"內科無菌洗手沖水時，雙手指尖朝下、手部低於肘部，使污水由較清潔的前臂往指尖流下並沖離。侵入性治療如放置導尿管須用外科無菌技術（B錯）；「清潔技術」是內科無菌技術的別稱，將微生物侷限在特定區域也是內科無菌技術（C錯）；戴手套不能取代洗手（D錯）。"},{"i":"114-2|4","e":"114-2","n":4,"c":3,"s":"有關化學消毒劑應用的敘述，下列何者正確？","o":["2% Chlorhexidine消毒時需搭配0.9%生理食鹽水","95%酒精濃度高於75%酒精，因此消毒效果更佳","10%碘酒（tincture iodine）通常用於消毒破皮傷口，如：壓傷傷口","3%雙氧水可以去除氣管內管的血漬、濃痰或軟化痂皮"],"a":"D","k":"D","t":"","x":"3%雙氧水接觸組織後會釋放氧氣、產生氣泡，可去除血漬、濃痰並軟化痂皮，常用於清潔氣管內管等。2% Chlorhexidine消毒後等待約30秒乾燥即可，不需搭配生理食鹽水；75%酒精較易穿透菌體使蛋白質凝固，消毒效果優於95%酒精；碘酒刺激性強，不可用於破皮傷口。"},{"i":"114-2|33","e":"114-2","n":33,"c":3,"s":"傳染性病人出院後，病人單位的終期消毒（terminal disinfection）方式，下列何者正確？","o":["應以紫外線燈照射15分鐘後再執行清潔","病人衣物及各類布單應放入白色透明塑膠袋","有血跡、分泌物之牆壁或地板應以漂白水清洗擦拭","布單類、不鏽鋼容器先清洗晾乾，再高壓蒸氣滅菌"],"a":"C","k":"C","t":"","x":"終期消毒時，被血跡或分泌物污染的牆壁、地板，應先以漂白水消毒再清潔擦拭。紫外線穿透力差，無法取代清潔（A錯）；傳染性病人的衣物布單應放入有標示的感染性污衣袋，不是一般透明塑膠袋（B錯）；污染物品應先消毒再清洗，先清洗會散播病原（D錯）。"},{"i":"114-2|39","e":"114-2","n":39,"c":3,"s":"有關醫院一般病室清潔原則，下列敘述何者最適當？","o":["病床及床旁以清水擦拭","使用過的被服應使用71℃以上高溫清洗25分鐘","髒抹布和拖把先抖動後再沾濕清潔","清洗順序從最大污染區至最小污染區"],"a":"B","k":"B","t":"","x":"使用過的被服應以71℃以上高溫清洗至少25分鐘，才能有效殺滅大部分病原菌。病床及床旁應以稀釋漂白水等消毒劑擦拭，不只用清水（A錯）；抖動髒抹布、拖把會使塵埃與病原散播（C錯）；清潔順序應由污染最小區往污染最大區進行（D錯）。"},{"i":"114-2|46","e":"114-2","n":46,"c":3,"s":"手部衛生指引原則，下列敘述何者最不適當？","o":["戴手套不能取代手部衛生，脫下後仍應洗手","雙手沾染血液或體液後，可使用酒精性乾洗手液洗手","指甲尖端長度應維持不超過0.5 cm","接觸病人周遭環境後須執行洗手"],"a":"B","k":"B","t":"","x":"雙手有明顯髒污，或沾染血液、體液時，應以肥皂和水濕洗手；酒精性乾洗手液只適用於手部沒有明顯髒污的情況，故B最不適當。戴手套不能取代手部衛生；指甲應修短，尖端不超過0.5 cm；接觸病人周遭環境後屬洗手五時機之一。"},{"i":"114-1|2","e":"114-1","n":2,"c":3,"s":"有關內科無菌技術的敘述，下列何者正確？","o":["為避免交互感染，可以戴手套來取代洗手","高於肘部的刷手為一種內科無菌技術","綁帶式外科口罩上下兩條帶子均需繫上，須同時蓋住口、鼻部","指執行侵入性治療時，保持滅菌物品或無菌區域無菌狀態的技術"],"a":"C","k":"C","t":"","x":"外科口罩為綁帶式時，上下兩條帶子都要繫好，並完整遮住口、鼻，才能有效防護飛沫。戴手套不能取代洗手（A錯）；刷手高於肘部屬外科刷手（B錯）；D所述「保持滅菌物品或無菌區域無菌狀態」是外科無菌技術的定義（D錯）。"},{"i":"113-3|3","e":"113-3","n":3,"c":3,"s":"清除醫院環境中可能孳養微生物的體液、分泌物或溶液等，以降低微生物傳播機會，下列那項措施不適當？","o":["瓶裝溶液應註記開封日期，生理食鹽水應每7天更換","當傷口的敷料滲濕或污染時，應立即更換敷料","檢查各種引流管是否通暢及功能正常","當病人需長期使用氧氣，潮濕瓶應定期更換"],"a":"A","k":"A","t":"","x":"開封後的瓶裝溶液（如生理食鹽水）應註明開封日期與時間，一般開封後24小時內使用，逾時即丟棄，每7天才更換易孳生微生物，故A不適當。敷料滲濕應立即更換、引流管保持通暢、長期使用的氧氣潮濕瓶定期更換，都能降低微生物孳生與傳播。"},{"i":"113-3|32","e":"113-3","n":32,"c":3,"s":"針對傳染病病房於病人出院後的處理方式，下列敘述何者正確？","o":["護理師處理時應採隔離技術，穿戴口罩、手套及隔離衣","有血跡的牆面及地板應以0.02%的次氯酸鈉清洗","病人使用過的鋼製彎盆以0.5%的來舒（lysol）進行消毒","太空被及枕頭應放入黑色塑膠袋中隔絕空氣至少48小時"],"a":"A","k":"A","t":"","x":"傳染病病人出院後的終期消毒，處理人員應依疾病傳染途徑採隔離技術並穿戴口罩、手套、隔離衣等防護裝備。牆面、地板有血跡等大量血液污染時應使用較高濃度（約0.5%）的次氯酸鈉；鋼製彎盆應以高壓蒸氣滅菌；被褥、枕頭應依感染性物品處理消毒，不是僅以黑色塑膠袋隔絕空氣。"},{"i":"113-3|40","e":"113-3","n":40,"c":3,"s":"有關病房放置導管或腰椎穿刺時，應有的防護裝備，下列何者正確？","o":["手套、口罩、腳套、髮帽","手套、口罩、護目鏡、髮帽","手套、口罩、隔離衣、腳套","手套、口罩、隔離衣、護目鏡"],"a":"D","k":"D","t":"","x":"放置導管、腰椎穿刺等侵入性處置可能接觸病人血液、體液並有噴濺風險，依標準防護應戴手套、口罩、穿隔離衣並配戴護目鏡（或面罩）。腳套與髮帽並非一般病房侵入性處置的必要防護用具。"},{"i":"113-2|3","e":"113-2","n":3,"c":3,"s":"手術室刷手的操作，應符合那些標準？①內科無菌 ②外科無菌 ③手應高舉至肩上 ④掌部應高於肘部","o":["①③","①④","②③","②④"],"a":"D","k":"D","t":"","x":"手術室刷手屬外科無菌技術，刷洗及沖水時應保持手掌高於手肘，讓水由清潔的手部流向手肘，避免污染。內科無菌洗手時手應低於手肘；刷手後雙手應保持在腰部以上、肩部以下的視線範圍內，不可高舉過肩。"},{"i":"113-1|2","e":"113-1","n":2,"c":3,"s":"王先生因登革熱入院，下列敘述何者正確？","o":["此疾病傳染途徑為共通媒介物傳播","使用蚊帳，是為阻斷傳染途徑","處理居家環境積水，是為阻斷進入宿主的入口","照護病人採用外科無菌技術，是為阻斷傳染窩"],"a":"B","k":"B","t":"","x":"登革熱是由病媒蚊（埃及斑蚊、白線斑蚊）叮咬傳播，使用蚊帳可避免被叮咬，屬阻斷傳染途徑。其傳染途徑為病媒傳播而非共通媒介物；清除積水是消除病媒孳生源；照護登革熱病人採標準防護即可，外科無菌技術亦非阻斷傳染窩的方法。"},{"i":"112-3|1","e":"112-3","n":1,"c":3,"s":"下列何種情形最符合照護相關感染（healthcare-associated infection, HAI）的定義？","o":["肝癌病人接受肝動脈栓塞術後隔日出現體溫上升的情形","出生48小時內被診斷感染B型肝炎的新生兒","剖腹產的新生兒出生後第5天發生臍帶感染","服用類固醇藥物後發生帶狀疱疹而入院治療的病人"],"a":"C","k":"C","t":"","x":"醫療照護相關感染指入院時未發生、也不在潛伏期，於住院或接受醫療照護期間得到的感染。剖腹產新生兒出生第5天才發生臍帶感染，屬住院期間獲得的感染。肝動脈栓塞術後發燒多為栓塞後症候群而非感染；出生48小時內診斷的B型肝炎多為垂直感染；類固醇引發的帶狀疱疹於入院時已存在。"},{"i":"112-3|2","e":"112-3","n":2,"c":3,"s":"有關消毒劑的敘述，下列何者正確？","o":["化學消毒劑的濃度越高，消毒效果越好，例如95%酒精殺菌效果優於75%酒精","優碘是碘性化合物，可以用來消毒傷口，能有效殺死所有黴菌、病毒與芽孢","來紓（Lysol）是酚類化合物，一般用來對醫院環境的消毒，例如地板、家具等","黃藥水（Rivanol）可以用於靜脈炎局部冷敷，及濕敷在開放性傷口以防止感染"],"a":"C","k":"C","t":"","x":"來舒（Lysol）屬酚類化合物，常用於醫院地板、家具等環境消毒。75%酒精含水可使蛋白質凝固較完全，殺菌力優於95%酒精；優碘為中程度消毒劑，無法殺死所有芽孢；黃藥水（Rivanol）用於傷口濕敷，不適用於靜脈炎冷敷。"},{"i":"112-2|3","e":"112-2","n":3,"c":3,"s":"臨床上常用物理或化學方式來殺滅病毒、致病微生物的芽孢與繁殖體，達完全無菌狀態的方式稱為下列何者？","o":["消毒（disinfection）","隔離（isolation）","清潔（clean）","滅菌（sterilization）"],"a":"D","k":"D","t":"","x":"滅菌是以物理或化學方法殺滅所有微生物，包括細菌芽孢，達到完全無菌狀態。消毒僅能殺死病原體繁殖體，無法殺死所有芽孢；隔離是阻斷傳染途徑的措施；清潔則只是去除物品表面的污垢與有機物。"},{"i":"112-2|4","e":"112-2","n":4,"c":3,"s":"醫院中最常使用戊乙醛（Cidex）消毒劑來消毒那些物品或設備？","o":["醫院地板及浴廁","橡皮導管及內視鏡","病床旁桌及床上桌","病人之分泌物及排泄物"],"a":"B","k":"B","t":"","x":"活化戊二醛（Cidex）屬高程度消毒劑，對金屬及橡膠不具腐蝕性，常用於不耐高溫的內視鏡、橡皮導管等器械的消毒。地板、浴廁及床旁桌屬一般環境，以含氯消毒劑或清潔劑處理即可；分泌物、排泄物多以含氯消毒劑處理。"},{"i":"112-2|5","e":"112-2","n":5,"c":3,"s":"有關穿脫隔離衣之敘述，下列何者正確？①脫除隔離衣時，應將污染區包裹在裡面送洗 ②隔離衣須覆蓋至手腕、膝蓋為佳 ③脫隔離衣時，只能持拿外面，以維持裡面乾淨 ④脫下隔離衣後應該立即洗手","o":["①②③","①③④","②③④","①②④"],"a":"D","k":"D","t":"","x":"脫隔離衣時應將污染的外面向內捲包後送洗，隔離衣須完整覆蓋工作服至手腕及膝蓋，脫下後須立即洗手，故①②④正確。脫隔離衣時手只能接觸隔離衣的內面（清潔面），不可再碰觸外面（污染面），故③錯誤。"},{"i":"112-2|66","e":"112-2","n":66,"c":3,"s":"有關「嚴重特殊傳染性肺炎」的主要傳染途徑，下列何者正確？","o":["空氣或飛沫傳染","病媒傳染","食物或飲水傳染","接觸傳染"],"a":"A","k":"A","t":"","x":"嚴重特殊傳染性肺炎（COVID-19）主要經由飛沫傳播，在特定情境（如密閉空間、產生氣霧的處置）亦可經空氣（微粒）傳播，故防護以口罩及呼吸道防護為主。其並非經病媒蚊蟲、食物飲水傳播，接觸受污染物品雖可能但非主要途徑。"},{"i":"112-1|3","e":"112-1","n":3,"c":3,"s":"下列何者屬於空氣傳染疾病？","o":["淋病","小兒麻痺","百日咳","開放性肺結核"],"a":"D","k":"D","t":"","x":"開放性肺結核經由空氣中的飛沫核傳播，屬空氣傳染疾病，應安置於負壓隔離病房並配戴N95口罩，故選D。淋病經性接觸傳染；小兒麻痺主要經糞口途徑傳染；百日咳以飛沫傳染為主。"},{"i":"112-1|5","e":"112-1","n":5,"c":3,"s":"訪客進出醫院時，使用75%酒精洗手，此管制感染源的方法為下列何者？","o":["清潔","消毒","滅菌","無菌"],"a":"B","k":"B","t":"","x":"消毒是以物理或化學方法殺死物體上大部分的病原微生物，但不包括芽孢；以75%酒精洗手可殺死手上大部分微生物，屬於消毒，故選B。清潔僅是去除污垢與部分微生物；滅菌則能殺死包括芽孢在內的所有微生物。"},{"i":"111-2|4","e":"111-2","n":4,"c":3,"s":"有關感染控制措施，下列敘述何者錯誤？","o":["絕對嗜中性白血球500個/mm3以下的病人，應採保護性隔離","疥瘡的病人，應採接觸性隔離","德國麻疹的病人，應採飛沫隔離","水痘感染的病人，應採接觸性隔離但無須單獨房間"],"a":"D","k":"D","t":"","x":"水痘經由空氣（及接觸）傳染，應採空氣隔離並安置於單獨的負壓隔離病房，故D錯誤。嗜中性白血球過低者應採保護性隔離；疥瘡採接觸隔離；德國麻疹以飛沫傳染，應採飛沫隔離。"},{"i":"111-2|5","e":"111-2","n":5,"c":3,"s":"有關執行導尿技術時，下列何者違反無菌原則？","o":["注意導尿包滅菌的有效日期","導尿管置於無菌區域邊緣1吋以內","消毒會陰後的棉棒應放置於無菌區外的垃圾袋","消毒會陰部後，可於無菌區執行抽取無菌蒸餾水的動作"],"a":"D","k":"D","t":"","x":"打開導尿包、消毒會陰部後，手套已接觸會陰而不再無菌，若再於無菌區執行抽取蒸餾水的動作，會污染無菌區，故D違反無菌原則。使用前應確認滅菌有效期限；使用過的消毒棉棒應丟於無菌區外。另依無菌原則，無菌區邊緣約2.5公分（1吋）以內視為污染區，無菌物品不宜置於此範圍，故B的敘述亦有違反無菌原則之疑慮，惟官方答案為D。"},{"i":"111-1|4","e":"111-1","n":4,"c":3,"s":"有關外科無菌的定義，下列敘述何者正確？","o":["屬於清潔的技術之一","可以處理病人與病人間的交互感染","用來確保無菌物品維持在無菌狀態","常運用在傳染病人的隔離防治"],"a":"C","k":"C","t":"","x":"外科無菌技術是保持滅菌物品或無菌區域於無菌狀態的技術，用於侵入性治療、傷口處理及手術，故C正確。屬於清潔技術、用以避免病人間交互感染及傳染病人隔離防治者，皆為內科無菌技術。"},{"i":"111-1|5","e":"111-1","n":5,"c":3,"s":"關於滅菌法之敘述，下列何者正確？","o":["高壓滅菌法屬於物理滅菌法，使用條件為每平方吋壓力10～12磅，達到90～110℃的水蒸氣","2%戊二醛（Cidex）或6～10%過氧化氫（H2O2）可以適用於內視鏡或呼吸治療器材的消毒","濕熱滅菌法較乾熱滅菌法傳導效果差，故使用的溫度需較高才能達到滅菌效果","紫外線消毒法穿透力佳，可以有效殺滅細菌芽胞，屬於物理滅菌方式"],"a":"B","k":"B","t":"","x":"2%活化戊二醛（Cidex）或過氧化氫可用於內視鏡、呼吸治療器材等不耐熱器械的消毒與滅菌，故B正確。高壓蒸氣滅菌約需15～17磅/平方吋、121℃以上；濕熱穿透力優於乾熱，乾熱才需較高溫；紫外線穿透力差，屬消毒法而非滅菌法。"},{"i":"111-1|6","e":"111-1","n":6,"c":3,"s":"下列何者不屬於內科無菌的技術？","o":["洗手","傷口換藥","戴口罩","隔離技術"],"a":"B","k":"B","t":"","x":"內科無菌技術是將微生物侷限在特定區域的清潔技術，項目包括洗手、戴口罩與手套、穿隔離衣及隔離技術。傷口換藥屬於侵入性的外傷處理，須以外科無菌技術執行，故選B。"},{"i":"110-2|1","e":"110-2","n":1,"c":3,"s":"有關煮沸消毒法的敘述，下列何者正確？","o":["水量須蓋過消毒物品且與消毒物品等高","消毒時間是自打開爐火後開始計算","沸水中加入2%的碳酸鈉可增加消毒作用","玻璃類以煮沸3～5分鐘為原則"],"a":"C","k":"C","t":"","x":"煮沸消毒時在沸水中加入2%碳酸鈉，可提高沸點、增強殺菌力並防止金屬生鏽，故C正確。水量須高於物品約2.5～5公分以上而非等高；消毒時間應自水沸騰後開始計算；玻璃類宜冷水時放入，並煮沸10分鐘以上。"},{"i":"110-2|52","e":"110-2","n":52,"c":3,"s":"接觸性隔離病人出院後，其病人單位與用物的處理，下列何者正確？","o":["病人服放於塑膠袋內，袋外註明床號、傳染類別，再丟入於一般污衣桶內","枕頭先以塑膠袋包裹，袋外註明床號、傳染類別，送高壓蒸氣消毒","病床應先以紫外線照射30分鐘後，再以消毒液擦拭清理","點滴幫浦，應先以95%酒精擦拭，吹晾8小時後才能再使用"],"a":"C","k":"C","t":"","x":"接觸性隔離病人出院後須執行終期消毒，病人單位可先以紫外線照射後，再以消毒液擦拭清理，故C最適當。病人服應裝入感染性污衣袋並標示，不可丟入一般污衣桶；枕頭與點滴幫浦應依材質選擇適當的消毒方式，不宜以高壓蒸氣或95%酒精處理。"},{"i":"110-2|69","e":"110-2","n":69,"c":3,"s":"下列那一項疾病不是藉由空氣傳染？","o":["腦膜炎","肺結核","水痘","流行性感冒"],"a":"A","k":"A","t":"","x":"腦膜炎（如流行性腦脊髓膜炎）主要經由飛沫傳染，不屬於空氣傳染，故選A。肺結核、水痘為典型空氣傳染疾病，應採空氣隔離並配戴N95口罩；流行性感冒以飛沫傳染為主，亦可能經由氣溶膠傳播。"},{"i":"110-1|8","e":"110-1","n":8,"c":3,"s":"下列何項護理措施，需採外科無菌原則？①胃造瘻灌食 ②氣管內插管抽痰 ③結腸造瘻灌洗 ④胰島素注射","o":["①②","②③","②④","③④"],"a":"C","k":"C","t":"","x":"外科無菌技術用於侵入性治療，如注射、導尿、抽痰等，氣管內插管抽痰及胰島素注射皆須以外科無菌執行，故選②④。胃造瘻灌食與結腸造瘻灌洗是經消化道進行的處置，採內科無菌（清潔技術）即可。"},{"i":"109-2|2","e":"109-2","n":2,"c":3,"s":"有關巴斯德消毒法之敘述，下列何者正確？","o":["常用在牛奶、果汁飲品的消毒","以62℃加熱15分鐘，可達高層次消毒","無法殺死真菌類微生物","屬於一種生物抑菌劑消毒法"],"a":"A","k":"A","t":"","x":"巴斯德消毒法屬物理消毒法中的低溫消毒法，以較低溫度（如62.8℃加熱30分鐘或72℃加熱15秒）殺死致病菌，又不破壞食物風味與營養，常用於牛奶、果汁等飲品。它無法殺死芽孢，只達低層次消毒，也不是生物抑菌劑消毒法。"},{"i":"109-2|3","e":"109-2","n":3,"c":3,"s":"照護H5N1流感病毒感染的病人時，在穿戴各項個人防護措施時，下列何者錯誤？","o":["脫下隔離衣時，領口被視為清潔區","隔離衣要重複使用時，掛置時污染面應朝外","護目設備須於前室中脫除","外科手術口罩應每8小時更換一次"],"a":"D","k":"D","t":"","x":"口罩若潮濕、髒污或受污染應立即更換，並非固定每8小時才更換，故D錯；照護H5N1等高傳染性病人也應選用N95等級口罩。脫隔離衣時衣領為較清潔處；隔離衣若需重複使用而掛於病室內，應污染面朝外；護目設備可於前室脫除。"},{"i":"109-2|4","e":"109-2","n":4,"c":3,"s":"有關化學消毒法之敘述，下列何者錯誤？","o":["70～75%的酒精殺菌效果比95%酒精效果好","5.25%的漂白水對肝炎病毒的消毒無效","化學消毒劑時間越長殺菌程度越高","每升高10℃化學消毒劑殺菌度增加一倍"],"a":"B","k":"B","t":"","x":"5.25%漂白水（次氯酸鈉）屬含氯消毒劑，可有效殺死肝炎病毒，常用於處理血液、體液污染，故B錯。70～75%酒精含適量水分，較易滲入菌體使蛋白質凝固，效果比95%好；化學消毒劑作用時間越長、溫度越高，殺菌效果越好。"},{"i":"108-2|1","e":"108-2","n":1,"c":3,"s":"下列何者不適用高壓蒸氣滅菌？","o":["布類","塑膠類","手術器械","水溶性溶液"],"a":"B","k":"B","t":"","x":"高壓蒸氣滅菌利用高溫、高壓的飽和蒸氣殺死包括芽孢在內的微生物，適用於布類、手術器械等耐高溫、耐濕的物品。塑膠製品、油脂及石蠟油不耐高溫或蒸氣無法穿透，不適用高壓蒸氣滅菌，塑膠類可改用E.O. gas或電漿滅菌。"},{"i":"108-1|1","e":"108-1","n":1,"c":3,"s":"林小姐，56 歲，近日因全身痠痛、頭痛、咳嗽及發燒，疑似新型流行性感冒，醫師建議住院治療，護理人員首先應提供的衛生教育為下列何者？","o":["安排入住負壓隔離病房","請病人不要和鄰床聊天說話，以免交互感染","晚間9點以後，限制家屬再進病房探訪","請病人勤洗手並戴口罩，以避免感染傳播"],"a":"D","k":"D","t":"","x":"流行性感冒主要經飛沫及接觸傳染，病人應勤洗手並戴上外科口罩，以阻斷傳染途徑、避免傳播給他人。負壓隔離病房用於空氣傳染疾病（如開放性肺結核）；限制與鄰床說話或限制家屬探訪時間，並非首要的衛生教育。"},{"i":"108-1|2","e":"108-1","n":2,"c":3,"s":"（情境：林小姐，56歲，近日因全身痠痛、頭痛、咳嗽及發燒，疑似新型流行性感冒，住院治療）林小姐呼吸喘、咳嗽加劇，經胸腔 X 光顯示右下葉肺炎及肋膜積水，施行胸腔放液穿刺術合併胸管留置，當您協助更換病人胸管傷口敷料時，下列措施何者正確？","o":["無菌容器打開後，先將蓋子置放於桌面上備用，無需蓋回，以免手忙腳亂污染無菌區域","拆開無菌敷料，以手指抓出敷料角落，離無菌區域10～15公分處放入無菌容器內","戴上無菌手套後的雙手應保持在膝蓋以上、視線範圍以內","非無菌物品應遠離無菌區至少1～2吋"],"a":"D","k":"D","t":"","x":"非無菌物品應與無菌區保持至少1～2吋距離，以免污染無菌區。無菌容器的蓋子打開後應內面朝上放置或拿在手上，用畢立即蓋回；拆開無菌敷料應翻開包裝讓敷料落入，不可以手指抓取；戴無菌手套的雙手應保持在腰部以上、視線範圍內。"},{"i":"108-1|5","e":"108-1","n":5,"c":3,"s":"下列何種製劑可以達到高程度消毒，消滅微生物的繁殖體，包括芽孢？","o":["10%碘酒（tincture iodine）","3%來舒（lysol）","2%戊二醛（cidex）","70%酒精（alcohol）"],"a":"C","k":"C","t":"","x":"2%戊二醛（Cidex®）可使微生物蛋白質烷基化而凝固變性，浸泡3～10小時可殺死包括芽孢在內的所有微生物，達滅菌程度，適用於內視鏡等不耐熱器械。碘酒、來舒及70%酒精均無法殺死芽孢，屬中、低程度消毒劑。"},{"i":"108-1|8","e":"108-1","n":8,"c":3,"s":"對於傷口培養有抗二甲氧基苯青黴素性之金黃色葡萄球菌（Methicillin-Resistant Staphylococcus Aureus, MRSA）之病人，其隔離措施之敘述，下列何者正確？","o":["安排居住單人負壓病房","照護人員需要戴過濾式口罩","照護人員需要穿戴手套、隔離衣","照顧病人之次序，以此病人為優先"],"a":"C","k":"C","t":"","x":"MRSA主要經由接觸傳染，應採接觸隔離，照護人員接觸病人或其環境時需穿戴手套與隔離衣，並落實手部衛生。負壓病房與N95等過濾式口罩用於空氣傳染疾病；照護順序應將隔離病人排在最後，以免將病菌帶給其他病人。"},{"i":"108-1|11","e":"108-1","n":11,"c":3,"s":"（情境：余先生，感染肺結核，住院治療）余先生出院後，病房該如何消毒？","o":["應以紫外線燈照射30分鐘後，再開始清理","使用過的布單應直接丟置污衣桶內，勿接觸地板","如有血跡，應以0.6% lysol擦拭","病床消毒完後，建議空置24小時後再鋪床"],"a":"A","k":"A","t":"","x":"肺結核為空氣傳染疾病，病人出院後應執行終期消毒，可先以紫外線燈照射約30分鐘殺菌後再開始清理。使用過的布單應放入感染性污衣袋密封送洗；有血跡時應先以漂白水（含氯消毒劑）處理再清潔；消毒完成即可鋪床，不需空置24小時。"},{"i":"108-1|70","e":"108-1","n":70,"c":3,"s":"下列那一項疾病不是藉由媒介物傳染？","o":["霍亂","痢疾","水痘","傷寒"],"a":"C","k":"C","t":"","x":"霍亂、痢疾、傷寒屬於經由共同媒介物（受污染的飲水、食物）傳染的腸道傳染病。水痘主要經由空氣、飛沫及直接接觸水泡液傳染，不是藉由媒介物傳染。"},{"i":"107-2|1","e":"107-2","n":1,"c":3,"s":"外科無菌技術中，打開無菌包時的敘述，下列何者正確？","o":["無菌包外的消毒指示帶須沒有變色，且於有效日期內方可使用","打開無菌包的第一角要朝向自己","打開包布時，手只能接觸包布四角的外面","若無菌包內尚有敷料，則按原步驟包好並將綁帶打結可於下次再使用"],"a":"C","k":"C","t":"","x":"打開無菌包時，手只能接觸包布四角的外面，以免污染內面無菌區。包外化學指示帶須已由白色變為黑色才表示滅菌合格，A錯；打開時第一角應朝向遠側，避免手臂跨越無菌區，B錯；已打開的無菌包未用完不可再包好留待下次使用，D錯。"},{"i":"107-2|2","e":"107-2","n":2,"c":3,"s":"有關使用無菌敷料鉗之敘述，下列何者正確？","o":["手握敷料鉗中段1/2處","保持敷料鉗朝上","夾取無菌棉球後，在距離無菌區3公分高度小心放入","用畢時，夾緊鉗尖垂直放入泡鑷罐中"],"a":"D","k":"D","t":"","x":"敷料鉗用畢應夾緊鉗尖、垂直放回泡鑷罐，避免鉗尖碰觸罐口而污染。使用時應手握上1/3處，鉗尖須始終朝下，以免消毒液逆流至手握處再流回鉗尖；夾取物品應在無菌區上方約10～15公分處放入，3公分過低易碰觸污染。"},{"i":"107-2|4","e":"107-2","n":4,"c":3,"s":"有關內科無菌洗手原則之敘述，下列何者正確？","o":["依序為手指尖→大拇指虎口→掌對掌→掌對背→十指縫→指背對指掌","肥皂清水洗手，每一部位至少搓洗5～10次，過程至少40～60秒","沖水時指尖朝上，使水由指尖、手掌向下流","乾洗手的時間與肥皂清水洗手完全相同"],"a":"B","k":"B","t":"","x":"濕洗手時每一步驟應搓洗5～10次，全程至少40～60秒，才能有效去除暫時性細菌。洗手步驟依「內、外、夾、弓、大、立、腕」，A順序錯誤；沖水時指尖應朝下，使水由手腕往指尖流，C錯；乾洗手時間約20～30秒，與濕洗手不同，D錯。"},{"i":"107-2|7","e":"107-2","n":7,"c":3,"s":"護理師照顧後天免疫缺乏症候群病人預期可能接觸到血液時，不須採用下列何項隔離防護措施？","o":["洗手","單獨房間","手套","口罩"],"a":"B","k":"B","t":"","x":"照護愛滋病人採標準防護措施，預期接觸血液時應洗手、戴手套，有噴濺風險時戴口罩等防護用具。愛滋病經血液、體液傳染，並非空氣或飛沫傳染，因此不須安排單獨房間隔離。"},{"i":"107-1|1","e":"107-1","n":1,"c":3,"s":"洗手是避免交叉感染的重要防護措施，有關洗手的敘述，下列何者錯誤？","o":["清洗至手腕上2吋","每一個部位至少搓洗10次","內科無菌洗手法於沖水時，保持手掌高於手肘，讓水流由手指流至手腕","外科無菌洗手法於沖水時，將手指指尖朝上，讓水流由指尖沖洗至手肘"],"a":"C","k":"C","t":"","x":"內科無菌洗手沖水時應保持手指朝下、手部低於手肘，讓水由手腕流向指尖，將污物沖離；外科無菌洗手才是指尖朝上，讓水由指尖流向手肘，故(C)錯誤。洗手應清洗至手腕上2吋，每個部位至少搓洗10次。"},{"i":"107-1|2","e":"107-1","n":2,"c":3,"s":"醫院內所爆發的院內感染中，最常見的致病菌種為何？","o":["金黃色葡萄球菌與綠膿桿菌","白色念珠菌與大腸桿菌","大腸桿菌與肉毒桿菌","肺炎雙球菌與痢疾桿菌"],"a":"A","k":"A","t":"","x":"醫院內爆發院內感染最常見的致病菌為金黃色葡萄球菌與綠膿桿菌，兩者多來自病人以外的環境、醫護人員或醫療用品（外生性），故選(A)。大腸桿菌、念珠菌多為病人自身的內生性菌種；肉毒桿菌、痢疾桿菌多與食物或社區感染有關。"},{"i":"107-1|3","e":"107-1","n":3,"c":3,"s":"有關院內感染之敘述，下列何者錯誤？","o":["病人手術後若傷口發炎或化膿，都考慮為院內感染","靜脈導管部位如有化膿，須行細菌培養才能確定是否為院內感染","病人在入院後出院前就已潛伏，而出院後才出現症狀的感染亦屬院內感染","院內感染大多發生在病人住院72小時以後"],"a":"B","k":"B","t":"","x":"醫療照護相關感染可依臨床發現（如膿液滲出）、檢驗報告、醫師診斷及影像檢查等判斷，靜脈導管部位已化膿即可判定為感染，不一定須細菌培養才能確定，故(B)錯誤。術後傷口發炎化膿、住院期間潛伏而出院後才發病的感染皆屬院內感染，且多發生於住院72小時後。"},{"i":"107-1|4","e":"107-1","n":4,"c":3,"s":"適用外科無菌之護理技術，包括下列那幾項？①灌腸 ②點滴加藥 ③肌肉注射 ④單次導尿 ⑤傷口換藥","o":["①③④⑤","①②③④","②③④⑤","①②④⑤"],"a":"C","k":"C","t":"","x":"外科無菌技術用於侵入性治療（如注射、導尿）、傷口處理及手術等需維持無菌狀態的處置，點滴加藥、肌肉注射、單次導尿及傷口換藥皆屬之，故選②③④⑤。灌腸的肛管進入消化道，消化道本身非無菌，採內科無菌（清潔）技術即可。"},{"i":"107-1|5","e":"107-1","n":5,"c":3,"s":"依據疾病管制署公告，為懷疑有伊波拉病毒感染病人執行常規醫療照護時，下列何項個人防護設備不適宜？","o":["手套","外科口罩","護目設備","連身型防護衣"],"a":"B","k":"B","t":"","x":"照護疑似伊波拉病毒感染病人時，個人防護裝備包括內外層手套、防水鞋套、連身型防護衣、N95以上口罩及面罩（護目鏡）等；外科口罩防護等級不足，不適宜使用，故選(B)。"},{"i":"107-1|6","e":"107-1","n":6,"c":3,"s":"消除登革熱四大重點：「巡、倒、清、刷」，是阻斷下列疾病傳染模式中的何項因素？","o":["進入易感性宿主的門戶","離開感染窩的門戶","易感性宿主","感染窩"],"a":"D","k":"D","t":"","x":"「巡、倒、清、刷」是巡視並清除住家內外的積水容器，消除病媒蚊（埃及斑蚊、白線斑蚊）孳生源，屬於清除或控制感染窩，故選(D)。易感性宿主及其進入門戶的阻斷措施為增加免疫力、防蚊叮咬等。"},{"i":"107-1|15","e":"107-1","n":15,"c":3,"s":"下列那項護理可減少病人傷口感染的機會？","o":["打開無菌換藥碗包布時，先開遠側端","手持無菌棉枝或鑷子時應握於上1/2處","須於換藥碗上方5～8公分放下敷料","執行換藥過程中，同時向病人說明每一個步驟"],"a":"A","k":"A","t":"","x":"打開無菌包時應先開遠側端，再開左右兩側，最後開近側端，避免手臂跨越無菌區造成污染，故選(A)。持無菌鑷子或棉枝的位置與放置敷料的高度不符無菌原則；換藥過程中對著無菌區說話會使飛沫污染無菌區，應於換藥前先說明。"},{"i":"106-2|1","e":"106-2","n":1,"c":3,"s":"引起外生性院內感染的病菌，下列何者最常見？","o":["金黃色葡萄球菌","大腸桿菌","鏈球菌","沙門桿菌"],"a":"A","k":"A","t":"","x":"外生性感染的病原來自病人以外，如醫護人員、訪客、其他病人或消毒不當的醫療用品，最常見的菌種為金黃色葡萄球菌及綠膿桿菌，故選(A)。大腸桿菌、念珠菌多來自病人自身腸道等部位，屬內生性感染。"},{"i":"106-2|2","e":"106-2","n":2,"c":3,"s":"林小弟，連續三天出現腹瀉情況，糞便檢體發現有痢疾桿菌。下列何者是痢疾的傳染途徑？","o":["飛沫傳染","媒介物傳染","垂直傳染","空氣傳染"],"a":"B","k":"B","t":"","x":"痢疾桿菌經糞口途徑傳染，病原體隨糞便排出後污染食物、飲水或器物，再經口進入宿主，屬媒介物傳染，故選(B)。痢疾非經飛沫或空氣傳播，也不是母子間的垂直傳染。"},{"i":"106-2|3","e":"106-2","n":3,"c":3,"s":"（情境：林小弟，連續三天出現腹瀉情況，糞便檢體發現有痢疾桿菌。）護理師在照顧林小弟時，下列措施何者最適宜？","o":["安排林小弟在單人房，採取絕對隔離","林小弟的排泄物需用消毒水浸泡後再沖掉","所有訪客來探視林小弟時，需先戴上口罩","林小弟使用過的餐盤需要進行煮沸消毒"],"a":"B","k":"B","t":"","x":"痢疾經糞口傳染，病人排泄物為主要感染源，應先以消毒水浸泡處理後再沖掉，以阻斷傳染途徑，故選(B)。痢疾採接觸隔離即可，不需絕對隔離；非經飛沫傳染，訪客不需戴口罩；餐具依一般清潔消毒流程處理即可，非最主要的措施。"},{"i":"106-2|5","e":"106-2","n":5,"c":3,"s":"下列那些項目是符合醫療照護相關感染（health-care associated infection; HAI）之定義？①胎兒於出生後36 小時發現感染梅毒 ②住院注射之靜脈導管部位紅腫熱痛 ③注射化學治療藥物滲漏導致局部發炎 ④闌尾炎住院合併腹膜炎 ⑤手術後二天傷口感染發炎 ⑥因泌尿道感染住院期間培養出新菌種","o":["①③④","②⑤⑥","③④⑥","②④⑤"],"a":"B","k":"B","t":"","x":"HAI為入院時未發生或未處於潛伏期，於住院或接受醫療照護時得到的感染：靜脈導管部位感染（②）、術後傷口感染（⑤）及住院期間培養出新菌種（⑥）皆屬之，故選(B)。①為經胎盤感染、出生1～2天內發現不列入；③為化學藥物刺激，非感染；④為原有疾病的延伸。"},{"i":"106-1|1","e":"106-1","n":1,"c":3,"s":"下列何者為預防院內感染最經濟有效的方法？","o":["戴手套","戴口罩","正確洗手","穿隔離衣"],"a":"C","k":"C","t":"","x":"洗手是預防院內感染最簡單、最經濟、最有效的方法，能暫時性清除90%以上的細菌，故選(C)。戴手套、口罩及穿隔離衣雖屬防護措施，但成本較高且不能取代洗手。"},{"i":"106-1|5","e":"106-1","n":5,"c":3,"s":"測量H5N1流感病毒感染病人生命徵象時，下列何項防護設備較不必要？","o":["手套","無菌隔離衣","護目設備","外科口罩"],"a":"B","k":"B","t":"","x":"H5N1流感病毒主要經飛沫及接觸傳染，測量生命徵象時需戴手套、口罩、護目設備並穿著一般隔離衣以防污染，但測量生命徵象非侵入性無菌操作，不需穿無菌隔離衣，故選(B)。"},{"i":"106-1|7","e":"106-1","n":7,"c":3,"s":"下列何種情況符合醫療照護相關感染（healthcare-associated infection, HAI）之定義？","o":["肝癌病人接受動脈血管栓篩治療的隔日，出現體溫上升情形","出生48小時被診斷感染德國麻疹的新生兒","剖腹產新生兒出生後第4天臍帶感染","服用類固醇藥物後發生帶狀疱疹入院診治的病人"],"a":"C","k":"C","t":"","x":"醫療照護相關感染指入院時未發生或未處於潛伏期，而於住院期間或接受醫療照護時得到的感染。新生兒經胎盤或產道感染若於住院第1～2天出現不屬之，剖腹產新生兒出生第4天才發生臍帶感染則屬之，故選(C)。(A)栓塞治療後隔日發燒未必為感染；(B)為經胎盤的先天感染；(D)為潛伏感染復發且入院前已發生。"},{"i":"105-2|1","e":"105-2","n":1,"c":3,"s":"有關穿脫隔離衣之敘述，下列何者正確？①隔離衣須完全覆蓋工作服且長度及膝者為佳 ②隔離衣使用後，正面、領口皆視為污染區 ③脫隔離衣時，須將隔離衣外面包裹在內側 ④脫下隔離衣後須立即洗手","o":["①②③","②③④","①③④","①②④"],"a":"C","k":"C","t":"","x":"隔離衣須完全覆蓋工作服、長度及膝（①）；脫除時手不可碰觸外面，並將污染的外面包裹在內側（③）；脫下後須立即洗手（④），故選①③④。隔離衣的衣領為較清潔之處，脫除時勿以污染的手碰觸，故「領口視為污染區」錯誤。"},{"i":"105-2|3","e":"105-2","n":3,"c":3,"s":"下列那一種護理技術，不需採用外科無菌操作？","o":["單次導尿","胸管置放","鼻胃管置放","靜脈注射"],"a":"C","k":"C","t":"","x":"外科無菌技術用於侵入性治療（如導尿、注射）、傷口處理及手術等需維持無菌狀態的處置。鼻胃管經鼻腔進入消化道，消化道本身非無菌腔室，置放時採內科無菌（清潔）技術即可，故選(C)；單次導尿、胸管置放及靜脈注射皆須採外科無菌技術。"},{"i":"105-2|8","e":"105-2","n":8,"c":3,"s":"水痘病人出院後，應以何種方法進行床墊消毒？","o":["紫外線消毒法","超音波消毒法","火焰滅菌法","高壓蒸氣滅菌法"],"a":"A","k":"A","t":"","x":"床墊體積大且不耐高溫高壓，水痘病人出院後的床墊可利用紫外線照射進行表面消毒，故選(A)。超音波多用於器械清洗；火焰滅菌與高壓蒸氣滅菌會損壞床墊，不適用。"},{"i":"105-1|1","e":"105-1","n":1,"c":3,"s":"有關SARS的隔離措施，下列敘述何者錯誤？","o":["SARS屬於飛沫傳染，故需給予負壓單獨病房","只有在接觸SARS病患的體液時，才需要穿戴防護用具","SARS病人使用的醫療用品，最好是拋棄式或單獨一套使用","SARS病人的床單需要先行高壓滅菌消毒後才可進行清洗"],"a":"B","k":"B","t":"","x":"SARS可經飛沫及接觸傳染，照護時應依規定全程穿戴N95口罩、髮帽、手套、防護衣（隔離衣）及面罩等個人防護裝備，並非只有接觸體液時才穿戴，故(B)錯誤。病人宜安置於負壓隔離病房，使用的醫療用品宜拋棄式或專人專用，污染布單應先滅菌再清洗，以阻斷傳染途徑。"},{"i":"104-2|4","e":"104-2","n":4,"c":3,"s":"將白血球低下病人安排在獨立病室中，是阻斷下列疾病傳染模式中的何項因素？","o":["感染原","傳染窩","傳染途徑","易感性宿主"],"a":"D","k":"D","t":"","x":"白血球低下病人抵抗力差，屬易感性宿主，安排獨立病室（保護性隔離）是保護易感宿主、避免其受感染。若是將傳染病人隔離以防病原散播，才是針對傳染窩出口或傳染途徑。"},{"i":"104-2|6","e":"104-2","n":6,"c":3,"s":"內視鏡使用後以2%活性戊乙醛（Glutaraldehyde；商品名Cidex）處置，下列敘述何者正確？①浸泡3～10小時可達滅菌效果 ②浸泡後取出可直接乾燥使用 ③加入活性劑後Cidex的有效期限可達14～28天 ④為確保溶液無菌，每次使用須重新泡製 ⑤浸泡前須先刷洗內視鏡上的污漬 ⑥不具腐蝕性，因此可用於各式金屬器械","o":["①③⑤","②④⑥","①③⑥","②③④"],"a":"A","k":"A","t":"","x":"活化戊二醛浸泡15～30分鐘可達消毒、3～10小時可達滅菌；活化後可使用約14～28天；使用前須先清潔器械，故①③⑤正確。浸泡後須以無菌水充分沖洗再使用，不需每次重新泡製；戊二醛對黏膜具刺激性，且長期浸泡對部分金屬有腐蝕性。"},{"i":"104-2|12","e":"104-2","n":12,"c":3,"s":"手術時，有關鋪設無菌區域之敘述，下列何者正確？","o":["無菌物品應放置於無菌區域邊緣0.5吋以內的區域中","無菌物品應維持在大腿以上，不可背對無菌區域","桌面的無菌區域不應包含桌面下垂部分","使用滅菌包應注意有效期限為14天"],"a":"C","k":"C","t":"","x":"桌面下垂的部分低於腰部且不在視線範圍內，不應視為無菌區域。無菌物品應距無菌區邊緣1～2吋以上；無菌物品應維持在腰部以上、肩部以下；滅菌包有效期限依包裝材質而定，並非一律14天。"},{"i":"104-2|55","e":"104-2","n":55,"c":3,"s":"傳染性病人出院後，病人單位處理方式，下列何者正確？","o":["將使用過的布單類放入一般性袋內","病床、地板、桌椅以紫外線照射15分鐘","布單類、不鏽鋼容器先清洗再以高壓蒸氣滅菌","有血跡、體液之牆壁或地板以漂白水清洗"],"a":"D","k":"D","t":"","x":"病人單位終期消毒時，沾有血跡、體液的牆壁或地板應以漂白水清洗消毒。使用過的布單應放入感染性汙衣袋；紫外線照射一般需約30分鐘以上；布單及不鏽鋼容器等耐熱用物應先滅菌（消毒）再清洗，以免清洗人員受感染。"},{"i":"104-1|1","e":"104-1","n":1,"c":3,"s":"有關隔離與全面防護措施之敘述，下列何者錯誤？","o":["隔離衣使用後，正面與背面之腰部和肘部以下區域視為污染區","易感宿主之房間採負壓","口罩潮濕就失去防護成效，應立即更換","脫下手套後應立即洗手"],"a":"B","k":"B","t":"","x":"易感宿主（如白血球低下者）應採保護性隔離，房間維持正壓，避免外界微生物進入；負壓用於空氣傳染病人，以防病原外洩，故B錯誤。隔離衣腰部與肘部以下視為汙染區，口罩潮濕應立即更換，脫手套後應立即洗手，皆正確。"},{"i":"104-1|2","e":"104-1","n":2,"c":3,"s":"有關化學消毒法之敘述，下列何者正確？","o":["不論物品表面清潔與否，均不影響消毒效果","酒精的濃度愈濃，其殺菌效果愈佳","溫度升高可促進化學反應速度，提高殺菌速率","殺菌效果好壞，與化學消毒時間之長短通常無關"],"a":"C","k":"C","t":"","x":"溫度升高可加快化學反應速度，提高化學消毒劑的殺菌速率。物品表面若有血液、分泌物等有機物會降低消毒效果，需先清潔；酒精以70～75%殺菌效果最佳，並非越濃越好；消毒效果與浸泡時間長短密切相關。"},{"i":"104-1|3","e":"104-1","n":3,"c":3,"s":"依據疾病感染鏈的模式，下列敘述何者錯誤？","o":["以外科無菌技術執行導尿，是阻斷傳染途徑","定期更換氧氣潮濕瓶，是移除傳染窩","維持氣管內插管及引流管的通暢，是通暢傳染窩出口","以紫外線燈照射床褥，是阻斷傳染途徑"],"a":"D","k":"D","t":"","x":"以紫外線照射床褥是消毒病人周遭環境，以清除或控制傳染窩，而非阻斷傳染途徑，故D錯誤。外科無菌導尿可阻斷傳染途徑；定期更換氧氣潮濕瓶為移除傳染窩；維持管路通暢屬控制傳染窩出口。"},{"i":"104-1|4","e":"104-1","n":4,"c":3,"s":"下列兩項護理工作轉換間，若執行前項工作已洗手，無需再次洗手者為何？","o":["加針劑藥物至輸液袋後，測量血壓","執行尾骶骨壓瘡傷口護理後，執行足跟壓瘡傷口護理","以手觸診病人腹部後，返回工作車拿東西","拔除病人靜脈留置針後，執行傷口護理"],"a":"A","k":"A","t":"","x":"加藥至輸液袋與測量血壓均屬清潔的操作，未接觸病人血液體液，前項已洗手可直接進行，故選A。B由一處傷口換至另一處傷口需更換手套並洗手以免交互感染；C接觸病人後應洗手；D拔除留置針接觸血液後，再執行傷口護理（無菌操作前）應洗手。"},{"i":"104-1|51","e":"104-1","n":51,"c":3,"s":"有關感染病房終期消毒之敘述，下列何者錯誤？","o":["病房及用物應先以紫外線照射30分鐘後，再拆各類布單","清理病房後便可以立即鋪床","耐高溫之用物需先送高壓蒸氣滅菌後再送洗","沾有體液的地板，以漂白水清洗"],"a":"B","k":"B","t":"","x":"感染病房終期消毒後，病床及單位應先保持通風並待消毒完成、充分乾燥後再鋪床，不可清理後立即鋪床，故B錯誤。先以紫外線照射再拆布單可減少微生物散播；耐高溫用物先滅菌再送洗；沾有血液體液的地板以漂白水消毒。"},{"i":"103-2|1","e":"103-2","n":1,"c":3,"s":"有關巴氏消毒法之敘述，下列何者正確？①加熱至62℃持續30分鐘 ②加熱至32℃持續60分鐘 ③適用於乳製品的消毒 ④適用於餐盤的消毒","o":["①③","①④","②③","②④"],"a":"A","k":"A","t":"","x":"巴斯德消毒法（低溫消毒法）是將液體加熱至約62～63℃持續30分鐘（或72℃約15秒），可殺死大部分病原菌又不破壞營養成分，適用於牛乳等乳製品，故①③正確。32℃無法達到消毒效果；餐盤、便盆多以流動蒸氣（100℃、15～30分鐘）消毒。"},{"i":"103-2|4","e":"103-2","n":4,"c":3,"s":"護理師在照顧愛滋病患者時所採取的隔離措施，下列敘述何者正確？","o":["安排單人房，採絕對隔離","與病人交談時須穿隔離衣","進行抽血技術時須戴手套","使用過的餐盤需要高壓蒸氣消毒"],"a":"C","k":"C","t":"","x":"愛滋病主要經由血液、體液傳染，照護時採標準防護措施，接觸血液、體液（如抽血）時須戴手套。一般接觸不會傳染，不需絕對隔離或單人房，交談時不需穿隔離衣，餐盤也不需高壓蒸氣滅菌。"},{"i":"103-2|5","e":"103-2","n":5,"c":3,"s":"有關內科無菌之敘述，下列何者正確？","o":["勤加洗手並戴口罩，是維持內科無菌的要項","內科無菌是用消毒與滅菌的觀念來保持物品無菌","內科無菌並不適用於肺結核或腸病毒患者之照護","替患者灌腸或擦澡時，不宜採用內科無菌技術"],"a":"A","k":"A","t":"","x":"內科無菌技術是將微生物侷限在特定區域，項目包括洗手、口罩等防護用具、手套、隔離衣及隔離病室，故A正確。以消毒滅菌觀念保持物品無菌是外科無菌；照顧肺結核、腸病毒等傳染病人及灌腸、擦澡等非侵入性處置正是內科無菌的適用時機。"},{"i":"103-2|6","e":"103-2","n":6,"c":3,"s":"有關洗手法的敘述，下列何者正確？","o":["非執行手術的話，搓洗的位置到手腕為止","執行內科無菌洗手法沖水時，手指尖朝上高於手肘","執行外科無菌洗手法洗手時，需要用刷子刷洗","若使用擦手紙，用完後要丟到感染性可燃垃圾桶"],"a":"C","k":"C","t":"","x":"外科無菌洗手需以無菌刷子刷洗手、前臂至肘上，故C正確。內科洗手搓洗範圍應包含手腕以上；內科洗手沖水時指尖應朝下低於手肘，使髒水由手腕流向指尖；外科洗手才是指尖朝上；擦手紙未受血液體液汙染，丟一般垃圾即可。"},{"i":"103-1|4","e":"103-1","n":4,"c":3,"s":"預防或控制致病微生物直接或間接由一個人或地方傳播到另一個人或地方之技術稱為：","o":["消毒技術","外科無菌技術","滅菌技術","內科無菌技術"],"a":"D","k":"D","t":"","x":"內科無菌技術（清潔技術）是將微生物侷限在特定區域，預防或控制病原微生物直接或間接由一個人或地方傳播到另一個人或地方。外科無菌技術是保持滅菌物品或無菌區於無菌狀態；消毒與滅菌則是清除或殺死微生物的方法。"},{"i":"103-1|5","e":"103-1","n":5,"c":3,"s":"有效性的洗手可以清除手中約多少%暫時性的細菌？","o":["60%~69%","70%~79%","80%~89%","90%以上"],"a":"D","k":"D","t":"","x":"洗手是預防感染最簡單、最經濟、最有效的方法，有效的洗手能暫時性清除手上90％以上的暫時性細菌。戴手套不能取代洗手，手部有明顯髒汙或沾有血液體液時應溼洗手，無明顯髒汙時可用乾洗手。"},{"i":"102-2|8","e":"102-2","n":8,"c":3,"s":"護理師執行下列何項處置，所使用過的空針最具有傳染性？","o":["IV bag加藥","penicillin藥物稀釋","驗CBC/DC","打水球固定存留導尿管"],"a":"C","k":"C","t":"","x":"血液、體液為感染鏈中重要的傳染窩出口，抽血驗CBC/DC的空針直接接觸病人血液，針扎時最可能傳播血液傳染病，故最具傳染性。加藥、藥物稀釋及打水球的空針未接觸病人血液或體液，傳染風險低。"},{"i":"102-2|9","e":"102-2","n":9,"c":3,"s":"下列何者不是外科無菌技術的應用對象？","o":["導尿技術","鼻胃灌食","靜脈注射","手術傷口換藥"],"a":"B","k":"B","t":"","x":"外科無菌技術用於侵入性治療（導尿、注射、抽痰）、傷口處理及手術等，需維持滅菌狀態。鼻胃灌食經由消化道進行，屬於內科無菌（清潔）技術即可，不需外科無菌。"},{"i":"102-2|54","e":"102-2","n":54,"c":3,"s":"有關院內感染之敘述，下列何者正確？","o":["護理師照顧同病房的兩位病患後，再一併洗手，就能避免交互感染","有臨床症狀顯現的患者，才算是感染鏈中的帶菌者","有效切斷感染鏈其中任一環節，則感染源的傳播即會停止","病人單位使用清潔劑擦拭，就可以達到滅菌的效果"],"a":"C","k":"C","t":"","x":"感染鏈由病原、傳染窩、出口、傳染途徑、入口及易感宿主組成，有效切斷其中任一環節即可阻止感染傳播。照顧不同病人之間應洗手，不可兩人後再一併洗手；無症狀帶菌者也是傳染窩；清潔劑擦拭僅達清潔，無法達到滅菌。"},{"i":"102-2|56","e":"102-2","n":56,"c":3,"s":"保持滅菌物品或無菌區域於無菌狀態的技術，稱為：","o":["隔離技術","外科無菌技術","滅菌技術","內科無菌技術"],"a":"B","k":"B","t":"","x":"外科無菌技術是指保持滅菌物品（如器械、敷料、布單）或無菌區域於無菌狀態的技術。內科無菌技術是將微生物侷限在特定區域、防止散播；滅菌技術是殺死包括芽孢在內所有微生物的方法。"},{"i":"102-1|1","e":"102-1","n":1,"c":3,"s":"王小弟罹患白血病，此次住院的目的是要進行骨髓移植。王小弟住院期間應採何種隔離方式？","o":["腸胃道隔離","接觸隔離","保護性隔離","血液隔離"],"a":"C","k":"C","t":"","x":"骨髓移植病人在移植前後免疫功能極度低下，容易受到外界病原感染，應採保護性隔離（反向隔離），保護病人免於感染。腸胃道隔離、接觸隔離與血液隔離皆是為了防止病人的病原傳染給他人，並不適用。"},{"i":"102-1|2","e":"102-1","n":2,"c":3,"s":"（情境：王小弟罹患白血病，此次住院的目的是要進行骨髓移植。）護理師在照顧王小弟時的處置措施，下列何者最適當？","o":["鼓勵王小弟多到戶外散步，增強抵抗力","給王小弟用的餐盤，最好先經流動蒸氣消毒","白血病屬血液傳染疾病，護理時須戴手套","安排王小弟與其他病童同一房間作伴"],"a":"B","k":"B","t":"","x":"保護性隔離病人的用物應經消毒處理，餐盤以流動蒸氣（100℃、15～30分鐘）消毒，可減少病原菌經由食具傳給病人。免疫力低下者應減少外出及接觸人群；白血病並非傳染性疾病，護理時不需因此戴手套；也不應與其他病童同住一室，以免交互感染。"},{"i":"102-1|3","e":"102-1","n":3,"c":3,"s":"有關「院內感染」的敘述，下列何者正確？","o":["常見的院內感染部位以呼吸道感染為最高","多因誤用與濫用抗生素、病人抵抗力低、侵入性檢查與治療機會增加所致","病人入院時已有尿道感染，住院後尿液培養又發現另一種病菌，且菌落數約1000個/mL，即是院內感染","開放性骨折病人住院後併發骨髓炎屬於院內感染"],"a":"B","k":"B","t":"","x":"院內感染的發生多與誤用或濫用抗生素造成抗藥菌株、病人抵抗力低下，以及侵入性檢查與治療機會增加有關。常見院內感染部位以泌尿道感染最多；判定泌尿道感染須尿液培養菌落數達10⁵ cfu/mL以上，1000個/mL不符合；開放性骨折後的骨髓炎屬於受傷本身所致的感染，並非院內感染。"},{"i":"101-2|2","e":"101-2","n":2,"c":3,"s":"下列那類病人應採保護性隔離？①肺結核 ②大範圍燒傷 ③SARS ④骨髓移植","o":["①②","①③","③④","②④"],"a":"D","k":"D","t":"","x":"保護性隔離（反向隔離）是保護抵抗力低下的病人免於受到外界感染，適用於大範圍燒傷、骨髓移植、白血球過低者（②④）。肺結核經空氣傳染、SARS經飛沫與接觸傳染，應採空氣或飛沫等傳染性隔離，以防病人將病原傳給他人。"},{"i":"101-2|3","e":"101-2","n":3,"c":3,"s":"當護理師為罹患 SARS 的陳女士做完導尿管護理，正準備要離開病室返回護理站，下列何種措施最適宜？","o":["將使用過的棉棒，全部帶回護理站前的污物間丟棄","先將雙層手套脫掉，才能進入前室依序脫掉隔離衣、帽","在病室先脫外層手套，進入前室脫內層手套，另戴手套移除隔離衣","做完技術後，可請陳女士將口罩取下，方便與護理人員說話"],"a":"C","k":"C","t":"","x":"照護SARS病人時穿戴雙層手套，離開時應在病室內先脫除外層手套，進入前室後再脫內層手套、執行手部衛生並另戴乾淨手套，以避免污染的手接觸並移除隔離衣。使用過的棉棒等污染物應在病室內丟棄，不可帶出；病人應全程戴口罩以減少飛沫傳播。"},{"i":"101-2|4","e":"101-2","n":4,"c":3,"s":"有關院內感染的敘述，下列何者正確？","o":["指個案住院期間所得到的感染，不包括入院時已有的感染","院內感染的範圍包括個案入院前潛伏的病症與併發症","個案入院72小時以後的感染皆稱為院內感染","院內感染最常發生在加護病房與嬰兒室"],"a":"A","k":"A","t":"","x":"醫療照護相關感染（院內感染）是指病人住院期間或接受醫療照護時所得到的感染，不包括入院時已存在或正處於潛伏期的感染。入院72小時後發生的感染仍須符合判定準則並排除入院時已有的感染，才可判定為院內感染，不能一概而論。"},{"i":"101-2|6","e":"101-2","n":6,"c":3,"s":"取用無菌物品的原則，下列敘述何者正確？","o":["非無菌物品應遠離無菌區至少30公分以上","無菌物品應維持在腰部以下並面向無菌區","無菌區邊緣1吋範圍內通常被視為非無菌區","拆封但未使用的無菌物品保存好可繼續供下一位病人使用"],"a":"C","k":"C","t":"","x":"無菌區邊緣1吋（約2.5公分）範圍內通常被視為非無菌區，放置無菌物品時應避開邊緣。非無菌物品與無菌區保持至少1～2吋距離即可，不需30公分以上；無菌物品應維持在腰部以上、肩部以下並面向無菌區；拆封未使用的無菌物品不可放回，也不可再供其他病人使用。"},{"i":"101-2|7","e":"101-2","n":7,"c":3,"s":"臨床上常用物理或化學方式來殺滅致病微生物的芽孢與繁殖體，此種方式稱為：","o":["消毒（disinfection）","滅菌（sterilization）","清潔（clean）","無菌（asepsis）"],"a":"B","k":"B","t":"","x":"滅菌是以物理或化學方法殺滅所有微生物，包括細菌芽孢與繁殖體。消毒只能殺死病原微生物的繁殖體，無法殺滅芽孢；清潔是去除物品上的污垢與有機物；無菌則是指沒有任何微生物存在的狀態。"},{"i":"101-1|1","e":"101-1","n":1,"c":3,"s":"王先生，83歲，近日因食慾不佳體重下降、輕度發燒（耳溫37.7~38.8℃）住院，住院診斷為疑似結核病，護理師照顧此個案在感染控制概念之應用，下列敘述何者正確？","o":["照顧前後必須要洗手，洗手時間至少30秒","王先生為易感染宿主，需應用外科無菌技術提供照顧","照顧王先生護理人員應穿戴隔離衣、口罩及手套","王先生年紀大需要有人陪伴，最好安排住健保床"],"a":"A","k":"A","t":"","x":"洗手是阻斷傳染途徑最簡單、經濟且有效的方法，照顧病人前後都必須確實洗手，且洗手時間應足夠（至少30秒）。結核病經空氣傳染，應採空氣隔離並戴N95口罩，安排單人負壓隔離病室，不宜住多人的健保床；照護此類病人屬內科無菌技術，一般照護不需外科無菌技術，也不必常規穿戴隔離衣與手套。"},{"i":"101-1|2","e":"101-1","n":2,"c":3,"s":"（情境：王先生，83歲，近日因食慾不佳體重下降、輕度發燒（耳溫37.7~38.8℃）住院，住院診斷為疑似結核病。）王先生住院期間所使用過的用物，應如何處置？","o":["個案擦拭過口鼻分泌物之衛生紙，應投入感染性可燃垃圾袋內，以高溫高壓滅菌法處理","病室內專用血壓計、聽診器，待個案出院後以75%酒精徹底擦拭消毒","病室內病床及傢俱應以人工紫外線進行消毒，時間約60分鐘","清潔人員應以3.0%漂白水擦拭地板及相關用物"],"a":"B","k":"B","t":"","x":"疑似結核病人病室內的專用血壓計、聽診器等非侵入性物品，於病人出院後應以75%酒精擦拭消毒，作為終期消毒。擦拭過分泌物的衛生紙屬感染性廢棄物，應以焚化處理而非高溫高壓滅菌；病床傢俱應以消毒劑擦拭；地板清潔的漂白水濃度一般為0.1～0.5%，3.0%濃度過高。"},{"i":"101-1|6","e":"101-1","n":6,"c":3,"s":"有關無菌物品的操作使用，下列敘述何者正確？","o":["手持無菌敷料鉗時，需握鑷子的上1/3處","從泡鑷罐取出無菌敷料鉗時，鉗尖須保持開立狀態","手持無菌棉球罐蓋時，蓋口需朝上，保持在腰部以上","打開無菌棉球罐時，手持蓋子邊緣處，以利旋轉"],"a":"A","k":"A","t":"","x":"手持無菌敷料鉗時應握住鉗子的上1/3處（握柄），避免接觸下段無菌部分。由泡鑷罐取出敷料鉗時鉗尖應合攏朝下，避免碰觸罐口；手持無菌罐蓋時蓋口應朝下，以免灰塵落入；打開無菌罐時手只能接觸蓋子外面，不可碰觸蓋子邊緣與內面。"},{"i":"100-2|1","e":"100-2","n":1,"c":3,"s":"（情境：林小弟因高燒不退，抽搐住院，被診斷出罹患腦膜炎。）林小弟需採何種隔離方式？","o":["絕對隔離","呼吸道隔離","接觸隔離","分泌物隔離"],"a":"B","k":"B","t":"","x":"腦膜炎（如腦膜炎雙球菌）主要經由呼吸道飛沫傳染，病人應採呼吸道隔離（即現行的飛沫隔離），以阻斷傳染途徑。絕對（嚴密）隔離用於經空氣及接觸多重途徑傳染的高傳染性疾病；接觸隔離與分泌物隔離則用於經直接或間接接觸傳染的疾病。"},{"i":"100-2|2","e":"100-2","n":2,"c":3,"s":"（情境：林小弟因高燒不退，抽搐住院，被診斷出罹患腦膜炎。）護理師在照顧林小弟時，應採取何種隔離防護措施？①洗手 ②穿隔離衣 ③戴手套 ④戴口罩","o":["①②","①④","②③","③④"],"a":"B","k":"B","t":"","x":"腦膜炎經飛沫傳染，照護時須洗手並戴（外科）口罩，即可阻斷主要傳染途徑（①④）。隔離衣及手套用於可能接觸血液、體液、分泌物或污染物時，並非呼吸道（飛沫）隔離的基本必要措施。"},{"i":"100-2|3","e":"100-2","n":3,"c":3,"s":"有關操作無菌技術之敘述，下列何者錯誤？","o":["在倒無菌溶液時，須先倒出少量溶液沖洗瓶口","滅菌物品置放到無菌區時，須距離無菌面約10~15公分高","倒無菌溶液後若有殘留液體在瓶口，須以無菌紗布由下而上擦拭","在手中展開滅菌包時，無菌面朝上且拿滅菌包的手須被反包在內"],"a":"C","k":"C","t":"","x":"倒無菌溶液後若瓶口有殘留液體，應以無菌紗布由瓶口往外（由上而下）擦拭，由下而上擦拭會把瓶身的污染帶至瓶口，故(C)錯誤。倒溶液前先倒出少量沖洗瓶口、無菌物品由上方約10～15公分處放入無菌區、手中展開滅菌包時拿包的手須被反包在內，皆符合無菌原則。"},{"i":"100-2|4","e":"100-2","n":4,"c":3,"s":"對降低院內感染之措施，下列何者最適宜？","o":["替病人傷口換藥時，應邊對其說話邊換藥","開放性肺結核病人只要不咳嗽，可不必戴口罩","非罹患傳染性疾病的病人，引流液應不必視為感染性物質","處理所有病人的傷口或檢體，均應戴上手套"],"a":"D","k":"D","t":"","x":"依標準防護措施，處理任何病人的傷口、血液、體液或檢體時，都應視為具感染性並戴上手套。換藥時應避免對著無菌區說話；開放性肺結核病人須持續戴口罩；所有病人的引流液都應視為感染性物質處理。"},{"i":"100-1|1","e":"100-1","n":1,"c":3,"s":"使用無菌有蓋容器時應注意者為何？","o":["手持容器蓋時，蓋口朝上","要放在桌面或任何區域時，蓋口朝下","取蓋時，手勿接觸蓋子的內面與邊緣","無菌容器打開後，等治療結束再蓋上蓋子"],"a":"C","k":"C","t":"","x":"使用無菌有蓋容器時，取蓋與蓋回時手只能接觸蓋子外面，不可碰觸蓋子內面與邊緣，以免污染無菌面。手持容器蓋時應蓋口（內面）朝下，放在桌面時則應蓋口朝上；容器取用完畢應立即蓋回，不可等治療結束才蓋，以減少暴露於空氣中的污染機會。"},{"i":"100-1|9","e":"100-1","n":9,"c":3,"s":"有關院內感染之敘述，下列何者正確？","o":["史塔克（Stark）指出院內感染通常發生在病患住院24小時內","引起院內感染的病菌以大腸桿菌最多","常見的院內感染部位以泌尿道感染最高","為避免發生院內感染應廣泛使用抗生素"],"a":"C","k":"C","t":"","x":"醫療照護相關感染（院內感染）的發生部位以泌尿道感染最常見，多與存留導尿管有關。院內感染通常發生在入院72小時（48小時）之後，而非24小時內；廣泛使用抗生素反而容易造成抗藥性菌株而增加感染風險。"},{"i":"100-1|22","e":"100-1","n":22,"c":3,"s":"正確穿戴無菌手套的步驟為何？①洗手 ②右手拿取左側手套反褶處，左手對準套入 ③右手拿取左側手套反褶內面，左手對準套入 ④穿戴好的左手拿取右側手套反褶處，右手對準套入 ⑤穿戴好的左手插入右側手套反褶內面，右手對準套入 ⑥打開無菌手套","o":["①⑥③④","⑥①②④","①⑥②⑤","⑥①③⑤"],"a":"C","k":"C","t":"","x":"戴無菌手套前應先洗手，再打開無菌手套包裝（①⑥）。第一隻手套由未戴手套的手拿取手套反褶處（內面）套入；已戴手套的手則需插入另一隻手套反褶的內面（即手套外面）拿取再套入，避免無菌手套接觸未滅菌的皮膚（②⑤）。"},{"i":"100-1|23","e":"100-1","n":23,"c":3,"s":"有關高壓蒸氣滅菌的敘述，下列何者正確？","o":["滅菌後保存期限大多是30天","滅菌後加上防塵套，可延長保存期限達兩年以上","滅菌後物品不論抱在身上或夾在腋下，均不影響無菌效果","滅菌後物品取用，仍應維持在腰部以上"],"a":"D","k":"D","t":"","x":"無菌物品取用時應維持在視線範圍內，即腰部以上、肩部以下，滅菌後的物品亦不可抱在胸前或夾在腋下，故(D)正確、(C)錯誤。高壓蒸氣滅菌物品的保存期限依包裝材質而異，一般布包約7～14天，並非大多30天；加上防塵套可延長保存期限，但不會長達兩年以上。"},{"i":"100-1|61","e":"100-1","n":61,"c":3,"s":"有關無菌用品取用原則之敘述，下列何者正確？","o":["為避免飛沫噴濺，工作人員應背對無菌區","應戴無菌手套打開無菌包，以防受污染","無菌包打開後，無菌布面上皆視為無菌區","自無菌包取出之物品若未用且立即放回可視為無菌"],"a":"C","k":"C","t":"","x":"依官方答案，無菌包打開後，無菌布面上的區域視為無菌區（邊緣1吋一般視為污染區）。工作人員應面向無菌區，不可背對；打開無菌包時只接觸包布外層，不需戴無菌手套；自無菌包取出的物品即使未使用也不可放回，以免污染其他無菌物品。"},{"i":"115-2|6","e":"115-2","n":6,"c":4,"s":"成年病人痔瘡術後 1 日，表示傷口處疼痛，護理師依醫囑讓病人溫水坐浴 15 分鐘，但坐浴後病人主訴疼痛並未改善，護理師重新檢視前述的處理過程和未能改善原因，護理師此項行為，屬於何種觀察？","o":["參與性觀察","內省性觀察","旁觀性觀察","自主性觀察"],"a":"B","k":"B","t":"","x":"自省（內省）性觀察是護理人員反省、檢視自己的照護行為與過程，以找出問題、改進照護。參與性觀察是觀察者參與病人的活動並從中觀察；旁觀性觀察是在一旁觀察、不介入；自主性觀察並不是觀察的種類。"},{"i":"115-2|7","e":"115-2","n":7,"c":4,"s":"病人入院即將於次日接受手術，下列那一項護理師的回應展現了治療性會談技巧？","o":["病人說：「我很緊張」，護理師回答：「緊張，吃點東西」","病人說：「我不想手術」，護理師回答：「醫師技術很好，不用擔心」","病人說：「術後傷口痛，怎麼辦？」，護理師回答：「會依據疼痛程度給予止痛」","病人說：「我昨晚睡不好」，護理師回答：「放輕鬆就會睡好」"],"a":"C","k":"C","t":"","x":"病人詢問術後傷口疼痛怎麼辦，護理師提供正確、具體的處理資訊，屬治療性會談中的提供資訊。A、D給予空泛建議，忽略病人的感受；B為不適當的保證，都屬非治療性溝通。"},{"i":"115-2|8","e":"115-2","n":8,"c":4,"s":"關於徵象（signs）及症狀（symptoms）的敘述，下列何者正確？","o":["腸蠕動次數為一種徵象；白血球值低為一種症狀","血壓高為一種徵象；肝性撲動為一種症狀","胸口疼痛為一種徵象；血糖值高為一種症狀","瞳孔縮小為一種徵象；疲倦無力為一種症狀"],"a":"D","k":"D","t":"","x":"徵象是他人可觀察或測量到的客觀變化，如瞳孔縮小、血壓高、腸蠕動、白血球值、血糖值、肝性撲動；症狀是病人的主觀感受，如疲倦無力、胸口疼痛。A、B、C都把徵象誤列為症狀，或把症狀誤列為徵象。"},{"i":"115-1|5","e":"115-1","n":5,"c":4,"s":"病人因退化性關節炎，對於是否接受全膝關節置換術徵詢護理人員的意見，下列護理人員的回應何者最適當？","o":["「開完刀加強復健，一定就會好的。」","「我們現在先去做心電圖檢查。」","「如果我是你，我會接受醫師的建議。」","「可以告訴我，你的擔心是什麼呢？」"],"a":"D","k":"D","t":"","x":"以開放式問句鼓勵病人說出擔心，能澄清他真正的顧慮，並協助病人自己做決定，屬治療性會談技巧。A為不適當的保證；B為改變話題；C以個人意見替病人做決定，都屬非治療性溝通。"},{"i":"115-1|8","e":"115-1","n":8,"c":4,"s":"王先生訴呼吸喘，聽診雙肺呈濕囉音，叩診肺呈濁音，觸診下肢水腫2＋。上述資料何者屬於症狀（symptoms）？","o":["個案主訴呼吸喘","聽診雙肺呈濕囉音","叩診肺呈濁音","觸診下肢水腫2＋"],"a":"A","k":"A","t":"","x":"症狀是病人的主觀感受，須由病人陳述才能得知，例如主訴呼吸喘。雙肺濕囉音、叩診濁音、下肢水腫2＋都是醫護人員經聽診、叩診、觸診可客觀察覺的徵象。"},{"i":"114-3|7","e":"114-3","n":7,"c":4,"s":"與已建立信任關係的病人會談時，下列會談距離何者最適當？","o":["30～40 cm","45～120 cm","150～180 cm","190～250 cm"],"a":"B","k":"B","t":"","x":"依Hall的互動距離，個人距離約45～120 cm，適合與已建立信任關係的病人會談，既能看清表情、說話不費力，又不致侵犯個人空間。0～45 cm為親密距離，多用於執行身體照護；120～360 cm為社交距離，360 cm以上為公眾距離，都不適合會談。"},{"i":"114-3|9","e":"114-3","n":9,"c":4,"s":"病人表情平淡地對護理師說：「我現在好痛，需要止痛針」，護理師表情疑惑地看著病人。依據伯儂（Berlo）溝通模式，下列敘述何者最不適當？","o":["病人是發訊者","「我現在好痛，需要止痛針」為語言傳遞的訊息","病人平淡的臉部表情為非語言傳遞的訊息","護理師疑惑的表情是發訊者非語言的傳遞"],"a":"D","k":"D","t":"","x":"依伯儂溝通模式，護理師接收病人的訊息後露出疑惑表情，是收訊者的非語言回饋，而不是發訊者的傳遞，故D最不適當。病人是發訊者，「我現在好痛，需要止痛針」是語言訊息，病人平淡的臉部表情則是非語言訊息。"},{"i":"114-1|9","e":"114-1","n":9,"c":4,"s":"病人抱怨：「你們醫院的高血壓藥品質不好，吃了好像都沒有效果！」護理人員回覆：「不會吧！我們醫院的藥物都是用最好的。」護理人員的回覆為下列何種非治療溝通技巧？","o":["過度負荷","批判的態度","防衛性態度","改變話題"],"a":"C","k":"C","t":"","x":"病人抱怨醫院藥物品質，護理人員急於替醫院辯護、否定病人的感受，屬於防衛性態度，會使病人不願再表達。批判的態度是對病人的言行加以評斷指責；改變話題是轉移到無關的主題；過度負荷是一次給予過多訊息，皆不符題意。"},{"i":"113-2|5","e":"113-2","n":5,"c":4,"s":"劉先生對護理人員抱怨說：「我受夠了每天做那麼多復健，醫生來看我的次數又那麼少，我很不滿」，下列何者為最合宜的回應？","o":["「我會請醫生把復健次數減少些，這樣好嗎？」","「聽起來您很生氣，可以再具體多講一點嗎？」","「我會再請醫生每天多來看您幾次！」","「醫生是照您的疾病需要，才會安排復健啊！」"],"a":"B","k":"B","t":"","x":"病人表達不滿時，應先反映病人的情緒感受（「聽起來您很生氣」），再以開放式問句鼓勵其具體說明，屬治療性溝通。A、C為不切實際的承諾或保證；D為替醫師辯護、否定病人感受，都屬非治療性溝通。"},{"i":"113-2|6","e":"113-2","n":6,"c":4,"s":"護理師首次照護王先生，先查閱其病歷資料，進入病室後向王先生自我介紹，隨後運用會談方式了解其昨天晚上睡不好的原因，並提供情緒的安撫。王先生感謝地說：「謝謝您這麼關心我，我現在感覺好多了。」有關治療性人際關係過程的敘述，下列何者錯誤？","o":["先查閱病歷資料以了解王先生健康狀況，為介紹前期（互動前期）階段","向王先生自我介紹，為認識期（介紹期）階段","運用會談方式了解睡不好的原因並提供情緒安撫，為工作期階段","王先生對護理師的感謝，為結束期階段"],"a":"D","k":"D","t":"","x":"治療性人際關係分為互動前期、認識（介紹）期、工作期及結束期。查閱病歷屬互動前期，自我介紹屬認識期，運用會談了解問題並提供情緒支持屬工作期；病人表達感謝是工作期中問題獲得處理的回應，並非雙方準備結束關係的結束期，故D錯誤。"},{"i":"113-2|26","e":"113-2","n":26,"c":4,"s":"護理人員至病房巡邏時收集到口腔癌病人許多訊息，下列何者為主觀症狀？","o":["病人抱怨，左頸腫瘤處有抽痛感","病人閉眼，表情皺眉、不安","病人移動時左手扶住左頸腫瘤處","病人四處走動，坐立難安"],"a":"A","k":"A","t":"","x":"主觀症狀是病人自己感受並陳述、他人無法直接觀察的現象，例如病人抱怨頸部腫瘤處抽痛。病人閉眼皺眉、以手扶住患處、四處走動坐立難安，都是護理人員可直接觀察到的客觀徵象。"},{"i":"113-2|35","e":"113-2","n":35,"c":4,"s":"安寧病房末期臨終病人已簽署不施行心肺復甦術同意書，案妻看到病人呼吸微弱且意識不清，緊張地要求對病人進行急救，您為其主護護理師，下列回應何者最適當？","o":["「病人已經簽署不施行心肺復甦術同意書了」","「我了解你的心情，您捨不得先生離開」","「您這樣要求只會造成先生的不舒服而已」","「先生已經無法起死回生了，您就讓他走吧」"],"a":"B","k":"B","t":"","x":"家屬面對病人臨終而情緒緊張時，護理師應先同理並反映其感受（「我了解你的心情，您捨不得先生離開」），接納家屬的情緒後再進一步說明與支持。A只強調文件、C為指責、D語氣直接冷漠，都忽略家屬的情緒，屬非治療性溝通。"},{"i":"113-1|5","e":"113-1","n":5,"c":4,"s":"3天前接受清創術病人即將出院，但向醫師要求能夠繼續住院接受專業照顧，有關護理人員的回應，下列何者最適當？","o":["主動向病人提供回診相關諮詢","和病人共同擬定護理計畫","與病人溝通並了解其感受與想法","清楚說明出院的流程讓病人安心"],"a":"C","k":"C","t":"","x":"病人要求繼續住院，背後可能有對出院後照護的擔憂或不安，護理人員應先運用治療性溝通，傾聽並了解其感受與想法，再針對需求提供協助。直接提供回診諮詢、擬定計畫或說明出院流程，都未先了解病人真正的擔心。"},{"i":"113-1|8","e":"113-1","n":8,"c":4,"s":"下列護理人員的答話，何者能增進護病關係？","o":["「你看起來一點進步也沒有，你有沒有認真做復健？」","「有什麼事讓妳心情不好，要試著說說看嗎？」","「不要一天到晚想要死，你一家大小可都是你的責任，要靠你養！」","「不要怕痛、怕麻煩，妳就按照我教妳的這樣做就對了！」"],"a":"B","k":"B","t":"","x":"以開放式問句關心病人情緒並邀請其表達（「要試著說說看嗎？」），能表達接納與關懷，促進信任的護病關係。A為批評指責，C為說教且否定病人感受，D為命令式回應，都屬非治療性溝通，會阻礙護病關係。"},{"i":"112-3|5","e":"112-3","n":5,"c":4,"s":"病人向護理師表示：「我好像都會聽到別人一直叫我去死的聲音，怎麼辦？」如果護理師使用「重述」的溝通技巧，護理師該如何回應？","o":["「你想，你能怎麼做呢？」","「我能了解你的意思」","「能否再舉更多例子？」","「你說你聽得到聲音？」"],"a":"D","k":"D","t":"","x":"重述（restating）是將病人所說的主要內容以相同或相近的語句重複說出，讓病人知道護理師有在聽並鼓勵其繼續說明，D「你說你聽得到聲音？」即為重述。A為開放式探索，B「我能了解」屬空泛的不適當回應，C為要求舉例的澄清技巧。"},{"i":"112-2|6","e":"112-2","n":6,"c":4,"s":"林先生：「我堂堂一個大將軍，小輩休想叫我吃藥」。護理師：「將軍伯伯不要這樣，您看我這麼認真照顧您，拜託您把嘴巴張開，啊……」。依據伯恩（Berne）溝通模式，稱為發訊者與收訊者之何種溝通形式？","o":["互補溝通","交錯溝通","曖昧溝通","情感溝通"],"a":"A","k":"A","t":"","x":"伯恩溝通分析中，若收訊者以發訊者所期待的自我狀態回應，溝通路線平行，即為互補溝通。林先生以自視甚高的姿態拒絕服藥，護理師以溫和哄勸的方式順應其期待回應，雙方訊息路線平行，屬互補溝通；交錯溝通是回應的自我狀態與發訊者預期不符，曖昧溝通則是表面訊息與隱含意圖不一致。"},{"i":"112-2|7","e":"112-2","n":7,"c":4,"s":"王先生來自香港，是住院中病人。一日突然神情恍惚，揮舞雙手走出病房，搖搖擺擺走入護理站，口中並不斷地喃喃自語。會講粵語的林護理師直接以粵語和緩地對王先生說話，慢慢把恍惚的王先生帶回病房病床，以便進行後續處置。在此情境中，下列何者不是阻礙王先生與林護理師之間有效溝通的因素？","o":["王先生所使用的語言","王先生恍惚的神情","王先生喃喃自語的內容","護理師對訊息的了解程度"],"a":"A","k":"A","t":"","x":"林護理師會說粵語並直接以粵語與王先生溝通，因此語言並非此情境中的溝通障礙。王先生神情恍惚（意識狀態）、喃喃自語內容難以理解，以及護理師對訊息的了解程度，都是影響有效溝通的因素。"},{"i":"112-2|8","e":"112-2","n":8,"c":4,"s":"（情境：王先生來自香港，是住院中病人。一日突然神情恍惚，揮舞雙手走出病房，搖搖擺擺走入護理站，口中並不斷地喃喃自語。會講粵語的林護理師直接以粵語和緩地對王先生說話，慢慢把恍惚的王先生帶回病房病床，以便進行後續處置。）關於林護理師所運用的技巧，下列敘述何者正確？","o":["運用參與式傾聽，以盡力了解王先生喃喃自語的內容","將王先生帶離護理站回病房，是為了布置具備隱私性的會談環境","使用病人能了解的語言，讓病人配合以達雙向溝通的目的","運用的是關懷與接納之治療性人際關係技巧"],"a":"D","k":"D","t":"","x":"林護理師以病人熟悉的粵語、和緩的態度將恍惚的病人帶回病房，展現對病人的關懷與接納，屬治療性人際關係技巧。題中並未進行傾聽或會談，帶回病房是為了安全與後續處置而非布置會談環境；病人神情恍惚，也無法達到真正的雙向溝通。"},{"i":"112-1|7","e":"112-1","n":7,"c":4,"s":"下列那一項不屬於專業性人際關係的特點？","o":["建立在協助解決個案健康問題而存在的關係","依照倫理守則進行彼此的權利與義務","護病關係中需贊同病人的想法才能進行","護病雙方的治療性關係有一定期限"],"a":"C","k":"C","t":"","x":"專業性人際關係是以協助解決病人健康問題為目的，依專業倫理守則運作，並有一定期限，會在目標達成後結束。護理人員應接納、尊重病人，但不需要贊同病人的想法才能進行護病關係，故C不屬其特點。"},{"i":"111-2|6","e":"111-2","n":6,"c":4,"s":"護理師評估病人所收集的資料，下列何者為症狀（symptom）？","o":["測量體溫：39.7度","壓傷傷口紅、有異味","聽診1分鐘腸蠕動為12次","檢查血色素為8.7 g/dL"],"a":"B","k":"B","t":"","x":"症狀是不需使用特殊儀器或方法即可察覺的身體異常，傷口紅、有異味可直接看到、聞到，屬客觀症狀，故選B。體溫須用體溫計測量、腸蠕動須聽診、血色素須經檢驗，皆屬於使用儀器或特殊方法測得的徵象。"},{"i":"111-2|8","e":"111-2","n":8,"c":4,"s":"下列何項屬於治療性溝通技巧？①反映（Reflecting） ②重述（Restating） ③猜測（Questioning） ④批判（Criticize）","o":["①②","①④","②③","③④"],"a":"A","k":"A","t":"","x":"反映是將病人表達的情感或想法回饋給病人，重述是重複病人所說的重點，兩者皆能鼓勵病人表達，屬治療性溝通技巧，故選①②。猜測與批判會讓病人感到被誤解或否定，屬非治療性溝通。"},{"i":"111-2|9","e":"111-2","n":9,"c":4,"s":"李護理師帶著不好的情緒上班，顯得心不在焉。林先生是住院中病人，因為半夜睡不著求助李護理師。林先生以疲憊的語氣對李護理師說：「我睡不著，能給我藥吃嗎？」李護理師說：「嗯嗯，啊？您剛剛說什麼？我現在沒空陪您聊天，請您回病房睡覺。」有關溝通的分析，下列何者正確？","o":["林先生因睡不著而語氣疲憊，所傳遞的是兩種互相抵觸的訊息","李護理師採防衛性的態度，向林先生提出批判性的指示","李護理師與林先生雙方能使用相同的語言，傳遞彼此能了解的訊息","李護理師的回話是無意義問答之不當溝通技巧"],"a":"D","k":"D","t":"","x":"李護理師心不在焉，回應「嗯嗯，啊？您剛剛說什麼？」並未回應病人的需求，屬無意義問答的不當溝通，故D正確。林先生語氣疲憊與內容一致，並非互相抵觸的訊息；雙方未能相互了解訊息；李護理師的回應並非批判性指示。"},{"i":"111-2|10","e":"111-2","n":10,"c":4,"s":"執行病人身體擦澡時，同時觀察其骨突處有無發生壓傷，屬於下列何種觀察種類？","o":["旁觀性","參與性","自省性","被動性"],"a":"B","k":"B","t":"","x":"參與性觀察是護理師在執行護理活動時，同時與病人互動並進行觀察，如擦澡時觀察骨突處皮膚，故選B。旁觀性觀察是不介入活動而在旁觀察；自省性觀察是觀察者省察自己的感受與反應。"},{"i":"111-1|7","e":"111-1","n":7,"c":4,"s":"下列何者不是主觀症狀（subjective symptom）？","o":["全身發癢","口渴","陳施氏呼吸","心悸"],"a":"C","k":"C","t":"","x":"主觀症狀是病人自己感受並陳述的不適，如發癢、口渴、心悸。陳施氏呼吸為呼吸由淺而深再由深而淺並伴隨呼吸暫停的週期性型態，是他人可觀察到的現象，屬客觀症狀而非主觀症狀，故選C。"},{"i":"111-1|8","e":"111-1","n":8,"c":4,"s":"王先生進行全喉切除手術，術後僅能以書寫溝通。王先生多次以書寫方式溝通，護理師皆無法了解，王先生於是無奈地向護理師擺擺手，轉頭留下眼淚。依據伯儂（Berlo）溝通模式，下列敘述何者正確？","o":["王先生訊息傳遞的途徑為書寫，是一種語言溝通","王先生與護理師之間是為父母式（parent）與兒童式（child）之互補溝通模式","王先生與護理師之間是parent-adult-child理論的交錯溝通模式","情境中因王先生無法言語，此溝通過程中缺乏訊息的回饋與反應"],"a":"A","k":"A","t":"","x":"語言溝通包含口語與文字，王先生以書寫傳遞訊息，屬於語言溝通，故A正確。伯恩的互補或交錯溝通模式無法由此情境判斷；王先生擺手、流淚即是對訊息的回饋與反應，因此並非缺乏回饋。"},{"i":"111-1|11","e":"111-1","n":11,"c":4,"s":"一位剛入院且預計明日要進行乳房切除手術的王太太，哭著向護理師表示：「我好害怕，明天可以不要手術嗎？」下列何項敘述最符合同理心的回應？","o":["可以跟我說您在害怕些什麼事情嗎？","要我打電話給主治醫師，跟您談談嗎？","不用害怕，醫師技術高明，沒問題","我了解您的害怕，我跟醫師說取消明天開刀"],"a":"A","k":"A","t":"","x":"同理心回應是先接納病人的情緒，並以開放式問句鼓勵病人說出害怕的內容，才能了解其真正擔憂，故A最適當。立即轉介醫師、給予「不用害怕」的不適當保證，或順著病人要求取消手術，都沒有真正回應病人的感受。"},{"i":"110-2|2","e":"110-2","n":2,"c":4,"s":"下列何種情況出現時只需要記錄，不需要報告？","o":["體溫37.6℃的病人經衛教後能多喝水","糖尿病病人足部潰瘍在換藥後發現傷口周圍有明顯的泛紅情形","姿位性低血壓的病人在下床時跌倒","躁症病患與其他病人在病室發生口角衝突"],"a":"A","k":"A","t":"","x":"病人發生需立即處理的異常、意外或病情變化時須報告；體溫37.6℃經衛教後能多喝水，屬一般護理活動的結果，只需記錄。傷口周圍明顯泛紅疑似感染、病人跌倒及病人間發生衝突，皆須立即報告處理。"},{"i":"110-1|7","e":"110-1","n":7,"c":4,"s":"有關病人症狀（symptoms）資料的敘述，下列何者正確？","o":["腹部手術部位傷口疼痛","空腹血糖值180 mg/dL","肺部X光檢查有肺泡浸潤現象","痰液結核桿菌試驗呈陽性反應"],"a":"A","k":"A","t":"","x":"症狀是病人主觀感受並自述的不適，如疼痛、噁心，故傷口疼痛為症狀。空腹血糖值、X光浸潤及痰液結核桿菌檢驗陽性皆為經檢查測得的客觀資料，屬於徵象而非症狀。"},{"i":"110-1|10","e":"110-1","n":10,"c":4,"s":"有關病人的資料收集及觀察時機，下列敘述何者正確？","o":["晨間護理時可收集到病人的白血球數","傷口換藥時可觀察到感染情形","檢閱體溫紀錄單時可觀察到病人排尿困難","測量生命徵象時可觀察病人的人際關係"],"a":"B","k":"B","t":"","x":"觀察應把握護理活動的時機，傷口換藥時可直接看到傷口有無紅腫、分泌物等感染徵象，故B正確。白血球數需由檢驗報告得知；體溫紀錄單無法看出排尿困難；測量生命徵象時難以觀察病人的人際關係。"},{"i":"110-1|12","e":"110-1","n":12,"c":4,"s":"有關行為過程觀察與記錄方法，下列敘述何者正確？","o":["為避免個案隱藏情緒想法，錄音錄影可不需事先告知","會談者一面會談同時作記錄，可增加觀察資料的真實性","配合觀察目的，可以選擇特定時間活動進行行為過程觀察","記錄偏重於個案的語言和非語言行為，不關心當時的情境"],"a":"C","k":"C","t":"","x":"行為過程觀察可配合觀察目的，選擇特定時間或活動進行觀察與記錄，故C正確。錄音錄影須事先告知並取得同意；邊會談邊記錄會干擾互動、影響觀察；記錄除語言與非語言行為外，也須描述當時情境。"},{"i":"109-1|5","e":"109-1","n":5,"c":4,"s":"有關護理人員和病人間的互動關係之敘述，下列何者正確？","o":["是屬於一種社交性人際關係","初次的互動多採用沒有設定目標的方式隨性進行","結束治療性關係比開始建立關係來得容易","雙方都可以由互動過程中獲得助益或成長"],"a":"D","k":"D","t":"","x":"專業性人際關係是一種助人關係，護理師協助病人解決健康問題，病人得到照護，護理師也能獲得成就感與專業成長，雙方皆可從互動中獲益。它不屬於社交性關係，需有計畫、以共同訂定的目標進行；結束期需審慎準備，並不比建立關係容易。"},{"i":"108-2|26","e":"108-2","n":26,"c":4,"s":"下列那些項目是徵象（signs）的描述？①眩暈 ②肚子絞痛 ③血壓130/68 mmHg ④WBC：8900/uL ⑤胸部聽診呈爆裂音（crackles） ⑥疲倦無力","o":["①②⑤","③④⑥","③④⑤","①②⑥"],"a":"C","k":"C","t":"","x":"徵象是需使用特殊儀器或特殊方法（視、觸、叩、聽診）測量檢查所得的結果，如血壓計測得的血壓、顯微鏡檢驗的白血球數，以及聽診聽到的爆裂音。眩暈、肚子絞痛、疲倦無力是病人自己感受到的現象，屬於主觀症狀。"},{"i":"108-2|27","e":"108-2","n":27,"c":4,"s":"下列何者屬於間接觀察法（indirect observation）之觀察項目？①觀察傷口出現 50%的腐肉 ②叩診腹部為鼓音 ③查閱病歷 Hb：10g/dL ④經會診報告得知病人雙側肺葉浸潤 ⑤聽診呼吸音雙下肺葉為囉音（rales） ⑥查閱護理紀錄了解病人疼痛緩解程度","o":["①②③","①②⑤","③④⑥","②④⑥"],"a":"C","k":"C","t":"","x":"間接觀察法是由病歷取得可做為參考的資料，如醫囑、檢驗報告、會診檢查結果及護理記錄等，故查閱病歷Hb、會診報告、護理紀錄屬之。觀察傷口、叩診腹部、聽診呼吸音則是直接運用感官的直接觀察法。"},{"i":"108-2|28","e":"108-2","n":28,"c":4,"s":"急診通知一位骨折病人將轉入病房，護理師開始查閱其電子病歷，收集相關資料，並準備入院用物，此屬於專業性人際關係建立的那一期？","o":["互動前期","介紹期","工作期","結束期"],"a":"A","k":"A","t":"","x":"互動前期是護理師尚未真正接觸病人前的階段，需收集病人資料、自我探索並計畫首次接觸。病人尚未轉入病房，護理師查閱電子病歷、準備入院用物，即屬互動前期；介紹期則從雙方開始接觸、認識時開始。"},{"i":"108-1|3","e":"108-1","n":3,"c":4,"s":"（情境：林小姐，56歲，近日因全身痠痛、頭痛、咳嗽及發燒，疑似新型流行性感冒，住院治療）林小姐住院已經5天，病情未見好轉，心情沮喪，擔心家人受感染，但又期盼家人的陪伴，常在夜裡哭泣，針對此現象，下列何項護理措施較為合適？","o":["告訴病人心情不佳是正常情形，要多休息放鬆心情，可請家人提供音樂","告訴病人要忍耐，得傳染疾病要自己承受，不要拖累家人","告訴病人只要好好服藥就好了，其它不需要多擔心","告訴病人不要胡思亂想，多想對疾病進展無用"],"a":"A","k":"A","t":"","x":"病人因隔離而情緒低落，應先接納並同理其感受，讓病人知道心情不佳是正常反應，並提供放鬆方式與家人支持。要病人忍耐、只要服藥就不需擔心、叫病人不要胡思亂想，皆屬批判、不當保證或否定病人感受的非治療性溝通。"},{"i":"108-1|9","e":"108-1","n":9,"c":4,"s":"（情境：余先生，感染肺結核，住院治療）余先生表示：「我該不該告訴我母親我得了肺結核？」，如果護理師使用反映（reflecting）溝通技巧，護理師會如何回答？","o":["「你想告訴她嗎？」","「可以請你再說一次嗎？」","「你是說你很煩惱該不該告訴她？」","「你要不要說一說為什麼會有這種想法呢？」"],"a":"A","k":"A","t":"","x":"反映是將病人的想法、感覺與問題客觀地反映給病人，協助其自省，並表示他是有能力自己做決定的成人，如「你想告訴她嗎？」。請病人再說一次屬澄清；「你是說你很煩惱……」較接近重述與情感反應；請病人說說原因則屬引導會談。"},{"i":"108-1|12","e":"108-1","n":12,"c":4,"s":"王小姐罹患卵巢腫瘤，護理人員進入王小姐的病房時，發現她看著窗外，正在流眼淚，護理人員的反應，下列何者最為適當？","o":["保持沉默，安靜走出病房，讓王小姐發洩情緒","走到王小姐身邊，小聲問：「您是不是得了憂鬱症」","拍拍王小姐肩膀，並說「看開一點，腫瘤不一定是惡性的」","走到王小姐身邊，並說：「您怎麼了？我們可以聊一聊」"],"a":"D","k":"D","t":"","x":"見病人流淚，護理師應主動靠近、表達關心，並以開放式問句邀請病人表達感受，如「您怎麼了？我們可以聊一聊」。直接離開會讓病人感到被忽視；未經評估就貼上憂鬱症標籤屬猜測；「看開一點、不一定是惡性」屬陳腔濫調與不當保證。"},{"i":"108-1|54","e":"108-1","n":54,"c":4,"s":"柯老太太，82歲，身上多處壓瘡傷口，入院時GCS：E4V5M5，BP：118/78 mmHg，體溫37.6℃，24小時後柯老太太出現下列何種情況需立即報告？","o":["GCS：E3V4M4","體溫37.8℃","血壓：98/60 mmHg","白班的輸入量：1050 c.c.，輸出量：650 c.c."],"a":"A","k":"A","t":"","x":"意識程度改變屬於必須立即報告的情況。GCS由E4V5M5降為E3V4M4表示意識狀態惡化，可能有嚴重病情變化，應立即通報醫師。體溫37.8℃為輕微變化，血壓98/60 mmHg仍在可接受範圍，輸入量大於輸出量亦非緊急狀況。"},{"i":"107-2|9","e":"107-2","n":9,"c":4,"s":"有關同理心與同情心的敘述，下列何者正確？","o":["同理心通常是較主觀的，指護理師依自身立場去了解個案感受","「設身處地」指的是同情心","同理心是以情緒性的介入他人的感覺或觀點","同情心常使自己陷入需要幫助的困境"],"a":"D","k":"D","t":"","x":"同情心是主觀、情緒性地介入他人的感覺或觀點，常會使自己陷入需要幫助的情境中。同理心則是站在病人立場、以客觀角度了解其感受並協助解決問題，「設身處地」指的是同理心，故A、B、C均錯。"},{"i":"107-2|10","e":"107-2","n":10,"c":4,"s":"有關促進護病溝通的方式，下列敘述何者不適宜？","o":["開放式的溝通如「昨晚睡得如何？」可促進病人表達多一點的想法","當病人無法以口語表達或表達不清時，可使用封閉式溝通如「您的傷口還痛嗎？」","溝通時勿直視病人，保持視線低於病人眼睛，以減輕其威脅感","當對病人述說之內容不太清楚時，可以進一步澄清病人的想法"],"a":"C","k":"C","t":"","x":"會談時應與病人視線等高、身體稍向前傾面對病人，並和藹地注視病人，表達尊重與專注，刻意不直視、視線低於病人並不恰當。開放式問句可促進表達，病人表達困難時可用封閉式問句，內容不清楚時應澄清，A、B、D皆適宜。"},{"i":"107-1|7","e":"107-1","n":7,"c":4,"s":"朱先生剛出獄不久，隨後因疑似肝硬化而入院接受檢查與治療，護理師正與其進行治療性溝通。治療性溝通的目的不包含下列何項？","o":["了解朱先生與疾病無關的隱私性資料","表達護理師的關懷與支持","了解朱先生生活型態","給予朱先生有效護理指導"],"a":"A","k":"A","t":"","x":"治療性溝通以病人需要為中心，目的在建立治療性關係、表達關懷支持、了解病人生活型態與健康問題，並給予有效的護理指導；探詢與疾病無關的隱私資料（如入獄經過）不屬於治療性溝通的目的，故選(A)。"},{"i":"107-1|9","e":"107-1","n":9,"c":4,"s":"對於病患的稱呼是建立關係很重要的步驟，下列作法何者較恰當？①傳統的方式，男性稱先生，女性稱女士 ②可以姓氏加職稱稱呼 ③避免弄錯病患應以床號稱呼 ④全名稱呼最保險也最尊敬","o":["①②","①④","②③","③④"],"a":"A","k":"A","t":"","x":"稱呼病人應表達尊重，可用傳統方式以姓氏加先生、女士稱呼（①），或以姓氏加職稱稱呼（②），故選①②。不可以床號或病名識別、稱呼病人，以免讓病人感到不被尊重；直呼全名並不一定最尊敬。"},{"i":"107-1|10","e":"107-1","n":10,"c":4,"s":"有關促進護病溝通的技巧，下列何者正確？","o":["治療性觸摸如輕拍病人肩膀有助於溝通","與病人溝通時的距離越近越好","病人沉默不語時可轉移話題以免冷場","接納病人即表示贊同病人所有錯誤的想法"],"a":"A","k":"A","t":"","x":"治療性觸摸如輕拍肩膀、握手，可藉適當的肢體接觸表達關懷，有助於溝通，故選(A)。與病人會談宜保持個人距離（約45～120公分），並非越近越好；病人沉默時應善用沉默陪伴，不宜轉移話題；接納是接受病人的行為與感覺，不一定代表贊同。"},{"i":"106-2|7","e":"106-2","n":7,"c":4,"s":"林先生在修理門窗時不慎由二樓摔下來，經家人送到醫院急診時，臉色蒼白、閉眼皺眉、呼吸急促並主訴頭暈。護理師測得其血壓為142/96 mmHg、心跳102次/分。下列何者正確？","o":["血壓及頭暈為主觀症狀","呼吸急促及臉色蒼白為客觀症狀","閉眼皺眉及心跳為徵象（signs）","血壓及呼吸急促為徵象"],"a":"B","k":"B","t":"","x":"客觀症狀為他人可直接看到病人所發生的現象，如臉色蒼白、呼吸急促、閉眼皺眉，故(B)正確。頭暈為病人自覺的主觀症狀；血壓與心跳需以儀器或特殊方法測量，屬徵象；閉眼皺眉與呼吸急促屬客觀症狀，不是徵象。"},{"i":"106-2|8","e":"106-2","n":8,"c":4,"s":"一位母嬰同室的產婦對護理師說：「我的寶寶每次吸奶時都會發出聲音，而且不到 2 小時就要餵，太累了，我不想餵了。」下列何者為最合宜的護理措施？","o":["告知哺餵母乳的優點，請她多忍耐","觀察家人支持者角色扮演的情形","告知飢餓及吸吮為人的本能，只要盡到母親的天職就好了","實際觀察產婦哺餵母乳時的困難，並提供協助"],"a":"D","k":"D","t":"","x":"產婦表達哺餵母乳的辛苦與想放棄，護理師應實際觀察其哺餵過程，找出困難所在並提供協助，才能真正解決問題，故選(D)。(A)與(C)屬說教或忽視產婦的感受；(B)未針對產婦當下的哺餵問題處理。"},{"i":"106-2|9","e":"106-2","n":9,"c":4,"s":"有關專業性人際關係的敘述，下列何者錯誤？","o":["護理師可以經由互動過程中獲得工作上的成就感","有終止期","當個案出院後，雙方的關係就轉變為社交性人際關係","以個案的需要為中心"],"a":"C","k":"C","t":"","x":"專業性人際關係具有特定目標、時間與地點，是暫時性的，當目標達成或病人出院時即經計畫而結束，不會自動轉變為社交性人際關係，故(C)錯誤。護病關係以病人的需要為中心，有結束期，護理師也能從中獲得成就感。"},{"i":"106-2|10","e":"106-2","n":10,"c":4,"s":"有關護理師「行為過程紀錄與分析」的敘述，下列何者正確？","o":["主觀描述病人的言行，不記錄護理師當時的情緒","病人負向的言行表現，才是行為過程紀錄的焦點","記錄分析時，必須以行為發生的前後情境為依據","病人重複出現的言行，宜省略不須再詳細記錄過程"],"a":"C","k":"C","t":"","x":"行為過程紀錄需客觀、真實地記錄病人與護理師的語言及非語言互動，並以行為發生前後的情境作為分析依據，才能正確理解行為的意義，故選(C)。紀錄應客觀而非主觀，也要記錄護理師當時的感受；病人正負向言行都要記錄；重複出現的言行亦有其意義，不宜省略。"},{"i":"106-2|11","e":"106-2","n":11,"c":4,"s":"有關護病關係的敘述，下列何者錯誤？","o":["是為了解決病人所有的問題而建立的關係","又稱為治療性關係","關係之建立只發生在工作時間","關係之建立只發生在工作場所"],"a":"A","k":"A","t":"","x":"護病關係又稱治療性關係，是在工作時間、工作場所中，以病人需求為中心、具特定目標的助人關係，其目的在協助病人滿足健康相關的需要，並非解決病人所有的問題，故(A)錯誤。"},{"i":"106-1|8","e":"106-1","n":8,"c":4,"s":"有關行為過程紀錄之書寫，下列敘述何者錯誤？","o":["應採敘述性文字書寫法記錄","會談後應儘早記錄，避免遺漏失真","如果病人情況許可，會談時間越久越詳細","與病人對話之內容，記錄內容應真實"],"a":"C","k":"C","t":"","x":"行為過程紀錄應以敘述性文字真實記錄病人與護理師的互動，並於會談後儘早記錄以免遺漏失真；會談應依目的與病人狀況有計畫地安排適當時間，並非時間越久越詳細越好，過長的會談反而使病人疲憊，故(C)錯誤。"},{"i":"106-1|10","e":"106-1","n":10,"c":4,"s":"有關專業性人際關係結束期的護理重點，下列何者正確？","o":["加強病人持續服藥的意願","激勵病人面對疾病的動機","建立病人對醫療的信任感","鼓勵病人參與疾病照護活動"],"a":"A","k":"A","t":"","x":"結束期的護理重點包括加強病人持續服藥的意願、與病人一起評值關係歷程及目標、及早做出院計畫並協助確認出院後可用的資源，故選(A)。激勵面對疾病及鼓勵參與照護活動屬工作期；建立信任感屬認識期。"},{"i":"105-2|9","e":"105-2","n":9,"c":4,"s":"晨間護理時，李先生向主護護理師抱怨說：「昨天夜裡，我開刀傷口很痛，夜班護理師態度很差，都不理會我」，護理師此時最適當的反應為：","o":["「李先生您不可以批評護理師，夜班護理師人手不足」","「不要想昨天的事，您現在傷口感覺如何？」","「您能告訴我，昨天夜裡當時的情況嗎？」","「我等會兒去找夜班護理師問清楚，您現在心情還很差嗎？」"],"a":"C","k":"C","t":"","x":"病人抱怨夜間疼痛未被理會，護理師應以開放式問句鼓勵病人陳述事情經過與感受，以了解問題並表達關心，故選(C)。(A)為護理師辯護並批評病人；(B)轉移話題、忽略病人感受；(D)急於處理事件，未先傾聽病人。"},{"i":"105-2|15","e":"105-2","n":15,"c":4,"s":"有關行為過程紀錄之敘述，下列何者錯誤？","o":["記錄護理師與病人間語言及非語言的互動過程","透過此紀錄可以發現病人的健康問題","本質上是屬於一種以問題為導向的紀錄方式","透過此紀錄有助於護理師自我分析，促進自我成長"],"a":"C","k":"C","t":"","x":"行為過程紀錄是記錄護理師與病人間語言與非語言互動的過程，可藉以發現病人的健康問題，並幫助護理師自我分析、促進成長；其本質為敘述性的互動紀錄，並非以問題為導向的紀錄（如POMR、SOAP），故(C)錯誤。"},{"i":"105-2|26","e":"105-2","n":26,"c":4,"s":"有關護病專業性人際關係工作期護理重點的敘述，下列何者正確？","o":["避免與病人討論過去未規則服藥原因","小心病人試探性行為，真誠提供照護","收集病人基本資料及疾病治療史","協助病人定時練習自我照顧技巧"],"a":"D","k":"D","t":"","x":"工作期時病人已產生信任並了解問題所在，最能接受護理指導，護理師應與病人一起面對問題，協助其練習自我照顧技巧，故選(D)。(A)應與病人討論未規則服藥原因；(B)處理試探行為屬認識期；(C)收集基本資料屬互動前期或認識期。"},{"i":"105-2|38","e":"105-2","n":38,"c":4,"s":"下列護理師的行為，何者不是對病人的直接觀察？","o":["為陳先生翻身時，發現1 cm×1 cm的破皮","在測量莊太太的TPR時，呼吸有過熟的果香味","從病歷的檢驗資料中，發現王先生有營養不良的問題","在為曾太太聽診時，發現左邊肺臟有囉音"],"a":"C","k":"C","t":"","x":"直接觀察是利用視、聽、觸、嗅等感覺器官直接觀察病人；從病歷、檢驗報告等取得資料屬間接觀察，故選(C)。翻身時看到破皮（視覺）、聞到過熟果香味（嗅覺）、聽診聽到囉音（聽覺）皆屬直接觀察。"},{"i":"105-1|9","e":"105-1","n":9,"c":4,"s":"張小姐，意識清楚，體溫 39.2℃，現入住病房。目前護理師與張小姐正處於專業性人際關係發展階段的認識期，此期的護理工作重點為：","o":["計畫與張小姐第一次見面時的會談重點","為張小姐介紹環境及病房常規","邀請張小姐一起擬定護理計畫","評值護理目標是否達成"],"a":"B","k":"B","t":"","x":"認識期（介紹期）多發生於病人入院時，重點為介紹醫院環境及住院常規、互相認識並建立基本信任感，故選(B)。計畫第一次會談屬互動前期；邀請病人共同擬定護理計畫屬工作期；評值目標是否達成屬結束期。"},{"i":"105-1|12","e":"105-1","n":12,"c":4,"s":"病人表達「我吃不下飯，一點胃口也沒有！」在建立專業性護病關係時，護理師如何回應較恰當？","o":["「你不餓嗎？我可是餓死了！」","「怎麼可能？你已經兩餐沒吃了？這樣可能有問題喔！」","「我認為你這樣做對你的病一點好處都沒有！」","「你那裡不舒服？我幫你檢查看看！」"],"a":"D","k":"D","t":"","x":"病人表達沒有胃口，護理師應以病人為中心，關心並進一步了解其不適原因，(D)以詢問及實際評估表達關懷，最為恰當。(A)將焦點轉移到護理師自己；(B)表示質疑並引起病人焦慮；(C)屬批判、說教的非治療性溝通。"},{"i":"105-1|13","e":"105-1","n":13,"c":4,"s":"陳先生剛由醫師口中得知自己罹患末期癌症，護理師此時應如何表示最適當？","o":["輕握病人的手或是輕拍其肩膀表示支持與關懷","鼓勵病人面對現實，儘量協助個案完成未完成之願望","告訴病人目前醫療進步非常快，應抱持希望接受持續醫療照顧","主動詳細告訴病人其後續所應做的準備"],"a":"A","k":"A","t":"","x":"病人剛得知罹患末期癌症，情緒震驚，此時以治療性觸摸（輕握手、輕拍肩膀）等非語言溝通表達陪伴、支持與關懷最適當。(B)與(D)忽略病人當下的情緒，急於處理後續事務；(C)屬不適當的保證，易激發不切實際的期望。"},{"i":"104-2|9","e":"104-2","n":9,"c":4,"s":"（情境：大夜班巡房時，聽到盧女士於病房內哭泣，上前詢問，盧女士主訴：「今天乳房開刀切除後，我再也不是女人了。」先生在旁協助回答：「她已經哭好幾天了。」）目前最優先執行的護理活動為何？","o":["測量盧女士的生命徵象","請值班醫師開安眠藥協助盧女士入睡","了解盧女士哭泣的原因","提供盧女士乳房切除術後的相關衛教"],"a":"C","k":"C","t":"","x":"病人正處於強烈情緒反應中，應先運用治療性溝通傾聽並了解其哭泣原因與感受，鼓勵表達，才能給予適當支持。直接給安眠藥或進行衛教忽略了病人當下的情緒；此時也無生命徵象異常的跡象需優先處理。"},{"i":"104-1|8","e":"104-1","n":8,"c":4,"s":"盧小姐主訴腹部不適，聽診腸蠕動20次/分，體溫38.6℃。上述資料何者屬於症狀（symptoms）？","o":["個案主訴腹部不適","腸蠕動次數","體溫","性別"],"a":"A","k":"A","t":"","x":"症狀是不需特殊儀器或方法即可得知的身體異常，個案主訴腹部不適屬主觀症狀。腸蠕動次數需以聽診、體溫需以體溫計測量，屬於徵象；性別則為基本資料。"},{"i":"104-1|10","e":"104-1","n":10,"c":4,"s":"護理師與病人建立關係的過程，下列敘述何者正確？","o":["開始期先介紹自己並直呼病人全名或床號","工作期主要是執行病人護理計畫，病人只需被動參與","建立關係的初期就應為結束期做準備","結束期時為避免病人傷心不需特別告知病人"],"a":"C","k":"C","t":"","x":"專業性人際關係是暫時性的，在建立關係之初就應為結束期做準備，以減輕結束時的分離失落感。開始期應以姓氏加稱謂稱呼病人，不可直呼全名或床號；工作期應鼓勵病人主動參與擬訂及執行計畫；結束期須事先告知並共同評值，不可不告而別。"},{"i":"104-1|14","e":"104-1","n":14,"c":4,"s":"王先生30歲闌尾炎術後第二天，針對手術後病況，下列那項資料最需要立即通知醫師？","o":["飲食情形","排氣情形","血壓不穩定","下床情形"],"a":"C","k":"C","t":"","x":"生命徵象改變或異常、危險徵象是需要立即報告醫師的情況，術後血壓不穩定可能代表出血或休克等危險，最需立即通知醫師。飲食、排氣及下床情形屬術後一般觀察重點，可由護理師評估處理並記錄。"},{"i":"104-1|56","e":"104-1","n":56,"c":4,"s":"一位剛入院且預計明日要進行心臟手術的成年病人，他向護理師表示：「我明天可以不要接受手術嗎？」下列何項敘述最符合同理心的回應？","o":["我需要立即打電話告訴您的家人此事","您已經簽署手術同意書了，所以您須接受手術","我打電話給主治醫師，您可以和他談談","發生什麼事讓您改變心意"],"a":"D","k":"D","t":"","x":"同理心是進入病人的參考架構，了解其想法與感受，並以開放式問句鼓勵表達，詢問「發生什麼事讓您改變心意」可探索病人改變決定的原因與擔憂。立即通知家屬或醫師是轉移問題，強調已簽同意書則帶有批判，皆非同理反應。"},{"i":"103-2|8","e":"103-2","n":8,"c":4,"s":"林先生因為血糖控制不佳入院治療，此時他不但不接受護理師的關心，並對醫療人員提出諸多要求。此時護理師最合適的處理方式為何？","o":["再次進行自省以了解自己的能力","儘量滿足病患的要求以取得其信任感","在進行所有的治療或護理活動前，均先給予解釋以減輕其住院的壓力","先確認病患對治療性人際關係的期待"],"a":"C","k":"C","t":"","x":"病人剛入院處於認識期，可能出現拒絕關心、提出諸多要求的試探行為，護理師應尊重、傾聽，並於醫療措施前給予合宜解釋，以化解試探行為、建立信任，故選C。自我探索與確認病人期望屬互動前期的工作；一味滿足要求並非建立專業關係的方法。"},{"i":"103-2|9","e":"103-2","n":9,"c":4,"s":"下列何種資料不是運用「護理觀察」的技巧所收集到的客觀資料？","o":["病患的皮膚呈現蒼白的顏色","病患動脈血氧值為80mmHg","病患呼出的氣體呈現水果的氣味","病患的脈搏快且弱"],"a":"B","k":"B","t":"","x":"護理觀察是運用視、聽、觸、嗅等感官直接收集資料，如視診皮膚顏色、嗅聞呼氣的水果味、觸摸脈搏快弱。動脈血氧值需經抽血以儀器分析，由檢驗報告取得，不是運用觀察技巧收集的資料。"},{"i":"103-2|54","e":"103-2","n":54,"c":4,"s":"為維護住院病人的認同與自尊，下列措施何者正確？","o":["以床號代替入院病人姓名","開啟床旁桌要徵得病人同意","規定病人一定要穿住院病人服","執行新的治療或護理措施不需詳細解釋"],"a":"B","k":"B","t":"","x":"護理師應尊重病人的生活空間及領土權，除非病人同意或要求，才可清除或改變病人周圍環境，開啟床旁桌前應先徵得同意。稱呼病人應以姓氏加稱謂，不可以床號或病名識別；執行新的治療或護理前應詳細解釋；不宜強制規定穿病人服。"},{"i":"103-1|8","e":"103-1","n":8,"c":4,"s":"（情境：白小姐，32歲，剖腹產後入住產後病房，主訴腹痛、微喘與心悸，護理師為她測量生命徵象，並觀察到白小姐臉色蒼白，呼吸急促，整片看護墊已沾滿血液。）下列何者為主觀症狀（subjective symptoms）？","o":["心悸","呼吸數值","臉色蒼白","沾滿血液的看護墊"],"a":"A","k":"A","t":"","x":"主觀症狀是病人自己感受到、需由病人陳述才知道的現象，如疼痛、心悸、眩暈、口渴。呼吸數值需經測量而得屬徵象；臉色蒼白與沾滿血液的看護墊是別人可看見的客觀症狀。"},{"i":"102-2|10","e":"102-2","n":10,"c":4,"s":"有關觸診的敘述，下列何者正確？","o":["觸診前必須先經過病患同意","避免誤會，檢查時一律戴手套","顧及隱私，檢查時不可掀開衣物","觸診時動作應該越輕越快越好"],"a":"A","k":"A","t":"","x":"觸診屬直接觀察法，需接觸病人身體，依自主原則執行前應說明目的並取得病人同意。觸診時不一定都要戴手套（接觸血液、體液或傷口時才需要）；為觀察清楚需適度暴露檢查部位並注意遮蔽；動作應輕柔、穩定而非越輕越快。"},{"i":"102-2|15","e":"102-2","n":15,"c":4,"s":"有關以間接觀察法蒐集病患資料之敘述，下列何者錯誤？","o":["不需要接觸病患","可由病歷獲得","可觀察病患外觀獲得","可透過家屬取得"],"a":"C","k":"C","t":"","x":"間接觀察法不直接接觸病人，而是由病歷、醫囑、檢驗報告、護理記錄或家屬等其他來源取得資料。觀察病人外觀是運用視覺直接獲得資料，屬於直接觀察法，故C錯誤。"},{"i":"102-2|51","e":"102-2","n":51,"c":4,"s":"李小姐主訴最近心情很差所以都沒有吃東西，護理師的反應下列何者不當？","o":["「真的啊！那你現在一定很餓了，要不要先吃點東西？」","「你是說因為心情不好，所以會影響你吃東西的狀況？」","「你說你沒有吃東西的意思是…………」","「你可不可以再說清楚一點？」"],"a":"A","k":"A","t":"","x":"病人表達情緒低落時，A選項只回應「吃東西」而忽略病人「心情很差」的感受，屬於改變話題、忽視訊息的非治療性溝通。B為重述、C與D為澄清，可鼓勵病人進一步表達，均屬治療性會談技巧。"},{"i":"102-1|4","e":"102-1","n":4,"c":4,"s":"在專業性人際關係的工作期，護理師為了協助病人能更進一步了解自己的問題及需要，最理想的方法為何？","o":["協助病人面對及確認自己的態度和行為的一致性","告知病人必須為自己的計畫負責","讓其他病友加入討論，以確認問題所在","將互動的焦點放在疾病上面，以恢復身體健康為優先"],"a":"A","k":"A","t":"","x":"工作期病人已產生信任感，護理師可協助病人面對並確認自己的態度與行為是否一致，使病人更深入了解自己的問題與需要，進而共同解決問題。告知病人須自行負責屬說教；讓其他病友加入討論易侵犯隱私；只把焦點放在疾病上則忽略病人的整體需要。"},{"i":"102-1|11","e":"102-1","n":11,"c":4,"s":"有關治療性溝通之敘述，下列何者正確？","o":["是隨意、未加計劃的但能增加護病關係之溝通","是一種有目的、有計劃且溝通結果受益較大一方為治療者","是有時間性、有目的、有計劃的溝通，而溝通結果受益者為個案","是一經謹慎計劃、構思且以滿足工作效率為主之溝通"],"a":"C","k":"C","t":"","x":"治療性溝通是護理師與病人之間有目標、有計畫、有時間限制的互動，以病人的需要為中心，溝通結果的受益者為病人。隨意、未經計畫的溝通屬社交性溝通；以治療者受益或以工作效率為主的溝通，皆不符合治療性溝通以病人為中心的特性。"},{"i":"102-1|55","e":"102-1","n":55,"c":4,"s":"陳小姐向護理師表示很害怕一個人住院，下列處置何者適宜？","o":["瞭解並確認陳小姐所害怕擔心的事情","告訴陳小姐既然已經住院就不需要想太多","使用醫學術語顯示專業，以取得陳小姐的信任感","對於新的治療與護理措施以簡單方式說明"],"a":"A","k":"A","t":"","x":"病人表示害怕一個人住院時，護理師應先以同理與開放式詢問了解並確認其害怕擔心的具體事情，才能給予適當的處理與支持。告訴她不需要想太多屬於忽視感受的非治療性回應；使用醫學術語會造成溝通障礙；簡單說明治療措施雖有幫助，但並未處理她的害怕情緒。"},{"i":"102-1|68","e":"102-1","n":68,"c":4,"s":"有關溝通的敘述，下列何者是完全正確的？①溝通是一種過程 ②溝通不受噪音的干擾 ③溝通是訊息的傳遞 ④溝通可以運用語言及非語言傳遞訊息","o":["①②③","①②④","①③④","②③④"],"a":"C","k":"C","t":"","x":"溝通是一種有意義的互動過程（①），將事實、思想、感情等訊息傳遞給另一個人或團體（③），並可藉由語言及非語言的途徑傳遞訊息（④）。溝通容易受到環境噪音、吵雜或不夠隱密等因素干擾，因此「溝通不受噪音的干擾」錯誤，故②不正確。"},{"i":"101-2|1","e":"101-2","n":1,"c":4,"s":"唐女士因發現左側乳房有硬塊，入院接受進一步檢查，因擔心檢查結果而失眠，針對唐女士心理狀況，下列何項護理措施較不合適？","o":["向個案說明不需要擔心太多，治療成功例子很多","請醫療團隊向個案說明目前疾病進展狀態","提供曾接受疾病治療之病友分享治療經驗","請家屬多陪伴個案提供心理支持"],"a":"A","k":"A","t":"","x":"告訴病人「不需要擔心太多，治療成功例子很多」屬於不適當的保證，對非護理師能控制的結果給予安撫，會激發不切實際的期望，也忽略了病人的感受。由醫療團隊說明病情、安排病友分享經驗、請家屬陪伴提供心理支持，皆有助於減輕病人的焦慮。"},{"i":"101-2|8","e":"101-2","n":8,"c":4,"s":"（情境：溫小姐，35歲，主訴解尿時疼痛、會陰部有燒灼感、憂慮緊張，外觀臉色潮紅，入院治療。）下列何者為客觀症狀（objective symptom）？","o":["解尿疼痛","臉色潮紅","憂慮緊張","會陰部有燒灼感"],"a":"B","k":"B","t":"","x":"客觀症狀（他覺症狀）是指他人可察覺到病人所發生的現象，如紅、腫、臉色蒼白或潮紅等，臉色潮紅屬之。解尿疼痛、憂慮緊張、會陰部燒灼感皆為病人自己感受到的現象，屬於主觀症狀（自覺症狀）。"},{"i":"101-2|15","e":"101-2","n":15,"c":4,"s":"王小姐罹患卵巢腫瘤，護理師替她量vital signs時，王小姐問：「醫師何時會來查房？」，下列護理師的回應何者適當？","o":["「等我量完所有病人血壓後再告訴您」","「醫師目前在開刀，不會來查房」","「您找醫師有甚麼事嗎？」","立刻打手機給醫師，請病患直接和醫師用電
