時，由尿道口沿導管往外擦拭，並避免拉扯導管","沖洗時先將導尿管往外拉出少許以利清潔"],"a":"C","k":"C","t":"","x":"留置導尿管者會陰清潔時，應由尿道口開始沿導管往外擦拭，使污染物遠離尿道口，並避免拉扯以免損傷尿道。由遠端往尿道口擦會把細菌帶入；尿道口處更需清潔；拉出導管會造成損傷與污染。"},{"i":"gch5-41","e":"","n":0,"c":5,"s":"產後婦女會陰沖洗完畢，護理師協助更換產墊，下列何者正確？","o":["產墊由後往前放置，以免移位","手持產墊外側，由前往後放置，避免碰觸產墊內面","沾有少量惡露的產墊可整理後重複使用","放置前先以手觸摸內面，確認柔軟度"],"a":"B","k":"B","t":"","x":"放置產墊時應手持外側、由前往後放置，避免將肛門處細菌帶往陰道口，也避免污染接觸會陰的內面。由後往前放會造成污染；使用過的產墊不可重複使用；觸摸內面會污染產墊。"},{"i":"gch5-42","e":"","n":0,"c":5,"s":"王太太自然產後第一天，護理師為其執行會陰沖洗時，下列觀察重點何者最適當？","o":["腸蠕動音是否恢復","下肢肌力分級","瞳孔大小及對光反射","惡露的量、顏色、氣味及會陰傷口有無紅腫滲液"],"a":"D","k":"D","t":"","x":"產後會陰沖洗時，可同時觀察惡露的量、顏色與氣味，以及會陰切開傷口有無紅腫、滲液或血腫，及早發現出血或感染。腸蠕動音、肌力與瞳孔並非會陰沖洗時的觀察重點。"},{"i":"gch5-43","e":"","n":0,"c":5,"s":"為男性病人執行會陰清潔，下列何者正確？","o":["包皮不需翻開，只清洗外表","由陰囊往尿道口方向環形擦拭","清洗後包皮維持翻開以利通風乾燥","將包皮往後推，由尿道口向外環形清洗，完成後將包皮推回原位"],"a":"D","k":"D","t":"","x":"男性會陰清潔需將包皮後推，由尿道口向外環形清洗龜頭，完成後一定要將包皮推回，以免造成包皮嵌頓、龜頭水腫。不翻開包皮無法清除包皮垢；由陰囊往尿道口擦會把污染帶向尿道口。"},{"i":"gch5-44","e":"","n":0,"c":5,"s":"為月經期間臥床的女性病人執行會陰護理，下列何者最適當？","o":["觀察經血量與性狀，清潔後由前往後放置新的衛生棉","月經期間暫停會陰清潔，以免引起感染","以50℃以上熱水沖洗，以緩解經痛","衛生棉由肛門側往前放置"],"a":"A","k":"A","t":"","x":"月經期間經血易滋生細菌，更需定期會陰清潔，並觀察經血量與性狀，清潔後由前往後放置衛生棉。暫停清潔反而增加感染與異味；水溫過高易燙傷會陰；由後往前放置會將肛門細菌帶到陰道口。"},{"i":"gch5-45","e":"","n":0,"c":5,"s":"會陰沖洗完畢後的處理，下列何者錯誤？","o":["以衛生紙或棉棒由前往後拭乾","移除便盆後觀察臀部皮膚狀況","協助穿好褲子並恢復舒適姿勢","保留會陰部潮濕，以減少皮膚摩擦"],"a":"D","k":"D","t":"","x":"沖洗後應由前往後將會陰部拭乾，因潮濕環境易滋生細菌並使皮膚浸潤破損，故保留潮濕錯誤。移除便盆後觀察薦尾部皮膚有無受壓發紅，並協助穿衣、恢復舒適姿勢，均為正確的後續處理。"},{"i":"gch5-46","e":"","n":0,"c":5,"s":"為預防長期仰臥病人發生足跟壓力性損傷，下列措施何者最適當？","o":["於足跟下直接墊硬毛巾","小腿下墊枕，使足跟稍微懸空離開床面","以圈狀氣圈套於足跟","使足底緊貼床尾欄杆"],"a":"B","k":"B","t":"","x":"於小腿下墊枕使足跟懸空，可完全解除足跟壓力，並注意膝部微彎、勿壓迫膝膕。硬毛巾仍使足跟受壓；圈狀氣圈會使圈內組織循環受阻，不建議使用；足底緊貼床尾欄杆易造成足部受壓損傷。"},{"i":"gch5-47","e":"","n":0,"c":5,"s":"下列哪一位病人最不適合採取膝胸臥式？","o":["患有心臟衰竭的老年人","胎位不正的孕婦","欲矯正子宮後傾的婦女","需接受乙狀結腸鏡檢查者"],"a":"A","k":"A","t":"","x":"膝胸臥式使胸部受壓、頭部低垂，易造成呼吸困難與心臟負荷增加，老年人或心肺功能不佳者不宜採用。此姿勢可用於矯正胎位不正、子宮後傾，以及乙狀結腸鏡等直腸檢查。"},{"i":"gch5-48","e":"","n":0,"c":5,"s":"病人長期採側臥，下列何者為易受壓部位？①耳廓 ②肩峰突 ③股骨大粗隆 ④外踝 ⑤枕骨","o":["①②③④","②③⑤","①③⑤","②④⑤"],"a":"A","k":"A","t":"","x":"側臥時身體側面承重，易受壓部位包括耳廓、肩峰突、肋骨、腸骨嵴、股骨大粗隆、膝部內外側及內外踝。枕骨為仰臥時的主要受壓部位，側臥時通常不直接受壓，故含⑤的選項皆不正確。"},{"i":"gch5-49","e":"","n":0,"c":5,"s":"協助病人採左側辛氏臥式（Sims' position），下列敘述何者正確？","o":["左側臥，左臂置於身後，右腿屈髖屈膝靠向腹部","右側臥，左腿彎曲置於前方","左側臥，兩腿伸直上下重疊","俯臥，雙膝跪於床上"],"a":"A","k":"A","t":"","x":"左側辛氏臥式又稱半俯臥式，病人左側臥並稍向前傾，下側左臂置於身後，右臂屈曲於前，右腿屈髖屈膝靠向腹部，左腿微彎。右側臥方向錯誤；兩腿伸直重疊非此姿勢；雙膝跪床為膝胸臥式。"},{"i":"gch7-0","e":"","n":0,"c":7,"s":"有關單一劑量系統（unit dose system）的敘述，下列何者正確？","o":["可明顯減輕藥師調劑與核對的工作負擔","藥物依每次劑量個別包裝，為國內多數醫院採用","主要適用於預出院病人自行保管與服用藥物","醫囑更改藥物時不會產生退藥或藥物汙染問題"],"a":"B","k":"B","t":"","x":"單一劑量系統將每次劑量個別包裝配送，是國內多數醫院採用的方式。其缺點是增加藥師負擔，且醫囑更改時會造成退藥與藥物汙染；讓預出院或長期服藥病人自行保管服用者為自我給藥系統。"},{"i":"gch7-1","e":"","n":0,"c":7,"s":"某醫院病房設置「自動化調劑藥櫃（automated dispensing cabinets; ADCs）」，下列何者為其主要特色？","o":["以電腦控制藥物的儲存及發放，並監控、追蹤護理人員的給藥情形","由病人自行保管一週份藥物，按時自行服用","病房大量庫存常用藥，護理師可自由取用不需紀錄","由藥局將每次劑量個別包裝後送至病房藥車"],"a":"A","k":"A","t":"","x":"自動化調劑藥櫃又稱智慧藥櫃，以電腦控制藥物儲存與發放，並可監控追蹤護理人員給藥。病人自行保管服用為自我給藥系統；病房大量存藥為庫存給藥系統；每次劑量個別包裝配送為單一劑量系統。"},{"i":"gch7-2","e":"","n":0,"c":7,"s":"有關藥物保存方式，下列何者最不適當？","o":["未開封的胰島素置於2～8℃冰箱冷藏","疫苗置於15～30℃室溫中避光保存","未開封的乾燥粉劑藥物存放於15～30℃室溫","稀釋後的抗生素藥液置於2～8℃冰箱冷藏"],"a":"B","k":"B","t":"","x":"疫苗與油劑、栓劑、開封後的肝素、稀釋後的藥物、未開封的胰島素一樣，應置於2～8℃冰箱冷藏，放在室溫會降低效價。一般藥物及未開封的乾燥藥物則保存於15～30℃即可。"},{"i":"gch7-3","e":"","n":0,"c":7,"s":"陳先生出院後在家自行注射胰島素筆，詢問「正在使用的那一支」如何保存，下列衛教何者最適當？","o":["開封後須於24小時內用完，剩餘的丟棄","可放在汽車儀表板上，方便隨時取用","應放冷凍庫保存，以維持藥效","短期可放在低於30℃的室溫下，並避免陽光直射"],"a":"D","k":"D","t":"","x":"使用中的胰島素短期可在低於30℃的室溫下保存，但須避免陽光直射；未開封者才需冷藏於2～8℃。胰島素不可冷凍，冷凍會使其變質；車內儀表板高溫且日曬，也不適合存放。"},{"i":"gch7-4","e":"","n":0,"c":7,"s":"病人住院期間使用的眼藥水，開瓶後最多可保存多久？","o":["1個月","6個月","3個月","1年"],"a":"A","k":"A","t":"","x":"眼藥水、口服液等滴劑或液劑開瓶後最多保存1個月，以免受汙染或變質。口服藥或藥膏最多保存3～6個月，所以3個月與6個月是固態或膏狀藥物的期限，1年則超出建議時間。"},{"i":"gch7-5","e":"","n":0,"c":7,"s":"有關管制藥品的管理，下列何者正確？","o":["存放於兩道鎖藥櫃，專人保管鑰匙並雙重核對","麻醉藥品只需標示級數，不需額外加註","級數越高表示成癮性越高、管理越嚴格","管制藥品依成癮性分為三級管理"],"a":"A","k":"A","t":"","x":"管制藥品應存放於兩道鎖藥櫃，由專人保管鑰匙並雙重核對。管制藥品分四級管理，級數越低成癮性越高；瓶身與外盒須清楚標示分級，麻醉藥品還須加註「麻」字。"},{"i":"gch7-6","e":"","n":0,"c":7,"s":"護理師以掃描器掃描藥袋上的條碼，讀出醫院資訊系統中的給藥紀錄，確定無誤後從藥袋取出該時段藥物放入藥杯。此步驟屬於「三讀」中的哪一讀？","o":["第一讀","第三讀","第二讀","給藥後的再確認"],"a":"C","k":"C","t":"","x":"第一讀是從藥車取出藥袋時核對並讀出給藥紀錄；第二讀是掃描藥袋條碼、讀出給藥紀錄，確認後取出該時段藥物放入藥杯；第三讀則是剩餘藥物放回藥盒或丟棄藥袋時再核對一次。"},{"i":"gch7-7","e":"","n":0,"c":7,"s":"護理師發藥給病人時確認病人身分，下列做法何者最適當？","o":["請病人說出姓名及出生年月日並核對手圈","呼叫床號，病人有回應即可給藥","只看床頭卡上的姓名即給藥","詢問在旁家屬該床是否為病人本人即可"],"a":"A","k":"A","t":"","x":"給藥時應至少以兩種方式確認病人，例如姓名、出生年月日，並核對手圈或床頭卡資料。只靠床號回應、家屬口頭確認或單看床頭卡，都只用一種方式，也無法排除換床或聽錯的風險。"},{"i":"gch7-8","e":"","n":0,"c":7,"s":"醫囑：levothyroxine 50 mcg PO QD，藥局提供的錠劑每顆含 0.1 mg，護理師每次應給予幾顆？","o":["1/4 顆","1/2 顆","1 顆","2 顆"],"a":"B","k":"B","t":"","x":"1 mg＝1,000 mcg，所以0.1 mg＝100 mcg。醫囑50 mcg÷100 mcg/顆＝1/2顆。若誤以為0.1 mg等於10 mcg或沒有換算單位，就會算出2顆或1顆等錯誤劑量。給藥前須確認單位一致。"},{"i":"gch7-9","e":"","n":0,"c":7,"s":"醫囑：cefazolin 1 g IV drip q6h，藥局提供 cefazolin 500 mg/vial，病人一天共需使用幾個 vial？","o":["2 個","4 個","8 個","12 個"],"a":"C","k":"C","t":"","x":"每次劑量1 g＝1,000 mg，需500 mg/vial×2瓶；q6h代表一天給藥4次，所以2瓶×4次＝8瓶。2瓶只是單次用量；4瓶是誤把一次用一瓶；12瓶則是誤以為一天給藥6次。"},{"i":"gch7-10","e":"","n":0,"c":7,"s":"下列何者屬於以「協助診斷」為目的的給藥？","o":["使用解熱鎮痛劑退燒","執行結核菌素皮膚試驗","注射流感疫苗","服用降血壓藥物"],"a":"B","k":"B","t":"","x":"結核菌素皮膚試驗是用來測試體內是否曾感染結核菌或接種過疫苗而產生抗體，屬於協助診斷。注射疫苗是預防疾病；降血壓藥是治療疾病；解熱鎮痛劑退燒則是減輕症狀。"},{"i":"gch7-11","e":"","n":0,"c":7,"s":"病人吞藥較困難，家屬想把醫囑的Dulcolax腸衣錠磨成粉再給病人吃，護理師的回應何者最適當？","o":["不宜磨粉，磨粉後藥物會延遲到大腸才被吸收","可以磨粉，但須與牛奶一起服用以保護胃","不宜磨粉，因其在胃酸中不穩定，需到小腸才釋放","可以磨粉，磨粉後吸收較快且效果較好"],"a":"C","k":"C","t":"","x":"Dulcolax在胃酸中極不穩定，因此製成腸衣錠，讓藥物到達小腸才釋放，不宜磨粉或咬碎。磨粉會破壞腸衣，使藥物提早在胃中崩散而受破壞，並增加刺激，不是延遲到大腸吸收；與牛奶併服也無法彌補。"},{"i":"gch7-12","e":"","n":0,"c":7,"s":"有關口服藥物劑型的吸收速度，下列排列由快至慢何者正確？","o":["軟膠囊＞懸液劑＞錠劑","懸液劑＞溶液＞粉劑","錠劑＞溶液＞硬膠囊","溶液＞粉劑＞硬膠囊"],"a":"D","k":"D","t":"","x":"口服劑型的吸收速度由快至慢依序為：溶液＞懸液劑＞粉劑＞軟膠囊＞錠劑＞硬膠囊。溶液不需崩散溶解，所以最快；硬膠囊最慢。其餘選項把錠劑排在溶液前、懸液劑排在溶液前，或軟膠囊排在懸液劑前，都不正確。"},{"i":"gch7-13","e":"","n":0,"c":7,"s":"一般給藥途徑在體內循環的速率，下列由快至慢的排列何者正確？","o":["口服給藥＞皮下注射＞經皮吸收","皮下注射＞肌肉注射＞直腸給藥","吸入法＞舌下含服＞肌肉注射","舌下含服＞吸入法＞靜脈注射"],"a":"C","k":"C","t":"","x":"各途徑的速率由快至慢為：靜脈注射＞吸入法＞舌下含服＞直腸給藥＞肌肉注射＞皮下注射＞口服給藥＞經皮吸收。靜脈注射最快，不會排在最後；肌肉注射比皮下注射快，直腸給藥又比兩者快；口服比皮下注射慢。"},{"i":"gch7-14","e":"","n":0,"c":7,"s":"長期使用類固醇的病人出現月亮臉、水牛肩等庫欣氏症候群表現，此屬於下列何種藥物作用？","o":["副作用","耐受性","治療作用","交互作用"],"a":"A","k":"A","t":"","x":"類固醇引起庫欣氏症候群，是治療以外非預期的不良反應，屬於副作用或毒性作用。治療作用是指達到期待的生理反應；交互作用發生在同時使用兩種以上藥物；耐受性則是藥效減弱、需增加劑量。"},{"i":"gch7-15","e":"","n":0,"c":7,"s":"癌末病人長期使用嗎啡止痛，近來原劑量的止痛效果明顯減弱，需逐漸增加劑量才能達到原來的效果，此現象稱為：","o":["耐受性（tolerance）","習慣性（habituation）","成癮性（addiction）","過敏反應（allergy）"],"a":"A","k":"A","t":"","x":"長期用藥後藥效反應減弱，需逐漸增加劑量才能達到原來效果，稱為耐受性。成癮性是停藥後出現戒斷症狀的生理依賴；習慣性偏向心理上的依賴；過敏反應則是免疫反應，與劑量需求增加無關。"},{"i":"gch7-16","e":"","n":0,"c":7,"s":"某藥物的成人劑量為每次 250 mg，72 歲的老年病人若依一般老年用藥原則調整，每次劑量約為多少？","o":["125 mg","200 mg","225 mg","250 mg"],"a":"B","k":"B","t":"","x":"60～80歲老年人的用藥劑量通常為成人劑量的4/5，所以250 mg×4/5＝200 mg。125 mg是成人劑量的1/2，適用於80歲以上老年人；250 mg則是未依年齡調整的成人劑量。"},{"i":"gch7-17","e":"","n":0,"c":7,"s":"有關依年齡考量藥物劑量的敘述，下列何者正確？","o":["12歲以上兒童可開始酌用成人劑量","楊氏法則（Young's rule）適用於1歲以下嬰兒","依年齡計算是小兒劑量最精準的方法","嬰幼兒肝腎功能已成熟，只要依體重比例減量即可"],"a":"A","k":"A","t":"","x":"12歲以上兒童可開始酌用成人劑量。楊氏法則適用於1歲以上、14歲以下兒童；小兒劑量以依體表面積計算最精準。嬰幼兒肝腎功能尚未成熟，給藥須綜合考量年齡、體重、身高與體表面積。"},{"i":"gch7-18","e":"","n":0,"c":7,"s":"某藥成人劑量為 600 mg，一名體重 15 公斤的兒童，依克拉克法則（Clark's rule）計算，其劑量應為多少？（1 公斤＝2.2 磅）","o":["60 mg","132 mg","180 mg","264 mg"],"a":"B","k":"B","t":"","x":"克拉克法則：兒童劑量＝兒童體重（磅）÷150×成人劑量。15公斤×2.2＝33磅，所以33÷150×600＝132 mg。若沒有把公斤換算成磅，直接用15÷150×600，就會得到錯誤的60 mg。"},{"i":"gch7-19","e":"","n":0,"c":7,"s":"某藥成人劑量為 450 mg，6 歲兒童依楊氏法則（Young's rule）計算，劑量應為多少？","o":["112.5 mg","150 mg","180 mg","225 mg"],"a":"B","k":"B","t":"","x":"楊氏法則：兒童劑量＝年齡÷（年齡＋12）×成人劑量。6÷（6＋12）×450＝1/3×450＝150 mg。若誤把分母寫成年齡＋18，會算出112.5 mg；若直接取成人劑量的一半，則是225 mg，都不正確。"},{"i":"gch7-20","e":"","n":0,"c":7,"s":"醫囑：ampicillin 750 mg IV q6h，現有 ampicillin 1 g/vial 粉劑，注入稀釋液 4 mL 溶解後，應抽取多少 mL？","o":["1.5 mL","2 mL","3 mL","3.5 mL"],"a":"C","k":"C","t":"","x":"1 g＝1,000 mg溶於4 mL，濃度為250 mg/mL。所需劑量750 mg÷250 mg/mL＝3 mL，也可列式x mL：750 mg＝4 mL：1,000 mg，得x＝3。2 mL只含500 mg，1.5 mL只含375 mg，都不足。"},{"i":"gch7-21","e":"","n":0,"c":7,"s":"有關影響藥物作用的因素，下列敘述何者正確？①一般女性用藥量較男性少 ②懷孕期用藥可能經胎盤影響胎兒 ③體型較大者所需藥量較少 ④口服藥物吸收最緩，所需劑量通常最大","o":["①②③","①②④","①③④","②③④"],"a":"B","k":"B","t":"","x":"一般女性用藥量較男性少；懷孕或哺乳期間，藥物可能經胎盤或乳汁影響胎兒、嬰兒；口服藥物吸收最緩，所需劑量通常最大，所以①②④正確。③錯誤，體型較大者所需藥量應增加。"},{"i":"gch7-22","e":"","n":0,"c":7,"s":"醫囑開立Statin類降血脂藥物每日一次，下列給藥時間何者效果最佳？","o":["早餐前","睡前","下午點心時間","午餐後"],"a":"B","k":"B","t":"","x":"Statin類降血脂藥物適合在睡前投予，因為膽固醇在夜間合成最多，此時給藥效果最佳。早餐前、午餐後或下午給藥，藥物作用高峰無法與夜間膽固醇合成高峰配合，療效較差。"},{"i":"gch7-23","e":"","n":0,"c":7,"s":"化學治療病人醫囑口服止吐藥，為達最佳效果，護理師應於何時給藥？","o":["飯後立即","飯前30分鐘","飯後2小時","睡前30分鐘"],"a":"B","k":"B","t":"","x":"胃黏膜保護劑與止吐藥建議於飯前30分鐘使用，讓藥物在進食前發揮作用，以減少噁心嘔吐、保護胃黏膜。飯後或睡前給藥時，進食引發的噁心嘔吐已經出現，難以達到預防效果。"},{"i":"gch7-24","e":"","n":0,"c":7,"s":"糖尿病病人近日食慾差、進食時間不固定，醫囑為飯前皮下注射速效胰島素，護理師最適當的做法為何？","o":["不論是否進食，都依原訂時間準時注射","自行將胰島素劑量減半後注射","改在睡前注射以避開用餐時間","確認病人已進食後再給予，避免發生低血糖"],"a":"D","k":"D","t":"","x":"胰島素與降血糖藥一般在飯前使用；若病人進食時間不穩定，可確認已進食後再給予，避免低血糖。不顧進食照常注射容易造成低血糖；護理師不可自行改變劑量或給藥時間，須依醫囑或與醫師討論。"},{"i":"gch7-25","e":"","n":0,"c":7,"s":"護理師衛教病人服用液態鐵劑，下列何者最不適當？","o":["若腸胃不適，應改為空腹服用","以吸管服用，減少接觸牙齒","服用後漱口或清潔口腔","將鐵劑加水稀釋後服用"],"a":"A","k":"A","t":"","x":"鐵劑空腹服用效果較好，但容易造成腸胃不適，此時應建議與食物一起服用以減輕刺激，而不是改為空腹。液態鐵劑容易使牙齒染色或損傷琺瑯質，因此應稀釋並以吸管服用，服後漱口或清潔口腔。"},{"i":"gch7-26","e":"","n":0,"c":7,"s":"下列哪一位病人最適合經口服途徑給藥？","o":["明天手術、目前禁食中的病人","意識不清、昏迷的腦中風病人","持續劇烈嘔吐的腸胃炎病人","意識清醒、吞嚥正常的高血壓病人"],"a":"D","k":"D","t":"","x":"口服給藥方便、經濟、危險性低，適合出院後及居家使用，意識清醒且吞嚥正常者最適合。禁食中、持續或劇烈嘔吐、吞嚥困難、昏迷或意識不清，以及拒絕口服者，都不適合給予口服藥物。"},{"i":"gch7-27","e":"","n":0,"c":7,"s":"病人服用含薄荷腦、甘草成分的咳嗽糖漿後，護理師的衛教何者最適當？","o":["應將糖漿以開水稀釋一倍後服用","服藥後立即喝大量溫開水沖淡甜味","服藥後30分鐘內暫時不要喝水","與牛奶一起服用以減少喉嚨刺激"],"a":"C","k":"C","t":"","x":"咳嗽糖漿要在咽喉黏膜形成保護而發揮療效，與開水併服可能降低療效，所以建議服藥後30分鐘內暫勿飲水。糖漿類本來就不需要配開水，稀釋或喝大量水、配牛奶，反而會沖淡藥物，降低效果。"},{"i":"gch7-28","e":"","n":0,"c":7,"s":"病人同時服用中藥與西藥，護理師建議兩者間隔多久服用較適宜？","o":["4～6小時","30分鐘","10～15分鐘","1～2小時"],"a":"D","k":"D","t":"","x":"中藥與西藥間隔1～2小時服用較適宜，以減少可能的交互作用。30分鐘是有交互作用的兩種西藥建議的間隔時間；10～15分鐘間隔太短，無法避免交互作用；4～6小時則間隔過長，會打亂原本的給藥時間。"},{"i":"gch7-29","e":"","n":0,"c":7,"s":"護理師指導母親餵6個月大嬰兒口服藥水，下列何者最不適當？","o":["以口服給藥器抽取精確劑量","抬高嬰兒頭部，將藥水沿口腔頰側慢慢給予","每次少量給予，待嬰兒吞下後再繼續","將藥水加入整瓶配方奶中，讓嬰兒喝奶時一起服下"],"a":"D","k":"D","t":"","x":"嬰幼兒給藥應避免把藥物混入母奶或配方奶中餵食，因為奶若沒有喝完，藥量就不足，嬰兒也可能因此拒奶。以給藥器精確抽取劑量、抬高頭部並沿頰側少量慢慢給予，可減少嗆到，都是適當做法。"},{"i":"gch7-30","e":"","n":0,"c":7,"s":"病人需服用蓖麻油（castor oil），下列何種方法最能減輕服藥時的不適感？","o":["先將藥物冷卻，或口含冰塊麻痺味覺","先將藥物加熱，使其較易吞嚥","請病人含在口中片刻再慢慢吞下","將藥物加入大量溫開水中稀釋"],"a":"A","k":"A","t":"","x":"油類藥物如蓖麻油味道與口感不佳，可先冷卻藥物或讓病人口含冰塊麻痺味覺，減輕不適。加熱會使氣味更明顯；油類藥物不需配開水，也不易與水混合；含在口中會延長接觸味蕾的時間，讓不適加重。"},{"i":"gch7-31","e":"","n":0,"c":7,"s":"護理師衛教服用抗組織胺藥物的病人避免食用葡萄柚，主要是因為兩者併用會：","o":["增加心臟加速的風險","使牙齒染色","造成低血糖","降低胃酸分泌而影響消化"],"a":"A","k":"A","t":"","x":"抗組織胺藥物與葡萄柚併用，會影響藥物代謝而提高血中濃度，增加心臟加速的風險，所以應避免。牙齒染色常見於鐵劑、碘劑；低血糖常見於胰島素與降血糖藥；兩者併用並不會降低胃酸分泌。"},{"i":"gch7-32","e":"","n":0,"c":7,"s":"護理師準備給予病人digoxin前測量心尖脈，測得56次/分，下列處置何者最適當？","o":["改測橈動脈脈搏，若高於60次/分即給藥","將劑量減半後給予","照常給藥，30分鐘後再測一次","暫停給藥，並通知醫師"],"a":"D","k":"D","t":"","x":"digoxin治療劑量範圍狹窄，給藥前須監測心尖脈，心跳大於60次/分才能給藥。心尖脈56次/分應暫停給藥並通知醫師。照常給藥可能使心跳更慢；護理師不可自行減量；改測橈動脈也不能取代心尖脈。"},{"i":"gch7-33","e":"","n":0,"c":7,"s":"王先生胸悶疑似心絞痛發作，醫囑舌下含服NTG，下列護理措施何者正確？","o":["未改善可隔15分鐘再含1顆，直到疼痛緩解","採坐姿；未改善可隔5分鐘再含1顆，最多3顆","協助下床走動，促進血液循環以加速吸收","將藥錠以開水吞服，以免含在口中刺激黏膜"],"a":"B","k":"B","t":"","x":"舌下含服NTG可於2～5分鐘內作用，但可能造成低血壓，應採坐姿避免跌倒。症狀未改善時，間隔5分鐘可再含第2顆，最多連續3顆。吞服會失去舌下快速吸收的效果；下床走動容易跌倒；不可不限次數持續使用。"},{"i":"gch7-34","e":"","n":0,"c":7,"s":"病人口腔有白色念珠菌感染，醫囑Mycostatin懸液劑，下列給藥方式何者最適當？","o":["倒入口中後立即吞下，以免苦味","經鼻胃管直接灌入，療效相同","請病人將藥液含在口中約5分鐘後再吞下","服藥後立即喝大量開水沖淡藥味"],"a":"C","k":"C","t":"","x":"Mycostatin主要藉由接觸口腔黏膜治療口中念珠菌，應口含約5分鐘後再吞下。立即吞下或馬上喝水，接觸時間不足；經鼻胃管灌入則完全不經過口腔，會失去主要療效。"},{"i":"gch7-35","e":"","n":0,"c":7,"s":"下列哪一種口服藥物最適合磨粉溶於溫水後，經鼻胃管灌入？","o":["一般非緩釋的普通錠劑","膨脹型緩瀉劑（如metamucil）","緩釋型（持續性藥效）錠劑","腸衣錠"],"a":"A","k":"A","t":"","x":"一般普通錠劑可磨粉溶於溫水後經鼻胃管灌入。緩釋劑型與腸衣錠磨粉後會加速吸收，增強藥性與副作用；膨脹型緩瀉劑加水後可能硬化而阻塞鼻胃管，所以都不適合經鼻胃管給予。"},{"i":"gch7-36","e":"","n":0,"c":7,"s":"經鼻胃管給藥時，給藥前後應以多少溫開水灌洗鼻胃管，避免藥物難以灌入或殘留？","o":["20～30 mL","100 mL以上","50～60 mL","5～10 mL"],"a":"A","k":"A","t":"","x":"鼻胃管給藥時，將藥物磨粉溶於溫水後依一般灌食方式灌入，前後各以20～30 mL溫開水灌洗，避免藥物難以灌入或殘留管內。5～10 mL量太少，不足以沖淨管路；50 mL以上則量過多，增加胃部負擔。"},{"i":"gch7-37","e":"","n":0,"c":7,"s":"病人需同時接受兩種不同藥物的肌肉注射，下列做法何者正確？","o":["注射於同一部位，間隔0.5吋即可","以同一針孔先後推入兩種藥物","分別注射於不同部位，兩處至少間隔1～2吋","將兩種藥物抽入同一支空針混合後注射"],"a":"C","k":"C","t":"","x":"同時注射兩種不同藥物時，應分開在不同部位注射，至少間隔1～2吋，避免互相影響或局部刺激。肌肉注射時兩種液態藥劑不可混合在同一空針；間隔0.5吋過近；同一針孔先後推藥則等於在同一處混合。"},{"i":"gch7-38","e":"","n":0,"c":7,"s":"護理師需肌肉注射較黏稠的藥物，針頭選擇何者最適當？","o":["號碼較大、直徑較細的針頭","號碼較小、直徑較細的針頭","號碼較小、直徑較粗的針頭","號碼較大、直徑較粗的針頭"],"a":"C","k":"C","t":"","x":"針頭號碼越大，尺寸越小（越細）；反過來說，號碼越小，直徑越粗。藥物越黏稠，越需要選號碼小、直徑粗的針頭，才容易抽藥與推注。號碼大的針頭較細，推黏稠藥物阻力大；號碼小又細的組合並不存在。"},{"i":"gch7-39","e":"","n":0,"c":7,"s":"執行肌肉注射時，皮膚消毒方式何者正確？","o":["75%酒精由內向外環形消毒3吋，待乾","以75%酒精由外向內環形消毒1吋後立即注射","以優碘由外向內環形消毒2吋","以碘酒來回擦拭注射部位"],"a":"A","k":"A","t":"","x":"肌肉注射以75%酒精由內向外環形消毒3吋，並待其乾燥，不可使用優碘或碘酒。由外向內消毒會把外圍細菌帶回注射中心；消毒範圍不足或未等乾燥就注射，會降低消毒效果並增加刺痛。"},{"i":"gch7-40","e":"","n":0,"c":7,"s":"有關肌肉注射的注射量，下列何者正確？","o":["成人與兒童一律以0.1 mL為限","成人最多不超過1.5 mL，兒童不超過1 mL","成人最多不超過5 mL，兒童不超過2 mL","成人最多不超過10 mL，兒童不超過5 mL"],"a":"C","k":"C","t":"","x":"肌肉注射量一般為1～3 mL，成人最多不超過5 mL，兒童不超過2 mL。1.5 mL是皮下注射的上限；0.1 mL是皮內注射的量；成人10 mL、兒童5 mL則超出肌肉組織可容納的量，會造成疼痛與組織傷害。"},{"i":"gch7-41","e":"","n":0,"c":7,"s":"護理師執行肌肉注射，下針後回抽發現針筒內有回血，下列處置何者最適當？","o":["將針頭稍微退出約1/4後即可繼續推藥","將血液推回後換部位以同一支空針重打","繼續緩慢推藥，回血不影響藥效","立即拔針，更換一套新的藥物與空針重打"],"a":"D","k":"D","t":"","x":"肌肉注射回抽有回血，表示針頭插入血管，應立即拔出，並更換一套新的藥物與空針重新施打。直接推藥會讓藥物進入血管；稍微退針不一定能確保離開血管；混有血液且已汙染的空針也不可重複使用。"},{"i":"gch7-42","e":"","n":0,"c":7,"s":"護理師為5歲病童執行肌肉注射，有關推藥速度何者最適當？","o":["先快後慢，最後停留30秒再拔針","與成人相同，一律緩慢推藥","應極緩慢推藥，每1 mL至少推1分鐘","可較快速推藥，以減少針頭停留於組織的時間"],"a":"D","k":"D","t":"","x":"兒童肌肉注射時推藥宜快，減少針頭停留組織的時間，降低病童掙扎造成的傷害；成人則宜緩慢推藥以減輕組織疼痛。兒童不宜比照成人緩慢推藥；先快後慢再停留，則會延長針頭留在組織中的時間。"},{"i":"gch7-43","e":"","n":0,"c":7,"s":"有關肌肉注射可能發生的併發症，下列何者正確？①背臀肌注射位置不當可能損傷坐骨神經 ②穿刺太深可能傷及骨膜導致骨膜炎 ③穿刺誤入血管可能造成血腫 ④注射後揉按注射部位是造成坐骨神經損傷的主因","o":["①②","②③④","①②③","①③④"],"a":"C","k":"C","t":"","x":"背臀肌注射部位不當可能傷及坐骨神經，造成肌肉萎縮或變形；穿刺太深可能傷及骨膜而引發骨膜炎；誤入血管則可造成血腫，所以①②③正確。④錯誤，坐骨神經損傷是注射部位不當造成的，肌肉注射後揉按反而可促進吸收、減輕疼痛。"},{"i":"gch7-44","e":"","n":0,"c":7,"s":"有關成人肌肉注射的下針方式，下列何者正確？","o":["針頭與皮膚呈45度下針，針頭沒入1/2吋","針頭斜面朝上，與皮膚呈15度下針","針頭與皮膚呈90度下針，整支針頭完全沒入","針頭與皮膚呈90度垂直下針，針頭約沒入1/2～2/3"],"a":"D","k":"D","t":"","x":"肌肉注射應與皮膚呈90度垂直下針，針頭約沒入1/2～2/3，不需全部沒入，以免針頭從接合處斷裂時難以取出。45度是皮下注射角度；斜面朝上、5～15度是皮內注射方式。瘦弱者或孩童可選較短、較細的針頭。"},{"i":"gch7-45","e":"","n":0,"c":7,"s":"護理師以預留氣泡法執行肌肉注射，下列何者正確？","o":["抽完藥後保留1 mL空氣，以確保藥物完全推入","保留0.2 mL空氣，垂直下針使空氣位於針筒最上方","保留0.2 mL空氣，以45度角下針使空氣先進入組織","先推入空氣再推藥，讓空氣把組織撐開"],"a":"B","k":"B","t":"","x":"預留氣泡法是在抽完藥後保留0.2 mL空氣（預充填針劑不超過0.3 mL），針頭朝下垂直插入，空氣位於針筒最上方，最後推入，形成細微空氣栓子，防止藥物外滲至皮下組織。1 mL空氣過多；角度與推入順序也不正確。"},{"i":"gch7-46","e":"","n":0,"c":7,"s":"護理師為病人注射鐵劑時採用Z字形注射法，其主要目的為何？","o":["加速藥物進入血液循環以提早發揮療效","使藥物停留在皮下組織，延長吸收時間","防止刺激性藥物滲漏至皮下組織造成傷害","減少針頭穿刺深度，避免傷及深層骨膜"],"a":"C","k":"C","t":"","x":"Z字形注射法常與預留氣泡法合併使用，目的是防止鐵劑這類刺激性藥物沿針道滲漏到皮下組織，造成皮下或表皮傷害及染色。此法不是為了加速吸收，也不是為了減少穿刺深度，藥物應留在肌肉層而非皮下。"},{"i":"gch7-47","e":"","n":0,"c":7,"s":"有關皮下注射的敘述，下列何者正確？","o":["注射量不超過1 mL，以5～15度角下針，注射後輕壓","注射量不超過1.5 mL，45～60度下針，不揉按","吸收速率比肌肉注射快，適合刺激性強的藥物","注射量可達3 mL，以90度角下針，注射後揉按"],"a":"B","k":"B","t":"","x":"皮下注射適合少量、刺激性較小的藥物，注射量不超過1.5 mL，以45～60度角下針；為了避免吸收過快，注射後不揉按。吸收速率比肌肉注射慢、比口服快。3 mL、90度並揉按屬於肌肉注射；5～15度屬於皮內注射。"},{"i":"gch7-48","e":"","n":0,"c":7,"s":"護理師為病人選擇腹部作為皮下注射部位，下列何處最不適當？","o":["肚臍周圍一個拳頭以外的下腹部","腹部兩側避開血管與骨突處的部位","肋緣下至腸骨嵴間的腹壁","以肚臍為中心、一個拳頭直徑內的範圍"],"a":"D","k":"D","t":"","x":"腹部皮下注射可選擇肋緣下至腸骨嵴之間的腹壁，下腹部是吸收最快、最佳的部位，但須避開以肚臍為中心、一個拳頭直徑內的範圍，並避開血管、神經與骨頭突出處。其餘選項都在可注射範圍內。"},{"i":"gch7-49","e":"","n":0,"c":7,"s":"皮下注射肝素（heparin）時不需反抽，主要原因為何？","o":["反抽會增加藥物汙染的機會","反抽會使藥物進入肌肉層","反抽會使注射部位形成血腫","反抽會使藥物失去抗凝效果"],"a":"C","k":"C","t":"","x":"肝素具抗凝作用，皮下注射時若反抽，負壓會傷及微血管，使注射部位形成血腫，所以不需反抽；注射後也不按摩，以免加速吸收。反抽不會讓藥物失效，也不會使藥物進入肌肉層，主要考量是出血與血腫。"},{"i":"gch7-50","e":"","n":0,"c":7,"s":"胰島素濃度為每 1 mL 含 100 單位（U），醫囑：regular insulin 25 U SC，若以 1 mL 刻度空針抽取，應抽取多少 mL？","o":["0.025 mL","0.25 mL","2.5 mL","25 mL"],"a":"B","k":"B","t":"","x":"胰島素每1 mL為100單位，所以25 U÷100 U/mL＝0.25 mL。2.5 mL與25 mL是把濃度誤認為10 U/mL或1 U/mL的結果；0.025 mL則是小數點位置算錯。臨床上應使用胰島素專用空針，以單位刻度精確抽取。"},{"i":"gch7-51","e":"","n":0,"c":7,"s":"醫囑：regular insulin（短效，清）10 U 加 NPH（中效，濁）20 U 混合皮下注射。下列抽藥順序何者正確？","o":["先注入20 U空氣於NPH瓶並抽NPH 20 U→注入10 U空氣於RI瓶→抽RI至總量30 U","先注入20 U空氣於NPH瓶（不抽藥）→注入10 U空氣於RI瓶→抽RI 10 U→再抽NPH至總量30 U","先注入10 U空氣於RI瓶並抽RI 10 U→注入20 U空氣於NPH瓶→抽NPH至總量30 U","先注入10 U空氣於RI瓶（不抽藥）→注入20 U空氣於NPH瓶→抽NPH 20 U→再抽RI至總量30 U"],"a":"B","k":"B","t":"","x":"混合時先把空氣打入中效瓶但不抽藥，再把空氣打入短效瓶並抽取短效，最後抽中效至總量，也就是先清後濁，避免中效胰島素汙染整瓶短效胰島素。先抽濁再抽清會汙染短效瓶；抽中效時若超過刻度，也絕不可推回瓶中。"},{"i":"gch7-52","e":"","n":0,"c":7,"s":"護理師為長期注射胰島素的病人衛教，下列何者錯誤？","o":["注射後應提醒按時進食，以防低血糖","身材較瘦者注射時應輕捏起皮膚，避免注入肌肉層","注射部位應輪替，避免重複注射同一處","注射後應輕揉注射部位，以促進藥物吸收"],"a":"D","k":"D","t":"","x":"胰島素皮下注射後不揉按，以免吸收太快而造成低血糖。長期注射部位應輪替，避免皮膚發炎或組織纖維化；較瘦者應輕捏皮膚，以免注入肌肉層；注射後提醒進食，並避免劇烈運動，可預防低血糖。"},{"i":"gch7-53","e":"","n":0,"c":7,"s":"有關皮內注射的技術，下列何者正確？","o":["斜面朝上、5～15度下針，注入0.1 mL形成小水泡","斜面朝上、15～30度下針，先反抽確認無回血再推藥","斜面朝下、45度下針，注入0.5 mL形成小水泡","注入0.1 mL後，以酒精棉片按摩注射處促進吸收"],"a":"A","k":"A","t":"","x":"皮內注射將藥物注入表皮與真皮之間，使用0.5～1 mL空針，針頭斜面朝上，以5～15度角下針，注入0.1 mL使皮膚隆起約0.3～0.8公分的水泡。下針後不需反抽，拔針時不需按壓，更不可按摩，以免影響判讀。"},{"i":"gch7-54","e":"","n":0,"c":7,"s":"下列何者屬於皮內注射的適用情形？","o":["胰島素注射","鐵劑注射","卡介苗接種","德國麻疹疫苗"],"a":"C","k":"C","t":"","x":"皮內注射用於藥物過敏性試驗、診斷，以及卡介苗注射。胰島素與德國麻疹、水痘等疫苗屬於皮下注射；鐵劑刺激性強，應以肌肉注射合併Z字形或預留氣泡法給予，以免傷害皮下組織。"},{"i":"gch7-55","e":"","n":0,"c":7,"s":"病人執行青黴素皮膚試驗（PST）20分鐘後，試驗部位發紅、中間腫脹，周圍有不規則紅暈，直徑1.8公分；對照組（注射N/S）直徑0.2公分。下列判讀何者正確？","o":["陽性反應，應避免使用青黴素類抗生素","須待48～72小時後再判讀才準確","對照組未達標準，試驗結果無效需重做","陰性反應，可依醫囑給予青黴素"],"a":"A","k":"A","t":"","x":"PST於注射後15～20分鐘判讀。試驗部位紅腫且周圍不規則紅暈、直徑大於1.5公分，或對照組直徑大於0.3公分，任一項即為陽性，應避免使用青黴素類抗生素。本例試驗部位已達陽性標準；48～72小時是結核菌素試驗的判讀時間。"},{"i":"gch7-56","e":"","n":0,"c":7,"s":"病人接受青黴素皮膚試驗後數分鐘內出現呼吸困難、血壓下降，下列何者為首選急救藥物？","o":["Dextrose 50%","Heparin","Digoxin","Epinephrine"],"a":"D","k":"D","t":"","x":"PST可能引發過敏性休克，急救藥物為1/1000腎上腺素，可採皮下、肌肉或靜脈注射給予，以收縮血管、擴張支氣管。葡萄糖液用於低血糖；Digoxin用於心衰竭或控制心律；Heparin是抗凝劑，都不能處理過敏性休克。"},{"i":"gch7-57","e":"","n":0,"c":7,"s":"小學新生接受結核菌素皮膚試驗（TST），下列敘述何者正確？","o":["注射後48～72小時判讀，硬結≧1公分為陽性","於注射後15～20分鐘判讀，紅暈＞1.5公分為陽性","以注射部位發紅範圍判讀，紅暈≧1公分為陽性","結果陽性表示目前正處於結核病發病期，需立即隔離"],"a":"A","k":"A","t":"","x":"TST於注射後48～72小時判讀，以硬結大小為準，硬結≧1公分為陽性，代表體內有抗體，曾感染或接種過卡介苗，不需再接種。15～20分鐘、紅暈＞1.5公分是PST的判讀標準；陽性也不等於正處於發病期。"},{"i":"gch7-58","e":"","n":0,"c":7,"s":"有關靜脈注射的敘述，下列何者錯誤？","o":["藥物直接進入血液循環，療效最快速","懸液劑可經靜脈推注給予，以加速發揮藥效","需連續注射多種藥物時，可用留置針搭配T型連接管執行","靜脈推注（IV push）通常指20 mL以下的小量注射"],"a":"B","k":"B","t":"","x":"油劑或懸液劑可能造成血管栓塞，不可經靜脈注射給予。靜脈推注通常指20 mL以下，超過20 mL建議改為靜脈滴注；靜脈注射療效最快速；多種或大量注射時以留置針搭配T型連接管，可減少反覆穿刺。"},{"i":"gch7-59","e":"","n":0,"c":7,"s":"護理師執行靜脈抽血，下列步驟何者正確？","o":["於抽血部位上方約15公分處綁止血帶，以45度角刺入靜脈","止血帶綁於抽血部位上方6～8公分，見回血後用力回抽","止血帶綁於抽血部位上方2公分，針頭斜面朝下進針","止血帶綁於抽血部位上方6～8公分，以15～30度進針"],"a":"D","k":"D","t":"","x":"靜脈抽血時，在抽血部位上方約6～8公分處綁止血帶並消毒，針頭斜面朝上、與刻度對齊，以15～30度角刺入。見回血後將針頭平行往前略推1 mm再輕拉針心；用力回抽可能使血管塌陷或溶血。"},{"i":"gch7-60","e":"","n":0,"c":7,"s":"成人病人醫囑使用肛門栓劑，下列執行方式何者最適當？","o":["採左側臥，將栓劑推入肛門約6.5～7.5公分","協助病人採右側臥，將栓劑推入肛門約2公分","栓劑應先置於室溫回溫至軟化後再塞入","協助病人採屈膝仰臥，將栓劑推入肛門約10公分"],"a":"A","k":"A","t":"","x":"肛門給藥時，協助病人採左側臥，戴上清潔手套後將栓劑推入肛門約6.5～7.5公分，讓栓劑越過肛門括約肌，以免滑出。屈膝仰臥是陰道給藥姿勢；栓劑平時應冷藏，太軟會不易塞入；2公分過淺，10公分則過深。"},{"i":"gch7-61","e":"","n":0,"c":7,"s":"有關噴霧治療的護理，下列何者最不適當？","o":["治療後輔以姿位引流及背部叩擊，促進排痰","使用時抬高床頭30～45度，病人採坐姿","教導病人吸入藥物時進行慢而深的呼吸","安排於飯後立即執行，以免空腹引起不適"],"a":"D","k":"D","t":"","x":"噴霧治療以飯前1小時或飯後2小時執行為佳，飯後立即執行容易引起噁心、嘔吐。執行時抬高床頭30～45度並採坐姿，使肺部擴張；吸藥時做慢而深的呼吸；治療後輔以姿位引流與背部叩擊，排痰效果最佳。"},{"i":"gch7-62","e":"","n":0,"c":7,"s":"病人醫囑同時使用一種水劑眼藥水和一種油性眼藥，下列給藥方式何者正確？","o":["滴於角膜中央以增加吸收，兩藥間隔5分鐘","滴於下結膜穹窿，兩種藥物連續滴入不需間隔","先點油劑以形成保護膜，再點水劑","滴於下結膜穹窿，先水劑，隔5分鐘再點油劑"],"a":"D","k":"D","t":"","x":"眼藥應滴於下結膜穹窿處，避免直接滴在角膜上造成刺激或損傷。同時使用兩種以上眼藥時，每種應間隔5分鐘，並先用水劑或懸液劑，再用油劑；先點油劑會在眼表形成油膜，阻礙水劑吸收。"},{"i":"gch7-63","e":"","n":0,"c":7,"s":"護理師為2歲病童點耳藥，下列何者正確？","o":["先以掌心搓熱藥瓶，患側朝上，耳朵往下、往後拉","先以掌心搓熱藥瓶，患側朝上，耳朵往上、往後拉","兩耳都需點藥時，點完一側後立即換另一側","藥瓶由冰箱取出後直接滴入，以收縮血管"],"a":"A","k":"A","t":"","x":"耳滴劑使用前應以掌心輕搓，使藥溫接近體溫約37℃，避免冷刺激引起眩暈。3歲以下病童將耳朵往下、往後拉；3歲以上或成人才往上、往後拉。兩耳都要點藥時，應於10分鐘後再換另一側。"},{"i":"gch7-64","e":"","n":0,"c":7,"s":"癌症病人使用Durogesic（fentanyl）止痛貼片，下列衛教何者最不適當？","o":["每片藥效約可維持72小時，更換時避免貼在同一位置","若出現呼吸抑制，應立即撕下貼片並就醫","選擇平坦、少毛髮的皮膚處，貼上後以掌心按壓約30秒","可以泡熱水澡放鬆，有助於藥效穩定釋放"],"a":"D","k":"D","t":"","x":"熱度升高會加速貼片藥物釋放，使體內藥量瞬間暴增，可能危及生命，所以應避免泡熱水澡。貼片應貼於平坦、少毛髮處，以掌心按壓約30秒；藥效可持續72小時，更換時須換位置；發生呼吸抑制時應立即撕下並就醫。"},{"i":"gch7-65","e":"","n":0,"c":7,"s":"病人使用Painkyl（fentanyl citrate）口頰溶片，下列衛教何者正確？","o":["溶片溶散前可用舌頭將其移到另一側以加速吸收","將溶片放在舌下含服，並立即用水吞下","貼上5分鐘後可喝液體，但勿吞嚥食物","貼上後即可正常進食，不會影響藥效"],"a":"C","k":"C","t":"","x":"口頰溶片使用前應先潤溼兩頰，將藥片貼在頰內壁並輕壓固定5秒，約15～30分鐘後溶散。貼上5分鐘後可飲用液體，但不可吞嚥食物，須等藥片完全溶解後才能進食。用水吞下或移動溶片都會影響經口腔黏膜吸收。"},{"i":"gch7-66","e":"","n":0,"c":7,"s":"醫囑：dexamethasone 4 mg IV stat，現有 dexamethasone 5 mg/mL/amp，應抽取多少 mL？","o":["0.4 mL","0.8 mL","1.25 mL","4 mL"],"a":"B","k":"B","t":"","x":"藥物濃度為5 mg/mL，所需劑量4 mg÷5 mg/mL＝0.8 mL，也可列式x mL：4 mg＝1 mL：5 mg，得x＝0.8。1.25 mL是把公式倒過來算（5÷4）的錯誤；0.4 mL與4 mL則是小數點位置錯誤。"},{"i":"gch7-67","e":"","n":0,"c":7,"s":"體重 12 公斤的病童，醫囑 acetaminophen 15 mg/kg/dose PO q6h prn，現有 acetaminophen 糖漿 120 mg/5 mL，每次應給予多少 mL？","o":["1.5 mL","3.6 mL","7.5 mL","9 mL"],"a":"C","k":"C","t":"","x":"每次劑量＝15 mg/kg×12 kg＝180 mg。糖漿濃度為120 mg/5 mL，也就是24 mg/mL，所以180 mg÷24 mg/mL＝7.5 mL。1.5 mL是180÷120，沒有乘以5 mL；9 mL則是誤用每5 mL含100 mg計算。"},{"i":"gch7-68","e":"","n":0,"c":7,"s":"醫囑：heparin 2,500 U SC q12h，現有 heparin 5,000 U/mL，應抽取多少 mL？","o":["0.25 mL","0.5 mL","1 mL","2 mL"],"a":"B","k":"B","t":"","x":"2,500 U÷5,000 U/mL＝0.5 mL。2 mL是把公式倒過來算（5,000÷2,500）；1 mL是整支藥量5,000 U，等於醫囑的兩倍；0.25 mL則劑量不足。heparin皮下注射時不需反抽，注射後也不按摩。"},{"i":"gch7-69","e":"","n":0,"c":7,"s":"醫囑：oxacillin 750 mg IV drip q6h，藥局提供 oxacillin 500 mg/vial 粉劑，每瓶以 5 mL 稀釋液溶解。每次給藥應準備幾個 vial，並抽取共多少 mL？","o":["1 個 vial，抽 5 mL","2 個 vial，抽 6 mL","2 個 vial，抽 7.5 mL","2 個 vial，抽 10 mL"],"a":"C","k":"C","t":"","x":"每瓶500 mg不足750 mg，須準備2瓶。每瓶500 mg溶於5 mL，濃度為100 mg/mL，所以750 mg÷100 mg/mL＝7.5 mL。抽10 mL是把兩瓶全部抽完，共1,000 mg，劑量過多；1瓶5 mL只有500 mg，劑量不足。"}]};
const CH=DATA.ch,Q=DATA.q,BYID={};Q.forEach(q=>BYID[q.i]=q);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L='ABCD';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const ansText=q=>q.k.length===4?'一律給分':q.a+(q.t?`（${q.t}）`:'');
const CNT=CH.map((_,i)=>Q.filter(q=>q.c===i).length);
let F={ch:new Set(CH.map((_,i)=>i)),n:50,min:60,mode:'even'};
try{const s=JSON.parse(localStorage.getItem('bh-exam-setting')||'null');if(s){F.ch=new Set(s.ch);F.n=s.n;F.min=s.min;F.mode='even'}}catch(e){}
let X=null,TM=null,TAB='exam';
let S={ans:{},hist:[]};
try{const t=localStorage.getItem('bh-progress-v1');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
function save(){try{localStorage.setItem('bh-progress-v1',JSON.stringify(S))}catch(e){}}
function nav(){$('#nav').innerHTML=[['exam','模擬考'],['wrong','錯題本'],['stats','統計']].map(([k,v])=>`<button class="${TAB===k?'on':''}" onclick="goTab('${k}')">${v}</button>`).join('')}
function goTab(k){if(X&&!X.done&&!confirm('考試尚未交卷，確定離開？'))return;stopTimer();X=null;TAB=k;nav();({exam:home,wrong:wrongPage,stats:statsPage})[k]();window.scrollTo(0,0)}

function home(){
  stopTimer();X=null;TAB='exam';nav();$('#hd').innerHTML='';
  const pool=Q.filter(q=>F.ch.has(q.c)).length;
  $('#app').innerHTML=`<div class="card"><h2>設定考試</h2>
  <label class="f">範圍 <a href="#" onclick="F.ch=F.ch.size===CH.length?new Set():new Set(CH.map((_,i)=>i));home();return false">全選／全不選</a></label>
  <div class="chips">${CH.map((c,i)=>`<button class="chip ${F.ch.has(i)?'on':''}" onclick="F.ch.has(${i})?F.ch.delete(${i}):F.ch.add(${i});home()">${esc(c)}</button>`).join('')}</div>
  <div class="row" style="margin-top:14px;gap:18px"><label class="muted">題數 <input type="number" id="n" min="5" max="300" value="${F.n}"></label><label class="muted">時間（分鐘，0 不計時） <input type="number" id="m" min="0" max="300" value="${F.min}"></label></div>
  <div class="row" style="margin-top:18px"><button class="btn pri" ${pool?'':'disabled'} onclick="start()">開始考試</button></div></div>`;
}
function draw(n){
  const chs=[...F.ch];
  if(F.mode==='prop')return shuffle(Q.filter(q=>F.ch.has(q.c))).slice(0,n);
  const per={};chs.forEach(c=>per[c]=shuffle(Q.filter(q=>q.c===c)));
  const out=[];let k=0;
  while(out.length<n&&chs.some(c=>per[c].length)){const c=chs[k++%chs.length];if(per[c].length)out.push(per[c].pop())}
  return shuffle(out);
}
function start(){
  F.n=Math.max(5,Math.min(300,+$('#n').value||50));F.min=Math.max(0,+$('#m').value||0);
  try{localStorage.setItem('bh-exam-setting',JSON.stringify({ch:[...F.ch],n:F.n,min:F.min,mode:F.mode}))}catch(e){}
  const qs=draw(F.n);if(!qs.length)return;begin(qs.map(q=>q.i),F.min,'模擬考');
}
function begin(ids,min,title){
  X={ids,idx:0,pick:{},done:false,title,end:min?Date.now()+min*60000:0};
  if(X.end)TM=setInterval(tick,1000);quiz();
}
function stopTimer(){if(TM)clearInterval(TM);TM=null}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
function tick(){const left=X.end-Date.now();if(left<=0){stopTimer();submit(true);return}$('#hd').innerHTML=`<span class="timer">${fmt(left)}</span>`}
function quiz(){
  const q=BYID[X.ids[X.idx]],p=X.pick[q.i],show=X.done;
  if(X.end&&!X.done)$('#hd').innerHTML=`<span class="timer">${fmt(X.end-Date.now())}</span>`;else $('#hd').innerHTML='';
  const opts=q.o.map((o,j)=>{const l=L[j];let c='';if(show){if(q.k.includes(l))c='ok';else if(p===l)c='bad'}else if(p===l)c='sel';return `<button class="opt ${c}" ${show?'disabled':''} onclick="choose('${l}')"><b>(${l})</b><span>${esc(o)}</span></button>`}).join('');
  let fb='';if(show){const ok=p&&q.k.includes(p);fb=`<div class="ex"><div class="res ${ok?'ok':'bad'}">${p?(ok?'答對':'答錯'):'未作答'}・正確答案 ${ansText(q)}</div>${esc(q.x)}</div>`}
  const dots=X.ids.map((id,j)=>{let c='';const pp=X.pick[id];if(X.done)c=pp&&BYID[id].k.includes(pp)?'ok':'bad';else if(pp)c='done';return `<button class="${c} ${j===X.idx?'cur':''}" onclick="jump(${j})">${j+1}</button>`}).join('');
  $('#app').innerHTML=`<div class="card"><div class="qhead"><div><b>第 ${X.idx+1} 題</b> <span class="muted">/ ${X.ids.length}${show?'・'+esc(CH[q.c]):''}</span></div><span class="muted">已作答 ${Object.keys(X.pick).length}</span></div>
  <div class="stem">${show&&q.e?`<span class="tag">${q.e}｜${q.n}</span>`:''}${esc(q.s)}</div>${opts}${fb}
  <div class="nav2"><button class="btn" ${X.idx?'':'disabled'} onclick="jump(${X.idx-1})">上一題</button>
  ${X.done?`<button class="btn" onclick="result()">回成績</button>`:`<button class="btn" onclick="submit()">交卷</button>`}
  <button class="btn pri" ${X.idx<X.ids.length-1?'':'disabled'} onclick="jump(${X.idx+1})">下一題</button></div>
  <div class="dots">${dots}</div></div>`;
}
function choose(l){if(X.done)return;X.pick[X.ids[X.idx]]=l;if(X.idx<X.ids.length-1){X.idx++;window.scrollTo(0,0)}quiz()}
function jump(j){if(j<0||j>=X.ids.length)return;X.idx=j;quiz();window.scrollTo(0,0)}
function submit(auto){if(!auto){const un=X.ids.filter(id=>!X.pick[id]).length;if(!confirm(un?`還有 ${un} 題未作答，確定交卷？`:'確定交卷？'))return}stopTimer();X.done=true;let ok=0;
  X.ids.forEach(id=>{const p=X.pick[id];const good=!!(p&&BYID[id].k.includes(p));if(good)ok++;const r=S.ans[id]||{n:0,w:0};r.n++;if(!good)r.w++;r.last=good?1:0;S.ans[id]=r});
  S.hist.unshift({t:Date.now(),n:X.ids.length,ok,title:X.title});S.hist=S.hist.slice(0,100);save();result()}
function result(){
  $('#hd').innerHTML='';
  const ok=X.ids.filter(id=>X.pick[id]&&BYID[id].k.includes(X.pick[id])).length;const per={};
  X.ids.forEach(id=>{const c=BYID[id].c;per[c]=per[c]||[0,0];per[c][1]++;if(X.pick[id]&&BYID[id].k.includes(X.pick[id]))per[c][0]++});
  const wrong=X.ids.map((id,j)=>[id,j]).filter(([id])=>!(X.pick[id]&&BYID[id].k.includes(X.pick[id])));
  $('#app').innerHTML=`<div class="card"><h2>考試結果</h2><div class="big">${Math.round(ok/X.ids.length*100)} 分</div><div class="muted">答對 ${ok} / ${X.ids.length} 題</div>
  <table><tr><th>章節</th><th class="r">答對</th><th class="r">答對率</th></tr>${Object.keys(per).sort((a,b)=>a-b).map(c=>{const[a,b]=per[c];return `<tr><td>${esc(CH[c])}</td><td class="r">${a} / ${b}</td><td class="r">${Math.round(a/b*100)}%</td></tr>`}).join('')}</table>
  <div class="row" style="margin-top:16px"><button class="btn pri" onclick="X.idx=${wrong.length?wrong[0][1]:0};quiz()">${wrong.length?'從第一題錯題開始檢討':'逐題檢討'}</button><button class="btn" onclick="X.idx=0;quiz()">從第 1 題檢討</button><button class="btn" onclick="goTab(\'exam\')">回首頁</button></div></div>`;
  window.scrollTo(0,0);
}
function wrongIds(){return Q.filter(q=>S.ans[q.i]&&!S.ans[q.i].last).map(q=>q.i)}
let WCH=null,WIDS=[];
function wrongPage(){
  const all=wrongIds();const ids=WCH===null?all:all.filter(id=>BYID[id].c===WCH);
  WIDS=ids;const chs=[...new Set(all.map(id=>BYID[id].c))].sort((a,b)=>a-b);
  $('#app').innerHTML=`<div class="card"><h2>錯題本</h2><div class="muted">考試中答錯的題目會收進來，下次考到答對就會移出。目前 ${all.length} 題。</div>
  ${all.length?`<div class="chips" style="margin-top:10px"><button class="chip sm ${WCH===null?'on':''}" onclick="WCH=null;wrongPage()">全部</button>${chs.map(c=>`<button class="chip sm ${WCH===c?'on':''}" onclick="WCH=${c};wrongPage()">${esc(CH[c])}</button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn pri" onclick="begin(shuffle(WIDS),0,'錯題重考')">錯題重考（${ids.length} 題）</button></div>`:''}</div>
  <div class="card list">${ids.length?ids.map(id=>item(BYID[id])).join(''):'<div class="empty">目前沒有錯題</div>'}</div>`}
function item(q){const r=S.ans[q.i];return `<div class="item"><div>${q.e?`<span class="tag">${q.e}｜${q.n}</span>`:''}<span class="muted">${esc(CH[q.c])}・作答 ${r.n} 次、錯 ${r.w} 次</span></div><div style="margin:4px 0">${esc(q.s)}</div><div class="muted">${q.o.map((o,j)=>`(${L[j]}) ${esc(o)}`).join('　')}</div><details><summary>看答案與詳解</summary><div class="ex"><div class="res ok">正確答案 ${ansText(q)}</div>${esc(q.x)}</div></details></div>`}
function statsPage(){
  const rows=CH.map((c,i)=>{const qs=Q.filter(q=>q.c===i&&S.ans[q.i]);const ok=qs.filter(q=>S.ans[q.i].last).length;return `<tr><td>${esc(c)}</td><td class="r">${qs.length}</td><td class="r">${qs.length?Math.round(ok/qs.length*100)+'%':'—'}</td></tr>`}).join('');
  const d=t=>{const x=new Date(t);return `${x.getMonth()+1}/${x.getDate()} ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`};
  $('#app').innerHTML=`<div class="card"><h2>各章表現</h2><table><tr><th>章節</th><th class="r">做過題數</th><th class="r">答對率</th></tr>${rows}</table><div class="muted" style="margin-top:8px">答對率以每題最近一次作答計算。</div></div>
  <div class="card"><h2>考試紀錄</h2>${S.hist.length?`<table><tr><th>時間</th><th>類型</th><th class="r">答對</th><th class="r">分數</th></tr>${S.hist.map(h=>`<tr><td>${d(h.t)}</td><td>${esc(h.title||'模擬考')}</td><td class="r">${h.ok} / ${h.n}</td><td class="r">${Math.round(h.ok/h.n*100)}</td></tr>`).join('')}</table>`:'<div class="empty">還沒有考試紀錄</div>'}</div>
  <div class="card"><h2>紀錄備份</h2><div class="muted">紀錄存在這台裝置的瀏覽器裡。換電腦、換瀏覽器或用手機時，先匯出再到另一邊匯入。</div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="exportP()">匯出紀錄</button><label class="btn">匯入紀錄<input type="file" accept=".json" style="display:none" onchange="importP(this)"></label><button class="btn" onclick="if(confirm('確定清除所有紀錄？')){S={ans:{},hist:[]};save();statsPage()}">清除紀錄</button></div></div>`}
function exportP(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='基護模擬考紀錄.json';a.click()}
function importP(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);S={ans:d.ans||{},hist:d.hist||[]};save();alert('匯入完成');statsPage()}catch(e){alert('檔案格式不正確')}})}
window.addEventListener('beforeunload',e=>{if(X&&!X.done){e.preventDefault();e.returnValue=''}});
nav();home();
</script>
</body>
</html>
