葡萄柚汁服用，不會影響藥物在肝臟之代謝","含鈣及鐵離子的藥物若與牛奶併服，容易抑制藥物的吸收"],"a":"C","k":"C","t":"","x":"葡萄柚汁會抑制肝臟細胞色素P450（CYP3A4）酵素，影響多種藥物（包括部分抗組織胺、鈣離子阻斷劑）代謝，使血中濃度升高，故C錯誤。鐵劑遇茶葉中鞣酸會沉澱；酒精影響藥物代謝；含鈣、鐵離子藥物與牛奶併服會降低吸收。"},{"i":"113-2|12","e":"113-2","n":12,"c":7,"s":"執行肌肉注射時，下列措施何者正確？","o":["針頭插入時，動作宜迅速，以減輕疼痛","針頭拔出時，動作宜緩慢，以減少刺激","推藥物進入組織時，動作宜迅速，以縮短注射時間","選擇管徑大針頭，使藥物可迅速推入組織減少疼痛"],"a":"A","k":"A","t":"","x":"肌肉注射時進針應迅速以減輕疼痛，推藥要緩慢讓藥物均勻分散於組織，拔針同樣要迅速。針頭管徑應依藥物性質選擇，在可行範圍內宜選較細的針頭，以減少組織損傷與疼痛。"},{"i":"113-2|13","e":"113-2","n":13,"c":7,"s":"高血壓病人醫囑為 acetaminophen 1# P.O. QID、MgO 1# P.O. BID、nifedipine 30 mg 1# P.O. QD，凌晨0：00開始NPO，今日上午10：00進行上腸胃道攝影，至12：30返回病室後測量生命徵象無異常，13：00執行給藥，下列何者最適當？（備註：該院一天四次給藥常規時間為9-13-18-21）","o":["acetaminophen 1#","acetaminophen 1#、MgO 1#","acetaminophen 2#、MgO 1#、nifedipine 1#","acetaminophen 1#、MgO 1#、nifedipine 1#"],"a":"D","k":"D","t":"","x":"病人因檢查NPO而延後的9點常規藥物，在檢查結束、可進食且生命徵象穩定後，應補給當日尚未服用的MgO與nifedipine各1#。acetaminophen為QID，13:00為常規給藥時間，只給當次1#，不可將漏服劑量加倍補給。"},{"i":"113-2|19","e":"113-2","n":19,"c":7,"s":"下列何種藥物於注射完後可搓揉按摩，加速吸收？","o":["盤尼西林（penicillin）試驗","胰島素（insulin）注射","肝素（heparin）注射","鹽酸配西汀（demerol）肌肉注射"],"a":"D","k":"D","t":"","x":"一般肌肉注射藥物（如鹽酸配西汀）注射後可輕揉按摩，以加速吸收並減輕疼痛。皮膚試驗按摩會影響判讀；胰島素按摩會加速吸收導致低血糖；肝素按摩易造成皮下出血、瘀血，均不可按摩。"},{"i":"113-1|10","e":"113-1","n":10,"c":7,"s":"吳小弟，體重9公斤，醫囑開立「Amoxicillin® I.V. drip Q6H」，此藥物單次成人劑量為500 mg。依克拉克氏法則（Clark’s rule），吳小弟單次用藥劑量為多少mg？","o":["46","56","66","76"],"a":"C","k":"C","t":"","x":"克拉克法則：兒童劑量＝成人劑量×兒童體重（磅）÷150。9公斤×2.2＝19.8磅，500 mg×19.8÷150＝66 mg。"},{"i":"113-1|11","e":"113-1","n":11,"c":7,"s":"下列藥物劑型，何者的吸收速度最慢？","o":["懸浮劑","發泡錠","軟膠囊","粉劑"],"a":"C","k":"C","t":"","x":"口服劑型吸收速度由快至慢為：溶液＞懸液劑＞粉劑＞軟膠囊＞錠劑＞硬膠囊。發泡錠需先溶於水成溶液再服用，吸收快；懸浮劑與粉劑也都快於膠囊類，故四個選項中以軟膠囊吸收最慢。"},{"i":"113-1|12","e":"113-1","n":12,"c":7,"s":"病人血壓180/120 mmHg，醫囑「nifedipine（Adalat®）10 mg /cap 1# S.L. STAT」，下列給藥方式何者正確？","o":["請病人咬碎後吞服","請病人舌下含服","請病人直接吞服","將藥物塞入直腸"],"a":"B","k":"B","t":"","x":"醫囑S.L.（sublingual）為舌下給藥，藥物經舌下豐富的微血管直接吸收進入血液循環，作用迅速，適合高血壓急症。咬碎吞服或直接吞服屬口服途徑，經肝臟首渡效應作用較慢；塞入直腸為肛門給藥，均不符合醫囑。"},{"i":"113-1|13","e":"113-1","n":13,"c":7,"s":"病人罹患急性結膜炎，醫囑開立Emadine® oph. solution. 1gtt. O.U. QID及Devirus® oph. oint. O.U. QID，給眼藥過程下列措施何者錯誤？","o":["點藥時，請病人眼睛往上看","將藥物滴在下結膜囊內","先給Devirus® oph oint. 再給Emadine® oph. solution","給藥後，請病人閉上眼睛並轉動眼球"],"a":"C","k":"C","t":"","x":"同時使用眼藥水與眼藥膏時，應先點眼藥水，間隔約5分鐘後再塗眼藥膏，若先用藥膏，油膜會阻礙眼藥水吸收，故C錯誤。點藥時請病人眼睛往上看，將藥滴入下結膜囊，給藥後閉眼並轉動眼球使藥物均勻分布。"},{"i":"112-3|9","e":"112-3","n":9,"c":7,"s":"國中學童在校接受流感疫苗皮下注射，下列敘述何者正確？","o":["上臂三角肌下二橫指部位為適合施打部位","若學童較瘦，注射時應下壓繃緊皮膚","病童發燒應儘快接種疫苗","注射後應給予搓揉按摩加速藥效吸收"],"a":"A","k":"A","t":"","x":"皮下注射部位可選上臂三角肌下緣約二橫指（上臂外側）處。皮下注射時應捏起皮膚而非繃緊，瘦者更需捏起以免注入肌肉；發燒等急性疾病時應暫緩接種疫苗；疫苗注射後不應搓揉按摩。"},{"i":"112-3|10","e":"112-3","n":10,"c":7,"s":"病人陰道感染，醫師開立nystatin 1,000,000 U/supp 1#supp. HS，護理師衛教藥物的使用方式，下列敘述何者錯誤？","o":["可在給藥前使用水或潤滑劑以減輕不適","將栓劑推入陰道內約2公分","請病人靜臥約15分鐘以利藥物吸收","用藥後可在內褲底部墊衛生棉墊"],"a":"B","k":"B","t":"","x":"陰道栓劑應以戴手套的食指沿陰道後壁推入約7.5～10公分（約3～4吋），只推入2公分過淺，藥物易滑出，故B錯誤。給藥前可用水或水溶性潤滑劑減輕不適，給藥後應平躺約10～15分鐘以利藥物溶解吸收，並可墊衛生棉墊以防藥物流出污染衣物。"},{"i":"112-3|11","e":"112-3","n":11,"c":7,"s":"醫囑：nifedipine（5 mg/cap）1 cap SL. Q6H PRN if SBP >170 mmHg，護理師應該如何給藥？","o":["當收縮壓大於170 mmHg，開始每6小時常規舌下含服nifedipine（5 mg/cap）1顆","當收縮壓大於170 mmHg，則給予舌下含服nifedipine（5 mg/cap）1顆，僅給予1次","當收縮壓大於170 mmHg，則給予舌下含服nifedipine（5 mg/cap）1顆，但每次需間隔6小時","當收縮壓大於170 mmHg，則給予舌下含服nifedipine（5 mg/cap）1顆，但此醫囑超過6小時後自動失效"],"a":"C","k":"C","t":"","x":"PRN（pro re nata）為需要時給予的醫囑，在有效期限內可依條件重複使用。本醫囑表示收縮壓大於170 mmHg時給予舌下含服1顆，且兩次給藥至少需間隔6小時。A誤為常規給藥；B只給一次為SOS醫囑；PRN醫囑不會在6小時後自動失效。"},{"i":"112-2|15","e":"112-2","n":15,"c":7,"s":"有關給藥的敘述，下列何者錯誤？","o":["護理師自己準備的藥物應自己負責發給病人，切勿讓病人傳遞藥物","若病人上一餐忘記服藥，或拒服藥物，需了解原因後做適當處理及報告","護理師應協助病人服用藥物並確認病人已服下後，才能離開病人單位","給予抗生素藥物時，為了維持血液中之濃度，須根據三餐的時間給藥"],"a":"D","k":"D","t":"","x":"抗生素需依固定時間間隔給藥（如q6h、q8h），才能維持血中有效濃度，不應配合三餐時間給藥。自己準備的藥物應自己發給病人、不可讓病人傳遞；病人漏服或拒服須了解原因並報告；給藥時應確認病人服下才離開，故A、B、C皆正確。"},{"i":"112-2|16","e":"112-2","n":16,"c":7,"s":"林同學因眼睛乾澀、結膜發炎就醫，醫師開立水溶液眼藥水、凝膠狀（水性）眼藥膏，以及油性眼藥膏各1瓶，下列使用方式何者正確？","o":["使用順序：水溶液眼藥水→凝膠狀（水性）眼藥膏→油性眼藥膏","水溶液眼藥水應滴注在患眼的角膜","凝膠狀（水性）眼藥膏應於開封後一年內使用完畢","若戴隱形眼鏡，宜在戴隱形眼鏡下點眼藥"],"a":"A","k":"A","t":"","x":"同時使用多種眼藥時，應依水溶液→懸浮液／凝膠→油性眼藥膏的順序，先水性後油性，避免油膏阻礙水溶液吸收。眼藥水應滴入下結膜囊而非直接滴在角膜；眼藥開封後一般約1個月內用完；戴隱形眼鏡者應先取下再點藥。"},{"i":"112-2|17","e":"112-2","n":17,"c":7,"s":"楊先生的身體質量指數 BMI 為 16.0（kg/m2），今日早上 10 點主訴頭暈、噁心想吐，測得血糖值為 360 mg/dL，醫師開立醫囑，胰島素RI 6U SC St.，下列護理處置何者錯誤？","o":["注射後，注射部位不按摩","為病人注射時應捏起注射部位皮膚","使用針頭長度為1/2吋的胰島素空針注射時，注射角度應採90度角，針頭完全插入","若注射於腹部時，應以肚臍為中心點，一個拳頭為直徑的圓形範圍內為注射區域"],"a":"D","k":"D","t":"","x":"腹部注射胰島素時應避開肚臍周圍約5公分（約兩指寬）範圍，而非以肚臍為中心、一個拳頭為直徑的範圍內注射，故D錯誤。皮下注射胰島素應捏起皮膚、注射後不可按摩以免加速吸收；使用短針頭時可採90度進針。"},{"i":"112-2|18","e":"112-2","n":18,"c":7,"s":"影響藥物吸收及作用的相關因素之敘述，下列何者正確？","o":["腸衣錠需咬碎服用以增進腸道吸收率","四環黴素類（tetracyclines）與牛奶併服以減少胃部不適","同時服用多種藥物時順序為：錠劑→胃乳→咳嗽糖漿","同一藥物吸收的速率由快到慢依序為：肌肉注射＞皮下注射＞靜脈注射"],"a":"C","k":"C","t":"","x":"同時服用多種藥物時，應先服錠劑等一般藥物，再服制酸劑（胃乳），咳嗽糖漿最後服用且服後不宜立即喝水，以維持局部作用。腸衣錠不可咬碎；四環黴素與牛奶併服會與鈣結合而降低吸收；吸收速率應為靜脈注射＞肌肉注射＞皮下注射。"},{"i":"112-2|19","e":"112-2","n":19,"c":7,"s":"有關給藥縮寫與其所代表的意義，下列何者正確？","o":["q.o.d.：每隔一天","St.：需要時給予","C.M.：午夜","a.c.：飯後"],"a":"A","k":"A","t":"","x":"q.o.d.（quaque altera die）為每隔一天給藥一次。St.（stat）為立即給予；需要時給予為p.r.n.；C.M.（cras mane）為明晨；a.c.為飯前，飯後為p.c.。"},{"i":"112-2|20","e":"112-2","n":20,"c":7,"s":"病人疑似過敏性休克，醫囑：adrenalin（epinephrine）1mg/mL/amp 0.3mg IM St.，下列給藥方式何者錯誤？","o":["應抽取epinephrine 0.3 mL","可施打於上臂外側、臀肌或股外側肌等部位","針插入後，不需反抽針心以避免注射部位血腫","施打後應按摩注射部位，加速藥物吸收"],"a":"C","k":"C","t":"","x":"epinephrine 1 mg/mL，需0.3 mg即抽取0.3 mL；可注射於上臂三角肌、臀肌或股外側肌；注射後可按摩以加速吸收，故A、B、D正確。肌肉注射進針後應反抽針心確認未刺入血管才推藥，若有回血須拔出重新注射，故C「不需反抽」錯誤。"},{"i":"112-1|15","e":"112-1","n":15,"c":7,"s":"護理師依醫囑給予劉先生Cefazolin 1000 mg q12h I.V. drip，應於何時執行備藥的第二讀？","o":["由藥車取出Cefazolin時","用空針抽取無菌注射用水稀釋Cefazolin前","用空針抽取稀釋後的Cefazolin前","將Cefazolin空瓶丟棄前"],"a":"B","k":"B","t":"","x":"三讀中第一讀為由藥車（藥盒）取出藥物時；第二讀為準備藥物、開始稀釋或抽取藥物前；第三讀為將剩餘藥物放回或丟棄空瓶前。因此Cefazolin粉劑的第二讀應在抽取無菌注射用水進行稀釋前，故選B。"},{"i":"112-1|16","e":"112-1","n":16,"c":7,"s":"有關行動護理車給藥的敘述，下列何者正確？","o":["至病人床邊以條碼掃描機感應病人手圈條碼，進行備藥程序","「三讀五對」的程序可省略為「一讀三對」","相差2小時內的藥物可同時交給病人","備藥後，到病人床邊給藥時，可省略核對病人程序"],"a":"A","k":"A","t":"","x":"行動護理車給藥是至病人床邊，以條碼掃描機感應病人手圈條碼確認身分後進行備藥與給藥，故A正確。電子化給藥仍須確實執行三讀五對，不可省略；每種藥物應依醫囑時間給予，不可將不同時段藥物一併交給病人；給藥時仍須核對病人。"},{"i":"112-1|17","e":"112-1","n":17,"c":7,"s":"執行背臀肌肌肉注射時，以四分法選擇注射部位，最上方的假想線會通過下列那一處？","o":["髂骨嵴","髂骨後上棘","臀弧線","股骨大粗隆"],"a":"A","k":"A","t":"","x":"背臀肌注射以四分法定位時，以髂骨嵴為上方水平假想線，臀溝為下方界線，再將臀部分為四等分，注射於外上四分之一的外上方，以避開坐骨神經，故最上方假想線通過髂骨嵴，選A。"},{"i":"112-1|18","e":"112-1","n":18,"c":7,"s":"林先生施行結核菌素試驗（PPD test），結果出現紅腫、直徑18 mm的硬結，下列敘述何者錯誤？","o":["主要是檢驗體內是否有活的結核分枝桿菌","林先生的結核菌素試驗為陽性反應","建議林先生需接受卡介苗注射","需進一步接受胸部X光或痰液檢查確認是否有感染結核桿菌"],"a":"C","k":"C","t":"","x":"結核菌素試驗於注射後48～72小時判讀，硬結直徑≧1公分為陽性，表示曾感染結核菌或曾接種卡介苗，已有抗體，不需要再接種卡介苗，故C錯誤。陽性者應進一步接受胸部X光或痰液檢查，以確認是否有結核病。"},{"i":"112-1|19","e":"112-1","n":19,"c":7,"s":"執行醫囑「Ampicillin 250 mg I.M. q8h」，下列何者正確？","o":["肌肉注射Ampicillin 250 mg一天3次，時間為9 AM, 1 PM, 5 PM","肌肉注射Ampicillin 250 mg一天3次，時間為9 AM, 5 PM, 1 AM","需要時給予肌肉注射Ampicillin 250 mg一次","每天8 AM給予肌肉注射Ampicillin 250 mg一次"],"a":"B","k":"B","t":"","x":"q8h為每8小時給藥一次，一天3次，各次間隔須平均為8小時，依常規時間為9 AM、5 PM、1 AM，故B正確。A的時間間隔僅4小時；「需要時給予一次」為s.o.s.；每天給藥一次為q.d.。"},{"i":"112-1|20","e":"112-1","n":20,"c":7,"s":"林先生行闌尾切除手術後返回病房，醫囑「N.P.O.」、「Demerol 1 amp I.M. st & q6h p.r.n.」、「Cefazolin 1 gm I.V. drip q8h」，下列敘述何者錯誤？","o":["須立即肌肉注射Demerol 1 amp","每6小時肌肉注射Demerol 1 amp","每8小時由靜脈滴注Cefazolin 1 gm","個案禁食"],"a":"B","k":"B","t":"","x":"Demerol醫囑為st & q6h p.r.n.，表示立即給予一次，之後在需要時（如疼痛時）每6小時可給予，並非每6小時常規注射，故B錯誤。Cefazolin q8h為每8小時靜脈滴注；N.P.O.表示禁食。"},{"i":"111-2|15","e":"111-2","n":15,"c":7,"s":"護理師依照醫囑給予病人Inteban 1#Supp. St.退燒時，下列敘述何者正確？","o":["配合乙狀結腸及降結腸的解剖位置，故協助採右側臥位","請病人深呼吸閉氣，將藥物塞入肛門內約2公分","當發現腸道有糞團時，應避開糞團或小量灌腸將糞便清除，以免影響藥物吸收","當病人主訴頭痛、冒冷汗時，請病人忍耐並取衛生紙壓住肛門口，以促進藥物吸收"],"a":"C","k":"C","t":"","x":"肛門栓劑需接觸直腸黏膜才能吸收，若腸道有糞團應避開或先清除糞便，以免影響藥物吸收，故C正確。給藥時應採左側臥；請病人張口哈氣放鬆，將栓劑推入約6.5～7.5公分；病人出現頭痛、冒冷汗等不適時應停止處置並評估，不可要求忍耐。"},{"i":"111-2|16","e":"111-2","n":16,"c":7,"s":"醫囑：Unasyn 750 mg I.V.D q.6.h，現有Unasyn 2 gm/vial 粉劑，以無菌蒸餾水稀釋粉劑成總量 4 c.c.後，應抽出多少c.c. 才符合此次注射劑量？","o":["1 c.c.","1.25 c.c.","1.5 c.c.","2 c.c."],"a":"C","k":"C","t":"","x":"Unasyn 2 gm（2,000 mg）稀釋成4 c.c.，濃度為500 mg/c.c.；所需劑量750 mg ÷ 500 mg/c.c.＝1.5 c.c.，故選C。"},{"i":"111-2|17","e":"111-2","n":17,"c":7,"s":"依衛生福利部疾病管制署公告資料，關於藥物的管理及保存，下列何者錯誤？","o":["Pethidine(Demerol)針劑應置於上鎖的櫃中","未開封的胰島素，可置於室溫中保存","稀釋後之 Penicillin G置於2～8℃藥物冰箱","流感疫苗置於2～8℃專用冰箱"],"a":"B","k":"B","t":"","x":"未開封的胰島素應置於2～8℃冰箱冷藏，使用中的胰島素才可短期於室溫（＜30℃）保存，故B錯誤。Pethidine為管制藥品，須存放於上鎖的櫃中；稀釋後的藥物及疫苗皆應冷藏於2～8℃。"},{"i":"111-2|18","e":"111-2","n":18,"c":7,"s":"下列住院醫囑，何者是護理師於給藥前，必須提出質疑？","o":["Cefazolin (1,000 mg/vail) 1,000 mg q.d. I.V.","Acetaminophen 500mg/tab 1#P.O. p.r.n. for pain","15% KCl(10 mEq / 5 mL /Amp)20 mL q.d. I.V. drip","NTG(Nitroglycerin)0.6 mg/tab 1#S.L. St."],"a":"B","k":"B","t":"","x":"p.r.n.醫囑須註明需要時給藥的間隔時間（如q.4.h.或q.6.h.），以免重複給藥過量，Acetaminophen p.r.n.未註明間隔時間，護理師應提出質疑並與醫師確認，故選B。其他醫囑的劑量、途徑及頻率皆完整。"},{"i":"111-2|19","e":"111-2","n":19,"c":7,"s":"有關給藥醫囑常見縮寫名詞的解釋，下列何者正確？①q.i.d.與q.4.h.的給藥時間相同 ②q.o.d.是指「每隔一天」 ③M.N. 是指「睡前」 ④O.D. 是指「右眼」 ⑤S.O.S.是指12小時內「如有需要給予一次」","o":["①②④","①③⑤","②④⑤","③④⑤"],"a":"C","k":"C","t":"","x":"q.o.d.為每隔一天，O.D.為右眼，S.O.S.為12小時內如有需要給予一次，故②④⑤正確。q.i.d.為一天四次，與每4小時一次（q.4.h.，一天六次）不同；M.N.為午夜，睡前的縮寫為h.s.。"},{"i":"111-2|20","e":"111-2","n":20,"c":7,"s":"有關藥物與食物服用禁忌的說明，下列敘述何者錯誤？","o":["甘草與毛地黃一起合用可能引發高血鉀","鎮靜劑避免以茶水一起服用，以免降低藥效","葡萄柚汁會干擾鈣離子阻斷劑在肝臟的代謝","酒精會促進抗組織胺對中樞神經之抑制作用"],"a":"A","k":"A","t":"","x":"甘草具有類似留鹽激素作用，會促進鉀離子排出而造成低血鉀，與毛地黃合用會增加毛地黃中毒的風險，故A「高血鉀」錯誤。茶葉成分會降低鎮靜劑藥效；葡萄柚汁會干擾鈣離子阻斷劑代謝；酒精會加強抗組織胺的中樞抑制作用。"},{"i":"111-1|10","e":"111-1","n":10,"c":7,"s":"醫囑Demeral 10 mg I.V. drip St.之含意，下列敘述何者正確？","o":["需要時給予，由靜脈直接推注","需要時給予，由靜脈滴注","立即給予，由靜脈直接推注","立即給予，由靜脈滴注"],"a":"D","k":"D","t":"","x":"St.（stat）為立即給予，I.V. drip為靜脈滴注，故此醫囑為立即由靜脈滴注給予Demerol 10 mg，選D。「需要時給予」的縮寫為p.r.n.，靜脈直接推注則為I.V. push。"},{"i":"111-1|15","e":"111-1","n":15,"c":7,"s":"有關床邊給藥電子化作業流程之敘述，下列何者正確？","o":["可縮短護理人員給藥繁瑣步驟，減少護理人員三讀五對的給藥程序","刷病人條碼後，電腦出現藥物視窗時，檢視藥物醫囑無誤，就可給藥","電腦出現藥物視窗，刷藥品上的條碼後，需確認藥物資訊是否符合","給完藥後，必需按儲存選項，系統即會自動記錄時間與醫師姓名"],"a":"C","k":"C","t":"","x":"床邊給藥電子化作業中，刷病人條碼確認身分後，仍須刷藥品條碼並確認藥物資訊與醫囑相符，故C正確。電子化作業是輔助核對，不能取代三讀五對；給藥後系統記錄的是給藥時間與執行護理師，而非醫師姓名。"},{"i":"111-1|16","e":"111-1","n":16,"c":7,"s":"有關口服藥物給予方式，下列何者正確？①服用輕瀉劑應減少水分攝取 ②止吐劑應在飯後立即服用 ③鹽類緩瀉劑可與冬瓜茶一起服用 ④咳嗽糖漿避免與水共服","o":["①②","①③","②④","③④"],"a":"D","k":"D","t":"","x":"鹽類緩瀉劑味道不佳，可與果汁或冬瓜茶等飲料併服以改善口感；咳嗽糖漿與開水併服可能降低療效，宜30分鐘內暫勿飲水，故選③④。服用輕瀉劑應增加水分攝取；止吐劑宜於飯前30分鐘服用。"},{"i":"111-1|17","e":"111-1","n":17,"c":7,"s":"張先生為癌末病人，醫囑開立Fentanyl止痛貼片使用，給予藥物指導時，下列敘述何者正確？","o":["建議黏貼疼痛部位效果最好","貼上皮膚後，以手掌緊壓貼片30秒","每次更換新貼片，應貼在同一部位","建議可泡熱水澡，提升藥物效果"],"a":"B","k":"B","t":"","x":"Fentanyl止痛貼片應貼於皮膚平坦、少毛髮處，並以手掌按壓貼緊約30秒，藥效可持續72小時，故B正確。不需貼在疼痛部位；每次更換應更換黏貼位置；泡熱水澡會加速藥物釋放，可能導致藥量暴增引起呼吸抑制。"},{"i":"111-1|18","e":"111-1","n":18,"c":7,"s":"有關給藥方法敘述，下列何者錯誤？","o":["協助6歲兒童耳藥滴入時，耳廓要向上向後拉","透析當日，病人於透析前暫停服用降血壓藥物","Biscodyl（Dulcolax®）tablet應咬碎服用以促進腸道吸收","眼藥水瓶口距眼球上約1～2公分，將藥滴於結膜下穹窿處"],"a":"C","k":"C","t":"","x":"Dulcolax（Bisacodyl）在胃酸中極不穩定，製成腸衣錠以便在小腸才釋放，因此不宜咬碎或磨粉，故C錯誤。3歲以上兒童耳滴時耳廓向上向後拉；眼藥水應滴於下結膜穹窿處，瓶口距眼約1～2公分避免碰觸。"},{"i":"111-1|19","e":"111-1","n":19,"c":7,"s":"高先生為第2型糖尿病病人，醫囑「RI 8 I.U. S.C. t.i.d. a.c.」，下列敘述何者錯誤？","o":["1天給藥3次","飯前30分鐘給藥","藥物注入至肌肉層","注射後可輕壓注射部位"],"a":"C","k":"C","t":"","x":"RI為短效胰島素，S.C.為皮下注射，藥物應注入皮下組織而非肌肉層，故C錯誤。t.i.d.為一天三次，a.c.為飯前（約30分鐘）給藥；胰島素注射後不可揉按，以輕壓注射部位為宜。"},{"i":"111-1|20","e":"111-1","n":20,"c":7,"s":"吳先生因骨折手術主訴傷口疼痛，醫囑開立Pethidine 50 mg I.M. p.r.n. q.4.h.，下列處置何者正確？","o":["每天4次給予Pethidine 50 mg靜脈注射","需要時，每4小時給予Pethidine 50 mg靜脈注射","每天4次給予Pethidine 50 mg肌肉注射","需要時，每4小時給予Pethidine 50 mg肌肉注射"],"a":"D","k":"D","t":"","x":"p.r.n.表示需要時給予，q.4.h.為每4小時，I.M.為肌肉注射，故此醫囑為需要時每4小時給予Pethidine 50 mg肌肉注射，選D。「每天4次」的縮寫為q.i.d.，靜脈注射為I.V.。"},{"i":"111-1|21","e":"111-1","n":21,"c":7,"s":"醫囑「Digoxin 125 mcg P.O. q.d.」，Digoxin錠劑每顆的劑量為0.25 mg，給藥時護理師應發給此病人多少顆Digoxin？","o":["半顆","1顆","2顆","5顆"],"a":"A","k":"A","t":"","x":"1 mg＝1,000 mcg，125 mcg＝0.125 mg；每顆Digoxin為0.25 mg，故應給予0.125 ÷ 0.25＝0.5顆，即半顆。給藥前並應測量心尖脈，成人心率大於60次/分鐘才可給藥。"},{"i":"110-2|3","e":"110-2","n":3,"c":7,"s":"為四肢水腫嚴重病人執行盤尼西林皮膚試驗時，下列何者為最適合的注射部位？","o":["上臂三角肌外側","大腿中段外側","前臂中段內側","前胸鎖骨下方"],"a":"D","k":"D","t":"","x":"盤尼西林皮膚試驗採皮內注射，常用部位有前臂中段內側、三角肌外側、前胸鎖骨下方及背部肩胛骨下方。四肢嚴重水腫時，四肢部位皮膚無法正確判讀反應，故選擇不在四肢的前胸鎖骨下方最適合。"},{"i":"110-2|20","e":"110-2","n":20,"c":7,"s":"醫囑Tetracycline oint .O.D. t.i.d.，下列給藥方式何者正確？","o":["將藥膏塗於病人左眼","將藥膏塗於病人右眼","將藥膏塗於病人左耳","將藥膏塗於病人右耳"],"a":"B","k":"B","t":"","x":"O.D.為右眼（oculus dexter），O.S.為左眼，O.U.為雙眼；oint.為藥膏，t.i.d.為一天三次。故此醫囑為Tetracycline藥膏塗於右眼，一天三次，選B。耳部的縮寫則為A.D.（右耳）、A.S.（左耳）。"},{"i":"110-2|21","e":"110-2","n":21,"c":7,"s":"有關醫囑的敘述，下列何者正確？","o":["「order renew」代表先前開立之醫囑無效，須以重新開立之醫囑為依據","緊急狀況時護生可以接受口頭醫囑，但事後須盡速補開醫囑","長期醫囑的有效期限為7日","執行p.r.n醫囑後，無須記錄病人用藥情況"],"a":"A","k":"A","t":"","x":"order renew表示原醫囑失效，須以重新開立的醫囑為依據，故A正確。護生不可接受口頭醫囑；長期醫囑在醫師停止前持續有效，並非固定7日；執行p.r.n.醫囑後必須記錄給藥時間與病人反應。"},{"i":"110-2|22","e":"110-2","n":22,"c":7,"s":"醫囑Coumadin 1#p.o. stat & q.d.×3 days then 0.5#p.o. q.d.，請問第5天時Coumadin應給予幾顆？","o":["0.5#","1#","1.5#","2#"],"a":"A","k":"A","t":"","x":"stat為立即給予，q.d.×3 days為每日一次共三天。依醫囑，第1～3天每日給1#，之後改為0.5# q.d.，故第5天應給予0.5#。stat那一劑屬於立即執行的一次，並不會延長每日1#的天數。"},{"i":"110-2|26","e":"110-2","n":26,"c":7,"s":"協助病人使用口頰溶片Painkyl®（fentanyl citrate）（buccal soluble films/200 mcg）1 buccalfilm控制疼痛，下列何者最適當？","o":["將藥片放置於舌下","使用前，協助病人潤濕口腔兩頰","藥片使用後，4小時內完全禁食","藥片置入後30分鐘內，應避免飲用液體"],"a":"B","k":"B","t":"","x":"Painkyl®為類鴉片口頰溶片，使用前應協助病人潤濕口腔兩頰，再將藥片貼於頰內壁輕壓固定，故B正確。此藥經口頰黏膜吸收，不可置於舌下；貼上5分鐘後即可飲用液體，待藥片完全溶解後即可進食，不需禁食4小時。"},{"i":"110-2|27","e":"110-2","n":27,"c":7,"s":"林女士術後傷口痛，醫囑：Pethidine（Demerol）50 mg IM stat.，為減少注射過程中疼痛與不適，下列措施何者不適當？","o":["注射前，熱敷注射部位","下針時，繃緊注射部位","注射後，迅速拔出針頭","注射後，按摩注射部位"],"a":"A","k":"A","t":"","x":"減輕肌肉注射疼痛的方法包括使病人放鬆、下針時繃緊皮膚並快速下針、緩慢推藥、迅速拔針及注射後按摩以促進吸收。注射前熱敷注射部位並非減輕注射疼痛的措施，反而可能使局部血管擴張而增加出血，故A不適當。"},{"i":"110-2|28","e":"110-2","n":28,"c":7,"s":"10：00 am開立一臨時醫囑：Oxacillin sodium（500 mg/vial）2,000 mg IVF stat.，然護理師於1：00 pm給予Oxacillin sodium（500 mg/vial）2vial IVF，上述給藥過程，不符合那幾項給藥原則：①時間 ②途徑 ③劑量 ④藥物","o":["①④","②③","①③","②④"],"a":"C","k":"C","t":"","x":"醫囑為stat臨時醫囑，應立即執行，延至1:00 pm才給予不符合時間對；醫囑劑量為2,000 mg，應給予500 mg/vial共4 vial，只給2 vial不符合劑量對。途徑與藥物皆正確，故選①③。"},{"i":"110-2|29","e":"110-2","n":29,"c":7,"s":"一位10公斤重的病童，服用Amolin susp.®（amoxicillin）30 mg/kg q12h P.O.，藥瓶標籤顯示25 mg/mL、60 mL/瓶，單次給藥劑量應為多少？","o":["5 mL","10 mL","12 mL","24 mL"],"a":"C","k":"C","t":"","x":"單次劑量為30 mg/kg × 10 kg＝300 mg；藥物濃度為25 mg/mL，故應給予300 ÷ 25＝12 mL。選項24 mL為誤用60 mg/kg計算的結果，5 mL與10 mL則劑量不足。"},{"i":"110-1|13","e":"110-1","n":13,"c":7,"s":"有關「p.r.n.」醫囑的敘述，下列何者錯誤？①是一種臨時醫囑 ②開立醫囑時，醫師會指定間隔時間多久一次 ③中文解釋為「如有需要僅給予一次」 ④執行後須記錄 ⑤此醫囑有效時間為12小時","o":["①②④","①③⑤","②④⑤","③④⑤"],"a":"B","k":"B","t":"","x":"p.r.n.為「需要時給予」的長期醫囑，醫師會指定間隔時間，在醫囑停止前持續有效，執行後須記錄。①是臨時醫囑、③僅給予一次（此為s.o.s.）、⑤有效12小時皆錯誤，故選①③⑤。"},{"i":"110-1|16","e":"110-1","n":16,"c":7,"s":"護理師處理電話中的藥物醫囑時，下列敘述何者錯誤？","o":["寫下此口頭醫囑，並複誦一次與醫師確認無誤後，才可執行","事後應在護理記錄中，註明醫師姓名、藥物名稱、劑量、途徑、時間","宜婉轉向醫師說明為確保給藥安全，拒絕接受口頭醫囑","事後依醫院作業規範，儘速請醫師補開醫囑"],"a":"C","k":"C","t":"","x":"緊急時可接受電話（口頭）醫囑，但應寫下並複誦確認無誤後才執行，事後記錄醫師姓名、藥名、劑量、途徑與時間，並請醫師儘速補開醫囑。因此直接拒絕接受口頭醫囑的做法錯誤，可能延誤病人治療。"},{"i":"110-1|17","e":"110-1","n":17,"c":7,"s":"給予成年病人肛門栓劑時，栓劑置入肛門內的適當深度，下列何者正確？","o":["1.4～3.6公分","4.4～5.6公分","6.4～7.6公分","8.4～9.6公分"],"a":"C","k":"C","t":"","x":"給予成人肛門栓劑時，協助病人採左側臥，戴手套將栓劑推入肛門約6.5～7.5公分，越過內括約肌，使栓劑停留於直腸壁以免滑出，故選C。過淺的深度會使栓劑停留在括約肌附近而被排出。"},{"i":"110-1|18","e":"110-1","n":18,"c":7,"s":"有關由藥瓶（Vial）抽藥方法的敘述，下列何者正確？","o":["核對藥瓶及藥牌上藥物的名稱及劑量，為第三讀","粉劑應先稀釋溶解，並用力上下搖晃以搖勻藥液","抽完藥為避免針頭變鈍，可排氣後再更換針頭","抽藥時針筒朝上針頭沒入液面，抽完藥後，雙手呈水平方式拔針頭"],"a":"D","k":"D","t":"","x":"由藥瓶抽藥時，應將針筒朝上倒立藥瓶，使針頭斜面保持在液面下以免抽入空氣，抽完後雙手以水平方式拔出針頭，故D正確。三讀的每一讀都要核對藥瓶標籤與藥牌（藥卡），並非專屬第三讀（第一讀為取藥時、第二讀為抽藥前、第三讀為抽完藥將藥瓶放回或丟棄前）；粉劑稀釋後應以雙手搓滾使其溶解，勿用力上下搖晃；應先更換針頭再排氣。"},{"i":"110-1|19","e":"110-1","n":19,"c":7,"s":"張小姐，30歲，因過敏性眼瞼結膜炎，醫囑開立Rinteron solution 1 gtt.O.U. q6h 及Tetracycline oint. O.U. q6h，護理師進行眼藥滴入時，下列何者為正確給藥方式？","o":["先以棉球由眼外眥往內眥擦拭分泌物","先使用Tetracycline oint.，再使用Rinteron solution 1 gtt.","Rinteron solution 1 gtt.滴入下眼瞼結膜囊內","Tetracycline oint.應擦在角膜上"],"a":"C","k":"C","t":"","x":"眼滴劑應滴於下眼瞼結膜囊（下穹窿）內，避免直接滴於角膜上，故C正確。擦拭分泌物應由內眥往外眥；同時使用水劑與油劑時，應先點水劑、間隔5分鐘再使用油劑（藥膏），藥膏亦應擠於下結膜囊，不可塗於角膜上。"},{"i":"110-1|20","e":"110-1","n":20,"c":7,"s":"楊先生為癌症病人，今天9AM給藥時拒絕服用口服藥，護理師在第一時間的反應，下列何者最適當？","o":["立即通知醫師前來處理病人問題","說明該藥物對癌症具療效，勸病人服用","評估病人拒服原因，必要時聯絡醫師處理","尊重病人決定，將藥物帶回護理站並做紀錄"],"a":"C","k":"C","t":"","x":"病人拒絕服藥時，護理師第一時間應先評估拒服的原因，給予說明，必要時再聯絡醫師處理，故C最適當。未評估即通知醫師、強行勸服或直接將藥物帶回記錄，皆未先了解病人的想法與需求。"},{"i":"110-1|21","e":"110-1","n":21,"c":7,"s":"李先生是使用Digoxin治療的病人，下列何者是護理師依醫囑繼續給藥的最重要依據？","o":["心率64次／分鐘","血壓120/80 mmHg","心率52次／分鐘","呼吸18次／分鐘"],"a":"A","k":"A","t":"","x":"Digoxin的治療劑量範圍狹窄，會使心跳變慢，給藥前須測量心尖脈一分鐘，成人心率大於60次/分鐘才可給藥。心率64次/分鐘可依醫囑繼續給藥；心率52次/分鐘應暫停給藥並通知醫師，血壓與呼吸並非主要依據。"},{"i":"110-1|22","e":"110-1","n":22,"c":7,"s":"給予幼兒左耳耳滴藥治療時，應採取的姿勢，下列敘述何者正確？①頭側向右側 ②頭側向左側 ③將耳翼向上向後拉 ④將耳垂向下向後拉","o":["①③","①④","②③","②④"],"a":"B","k":"B","t":"","x":"耳滴藥時應使患側朝上，左耳給藥須將頭側向右側；3歲以下幼兒耳道較短且向上彎，應將耳垂向下、向後拉以拉直耳道，故選①④。3歲以上兒童及成人才是將耳翼往上、往後拉。"},{"i":"109-2|5","e":"109-2","n":5,"c":7,"s":"對於醫囑（order）的描述，下列何者正確？","o":["S.O.S醫囑超過8小時，此醫囑自動失效","當醫囑出現order renew表示以上的醫囑有效，以下的醫囑無效","新進護理師三個月後才可以接受口頭醫囑","接受口頭醫囑最好有二位護理師在場確認"],"a":"D","k":"D","t":"","x":"接受口頭醫囑時，最好有兩位護理師在場確認，並複誦醫囑內容，事後請醫師補開書面醫囑。S.O.S.醫囑超過12小時未執行即失效；order renew表示其以上的醫囑失效、以下才有效；口頭醫囑原則上只在緊急時接受，與年資無關。"},{"i":"109-2|20","e":"109-2","n":20,"c":7,"s":"病人出院攜帶數種藥物回家，下列何者應置放於冰箱？","o":["Brown Mixture Liquid（120 mL）/Bot","Neomycin Oint（28 gm）/Tube","Bisacodyl（10 mg）/Supp","Gentamicin Eye Drops（5 mL）/Bot"],"a":"C","k":"C","t":"","x":"栓劑在體溫下會融化，應置於2～8℃冰箱冷藏保存，以維持固態便於給藥。一般口服液、藥膏及眼藥水於15～30℃室溫保存即可，開封後眼藥水最多使用1個月。"},{"i":"109-2|21","e":"109-2","n":21,"c":7,"s":"因自發性氣胸接受手術的男性病人，其BMI為20 kg/m2，術後給藥Pethidine（Demerol）（50 mg/mL/amp）40 mg I.M. q.4h. p.r.n.（if pain），下列敘述何者不適當？","o":["每次給藥劑量為0.8 mL，採肌肉注射","背臀區是首選注射部位","若疼痛，每間隔四小時給藥","注射藥物前反抽針心，如有回血應拔除針頭"],"a":"B","k":"B","t":"","x":"背臀肌注射易傷及坐骨神經，造成肌肉萎縮或變形，並非首選部位，成人肌肉注射較建議腹臀肌（臀小肌）或股外側肌，故B不適當。單次劑量40 mg ÷ 50 mg/mL＝0.8 mL；p.r.n. q.4h.表示疼痛時給藥且間隔至少4小時；回抽有回血應拔出針頭重新準備。"},{"i":"109-2|22","e":"109-2","n":22,"c":7,"s":"10公斤幼兒給予Cough Mixture B Syrup 0.25c.c./kg P.O. q.i.d.，其給藥器具及注意事項，下列何者正確？","o":["以小藥杯給藥時，給藥劑量刻度對準液體兩側緣","以小藥杯給藥時，給藥劑量刻度對準液體凸面","以空針給藥，給藥劑量刻度對準針心前端黑色圈下緣","以空針給藥，給藥劑量刻度對準針心前端黑色圈上緣"],"a":"D","k":"D","t":"","x":"10公斤幼兒單次劑量為0.25 mL×10＝2.5 mL，以空針給藥較精準，讀取刻度時應對準針心前端黑色橡皮圈的上緣（與針筒接觸的前緣）。以小藥杯給藥時，應將藥杯置於與視線平行處，讀取液體凹面最低點的刻度，而非兩側緣或凸面。"},{"i":"109-2|23","e":"109-2","n":23,"c":7,"s":"給藥之醫囑縮寫及其意義，下列何者正確？","o":["A.S.：左耳","S.C.：皮內注射","1 puff：1錠劑","O.D.：左眼"],"a":"A","k":"A","t":"","x":"A.S.（auris sinistra）表示左耳，A.D.為右耳。S.C.為皮下注射，皮內注射為I.D.；1 puff為吸入劑噴一下；O.D.為右眼，左眼為O.S.。"},{"i":"109-2|24","e":"109-2","n":24,"c":7,"s":"為一位二歲病童執行醫囑 Ofloxacin 5 gtts q.12h. A.D.，其給藥方式，下列何者正確？","o":["將左耳廓向下往後拉","將左耳廓向上往後拉","將右耳廓向上往後拉","將右耳廓向下往後拉"],"a":"D","k":"D","t":"","x":"A.D.表示右耳，因此應滴於右耳。3歲以下幼兒外耳道較短且向上彎，滴耳藥時應將耳廓往下、往後拉，使耳道變直；3歲以上及成人則往上、往後拉。"},{"i":"109-2|32","e":"109-2","n":32,"c":7,"s":"病人使用Nystatin（Mycostatin）含漱後吞服，主要是治療口腔何種細菌感染？","o":["金黃色葡萄球菌","大腸桿菌","白色念珠菌","綠膿桿菌"],"a":"C","k":"C","t":"","x":"Nystatin（Mycostatin）為抗黴菌藥物，含漱後吞服，可治療口腔白色念珠菌感染（俗稱鵝口瘡）。金黃色葡萄球菌、大腸桿菌與綠膿桿菌為細菌，需以抗生素治療。"},{"i":"109-1|7","e":"109-1","n":7,"c":7,"s":"執行成人bisacodyl（10 mg）1＃ supp. st.給藥時，下列敘述何者正確？","o":["給藥前，協助病人採右側臥","塞藥時，請病人深呼吸閉氣","若觸摸到糞便時，應避開糞便，使藥物接觸直腸黏膜","塞入深度為10公分（4英吋）讓藥物達到直腸"],"a":"C","k":"C","t":"","x":"塞入栓劑時若觸摸到糞便，應避開糞便，使藥物直接接觸直腸黏膜才能被吸收而發揮作用。肛門給藥應協助病人採左側臥；塞藥時請病人張口哈氣或說「啊」以放鬆肛門括約肌，不可閉氣；成人塞入深度約6.5～7.5公分。"},{"i":"109-1|8","e":"109-1","n":8,"c":7,"s":"有關肌肉注射法的敘述，下列何者正確？","o":["以95%的酒精消毒部位","由內向外消毒直徑約3吋","針頭與皮膚45度角插入2/3長度","迅速將藥物推入且快速拔出針頭"],"a":"B","k":"B","t":"","x":"肌肉注射前以75%酒精由內向外環形消毒直徑約3吋，待乾後再注射。95%酒精濃度過高、殺菌效果反而較差；肌肉注射針頭應與皮膚呈90度角插入；成人推藥宜緩慢以減輕疼痛，拔針後再以酒精棉片揉按注射部位。"},{"i":"109-1|9","e":"109-1","n":9,"c":7,"s":"曾先生，50歲，手術後第5天，醫囑「Acetaminophen 500 mg/tab 1# PO QID」，Acetaminophen成人的安全劑量為≦3 gm/天，下列敘述何者正確？","o":["病人此藥物用量已超出安全範圍","用此藥前應先了解病人有否肝臟病史","用此藥的目的為預防病人手術後感染","每次用此藥前須測量病人體溫"],"a":"B","k":"B","t":"","x":"Acetaminophen主要經肝臟代謝，過量或肝功能不良時易造成肝毒性，用藥前應先了解病人有無肝臟病史。每日用量500 mg×4＝2 g，未超出3 g的安全劑量；其作用為止痛、退燒，並非預防感染；術後規則使用主要在止痛，不需每次用藥前測量體溫。"},{"i":"109-1|21","e":"109-1","n":21,"c":7,"s":"有關藥物形式的敘述，下列何者錯誤？","o":["amp.表示「安瓿」","pulv.表示「糖漿」","Cap.表示「膠囊」","liq.表示「液體」"],"a":"B","k":"B","t":"","x":"pulv.（pulvis）表示「粉劑」，糖漿的縮寫為syr.（syrupus），故B錯誤。amp.為安瓿、Cap.為膠囊、liq.為液體，皆正確。"},{"i":"109-1|22","e":"109-1","n":22,"c":7,"s":"護理師給予瀉劑Bisacodyl 塞劑前，個案主訴腹絞痛，並冒冷汗不適，下列處置何者適當？","o":["請個案哈氣，迅速將藥物推入肛門內","將藥物緩緩塞入，用衛生紙壓住肛門口","立即停止給藥，並觀察生命徵象","請個案深呼吸，並告知此為正常反應"],"a":"C","k":"C","t":"","x":"給予栓劑前病人出現腹絞痛、冒冷汗，可能有急腹症或迷走神經反應等異常狀況，應立即停止給藥並觀察生命徵象，必要時報告醫師。此時不可強行或迅速推入藥物，也不應告知病人這是正常反應而繼續執行。"},{"i":"109-1|23","e":"109-1","n":23,"c":7,"s":"Ampicillin（500mg）1 vial粉劑藥物，病人需Ampicillin 250 mg iv，備藥過程下列何者正確？","o":["注入稀釋液5c.c.至vial瓶後，抽出等量空氣；藥物溶解後，再打入5 c.c.空氣，抽取5c.c.藥物","注入稀釋液5c.c.至vial瓶後，抽出等量空氣；藥物溶解後，再打入2.5 c.c.空氣，抽取2.5 c.c.藥物","注入稀釋液2.5 c.c.至vial瓶後，抽出等量空氣；藥物溶解後，再打入5 c.c.空氣，抽取2.5 c.c.藥物","注入稀釋液2.5 c.c.至vial瓶後，抽出等量空氣；藥物溶解後，再打入2.5 c.c.空氣，抽取2.5 c.c.藥物"],"a":"B","k":"B","t":"","x":"Ampicillin 500 mg粉劑注入稀釋液5 c.c.後，每c.c.含100 mg，需250 mg則抽取2.5 c.c.（x：250＝5：500）。抽藥前應先打入與欲抽取藥量等量的空氣（2.5 c.c.），以平衡瓶內壓力，故B正確。"},{"i":"109-1|30","e":"109-1","n":30,"c":7,"s":"病人口腔出現白色念珠菌感染，下列含漱溶液何者最適當？","o":["1：15 Aqua better-ioidine solution","Nystatin（Mycostatin）solution","2% boricacid solution","Xylocaine solution"],"a":"B","k":"B","t":"","x":"口腔白色念珠菌感染應使用抗黴菌藥物Nystatin（Mycostatin），使用時含於口中約5分鐘再吞下，使藥物接觸病灶以發揮療效。優碘稀釋液與硼酸溶液為一般口腔清潔用；Xylocaine為局部麻醉劑，只能止痛，無法治療念珠菌。"},{"i":"109-1|52","e":"109-1","n":52,"c":7,"s":"陳先生接受冠狀動脈繞道手術後，醫囑為Pethidine（Demerol）50 mg IM st.，下列敘述何者正確？","o":["如有需要給予Pethidine（Demerol）50 mg肌肉注射一次，可重複給","如有需要給予Pethidine（Demerol）50 mg肌肉注射一次，不可重複給","立即給予Pethidine（Demerol）50 mg肌肉注射一次，可重複給","立即給予Pethidine（Demerol）50 mg肌肉注射一次，不可重複給"],"a":"D","k":"D","t":"","x":"St.（stat）為立即醫囑，表示須立即執行，且僅執行一次，不可重複給予。「需要時給一次、不可重複」為S.O.S.醫囑；「需要時給予、可重複」為p.r.n.醫囑。"},{"i":"108-2|2","e":"108-2","n":2,"c":7,"s":"有關口服藥物的指導，下列敘述何者不適當？","o":["油類藥物可冰冷後服用","抗生素類藥物應確實遵守服藥間隔時間","碘劑可加水稀釋後用吸管吸取藥物","驅蟲劑於飯後服用效果較佳"],"a":"D","k":"D","t":"","x":"驅蟲劑應於空腹（如睡前或早餐前）服用，使藥物與寄生蟲充分接觸，效果較佳，飯後服用不適當。油類藥物可先冷卻以減少不適味道；抗生素須遵守服藥間隔以維持血中濃度；碘劑易使牙齒染色，應稀釋後以吸管服用。"},{"i":"108-2|22","e":"108-2","n":22,"c":7,"s":"護理師處理醫囑zolpidem（stilnox）1 P.O. bid，當其對此醫囑有疑問時，下列何者為最適當的處理？","o":["依醫囑按時給藥","詢問病人過去藥物史","與資深護理師討論","與開立醫囑醫師確認"],"a":"D","k":"D","t":"","x":"zolpidem為安眠藥，一般於睡前服用一次，醫囑開立bid不合常規；護理師對醫囑有疑問時，應直接與開立醫囑的醫師確認後再執行。不可依醫囑照常給藥，詢問病人或與其他護理師討論都無法取代醫師對醫囑的澄清。"},{"i":"108-2|29","e":"108-2","n":29,"c":7,"s":"張女士嘔吐，經抽血鉀離子：3.4 mEq/L，醫囑開立15% KCL（10mEq / 5mL /Amp）20 mL I.V. push St.，給藥前護理師應針對該醫囑那些項目向醫師作確認？①藥物劑量 ②藥物時間 ③藥物途徑 ④藥物名稱","o":["①④","②③","①③","②④"],"a":"C","k":"C","t":"","x":"15% KCl每5 mL含10 mEq，20 mL即含40 mEq，以血鉀3.4 mEq/L的輕度低血鉀而言劑量偏高，須確認劑量；KCl為高警訊藥物，絕不可靜脈推注，必須稀釋後緩慢滴注，故途徑必須確認。藥名與給藥時間（St.）在醫囑中均已明確。"},{"i":"108-2|30","e":"108-2","n":30,"c":7,"s":"陳先生罹患糖尿病，醫囑開立RI 20U S.C. tid A.C.，以胰島素空針注射之技術，下列何者錯誤？","o":["注射前詢問病人進餐時間","注射前評估上次施打部位","捏起皮膚及肌肉，將針頭插入肌肉層","注射後稍微加壓即可，不需按摩"],"a":"C","k":"C","t":"","x":"胰島素應注射於皮下組織，若病人較瘦，可輕捏起皮膚後注射，不可將針頭插入肌肉層，以免吸收過快造成低血糖，故C錯。RI於飯前注射，注射前應確認進餐時間並評估上次注射部位以輪替；注射後不需反抽、不可按摩。"},{"i":"108-2|31","e":"108-2","n":31,"c":7,"s":"有關藥物與食物服用禁忌之說明，下列敘述何者錯誤？","o":["茶水與鐵劑一起服用，會形成鞣酸鐵之沉澱物","牛奶會抑制瀉劑dulcolax之吸收","酒精會促進抗組織胺對中樞神經之抑制作用","菠菜會加強抗擬血劑warfarin之藥效"],"a":"D","k":"D","t":"","x":"菠菜等深綠色蔬菜富含維生素K，會拮抗warfarin的抗凝血作用，使藥效減弱而非加強，故D錯。茶中鞣酸會與鐵劑形成沉澱；牛奶為鹼性，會使dulcolax腸衣提早溶解而影響作用；酒精會加強抗組織胺對中樞神經的抑制。"},{"i":"108-2|32","e":"108-2","n":32,"c":7,"s":"給軟便劑時，病人主訴服用該藥物後腹瀉嚴重，拒絕服用，此時下列何者為護理師最適當之處置？","o":["向病人解釋這是正常藥物反應，請病人繼續服藥","將藥物給病人，告知等腹瀉停止後再服用","暫停給藥，報告醫師病人狀況","將藥物劑量減半給予病人，繼續觀察腹瀉"],"a":"C","k":"C","t":"","x":"病人服用軟便劑後出現嚴重腹瀉，屬藥物不良反應，護理師應暫停給藥並報告醫師，由醫師評估是否調整醫囑。告知為正常反應繼續服藥、留藥給病人自行服用，或自行將劑量減半，皆不適當且不在護理師權責內。"},{"i":"108-2|36","e":"108-2","n":36,"c":7,"s":"下列4項術後醫囑，何者是護理師給藥前必須提出強烈的質疑？","o":["Lactated -Ringer's solution 80mL/hour I.V.F.","KCl（40 mEq/Amp）20 mEq I.V. push","Gentamycin 60mg in 50 mL D5W over 30 minutes I.V.F.","D5W 100 mL/hour I.V.F."],"a":"B","k":"B","t":"","x":"KCl為高警訊藥物，絕不可靜脈推注（I.V. push），以免血鉀急速升高導致心律不整甚至心跳停止，必須稀釋後緩慢靜脈滴注，因此護理師應提出強烈質疑。其他醫囑皆為一般的靜脈輸液或稀釋後滴注給藥。"},{"i":"108-2|50","e":"108-2","n":50,"c":7,"s":"一位長期服用furosemide（Lasix®）、Warfarin®的病人，其飲食衛教下列何者適當？","o":["高鉀及高維生素K攝取","低鉀及高維生素K攝取","高鉀及限維生素K攝取","低鉀及限維生素K攝取"],"a":"C","k":"C","t":"","x":"furosemide為排鉀利尿劑，長期使用易造成低血鉀，飲食應補充高鉀食物；warfarin為抗凝血劑，維生素K會拮抗其作用，應限制並維持穩定的維生素K攝取，避免大量深綠色蔬菜。故以高鉀及限維生素K攝取為宜。"},{"i":"108-1|14","e":"108-1","n":14,"c":7,"s":"有關核對及執行醫囑的注意事項，下列何者錯誤？","o":["自醫師開立醫囑日起即為醫囑的有效日期，直到該醫囑停止前皆須執行","p.r.n.為臨時醫囑，病人需要時給予，且只給一次","S.O.S.為臨時醫囑，如有需要給予一次且僅能執行一次，超過12小時未執行即失效","當出現醫囑更新（order renew）時，表示order renew 以上之醫囑無效，以下之醫囑才有效"],"a":"B","k":"B","t":"","x":"p.r.n.屬長期醫囑，病人需要時即可給予，只要符合給藥間隔可重複執行，並非只給一次，故B錯。S.O.S.為臨時醫囑，需要時給一次，超過12小時未執行即失效；醫囑自開立日起生效至停止為止；order renew表示其以上的醫囑失效。"},{"i":"108-1|16","e":"108-1","n":16,"c":7,"s":"宋先生，30歲，因左中耳炎接受耳朵滴入藥物治療，有關給予藥物時之敘述，下列何者錯誤？","o":["協助宋先生採右側臥，讓左耳朝上，以利操作","滴藥前宋先生左耳耳垂向下向後拉，使外耳道拉直","將藥物沿著外耳道壁滴入，勿直接滴於鼓膜上","滴藥後協助宋先生維持原姿勢10分鐘，再將頭部擺正"],"a":"B","k":"B","t":"","x":"成人或3歲以上者滴耳藥時，應將耳廓往上、往後拉，使外耳道變直；3歲以下幼童才是往下、往後拉，故B錯。滴藥時患側朝上，藥液沿外耳道壁滴入，避免直接滴於鼓膜，滴後維持姿勢約10分鐘，使藥液充分作用。"},{"i":"108-1|17","e":"108-1","n":17,"c":7,"s":"張小弟，體重6公斤，醫囑開立「Amoxicillin I.V. drip q6h」，此藥物單次成人劑量為500 mg，依克拉克氏法則（Clark’s rule），張小弟單次用藥劑量應是多少mg？","o":["64 mg","54 mg","44 mg","34 mg"],"a":"C","k":"C","t":"","x":"克拉克氏法則：兒童劑量＝（兒童體重磅數÷150）×成人劑量。6公斤×2.2＝13.2磅，13.2÷150×500 mg＝44 mg，故張小弟單次劑量為44 mg。"},{"i":"108-1|18","e":"108-1","n":18,"c":7,"s":"護理師發藥時發現病人上一餐的藥物忘記服用，則該如何處理較合宜？","o":["請病人將上一餐藥物服下，這次藥物不用給","將上一餐藥物收回，並做護理記錄及交班","請醫師將口服藥改成注射藥以免病人藏藥","請病人將藥物帶回，提醒家屬督促病人服藥"],"a":"B","k":"B","t":"","x":"發現病人上一餐藥物未服用時，不可自行要求補服或與本次藥物合併服用，以免藥物過量或改變血中濃度；應將藥物收回，並做護理記錄與交班，必要時告知醫師。將藥物交給病人或家屬帶回、自行要求改為注射皆不恰當。"},{"i":"108-1|19","e":"108-1","n":19,"c":7,"s":"醫囑「Demerol 40 mg IM Q6H PRN」，Demerol製劑為50 mg/1 mL/Amp，有關此醫囑的執行，下列敘述何者正確？","o":["每間隔6小時必須給藥","每日給藥劑量最高為240 mg","每日至多可給藥4次","單次給藥劑量為0.6 mL"],"a":"C","k":"C","t":"","x":"PRN為需要時才給藥，q6h表示兩次給藥至少間隔6小時，因此每日最多給藥4次，最高劑量為40 mg×4＝160 mg，並非每6小時必須給藥。單次劑量為40 mg ÷ 50 mg/mL＝0.8 mL，非0.6 mL。"},{"i":"108-1|20","e":"108-1","n":20,"c":7,"s":"教導糖尿病病人胰島素自我注射相關注意事項，下列敘述何者錯誤？","o":["短效胰島素藥液呈透明狀","中效胰島素藥液呈透明狀","插入針頭後不需反抽針心","注射後不需按摩"],"a":"B","k":"B","t":"","x":"短效胰島素藥液呈清澈透明狀，中效胰島素為混懸液呈白色混濁，使用前需輕輕滾動混勻，故B錯。胰島素皮下注射時不需反抽針心，注射後不可按摩，以免吸收過快造成低血糖。"},{"i":"108-1|21","e":"108-1","n":21,"c":7,"s":"曾先生為氣喘病人，醫囑「Ipratropium bromide（Atrovent）2 PUFF INHA QD」，Ipratropium為MDI（metered dose inhaler）製劑，下列敘述何者正確？①用藥時宜採取坐姿或站姿 ②按壓兩次藥瓶後吸藥 ③吸藥後憋氣10秒 ④接連吸兩口藥不要停頓","o":["①②","①③","②④","③④"],"a":"B","k":"B","t":"","x":"使用定量噴霧吸入器時宜採坐姿或站姿，使肺部擴張；按壓一次藥瓶同時深吸氣，吸藥後憋氣約10秒，讓藥物沉積於呼吸道。每次按壓只吸一口，需吸兩口時應間隔約1分鐘再吸第二口，故②④錯。"},{"i":"108-1|27","e":"108-1","n":27,"c":7,"s":"有關影響病人用藥劑量之因素，下列敘述何者正確？","o":["以體表面積計算兒童用藥劑量是最不精準的計算法","70歲老人之用藥劑量通常為成人之二分之一","病人對於藥物的期待心理可能使藥效更顯著，降低用量有時可達預期效果","心肝腎衰竭病人因吸收能力差，用藥劑量應較一般人多"],"a":"C","k":"C","t":"","x":"病人對藥物的心理期待可能產生安慰劑效應，使藥效更顯著，有時降低用量即可達預期效果。以體表面積計算兒童劑量最精準；60～80歲老人用量約為成人的4/5；心肝腎衰竭病人藥物代謝與排泄變差，劑量應減少而非增加。"},{"i":"107-2|15","e":"107-2","n":15,"c":7,"s":"以下醫囑：N/S 500 c.c. + KCL 15 mEq IVD stat.，如果KCL 1 amp.容量為 20 c.c. 內含有KCL 40 mEq，加入的KCL有多少c.c.？","o":["5 c.c.","7.5 c.c.","10 c.c.","15 c.c."],"a":"B","k":"B","t":"","x":"KCl 1 amp為20 c.c.含40 mEq，即每c.c.含2 mEq。醫囑需15 mEq，以比例式 x：15 = 20：40，求得 x = 7.5 c.c.。"},{"i":"107-2|16","e":"107-2","n":16,"c":7,"s":"有關口服給藥的注意事項，下列敘述何者正確？①不能同時服用的藥物，宜間隔 30 分鐘後再服用 ②為加速 tetracycline 的藥效，建議與牛奶一起服用 ③鐵劑應使用吸管服用 ④口服藥物為能減輕苦味均可以配果汁服用","o":["①②","③④","①③","②④"],"a":"C","k":"C","t":"","x":"有交互作用而不能同時服用的兩種藥物，應間隔30分鐘後再服用；鐵劑易使牙齒染色、破壞琺瑯質，應稀釋後以吸管服用。tetracycline會與牛奶中的鈣結合而降低吸收，不可併服；也並非所有藥物都適合配果汁服用，故②④錯。"},{"i":"107-2|17","e":"107-2","n":17,"c":7,"s":"有關執行口服給藥的注意事項，下列何者正確？","o":["咳嗽糖漿，應與溫水一起服用，使咽喉黏膜可以獲得舒潤","服用鐵劑時，切記勿加水稀釋，以免減少藥效","油類藥物，例如：蓖麻油，可先冰冷之後再服用","當病人無法服藥或拒服時，可先將藥物放在床旁桌，再繼續追蹤服藥情形"],"a":"C","k":"C","t":"","x":"油類藥物如蓖麻油可先冷卻藥物或口含冰塊麻痺味覺，以減輕不適味道。咳嗽糖漿服用後30分鐘內宜暫勿飲水，以免降低療效，A錯；鐵劑應加水稀釋後以吸管服用，B錯；病人無法服藥或拒服時不可將藥物留置床旁，應收回並記錄、交班，D錯。"},{"i":"107-2|18","e":"107-2","n":18,"c":7,"s":"王先生，45歲，胰臟炎術後，抽血檢查鉀離子2.7 mEq/L，醫囑開立KCL 10 mEq St.，護理師在執行此醫囑時，下列何者必須先向開立醫囑醫師澄清？","o":["藥物劑量","給藥途徑","給藥時間","藥物名稱"],"a":"B","k":"B","t":"","x":"KCl為高警訊藥物，絕不可靜脈推注，須稀釋後緩慢靜脈滴注或口服。此醫囑未載明給藥途徑，不符合「途徑對」的核對原則，執行前必須先向開立醫囑的醫師澄清；藥名、劑量與給藥時間（St.）在醫囑中皆已明確。"},{"i":"107-2|19","e":"107-2","n":19,"c":7,"s":"郭小妹，6歲，體重18公斤，醫囑「vancomycin 240mg IVF q6h」。vancomycin 的藥品說明書載明：「孩童的安全用量為40mg/kg/day，須分次給藥」。針對此醫囑的執行，下列敘述何者最適當？","o":["對於醫囑之給藥劑量提出疑問","對於醫囑之給藥途徑提出疑問","依醫囑給藥並計算每分鐘滴速","依醫囑給藥並小心觀察副作用"],"a":"A","k":"A","t":"","x":"安全用量為40 mg/kg/day × 18 kg = 720 mg/day，q6h分4次給藥，每次應為180 mg。醫囑每次240 mg（每日960 mg）已超過安全劑量，護理師應對給藥劑量提出疑問並與醫師確認，不可直接依醫囑執行。"},{"i":"107-2|20","e":"107-2","n":20,"c":7,"s":"對於心肌梗塞病人於胸痛時給與nitroglycerin（NTG）藥物前後評估之重點，下列何者正確？①瞳孔大小 ②血壓 ③疼痛部位及程度 ④體溫","o":["①②","①④","②③","③④"],"a":"C","k":"C","t":"","x":"NTG可擴張血管以緩解心絞痛，給藥前後需評估胸痛部位與程度以判斷療效；因血管擴張會使血壓下降，也須監測血壓，並採坐姿避免跌倒。瞳孔大小與體溫並非NTG用藥前後的評估重點。"},{"i":"107-1|8","e":"107-1","n":8,"c":7,"s":"有關「醫囑」的敘述，下列何者正確？","o":["「S.O.S.」和「p.r.n.」是屬於臨時醫囑","長期醫囑表示必須執行至病人出院為止，不可變更","醫囑重整後，之前的長期醫囑視同「停止（D.C.）」","凡護理措施必須有臨時或長期醫囑的依據"],"a":"C","k":"C","t":"","x":"醫囑重整（重整醫囑）時，之前所有的長期醫囑均視同停止（D.C.），需依重整後的醫囑執行，故選(C)。S.O.S.為臨時醫囑，p.r.n.屬長期醫囑；長期醫囑可隨病情由醫師更改或停止；獨立性護理措施不需醫囑即可執行。"},{"i":"107-1|11","e":"107-1","n":11,"c":7,"s":"醫囑為D.C. Aspirin 100 mg 1# P.O.之含意，下列何者正確？","o":["飯前給予口服Aspirin 100 mg一顆","飯後給予口服Aspirin 100 mg一顆","停止口服Aspirin 100 mg一顆","需要時給予口服Aspirin 100 mg一顆"],"a":"C","k":"C","t":"","x":"D.C.為discontinue的縮寫，表示停止，故醫囑「D.C. Aspirin 100 mg 1# P.O.」為停止口服Aspirin 100 mg一顆，選(C)。飯前為a.c.，飯後為p.c.，需要時為p.r.n.。"},{"i":"107-1|13","e":"107-1","n":13,"c":7,"s":"醫囑為Dulcolax 1# supp. St.之含意，下列何者正確？","o":["常規性給予Dulcolax 1#口服","需要時給予Dulcolax 1#塞劑","立即給予Dulcolax 1#塞劑","需要時給予Dulcolax 1#舌下"],"a":"C","k":"C","t":"","x":"supp.為栓劑（suppository），St.為stat，表示立即給予，因此醫囑為立即給予Dulcolax塞劑1顆，故選(C)。需要時為p.r.n.；口服為P.O.；舌下為S.L.。"},{"i":"107-1|16","e":"107-1","n":16,"c":7,"s":"當你進入病房預備給予病人口服藥物時，病人正在浴廁間，此時病人請你將藥物放置在床旁桌上；你的反應，何者最適合？","o":["告訴病人，藥物放在床旁桌上","告訴病人，你待會兒會再回來給藥","告訴病人，你會在病房內等候他出來","進入浴廁間，將藥物直接拿給病人"],"a":"B","k":"B","t":"","x":"給予口服藥時，護理師應確認病人將藥物服下才可離開，不可將藥物留置於床旁桌上，以免病人忘記服用、誤服或被他人取用；病人在浴廁時可告知稍後再回來給藥，故選(B)。進入浴廁間給藥則侵犯病人隱私。"},{"i":"107-1|17","e":"107-1","n":17,"c":7,"s":"李先生手術後回到病房，手臂上留有靜脈滴注之管路，主訴疼痛程度為 8 分（用 0～10 分之疼痛評估量表），護理師查看醫囑單，醫囑為：「Demerol 40 mg q.4h. p.r.n. for pain」，依據病人目前情況及醫囑，護理師最適當的行動為何？","o":["給予Demerol 40 mg肌肉注射","給予Demerol 40 mg靜脈注射","稍後再重新評估病人疼痛情形","聯絡醫師澄清及確認醫囑"],"a":"D","k":"D","t":"","x":"醫囑「Demerol 40 mg q.4h. p.r.n. for pain」未註明給藥途徑，護理師不可自行決定以肌肉或靜脈注射，應聯絡醫師澄清及確認醫囑後再給藥，故選(D)。病人疼痛已達8分，延後評估讓病人忍痛亦不恰當。"},{"i":"107-1|18","e":"107-1","n":18,"c":7,"s":"張先生為第2型糖尿病病人，醫囑「RI（Regular Insulin）6U. S.C. a.c. t.i.d.」，下列敘述何者錯誤？","o":["飯前一小時給藥","避免注射在前次相同部位","注射後不需按摩","一天給藥三次"],"a":"A","k":"A","t":"","x":"a.c.為飯前，短效胰島素RI約於飯前30分鐘皮下注射，使藥效與進食後血糖上升時間配合；飯前一小時給藥易發生低血糖，故(A)錯誤。注射部位應輪替、避免同一部位；注射後不需按摩；t.i.d.為一天三次。"},{"i":"107-1|19","e":"107-1","n":19,"c":7,"s":"長期使用Warfarin（Coumadin）的病人，下列措施何者不適宜？","o":["鼓勵多攝取深綠色蔬菜","注射時，儘量選用較細的針頭","注射後需加強加壓注射部位","教導病人認識出血徵兆"],"a":"A","k":"A","t":"","x":"Warfarin為抗凝血劑，深綠色蔬菜含大量維生素K，會拮抗Warfarin的作用、降低藥效，故不宜鼓勵大量攝取，(A)不適宜。因出血風險增加，注射時宜選用較細的針頭並加強加壓注射部位，且應教導病人認識出血徵兆。"},{"i":"107-1|26","e":"107-1","n":26,"c":7,"s":"對於痰多不易咳出的病人，給予蒸氣吸入之目的，下列何者正確？①以蒸氣方式將熱應用於呼吸道部位 ②濕潤呼吸道黏膜，稀釋分泌物 ③提供濕度，增加血氧濃度 ④藉此提供擬副交感神經藥物，讓支氣管鬆弛","o":["①②","①④","②③","③④"],"a":"A","k":"A","t":"","x":"蒸氣吸入屬溼吸入法，以溫熱蒸氣將熱與濕度應用於呼吸道（①），可濕潤呼吸道黏膜、水化並稀釋痰液，使痰易咳出（②），故選①②。蒸氣吸入並不能直接提高血氧濃度；擬副交感神經藥物會使支氣管收縮，且單純蒸氣吸入不含藥物。"},{"i":"107-1|37","e":"107-1","n":37,"c":7,"s":"李太太，78歲，因骨折臥床三個月，肌肉鬆弛，BMI = 16.7，入院進行髖關節置換術。李太太須接受肌肉注射手術前藥物3 c.c.，下列何者是應優先選擇的肌肉注射部位？","o":["腹臀肌","上臂三角肌","臀大肌","股直肌"],"a":"A","k":"A","t":"","x":"李太太年老、長期臥床、肌肉鬆弛且BMI偏低，腹臀肌（臀小肌）肌肉層厚、遠離主要神經與血管，是較安全且可容納3 c.c.藥量的肌肉注射部位，故選(A)。上臂三角肌肌肉量少，不適合3 c.c.；臀大肌有傷及坐骨神經的危險，且臥床萎縮者更不適合。"},{"i":"107-1|54","e":"107-1","n":54,"c":7,"s":"有關純蛋白衍化物試驗（purified protein derivative, PPD test），下列敘述何者正確？","o":["目的為找出過敏原","最常用的注射部位為前臂中段內側","適用於氣喘病人之診斷","採用Z型注射"],"a":"B","k":"B","t":"","x":"PPD試驗（結核菌素皮膚試驗）採皮內注射，最常用的注射部位為前臂中段內側，注射後48～72小時判讀，硬結≧1公分為陽性，故選(B)。其目的為測試體內是否曾感染結核菌，而非找出過敏原或診斷氣喘；Z字形注射屬肌肉注射技術。"},{"i":"106-2|12","e":"106-2","n":12,"c":7,"s":"醫囑為Digoxin 0.25 mg 1# S.L. qd之含義，下列何者正確？","o":["持續每天早上給予Digoxin 0.25 mg 1顆飯後吞服","需要時每天早上給予Digoxin 0.25 mg 1顆舌下含服","持續每天早上給予Digoxin 0.25 mg 1顆舌下含服","需要時每天早上給予Digoxin 0.25 mg 1瓶皮下注射"],"a":"C","k":"C","t":"","x":"醫囑「Digoxin 0.25 mg 1# S.L. qd」：S.L.為舌下含服，qd為每天一次（通常於早上給予），未註明p.r.n.，屬持續執行的長期醫囑，故選(C)。"},{"i":"106-2|15","e":"106-2","n":15,"c":7,"s":"有關用藥劑量的觀念，下列何者正確？","o":["80歲以上老人用藥劑量是成人之1/4","使用藥物的劑量一般與體重成正比","10歲以上兒童可服用成人之劑量","運用體表面積計算兒童用藥劑量最不準確"],"a":"B","k":"B","t":"","x":"藥物劑量一般與體重成正比，體重或體型較大者所需劑量較多，故選(B)。80歲以上老人用藥劑量通常為成人的1/2；12歲以上兒童才可開始酌用成人劑量；依體表面積計算兒童劑量最為精準。"},{"i":"106-2|16","e":"106-2","n":16,"c":7,"s":"有關胰島素注射之敘述，下列何者正確？","o":["應注射在肌肉組織層","使用1/2吋針頭時應以45度角注射","注射部位需輪換","注射後，應以手輕揉注射部位，以利吸收"],"a":"C","k":"C","t":"","x":"長期注射胰島素應輪替注射部位，避免同一部位重複注射造成組織纖維化，故選(C)。胰島素應注射於皮下組織而非肌肉層；使用胰島素空針（短針）時應以90度角垂直注射；注射後不可揉按，以免吸收過快而發生低血糖。"},{"i":"106-2|17","e":"106-2","n":17,"c":7,"s":"丁太太昨日接受剖腹手術，術後24小時仍未排氣，因此醫囑予Dulcolax 2#Supp（10 mg）q4h prn。丁太太之醫囑內容為何？","o":["Dulcolax丸劑2顆，需要時間隔四小時給一次","Dulcolax丸劑2顆，需要時給一次或每四小時給一次","Dulcolax栓劑2顆，需要時間隔四小時給一次","Dulcolax栓劑2顆，需要時給一次或每四小時給一次"],"a":"C","k":"C","t":"","x":"Supp為栓劑，2#為2顆，q4h prn為「需要時給予，且兩次給藥須間隔4小時」，故選(C)。p.r.n.可在需要時重複使用，並非只給一次，也不是常規每4小時給一次。"},{"i":"106-2|18","e":"106-2","n":18,"c":7,"s":"（情境：丁太太昨日接受剖腹手術，術後24小時仍未排氣，因此醫囑予Dulcolax 2#Supp（10 mg）q4h prn。）在給予藥物時，下列何者正確？","o":["給藥時請丁太太採屈膝仰臥姿勢","給藥後應以衛生紙壓住肛門，直到丁太太無便意感","給藥後請丁太太立即下床解便","不可在藥劑前端塗少量潤滑劑，以免影響藥物吸收"],"a":"B","k":"B","t":"","x":"塞劑推入後應以衛生紙輕壓肛門，直到病人便意感消失，並請病人保持姿勢約15～20分鐘，讓藥物溶解發揮作用，故選(B)。給予肛門塞劑應採左側臥；給藥後不宜立即下床解便，以免藥物排出；藥物前端可塗少量潤滑劑以減少不適。"},{"i":"106-2|19","e":"106-2","n":19,"c":7,"s":"對長期營養不良、四肢異常消瘦的病人執行肌肉注射時，下列部位何者最適合？","o":["上臂三角肌","臀部之腹臀肌","臀部之背臀肌","股外側肌"],"a":"B","k":"B","t":"","x":"腹臀肌（臀小肌）肌肉層厚、遠離主要神經與血管，即使是消瘦病人也有足夠的肌肉量，為較安全的肌肉注射部位，故選(B)。上臂三角肌肌肉量少，消瘦者更少；背臀肌注射有傷及坐骨神經的危險，且消瘦者臀部肌肉萎縮明顯；股外側肌亦受肌肉消瘦影響。"},{"i":"106-2|20","e":"106-2","n":20,"c":7,"s":"有關口服藥物之用藥指導，下列何者正確？","o":["Rifampicin（RIF）於空腹服用以增強吸收","腸衣錠製劑需磨粉以促進吸收","Ampicillin抗生素與果汁併服以沖淡味道","鐵劑與茶葉一起服用可增加藥效"],"a":"A","k":"A","t":"","x":"Rifampicin空腹服用吸收較佳，宜於飯前空腹服用，故選(A)。腸衣錠不可磨粉，以免藥物在胃中被破壞或刺激胃黏膜；Ampicillin與酸性果汁併服會降低藥效；鐵劑與茶併服，茶中的鞣酸會降低鐵的吸收。"},{"i":"106-2|21","e":"106-2","n":21,"c":7,"s":"當病人需要使用RI（Regular Insulin）與NPH 兩種藥物的混合劑時，下列備藥措施何者正確？","o":["抽藥前用力搖晃NPH藥瓶","NPH使用前須先稀釋","抽藥時首先抽取RI藥瓶","抽藥前先打空氣至RI藥瓶再打至NPH藥瓶"],"a":"C","k":"C","t":"","x":"混合抽取RI與NPH時，應先將空氣打入NPH（濁）藥瓶，再打空氣入RI（清）藥瓶，接著先抽取RI，最後抽NPH，以免中效胰島素污染短效藥瓶，故選(C)。NPH使用前應以手掌輕搓滾動混勻而非用力搖晃；NPH不需稀釋；打空氣的順序應先NPH後RI。"},{"i":"106-2|78","e":"106-2","n":78,"c":7,"s":"某護理師，白班早上備藥時按照規範進行三讀五對，赫然發現藥局配的藥物出現每日劑量與醫囑不一致，應該是每日一顆0.5 mg/顆，藥局配成每日一顆1.0 mg/顆。此時護理師最應先執行的行為，下列何者正確？","o":["先重新核對醫囑確認劑量及每日應有的顆數","先打電話到藥局澄清該藥物是否是新包裝","直接將藥物自行撥一半給病人以免耽誤吃藥時間","直接打電話問醫師確認應該給的劑量"],"a":"A","k":"A","t":"","x":"三讀五對時發現藥局所配藥物劑量與醫囑記錄不一致，應先重新核對醫囑，確認正確的劑量及每日應給的顆數，確定後再與藥局聯繫更正，故選(A)。不可自行將藥物剝半給予；在未確認醫囑前，直接詢問藥局或醫師都不是最優先的步驟。"},{"i":"106-1|4","e":"106-1","n":4,"c":7,"s":"醫囑為Acetaminophen 1 tab q6h p.r.n. if BT≧39℃之含義，下列敘述何者正確？","o":["當體溫大於或等於39℃，常規每6小時服用Acetaminophen 1 顆","當體溫大於或等於39℃，則給予Acetaminophen 1顆後此醫囑即失效","當體溫大於或等於39℃，則給予Acetaminophen 1顆，下次如有需要需間隔6小時","當體溫大於或等於39℃，則給予一次Acetaminophen 1顆，但此醫囑超過12小時後自動失效"],"a":"C","k":"C","t":"","x":"p.r.n.為「需要時給予」，屬長期醫囑，可在符合條件時重複使用，但兩次給藥須間隔所規定的時間；本醫囑即體溫≧39℃時給予1顆，下次需要時須間隔6小時，故選(C)。(A)不是常規給藥；(B)與(D)為S.O.S.醫囑的特性（給一次或12小時後失效）。"},{"i":"106-1|11","e":"106-1","n":11,"c":7,"s":"（情境：醫師為孫小姐開列下列醫囑：①Normal Saline 1,000 c.c. IV drip qd ②Lactated Ringer's Solution 500 c.c. IV drip qd ③Gentamycin oint. O.U. qid ④Demerol 50 mg IM q4h p.r.n. ⑤Cimedin tablet 200 mg 1 tablet H.S. ⑥Steam inhalation 15 min S.O.S. ⑦CBC C.M.。）下列敘述何者錯誤？","o":["孫小姐睡前有1顆藥需服用","「Demerol 50 mg IM q4h p.r.n.」為臨時醫囑","孫小姐每天的靜脈注射量為1,500 c.c.","孫小姐明日一早需抽血測全血球計數"],"a":"B","k":"B","t":"","x":"p.r.n.醫囑雖是需要時才給，但可在醫囑有效期間依間隔時間重複使用，屬長期醫囑，故(B)「為臨時醫囑」錯誤。Cimedin 1顆H.S.為睡前服用；兩項輸液每日共1,000＋500＝1,500 c.c.；CBC C.M.表示明晨抽血檢驗全血球計數。"},{"i":"106-1|12","e":"106-1","n":12,"c":7,"s":"（情境：醫師為孫小姐開列下列醫囑：①Normal Saline 1,000 c.c. IV drip qd ②Lactated Ringer's Solution 500 c.c. IV drip qd ③Gentamycin oint. O.U. qid ④Demerol 50 mg IM q4h p.r.n. ⑤Cimedin tablet 200 mg 1 tablet H.S. ⑥Steam inhalation 15 min S.O.S. ⑦CBC C.M.。）當給予孫小姐Gentamycin oint. 時，護理師該如何執行？","o":["給予右眼","給予左眼","給予雙眼","給予右耳"],"a":"C","k":"C","t":"","x":"O.U.為oculus uterque的縮寫，表示雙眼，故Gentamycin眼藥膏應給予雙眼，選(C)。右眼為O.D.，左眼為O.S.，右耳為A.D.。"},{"i":"106-1|13","e":"106-1","n":13,"c":7,"s":"（情境：醫師為孫小姐開列下列醫囑：①Normal Saline 1,000 c.c. IV drip qd ②Lactated Ringer's Solution 500 c.c. IV drip qd ③Gentamycin oint. O.U. qid ④Demerol 50 mg IM q4h p.r.n. ⑤Cimedin tablet 200 mg 1 tablet H.S. ⑥Steam inhalation 15 min S.O.S. ⑦CBC C.M.。）有關孫小姐「Steam inhalation 15 min S.O.S.」醫囑的敘述，下列何者錯誤？","o":["自醫囑開立12小時後，孫小姐才出現治療需求，此時需請醫師重新開立醫囑","於開立醫囑12小時內，如果有治療需求，則需給予孫小姐15分鐘的蒸氣","此為臨時醫囑","於開立醫囑12小時內，已接受一次治療，後來又出現治療需求，仍可給予治療"],"a":"D","k":"D","t":"","x":"S.O.S.為臨時醫囑，意指「需要時給予一次」，有效時間為12小時；12小時內出現需要時可執行一次，執行後醫囑即失效，若再有需要須請醫師重新開立，故(D)錯誤。超過12小時未使用亦自動失效，需重新開立。"},{"i":"106-1|15","e":"106-1","n":15,"c":7,"s":"李老先生因罹患糖尿病多年，血糖控制不佳，醫囑開立 RI 20 IU SC tid、NPH 8 IU SC bid，下列有關注射此藥的敘述，何者正確？","o":["注射前不需詢問病人是否有進食，因此項醫囑為常規性醫囑","注射前需評估上次施打部位","注射前直接從冰箱拿出藥品，馬上給予注射，以免破壞藥效","抽藥時應先抽取 NPH，再抽取 RI"],"a":"B","k":"B","t":"","x":"長期注射胰島素應輪替注射部位，避免同一部位重複注射造成組織纖維化或脂肪萎縮，因此注射前需評估上次施打部位，故選(B)。胰島素需確認病人會進食以防低血糖；冷藏藥品宜先回溫再注射以減少疼痛；混合抽藥時應先抽短效RI（清）再抽中效NPH（濁）。"},{"i":"106-1|16","e":"106-1","n":16,"c":7,"s":"（情境：李老先生罹患糖尿病多年，血糖控制不佳，醫囑開立 RI 20 IU SC tid、NPH 8 IU SC bid。）若要教導李老先生如何注射胰島素，下列何者正確？","o":["選擇部位肩峰突起下三橫指","使用一般針頭與皮膚垂直90度，針頭插入2/3深度","注射部位消毒，由中間往外圍環狀消毒直徑3吋","注射後可輕揉注射部位30~60秒"],"a":"C","k":"C","t":"","x":"注射前皮膚以酒精棉由中心往外環狀消毒，範圍直徑約3吋，故選(C)。肩峰突下三橫指為三角肌肌肉注射部位；以一般針頭垂直90度插入2/3屬肌肉注射，胰島素應使用胰島素空針注入皮下；注射後不可揉按，以免加速吸收造成低血糖。"},{"i":"106-1|17","e":"106-1","n":17,"c":7,"s":"張女士因慢性腎病住院，早上9點口服藥物：Brown Mixture 15 mL qid、Acetaminophen 1# qid、MgO 1# qid、Ferrous 10 gtt qid。護理師教導張女士正確服藥順序，下列何者應最後服用？","o":["Acetaminophen","Brown Mixture","Ferrous","MgO"],"a":"B","k":"B","t":"","x":"咳嗽糖漿（如Brown Mixture）需覆蓋咽喉黏膜發揮局部止咳效果，與開水併服會降低療效，應最後服用且30分鐘內暫勿飲水，故選(B)。其他錠劑與鐵劑可先以開水服用。"},{"i":"106-1|18","e":"106-1","n":18,"c":7,"s":"郭護理師正在準備一位即將手術的A病人肌肉注射術前給藥，已將藥物抽好在針筒中；這時B病人因點滴不滴而拉紅燈，郭護理師在處理B病人的點滴問題時，同時接到須立即送A病人至手術室的通知；此時王護理師過來協助，郭護理師請王護理師幫忙執行 A 病人之術前給藥肌肉注射；下列何者為王護理師當下最適當的反應？","o":["為A病人執行術前給藥肌肉注射","重新準備A病人的術前藥物","接手處理B病人之點滴問題","先聯繫手術室病人會延遲送達"],"a":"C","k":"C","t":"","x":"給藥須遵守「誰準備誰給藥」原則，王護理師不可替郭護理師注射她已抽好的藥物，因無法核對藥物、劑量是否正確。最適當的做法是由王護理師接手處理B病人的點滴問題，讓郭護理師親自完成A病人的術前給藥，故選(C)；重新準備藥物或延遲送達都會延誤病人手術。"},{"i":"106-1|19","e":"106-1","n":19,"c":7,"s":"護理師進入病室準備執行9AM之口服給藥，發現病人有嘔吐、腹瀉及發燒情形，且意識混亂；下列何者為護理師最適當的處理？","o":["依照醫囑給予9AM口服藥","將口服藥改為肌肉注射給藥","等病人嘔吐後再給予9AM之口服藥","先不給予9AM之口服藥並立即連絡醫師"],"a":"D","k":"D","t":"","x":"病人有嘔吐、腹瀉、發燒且意識混亂，不適合口服給藥（嘔吐時藥物無法保留吸收，意識不清易嗆入），應先暫停口服藥並立即聯絡醫師評估處理，故選(D)。護理師不可自行更改給藥途徑，也不宜等候再給。"},{"i":"106-1|20","e":"106-1","n":20,"c":7,"s":"病人因血栓接受肝素（Heparin）治療，下列敘述何者正確？①適合採用肌肉注射給藥 ②注射肝素時需回抽有無回血 ③需監測activated partial thromboplastin time（aPTT） ④注射後不需按摩","o":["①②","①③","②④","③④"],"a":"D","k":"D","t":"","x":"使用肝素需監測aPTT以調整劑量（③）；皮下注射後不可按摩，以免造成血腫並加速吸收（④），故選③④。肝素會增加出血風險，不宜肌肉注射（①錯）；皮下注射肝素不需反抽，反抽易造成血腫（②錯）。"},{"i":"106-1|21","e":"106-1","n":21,"c":7,"s":"周先生，60歲，3天未解便，醫囑「Bisacodyl（Dulcolax）10 mg/supp 1# supp stat」，下列措施何者適當？①給藥前予腹部評估 ②給藥時協助病人採取右側臥 ③以棉枝輕推藥物進入直腸 ④藥物推入後請病人保持原姿勢15分鐘","o":["①③","①④","②③","②④"],"a":"B","k":"B","t":"","x":"給予塞劑前應評估腹部（如腸蠕動、脹氣）（①）；推入後請病人維持原姿勢約15分鐘，讓藥物融化吸收、發揮作用（④），故選①④。肛門塞劑應協助病人採左側臥（②錯），並戴手套以食指將藥物推入肛門約6.5～7.5公分（③錯）。"},{"i":"105-2|10","e":"105-2","n":10,"c":7,"s":"李先生處方上的藥物註明為qid，此表示：","o":["每隔一天","一天二次","一天四次","一天一次"],"a":"C","k":"C","t":"","x":"q.i.d.為quater in die的縮寫，意指一天四次，故選(C)。每隔一天為q.o.d.，一天二次為b.i.d.，一天一次為q.d.。"},{"i":"105-2|11","e":"105-2","n":11,"c":7,"s":"醫囑為止痛劑 morphine 10 mg po tid之含義，下列何者正確？","o":["持續每天三次給予morphine 10 mg 口服","需要時每天三次給予morphine 10 mg 靜脈注射","持續每天四次給予morphine 10 mg 口服使用","需要時每天四次給予morphine 10 mg 靜脈注射"],"a":"A","k":"A","t":"","x":"醫囑「morphine 10 mg po tid」中po為口服、tid為一天三次，且未註明p.r.n.，屬持續執行的長期醫囑，故選(A)。醫囑中沒有需要時（p.r.n.）或靜脈注射的指示，也不是一天四次（qid）。"},{"i":"105-2|16","e":"105-2","n":16,"c":7,"s":"某肺炎病人，醫囑 Ceftriaxone（Rocephin）口服懸浮劑 600 mg QD，藥瓶標籤標示該藥物之含量為125 mg/5 mL，此病人每天應服用多少mL？","o":["4.8","12","24","30"],"a":"C","k":"C","t":"","x":"藥物濃度為125 mg/5 mL，即每1 mL含25 mg；醫囑每日600 mg，所需量＝600÷25＝24 mL，故選(C)。"},{"i":"105-2|17","e":"105-2","n":17,"c":7,"s":"陳小姐因流行性感冒引發中耳炎與急性角膜炎入院，護理師為病人執行眼部滴藥的措施，下列敘述何者正確？","o":["請病人頭往後仰，並將眼睛平視前方","將藥水滴於角膜上，以利藥物的吸收","協助病人將分泌物由眼睛的外眥向內眥擦拭","滴注後，以乾棉球按住眼角（鼻淚管處），避免藥物進入鼻部"],"a":"D","k":"D","t":"","x":"滴眼藥後以乾棉球輕壓內眥鼻淚管處，可避免藥物經鼻淚管流入鼻腔被吸收而產生全身性作用，故選(D)。滴藥時應頭後仰、眼睛往上看；藥物應滴於下結膜穹窿，不可直接滴於角膜；分泌物應由內眥往外眥擦拭。"},{"i":"105-2|18","e":"105-2","n":18,"c":7,"s":"有關執行肌肉注射的方法，下列敘述何者正確？","o":["教導病人在注射時緊繃肌肉，以減輕疼痛","注射時將皮膚繃緊，以45度角將針頭插入","肌肉注射吸收的速度，比靜脈注射快","當針頭插入後，反抽若有回血，需立即拔出"],"a":"D","k":"D","t":"","x":"肌肉注射下針後反抽若有回血，表示針頭插入血管，應立即拔出並更換一套重新施打，故選(D)。注射時應讓病人肌肉放鬆以減輕疼痛；肌肉注射須以90度角垂直進針；其吸收速度較靜脈注射慢。"},{"i":"105-2|19","e":"105-2","n":19,"c":7,"s":"長期服用warfarin不宜與含維生素K的食物同時服用，下列何者為主要原因？","o":["會導致腸胃不適","會降低warfarin藥效","會產生毒性反應","會造成過敏反應"],"a":"B","k":"B","t":"","x":"Warfarin為抗凝血劑，作用是拮抗維生素K依賴的凝血因子合成；若同時大量攝取含維生素K的食物，會拮抗其作用而降低藥效，故選(B)。這是藥物與食物的交互作用，非腸胃不適、毒性或過敏反應。"},{"i":"105-2|20","e":"105-2","n":20,"c":7,"s":"下列那些症狀是Morphine常見的副作用？①便秘 ②腹瀉 ③呼吸過慢 ④心率過快","o":["①③","①④","②③","②④"],"a":"A","k":"A","t":"","x":"Morphine為麻醉性止痛劑，會使腸道平滑肌蠕動減少而造成便秘（①），並抑制呼吸中樞使呼吸變慢（③），故選①③。Morphine不會造成腹瀉，也不會使心率過快。"},{"i":"105-2|21","e":"105-2","n":21,"c":7,"s":"醫囑「Cefepime 150 mg IM Q8H」。Cefepime 為500 mg/vial之粉劑，將其以注射用水稀釋成4 c.c.後，病人單次的給藥劑量應為多少c.c.藥液？一日給藥總量為多少mg？","o":["0.8 c.c.，150 mg","1.2 c.c.，300 mg","1.2 c.c.，450 mg","1.4 c.c.，450 mg"],"a":"C","k":"C","t":"","x":"Cefepime 500 mg稀釋成4 c.c.，濃度為125 mg/c.c.；單次150 mg需抽150÷125＝1.2 c.c.。Q8H即每日3次，每日總量150×3＝450 mg，故選(C)。"},{"i":"105-2|22","e":"105-2","n":22,"c":7,"s":"有關給藥縮寫與其所代表的意義，下列何者正確？","o":["AD：右耳","SUSP：栓劑","CM：午夜","AU：雙眼"],"a":"A","k":"A","t":"","x":"A.D.為右耳（auris dextra），故選(A)。SUSP為懸浮液（suspension），栓劑為supp.；C.M.為明晨（cras mane），午夜為m.n.；A.U.為雙耳，雙眼為O.U.。"},{"i":"105-1|18","e":"105-1","n":18,"c":7,"s":"有一醫囑如下：Bisacodyl（10mg）1 Supp.stat，下列給藥過程何者正確？","o":["先小量灌腸後，再給塞劑","給藥時病人應採右側臥","塞劑前端可塗少許凡士林","塞劑應置於肛門括約肌上"],"a":"C","k":"C","t":"","x":"肛門塞劑給藥前可於塞劑前端塗少許潤滑劑（如凡士林），減少插入時的摩擦與不適，故(C)正確。Bisacodyl塞劑直接刺激直腸促進排便，不需先灌腸；給藥時應採左側臥；塞劑應以手指推過肛門內括約肌，約6.5～7.5公分並緊貼直腸壁，而非僅置於括約肌處。"},{"i":"105-1|19","e":"105-1","n":19,"c":7,"s":"藥瓶上註明藥液總量為5 c.c.，每1 c.c.含該藥100單位，若醫囑需要該藥250單位，則應抽取該藥多少c.c.？","o":["1","1.5","2","2.5"],"a":"D","k":"D","t":"","x":"藥物濃度為100單位/c.c.，醫囑需250單位，所需量＝250÷100＝2.5 c.c.，故選(D)。藥瓶總量5 c.c.僅為總容量資訊，與單次抽取量計算無關。"},{"i":"105-1|20","e":"105-1","n":20,"c":7,"s":"關於藥物儲存之原則，下列敘述何者不適當？","o":["Dulcolax Supp.須置於冰箱保存","肝素使用後須置於冰箱保存","疫苗須置於冰箱保存","抗生素未開封前須置於冰箱保存"],"a":"D","k":"D","t":"","x":"栓劑、疫苗、開封後的肝素、稀釋後的藥物及未開封的胰島素應置於2～8℃冰箱冷藏；一般藥物及未開封的乾燥藥物（如粉劑抗生素）保存於15～30℃室溫即可，故(D)不適當。"},{"i":"105-1|21","e":"105-1","n":21,"c":7,"s":"劉先生為肺癌合併骨轉移的病人，2個月前開始服用Morphine。此次住院醫囑為：「Morphine 50mg/tab 1 p.o. q.6.h.」，劉先生服藥後約5個小時主訴疼痛難耐，要求給予止痛劑，下列何者為護理師最適當的反應？","o":["向病人解釋其已發生藥物耐受性，所以藥效時間縮短","進一步評估其疼痛並和醫師討論止痛藥物處方之調整","告知再過1小時就可以給他止痛劑，請其再忍耐一下","向病人解釋Morphine 具成癮性，能少用儘量少用"],"a":"B","k":"B","t":"","x":"長期使用Morphine的病人在給藥間隔內出現疼痛難耐，表示目前處方無法有效控制疼痛，護理師應進一步評估疼痛並與醫師討論止痛藥物劑量或頻次的調整，故選(B)。(A)不可自行判定為耐受性；(C)讓病人忍痛不恰當；(D)以成癮為由減少用藥，會使癌症疼痛控制不足。"},{"i":"105-1|22","e":"105-1","n":22,"c":7,"s":"魏小弟，5歲，醫囑「Ibuprofen 10 mg/tab 0.5 p.o. t.i.d.」。 Ibuprofen 用於2～7歲孩童的安全劑量為10～15 mg/day，須分次給予。關於此醫囑之執行，下列敘述何者最適當？","o":["醫囑沒問題，依醫囑給藥","對於單次給藥之劑量提出質疑","對於每日給藥之總劑量提出質疑","拒絕給藥，因為劑量未納入體重因素"],"a":"A","k":"A","t":"","x":"醫囑每次0.5顆×10 mg＝5 mg，每日3次共15 mg，符合2～7歲兒童安全劑量10～15 mg/day且分次給予，因此醫囑無誤，可依醫囑給藥，故選(A)。單次與每日總劑量皆在安全範圍內，無須質疑或拒絕給藥。"},{"i":"105-1|23","e":"105-1","n":23,"c":7,"s":"有關醫囑「Nitroglycerin（NTG）0.4mg/tab 1 S.L.q5min 3 p.r.n.」之藥物指導，下列敘述何者錯誤？","o":["此藥1～3分鐘即開始作用","需要時一次舌下含服3顆","使用第1顆沒明顯改善，隔5分鐘可使用第2顆","可能出現低血壓之副作用"],"a":"B","k":"B","t":"","x":"NTG舌下含服每次1顆，若症狀未改善可間隔5分鐘再含第2顆，最多連續使用3顆；醫囑中的「3」是指最多3次，並非一次含服3顆，故(B)錯誤。NTG舌下吸收快，數分鐘內即可作用；因會擴張血管，可能出現低血壓，服藥時宜採坐姿以防跌倒。"},{"i":"105-1|24","e":"105-1","n":24,"c":7,"s":"張女士，右眼感染結膜炎，有分泌物，醫囑包括眼藥膏與眼藥水，護理師協助其使用眼藥，下列措施何者正確？","o":["由外眥往內眥擦拭分泌物","滴眼藥前請病人頭往後仰，眼球往上看","將眼藥水滴於右眼球上","先使用眼藥膏，再滴眼藥水"],"a":"B","k":"B","t":"","x":"滴眼藥時請病人頭往後仰、眼睛往上看，將藥物滴於下結膜穹窿處，故(B)正確。擦拭分泌物應由內眥往外眥，避免污染鼻淚管；不可直接滴於眼球（角膜）上，以免刺激或損傷角膜；同時使用時應先點水劑，再使用油劑（眼藥膏）。"},{"i":"105-1|27","e":"105-1","n":27,"c":7,"s":"有關「S.O.S.」醫囑的敘述，下列何者正確？①是一種長期醫囑 ②開立醫囑時，醫師會指定間隔時間多久一次 ③中文解釋為「如有需要給予一次」 ④執行後須記錄 ⑤此醫囑有效時間為12小時","o":["①②④","①③⑤","②③④","③④⑤"],"a":"D","k":"D","t":"","x":"S.O.S.為臨時醫囑，意指「需要時給予一次」，開立後12小時內有效，執行後須記錄，故③④⑤正確。①錯，S.O.S.屬臨時醫囑；②錯，指定間隔時間重複給予的是p.r.n.醫囑。"},{"i":"104-2|3","e":"104-2","n":3,"c":7,"s":"有關盤尼西林皮膚試驗之敘述，下列何者正確？","o":["注射劑量為0.5 mL","注射濃度為1000～2000單位／mL","執行注射時需反抽","應先準備Dopamine備用"],"a":"B","k":"B","t":"","x":"PST以稀釋青黴素皮內注射，劑量約0.1 mL含100單位，即濃度約1000單位／mL，故B正確。皮內注射劑量0.1 mL而非0.5 mL，且不需反抽；過敏急救藥物為1:1000 epinephrine，而非Dopamine。"},{"i":"104-2|14","e":"104-2","n":14,"c":7,"s":"有關醫囑執行的注意事項，下列敘述何者正確？","o":["p.r.n.屬於臨時醫囑，需要時給予一次，超過12小時後，此醫囑自動失效","當醫囑出現「order renew」時，表示order renew之前之醫囑無效，之後之醫囑才有效","緊急情況護生可以接受口頭醫囑或電話醫囑，只要於事後儘快補齊即可","S.O.S.屬於長期醫囑，給予次數通常不只一次，可視需要給予"],"a":"B","k":"B","t":"","x":"醫囑出現「order renew」表示之前的醫囑全部失效，只執行之後重新開立的醫囑。p.r.n.屬長期醫囑，需要時可重複給予；護生不可接受口頭或電話醫囑；S.O.S.屬臨時醫囑，需要時給予一次，超過時效自動失效。"},{"i":"104-2|15","e":"104-2","n":15,"c":7,"s":"有關給藥醫囑縮寫的意義，下列何者正確？","o":["q6h與qid的給藥時間是相同的","qod表示每天一次","tid（ac）表示每天三餐飯前","q4h表示每天四次"],"a":"C","k":"C","t":"","x":"tid為每天三次，ac為飯前，故tid（ac）表示每天三餐飯前。q6h為每6小時一次，間隔固定，與qid（每天四次）時間不同；qod為隔天一次；q4h為每4小時一次，即每天六次。"},{"i":"104-2|16","e":"104-2","n":16,"c":7,"s":"張先生為慢性支氣管炎病人，第一次使用Ipratropium（Atrovent）定量噴霧液（metered dose inhaler, MDI）治療，教導其正確用藥方式，下列何者錯誤？","o":["每次使用前，先充分搖動噴霧容器","按壓時噴霧容器底部朝上","按壓與吸藥的動作須同時進行","吸藥後須漱口"],"a":"D","k":"D","t":"","x":"吸藥後須漱口是針對含類固醇的吸入劑，以預防口腔念珠菌感染；Ipratropium為抗膽鹼性支氣管擴張劑，並無此強制要求，故D錯誤。使用定量噴霧器前應充分搖勻，按壓時容器底部朝上，且按壓與吸氣須同時進行。"},{"i":"104-2|17","e":"104-2","n":17,"c":7,"s":"關於結核菌素試驗（purified protein derivative test, PPD test），下列敘述何者正確？","o":["注射角度視個案體型胖瘦而定","於注射後24～36小時查看結果","硬結直徑≧10 mm為陽性反應","出現陽性反應表示個案正罹患結核病"],"a":"C","k":"C","t":"","x":"結核菌素試驗於注射後48～72小時判讀，硬結直徑≧10 mm（1公分）為陽性，表示曾感染結核菌或接種過卡介苗，不代表正罹患結核病。PPD採皮內注射，以5～15度角進針，角度不因體型而改變。"},{"i":"104-2|18","e":"104-2","n":18,"c":7,"s":"為一歲半的病童執行醫囑「Cefepime 150 mg IM q8h」時，下列敘述何者正確？","o":["q8h給藥的主要目的為避免副作用","注射部位以股外側肌最理想","選用23G 針頭較25G針頭不痛","針頭與皮膚呈45度插入"],"a":"B","k":"B","t":"","x":"2歲以下幼童臀肌發育尚未完全，肌肉注射以股外側肌最理想。q8h主要是維持藥物血中濃度；23G針頭較25G粗，疼痛較明顯；肌肉注射針頭應與皮膚呈90度插入。"},{"i":"104-2|19","e":"104-2","n":19,"c":7,"s":"使用Fentanyl止痛貼片之護理措施，下列何者較適宜？①需貼在疼痛的部位 ②更換新貼片時應儘量貼在相同部位 ③將貼片貼上皮膚時以手掌緊壓30秒 ④衛教病人避免泡熱水澡","o":["①②","①④","②③","③④"],"a":"D","k":"D","t":"","x":"Fentanyl貼片經皮膚吸收達全身止痛作用，應選平坦少毛髮處（不一定是疼痛部位），以掌心按壓約30秒使其貼緊；熱會加速藥物釋放而引起過量，應避免泡熱水澡，故③④正確。更換時應避免貼在相同位置，以免皮膚刺激。"},{"i":"104-2|20","e":"104-2","n":20,"c":7,"s":"護理師依醫囑給予病人Gentamycin 80 mg q8h I.V. drip，應於何時執行備藥的第三讀？","o":["由藥車取出劉先生藥盒時","由藥盒取出Gentamycin時","用空針抽取Gentamycin前","將Gentamycin空瓶丟棄前"],"a":"D","k":"D","t":"","x":"三讀的第三讀是在將剩餘藥物放回或藥袋（空瓶）丟棄時再核對一次，故應於丟棄Gentamycin空瓶前執行。由藥車取出藥盒為第一讀，從藥盒（藥袋）取出藥物為第二讀。"},{"i":"104-1|9","e":"104-1","n":9,"c":7,"s":"有關Valium 1 h.s. p.r.n.給藥時間的敘述，下列何者正確？","o":["即刻給予","睡前需要時給予","12小時內需要時給予","需要時給予"],"a":"B","k":"B","t":"","x":"h.s.表示睡前，p.r.n.表示需要時給予，故Valium 1 h.s. p.r.n.為睡前需要時給予一顆。即刻給予為st.，12小時內需要時給予一次為s.o.s.。"},{"i":"104-1|11","e":"104-1","n":11,"c":7,"s":"醫囑為Morphine 5 mg IV st.之含意，下列何者正確？","o":["如有需要給予Morphine 5 mg靜脈注射一次，不可重複給","立即給予Morphine 5 mg靜脈注射一次，可重複給","立即給予Morphine 5 mg靜脈注射一次，不可重複給","如有需要給予Morphine 5 mg靜脈注射一次，可重複給"],"a":"C","k":"C","t":"","x":"st.（statim）表示立即給予一次，屬臨時醫囑，執行後即失效，不可重複給予，故Morphine 5 mg IV st.為立即靜脈注射一次、不可重複。「如有需要給予一次」為s.o.s.，可重複需要時給予則為p.r.n.。"},{"i":"104-1|15","e":"104-1","n":15,"c":7,"s":"有關結核菌素試驗（P.P.D. test）的敘述，下列何者正確？","o":["採用皮下注射","於注射後15～20分鐘判讀結果","注射部位為右臂三角肌","注入藥物劑量為0.1 c.c."],"a":"D","k":"D","t":"","x":"結核菌素試驗（PPD test）採皮內注射，注入劑量為0.1 c.c.，常用部位為前臂中段內側，注射後48～72小時判讀，硬結≧1公分為陽性。15～20分鐘判讀是青黴素皮膚試驗。"},{"i":"104-1|16","e":"104-1","n":16,"c":7,"s":"有關給藥醫囑常見縮寫名詞的解釋，下列何者錯誤？①A.S.是指「右耳」 ②S.C.是指「皮內注射」 ③M.N.是指「午夜」 ④h.s.是指「飯前」 ⑤S.O.S.是指「如有需要給予一次」","o":["①②④","①③⑤","②④⑤","③④⑤"],"a":"A","k":"A","t":"","x":"A.S.是左耳（右耳為A.D.），S.C.是皮下注射（皮內注射為I.D.），h.s.是睡前（飯前為a.c.），故①②④錯誤。M.N.為午夜、S.O.S.為如有需要給予一次，均正確。"},{"i":"104-1|17","e":"104-1","n":17,"c":7,"s":"王太太白內障明天要開刀，醫囑開立「N.P.O. M.N.」、「Atropine 1gtt O.S. C.M.」，則下列那一項護理活動較合宜？","o":["告知王太太午夜開始禁食、明天早上左眼滴一滴Atropine","告知王太太午夜開始進食、明天早上左眼滴一滴Atropine","告知王太太午夜開始禁食、明天早上右眼滴一滴Atropine","告知王太太午夜開始進食、明天早上右眼滴一滴Atropine"],"a":"A","k":"A","t":"","x":"N.P.O. M.N.表示午夜開始禁食；O.S.為左眼（右眼O.D.），C.M.為明天早上，1 gtt為一滴，故應告知午夜起禁食、明天早上左眼滴一滴Atropine。"},{"i":"104-1|18","e":"104-1","n":18,"c":7,"s":"對體重不足，四肢或軀幹皆過瘦的病人執行皮下注射時，應採下列何項措施，以避免注射到肌肉層？","o":["注射時，繃緊皮膚","注射時，捏起皮膚","注射時，採90度角插入","注射時，採15度角插入"],"a":"B","k":"B","t":"","x":"體型過瘦者皮下組織薄，皮下注射時應輕捏起皮膚，使皮下組織增厚，以免針頭注入肌肉層。繃緊皮膚會使皮下組織更薄；90度角適用於短針頭胰島素空針；15度角接近皮內注射角度。"},{"i":"104-1|19","e":"104-1","n":19,"c":7,"s":"皮下注射RI後，勿按摩注射部位之原因，下列何者正確？","o":["會導致注射部位肌肉發炎","會導致局部脂肪變性","會加速胰島素吸收，導致血糖急速下降","會造成嚴重血腫及影響藥物吸收"],"a":"C","k":"C","t":"","x":"RI（短效胰島素）皮下注射後按摩注射部位會加速胰島素吸收，使血糖急速下降而造成低血糖，故注射後不揉按。按摩並不會導致肌肉發炎或脂肪變性；不反抽、不按摩是為了避免吸收過快。"},{"i":"104-1|20","e":"104-1","n":20,"c":7,"s":"吳女士為第2型糖尿病病人，醫囑「RI（Regular Insulin）8U SC AC TID」，吳女士今天9AM將進行支氣管鏡檢查，目前N.P.O.中，6AM吳女士詢問何時幫她打胰島素，下列何者為護理師最適當的回應？","o":["7AM會準時來幫她注射胰島素","9AM會幫她注射胰島素，請其不用擔心","聯絡醫師視需要調整劑量，再幫她注射胰島素","等檢查結束後確定可進食，再幫她注射胰島素"],"a":"D","k":"D","t":"","x":"胰島素一般於飯前使用，若病人禁食或進食時間不穩定，應確認可進食後再給予，以免發生低血糖。吳女士檢查前N.P.O.中，應待檢查結束、確定可進食後再注射，不可照常規時間施打。"},{"i":"103-2|11","e":"103-2","n":11,"c":7,"s":"有關注射部位消毒方式之敘述，下列何者正確？","o":["由內向外環狀消毒，待酒精自然乾燥後才得插針","由外向內環狀消毒，並以口吹乾酒精才得插針","由外向內環狀消毒，在酒精乾燥前即需插針，以維持無菌","以無菌乾棉球由內向外環狀消毒，擦拭後即可插針"],"a":"A","k":"A","t":"","x":"注射部位應以酒精棉片由內向外環狀消毒，待酒精自然乾燥後再下針，以確實發揮消毒效果並減少刺痛。由外向內會把汙染帶回注射點；以口吹乾會造成汙染；酒精未乾即插針會刺痛且消毒不完全；乾棉球無消毒作用。"},{"i":"103-2|12","e":"103-2","n":12,"c":7,"s":"依藥物之屬性觀之，下列何種口服藥的劑型吸收最快？","o":["錠劑","懸浮液","溶液","膠囊"],"a":"C","k":"C","t":"","x":"口服藥物劑型的吸收速度依序為：溶液＞懸液劑＞粉劑＞軟膠囊＞錠劑＞硬膠囊。溶液不需經崩散與溶解過程，因此吸收最快。"},{"i":"103-2|13","e":"103-2","n":13,"c":7,"s":"有關藥物管理，下列敘述何者正確？","o":["急救藥品使用及管理為講求時效性，無須檢查有效日期","稀釋後之抗生素應標明時間劑量，存放於冰箱，使用期限為一週","疫苗一般應保存於2～8℃之冰箱","管制藥品應上鎖，並將鑰匙放在護理站固定地方"],"a":"C","k":"C","t":"","x":"油劑、栓劑、疫苗、稀釋後的藥物及未開封胰島素應置於2～8℃冰箱冷藏。急救藥品也需定期檢查有效期限；稀釋後抗生素穩定性差，不能存放一週；管制藥品應存放於兩道鎖的藥櫃，鑰匙由專人保管，不可放在固定地方。"},{"i":"103-2|14","e":"103-2","n":14,"c":7,"s":"在單一劑量供應系統下護理師為病患備口服藥時，要確實執行藥物「三讀」，三讀應包括那些？①從藥車中取出藥物袋時 ②從藥物袋中取出藥物時 ③將藥物給病患服下前 ④藥物袋放回藥車時","o":["①②④","①②③","②③④","①③④"],"a":"A","k":"A","t":"","x":"單一劑量系統的三讀均在備藥過程中執行：第一讀為從藥車取出藥袋時，第二讀為從藥袋取出藥物放入藥杯時，第三讀為將藥袋放回藥車（或丟棄）時，故選①②④。給病人服藥前執行的是五對中的病人辨識，不屬三讀。"},{"i":"103-2|15","e":"103-2","n":15,"c":7,"s":"王小妹10歲，有咳嗽現象，平時會吞藥丸，醫師開立醫囑為Asmalin 1#（2.5 mg）tid P.O.，但是王小妹主訴口服藥味苦無法吞下，有關護理師處理方式，下列何者錯誤？","o":["給藥前口含冰塊麻痺味覺神經","將錠劑磨成粉後，裝成膠囊服用","將錠劑磨成粉後，加入糖粉調味","請王小妹捏住鼻子，將藥粉用水吞下"],"a":"D","k":"D","t":"","x":"藥味苦時可於服藥前口含冰塊麻痺味覺、磨粉後裝入膠囊，或加少許糖粉調味以提高接受度。請兒童捏住鼻子將藥粉以水吞下，藥粉易嗆入呼吸道且屬強迫給藥，並不適當，故D錯誤。"},{"i":"103-2|16","e":"103-2","n":16,"c":7,"s":"吳女士明日要接受大腸切除手術，醫囑Phosphor-soda（Fleet）45 ml P.O. bid，因為Fleet有鹹味，護理師執行給藥時，下列何項護理措施最適當？","o":["服藥後，建議病患可喝冰涼冬瓜茶，減少不適味道","將藥物加在牛奶中一起服用，減少對味蕾的刺激","服藥前，給予病患口腔中噴麻醉藥，以減少味蕾刺激性","服藥前後，給予做口腔護理，以減少藥物刺激"],"a":"A","k":"A","t":"","x":"Fleet為腸道清潔用的瀉劑，味道鹹，可先冰涼並於服藥後飲用冰涼清澈的飲料（如冬瓜茶）以減少不適味道，同時補充水分。腸道術前需清淡飲食，不宜與牛奶併服；口腔噴麻醉藥並無必要；口腔護理無法減輕服藥當下的鹹味。"},{"i":"103-2|17","e":"103-2","n":17,"c":7,"s":"有關給藥單位的敘述，下列何者錯誤？","o":["gtt表示「茶匙」","gm表示「公克」","ml表示「c.c.」","āā表示「各」"],"a":"A","k":"A","t":"","x":"gtt（gutta）是「滴」的意思，茶匙的縮寫為tsp.，故A錯誤。gm為公克、ml與c.c.等量、āā為「各」（各等量），均正確。"},{"i":"103-2|19","e":"103-2","n":19,"c":7,"s":"（情境：張小姐因眼疾至眼科診所求診，醫師診治後醫囑給予眼藥水及油劑藥膏同時使用。）張小姐返家後，藥物使用之正確方式為何？","o":["先使用藥水待3～5分鐘後，再使用藥膏","先使用藥膏待3～5分鐘後，再使用藥水","無一定次序，視個人喜好來決定","將藥水及藥膏混和在無菌棉棒上再擦拭下眼瞼"],"a":"A","k":"A","t":"","x":"同時使用眼藥水與眼藥膏時，應先點水劑，間隔數分鐘後再使用油劑藥膏，因藥膏油性成分會在眼表形成薄膜，阻礙後續藥水吸收。兩者不可混合使用，也不能隨意調換順序。"},{"i":"103-2|20","e":"103-2","n":20,"c":7,"s":"（情境：張小姐因眼疾至眼科診所求診，醫師診治後醫囑給予眼藥水及油劑藥膏同時使用。）護理師教導張小姐在用藥後閉上眼睛並轉動眼球，其目的為何？","o":["以免藥物進入鼻部","預防口腔的藥味","避免角膜之不適","使藥物擴散"],"a":"D","k":"D","t":"","x":"點眼藥後請病人輕閉眼睛並轉動眼球，可使藥物均勻擴散至整個結膜囊。若要避免藥物經鼻淚管流入鼻腔、咽喉產生苦味，應輕壓內眥鼻淚管處，而非轉動眼球。"},{"i":"103-1|15","e":"103-1","n":15,"c":7,"s":"有關護理師在執行長期醫囑時的注意事項，下列何者正確？","o":["其有效性是自開立處方日起第二天生效","p.r.n.是屬於臨時醫囑，護理師依其專業判斷執行醫囑","是常規性的給藥業務，故執行過程不須記載於給藥紀錄單內","醫師沒有停止就必須持續執行"],"a":"D","k":"D","t":"","x":"長期醫囑自開立後即生效，醫師未開立停止（DC）前必須持續執行。p.r.n.屬於長期醫囑中的「需要時給予」，需依醫囑條件執行；所有給藥均須記錄於給藥紀錄單。"},{"i":"103-1|17","e":"103-1","n":17,"c":7,"s":"（情境：王太太產後第二天，主訴肛門痔瘡疼痛不適無法採坐姿，護理師發現王太太肛門口有1.5×2.3公分的痔瘡，醫囑給予proctosedyl治療，第二週時其症狀有改善，醫囑更動為proctosedyl supp. 1 pill s.o.s.。）醫囑更動後王太太所使用的藥物劑型及時間為何？","o":["藥膏，必要時給一次（12小時內）","栓劑，必要時給一次（12小時內）","藥膏，即時給","栓劑，即時給"],"a":"B","k":"B","t":"","x":"supp.為栓劑（suppository），s.o.s.表示需要時給予一次，通常於開立後12小時內有效，過時即失效，故選B。即時給予的縮寫為st.，藥膏則為ointment（oint.）。"},{"i":"103-1|18","e":"103-1","n":18,"c":7,"s":"（情境：王太太產後第二天，主訴肛門痔瘡疼痛不適無法採坐姿，護理師發現王太太肛門口有1.5×2.3公分的痔瘡，醫囑給予proctosedyl治療，第二週時其症狀有改善，醫囑更動為proctosedyl supp. 1 pill s.o.s.。）當護理師首次執行醫囑，在給藥時，王太太主訴有頭痛和冒冷汗之不適情形，此時最佳的護理處置為何？","o":["請王太太用力哈氣並在最短時間內完成給藥","給藥時動作輕柔，並請王太太忍耐一下","這是正常的緊張反應，請王太太深呼吸即可","立即停止給藥並嚴密觀察王太太的生命徵象"],"a":"D","k":"D","t":"","x":"肛門給藥時刺激直腸可能引發迷走神經反應，出現頭痛、冒冷汗、心悸、血壓下降等，此時應立即停止給藥並嚴密監測生命徵象。不可勉強加快完成給藥或請病人忍耐，也不能視為單純的緊張反應。"},{"i":"103-1|19","e":"103-1","n":19,"c":7,"s":"有關青黴素皮膚試驗之敘述，下列何者錯誤？①採皮內注射 ②注射部位以股外側肌為最理想位置 ③注射劑量為0.1~0.2 c.c.，300~500 IU ④注射時，針頭插入後，必須先反抽針心，確定安全才注入藥物 ⑤注射後15~30分鐘看結果","o":["①②④","①③⑤","②③④","③④⑤"],"a":"C","k":"C","t":"","x":"PST採皮內注射，常用部位為前臂中段內側，劑量約0.1 c.c.（100單位），皮內注射不需反抽，約15～20分鐘判讀結果，故①⑤正確。②股外側肌是肌肉注射部位，③劑量過多，④皮內注射不需反抽，故錯誤者為②③④。"},{"i":"103-1|20","e":"103-1","n":20,"c":7,"s":"護理師執行背臀肌肌肉注射時，個案採踝關節內旋的主要目的為何？","o":["放鬆臀肌","方便選擇部位","避免髖關節受傷","可免除注射後按摩"],"a":"A","k":"A","t":"","x":"背臀肌注射時，請病人俯臥並將足尖向內（踝關節內旋），可使臀部肌肉放鬆，減輕注射時的疼痛與不適。此姿勢與選擇部位、避免髖關節受傷或免除注射後按摩無關。"},{"i":"103-1|21","e":"103-1","n":21,"c":7,"s":"有關肌肉注射之敘述，下列何者錯誤？","o":["藥物吸收率比皮下注射慢","每次注射量以2~5 c.c.為宜","上臂三角肌、臀肌及股外側肌為常見注射部位","股外側肌之肌肉注射適用於2歲以下幼童"],"a":"A","k":"A","t":"","x":"肌肉層血管較皮下組織豐富，藥物吸收速度比皮下注射快，故A錯誤。肌肉注射量一般不超過5 mL，常用部位為上臂三角肌、臀肌及股外側肌，2歲以下幼童臀肌發育未完全，以股外側肌最適宜。"},{"i":"103-1|22","e":"103-1","n":22,"c":7,"s":"護理師發給口服藥時，發現病人李先生不在病房內，李先生的女兒說：「我爸爸出去打電話，大概5分鐘後回來」，下列何者是最適當地給藥行為？","o":["為了不影響給藥時間，請李先生女兒拿藥至電話亭給李先生","將裝有藥物的藥杯給李先生女兒，請李先生回來病房時交給他","將裝有藥物的藥杯留在病人床旁桌，留紙條告訴李先生應儘快服藥","將藥物置回藥盒中，在給藥紀錄單註明「不在」代號"],"a":"D","k":"D","t":"","x":"給藥時應親眼看病人服下藥物，不可將藥物交給家屬轉交或留置床旁桌，以免誤服、漏服或無法確認病人是否確實服藥。病人不在時應將藥物放回藥盒，並在給藥紀錄單註明未給藥原因，待病人回來再給藥。"},{"i":"102-2|11","e":"102-2","n":11,"c":7,"s":"皮下注射時的注射角度會受下列那一項因素的影響？","o":["男性或女性","使用之注射針頭","藥物之注射劑量","藥物為油性或水性"],"a":"B","k":"B","t":"","x":"皮下注射一般以45～60度角下針，但若使用針頭較短的胰島素空針則可採90度角垂直下針，因此注射角度主要受所用針頭長短（及病人皮下脂肪厚度）影響。性別、劑量及藥物油水性並非決定皮下注射角度的因素。"},{"i":"102-2|12","e":"102-2","n":12,"c":7,"s":"有關盤尼西林皮膚試驗（penicillin skin test, PST）的敘述，下列何者正確？①注射時針頭斜面朝上，以5～15度角插入真皮內 ②注射後48～72小時檢查反應結果 ③由醫師檢查反應 ④反應結果為陽性反應，方可注射此藥 ⑤過敏反應常用之急救藥物為1/1000腎上腺素（epinephrine）","o":["①②④","①③⑤","②③④","③④⑤"],"a":"B","k":"B","t":"","x":"PST採皮內注射，針頭斜面朝上以5～15度角進入真皮；注射後15～20分鐘由醫師判讀；陽性反應應避免使用青黴素；過敏急救藥物為1:1000 epinephrine，故①③⑤正確。②48～72小時判讀是結核菌素試驗，④陽性反應不可注射。"},{"i":"102-2|13","e":"102-2","n":13,"c":7,"s":"給與病患咳嗽藥物：cough mixture 15 c.c. P.O.時，下列給藥護理措施何者適當？","o":["服藥前10分鐘，應禁止病患喝水","服藥後15分鐘內，病患應多喝開水","服用此藥時，不要與開水同服","藥物可以混合於熱開水15 c.c.一起服用"],"a":"C","k":"C","t":"","x":"咳嗽糖漿含有薄荷腦、甘草等成分，需在咽喉黏膜形成保護膜以發揮止咳作用，與開水併服會降低療效，建議服藥後30分鐘內暫勿飲水，也不宜混合熱開水服用。服藥前禁水或服藥後多喝水皆不正確。"},{"i":"102-2|14","e":"102-2","n":14,"c":7,"s":"李小妹，體重7公斤，醫囑給與「gentamycin I.V. drip q.8.h.」，此藥物單次成人劑量為70 mg。依克拉克氏法則，李小妹單次用藥的劑量是多少mg？","o":["3.73","4.37","5.25","7.20"],"a":"D","k":"D","t":"","x":"克拉克法則：小兒劑量＝成人劑量×小兒體重（磅）/150。7公斤×2.2＝15.4磅，70 mg×15.4/150≈7.19 mg，約為7.20 mg，故選D。"},{"i":"102-2|16","e":"102-2","n":16,"c":7,"s":"（情境：醫囑：ceftizoxime 1 vial（500 mg）I.V. drip q.6.h.。）護理師應如何執行上述醫囑？","o":["每天四次給與ceftizoxime一瓶（500 mg）加入靜脈點滴瓶中滴注","每隔六小時給與ceftizoxime一瓶（500 mg）加入IV bag中滴注","每天四次給與ceftizoxime一瓶（500 mg）直接靜脈注射","每隔六小時給與ceftizoxime一瓶（500 mg）直接靜脈注射"],"a":"B","k":"B","t":"","x":"q.6.h.表示每隔6小時給藥一次，I.V. drip為靜脈滴注，需將藥物加入輸液袋（IV bag）中滴注，故B正確。「每天四次」為q.i.d.，時間間隔不一定相等；直接靜脈注射則屬I.V. push，與醫囑途徑不符。"},{"i":"102-2|17","e":"102-2","n":17,"c":7,"s":"（情境：醫囑：ceftizoxime 1 vial（500 mg）I.V. drip q.6.h.。）下列何者可作為q.6.h.正確的給藥時間？","o":["9-1-5-9","9-1-5-9-1-5-9","6-12-6-12","9-5-1"],"a":"C","k":"C","t":"","x":"q.6.h.為每6小時給藥一次，一天共四次且間隔相等，6-12-6-12符合。9-1-5-9為q.i.d.的常規時間，間隔不等；9-1-5-9-1-5-9為q.4.h.；9-5-1為q.8.h.。"},{"i":"102-2|18","e":"102-2","n":18,"c":7,"s":"「Atropine 2 mg I.M. before sent patient to OR」此屬於下列那一類醫囑？","o":["視需要醫囑（p.r.n. order）","單次醫囑（single order）","如有需要時，給與一次醫囑（S.O.S. order）","及時給與醫囑（st. order）"],"a":"B","k":"B","t":"","x":"單次醫囑（single order）指在特定時間只執行一次的醫囑，如術前送開刀房前給藥。st. order為立即執行一次；p.r.n.為需要時給予、可重複的長期醫囑；S.O.S.為需要時給一次、有時效限制。"},{"i":"102-2|30","e":"102-2","n":30,"c":7,"s":"有關肌肉注射的敘述，下列何者正確？","o":["最適宜的注射量為2～5 c.c.","注射量勿超過20 c.c.","注射時針頭至多能插入1/3長","較胖的病患因肌肉層較厚，應選用較短的針頭"],"a":"A","k":"A","t":"","x":"肌肉注射量一般為1～3 mL，成人最多不超過5 mL，選項A最符合。注射量勿超過20 mL明顯過多；針頭應沒入約1/2～2/3長；較胖的病人皮下脂肪較厚，應選用較長的針頭才能到達肌肉層。"},{"i":"102-2|34","e":"102-2","n":34,"c":7,"s":"某病房實施單一劑量給藥系統，護理師備藥的第二讀應於何時執行？","o":["由藥車取出藥盒時","由藥盒中取出藥袋（藥罐）時","由藥袋（藥罐）取出藥物時","將藥袋（藥罐）丟棄時"],"a":"C","k":"C","t":"","x":"單一劑量系統的三讀：第一讀為從藥車取出藥袋（藥盒）時核對；第二讀為從藥袋取出該時段藥物放入藥杯時；第三讀為將剩餘藥物放回或藥袋丟棄時。故第二讀應於由藥袋（藥罐）取出藥物時執行。"},{"i":"102-1|13","e":"102-1","n":13,"c":7,"s":"有關護理師在執行臨時醫囑S.O.S.時的注意事項，下列何者正確？","o":["醫師沒有停止醫囑就必須持續執行","當時因故未能執行，超過12小時此醫囑自動失效","臨時醫囑執行過程不必記載於護理記錄單內","臨時醫囑屬於緊急醫囑，護生即使有臨床護理指導師陪同也不能執行"],"a":"B","k":"B","t":"","x":"S.O.S.屬於臨時醫囑，為需要時給藥一次，通常在一定時效內（如12小時）有效，若因故未能執行，超過時效即自動失效。需持續執行至醫師停止的是長期醫囑；臨時醫囑執行後仍須記錄於護理記錄；S.O.S.並非緊急醫囑，護生在臨床護理指導師陪同下可依規定執行。"},{"i":"102-1|16","e":"102-1","n":16,"c":7,"s":"張先生因右小腿蜂窩性組織炎剛入住病房，醫囑開立Penicillin G 1000 mg I.V. drip q4h，身為主責護理師，下列敘述何者正確？","o":["不需做任何處理，即可給予注射","給藥前經三讀五對後，即可給予注射","張先生表示兩個月前曾注射過，即可給予注射","提醒醫師個案是否需進行藥物過敏試驗"],"a":"D","k":"D","t":"","x":"Penicillin易引起過敏反應甚至過敏性休克，首次使用或停藥一段時間後再使用前，應先執行青黴素皮膚試驗（PST），因此護理師應提醒醫師評估是否需做藥物過敏試驗。即使三讀五對無誤或兩個月前曾注射過，仍可能發生過敏，不可未經評估即直接注射。"},{"i":"102-1|18","e":"102-1","n":18,"c":7,"s":"（情境：張先生因右小腿蜂窩性組織炎剛入住病房，醫囑開立Penicillin G 1000 mg I.V. drip q4h。）若張先生在注射過程中，出現頭暈、呼吸困難、血壓下降，下列之立即處置何者最適當？","o":["告訴張先生此現象為正常的給藥反應，無需太擔心","立刻跑回護理站通知醫師","立刻停止給藥，並準備epinephrine","馬上通報護理長張先生的過敏反應，並請其安撫個案"],"a":"C","k":"C","t":"","x":"注射Penicillin過程中出現頭暈、呼吸困難、血壓下降，為過敏性休克的表現，應立即停止給藥，並準備1/1000腎上腺素（epinephrine）急救，同時呼救通知醫師。不可視為正常反應；也不應離開病人跑回護理站通知，以免延誤急救。"},{"i":"102-1|19","e":"102-1","n":19,"c":7,"s":"臨床上，病人若同時須服用多種類藥物，下列服用順序何者較適宜？","o":["錠劑→胃乳→咳嗽藥劑","錠劑→咳嗽藥劑→胃乳","咳嗽藥劑→胃乳→錠劑","胃乳→錠劑→咳嗽藥劑"],"a":"A","k":"A","t":"","x":"同時服用多種藥物時，應先服錠劑，再服胃乳等胃黏膜保護劑，最後服用咳嗽糖漿。咳嗽藥劑須留在咽喉黏膜發揮作用，服用後30分鐘內暫勿喝水，故應最後服用；若先服胃乳則會在胃壁形成保護膜，影響錠劑的吸收。"},{"i":"102-1|20","e":"102-1","n":20,"c":7,"s":"有關胰島素注射之敘述，下列何者正確？①採用皮下注射，每次都應更換注射部位 ②胰島素保存於室溫即可 ③注射後不可按摩，以免造成嚴重血腫 ④較瘦者應將肌肉捏起注射","o":["①④","①②","②③","③④"],"a":"A","k":"AB","t":"答A或B皆給分","x":"胰島素採皮下注射且需輪替注射部位，避免組織纖維化（①）；較瘦者應輕捏起皮膚注射，以免注入肌肉層（④），故官方答(A)。使用中的胰島素短期可於室溫（＜30℃）保存，故②亦有其道理，此為答(B)也給分的原因；注射後不按摩是為避免吸收過快，而非造成血腫，故③錯誤。"},{"i":"102-1|21","e":"102-1","n":21,"c":7,"s":"李先生疑似肺癌入院，凌晨2點，體溫：39.6℃，皮膚乾紅，護理師以電話告知值班醫師病人狀況，醫師在電話中給予口頭醫囑：acetaminophen（500 mg）1# P.O. stat.，護理師的處理方式下列何者最適當？","o":["護理師應拒絕接受口頭醫囑，以確保給藥安全","請醫師覆誦一遍醫囑","護理師在醫囑單上開立所給予藥物名稱、劑量、途徑、時間，隨後請醫師簽名","護理師抄下此口頭醫囑，並覆誦一次與醫師確認"],"a":"D","k":"D","t":"","x":"緊急情況下接受口頭醫囑時，護理師應將醫囑內容（藥名、劑量、途徑、時間）抄寫下來，並覆誦一次與醫師確認無誤後才執行，事後請醫師補開醫囑並簽名。緊急時不必拒絕口頭醫囑；應由護理師覆誦而非請醫師覆誦；護理師也不可自行在醫囑單上開立醫囑。"},{"i":"101-2|17","e":"101-2","n":17,"c":7,"s":"有關耳滴入法之敘述，下列何者正確？","o":["藥液宜加溫至60℃","將藥液由外耳道順耳壁流入","將藥液直接滴在耳膜上","藥液溫度宜維持20℃"],"a":"B","k":"B","t":"","x":"執行耳滴時，藥液應先以掌心搓溫至接近體溫（約37℃），並將藥液由外耳道沿耳壁滴入，使其順著耳道流入。藥液加溫至60℃易燙傷，20℃過冷則可能刺激內耳引起眩暈；藥液直接滴在耳膜上會造成不適及刺激。"},{"i":"101-2|18","e":"101-2","n":18,"c":7,"s":"為確保病人安全並達到給藥之目的，下列投藥方式何者正確？","o":["給予鐵劑時先以綠茶水稀釋再喝下","咳嗽藥水不宜與水同時服用","Tetracyclines可與牛奶一起服用，以減輕胃部不適","Aspirin與食物一起服用會減低藥效，應飯前服用"],"a":"B","k":"B","t":"","x":"咳嗽糖漿服用後若立即喝水會沖淡藥物對咽喉黏膜的作用而降低療效，故建議服用後30分鐘內暫勿飲水。茶中的鞣酸會影響鐵劑吸收；Tetracyclines會與牛奶中的鈣結合而降低吸收；Aspirin對胃有刺激性，應飯後或與食物併服。"},{"i":"101-2|19","e":"101-2","n":19,"c":7,"s":"醫囑「Panadol 1 P.O. S.O.S.」的意思是指下列何者？","o":["護理師必須經過醫師的同意後才能給予","為臨時醫囑","在給藥前應該先打半勾並簽上全名","當病患有需要時便給予"],"a":"B","k":"B","t":"","x":"S.O.S.為需要時給藥一次，屬於臨時醫囑，通常在一定時效（如12或24小時）內有效，給藥一次後即失效。當病人需要時便可重複給予的是p.r.n.（長期備用醫囑）；S.O.S.醫囑已由醫師開立，執行時不需再徵求醫師同意。"},{"i":"101-2|20","e":"101-2","n":20,"c":7,"s":"吳先生因心血管疾病入院治療，醫師開立下列醫囑：Capoten 1 （12.5 mg）P.O. q.o.d.，護理師應如何執行醫囑？","o":["每天睡前口服給予Capoten一顆","每隔一天一次給予口服Capoten一顆","每天四次口服給予Capoten一顆","每隔一週一次口服給予Capoten一顆"],"a":"B","k":"B","t":"","x":"q.o.d.（every other day）為每隔一天給藥一次，故應每隔一天口服給予Capoten一顆。每天睡前為h.s.，每天四次為q.i.d.，每週一次則為q.w.。"},{"i":"101-2|21","e":"101-2","n":21,"c":7,"s":"李先生右眼細菌感染，有一醫囑：4% Sulfisomezole（Sinomin）oph. solution O.U. 2gtts t.i.d.，下列給藥過程何者正確？","o":["點眼藥水於病患右眼即可","滴眼藥時，應請病患眼球往下看","眼藥滴在下結膜囊內","給藥後，以乾棉球按摩李先生眼皮"],"a":"C","k":"C","t":"","x":"滴眼藥時應請病人眼睛往上看，將下眼瞼往下拉，把藥液滴在下結膜囊（下穹窿）處，避免直接滴在角膜上。醫囑O.U.為雙眼，不可只點右眼；給藥後應輕壓內眥（鼻淚管）並閉眼休息，不可按摩眼皮。"},{"i":"101-2|22","e":"101-2","n":22,"c":7,"s":"護理師執行青黴素皮膚試驗（PST），下列給藥步驟，何者正確？","o":["抽取Penicillin 1 c.c.，注射劑量為100 u/1 c.c.","注射時，針頭斜面向上，完全插入真皮內","準備抗組織胺藥物於病患床邊，以備不時之需","執行皮膚試驗後10分鐘，請醫師看反應結果"],"a":"B","k":"B","t":"","x":"皮內注射時針頭斜面朝上，以5～15度角插入，待斜面完全進入皮內後注入藥液，形成小水泡。PST注射劑量為0.1 mL（含100單位）；應於床邊備妥1/1000腎上腺素（epinephrine）以處理過敏性休克，而非抗組織胺；結果應於注射後15～20分鐘判讀。"},{"i":"101-1|14","e":"101-1","n":14,"c":7,"s":"林小姐向護理師抱怨服用抗生素後覺得胃部不適，所以未服用上一次的抗生素。照顧林小姐的護理師應如何處理？","o":["建議病患以溫牛奶服藥，以保護胃壁","建議醫師將藥物改為靜脈注射","將此次藥物暫停，等病患胃部不適減輕後再給藥","為防止產生抗藥性，仍請病患按時服用，並建議醫師開立保護胃壁的藥物"],"a":"D","k":"D","t":"","x":"抗生素須按時服用以維持有效血中濃度，任意停藥易產生抗藥性，因此應請病人按時服用，並將胃部不適情形告知醫師，建議開立保護胃壁的藥物。牛奶可能影響部分抗生素的吸收；不可自行暫停給藥，改為靜脈注射也非優先處理方式。"},{"i":"101-1|15","e":"101-1","n":15,"c":7,"s":"林小妹，7足歲，因喉嚨疼痛，發燒而住院。林小妹因服用Augmentin藥物，味道欠佳不喜歡服用，下列那種誘導方式最適合？","o":["選擇林小妹喜歡的果汁一併服用","先請媽媽給予小冰塊含在口中","給予奶茶一併使用","強行逼迫林小妹服用"],"a":"B","k":"B","t":"","x":"服用味道不佳的藥物前，可先口含小冰塊麻痺味覺，以減少對藥物味道的感受，提高兒童服藥意願。將藥物混入果汁或奶茶中可能影響藥效，也可能讓孩子日後排斥這些飲料；強行逼迫服藥易造成嗆咳及抗拒，皆不適當。"},{"i":"101-1|16","e":"101-1","n":16,"c":7,"s":"（情境：林小妹，7足歲，因喉嚨疼痛，發燒而住院。）林小妹住院期間發燒到39℃，醫囑開立Acetaminophen 1# supp St.，下列給藥措施何者錯誤？","o":["避免給藥前造成疼痛，可以在塞劑前塗上少量潤滑劑","塞入肛門內不可超過1吋","若腸道有糞團，應先執行小量灌腸將糞便清除","幫林小妹採左側臥式"],"a":"B","k":"B","t":"","x":"肛門栓劑塞入時須推過肛門內括約肌，才能避免栓劑滑出（成人約6.5～7.5公分，兒童約2吋），塞入不超過1吋則易被排出，故(B)錯誤。塞劑前可塗少量潤滑劑減少不適；若直腸有糞團會影響吸收，應先清除；肛門給藥應採左側臥。"},{"i":"101-1|17","e":"101-1","n":17,"c":7,"s":"馬先生因膽結石住院接受手術，手術第一天有 q4h p.r.n.給予止痛劑的醫囑，有關給藥之敘述，下列何者正確？","o":["每隔4小時就應規律給予止痛劑","p.r.n.的醫囑屬於臨時醫囑","馬先生主訴疼痛時，每間隔4小時可給止痛劑","每當馬先生主訴疼痛時，立即給予止痛劑"],"a":"C","k":"C","t":"","x":"p.r.n.為需要時給藥，屬於長期備用醫囑，q4h p.r.n.表示病人主訴疼痛需要時才給藥，且兩次給藥至少需間隔4小時。規律每4小時給藥是q4h的長期醫囑；p.r.n.不屬於臨時醫囑；未滿4小時即使主訴疼痛也不可立即再給藥。"},{"i":"101-1|30","e":"101-1","n":30,"c":7,"s":"下列何項注射法，在針頭插入注射部位後，不需反抽針心？","o":["肌肉注射B型肝炎疫苗","靜脈注射小量抗生素","皮內注射盤尼西林皮膚試驗藥物","靜脈注射急救藥物"],"a":"C","k":"C","t":"","x":"皮內注射是將藥物注入表皮與真皮之間，針頭以5～15度角插入，下針後不需反抽，拔針時也不需按壓，常用於盤尼西林等藥物過敏試驗。肌肉注射需反抽確認無回血，靜脈注射則需見回血以確認針頭在血管內。"},{"i":"101-1|32","e":"101-1","n":32,"c":7,"s":"Gentamycin瓶上標示「2 ml/vial，40 mg/ml」，醫囑為Gentamycin 60 mg q8h，則每次應從瓶中抽出多少ml？","o":["0.75","1","1.5","1.75"],"a":"C","k":"C","t":"","x":"藥物濃度為40 mg/mL，醫囑劑量60 mg，所需抽取量為60 mg ÷ 40 mg/mL＝1.5 mL。每瓶含2 mL（共80 mg），足夠抽取一次劑量。"},{"i":"100-2|15","e":"100-2","n":15,"c":7,"s":"張小弟弟4歲，不會吞藥丸，有關給與口服藥應注意事項之敘述，下列何者錯誤？","o":["可將藥物磨粉後混合在牛奶中給與","選擇糖漿製劑，使用滴管餵藥，以免嗆到","服藥完成後，可以喜歡的東西作為鼓勵","可將藥物磨粉後加入糖粉調味，以減輕苦味"],"a":"A","k":"A","t":"","x":"嬰幼兒給藥時應避免將藥物混入牛奶、母奶或配方奶中，以免影響藥效，或使孩子因藥味而日後拒絕喝奶，故(A)錯誤。選用糖漿製劑以滴管餵藥、加糖粉減輕苦味、服藥後給予鼓勵，皆是兒童口服給藥的適當方法。"},{"i":"100-2|16","e":"100-2","n":16,"c":7,"s":"小兒用鎮痛解熱劑Diclofenac Sodium、治療痔瘡之治療劑Proctosedyl及治療陰道滴蟲感染之抗生素Trichomycin三項栓劑共同特性之敘述，下列何者正確？","o":["應存放於冰箱中，以防溶解","產生全身之功效","產生局部之功效","給藥時病人所採之姿勢"],"a":"A","k":"A","t":"","x":"栓劑在體溫下會融化，平時應存放於冰箱冷藏以防溶解變形，這是各類栓劑的共同特性。Diclofenac栓劑可產生全身性解熱鎮痛作用，Proctosedyl與Trichomycin則多為局部作用；肛門栓劑採左側臥、陰道栓劑採屈膝仰臥，給藥姿勢也不相同。"},{"i":"100-2|17","e":"100-2","n":17,"c":7,"s":"有關給藥常用縮寫之中文意義，下列何者錯誤？","o":["飯後：a.c.","睡前：h.s.","停用：DC","口服：p.o."],"a":"A","k":"A","t":"","x":"a.c.（ante cibum）為飯前，飯後的縮寫是p.c.（post cibum），故(A)錯誤。h.s.為睡前，DC為停用，p.o.為口服，皆為正確的給藥常用縮寫。"},{"i":"100-2|18","e":"100-2","n":18,"c":7,"s":"張太太為B型肝炎帶原者，其表面及核心抗原均呈陽性反應［HBsAg(+)、HBeAg(+)］，其新生兒出生24小時內應注射一劑B型肝炎免疫球蛋白，下列何者為注射此藥物的目的？","o":["預防疾病","減輕症狀","治療疾病","維持正常生理功能"],"a":"A","k":"A","t":"","x":"母親為B型肝炎高傳染性帶原者，新生兒出生24小時內注射B型肝炎免疫球蛋白（HBIG），可提供被動免疫以中和病毒、避免受到感染，其目的為預防疾病。此時新生兒尚未發病，故不屬於減輕症狀、治療疾病或維持正常生理功能。"},{"i":"100-2|19","e":"100-2","n":19,"c":7,"s":"有關皮下注射目的之敘述，下列何者正確？","o":["藥物是經由皮下脂肪組織吸收作用","注射具刺激性藥物，並可防止受消化液破壞","皮下組織是介於真皮層及肌肉組織之間，以慢慢吸收達療效","藥物作用速度較口服及肌肉注射快"],"a":"C","k":"C","t":"","x":"皮下注射是將藥物注入真皮層與肌肉層之間的皮下組織，使藥物緩慢吸收以達療效，適用於少量、刺激性較小的藥物。具刺激性的藥物應採肌肉注射；皮下注射的吸收速度比口服快，但比肌肉注射慢。"},{"i":"100-1|7","e":"100-1","n":7,"c":7,"s":"予成人病患耳滴入法時，下列何項方式能將耳道拉直？","o":["將病患外耳向上往後拉","將病患耳垂向後向下拉","將病患耳垂向前向下拉","將病患外耳向下往後拉"],"a":"A","k":"A","t":"","x":"成人（3歲以上）耳滴時應將耳廓（外耳）向上、向後拉，使外耳道變直，以利藥物進入耳道；3歲以下幼童則將耳朵往下、往後拉。其餘選項的拉法方向錯誤，無法有效拉直成人耳道。"},{"i":"100-1|17","e":"100-1","n":17,"c":7,"s":"醫師開立下列醫囑：Brown Mixture 15 mL p.c. qid，護理師在執行上述醫囑應注意那些？①檢查藥物有無變質並將藥水搖勻 ②倒藥水時應手握標籤，以免藥水沾污標籤 ③倒入藥液使液面最高點與視線成水平 ④告知病患服用後暫勿喝水，以維持藥效 ⑤必須置於冰箱冷藏","o":["①③④","②④⑤","①②④","②③⑤"],"a":"C","k":"C","t":"","x":"倒藥水前應檢查藥物有無變質並搖勻（①），倒藥時手握標籤以免藥液沾污標籤（②）；Brown Mixture為咳嗽糖漿，服用後30分鐘內暫勿喝水，以免降低藥效（④）。倒藥時應使液面最低點（凹面）與視線成水平，而非最高點；一般藥水於室溫保存即可，不需冷藏，故③⑤錯誤。"},{"i":"100-1|24","e":"100-1","n":24,"c":7,"s":"陳先生預行檢查，醫師開立下列醫囑：Senokot 1 po hs & Senokot supp. 2 c.m.，護理師應如何執行上述醫囑？","o":["睡前口服一顆Senokot，並在明晨給予二顆Senokot塞劑","三餐飯後口服一顆Senokot，並在睡前給予二顆Senokot塞劑","睡前口服一顆Senokot，並同時給予二顆Senokot塞劑","三餐飯前口服一顆Senokot，並同時給予二顆Senokot塞劑"],"a":"A","k":"A","t":"","x":"醫囑中「po hs」為睡前口服，「supp.」為栓劑，「c.m.」（cras mane）為明晨，因此應於睡前口服一顆Senokot，並於明天早晨給予二顆Senokot栓劑，以完成檢查前的腸道準備。其餘選項將hs誤解為三餐飯前或飯後，或將c.m.誤解為同時給予。"},{"i":"100-1|26","e":"100-1","n":26,"c":7,"s":"病患服用鐵劑時，下列那一種護理措施最合宜？","o":["避免加水稀釋","應用吸管服用","應搭配牛奶服用","應在飯前服用"],"a":"B","k":"B","t":"","x":"鐵劑等液體藥物會使牙齒染色或損傷琺瑯質，應加水稀釋並以吸管服用，服用後漱口。鐵劑應加水稀釋而非避免稀釋；牛奶會影響鐵的吸收，不宜併服；鐵劑雖空腹吸收較好，但易刺激腸胃，臨床多建議與食物併服以減輕腸胃不適。"},{"i":"100-1|34","e":"100-1","n":34,"c":7,"s":"將三種不同的注射法排序，依作用速度由快至慢之排列順序為何？①肌肉注射 ②皮下注射 ③靜脈注射","o":["①＞ ②＞ ③","③＞ ②＞①","③＞①＞ ②","①＞ ③＞ ②"],"a":"C","k":"C","t":"","x":"藥物吸收進入循環的速度，由快至慢依序為靜脈注射＞吸入＞舌下＞直腸＞肌肉注射＞皮下注射＞口服＞經皮吸收。靜脈注射直接進入血流最快，肌肉組織血流較皮下組織豐富，故作用速度為③＞①＞②。"},{"i":"b1-1","e":"","n":0,"c":6,"s":"下列何者『不是』人體代謝廢物的主要排泄途徑？","o":["心臟（血液循環）","腎臟（尿液）","皮膚（汗液）","肺（呼氣）"],"a":"A","k":"A","t":"","x":"排泄是指人體新陳代謝所產生的廢物排出體外，途徑包括皮膚、肺、腎臟與腸道；心臟負責血液循環，不是排泄器官。"},{"i":"b1-2","e":"","n":0,"c":6,"s":"大腸由近端至遠端的正確順序為何？","o":["盲腸→橫結腸→升結腸→降結腸→乙狀結腸→直腸→肛門","盲腸→升結腸→降結腸→橫結腸→乙狀結腸→直腸→肛門","盲腸→升結腸→橫結腸→降結腸→乙狀結腸→直腸→肛門","盲腸→升結腸→橫結腸→乙狀結腸→降結腸→直腸→肛門"],"a":"C","k":"C","t":"","x":"依講義大腸解剖圖：盲腸（附闌尾）→升結腸→（右結腸彎曲）橫結腸（左結腸彎曲）→降結腸→乙狀結腸→直腸→肛管、肛門。"},{"i":"b1-3","e":"","n":0,"c":6,"s":"結腸『最主要』的生理功能為何？","o":["吸收水分","合成膽汁","吸收脂肪與蛋白質","分泌消化酵素"],"a":"A","k":"A","t":"","x":"結腸最主要的功能是吸收水分；另有保護（分泌黏液）、分泌（維持電解質平衡）與排泄（氣體與廢物）功能。p.4、p.5"},{"i":"b1-4","e":"","n":0,"c":6,"s":"結腸每日約吸收多少水分？","o":["約 500 mL","約 1,000 mL","約 1,500 mL","約 2,500 mL"],"a":"D","k":"D","t":"","x":"結腸每日約吸收水分 2,500 mL 及電解質（鈉 55 mEq、氯 23 mEq）；食糜在結腸內由液態逐漸變為半液態、泥狀、半泥狀，最後成為固態、硬固態。"},{"i":"b1-5","e":"","n":0,"c":6,"s":"結腸分泌黏液的構造與功能，下列敘述何者正確？","o":["由複層鱗狀上皮細胞及肥大細胞分泌，主要功能是消化蛋白質","由單層柱狀上皮細胞及杯狀細胞分泌，具潤滑作用，避免結腸受損","由腸腺與胰腺共同分泌，主要功能是中和胃酸並促進蛋白質消化","由肝臟與膽囊共同分泌，主要功能是乳化脂肪，促進脂溶性維生素吸收"],"a":"B","k":"B","t":"","x":"結腸的「保護」功能：由單層柱狀上皮細胞及杯狀細胞分泌黏液，潤滑腸道、避免結腸受損。"},{"i":"b1-6","e":"","n":0,"c":6,"s":"結腸生理功能中的「排泄」功能，是指下列何者？","o":["將腸內廢物及氣體排出體外","吸收鈉與氯離子，維持電解質平衡","分泌黏液，潤滑並保護結腸","吸收水分，使糞便由液態變固態"],"a":"A","k":"A","t":"","x":"結腸四大生理功能：①吸收水分（最主要）；②保護：分泌黏液潤滑腸道；③分泌：維持電解質平衡（吸收鈉、氯離子，排泄鉀離子）；④排泄：氣體與廢物——透過蠕動將內容物推送至結腸，對結腸壁造成壓力，刺激排便反射，使腸內廢物及氣體排出體外。"},{"i":"b1-7","e":"","n":0,"c":6,"s":"關於結腸的分泌功能與電解質平衡，下列何者正確？","o":["只吸收鉀離子，不處理鈉與氯","吸收鈉離子，同時也大量吸收鉀離子","同時吸收鈉離子與氯離子，並排泄鉀離子","同時排泄鈉離子與氯離子，並吸收鉀離子"],"a":"C","k":"C","t":"","x":"結腸「分泌」功能維持電解質平衡：吸收鈉、氯離子，排泄鉀離子。"},{"i":"b1-8","e":"","n":0,"c":6,"s":"鉀離子的排泄比例，腎臟與腸道約各佔多少？","o":["腎臟 80～90%、腸道 10～20%","腎臟 100%，腸道不排泄鉀離子","腎臟與腸道各佔 50%","腎臟 10～20%、腸道 80～90%"],"a":"A","k":"A","t":"","x":"鉀離子主要由腎臟排出（80～90%），腸道僅負責 10～20%。"},{"i":"b1-9","e":"","n":0,"c":6,"s":"下列哪一種大腸運動屬於「大蠕動」，主要發生在橫結腸？","o":["結腸袋攪拌運動","質塊運動","絨毛擺動","蠕動"],"a":"B","k":"B","t":"","x":"大腸運動有結腸袋攪拌運動、蠕動、質塊運動三種；質塊運動屬於大蠕動，發生在橫結腸，由胃結腸反射與十二指腸結腸反射引發。"},{"i":"b1-10","e":"","n":0,"c":6,"s":"引發質塊運動（大蠕動）的反射為何？","o":["排尿反射與胃結腸反射","直腸反射與排便反射","胃結腸反射與十二指腸結腸反射","胃結腸反射與直腸反射"],"a":"C","k":"C","t":"","x":"質塊運動由胃結腸反射與十二指腸結腸反射引發；直腸反射是糞便由乙狀結腸進入直腸時所引發的反射。"},{"i":"b1-11","e":"","n":0,"c":6,"s":"十二指腸結腸反射通常發生在何時？","o":["餐後","排便之後","睡眠時","空腹時"],"a":"A","k":"A","t":"","x":"十二指腸結腸反射發生於餐後（食糜到達十二指腸）；講義另建議便祕病人養成早餐後排便的習慣。p.6、p.7、p.22"},{"i":"b1-12","e":"","n":0,"c":6,"s":"關於「直腸反射」，下列何者正確？","o":["食糜到達十二指腸時所引發","食物進入胃內時所引發","膀胱脹尿時所引發","糞便由乙狀結腸進入直腸時所引發"],"a":"D","k":"D","t":"","x":"胃結腸反射：食物到達胃；十二指腸結腸反射：食糜到達十二指腸（餐後）；直腸反射：糞便由乙狀結腸進入直腸。"},{"i":"b1-13","e":"","n":0,"c":6,"s":"大腸運動中的「蠕動」，其速度非常緩慢，約多久發生一次？","o":["約 30 秒～1 分鐘一次","約 5～15 分鐘一次","約 30～40 分鐘一次","約 1～2 小時一次"],"a":"B","k":"B","t":"","x":"大腸運動有結腸袋攪拌運動、蠕動、質塊運動三種；其中蠕動速度非常緩慢，約 5～15 分鐘一次；質塊運動才屬於大蠕動，發生在橫結腸。"},{"i":"b1-14","e":"","n":0,"c":6,"s":"胃結腸反射是由下列何種情形所引發？","o":["糞便由乙狀結腸進入直腸時","食糜到達十二指腸時","食物到達胃中時","膀胱脹尿時"],"a":"C","k":"C","t":"","x":"胃結腸反射：食物到達胃中時引發；十二指腸結腸反射：食糜到達十二指腸（餐後）引發；直腸反射：糞便由乙狀結腸進入直腸時引發。胃結腸反射與十二指腸結腸反射可引發質塊運動（大蠕動）。"},{"i":"b1-15","e":"","n":0,"c":6,"s":"糞便進入直腸後，直腸壓力至少達多少 mmHg 以上，才會刺激直腸壓力接受器而引發排便反射？","o":["10～15 mmHg","20～25 mmHg","30～35 mmHg","50～55 mmHg"],"a":"D","k":"D","t":"","x":"排便反射流程：糞便進入直腸→直腸壓力達 50～55 mmHg 以上→刺激直腸壓力接受器→感覺傳導→骨盆神經→排便反射中樞（S2～S4）。"},{"i":"b1-16","e":"","n":0,"c":6,"s":"排便反射中樞位於脊髓的哪一節段？","o":["C1～C3","T10～T12","L1～L3","S2～S4"],"a":"D","k":"D","t":"","x":"排便反射中樞與排尿反射中樞相同，都位於薦髓 S2～S4。"},{"i":"b1-17","e":"","n":0,"c":6,"s":"排便反射中，將直腸壓力訊息傳入排便反射中樞的神經為何？","o":["迷走神經","骨盆神經","會陰神經","交感神經"],"a":"B","k":"B","t":"","x":"直腸壓力接受器受刺激後，感覺經骨盆神經傳入排便反射中樞（S2～S4），並上傳脊髓與大腦皮質。"},{"i":"b1-18","e":"","n":0,"c":6,"s":"排便反射的傳出路徑，下列何者正確？","o":["會陰神經（體神經）使直腸收縮並使肛門內括約肌放鬆；骨盆神經（副交感）使肛門外括約肌放鬆","會陰神經（體神經）使肛門內括約肌收縮；骨盆神經（副交感）使直腸鬆弛並使肛門外括約肌收縮","會陰神經（體神經）使肛門外括約肌放鬆；骨盆神經（副交感）使直腸收縮並使肛門內括約肌放鬆","交感神經使直腸收縮並使肛門內括約肌放鬆；會陰神經（體神經）使肛門外括約肌收縮"],"a":"C","k":"C","t":"","x":"傳出路徑：①會陰神經（體神經）→肛門外括約肌放鬆；②骨盆神經（副交感神經）→直腸收縮、肛門內括約肌放鬆→排便。"},{"i":"b1-19","e":"","n":0,"c":6,"s":"排便反射「受時間地點調控」，是因為下列何處可調節是否配合時間、地點排便？","o":["大腦皮質","延腦","腎上腺","小腦"],"a":"A","k":"A","t":"","x":"感覺訊息經脊髓上傳至大腦皮質，再由運動傳導下行調控排便反射中樞，因此人可暫時忍住便意。"},{"i":"b1-20","e":"","n":0,"c":6,"s":"下列何者『不是』伐氏操作（Valsalva maneuver）的禁忌對象？","o":["糖尿病病人或老人","顱內壓升高（IICP）的病人","心血管疾病病人","單純便祕、無心血管疾病的健康年輕人"],"a":"D","k":"D","t":"","x":"伐氏操作是便祕病人用力憋氣增加腹壓以解便的方式；禁忌：心血管疾病、顱內壓升高（IICP）、糖尿病病人或老人。"},{"i":"b1-21","e":"","n":0,"c":6,"s":"一位腦出血病人顱內壓升高且有便祕，下列護理指導何者最適當？","o":["教導深吸氣後憋氣用力解便（伐氏操作），以增加腹內壓、縮短排便時間並減少疼痛","避免用力憋氣解便（避免伐氏操作），必要時依醫囑給予甘油球灌腸，不宜大量灌腸","鼓勵採蹲姿並盡量用力排便，必要時依醫囑給予大量肥皂水灌腸以清空腸道，減少解便次數","依醫囑立即給予大量肥皂水灌腸，使糞便盡快軟化並一次排空，並鼓勵灌腸後用力憋氣解便"],"a":"B","k":"B","t":"","x":"IICP 病人禁做伐氏操作；便祕時可適時給予甘油球灌腸，但不宜執行大量灌腸。"},{"i":"b2-1","e":"","n":0,"c":6,"s":"正常糞便的顏色，嬰兒與成人分別為何？","o":["嬰兒棕色、成人黃色","嬰兒綠色、成人黑色","嬰兒與成人皆為灰白色","嬰兒黃色、成人棕色"],"a":"D","k":"D","t":"","x":"正常糞便顏色：嬰兒黃色、成人棕色。"},{"i":"b2-2","e":"","n":0,"c":6,"s":"病人解出灰白色糞便（clay stool），最可能的原因為何？","o":["缺乏膽汁（如膽道阻塞）","服用鐵劑或進食大量動物血製品","進食大量甜菜或其他紅色食物","下腸胃道出血（如痔瘡出血）"],"a":"A","k":"A","t":"","x":"灰白色糞便：缺乏膽汁（膽道阻塞）、鋇劑檢驗，或脂肪吸收不良、進食較多牛乳與乳製品而肉類少。"},{"i":"b2-3","e":"","n":0,"c":6,"s":"下列何者『最不可能』造成黑色或焦油色（tarry）糞便？","o":["進食大量甜菜","服用鐵劑","胃潰瘍出血","進食較多豬肝等內臟及深綠色蔬菜"],"a":"A","k":"A","t":"","x":"黑色／焦油色糞便：藥物（鐵劑）、內臟（豬肝）與深綠色蔬菜，或上腸胃道出血（胃潰瘍出血、食道靜脈曲張破裂、小腸出血）；甜菜使糞便呈紅色。"},{"i":"b2-4","e":"","n":0,"c":6,"s":"病人解出鮮紅色糞便，最需考慮下列何種問題？","o":["食道靜脈曲張破裂出血","膽道阻塞","胃潰瘍出血","下腸胃道出血（如直腸出血）"],"a":"D","k":"D","t":"","x":"紅色糞便：食物（甜菜）或下腸胃道出血（如直腸）；上腸胃道出血多呈黑色焦油狀。"},{"i":"b2-5","e":"","n":0,"c":6,"s":"糞便呈橘色，可能的原因為何？","o":["服用鐵劑或進食大量深色食物","腸道感染或使用肺結核藥物","缺乏膽汁（如膽道阻塞）","上腸胃道出血（如胃潰瘍出血）"],"a":"B","k":"B","t":"","x":"橘色糞便：腸道感染、使用肺結核藥物（rifapentine）；綠色糞便亦可見於腸道感染。"},{"i":"b2-6","e":"","n":0,"c":6,"s":"服用鐵劑對糞便的影響為何？","o":["使糞便變紅、變軟","使糞便呈橘色並有酸臭味","使糞便變黑、變硬","使糞便變灰白、變稀"],"a":"C","k":"C","t":"","x":"鐵劑會使糞便變黑、變硬（也是黑色焦油色糞便的原因之一）。"},{"i":"b2-7","e":"","n":0,"c":6,"s":"下列何種出血最可能使糞便呈黑色或焦油色（tarry stool）？","o":["直腸黏膜潰瘍出血","食道靜脈曲張破裂出血","痔瘡靜脈叢破裂出血","乙狀結腸息肉出血"],"a":"B","k":"B","t":"","x":"黑色或焦油色糞便：藥物（如鐵劑）、進食較多內臟（如豬肝）和深綠色蔬菜，或上腸胃道出血（如胃潰瘍出血、食道靜脈曲張破裂、小腸出血）；紅色糞便則見於食物（甜菜）或下腸胃道出血（如直腸）。"},{"i":"b2-8","e":"","n":0,"c":6,"s":"病人解出綠色糞便，最可能的原因為何？","o":["進食大量甜菜","缺乏膽汁","腸道感染","上腸胃道出血"],"a":"C","k":"C","t":"","x":"糞便顏色與可能原因：灰白色→缺乏膽汁（膽道阻塞）、鋇劑檢驗；黑色／焦油色→鐵劑、內臟（豬肝）、深綠色蔬菜或上腸胃道出血；紅色→甜菜或下腸胃道出血；橘色→腸道感染、肺結核藥物；綠色→腸道感染。"},{"i":"b2-9","e":"","n":0,"c":6,"s":"病人接受鋇劑檢驗後，糞便最可能呈現何種顏色？","o":["深綠色","橘黃色","暗黑色","灰白色"],"a":"D","k":"D","t":"","x":"灰白色（clay stool）糞便的可能原因：缺乏膽汁（膽道阻塞）、鋇劑檢驗，或脂肪吸收不良、進食較多牛乳、乳製品和少量肉類。"},{"i":"b2-10","e":"","n":0,"c":6,"s":"糞便出現腐敗臭或酸腐臭，下列何者是可能的原因？","o":["使用肺結核藥物","感染或出血","服用鐵劑","進食大量甜菜"],"a":"B","k":"B","t":"","x":"糞便氣味：正常依進食種類及個人菌叢而異；腐敗臭、酸腐臭可見於感染、出血、醣類未充分消化、未吸收的脂肪酸；嚴重的腐肉臭味通常發生在晚期腸癌患者。鐵劑（黑色）、肺結核藥物（橘色）、甜菜（紅色）影響的是糞便顏色。p.10、p.11"},{"i":"b2-11","e":"","n":0,"c":6,"s":"糞便乾硬，最可能的原因為何？","o":["進食大量纖維並多喝水，使糞便水分增加、腸蠕動增快而通過速度加快","腸蠕動增加、水分吸收減少（如細菌引起的結腸過敏、食糜快速通過腸道）","腸道受細菌感染，使大量水分分泌至腸腔並使腸蠕動增快（如腸道感染）","脫水、腸蠕動減少（如低纖維飲食、缺乏運動、情緒不安、過度使用瀉劑）"],"a":"D","k":"D","t":"","x":"硬、乾糞便：脫水、腸蠕動減少；水狀、鬆軟狀糞便：腸蠕動增加（如細菌引起的結腸過敏）。"},{"i":"b2-12","e":"","n":0,"c":6,"s":"糞便呈水狀、鬆軟狀，代表腸道有何種變化？","o":["腸蠕動增加","膽汁分泌不足","腸蠕動減少","水分吸收過多"],"a":"A","k":"A","t":"","x":"水狀、鬆軟狀糞便：腸蠕動增加（如細菌引起的結腸過敏），食糜通過過快、水分來不及被吸收。"},{"i":"b2-13","e":"","n":0,"c":6,"s":"成人正常糞便呈圓柱狀，直徑約多少？","o":["約 0.5 cm","約 1 cm","約 2.5 cm","約 5 cm"],"a":"C","k":"C","t":"","x":"成人正常糞便為圓柱狀，直徑約 2.5 cm。"},{"i":"b2-14","e":"","n":0,"c":6,"s":"糞便呈窄、筆型或細線狀，需特別注意下列何種原因？","o":["大量攝取膳食纖維","直腸腫瘤變大，擠迫內腔","膽道阻塞","脫水導致腸蠕動減少"],"a":"B","k":"B","t":"","x":"窄、筆型或細線狀糞便：直腸腫瘤變大擠迫內腔而使糞便變細，或快速蠕動。"},{"i":"b2-15","e":"","n":0,"c":6,"s":"嚴重的腐肉臭味糞便，通常出現在哪一類病人？","o":["大量攝取牛乳者","缺鐵性貧血病人","晚期腸癌患者","膽道阻塞病人"],"a":"C","k":"C","t":"","x":"糞便氣味依進食種類及個人菌叢而異；腐敗臭、酸腐臭可見於感染、出血、醣類未充分消化；嚴重的腐肉臭味通常發生在晚期腸癌患者。"},{"i":"b2-16","e":"","n":0,"c":6,"s":"正常糞便的軟硬度應為何？","o":["成形、軟、半固體狀、溼潤","不成形、水狀、鬆軟狀","成形、極硬、顆粒狀、乾燥","成形、硬、固體狀、乾燥"],"a":"A","k":"A","t":"","x":"正常糞便：成形、軟、半固體狀、溼潤；硬、乾為異常（脫水、腸蠕動減少）；水狀、鬆軟狀為異常（腸蠕動增加）。"},{"i":"b2-17","e":"","n":0,"c":6,"s":"糞便中出現大量脂肪，最可能代表下列何者？","o":["吸收不良","細菌性感染","意外吞食異物","腸胃道出血"],"a":"A","k":"A","t":"","x":"糞便異常成分與可能原因：膿→細菌性感染；黏液→發炎；寄生蟲→寄生蟲感染；血液→腸胃道出血；大量脂肪→吸收不良；外來異物→意外吞食。"},{"i":"b2-18","e":"","n":0,"c":6,"s":"糞便中發現黏液，較可能代表下列何種情形？","o":["膽汁分泌過多","膳食纖維攝取不足","脂肪吸收良好","腸道發炎"],"a":"D","k":"D","t":"","x":"糞便異常成分：黏液→發炎（膿→細菌性感染；寄生蟲→寄生蟲感染；血液→腸胃道出血）。"},{"i":"b2-19","e":"","n":0,"c":6,"s":"成人每天糞便量約為多少？","o":["約 10～50 g","約 100～400 g","約 500～800 g","約 1,000 g 以上"],"a":"B","k":"B","t":"","x":"糞便量依食入量而異，每天約 100～400 g。"},{"i":"b2-20","e":"","n":0,"c":6,"s":"關於正常排便次數，下列敘述何者正確？","o":["成人約每週 1 次左右或更少；餵母乳嬰兒約每天 10 次以上","成人約每天 1 次或每週 2～3 次；餵母乳嬰兒約每天 4～6 次","成人約每天 3 次以上或更多；餵母乳嬰兒約每天 1 次或更少","成人約每天 4～6 次或更多；餵母乳嬰兒約每週 2～3 次左右"],"a":"B","k":"B","t":"","x":"次數：嬰兒（餵母乳）4～6 次／天；成人 1 次／天或 2～3 次／每週。"},{"i":"b2-21","e":"","n":0,"c":6,"s":"下列糞便異常成分與可能原因的配對，何者正確？","o":["大量脂肪－意外吞食","黏液－吸收不良","膿－細菌性感染","外來異物－寄生蟲感染"],"a":"C","k":"C","t":"","x":"糞便異常成分與可能原因：膿→細菌性感染；黏液→發炎；寄生蟲→寄生蟲感染；血液→腸胃道出血；大量脂肪→吸收不良；外來異物→意外吞食。"},{"i":"b2-22","e":"","n":0,"c":6,"s":"病人預定接受大腸鏡檢查，檢查前的準備下列何者正確？","o":["檢查前禁食 2 小時，並於檢查當天早上灌腸一次","檢查前一天多吃蔬果，以促進排便並清空腸道","檢查前三天採低渣飲食，檢查前午夜後開始禁食","檢查前三天採高纖維飲食，檢查當天正常進食"],"a":"C","k":"C","t":"","x":"內視鏡（大腸鏡）檢查前三天採低渣飲食，午夜後禁食；檢查當天前 4 小時（或前晚加當天前 4 小時）服用清腸藥。"},{"i":"b2-23","e":"","n":0,"c":6,"s":"下列何者為大腸鏡檢查前常用的口服清腸藥？","o":["Alugel®（含鋁制酸劑）或 Amoxicillin","Morphine 或 Codeine（止痛劑）","鈣離子阻斷劑或抗膽鹼性藥物","Niflec®、PEG 或 Klean-prep"],"a":"D","k":"D","t":"","x":"清腸藥如 Niflec®、PEG 或 Klean-prep，於檢查當天前 4 小時（或前晚加當天前 4 小時）服用。"},{"i":"b2-24","e":"","n":0,"c":6,"s":"大腸鏡檢查當日，病人仍未完全解便，護理師應如何處理？","o":["可再行清潔灌腸","直接進行檢查","鼓勵多吃高纖食物後再等待","給予止瀉劑後再檢查"],"a":"A","k":"A","t":"","x":"若檢查當日未完全解便，可再行清潔灌腸，使腸道清潔以利檢查。"},{"i":"b2-25","e":"","n":0,"c":6,"s":"接受大腸鏡檢查時，病人適當的姿勢為何？","o":["半坐臥","膝胸臥式或左側臥","站立前傾","仰臥雙腿伸直"],"a":"B","k":"B","t":"","x":"大腸鏡檢查時病人應採膝胸臥式或左側臥；檢查時會灌入空氣擴張腸道。"},{"i":"b2-26","e":"","n":0,"c":6,"s":"大腸鏡檢查後，護理師鼓勵病人下床走動，主要目的為何？","o":["促進尿液排出（避免檢查後尿瀦留）","減少腸道出血（避免檢查後黏膜傷口滲血）","促進排氣（檢查時灌入空氣擴張腸道）","預防低血糖（因檢查前長時間禁食）"],"a":"C","k":"C","t":"","x":"檢查時灌入空氣擴張腸道，檢查後鼓勵病人下床走動以促進排氣。"},{"i":"b2-27","e":"","n":0,"c":6,"s":"大腸鏡檢查前，清腸藥（如 Niflec®、PEG 或 Klean-prep）的服用時間，依講義何者正確？","o":["檢查當天前 30 分鐘，或前晚加上當天前 30 分鐘","檢查當天前 1 小時，或前晚加上當天前 1 小時","檢查當天前 4 小時，或前晚加上當天前 4 小時","檢查當天前 8 小時，或前晚加上當天前 8 小時"],"a":"C","k":"C","t":"","x":"內視鏡檢查：檢查當天前 4 小時，或前晚加上當天檢查前 4 小時，服用清腸藥（如 Niflec®、PEG 或 Klean-prep）；若檢查當日未完全解便，可再行清潔灌腸。"},{"i":"b2-28","e":"","n":0,"c":6,"s":"大腸鏡檢查時會灌入空氣，其主要目的為何？","o":["擴張腸道，以利檢視腸道結構","軟化腸內糞便，以利清腸排出","刺激腸蠕動，以利殘餘糞便排出","潤滑腸壁，避免內視鏡摩擦受傷"],"a":"A","k":"A","t":"","x":"內視鏡檢查：檢查腸道結構或活體切片檢查；檢查時灌入空氣擴張腸道，因此檢查後鼓勵病人下床走動，以促進排氣。"},{"i":"b2-29","e":"","n":0,"c":6,"s":"下列何種藥物會使平滑肌鬆弛、腸蠕動減少，易引起便祕？","o":["抗生素類藥物","口服清腸藥","含鎂制酸劑","抗膽鹼性藥物"],"a":"D","k":"D","t":"","x":"止痛劑（如 morphine、codeine）、鈣離子阻斷劑、抗膽鹼性藥物會使平滑肌鬆弛、腸蠕動減少而易便祕；抗生素破壞腸內正常細菌、含鎂制酸劑易造成腹瀉；清腸藥（如 Niflec®、PEG）用於大腸鏡檢查前清潔腸道。"},{"i":"b2-30","e":"","n":0,"c":6,"s":"鋇劑等顯影劑存留在結腸內，最可能造成什麼問題？","o":["糞便變硬，造成便祕或糞便嵌塞","肛門括約肌失去張力而失禁","腸蠕動增加而腹瀉","糞便變成綠色並含大量黏液"],"a":"A","k":"A","t":"","x":"診斷性檢查：顯影劑（鋇劑）存留於結腸內的糞便會變硬，造成便祕或糞便嵌塞（impaction）；內視鏡檢查也會改變原本的排便型態。"},{"i":"b2-31","e":"","n":0,"c":6,"s":"下列何者屬於「排泄方式改變」而影響排便型態的因素？","o":["腹部手術後腸蠕動減少","服用鐵劑使糞便變硬","鋇劑檢查後糞便變硬","臨終病人排便失禁"],"a":"D","k":"D","t":"","x":"影響排便型態因素第 13 項：排泄的方式改變，如臨終病人排便失禁；鐵劑屬藥物、鋇劑屬診斷性檢查、腹部手術屬手術因素。"},{"i":"b2-32","e":"","n":0,"c":6,"s":"下列何者『不會』造成便祕？","o":["鈣離子阻斷劑","Morphine（止痛劑）","含鋁制酸劑（如 Alugel®）","含鎂制酸劑（如 MgO）"],"a":"D","k":"D","t":"","x":"含鎂制酸劑易導致腹瀉，含鋁制酸劑則易便祕；止痛劑（morphine、codeine）、鈣離子阻斷劑、抗膽鹼性藥物使平滑肌鬆弛、腸蠕動減少而便祕。"},{"i":"b2-33","e":"","n":0,"c":6,"s":"病人服用 amoxicillin 後出現腹瀉，最可能的機轉為何？","o":["抑制中樞神經系統","破壞腸內正常菌叢","使平滑肌鬆弛、腸蠕動減少","使糞便水分被過度吸收"],"a":"B","k":"B","t":"","x":"抗生素（如 amoxicillin）因破壞腸內正常細菌，易造成腹瀉。"},{"i":"b2-34","e":"","n":0,"c":6,"s":"全身麻醉後病人容易便祕，主要原因為何？","o":["抑制中樞神經系統，使腸蠕動減少","使肛門括約肌持續鬆弛","刺激副交感神經，使腸蠕動增加","破壞腸內正常菌叢"],"a":"A","k":"A","t":"","x":"全身麻醉劑會抑制中樞神經系統，減少腸蠕動而易造成便祕。"},{"i":"b3-1","e":"","n":0,"c":6,"s":"養成規律排便習慣，最佳的鼓勵時機為何？","o":["睡前","早餐後","半夜起床時","午餐前"],"a":"B","k":"B","t":"","x":"鼓勵早餐後排便（進食後的胃結腸反射易引發質塊運動，見"},{"i":"b3-2","e":"","n":0,"c":6,"s":"關於護理診斷「便祕（constipation）」，下列敘述何者正確？","o":["需出現全部定義性特徵才能成立","屬於護理診斷，不是醫學診斷","同時是護理診斷與醫學診斷，可互換使用","屬於醫學診斷，需由醫師確立"],"a":"B","k":"B","t":"","x":"講義強調：便祕是「護理診斷」，非醫學診斷。"},{"i":"b3-3","e":"","n":0,"c":6,"s":"確立護理診斷或健康問題時，「定義性特徵」至少需滿足幾項？","o":["1項","2項","3項","5項"],"a":"A","k":"A","t":"","x":"定義性特徵至少滿足 1 項，才能確立護理診斷或健康問題。"},{"i":"b3-4","e":"","n":0,"c":6,"s":"便祕的護理診斷定義為何？","o":["個人排便次數增加，解出鬆散、不成形的液狀糞便，並伴有腸蠕動音增快","個人自我診斷為便祕，因此每日濫用瀉劑、灌腸和栓劑以確保排便通暢","個人正常排便習慣改變，特徵為糞便不自主地排出，且無法感知直腸脹滿感","個人排便次數減少，合併有排便困難或不完全和（或）排出過度乾、硬的糞便"],"a":"D","k":"D","t":"","x":"便祕＝次數減少＋困難／不完全＋乾硬；腹瀉＝解出鬆散不成形糞便；排便失禁＝不自主排便；感受性便祕＝自我診斷便祕並濫用瀉劑、灌腸與栓劑。"},{"i":"b3-5","e":"","n":0,"c":6,"s":"一位病人認為每天必須在同一時間排便，因此每天使用瀉劑、灌腸和栓劑以確保排便通暢，最適切的護理診斷為何？","o":["感受性便祕（perceived constipation）","腹瀉（diarrhea，每天解出三次以上鬆散便）","便祕（constipation，排便次數減少且乾硬）","排便失禁（bowel incontinence，不自主排便）"],"a":"A","k":"A","t":"","x":"感受性便祕：自我診斷為便祕並濫用瀉劑、灌腸、栓劑；定義性特徵為期望每天排便一次、期望每天在同一時間排便；相關因素有思考過程障礙、評估錯誤、文化或家庭健康信念。"},{"i":"b3-6","e":"","n":0,"c":6,"s":"下列何者『不是』便祕的定義性特徵？","o":["腹部叩診呈濁音，並觸摸到直腸的硬塊","每天至少解出三次鬆散、液狀的糞便","排便時需用力，並伴隨排便時疼痛","排便次數減少，並排出乾硬的成形便"],"a":"B","k":"B","t":"","x":"便祕特徵包括排便次數減少、排便時用力、排出乾硬成形便、觸摸到直腸硬塊、腹脹等；每天至少三次鬆散液狀便是腹瀉的特徵。"},{"i":"b3-7","e":"","n":0,"c":6,"s":"下列何者為便祕的相關藥物因素？","o":["含鋁制酸劑、鴉片類藥物、鈣離子阻斷劑","維生素 C、益生菌、乳酸菌","抗生素（如 amoxicillin）、含鎂制酸劑、酒精","生理食鹽水、葡萄糖水、電解質補充液"],"a":"A","k":"A","t":"","x":"便祕相關藥物包括抗痙攣劑、抗血脂劑、過度使用軟便劑、碳酸鈣劑、含鋁制酸劑、鴉片類藥物、鐵劑、鎮靜劑、抗憂鬱劑、鈣離子阻斷劑等。"},{"i":"b3-8","e":"","n":0,"c":6,"s":"下列何者屬於護理診斷「便祕」相關因素中的『機械方面』？","o":["身體活動量不足或腹部肌肉無力","纖維攝取不足或水分攝取不足","憂鬱、情緒壓力或心智混亂","直腸脫垂、痔瘡或前列腺肥大"],"a":"D","k":"D","t":"","x":"便祕相關因素之機械方面包括直腸膿瘍或潰瘍、懷孕、直腸肛門瘻管、腫瘤、巨結腸症、電解質不平衡、直腸脫垂、前列腺肥大、神經損傷、直腸肛門狹窄、直腸膨出、手術後阻塞、痔瘡、肥胖；憂鬱、情緒壓力、心智混亂屬心理方面，身體活動量不足、腹部肌肉無力屬功能方面，纖維與水分攝取不足屬生理方面。"},{"i":"b3-9","e":"","n":0,"c":6,"s":"老年人發生便祕時，可能出現下列何種其他特徵？","o":["心智狀態改變、尿失禁、無法解釋的跌倒、體溫升高","視力模糊、聽力減退、味覺遲鈍、皮膚乾燥發癢","血壓下降、心跳減慢、呼吸速率下降、體溫下降","食慾增加、體重上升、活動量增加、睡眠時間變長"],"a":"A","k":"A","t":"","x":"便祕的定義性特徵中，老年人可出現其他特徵，如心智狀態改變、尿失禁、無法解釋的跌倒、體溫升高。"},{"i":"b3-10","e":"","n":0,"c":6,"s":"下列何者是護理診斷「感受性便祕」的相關因素？","o":["腹部肌肉無力、活動量不足","文化或家庭的健康信念","長期使用鴉片類藥物","纖維及水分攝取不足"],"a":"B","k":"B","t":"","x":"感受性便祕（自我診斷為便祕，且濫用瀉劑、灌腸和栓劑）的相關因素為思考過程障礙、評估錯誤、文化或家庭的健康信念；腹部肌肉無力、活動量不足、纖維及水分攝取不足、鴉片類藥物均屬「便祕」而非「感受性便祕」的相關因素。"},{"i":"b3-11","e":"","n":0,"c":6,"s":"下列何者屬於護理診斷「腹瀉」的相關因素？","o":["直腸脫垂或前列腺肥大","腹部肌肉無力或活動量不足","管灌食或放射性照射","纖維攝取不足或水分攝取不足"],"a":"C","k":"C","t":"","x":"腹瀉相關因素：心理方面（高壓力狀態和焦慮）、生理方面（炎症反應、吸收不良、傳染的過程、易受刺激、寄生蟲）、情境方面（酒精濫用、毒素、濫用瀉藥、放射性照射、管灌食、藥物的副作用、污染物、旅遊）；直腸脫垂、前列腺肥大、腹部肌肉無力、活動量不足、纖維與水分攝取不足屬便祕的相關因素。"},{"i":"b3-12","e":"","n":0,"c":6,"s":"下列何者是護理診斷「排便失禁」的定義性特徵？","o":["無法注意到排便的衝動，且肛門周圍皮膚發紅","腹脹，且糞便量減少、排出乾硬的成形便","排便時需用力，且糞便含鮮血、排便時疼痛","腸痙攣，且每天至少解出三次鬆散、液狀的糞便"],"a":"A","k":"A","t":"","x":"排便失禁定義性特徵：持續排出軟便、糞便的臭味、無能力延緩排便、排便急促、無法感受到直腸脹滿感、糞便沾污衣服或床墊、無法注意到或無法確認排便的衝動、肛門周圍皮膚發紅等；排便時用力、糞便含鮮血、排便時疼痛、腹脹、糞便量減少、排出乾硬成形便屬便祕特徵；腸痙攣與每天至少三次鬆散液狀便屬腹瀉特徵。"},{"i":"b3-13","e":"","n":0,"c":6,"s":"下列何者是腹瀉的定義性特徵？","o":["糞便沾污衣服或床墊，且無法感知直腸脹滿與排便衝動","腸蠕動音減弱、糞便量減少，且排出乾硬成形的糞便","每週排便少於三次，伴隨排便用力及腹部叩診呈濁音","每天至少解出三次鬆散、液狀的糞便，並有腸蠕動音增快"],"a":"D","k":"D","t":"","x":"腹瀉特徵
