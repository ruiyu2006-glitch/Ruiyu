<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基護模擬考</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1f2933;--sub:#616e7c;--line:#e4e7eb;--pri:#2f6fb0;--pri-soft:#e8f0f9;--ok:#1f8a5b;--ok-soft:#e3f4ec;--bad:#c2410c;--bad-soft:#fdeee6}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2129;--ink:#e4e7eb;--sub:#9aa5b1;--line:#2c3440;--pri:#6aa7e8;--pri-soft:#1e2c3d;--ok:#4cc38a;--ok-soft:#173226;--bad:#f0855a;--bad-soft:#3a2219}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.bar h1{font-size:17px;margin:0;flex:1}
nav{max-width:820px;margin:auto;display:flex;gap:4px;padding:0 12px 8px}
nav button{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;padding:5px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.list .item{border-top:1px solid var(--line);padding:12px 0}.list .item:first-child{border-top:0}
details summary{cursor:pointer;color:var(--pri);font-size:14px;margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:28px 0}
.chips .chip.sm{font-size:12px;padding:3px 10px}
main{max-width:820px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
h2{font-size:18px;margin:2px 0 6px}
.muted{color:var(--sub);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;border-radius:9px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip small{opacity:.75;margin-left:4px}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input[type=number]{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:90px}
.tag{display:inline-block;font-size:12px;color:var(--pri);border:1px solid var(--pri);border-radius:5px;padding:0 6px;margin-right:6px;white-space:nowrap}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stem{font-size:16px;margin:4px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt b{color:var(--sub);font-weight:600;min-width:22px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.ex{border-left:3px solid var(--pri);background:var(--pri-soft);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:6px;font-size:14.5px}
.res{font-weight:700;margin-bottom:4px}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.nav2{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri);font-size:16px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.dots button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;cursor:pointer}
.dots button.done{background:var(--pri-soft);border-color:var(--pri)}
.dots button.cur{outline:2px solid var(--pri)}
.dots button.ok{background:var(--ok-soft);border-color:var(--ok)}
.dots button.bad{background:var(--bad-soft);border-color:var(--bad)}
.big{font-size:44px;font-weight:700;color:var(--pri);line-height:1.2}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:500;font-size:13px}
.r{text-align:right}
</style>
</head>
<body>
<header><div class="bar"><h1>基護模擬考</h1><span id="hd"></span></div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const DATA={"ch":["緒論與醫療環境","生命徵象","冷熱療法","感染控制","觀察與溝通","舒適、更衣、PP care","排泄","給藥法"],"q":[{"i":"115-2|1","e":"115-2","n":1,"c":0,"s":"當醫院火災發生時，醫護人員遵循RACE原則進行救援，其中E是指？","o":["評估（evaluate）：評估火災嚴重性，判斷是否需尋求進一步的幫助","緊急出口（emergency exit）：指引所有人員迅速前往緊急出口疏散","滅火（extinguish）：依據火災種類，使用適當的滅火設備撲滅火源","調查（explore）：調查引發起火的位置、原因，同時通報消防人員"],"a":"C","k":"C","t":"","x":"RACE原則中的E是滅火（Extinguish），依火災種類使用適當的滅火設備撲滅火源，若無法撲滅則進行疏散（Evacuate）。R是救援（Rescue）、A是通報（Alarm）、C是侷限火勢（Contain）；評估、緊急出口、調查都不是E的意義。"},{"i":"115-1|31","e":"115-1","n":31,"c":0,"s":"協助病人移位時，為能省時省力及避免護理人員受到傷害，下列何者最不適當？","o":["搬運病人時，雙腳分開站立、髖部與膝關節微彎","移動病人時，護理人員應面對將移動的部位","儘量不要使用腰背部肌肉施力","身體重心應遠離病人，以防跌倒"],"a":"D","k":"D","t":"","x":"依身體力學原則，護理人員應靠近病人，使身體重心接近被移動的物體，以縮短力臂、省力並維持平衡；重心遠離病人會增加腰背負荷而受傷，故D最不適當。雙腳分開以擴大支持底面、髖膝微彎、面向移動方向、以大肌肉而非腰背肌施力，都是正確做法。"},{"i":"114-1|3","e":"114-1","n":3,"c":0,"s":"手術縫合針使用後以容器收集，應使用下列何種醫療廢棄物處置方式處理？","o":["福馬林消毒","冰凍處理後掩埋","滅菌後粉碎","紫外線消毒"],"a":"C","k":"C","t":"","x":"手術縫合針屬感染性廢棄物中的廢尖銳器具，使用後置入防穿刺容器，以滅菌後粉碎（或焚化）方式處理，避免針扎與病原散播。福馬林、紫外線僅屬消毒層級，且無法破壞尖銳物的危險性；冰凍後掩埋並非尖銳器具的處理方式。"},{"i":"114-1|22","e":"114-1","n":22,"c":0,"s":"下列何種設備，能有效協助呼吸困難的病人維持舒適姿勢？","o":["床上護架","床上桌","氣墊床","蛋型床墊"],"a":"B","k":"B","t":"","x":"床上桌可讓呼吸困難的病人坐在床上時向前伏趴休息，橫膈下降、胸廓較易擴張，呼吸較舒適。床上護架用於撐起蓋被，避免壓迫肢體；氣墊床與蛋型床墊主要用於分散身體壓力、預防壓力性損傷。"},{"i":"113-2|4","e":"113-2","n":4,"c":0,"s":"醫院出現火災時，緊急應變守則可遵循RACE原則，下列措施何者錯誤？","o":["將病人撤離疏散","通報以及啟動警報器","關閉氧氣與電器設備並打開門窗","油類及電氣火災，可先使用乾粉滅火器滅火"],"a":"C","k":"C","t":"","x":"RACE原則為救援（Rescue）、警報（Alarm）、侷限（Confine）、滅火或疏散（Extinguish/Evacuate）。侷限火勢時應關閉門窗以阻隔空氣與煙霧擴散，打開門窗會助長火勢，故C錯誤；撤離病人、通報警報及以乾粉滅火器撲滅油類或電氣火災皆正確。"},{"i":"113-1|3","e":"113-1","n":3,"c":0,"s":"護理人員在執行任何護理活動時，應以病人安全為首要考量，下列敘述何者正確？","o":["給藥錯誤屬於物理性傷害","跌倒屬於化學性傷害","照護老年人或使用鎮定劑的病人應給與約束","感覺功能障礙者須注意用熱導致的溫度傷害"],"a":"D","k":"D","t":"","x":"感覺功能障礙者（如半身麻痺、糖尿病周邊神經病變）對溫度感受遲鈍，使用冷熱時易發生燙傷或凍傷，應特別注意溫度傷害。給藥錯誤屬化學性傷害；跌倒屬物理（機械）性傷害；約束需有醫囑並依病人狀況評估，不可對老年人或使用鎮靜劑者一律約束。"},{"i":"113-1|23","e":"113-1","n":23,"c":0,"s":"約束病人的注意事項，下列何者錯誤？","o":["手腕先以棉墊保護再綁上約束帶","屬護理的獨立性功能","約束帶以平結固定在床架上","每15～30分鐘觀察病人末梢循環"],"a":"B","k":"B","t":"","x":"使用約束須有醫囑，屬依醫囑執行的非獨立性護理功能，護理人員不可自行決定約束，故B錯誤。約束時手腕應先以棉墊保護，約束帶以不易滑脫的方式固定在床架上（不可綁在床欄），並每15～30分鐘觀察末梢循環。"},{"i":"112-3|20","e":"112-3","n":20,"c":0,"s":"護理人員協助病人翻身時的身體力學，下列敘述何者錯誤？","o":["使用手臂肌肉比手腕肌肉較容易感到疲勞","護理人員應保持脊椎平直","使病人越靠近護理人員的身體越省力","調整床的高度與護理人員腰部同高"],"a":"A","k":"A","t":"","x":"身體力學原則是使用大肌肉群工作較不易疲勞，手臂肌肉比手腕肌肉大，應較不易疲勞，故A錯誤。協助翻身時應保持脊椎平直、讓病人靠近自己的身體重心以省力，並將床調至約與腰部同高，避免彎腰。"},{"i":"112-3|30","e":"112-3","n":30,"c":0,"s":"使用約束法之目的為何？","o":["促進病人體力之恢復","增強肌力及促進血液循環","預防意識不清病人因拉扯動作傷害自己","因為病人不合作而給予的處罰"],"a":"C","k":"C","t":"","x":"約束的目的在保護病人安全，例如防止意識不清或躁動病人跌落床下、拉扯管路而傷害自己，且需有醫囑。約束無法促進體力恢復或增強肌力，長時間約束反而影響血液循環；約束絕不可作為對不合作病人的處罰。"},{"i":"112-2|64","e":"112-2","n":64,"c":0,"s":"有關不可燃生物醫療感染性廢棄物貯存容器之顏色，下列何者正確？","o":["紅色","黃色","白色","黑色"],"a":"B","k":"B","t":"","x":"依醫療廢棄物分類，生物醫療廢棄物中的感染性廢棄物，可燃者使用紅色容器（袋），不可燃者使用黃色容器。白色或一般顏色容器用於一般事業廢棄物，黑色袋多用於一般垃圾，均不適用於感染性廢棄物。"},{"i":"112-1|6","e":"112-1","n":6,"c":0,"s":"有關舒適醫療環境之敘述，下列何者錯誤？","o":["護理人員撰寫護理紀錄時，光源應來自於其非慣用手後上方為宜","支氣管炎病人之病房溼度以80%為宜","病房溼度太低時，建議病人在皮膚上塗抹乳液","眼科手術後病人室內光線應調整為明亮"],"a":"D","k":"D","t":"","x":"眼科手術後病人眼睛怕光，室內光線宜稍暗，故D錯誤。書寫時光源應來自非慣用手的後上方以免陰影；支氣管炎等呼吸道疾病病人的病房濕度以80%為宜；濕度太低皮膚易乾燥，可建議塗抹乳液。"},{"i":"112-1|33","e":"112-1","n":33,"c":0,"s":"護理人員協助病人翻身時的姿勢，下列何者最不適宜？","o":["雙腳分開以增加底面積","彎曲膝關節以降低重心","多用舉高的方式來移動病人","可用拉動或滑動的方式較省力"],"a":"C","k":"C","t":"","x":"移動或翻身病人時應盡量利用拉動或滑動的方式，並以自身體重對抗病人重量，以節省力氣；舉高的方式較費力且易造成背部受傷，故C最不適宜。雙腳分開可增加底面積；彎曲膝關節可降低重心，皆屬正確的身體力學。"},{"i":"111-2|7","e":"111-2","n":7,"c":0,"s":"當某病房出現火災時，以R.A.C.E.原則處理，有關其口訣與意義的敘述，下列何者錯誤？","o":["R：將病人移出火源區","A：啟動警報裝置及通報","C：關上房門，侷限火煙於一處","E：立即撤離著火房間再進行初期滅火"],"a":"D","k":"D","t":"","x":"RACE中E為滅火（Extinguish），即依火災種類使用適當滅火設備撲滅初期火勢，若無法撲滅才進行疏散，故D「立即撤離再滅火」錯誤。R為救援、撤離病人；A為啟動警報及通報；C為關閉門窗以侷限火煙。"},{"i":"111-2|64","e":"111-2","n":64,"c":0,"s":"有關以熱處理之可燃性生物醫療感染性廢棄物的貯存容器，下列何者正確？","o":["紅色容器（垃圾袋）","黃色容器（垃圾袋）","白色容器（垃圾袋）","黑色容器（垃圾袋）"],"a":"A","k":"A","t":"","x":"生物醫療廢棄物中，以熱處理（焚化）的可燃性感染性廢棄物應置於紅色容器或垃圾袋；以滅菌處理的感染性廢棄物則用黃色容器，故選A。白色或透明袋多用於一般廢棄物或資源回收，黑色袋為一般事業廢棄物。"},{"i":"111-1|3","e":"111-1","n":3,"c":0,"s":"護理師舖床協助病人執行移位時，下列原則何者正確？","o":["儘量使用「滑動」的方式移動病人，以節省體力","儘可能使用小肌肉，如：背肌比臀肌佳，減少肌肉疲勞","站立時，應縮小底面積，以減少身體移動範圍","以彎曲腰部的方式，調整工作高度，以降低重心"],"a":"A","k":"A","t":"","x":"移動病人時應盡量以拉與滑動的方式，並利用自身體重對抗病人重量，以節省體力、避免扭傷，故A正確。應使用大肌肉（如臀肌、腹肌）而非背肌；站立時兩腳分開加大底面積以增加穩定；調整工作高度應彎曲膝關節而非彎腰。"},{"i":"110-2|14","e":"110-2","n":14,"c":0,"s":"關於醫院火災種類和適用的滅火器，下列敘述何者錯誤？","o":["配電盤系統引發火災適用二氧化碳滅火器滅火","實驗室鎂離子引發火災適用乾粉滅火器滅火","裝潢時油漆引發火災適用泡沫滅火器滅火","燃紙引發火災適用二氧化碳滅火器滅火"],"a":"D","k":"D","t":"","x":"紙張、木材等一般可燃物引起的火災屬A類火災，適用水、泡沫或乾粉滅火器；二氧化碳滅火器主要適用於電器（C類）及油類火災，對一般固體可燃物效果差，故D錯誤。電器火災可用二氧化碳；油漆屬可燃液體可用泡沫；金屬火災須用特殊乾粉。"},{"i":"110-2|15","e":"110-2","n":15,"c":0,"s":"有關輻射防護之敘述，下列何者正確？","o":["曝露時間越長對人體傷害越大，故照顧病人宜採取短時間多次的方式","放射線強度與距離的平方呈正比，故越接近輻射線所受到的輻射線傷害越大","操作人員須隨時戴上感光片，並定期追蹤所接受輻射量之多寡","輻射線α、β、γ當中，以α射線穿透力最強，對人體危害的嚴重程度最強"],"a":"C","k":"C","t":"","x":"操作放射線的人員應隨時配戴輻射劑量計（感光片），定期追蹤累積的輻射暴露量，故C正確。照顧病人應縮短暴露時間並集中護理活動；輻射強度與距離平方成反比；α射線穿透力最弱，γ射線穿透力最強。"},{"i":"110-2|17","e":"110-2","n":17,"c":0,"s":"手術室最適宜的室溫以及相對濕度之範圍，下列何者正確？","o":["15～20℃，30～50%","15～20℃，50～70%","20～27℃，30～50%","20～27℃，50～70%"],"a":"D","k":"D","t":"","x":"手術室、產房、加護病房等單位應維持室溫約20～28℃；手術室濕度宜調高至約50～80%，以防空氣過乾產生靜電火花。選項中以20～27℃、50～70%最符合，故選D；30～50%的濕度對手術室而言過低。"},{"i":"110-1|1","e":"110-1","n":1,"c":0,"s":"有關預防病人跌倒之敘述，下列何者正確？","o":["應固定床高，不宜調整床面高低","床欄固定拉起，不宜調整床欄起落","有定向障礙病人，病室不宜太靠近護理站","浴廁與樓梯是醫院中病人跌倒常發生的地點"],"a":"D","k":"D","t":"","x":"醫院中最常發生跌倒的地點為輪椅、床邊及浴廁與樓梯，故D正確。不做治療時病床應降至病人坐於床緣雙腳可著地的高度；床欄應依病人狀況使用並適時調整；定向障礙等易跌倒病人宜安置於靠近護理站的病室，以利觀察。"},{"i":"110-1|6","e":"110-1","n":6,"c":0,"s":"提供左側下肢乏力但意識清楚之老人安全環境，下列敘述何者正確？","o":["為方便上下床，不要拉起右側床欄","夜間仍須打開照明設備","浴室進出口應放置小地毯以防濕滑","助行器應置放左側床尾"],"a":"B","k":"B","t":"","x":"預防跌倒需有良好照明，夜間亦應有足夠光線，使病人醒來時能看清四周環境，故B正確。左下肢乏力者兩側床欄皆應視需要拉起；浴室進出口放置小地毯易滑動絆倒；助行器應置於健側（右側）易取之處。"},{"i":"110-1|9","e":"110-1","n":9,"c":0,"s":"當醫療院所開始發生火災時，護理人員依RACE的原則進行臨場處置，其中A是指：","o":["關閉電器以侷限火源","啟動警報系統通知消防單位","將病人立即移開危險區","使用合宜滅火器滅火"],"a":"B","k":"B","t":"","x":"RACE中R為救援（Rescue）病人撤離，A為通報（Alarm），即啟動警報器並通知消防單位，C為侷限火勢（Contain），如關閉門窗、氧氣及電器，E為滅火（Extinguish）或疏散。故A指啟動警報系統。"},{"i":"110-1|77","e":"110-1","n":77,"c":0,"s":"醫院廢棄物分類中，下列何者為一般性醫療廢棄物？","o":["與針頭相連之注射筒及輸液導管","蓋玻片或破裂之玻璃器皿","致癌或可能致癌之細胞毒素","非有害藥用玻璃瓶或藥水容器"],"a":"D","k":"D","t":"","x":"醫療廢棄物依是否接觸病人血液或體液分類，非有害的藥用玻璃瓶或藥水容器屬一般性醫療廢棄物，故選D。與針頭相連的注射筒及輸液導管、蓋玻片或破裂玻璃器皿屬感染性（尖銳器具）廢棄物；細胞毒素則屬有害事業廢棄物。"},{"i":"109-2|12","e":"109-2","n":12,"c":0,"s":"沾到病人血液的傷口紗布，應依下列何種廢棄物規定處理？","o":["一般性可燃","感染性可燃","一般性不可燃","感染性不可燃"],"a":"B","k":"B","t":"","x":"沾到病人血液或體液的紗布、敷料已受污染，屬於感染性廢棄物，且紗布可燃燒處理，故應依感染性可燃廢棄物規定處理，以紅色容器或專用袋收集並標示。"},{"i":"109-2|13","e":"109-2","n":13,"c":0,"s":"醫療廢棄物之收集處理方式，下列何者錯誤？","o":["非有害藥用的ampule和vial瓶，需以白色透明塑膠袋收集","手術後手套、紗布、排泄用具，需以藍色透明塑膠袋收集","病人使用過後的胸腔引流瓶及引流管，棄置於標有感染性廢棄物之紅色容器","空針及針頭，棄置於標有感染性廢棄物之黃色安全容器"],"a":"B","k":"B","t":"","x":"手術後的手套、紗布、排泄用具接觸病人血液、體液或排泄物，屬感染性可燃廢棄物，應以紅色塑膠袋或容器收集，而非藍色透明袋。非有害藥用的安瓿、vial瓶可用透明袋收集；引流瓶與引流管置於紅色感染性容器；空針及針頭丟入黃色防穿刺安全容器。"},{"i":"109-2|35","e":"109-2","n":35,"c":0,"s":"護理師移動病人時，下列原則何者適當？①降低重心 ②利用大肌肉群 ③雙腳合併站立 ④保持脊柱彎曲","o":["①②","①③","②④","③④"],"a":"A","k":"A","t":"","x":"移動病人時應兩腳分開、加大底面積，彎曲膝蓋降低重心，並利用腹肌、臀肌等大肌肉群出力，以減少疲勞與受傷。雙腳合併站立會使支持面變小而不穩，脊柱應保持平直而非彎曲，故③④錯誤。"},{"i":"109-1|3","e":"109-1","n":3,"c":0,"s":"醫療院所為滿足病人安全的需求，下列措施何者正確？①定期舉辦火災防災演練 ②嚴格限制訪客 ③公共空間放置乾洗手液 ④利用條碼技術（barcode）給藥 ⑤地板定時清潔打蠟","o":["①②③","①③④","②③④","②④⑤"],"a":"B","k":"B","t":"","x":"定期舉辦火災防災演練、公共空間放置乾洗手液以利手部衛生、利用條碼技術給藥以確保用藥正確，皆可提升病人安全。嚴格限制訪客並非維護安全的必要措施；地板打蠟易使地面濕滑，反而增加跌倒風險。"},{"i":"109-1|16","e":"109-1","n":16,"c":0,"s":"下列檢查，何者不具有放射線性傷害？","o":["胃鏡檢查","腦部電腦斷層檢查","胸部X光攝影","全身核磁共振檢查"],"a":"A","k":"A","t":"","x":"X光攝影、電腦斷層（CT）以游離輻射成像，會有放射線傷害的潛在危險；胃鏡為內視鏡直接觀察，完全不使用放射線，故官方答案為A。核磁共振利用強磁場成像，同樣不屬游離輻射，此選項易有爭議，但胃鏡為最明確不具放射線傷害者。"},{"i":"109-1|18","e":"109-1","n":18,"c":0,"s":"服用下列藥物容易發生跌倒危險性，何者除外？","o":["利尿劑","降血壓劑","瀉劑","退燒劑"],"a":"D","k":"D","t":"","x":"容易跌倒的高危險群包括服用降血壓藥、降血糖藥、利尿劑、瀉劑、鎮靜劑、麻醉劑者，這些藥物可能造成姿位性低血壓、頭暈或頻繁如廁而增加跌倒風險。退燒劑一般不會直接增加跌倒危險。"},{"i":"109-1|72","e":"109-1","n":72,"c":0,"s":"醫院廢棄物分類中，下列何者非生物醫療廢棄物？","o":["注射針頭","手術縫合針","乾淨點滴瓶","木質壓舌板"],"a":"C","k":"C","t":"","x":"乾淨的點滴瓶未接觸病人血液或體液，屬一般事業廢棄物（可回收），而非生物醫療廢棄物。注射針頭與手術縫合針為感染性尖銳器具，木質壓舌板接觸過病人口腔分泌物，均屬生物醫療廢棄物。"},{"i":"108-2|15","e":"108-2","n":15,"c":0,"s":"教導家屬預防腦中風後左側肢體無力之老人跌倒之照護措施，下列何者錯誤？","o":["協助上下床時，需將床面升高到家屬的腰部","便盆椅不用時，勿置放於病床邊","採坐起、站立於床邊之漸進式下床活動","下床活動時應穿著防滑鞋子"],"a":"A","k":"A","t":"","x":"協助上下床時，病床高度應降至病人坐於床緣時雙腳可踩地，以防起身時前傾跌倒；升高到家屬腰部會使病人懸空，增加跌倒風險。便盆椅不用時應移開以保持通道暢通，下床應採坐起、站立再行走的漸進方式，並穿著防滑鞋。"},{"i":"108-2|16","e":"108-2","n":16,"c":0,"s":"針對不同醫療情境的合宜室溫之調節，下列敘述何者正確？","o":["嬰兒的體溫較高，故嬰兒室的室溫需較一般室溫為低","發燒病人體溫較高，故病房室溫需較一般室溫為低","燙傷病人皮膚受損易失溫，故燙傷病房室溫較一般室溫為高","病房內外環境溫差宜維持在1～3℃最為適宜"],"a":"B","k":"B","t":"","x":"發燒、燙傷或甲狀腺機能亢進的病人新陳代謝率增加，室溫宜比一般室溫低，以促進舒適。嬰幼兒體溫調節中樞未發育完全，老人調節功能退化，室溫需比一般稍高，故A錯；燙傷病房室溫應較一般為低，C錯。"},{"i":"108-1|6","e":"108-1","n":6,"c":0,"s":"有關預防住院老人走失的措施，下列何者最為適切？","o":["將病人的病室房門鎖上","依醫囑給予抗焦慮劑","提供聽覺及視覺刺激","將病人安排距護理站最近的病房"],"a":"D","k":"D","t":"","x":"容易發生走失、定向感障礙等病安事件的病人，應安置於靠近護理站的病房，以利醫護人員隨時觀察、加強巡視。將房門上鎖會妨礙緊急逃生且侵犯病人權益；抗焦慮劑須有適應症，不應作為預防走失的方法。"},{"i":"107-2|73","e":"107-2","n":73,"c":0,"s":"有關醫療廢棄物的敘述，下列何者錯誤？","o":["分為一般性廢棄物及感染性廢棄物","無污染性的醫療用品，應儘量使用一次性產品","避免不必要的廢棄物儲存，以降低環境污染","應遵守與廢棄物包裝、標示及儲存有關之規定"],"a":"B","k":"B","t":"","x":"醫療廢棄物應依規定分類、包裝、標示與儲存，並避免不必要的儲存以降低環境污染。無污染性的醫療用品若可重複使用，應減少使用一次性產品，以降低廢棄物產量，故B錯誤。"},{"i":"107-1|45","e":"107-1","n":45,"c":0,"s":"協助病人翻身時，病人床的高度在護理師之何處最適當？","o":["腰部","薦椎","大腿","膝關節"],"a":"A","k":"A","t":"","x":"協助病人翻身或執行床上照護時，應調整病床高度至護理師腰部高度，使護理師能保持脊柱平直、利用大肌肉施力，避免彎腰造成背部拉傷，故選(A)。病床過低需彎腰，過高則需聳肩，都不符合身體力學原則。"},{"i":"106-2|4","e":"106-2","n":4,"c":0,"s":"當病房確定發生火災且濃煙密布時，第一時間所採取的處置，下列何者正確？","o":["關掉氧氣及電器的開關","進行病人疏散","打開門窗排除濃煙","拿起滅火器撲滅火源"],"a":"B","k":"B","t":"","x":"火災應變遵循RACE原則，但須依現場情勢判斷；病房已確定發生火災且濃煙密布時，首要是救援（Rescue），儘速疏散病人至安全區域，故選(B)。打開門窗會使空氣進入而助長火勢；關閉氧氣電器屬侷限火勢，濃煙密布時以滅火器撲滅已非第一優先。"},{"i":"106-2|37","e":"106-2","n":37,"c":0,"s":"有關醫療環境中機械性傷害之敘述，下列何者正確？","o":["婦女是高危險群","常發生在正中午時間","定向感障礙者宜安置在靠近護理站","臥床病人宜將床面升高避免跌倒"],"a":"C","k":"C","t":"","x":"跌倒是醫院最常見的機械性傷害，易發生跌倒或有定向感障礙的病人宜安置於靠近護理站的病房，以利隨時觀察、加強巡視，故選(C)。跌倒高危險群為65歲以上及5歲以下者，而非婦女；最常發生在晚上及清晨；不做治療時病床應降低。"},{"i":"106-1|6","e":"106-1","n":6,"c":0,"s":"林小姐因中風導致右側肢體偏癱，住院期間有關病人之安全，下列敘述何者錯誤？","o":["將常使用物品置於病人身體左側容易拿到之處","床面需要搖高避免病人自行下床","浴室內放置止滑墊及固定的洗澡椅","病人臥床時應隨時拉起床欄"],"a":"B","k":"B","t":"","x":"預防跌倒時，不做治療時病床應降低至病人坐於床緣時雙腳可著地的高度，搖高床面反而增加跌落傷害，故(B)錯誤。偏癱病人常用物品應置於健側（左側）易取處；浴室應有止滑墊及固定洗澡椅；臥床時拉起床欄。"},{"i":"106-1|32","e":"106-1","n":32,"c":0,"s":"護理師執行病人移位應注意的原則，下列何者正確？①降低重心 ②利用小肌肉群 ③雙腳分開站立，加大支持底面積 ④保持身體後傾","o":["①②","①③","②④","③④"],"a":"B","k":"B","t":"","x":"正確身體力學原則為兩腳分開加大支持底面積（③）、彎曲膝蓋降低重心（①），以增加穩定度，故選①③。應利用大肌肉群（如腹肌、臀肌）而非小肌肉，並面向工作方向、利用身體重量對抗病人重量，而非刻意保持身體後傾。"},{"i":"105-2|6","e":"105-2","n":6,"c":0,"s":"針對HBsAg及HBeAg均為陽性的病人，其廢棄物處理的方式，下列敘述何者正確？","o":["餐具屬於「可燃性非感染性」廢棄物","耳溫套屬於「不可燃性非感染性」廢棄物","紙尿褲屬於「可燃性感染性」廢棄物","鼻胃管引流裝置屬於「不可燃性感染性」廢棄物"],"a":"C","k":"C","t":"","x":"B型肝炎可經血液、體液傳染，病人使用過且沾有體液的紙尿褲屬感染性廢棄物，且可焚化，故為「可燃性感染性」廢棄物，選(C)。餐具非一次性廢棄物；耳溫套接觸病人分泌物屬感染性；鼻胃管引流裝置為塑膠製品，屬可燃性感染性廢棄物。"},{"i":"105-2|7","e":"105-2","n":7,"c":0,"s":"下列病人使用過的醫療廢棄物之處理方式，何者錯誤？","o":["化學治療後之靜脈點滴管，棄置於標有感染性廢棄物之紅色安全容器","空針及針頭，棄置於標有感染性廢棄物之黃色安全容器","胸腔引流瓶及引流管，棄置於標有感染性廢棄物之紅色塑膠袋","手術刀片及縫針，棄置於標有感染性廢棄物之黃色安全容器"],"a":"A","k":"A","t":"","x":"化學治療後之點滴管路殘留細胞毒性藥物，屬基因毒性（細胞毒性）廢棄物，須依規定使用專用容器並標示，不可當作一般感染性廢棄物丟棄，故(A)錯誤。空針、針頭、刀片、縫針等尖銳物應丟入黃色防穿刺容器；引流瓶及引流管屬感染性可燃廢棄物，置於紅色塑膠袋。"},{"i":"105-2|33","e":"105-2","n":33,"c":0,"s":"使用約束帶約束病人時應注意事項，下列何者正確？","o":["必須有醫囑才可以執行","以平結的方式綁在床欄干","約束時肢體應完全伸直","以手指無法伸入為原則"],"a":"A","k":"A","t":"","x":"約束屬保護措施，必須有醫囑才可執行，故選(A)。約束帶應以不易鬆脫的結（如雙套結）固定於床架而非床欄；肢體應維持功能性姿勢而非完全伸直；鬆緊度以可伸入一至兩指為原則。"},{"i":"105-1|3","e":"105-1","n":3,"c":0,"s":"尿液檢體收集後，應將用過的小兒集尿袋依下列那一種廢棄物規定處理？","o":["一般性可燃","一般性不可燃","感染性可燃","感染性不可燃"],"a":"C","k":"C","t":"","x":"醫療廢棄物依是否接觸病人血液或體液區分一般性與感染性；小兒集尿袋已接觸病人尿液，屬感染性廢棄物，且為塑膠材質可焚化，故歸為「感染性可燃」，置於紅色感染性垃圾袋。感染性不可燃多指針頭、玻璃等，應置於黃色防穿刺容器。"},{"i":"104-2|1","e":"104-2","n":1,"c":0,"s":"許奶奶89歲，不慎於浴室滑倒，致右股骨頸骨折，入院行人工髖關節置換手術，護理師為維護此個案之安全，下列敘述何者錯誤？","o":["許奶奶為高危險性跌倒個案，應予以約束並限制下床活動","隨時評估許奶奶翻身、活動及行走能力，適時給予協助","夜間病房走道應加強照明，保持乾燥","放低床的高度，並確實使用床欄"],"a":"A","k":"A","t":"","x":"許奶奶雖屬高危險跌倒個案，但約束需有醫囑且非首選，不應因此限制下床活動，應評估能力並協助漸進式活動，故A錯誤。隨時評估活動能力適時協助、夜間加強照明保持地面乾燥、放低床高並使用床欄，皆為預防跌倒措施。"},{"i":"104-2|5","e":"104-2","n":5,"c":0,"s":"提供舒適的病房環境，下列措施何者錯誤？","o":["青光眼手術後第2天，光線應稍暗","支氣管炎及氣喘病人濕度維持在80～90%","躁症且有攻擊行為病人布置適合藍、綠色系","燒燙傷病房室溫應較一般病房為低"],"a":"B","k":"B","t":"","x":"支氣管炎病人濕度宜較高（約80％），但氣喘病人濕度應比一般低（約10～20％），濕度過高易誘發發作，故B錯誤。眼科術後光線宜稍暗；藍、綠等冷色系具鎮靜效果；燒燙傷病人代謝率增加，室溫宜稍低。"},{"i":"104-2|47","e":"104-2","n":47,"c":0,"s":"護理人員為使搬動病人的過程更安全舒適，以減少身體疲勞及避免扭傷，有關身體力學原則之應用，下列何者錯誤？","o":["採雙腳分開、膝關節彎曲、降低身體重心的姿勢最佳","使用大肌肉比小肌肉較不易疲勞","當身體重心直線遠離支點時，維持平衡所需的力量便降低","保持脊柱的平直，藉助身體前傾、後傾或腳步的移動以完成拖與拉的動作"],"a":"C","k":"C","t":"","x":"重心線越接近支點（底面積中心）越穩定；重心遠離支點時，需要更大的力量才能維持平衡，故C錯誤。雙腳分開加大底面積、彎曲膝關節降低重心、使用大肌肉、保持脊柱平直並以身體前後傾及腳步移動完成拉與滑動，皆符合身體力學原則。"},{"i":"104-1|5","e":"104-1","n":5,"c":0,"s":"有關提供住院病人舒適醫療環境的敘述，下列何者正確？","o":["嬰幼兒及老年人室溫需要比一般人室溫稍低","氣喘病人環境中濕度應比一般人濕度高","限制訪客人數及時間可以維持病室安寧","接受眼科手術病人室內光線宜明亮"],"a":"C","k":"C","t":"","x":"限制訪客人數及時間可減少噪音，維持病室安寧。嬰幼兒及老年人體溫調節功能較差，室溫需比一般稍高；氣喘病人濕度應比一般低（約10～20％），濕度過高易誘發發作；眼科手術病人室內光線宜稍暗。"},{"i":"103-2|3","e":"103-2","n":3,"c":0,"s":"有關留有病人體液污漬的玻璃引流瓶，其處置方式之敘述，何者正確？①屬於感染性可燃廢棄物 ②屬於感染性不可燃廢棄物 ③應置於黃色容器密封儲存 ④應置於紅色容器密封儲存","o":["①③","①④","②③","②④"],"a":"C","k":"C","t":"","x":"沾有病人血液、體液的物品屬感染性廢棄物，玻璃無法焚燒，故為感染性不可燃廢棄物，應置於黃色容器密封儲存，選②③。紅色容器用於感染性可燃廢棄物，如沾血的棉球、紗布。"},{"i":"103-1|1","e":"103-1","n":1,"c":0,"s":"有關維持安全醫療環境之敘述，下列何者正確？","o":["拔除病人注射後的空針都必須回套","使用後的尿袋可丟入廁所內的普通垃圾袋","感染性可燃廢棄物的容器是黃色的","醫療廢棄物專用容器或垃圾桶八分滿即應綑紮或移除"],"a":"D","k":"D","t":"","x":"醫療廢棄物專用容器（如針頭回收筒）或垃圾桶八分滿即應綑紮或移除，以免溢出或針扎。使用後的針頭不可回套以防針扎；使用過的尿袋沾有病人體液，屬感染性廢棄物；感染性可燃廢棄物容器為紅色，黃色為感染性不可燃。"},{"i":"103-1|3","e":"103-1","n":3,"c":0,"s":"（情境：當你照護一位10歲腦膜炎昏迷的王小弟時，發現家屬於病床下地面擺出一套攤開成人形的衣物，影響清潔人員打掃工作。）王小弟臥床多日，護理師為了防範病人發生皮膚褥瘡，下列敘述何者錯誤？","o":["橡皮中單上應加鋪布中單，以維持皮膚乾燥與舒適","足部上的蓋單被宜壓緊，以保持肢體的固定","墊單需要鋪得平整與緊固，以免造成身體皮膚受壓","鋪床後應將床鋪固定於適當高度，並將床輪予以固定"],"a":"B","k":"B","t":"","x":"依鋪床原則，蓋單被的足部宜寬鬆，以免蓋被過緊壓迫足部造成垂足或受壓，故B錯誤。墊單需鋪得平整緊固以免皮膚受壓，橡皮中單上加鋪布中單可維持乾燥舒適，鋪床後應將床鋪搖低並固定床輪。"},{"i":"102-2|39","e":"102-2","n":39,"c":0,"s":"血液檢體收集後，應將用過的棉籤依下列那一種廢棄物規定處理？","o":["感染性可燃","感染性不可燃","一般性可燃","一般性不可燃"],"a":"A","k":"A","t":"","x":"醫療廢棄物依是否接觸病人血液或體液分類，採血後沾有血液的棉籤屬感染性廢棄物，且為可燃物，故依感染性可燃廢棄物處理（紅色容器）。一般性廢棄物則指未受血液、體液汙染者。"},{"i":"102-2|42","e":"102-2","n":42,"c":0,"s":"護理師協助右手注射點滴的患者，由輪椅轉位至床上的方法，下列何者正確？","o":["輪椅椅背與床尾呈90度角","協助患者站起轉向床時，宜應用腿部及臀部肌肉","協助患者從輪椅站起時，護理師將離患者遠側之膝蓋放置於患者兩腳之間","床宜調整至患者腰至胸部的高度"],"a":"B","k":"B","t":"","x":"依身體力學原則，應利用腿部、臀部等大肌肉出力，彎膝而不彎腰，較省力且不易受傷，故B正確。輪椅應與床呈約45度角；護理師應將靠近病人側的膝蓋抵住病人膝部以防滑倒；床宜調低至病人坐於床緣時雙腳可著地的高度。"},{"i":"102-1|56","e":"102-1","n":56,"c":0,"s":"當病人新入院時，護理師應提供何種措施，以提高病人在醫療環境中的安全？①示範床輪與床欄的使用 ②拉上床簾保護隱私 ③給藥進行三讀五對 ④提供陪病證 ⑤請假規則說明","o":["①②","①③","②④","③⑤"],"a":"B","k":"B","t":"","x":"新入院時說明並示範床輪與床欄的使用，可協助病人熟悉環境、預防跌倒（①）；給藥時確實執行三讀五對，可避免給錯藥物造成化學性傷害（③），兩者皆是提升病人安全的措施。拉上床簾是保護隱私，提供陪病證與請假規則說明則屬於入院常規介紹，與安全較無直接關係。"},{"i":"101-2|80","e":"101-2","n":80,"c":0,"s":"護理師發現病患因無家屬在旁協助，下床時不慎跌倒，護理師應立即執行下列那項措施？","o":["評估病患意識、受傷情形，並拉紅燈求救","把藥局送來的正確藥物給病患服用","回護理站找其他工作人員來幫忙","到病室外找尋病患家屬來幫忙"],"a":"A","k":"A","t":"","x":"病人跌倒時，護理師應立即評估病人的意識狀態與受傷情形，並拉紅燈（呼叫鈴）求救，不可離開病人去找人幫忙，以免延誤處理或使病人再次受傷。給病人服藥與跌倒的緊急處置無關。"},{"i":"101-1|53","e":"101-1","n":53,"c":0,"s":"有關護理師應用身體力學原理以協助病患移動之敘述，下列何者正確？","o":["縮小底面積、增加重心可增加姿勢的平衡及穩定度","使身體重心離病患或物品愈近愈省力","增加移動的病患與接觸面的摩擦力及剪力","增加抗重力動作的使用"],"a":"B","k":"B","t":"","x":"依身體力學原則，移動病人或物品時應使身體重心盡量靠近病人或物品，以減少力矩、節省力氣並避免肌肉拉傷。應加大底面積、降低重心以增加穩定度；移動時應減少與接觸面的摩擦力及剪力，盡量使用拉與滑動的方式，並減少抗重力的動作。"},{"i":"100-1|21","e":"100-1","n":21,"c":0,"s":"當醫院出現火災時，有關護理師在疏散病患的處置，下列敘述何者錯誤？","o":["啟動火災警報器，安撫病患不要慌張","指示能行走的病患趕緊搭電梯離開","教導病患將毛巾沾濕覆蓋口鼻呼吸","利用床單拖拉法來搬運長期臥床病患"],"a":"B","k":"B","t":"","x":"火災發生時，能自行走動的病人應遵循安全疏散路線迅速離開火場，不可搭乘電梯，以免停電受困或電梯井成為煙囪，故(B)錯誤。啟動警報器並安撫病人、以濕毛巾掩住口鼻、以床單拖拉法搬運臥床病人，皆為正確處置。"},{"i":"100-1|29","e":"100-1","n":29,"c":0,"s":"在協助病患翻身時，護理師為調整身體高度，宜彎曲那些部位？①肩關節 ②腰椎關節 ③髖關節 ④膝關節","o":["②④","③④","①②","①③"],"a":"B","k":"B","t":"","x":"依身體力學原則，護理師調整工作高度時應彎曲髖關節與膝關節（③④），保持脊柱平直，以大肌肉出力，減少背部肌肉拉傷。彎曲腰椎（彎腰）容易造成下背部受傷，彎曲肩關節則無法有效調整身體高度。"},{"i":"100-1|80","e":"100-1","n":80,"c":0,"s":"給藥時誤將給A床靜脈注射的抗生素藥物給B床。此時的立即處置下列何者正確？","o":["觀察病患有無合併症再決定","鼓勵病患多喝開水，以減輕毒性","立刻告知相關人員並觀察病患情況","請病患有不舒服立刻告知"],"a":"C","k":"C","t":"","x":"發生給藥錯誤時，應立即告知相關人員（醫師、護理長等），並密切觀察病人有無不良反應，以便及早處理。不可先觀察等出現合併症才決定，也不能僅靠多喝水或等病人主訴不適才處理，以免延誤處置。"},{"i":"115-2|23","e":"115-2","n":23,"c":1,"s":"護理師協助意識昏迷且已臥床三個月的 80 歲病人測量體溫時，下列關於體溫測量技術與結果判讀，何者正確？","o":["測量前應先評估病人30分鐘前有無運動、吸菸影響體溫測量的行為","腋溫測量法是此病人最適當測量的方式","若耳溫測量結果為35.8℃，應準備病人急救","若懷疑體溫測量結果，同時間重複測量應採用最高的溫度數據"],"a":"D","k":"D","t":"","x":"對測量結果有疑慮時應重新測量，宜採用較高的讀值，以免漏掉發燒。意識昏迷、臥床三個月的病人不會運動或吸菸，不需要評估（A錯）；年長消瘦者腋窩不易密合，腋溫並非最適當（B錯）；老年人體溫偏低，耳溫35.8℃仍屬可接受範圍，不需準備急救（C錯）。"},{"i":"115-2|24","e":"115-2","n":24,"c":1,"s":"有關測量頸動脈搏動的敘述，下列何者正確？","o":["同時按壓兩側頸動脈","適用於休克病人","沿著胸鎖乳突肌下緣觸摸","姿勢採側臥姿測量"],"a":"B","k":"B","t":"","x":"休克病人周邊血管收縮，橈動脈不易觸得，可改測頸動脈。不可同時按壓兩側頸動脈，以免腦部缺血或反射性心搏過慢；應沿胸鎖乳突肌前緣觸摸；測量時採仰臥並抬高床頭30～45度。"},{"i":"115-2|25","e":"115-2","n":25,"c":1,"s":"影響病人血壓下降的因素，下列何者正確？①年長者②過敏性休克③飲用紅酒④服用類固醇","o":["①②","①④","②③","③④"],"a":"C","k":"C","t":"","x":"過敏性休克時血管擴張、通透性增加，使血壓下降；酒精會使周邊血管擴張，血壓下降（②③）。年長者血管彈性變差，血壓通常上升；類固醇會使血管收縮並造成水鈉滯留，使血壓上升。"},{"i":"115-2|26","e":"115-2","n":26,"c":1,"s":"病人骨折住院，無慢性病，今早護理人員測得耳溫 38.5℃，脈搏 90 次／分，呼吸 26 次／分，血壓為110／64 mmHg，血氧濃度（SpO2）為89%，其異常的數值有下列何者？①體溫②脈搏③呼吸④血壓⑤血氧濃度","o":["①②④","①③⑤","②③⑤","③④⑤"],"a":"B","k":"B","t":"","x":"耳溫38.5℃已屬發燒；成人呼吸26次/分高於正常的12～20次/分；SpO2 89%低於正常（約95%以上），故異常的是①③⑤。脈搏90次/分在60～100次/分的正常範圍內；血壓110/64 mmHg也屬正常。"},{"i":"115-1|24","e":"115-1","n":24,"c":1,"s":"病人接受心導管檢查後，下列何處是評估下肢血液循環的最佳部位？","o":["膝膕動脈","股動脈","足背動脈","脛後動脈"],"a":"C","k":"C","t":"","x":"心導管多由股動脈穿刺，術後應評估穿刺側肢體遠端的循環，足背動脈位於下肢最遠端，最能反映末梢血液循環。股動脈是穿刺與加壓止血的部位，不宜按壓觸摸；膝膕動脈位置較深，不易觸得。"},{"i":"115-1|25","e":"115-1","n":25,"c":1,"s":"關於發燒的類型，下列敘述何者錯誤？","o":["一段時間體溫反覆發燒又回復正常，常見於術後傷口感染","高熱期和退熱期交替出現，常見於肺結核","體溫24小時的波動相差2℃以上，常見於傷寒","24小時的體溫波動範圍，相差不超過1℃，常見於大葉性肺炎"],"a":"B","k":"B","t":"","x":"高熱期與無熱期交替出現屬間歇熱，常見於瘧疾、敗血症、淋巴瘤；肺結核多為弛張熱，故B錯誤。反覆發燒又恢復正常為回歸熱，見於術後傷口感染；24小時波動相差2℃以上為弛張熱，見於傷寒；波動不超過1℃為稽留熱，見於大葉性肺炎。"},{"i":"115-1|26","e":"115-1","n":26,"c":1,"s":"病人雙側手臂因骨折以石膏固定，有關血壓測量的敘述，下列何者正確？","o":["雖然打上石膏，仍可以測量橈動脈血壓","欲測量膝膕動脈時，壓脈帶氣囊應置於大腿中段前側","一般測得的膝膕動脈收縮壓數值較肱動脈數值為低","病人採俯臥姿勢，進行膝膕動脈血壓的測量"],"a":"D","k":"D","t":"","x":"雙上肢無法測量時，改測下肢膝膕動脈血壓，病人採俯臥姿，壓脈帶氣囊置於大腿下1/3的後側，聽診器放在膝膕窩。上石膏的手臂不可測量血壓；膝膕動脈收縮壓通常比肱動脈高約10～40 mmHg。"},{"i":"114-3|23","e":"114-3","n":23,"c":1,"s":"護理師測量一位80歲病人的耳溫結果顯示為37.9℃，下列關於體溫測量何者最適當？","o":["老年人的耳溫在體溫測量部位中溫度最低","老年人耳溫容易受到外在環境溫度的影響","老年人耳溫較其他年齡層為高","測量數值為老年人耳溫的正常範圍"],"a":"B","k":"B","t":"","x":"老年人體溫調節功能及對溫度變化的敏感性變差，耳溫容易受外在環境溫度影響。各測量部位中腋溫最低，不是耳溫；老年人新陳代謝率低，體溫通常比其他年齡層低；37.9℃對老年人而言已高於正常，應視為發燒。"},{"i":"114-3|25","e":"114-3","n":25,"c":1,"s":"下列何種病人會出現喟嘆式呼吸（sighing respiration）？","o":["臨終階段的病人","氣喘的國小學童","顱內壓＞15 mmHg的病人","糖尿病酮酸中毒的病人"],"a":"A","k":"A","t":"","x":"喟嘆式（嘆息式）呼吸是深吸氣後再長長地吐氣，可見於臨終病人、大出血或過度換氣症候群。氣喘學童多為呼氣延長並有喘鳴音；顱內壓升高可見陳施氏呼吸等中樞性異常呼吸；糖尿病酮酸中毒為又深又快的庫斯毛耳氏呼吸。"},{"i":"114-3|26","e":"114-3","n":26,"c":1,"s":"測量呼吸時注意事項，下列何者最不適當？","o":["測量前要先告訴病人，增加其準備度","測量前評估病人是否剛進食或運動","觀察病人是否使用呼吸輔助肌","測量時應評估病人面部表情和膚色"],"a":"A","k":"A","t":"","x":"呼吸可受意識控制，若事先告知病人，病人會不自覺改變呼吸的速率與深度，故測量時不宜告知，常在測完脈搏後手指仍放在腕部時觀察胸廓起伏。測量前應評估15～30分鐘內有無進食或運動，並觀察是否使用呼吸輔助肌、面部表情與膚色。"},{"i":"114-2|18","e":"114-2","n":18,"c":1,"s":"有關神經病變性麻刺痛之疼痛輔佐劑（adjuvant drugs）的選擇，根據疼痛評估原則，PQRST那一項目最適當？","o":["放射（Radiates）","強度（Severity）","性質（Quality）","時間（Time）"],"a":"C","k":"C","t":"","x":"PQRST中的Q（Quality）是疼痛性質，如刺痛、灼熱痛、麻刺痛、鈍痛等。神經病變性疼痛常以麻刺、灼熱感表現，依性質判斷後才能選擇抗痙攣劑、抗憂鬱劑等輔佐劑，故選性質。R為部位與放射、S為強度、T為時間型態。"},{"i":"114-2|23","e":"114-2","n":23,"c":1,"s":"成人病人近期發燒，一天內有時體溫達39℃以上，有時又會突然降到正常值以下，如此交替出現的發燒型態，最可能出現在下列何種疾病？","o":["傷寒","肺結核","敗血症","甲狀腺機能亢進"],"a":"C","k":"C","t":"","x":"高熱期與無熱期（體溫可降至正常或以下）交替出現，屬間歇熱，常見於瘧疾、敗血症、淋巴瘤及急性腎盂腎炎。傷寒與成人肺結核多為弛張熱，體溫24小時波動在2℃以上但都高於正常；甲狀腺機能亢進是代謝增加，不會出現此發燒型態。"},{"i":"114-2|24","e":"114-2","n":24,"c":1,"s":"有關影響體溫的因素，下列何者錯誤？","o":["當身體的新陳代謝速率增加，會造成體溫下降","老年人因皮下脂肪組織變薄，其體溫相較其他年齡層低","女性於排卵後受黃體素影響，其體溫相較排卵前高","因晝夜節律的不同，傍晚4～8時的體溫比清晨4～6時的體溫高"],"a":"A","k":"A","t":"","x":"新陳代謝速率增加會使產熱增加，體溫上升而非下降，故A錯誤。老年人皮下脂肪變薄、代謝率降低，體溫較其他年齡層低；排卵後黃體素具產熱作用，使體溫上升；體溫有晝夜節律，清晨4～6時最低，傍晚4～8時最高。"},{"i":"114-2|25","e":"114-2","n":25,"c":1,"s":"38歲女病人至不孕症門診求診，醫師建議每日測量基礎體溫。當體溫出現何種變化，代表生理週期中的黃體素濃度增加？","o":["體溫平均下降約0.3℃～0.6℃","體溫平均下降約0.5℃～1℃","體溫平均約上升0.3℃～0.6℃","體溫平均約上升1℃～1.5℃"],"a":"C","k":"C","t":"","x":"排卵後黃體分泌黃體素，具產熱作用，使基礎體溫平均上升約0.3～0.6℃，並維持到月經來潮前。體溫下降表示黃體素減少或處於濾泡期；上升1℃以上已超出正常的生理變化範圍。"},{"i":"114-2|26","e":"114-2","n":26,"c":1,"s":"下列何者不是易發生高壓脈（pulse of high tension）的族群？","o":["老年人","動脈硬化病人","高血壓病人","出血性休克病人"],"a":"D","k":"D","t":"","x":"高壓脈（高張力脈）是指血管壁張力高、觸摸時不易壓扁的脈搏，常見於血管彈性差或血壓高的人，如老年人、動脈硬化及高血壓病人。出血性休克病人的循環血量減少，脈搏呈快而弱的低壓（絲狀）脈，故答D。"},{"i":"114-1|24","e":"114-1","n":24,"c":1,"s":"病人發燒時的護理措施，下列何者最不適當？","o":["每4小時或更密切的監測體溫","協助調節室溫27～28℃","增加水分攝取，至少3,000 mL/day","給與口腔護理"],"a":"B","k":"B","t":"","x":"發燒病人的室溫應維持在舒適範圍（約20～23.8℃）並保持通風，以利散熱；調高至27～28℃會妨礙散熱，最不適當。發燒時應每4小時或更密切監測體溫，每日攝取水分約2,500～3,000 mL以補充流失，並因口腔乾燥、易生舌苔而加強口腔護理。"},{"i":"114-1|25","e":"114-1","n":25,"c":1,"s":"關於影響呼吸頻率的因素，下列敘述何者錯誤？","o":["年齡越小，呼吸越快","體溫下降，呼吸減慢","血壓下降，呼吸減慢","高海拔地區，呼吸越快"],"a":"C","k":"C","t":"","x":"血壓下降時，壓力接受器所受刺激減少，會反射性使呼吸加快，而不是減慢，故C錯誤。年齡越小，新陳代謝越旺盛，呼吸越快；體溫下降使代謝降低，呼吸減慢；高海拔氧分壓低，呼吸會代償性加快。"},{"i":"114-1|26","e":"114-1","n":26,"c":1,"s":"使用水銀血壓計測量成人血壓時，於數值140 mmHg時開始聽到輕敲聲，至130 mmHg時開始聽到更清脆更強的敲聲，至70 mmHg時轉為較低沉聲音，至56 mmHg時聲音消失，其血壓值紀錄，下列何者正確？","o":["140/70 mmHg","130/70 mmHg","140/56 mmHg","130/56 mmHg"],"a":"C","k":"C","t":"","x":"依柯氏音，第一期最先出現清晰輕敲聲時的讀數為收縮壓（140 mmHg）；成人以聲音完全消失的第五期為舒張壓（56 mmHg），故記錄為140/56 mmHg。130 mmHg是聲音轉強的第三期，70 mmHg聲音轉低沉是第四期，第四期只在兒童或聲音持續不消失時才作為舒張壓。"},{"i":"113-3|9","e":"113-3","n":9,"c":1,"s":"以數字等級量表評估一位意識清楚病人的疼痛。病人表示腹痛及頭痛，關於疼痛評估與紀錄，下列敘述何者正確？","o":["應記錄腹痛及頭痛疼痛分數之平均值","「極度疼痛」為0分；「不痛」為10分","請病人說出當下疼痛感受所代表分數等級","病人皺眉雙手按住傷口，此為疼痛主觀資料"],"a":"C","k":"C","t":"","x":"數字等級量表（NRS）以0分代表不痛、10分代表最痛，由病人自評當下的疼痛程度，故C正確。不同部位的疼痛應分別評估、分別記錄，不可取平均值；病人皺眉、按住傷口是護理師觀察到的表現，屬客觀資料而非主觀資料。"},{"i":"113-3|22","e":"113-3","n":22,"c":1,"s":"癌症病人主訴身體疼痛不適，下列何者為護理師處理其疼痛問題的首要步驟？","o":["查看病人的醫囑有否止痛藥物","教導病人放鬆技巧以減輕疼痛","立即向其主治醫師報告","評估其疼痛的部位與性質"],"a":"D","k":"D","t":"","x":"處理疼痛的第一步是完整評估，可依PQRST了解疼痛的誘發因素、性質、部位與放射、強度及時間，才能決定後續給藥、非藥物措施或是否需報告醫師。直接查醫囑給藥、教放鬆技巧或立即報告醫師，都應建立在評估結果之上。"},{"i":"113-3|24","e":"113-3","n":24,"c":1,"s":"有關影響血壓因素之敘述，下列何者正確？","o":["心輸出量等於心搏出量乘以每分鐘的心跳次數，心輸出量增加，血壓降低","因為小動脈的血管平滑肌阻力較少，因此不屬於影響血壓的因素","血流量增加時，動脈管壁的壓力越大，例如點滴滴注過快可能使血壓上升","血球比容決定了血液黏稠性，血球比容增加，血流阻力下降，動脈壓下降"],"a":"C","k":"C","t":"","x":"血流量增加會使動脈管壁所受壓力增大，例如點滴滴注過快、血容積增加時血壓會上升。心輸出量增加使血壓上升；小動脈平滑肌造成的周邊阻力是影響血壓的重要因素；血球比容增加使血液黏稠度上升、阻力增加，血壓也會上升。"},{"i":"113-3|25","e":"113-3","n":25,"c":1,"s":"學童在學校上體育課時突然昏倒，送至急診室時血糖250 mg/dL，經診斷為第一型糖尿病併有糖尿病酮酸中毒（Diabetic Ketoacidosis, DKA），此刻最可能出現何種呼吸型態？","o":["庫斯毛耳呼吸（Kussmaul’s respiration）","潮式呼吸（tidal respiration）","畢歐式呼吸（Biot’s respiration）","喟嘆式呼吸（sighing respiration）"],"a":"A","k":"A","t":"","x":"糖尿病酮酸中毒屬代謝性酸中毒，身體會以深而快的庫斯毛耳呼吸排出二氧化碳，代償酸中毒。潮式（陳施氏）呼吸與畢歐式呼吸多見於腦部損傷或顱內壓升高；喟嘆式呼吸多與焦慮、情緒有關。"},{"i":"113-3|26","e":"113-3","n":26,"c":1,"s":"根據下列四位住院病人生命徵象測量的結果，何者最為緊急需優先處理？","o":["22 歲男性，急性闌尾炎，預計接受闌尾切除術，體溫 37.8℃，脈搏 80 次／分，呼吸 20 次／分，血壓140/80 mmHg","40 歲女性，流行性感冒合併肺炎，主訴呼吸喘，體溫 38.5℃，脈搏 90 次／分，呼吸 30 次／分，血壓120/76 mmHg","55 歲女性，昨天右側乳房切除，主訴傷口疼痛，體溫 37.5℃，脈搏 82 次／分，呼吸 22 次／分，血壓146/86 mmHg","88歲男性，蜂窩性組織炎，目前抗生素使用，體溫38.2℃，脈搏96次／分，呼吸20次／分，血壓130/96 mmHg"],"a":"B","k":"B","t":"","x":"40歲肺炎病人主訴呼吸喘，呼吸速率達30次／分（成人正常約12～20次／分）且合併發燒，顯示有呼吸窘迫與缺氧風險，應優先處理。其他病人體溫輕度上升或血壓略高，生命徵象相對穩定，可稍後處理。"},{"i":"113-2|17","e":"113-2","n":17,"c":1,"s":"王先生因服用毛地黃而出現脈搏短絀情況，下列敘述何者錯誤？","o":["護理師需同時測量心尖脈及橈動脈來確認","因為心臟傳導功能失效而導致的脈動改變","顧慮個案隱私與舒適，所以測量30秒即可","測量結果心尖脈次數大於橈動脈次數"],"a":"C","k":"C","t":"","x":"脈搏短絀需由兩位護理師同時測量心尖脈與橈動脈，且應測足1分鐘，不可只測30秒，故C錯誤。脈搏短絀是心臟收縮無效、部分搏動無法傳到周邊，因此心尖脈次數大於橈動脈次數。"},{"i":"113-2|24","e":"113-2","n":24,"c":1,"s":"長期服用毛地黃的病人，胸悶覺得全身無力到急診求治，護理師進行心跳評估，下列敘述何者錯誤？","o":["協助病人平躺休息15分鐘之後再測量","手掌溫熱聽診器後使用鐘面進行評估","將聽診器置於左鎖骨中線和第五肋間交會處","評估完整1分鐘需要注意心率的規則與強度"],"a":"B","k":"B","t":"","x":"測量心尖脈應以聽診器膜面聽診，膜面適合聽高頻率的心音；鐘面用於低頻率聲音（如血管雜音），故B錯誤。測量前應讓病人休息、平躺，將聽診器置於左側第五肋間與鎖骨中線交會處，聽足1分鐘並注意心率規則性與強度。"},{"i":"113-2|25","e":"113-2","n":25,"c":1,"s":"病人頭部受傷，腦壓過高，最有可能出現下列何種呼吸型態？","o":["呼吸過速（tachypnea）","呼吸暫停（apnea）","呼吸過慢（bradypnea）","喟嘆式呼吸（sighing respiration）"],"a":"C","k":"C","t":"","x":"顱內壓升高會壓迫腦幹呼吸中樞，使呼吸變慢、不規則，並可伴隨血壓上升、脈搏變慢（庫欣氏反應）。呼吸過速多見於發燒、焦慮或缺氧；呼吸暫停為呼吸停止；喟嘆式呼吸多與情緒、焦慮有關。"},{"i":"113-1|24","e":"113-1","n":24,"c":1,"s":"關於脈搏測量的敘述，下列何者錯誤？","o":["以觸診法測量脈博時，應用食、中及無名指測量，不可用拇指","心房撲動病人可由二位護理師同時一位測心尖脈、一位測橈動脈","測量時間皆以30秒×2來計算","年老或肥胖病人脈搏不顯著，可使用聽診取代觸診"],"a":"C","k":"C","t":"","x":"脈搏規律者可測30秒乘以2，但脈搏不規則、兒童或服用毛地黃者應測足1分鐘，故「皆以30秒×2計算」錯誤。觸診時應用食指、中指及無名指，不可用拇指以免與自身脈搏混淆；脈搏短絀時需兩人同時測心尖脈與橈動脈；脈搏不顯著時可改聽心尖脈。"},{"i":"113-1|25","e":"113-1","n":25,"c":1,"s":"關於測量血壓的注意事項，下列敘述何者正確？","o":["將欲測量之手臂支托，使手臂與心臟同高","為確認數值正確性，無須間隔可重複充氣","正常情況下，慣用手血壓較非慣用手低","一般上肢血壓比下肢血壓高"],"a":"A","k":"A","t":"","x":"測量血壓時，受測手臂應支托並與心臟同高，手臂高於心臟讀值偏低，低於心臟則偏高。重複測量需間隔1～2分鐘，讓血管恢復；正常慣用手血壓略高於非慣用手；下肢血壓通常比上肢高約10～40 mmHg。"},{"i":"113-1|26","e":"113-1","n":26,"c":1,"s":"調節呼吸的重要化學物質，不包括下列那一項？","o":["二氧化碳","碳酸根離子","氫離子","一氧化氮"],"a":"D","k":"D","t":"","x":"呼吸的化學調節主要依靠血中二氧化碳分壓、氫離子濃度（pH）及氧氣分壓，碳酸根離子則與酸鹼平衡相關，均會經化學接受器影響呼吸。一氧化氮主要作用為血管擴張，並非調節呼吸的化學物質。"},{"i":"112-3|23","e":"112-3","n":23,"c":1,"s":"護理人員為病人測量呼吸時的注意事項，下列敘述何者錯誤？","o":["應該讓病人知道你正在為他測量呼吸","測量時，應注意病人的外觀和呼吸聲","應測量病人的呼吸速率、深度和節律","生命徵象不穩定，測量時間為1分鐘"],"a":"A","k":"A","t":"","x":"測量呼吸時不宜讓病人察覺，因病人知道後可能有意識地改變呼吸速率與深度，通常在測完脈搏後手指仍放在橈動脈上時順勢觀察胸部起伏。測量時應注意呼吸速率、深度、節律、聲音與外觀，生命徵象不穩定者應測足1分鐘。"},{"i":"112-3|24","e":"112-3","n":24,"c":1,"s":"有關脈搏速率的敘述，下列何者錯誤？","o":["脈率高於100次／分，稱之為心搏過速","甲狀腺功能亢進，會導致脈率變慢","發燒促進基礎代謝導致脈率變快","嚴重且無法緩和的疼痛，脈率會變慢"],"a":"B","k":"B","t":"","x":"甲狀腺功能亢進會使基礎代謝率上升，脈率增快，故B錯誤。成人脈率高於100次／分為心搏過速；發燒使代謝增加、脈率加快；嚴重且持續的劇痛可能刺激副交感神經，使脈率變慢。"},{"i":"112-3|25","e":"112-3","n":25,"c":1,"s":"測量血壓時，下列何項壓力可以顯示動脈管壁的張力及心搏出量？","o":["收縮壓","舒張壓","脈搏壓","平均動脈壓"],"a":"C","k":"C","t":"","x":"脈搏壓＝收縮壓－舒張壓，可反映動脈管壁的張力（彈性）與心搏出量。收縮壓為心室收縮時動脈的最高壓力，舒張壓為心室舒張時的最低壓力，平均動脈壓則代表整個心動週期中組織的灌流壓力。"},{"i":"112-2|37","e":"112-2","n":37,"c":1,"s":"關於發燒的敘述，下列何者錯誤？","o":["低於39°C的發燒，不會對身體造成傷害","外科手術後是常見發燒原因之一","應採高醣、高脂肪、低蛋白飲食","當病人覺得寒顫時應給予保暖"],"a":"C","k":"C","t":"","x":"發燒時代謝率上升，蛋白質分解增加，應給予高熱量、高蛋白、高維生素且易消化的飲食，並補充水分，故C錯誤。一般低於39℃的發燒不會直接傷害身體；手術後常見發燒；寒顫期病人感覺冷，應給予保暖。"},{"i":"112-2|38","e":"112-2","n":38,"c":1,"s":"下列關於呼吸速率的敘述何者錯誤？","o":["性別：男性呼吸速率比女性快","年齡：年齡越小呼吸越快","藥物：鴉片類藥物使呼吸變慢","體溫：體溫上升呼吸變快"],"a":"A","k":"A","t":"","x":"一般而言女性呼吸速率略快於男性，「男性比女性快」錯誤。年齡越小呼吸越快；鴉片類藥物會抑制呼吸中樞使呼吸變慢；體溫上升使代謝增加，呼吸亦隨之加快。"},{"i":"112-2|39","e":"112-2","n":39,"c":1,"s":"腦部損傷病患，較可能會出現下列何種特殊呼吸型態？①畢歐氏呼吸 ②潮式呼吸 ③庫斯毛耳氏呼吸④喟嘆式呼吸","o":["①②","②③","③④","①③"],"a":"A","k":"A","t":"","x":"腦部損傷影響呼吸中樞時，常出現陳施（潮）氏呼吸與畢歐氏呼吸。庫斯毛耳氏呼吸為深而快的呼吸，常見於代謝性酸中毒（如糖尿病酮酸中毒）；喟嘆式呼吸多與焦慮、情緒有關。"},{"i":"112-2|40","e":"112-2","n":40,"c":1,"s":"急診室接到重大車禍傷患，到院時意識不清，血壓只有70/35 mmHg，懷疑內出血，下列敘述何者正確？","o":["需雙手同時按壓頸動脈測量脈動","因脈動過速而出現高壓脈的狀況","脈波微弱做觸診會有摸不到情況","脈搏震幅交替產生強弱不穩狀態"],"a":"C","k":"C","t":"","x":"大量內出血、血壓過低時，心搏出量減少，脈搏細弱快速（絲脈），周邊動脈觸診可能摸不到。不可同時按壓兩側頸動脈，以免阻斷腦部血流；低血容時不會出現強而有力的洪脈；脈搏強弱交替的交替脈多見於左心衰竭。"},{"i":"112-2|41","e":"112-2","n":41,"c":1,"s":"有關脈搏測量部位的敘述，下列何者正確？","o":["位在足內踝後方的測量部位為足背動脈","膝膕動脈需要稍微彎曲膝蓋較容易測得","成人心尖脈位於第三肋間與鎖骨中線交點","肱動脈位於手肘彎偏外側處"],"a":"B","k":"B","t":"","x":"測量膕動脈時，讓病人膝蓋稍微彎曲可放鬆肌肉與肌腱，較容易摸到。足內踝後方為脛後動脈，足背動脈在足背；成人心尖脈位於左側第五肋間與鎖骨中線交會處；肱動脈位於肘窩偏內側。"},{"i":"112-2|42","e":"112-2","n":42,"c":1,"s":"關於測量血壓的技術之敘述，下列何者正確？","o":["橡皮氣囊袋之下緣應齊平於肘關節處","每次打氣不超過10 mmHg，放氣每次不超過2～4 mmHg","打氣至橈動脈消失時，應該避免再充氣以免測量值失真","放氣時，聽到聲音消失之前的低沉聲音為收縮壓"],"a":"B","k":"B","t":"","x":"測血壓打氣時應穩定逐步加壓，放氣速度約每秒2～4 mmHg，以免讀值誤差。袖帶下緣應在肘窩上約2.5公分；觸診橈動脈消失後應再加壓約20～30 mmHg；放氣時聽到的第一個清晰聲音為收縮壓，聲音消失處為舒張壓。"},{"i":"112-1|37","e":"112-1","n":37,"c":1,"s":"林先生因感染導致敗血症，一天內有時體溫達 39℃以上，有時又會突然降到正常值以下，如此交替出現，此發燒類型應為：","o":["恆常熱（constant fever）","弛張熱（remittent fever）","間歇熱（intermittent fever）","回歸熱（relapsing fever）"],"a":"C","k":"C","t":"","x":"間歇熱是體溫在一天內時而升高達39℃以上，時而降至正常或正常以下，高低交替出現，常見於敗血症、瘧疾，故選C。恆常熱為體溫持續高溫、日差小於1℃；弛張熱為日差大於1℃但未降至正常；回歸熱為發燒數日後退燒數日再發燒。"},{"i":"112-1|38","e":"112-1","n":38,"c":1,"s":"亞翔不慎溺水被送至醫院急診室時，其體溫僅34.5℃，最不可能出現下列那一種症狀？","o":["嗜睡","尿量增加","脈搏、呼吸變慢","血壓下降"],"a":"B","k":"B","t":"","x":"體溫過低（核心溫度低於35℃）時新陳代謝下降，會出現嗜睡、脈搏與呼吸變慢、血壓下降及尿量減少等症狀。尿量增加不是體溫過低的表現，故選B。"},{"i":"112-1|39","e":"112-1","n":39,"c":1,"s":"有關於成人呼吸的敘述，下列何者錯誤？","o":["平均吸氣時間2秒、吐氣時間為3秒","呼吸的基本節律週期控制位於延腦","血液中二氧化碳濃度增加會抑制呼吸","吸氣時橫膈會收縮並下降"],"a":"C","k":"C","t":"","x":"血液中二氧化碳濃度增加時，會刺激化學接受器而使呼吸加深加快，並非抑制呼吸，故C錯誤。成人吸氣約2秒、吐氣約3秒；呼吸的基本節律由延腦控制；吸氣時橫膈收縮下降使胸腔擴大。"},{"i":"112-1|41","e":"112-1","n":41,"c":1,"s":"下列那些病人評估脈搏時測量心尖脈較適宜？①服用毛地黃 ②足部手術後 ③7 歲兒童 ④腎衰竭出現四肢水腫","o":["①③","①④","②③","②④"],"a":"B","k":"B","t":"","x":"服用毛地黃者給藥前須測量心尖脈一分鐘；腎衰竭四肢水腫時周邊脈搏不易觸摸，也宜測量心尖脈，故選①④。足部手術後應測量足背動脈以評估循環；7歲兒童可測量橈動脈，心尖脈主要用於嬰幼兒。"},{"i":"112-1|42","e":"112-1","n":42,"c":1,"s":"王先生因車禍入院，前額有撕裂傷、左側手腳骨折、右前臂靜脈注射0.9% N/S I.V.F. 60 c.c./hr、意識混亂，以簡單面罩提供氧氣，下列何者是測量血壓及體溫最適宜部位？","o":["右手、耳溫","右腿、耳溫","右腿、口溫","右手、肛溫"],"a":"B","k":"B","t":"","x":"測量血壓應避開骨折及有靜脈注射的肢體，王先生左側手腳骨折、右前臂有點滴，故選右腿測量。意識混亂及使用氧氣面罩者不宜測量口溫，耳溫測量快速且安全，故選右腿、耳溫。"},{"i":"112-1|46","e":"112-1","n":46,"c":1,"s":"下列疾病與異常呼吸的敘述何者錯誤？","o":["腦內壓增高時，呼吸速率變快","慢性阻塞性肺疾病病人，會有端坐呼吸","血氧不足時，會出現呼吸過速","代謝性酸中毒時，會出現換氣過度"],"a":"A","k":"A","t":"","x":"顱內壓增高時延腦呼吸中樞受壓抑，呼吸速率會變慢而非加快，故A錯誤。慢性阻塞性肺疾病病人常需端坐呼吸；血氧不足時會代償性呼吸過速；代謝性酸中毒時會出現深快的換氣過度以排出二氧化碳。"},{"i":"111-2|37","e":"111-2","n":37,"c":1,"s":"有關影響體溫的因素，下列敘述何者正確？①老人的體溫往往稍高 ②焦慮時體溫會上升 ③甲狀腺功能不足，體溫會偏高 ④女生排卵時，體溫會稍高","o":["①②","①③","②④","③④"],"a":"C","k":"C","t":"","x":"焦慮時交感神經興奮，新陳代謝增加，體溫會上升；女性排卵後黃體素分泌增加，體溫會稍微升高，故選②④。老人新陳代謝率較低，體溫往往較低；甲狀腺功能不足時代謝率下降，體溫會偏低。"},{"i":"111-2|38","e":"111-2","n":38,"c":1,"s":"下列何種情況，不需要每4小時測量一次體溫？","o":["發燒病人","病危病人","手術後第二天","電腦斷層檢查後"],"a":"D","k":"D","t":"","x":"發燒、病危及手術後病人病情變化大，需每4小時（或更頻繁）測量體溫以監測變化。電腦斷層檢查屬非侵入性檢查，檢查後並不需要每4小時測量體溫，故選D。"},{"i":"111-2|39","e":"111-2","n":39,"c":1,"s":"關於換氣過度（hyperventilation）的特徵，下列敘述何者正確？①一種較正常慢而淺的呼吸 ②一種深而快的呼吸 ③造成血液中CO2下降，而O2上升 ④造成血液中O2下降，而CO2上升","o":["①②","①④","②③","③④"],"a":"C","k":"C","t":"","x":"換氣過度是一種深而快的呼吸，二氧化碳排出過多，使血中二氧化碳分壓下降、氧分壓上升，可導致呼吸性鹼中毒，故選②③。慢而淺的呼吸及血中氧氣下降、二氧化碳上升屬於換氣不足的表現。"},{"i":"111-2|40","e":"111-2","n":40,"c":1,"s":"關於常見脈律不整類型的敘述，下列何者錯誤？","o":["二重脈（bigeminal pulse）：脈動出現每二次正常脈之後，緊跟著一次不成熟脈動","間歇脈（intermittent pulse）：脈搏間隔時間長短不一，跳幾下會停一下，無一定節律","跑脈（running pulse）：脈律細、不規則而快，150次／分鐘以上，有時會快到無法測量","脈搏短絀（pulse deficit）：心尖脈和橈動脈的跳動不一致，常見於心房纖維顫動"],"a":"A","k":"A","t":"","x":"二重脈是每次正常脈動後，緊接著一次不成熟且較弱的搏動，呈一強一弱交替出現；選項A所述「每二次正常脈之後緊跟一次不成熟脈動」是三重脈，故A錯誤。間歇脈、跑脈及脈搏短絀的敘述皆正確。"},{"i":"111-2|41","e":"111-2","n":41,"c":1,"s":"關於影響血壓的因素，下列敘述何者正確？","o":["年齡越大，血管壁的彈性下降，血壓會變低","抽菸因為有尼古丁的作用，使血管放鬆，血壓下降","受到重力影響，平躺的血壓通常會較坐姿血壓還要高","使用鎮靜劑，會使血管擴張，導致血壓下降"],"a":"D","k":"D","t":"","x":"鎮靜劑會使血管擴張、周邊阻力下降，導致血壓下降，故D正確。年齡越大血管彈性下降，血壓會升高；尼古丁會使血管收縮而使血壓上升；受重力影響，血壓一般以站姿最高、平躺較低，而非平躺高於坐姿。"},{"i":"111-2|42","e":"111-2","n":42,"c":1,"s":"王小姐平時血壓為110～120/76～80 mmHg。則以錶式血壓計測量時，應充氣至下列何壓力值為佳？","o":["120 mmHg","130 mmHg","150 mmHg","180 mmHg"],"a":"C","k":"C","t":"","x":"測量血壓時，應充氣至橈動脈脈搏消失後再高出20～30 mmHg，或高於平時收縮壓約30 mmHg。王小姐平時收縮壓約120 mmHg，故充氣至150 mmHg為佳；充氣不足會漏測收縮壓，充氣過高則造成病人不適。"},{"i":"111-1|37","e":"111-1","n":37,"c":1,"s":"某男士在高溫環境工作大量流汗，感覺頭暈，虛弱不適，至急診就醫時意識清楚，臉色蒼白、皮膚濕冷、體溫37.9℃、血壓100/65 mmHg，依上述症狀判斷其可能發生的問題為下列何者？","o":["中暑","熱衰竭","熱痙攣","熱感冒"],"a":"B","k":"B","t":"","x":"熱衰竭是在高溫環境下大量流汗，導致水分及電解質流失、循環血量不足，表現為頭暈、虛弱、臉色蒼白、皮膚濕冷、血壓偏低，體溫正常或略升，故選B。中暑則因體溫調節中樞失調，出現高體溫、皮膚乾熱無汗與意識改變。"},{"i":"111-1|38","e":"111-1","n":38,"c":1,"s":"關於影響呼吸速率之相關因素的敘述，下列何者正確？","o":["大出血，呼吸變慢","男性較女性的呼吸速率慢","焦慮時，呼吸變慢","血壓下降，呼吸變慢"],"a":"B","k":"B","t":"","x":"一般而言，男性的呼吸速率較女性慢，故B正確。大出血時血氧不足，呼吸會代償性加快；焦慮時交感神經興奮使呼吸加快；血壓下降時亦會刺激呼吸速率增加。"},{"i":"111-1|39","e":"111-1","n":39,"c":1,"s":"下列何種疾病或情況的病人不會採端坐呼吸？","o":["腹水","充血性心臟衰竭","氣喘","腦幹腫瘤"],"a":"D","k":"D","t":"","x":"端坐呼吸是指平躺時呼吸困難，需坐起或端坐才能順暢呼吸，常見於腹水、充血性心臟衰竭、氣喘等心肺或腹壓問題。腦幹腫瘤影響呼吸中樞，較常出現陳施氏或畢歐氏等異常呼吸型態，而非端坐呼吸。"},{"i":"111-1|40","e":"111-1","n":40,"c":1,"s":"關於心搏過緩（bradycardia）的描述，下列何者正確？","o":["常見於毛地黃中毒、體溫過低的病患","補充甲狀腺素可能產生的合併症","低於成人平均72次/分鐘就可稱之","登山時因空氣稀薄會出現的代償作用"],"a":"A","k":"A","t":"","x":"心搏過緩指成人心跳每分鐘少於60次，常見於毛地黃中毒、體溫過低、顱內壓升高等情況，故A正確。補充甲狀腺素過量會使心跳加快；低於72次/分鐘仍屬正常範圍；高山缺氧時身體會代償性使心跳加快。"},{"i":"111-1|41","e":"111-1","n":41,"c":1,"s":"關於脈搏測量方式的描述，下列何者錯誤？","o":["新生兒與嬰兒脈搏需測量心尖脈1分鐘","下肢行外科手術前後需要測量足背動脈","一般成人最常用的周邊脈搏為肱動脈","心律不整者需同時測量心尖脈與橈動脈"],"a":"C","k":"C","t":"","x":"一般成人最常用的周邊脈搏測量部位為橈動脈，肱動脈常用於測量血壓及嬰兒心肺復甦術，故C錯誤。新生兒及嬰兒應測心尖脈1分鐘；下肢手術前後需評估足背動脈；心律不整者需同時測量心尖脈與橈動脈。"},{"i":"111-1|42","e":"111-1","n":42,"c":1,"s":"下列何者非維持血壓的因素？","o":["心輸出量","血液黏滯性","動脈長度","動脈彈性"],"a":"C","k":"C","t":"","x":"維持血壓的因素包括心輸出量、周邊血管阻力、血液量、血液黏滯性及動脈管壁彈性等。動脈長度在個體中相對固定，並非臨床上維持或調節血壓的主要因素，故選C。"},{"i":"110-2|6","e":"110-2","n":6,"c":1,"s":"游奶奶接受雙側膝關節置換術，術後第一天使用自控式嗎啡疼痛控制器止痛，白班護生王同學照顧游奶奶，9:40 am尚未備口服藥物，實習指導老師詢問下，王同學表示：「奶奶還在睡覺，剛剛測量的生命徵象 BP 為 122∕64 mmHg、TPR：36.4°C、64 次／分、8 次／分，我想奶奶昨天開刀應該讓她休息一下，我不忍心叫她起床吃藥」，針對上述情境，下列處置何者最適當？","o":["應讓病人有足夠的休息，以利術後復原","服藥時間已超過應暫停給此次服藥","護生具有關懷之心應給予正向鼓勵","立即再次確認病人生命徵象之正確性"],"a":"D","k":"D","t":"","x":"病人使用嗎啡止痛且呼吸僅8次/分鐘，低於成人正常值，又一直昏睡未醒，可能為鴉片類藥物引起的呼吸抑制。此時應立即再次確認生命徵象的正確性並評估意識，必要時通知醫師，而非讓病人繼續休息或給予鼓勵。"},{"i":"110-2|7","e":"110-2","n":7,"c":1,"s":"（情境：游奶奶接受雙側膝關節置換術，術後第一天使用自控式嗎啡疼痛控制器止痛，9:40 am仍在睡覺，剛測量的生命徵象BP為122∕64 mmHg、TPR：36.4°C、64次／分、8次／分）游奶奶術後第一天生命徵象的改變，下列敘述何者正確？","o":["傷口疼痛會使得呼吸速率變慢","鴉片類止痛劑會抑制呼吸速率及深度","術後失血減低呼吸速率","全身麻醉劑刺激呼吸速率"],"a":"B","k":"B","t":"","x":"嗎啡等鴉片類止痛劑會抑制延腦呼吸中樞，使呼吸速率變慢、深度變淺，故B正確。傷口疼痛會使呼吸加快；失血時身體代償會使呼吸速率增加；全身麻醉劑會抑制而非刺激呼吸。"},{"i":"110-2|44","e":"110-2","n":44,"c":1,"s":"下列何者是最可能發生心搏速率 > 100次／分的情況？","o":["正在服用毛地黃藥物之病人","低體溫入院的溺水病人","規律服用Propranolol的老年病人","甲狀腺機能亢進的中年病人"],"a":"D","k":"D","t":"","x":"甲狀腺機能亢進使新陳代謝率增加，常出現心搏過速。毛地黃與Propranolol（β阻斷劑）皆會使心跳變慢；低體溫時新陳代謝下降，脈搏與呼吸也會變慢，故選D。"},{"i":"110-2|45","e":"110-2","n":45,"c":1,"s":"有關血壓之敘述，下列何者錯誤？","o":["飲酒過量，會使血管收縮導致血壓上升","顱內壓過高者，會出現心跳變慢、血壓上升","一天中，午後或傍晚的血壓值最高","血壓值變化從高到低，依序為站姿、坐姿、平躺"],"a":"A","k":"A","t":"","x":"酒精會使周邊血管擴張，而使血壓下降，故A錯誤。顱內壓升高會出現心跳變慢、血壓上升（收縮壓上升）；血壓有日夜變化，以午後或傍晚較高。"},{"i":"110-2|46","e":"110-2","n":46,"c":1,"s":"關於脈搏的特性或測量之敘述，下列何者正確？","o":["脈搏於吸氣增快，呼氣變慢稱為柯利干氏脈（Corrigan’s pulse）","正常脈搏強度的標記為1+","評估雙下肢動脈阻塞情形，可測量足背動脈","尺及橈動脈之脈搏均為70次／分、心尖脈為85次／分，稱為竇性心律不整"],"a":"C","k":"C","t":"","x":"足背動脈位於足背，常用來評估下肢動脈循環及阻塞情形，故C正確。吸氣增快、呼氣變慢為竇性心律不整；正常脈搏強度標記為2+；心尖脈大於橈動脈脈搏為脈搏短絀，常見於心房纖維顫動。"},{"i":"110-1|31","e":"110-1","n":31,"c":1,"s":"「換氣過度」病人的動脈氣體分析結果，下列何者最有可能？","o":["呼吸性酸中毒","呼吸性鹼中毒","代謝性酸中毒","代謝性鹼中毒"],"a":"B","k":"B","t":"","x":"換氣過度時呼吸加深加快，使二氧化碳排出過多、動脈血二氧化碳分壓下降，導致呼吸性鹼中毒。換氣不足才會因二氧化碳滯留而造成呼吸性酸中毒；代謝性酸鹼失衡則與腎臟或代謝問題有關。"},{"i":"110-1|38","e":"110-1","n":38,"c":1,"s":"李先生車禍後因腦挫傷導致顱內壓上升，他的體溫及呼吸可能會出現下列何種反應？","o":["體溫上升、呼吸過速","體溫上升、呼吸過慢","體溫下降、換氣過度","體溫下降、換氣不足"],"a":"B","k":"B","t":"","x":"顱內壓上升會壓迫腦幹與下視丘，使體溫調節中樞受損而造成中樞性體溫上升，同時延腦呼吸中樞受壓抑而使呼吸速率變慢，故為體溫上升、呼吸過慢。呼吸過速或換氣過度並非顱內壓升高的典型表現。"},{"i":"110-1|39","e":"110-1","n":39,"c":1,"s":"有關體溫的調節，下列敘述何者錯誤？","o":["下視丘是利用負回饋來統整身體產熱與散熱間之生理過程的主要中心","效應系統（effector system）指的是血管、骨骼肌及汗腺等體溫調節反應器","病人調整室內溫度屬於行為機轉","下視丘對於體表溫度較為敏感"],"a":"D","k":"D","t":"","x":"下視丘是體溫調節的中央整合器，利用負回饋統整產熱與散熱，對核心溫度（血液溫度）的變化較體表溫度敏感，故D錯誤。效應系統包括血管、骨骼肌與汗腺；自行調整室溫屬於行為性的體溫調節。"},{"i":"110-1|40","e":"110-1","n":40,"c":1,"s":"有關影響呼吸的相關因素，下列敘述何者正確？","o":["年齡愈大，呼吸速率愈快","大出血時，呼吸速率加快","胸腔積水，呼吸速率下降","急性疼痛，呼吸速率下降"],"a":"B","k":"B","t":"","x":"大出血時血氧攜帶量下降，身體代償使呼吸速率加快，故B正確。年齡愈大呼吸速率愈慢；胸腔積水使肺擴張受限，呼吸會變淺快；急性疼痛會使呼吸速率加快而非下降。"},{"i":"110-1|41","e":"110-1","n":41,"c":1,"s":"有關脈律（pulse rhythm）的敘述，下列何者正確？","o":["二重脈（bigeminal pulse）的病人會出現每兩次正常脈動後，緊跟著出現一次未成熟的搏動","主動脈瓣膜閉鎖不全的病人可能出現柯利干氏脈（Corrigan’s pulse）","竇性心律不整（sinus arrhythmis）的病人會出現吸氣時脈量減弱，呼氣時增強的情形","跑脈（running pulse）會出現脈搏間隔時間長短不均，無固定節律，跳幾下停一下的情形"],"a":"B","k":"B","t":"","x":"柯利干氏脈為一種痙攣脈，脈搏一下子跳得很滿又迅速塌陷，見於主動脈瓣閉鎖不全者，故B正確。二重脈為每次正常脈動後緊接一次較弱搏動；竇性心律不整為吸氣時脈率增快、呼氣時下降；跑脈為細快不規則脈，(D)描述的是間歇脈。"},{"i":"110-1|42","e":"110-1","n":42,"c":1,"s":"有關血壓的測量，下列敘述何者正確？","o":["壓脈帶成人用充氣囊寬度18～20公分，長度約24～26公分","壓脈帶包覆在靜脈點滴注射位置上方至少2吋","心律不整病人應測量三次血壓後取其平均值","半側偏癱病人應測量患側肢體"],"a":"C","k":"C","t":"","x":"心律不整病人每次心搏的心輸出量不同，應連續測量三次血壓後取平均值，故C正確。成人壓脈帶充氣囊寬約12～14公分；量血壓時應避開有靜脈注射的肢體；偏癱病人應測健側，患側循環較差會影響準確度。"},{"i":"109-2|10","e":"109-2","n":10,"c":1,"s":"孫先生昨天開始解尿不順、尿道灼熱感，臉色發紅、皮膚溫暖乾燥，生命徵象：血壓126 / 76 mmHg、體溫39.2°C（耳溫）、脈搏116次／分、呼吸26次／分，孫先生出現發燒現象，下列護理措施何者不適當？","o":["指導病人減少外在覆蓋物","提供液體以補充無感水分散失","指導多下床活動","協助進行尿液檢驗"],"a":"C","k":"C","t":"","x":"發燒病人應臥床休息，以降低新陳代謝率、減少肌肉活動產熱，指導多下床活動會增加產熱並易因虛弱跌倒，故C不適當。發熱期應減少覆蓋物以利輻射散熱，提供足夠液體補充流失水分，並協助尿液檢驗找出感染原因。"},{"i":"109-2|11","e":"109-2","n":11,"c":1,"s":"有關呼吸特性之敘述，下列何者正確？","o":["內呼吸又稱為肺呼吸","吸氣時內肋間肌收縮","呼氣時肋骨下降","吸氣時橫膈膜放鬆"],"a":"C","k":"C","t":"","x":"呼氣時肋間外肌與橫膈放鬆，肋骨下降、胸腔容積變小而將氣體呼出。內呼吸是組織細胞與微血管間的氣體交換，肺呼吸是外呼吸；吸氣時肋間外肌收縮使肋骨上提，橫膈收縮下降使胸腔擴大，故A、B、D錯。"},{"i":"109-2|27","e":"109-2","n":27,"c":1,"s":"冷熱應用能量轉換原理於人體散熱之情境，下列何者正確？","o":["發燒時，減少病人被蓋，主要是利用對流（convection）原理","高溫環境中，人體藉擴張表面血管調整體溫，主要是利用傳導（conduction）原理","寒流來襲時，運用暖暖包協助提高體溫，主要是利用輻射（radiation）原理","運動後，呼吸速率變快，水分散失增加以降溫，主要是利用蒸發（evaporation）原理"],"a":"D","k":"D","t":"","x":"運動後呼吸變快，經呼吸道散失的水分增加，藉液體轉化為氣體帶走熱能，屬於蒸發散熱。減少被蓋與擴張表面血管主要增加輻射散熱；暖暖包直接接觸身體傳送熱能，屬於傳導，故A、B、C錯。"},{"i":"109-2|39","e":"109-2","n":39,"c":1,"s":"一位心房纖維震顫病史的病人，其橈動脈 52 次／分鐘、搏動規律，病人無感到頭暈及疲倦，為了確認病人是否出現脈搏短絀的問題，下列何者為最適當之立即性處置？","o":["重複測量雙側橈動脈","施作12導程心電圖","測量心尖脈搏動次數","評估足背動脈脈搏"],"a":"C","k":"C","t":"","x":"心房纖維顫動者易因心臟傳導異常出現脈搏短絀，即心尖脈次數大於橈動脈次數，因此應立即聽診心尖脈並與橈動脈同時測量比較。重複測量橈動脈或足背動脈無法發現脈搏短絀；心電圖非護理師可立即獨立施行的確認方式。"},{"i":"109-2|40","e":"109-2","n":40,"c":1,"s":"一般成人的大腿血壓測量方式與結果之敘述，下列何者正確？","o":["其收縮壓會較上肢低20～40 mmHg","充氣囊寬度為測量肢體圓周之20%","聽診器放置在足背動脈處","壓脈帶下緣應置於膝膕上方"],"a":"D","k":"D","t":"","x":"測量大腿血壓時，壓脈帶應包裹於大腿中段，下緣置於膝膕上方，聽診器放在膝膕動脈處。下肢收縮壓通常比上肢高約20～40 mmHg，舒張壓相近；充氣囊寬度應為受測肢體圓周的40%。"},{"i":"109-2|41","e":"109-2","n":41,"c":1,"s":"血壓數值為140/80 mmHg，其平均動脈壓數值為多少mmHg？","o":["60","130","100","200"],"a":"C","k":"C","t":"","x":"平均動脈壓＝舒張壓＋1/3脈搏壓。脈搏壓＝140－80＝60 mmHg，平均動脈壓＝80＋60/3＝100 mmHg，亦可用1/3×140＋2/3×80＝100 mmHg計算。"},{"i":"109-1|11","e":"109-1","n":11,"c":1,"s":"隨著呼吸狀態而改變的脈搏，吸氣期脈搏減弱，呼氣期增強，此稱之為：","o":["柯利干氏脈（Corrigan’s pulse）","竇性心律不整（sinus arrhythmia）","奇異脈（paradoxical pulse）","間歇脈（intermittent pulse）"],"a":"C","k":"C","t":"","x":"奇異脈是指吸氣時脈搏減弱或消失、呼氣時增強，常見於心包填塞者。竇性心律不整是吸氣時脈率增快、呼氣時減慢；柯利干氏脈為主動脈閉鎖不全時脈搏迅速充滿又塌陷；間歇脈是脈搏間隔長短不一、無固定節律。"},{"i":"109-1|36","e":"109-1","n":36,"c":1,"s":"一位初入院的病人主訴不適且左側無力，血壓數值右手148/76 mmHg、左手120/66 mmHg，下列處置何者較適當？","o":["測量其雙下肢的血壓","再測量一次雙手血壓","測量不同姿位之血壓","記錄採左手臂血壓值"],"a":"B","k":"B","t":"","x":"首次測量應測兩手，兩側血壓差距若超過正常範圍（約5～15 mmHg），應放鬆壓脈帶休息1～2分鐘後，再次測量雙手血壓以確認數值，再以較高側為日後測量基準。病人左側無力，屬半側偏癱患側者不宜作為量血壓部位，故不應記錄左手數值。"},{"i":"109-1|37","e":"109-1","n":37,"c":1,"s":"有關成人耳溫及其測量的敘述，下列何者錯誤？","o":["耳朵往下往後拉","耳道發炎者不適用","使用耳套避免交互感染","耳道溫度高於腋溫"],"a":"A","k":"A","t":"","x":"成人及3歲以上孩童測量耳溫時，耳廓應往上、往後拉，使耳道變直；3歲以下嬰幼兒才是往下、往後拉，故A錯。耳道發炎者不宜測耳溫，每次使用需更換耳套以避免交互感染，耳溫接近核心溫度，高於腋溫。"},{"i":"109-1|38","e":"109-1","n":38,"c":1,"s":"根據下列四位住院病人之生命徵象測量結果，何者應最優先處理？","o":["80歲女性，肺炎，RR 27次/分，SpO2 80%","50歲男性，小腿骨折，BP 160/80 mmHg、PR 80次/分","60歲男性，糖尿病足合併蜂窩組織炎，BT 38.2℃、PR 96次/分","75歲女性，3天前右側乳房切除，BP 146/86 mmHg、RR 22次/分"],"a":"A","k":"A","t":"","x":"80歲肺炎病人呼吸速率27次/分、血氧飽和度僅80%，表示嚴重缺氧、呼吸窘迫，屬危及生命的狀況，應最優先處理。骨折病人輕度血壓升高、蜂窩組織炎病人輕度發燒、術後病人血壓與呼吸略高，皆較不緊急。"},{"i":"109-1|39","e":"109-1","n":39,"c":1,"s":"病人的呼吸開始時短而淺，之後漸漸加深，然後又逐漸下降，直至呼吸暫停或完全停止，呈週期性出現，此種呼吸型態稱為？","o":["喟嘆氏呼吸（sighing respiration）","陳施氏呼吸（Cheyne-stokes respiration）","畢歐氏呼吸（Biot’s respiration）","庫斯毛耳呼吸（Kussmaul’s respiration）"],"a":"B","k":"B","t":"","x":"陳施氏（潮式）呼吸為呼吸由淺慢逐漸變深快，再逐漸變淺慢，最後出現一段呼吸暫停，呈週期性反覆，常見於腦部損傷、心臟衰竭或臨終病人。畢歐氏呼吸為數次深度相同的呼吸後突然暫停，不規則出現；嘆息式為深吸氣後長長吐氣。"},{"i":"109-1|40","e":"109-1","n":40,"c":1,"s":"一位75歲男性、身材適中、有心房纖維震顫、高血壓及梗塞性腦中風導致右側肢體偏癱的住院病人，目前左手注射D5W+KCL 10 mEq 40 c.c./小時，以電子血壓計測量血壓，下列有關血壓和脈搏測量，何者最適當？","o":["如血壓需重複測量，壓脈帶內空氣不需放鬆，兩次測量間隔2分鐘","應同時測量心尖脈及左手橈動脈脈搏","應測量左右手血壓，取數值較低側為準","測量大腿血壓時，壓脈帶包裹於膝膕動脈處"],"a":"B","k":"B","t":"","x":"心房纖維顫動者易出現脈搏短絀（心尖脈次數大於橈動脈次數），應同時測量心尖脈及橈動脈並比較。重複測量血壓前應放鬆壓脈帶並完全排出空氣；首次測量應以數值較高側為準；測大腿血壓時壓脈帶應包裹於大腿中段，並於膝膕動脈處聽診。"},{"i":"109-1|56","e":"109-1","n":56,"c":1,"s":"有關體溫變化的敘述，下列何者錯誤？","o":["老年人體溫會比其他年齡層人低","焦慮、面對壓力時，會使體溫下降","甲狀腺功能不足時，體溫會下降","排卵後，黃體激素分泌增加，使體溫升高"],"a":"B","k":"B","t":"","x":"情緒波動與壓力會刺激交感神經，使腎上腺素與正腎上腺素分泌增加，產熱增加而體溫上升，並非下降，故B錯。老年人皮下脂肪少、代謝率低，體溫較低；甲狀腺功能不足使代謝降低、體溫下降；排卵後黃體素增加使體溫上升約0.3～0.6℃。"},{"i":"108-2|8","e":"108-2","n":8,"c":1,"s":"以身體而言，溫度最高的部位為下列何者？","o":["肝臟","耳垂","四肢","軀幹"],"a":"A","k":"A","t":"","x":"身體各部位溫度不同，肝臟為代謝最旺盛的器官，溫度最高，約38.8℃；耳垂溫度最低，約32.2℃。四肢與軀幹的體表溫度易受環境影響，均低於核心器官的溫度。"},{"i":"108-2|10","e":"108-2","n":10,"c":1,"s":"下列何者最有可能導致平均動脈壓下降？","o":["心跳速率增加、心搏出量減少、周邊阻力上升","心跳速率增加、心搏出量增加、周邊阻力下降","心跳速率減少、心搏出量減少、周邊阻力下降","心跳速率減少、心搏出量增加、周邊阻力上升"],"a":"C","k":"C","t":"","x":"平均動脈壓受心輸出量（心跳速率×心搏出量）與周邊血管阻力影響。心跳速率減少、心搏出量減少使心輸出量下降，周邊阻力下降又使舒張壓降低，三者同時發生最可能使平均動脈壓下降。"},{"i":"108-2|11","e":"108-2","n":11,"c":1,"s":"有關發燒初期之症狀表現，下列何者正確？","o":["呼吸減緩","心跳速度加快","皮膚發燙","譫妄"],"a":"B","k":"B","t":"","x":"發燒開始期（初期）體溫調節中樞設定點上升，身體藉血管收縮與寒顫產熱，出現發冷、皮膚蒼白冰冷乾燥，且因代謝率上升使心跳加快、呼吸變快變深。皮膚發燙屬發熱期表現，譫妄則多見於高燒40℃以上時。"},{"i":"108-2|33","e":"108-2","n":33,"c":1,"s":"有關發燒提供的護理措施，下列何者是應用「對流原理」？","o":["移除過厚的衣物","調整室內空調溫度","依醫囑給予冰枕","溫水拭浴"],"a":"B","k":"B","t":"","x":"對流是藉空氣流動帶走皮膚表面溫暖的氣體而散熱，調整室內空調可促進空氣流動與交換，增加對流散熱。移除過厚衣物主要增加輻射散熱；冰枕與溫水拭浴則是經由直接接觸的傳導散熱。"},{"i":"108-2|43","e":"108-2","n":43,"c":1,"s":"關於體溫調節的生理機轉，下列敘述何者錯誤？","o":["皮膚對冷的感覺較敏銳","利用正回饋來調節產熱及散熱","血管收縮為產熱機制","汗腺分泌為散熱機制"],"a":"B","k":"B","t":"","x":"體溫是藉由負回饋機制維持恆定，而非正回饋，故B錯。冷覺接受器多於熱覺接受器，皮膚對冷較敏感；寒冷時皮膚血管收縮以減少散熱、保存體熱；熱時汗腺分泌經蒸發散熱。"},{"i":"108-2|44","e":"108-2","n":44,"c":1,"s":"關於體溫過低的敘述，下列何者錯誤？","o":["可能導因於大出血、敗血症","會產生心跳變弱，呼吸與血壓下降","可依醫囑給予靜脈注射溫暖輸液","需快速身體加溫，以預防進一步損傷"],"a":"D","k":"D","t":"","x":"體溫過低病人回溫不可過快，快速加溫會使周邊血管突然擴張而造成血壓下降、心律不整等危險，應採漸進式回溫，故D錯。大出血、敗血症可導致體溫過低，會出現心跳變弱、呼吸與血壓下降，可依醫囑給予溫暖的靜脈輸液。"},{"i":"108-1|30","e":"108-1","n":30,"c":1,"s":"脫水病人所呈現的生命徵象，下列何者正確？","o":["體溫上升、脈搏弱且快、呼吸速率減少、血壓上升","體溫上升、脈搏弱且快、呼吸速率增加、血壓下降","體溫下降、脈搏弱且慢、呼吸速率增加、血壓上升","體溫下降、脈搏弱且慢、呼吸速率減少、血壓下降"],"a":"B","k":"B","t":"","x":"脫水時體液不足，散熱的蒸發作用減少而使體溫上升；血量減少使血壓下降，心臟代償性增加心跳，脈搏變得弱且快；組織灌流不足與代謝增加使呼吸速率增加。故脫水病人呈體溫上升、脈搏弱而快、呼吸增快、血壓下降。"},{"i":"108-1|38","e":"108-1","n":38,"c":1,"s":"下列那一因素會造成血壓下降？","o":["心肌收縮力增強","血量減少","動脈血管彈性差","血流速度減緩"],"a":"B","k":"B","t":"","x":"血量減少時動脈管壁承受的壓力下降，血壓隨之下降，如出血、脫水。心肌收縮力增強使心輸出量增加、動脈血管彈性變差、血流速度減緩（血液黏滯性增加）皆會使血壓上升。"},{"i":"108-1|39","e":"108-1","n":39,"c":1,"s":"有關體熱散熱方式的敘述，下列何者錯誤？","o":["冰枕是利用傳導的方式來散熱","身體伸展可增加體表面積，經輻射方式來散熱","流汗是利用蒸發的方式來散熱","睡在涼爽的蓆子上是利用對流的方式來散熱"],"a":"D","k":"D","t":"","x":"睡在涼蓆上是皮膚直接接觸較冷物體，熱經由直接接觸傳送出去，屬於傳導散熱，而非對流，故D錯。冰枕亦為傳導散熱；身體伸展增加體表面積可增加輻射散熱；流汗是蒸發散熱。"},{"i":"108-1|40","e":"108-1","n":40,"c":1,"s":"下列何種情況，較不會出現脈搏次數增加的情形？","o":["禁食","甲狀腺素增加","急性疼痛","低血氧"],"a":"A","k":"A","t":"","x":"禁食、飢餓時新陳代謝降低，脈搏速率會下降。甲狀腺素增加使代謝率上升、急性疼痛刺激交感神經、低血氧時身體代償性增加心跳，皆會使脈搏次數增加。"},{"i":"108-1|41","e":"108-1","n":41,"c":1,"s":"有關影響生命徵象的因素，下列何者錯誤？","o":["抽菸會造成血壓上升，體溫偏高，呼吸速率增加","女性的體溫較高，脈率較高，呼吸速率較慢","大量出血時，會造成體溫下降，呼吸速率增加","使用鎮靜劑，會使呼吸速率下降，血壓下降"],"a":"B","k":"B","t":"","x":"女性體溫及脈率通常略高於男性，但男性肺容積較大、呼吸速率較慢，因此女性呼吸速率應較快，B錯誤。吸菸使血壓上升、體溫略升、呼吸增快；大量出血使體溫下降、呼吸代償性增快；鎮靜劑會抑制呼吸並使血管擴張、血壓下降。"},{"i":"108-1|42","e":"108-1","n":42,"c":1,"s":"病人因車禍導致身體多處挫傷，車禍當時呼吸急促、感覺呼吸不順、血壓下降，下列何者是造成病人呼吸變化最有可能的原因？","o":["疼痛","焦慮","內出血","副交感神經受刺激"],"a":"C","k":"C","t":"","x":"車禍多處挫傷後血壓下降、呼吸急促，最可能是內出血使血量減少；血壓下降時呼吸速率會代償性上升，以增加氧氣供應。疼痛與焦慮雖可使呼吸加快，但通常伴隨血壓上升；副交感神經受刺激則使心跳、呼吸變慢。"},{"i":"107-2|33","e":"107-2","n":33,"c":1,"s":"進行疼痛評估時，詢問病人「什麼情況會讓您的疼痛更嚴重？」此為收集下列何項評估資料？","o":["R：Region/ Radiation","Q：Quality/ Quantity","P：Provocative/ Palliative factor","T：Timing/ Temporal factor"],"a":"C","k":"C","t":"","x":"PQRST疼痛評估中，P（Provocative/Palliative factor）指誘發或緩解疼痛的因素，詢問「什麼情況會讓疼痛更嚴重」即屬此項。R為疼痛部位與擴散，Q為疼痛性質與程度，T為發生時間與持續時間。"},{"i":"107-2|36","e":"107-2","n":36,"c":1,"s":"有關體溫過低的症狀，下列敘述何者正確？","o":["體溫低於33℃時意識會喪失","發冷發抖、皮膚蒼白、冰冷","呼吸心跳變快","尿量增加"],"a":"B","k":"BA","t":"答A或B皆給分","x":"體溫過低初期會感覺冷、寒顫發抖，皮膚因血管收縮而蒼白、冰冷；隨後脈搏、呼吸變慢，尿量減少，故C、D錯。選項A因各教科書對意識喪失的體溫界定不一（約30～33℃間出現意識模糊至昏迷），故官方A、B皆給分，B為最確定的答案。"},{"i":"107-2|37","e":"107-2","n":37,"c":1,"s":"李女士為糖尿病患者，當她發生酮酸中毒的健康問題時，會出現下列何種呼吸型態？","o":["呼吸暫停（apnea）","呼吸過慢（bradypnea）","換氣不足（hypoventilation）","庫斯毛耳氏呼吸（Kussmaul’s respiration）"],"a":"D","k":"D","t":"","x":"糖尿病酮酸中毒時體內酸性物質堆積，身體以深而快的呼吸大量排出二氧化碳，代償代謝性酸中毒，稱為庫斯毛耳氏呼吸。呼吸暫停、呼吸過慢及換氣不足皆會使二氧化碳滯留，與代償方向相反。"},{"i":"107-2|38","e":"107-2","n":38,"c":1,"s":"江小姐，參與路跑活動後，出現大量流汗、皮膚蒼白濕冷、血壓降低、脈搏快而弱、頭痛及噁心的現象，下列敘述何者正確？①江小姐出現熱衰竭的情形 ②江小姐出現中暑的情形 ③稍微將下肢抬高 ④頭部稍為墊高","o":["①③","①④","②③","②④"],"a":"A","k":"A","t":"","x":"大量流汗、皮膚蒼白濕冷、血壓降低、脈搏快而弱、頭痛噁心，為熱衰竭的表現；中暑則以體溫極高、皮膚乾熱無汗、意識改變為特徵。熱衰竭應移至陰涼處平躺、稍抬高下肢以增加回心血量，並補充水分與電解質。"},{"i":"107-2|39","e":"107-2","n":39,"c":1,"s":"有關脈搏之敘述，下列何者錯誤？","o":["脈率與呼吸的比例為4：1","脈搏次數與心輸出量相關","脈壓（pulse pressure）是指心臟收縮時血流衝擊在血管壁上的力量大小","脈律（pulse rhythm）是指心跳之間的間隔"],"a":"C","k":"C","t":"","x":"心臟收縮時血液衝擊動脈管壁力量的大小稱為脈量（pulse volume），脈壓則是收縮壓減舒張壓的差值，故C錯。脈率與呼吸比約4：1；心輸出量＝心搏出量×心跳速率；脈律指每次脈搏跳動的間隔，A、B、D皆正確。"},{"i":"107-2|40","e":"107-2","n":40,"c":1,"s":"測量心臟血管疾病成年病人之每分鐘心跳次數，下列敘述何者正確？","o":["應測量心尖脈","常測量橈動脈","聽診右胸第三肋間心音","測量15秒心跳數再乘以四"],"a":"A","k":"A","t":"","x":"心臟血管疾病、心律不整或服用毛地黃者，應聽診心尖脈並測足1分鐘，以準確評估心跳次數與節律。成人心尖脈位於左側第五肋間與鎖骨中線交會處，非右胸第三肋間；只測15秒乘四易低估不規則的心跳。"},{"i":"107-1|36","e":"107-1","n":36,"c":1,"s":"林女士體溫由36.2℃增加至37.2℃，其新陳代謝率可能增加多少%？","o":["10%","13%","15%","18%"],"a":"B","k":"B","t":"","x":"體溫每上升1℃，新陳代謝率約增加13%；林女士體溫由36.2℃上升至37.2℃，增加1℃，新陳代謝率約增加13%，故選(B)。這也是發燒時心跳、呼吸加快及耗氧量增加的原因。"},{"i":"107-1|38","e":"107-1","n":38,"c":1,"s":"有關發燒型態，下列敘述何者正確？","o":["病人出現弛張熱時，其體溫會出現正常的情形","手術後傷口感染的病人可能出現回歸熱","病人體溫一直維持在高於正常的情形，可能是回歸熱","瘧疾病人最常出現的發燒型態為恆常熱"],"a":"B","k":"B","t":"","x":"回歸熱為體溫急遽上升達39℃以上，持續數日後恢復正常，數日後又再出現高熱，常見於術後傷口感染及霍奇金氏病，故選(B)。弛張熱體溫均高於正常，不會降到正常；體溫持續維持高於正常且波動小為恆常熱；瘧疾最常見間歇熱。"},{"i":"107-1|39","e":"107-1","n":39,"c":1,"s":"有關測量血壓的敘述，下列何者錯誤？","o":["如果要了解個體平時血壓狀態，建議每次測量同一部位","正常時左右手臂血壓值差異值介於20～30 mmHg之間","聽診隙經常出現於柯氏音（Korotkoff 's sounds）之第一期與第二期之間","需重複測量時，建議間隔1～2分鐘後再測"],"a":"B","k":"B","t":"","x":"正常時右手臂血壓約比左手臂高5～15 mmHg，差異達20～30 mmHg屬異常，故(B)錯誤。了解平時血壓宜每次測量同一部位；聽診間隙常出現於柯氏音第一期與第二期之間；重複測量需放鬆壓脈帶，間隔1～2分鐘以免靜脈充血。"},{"i":"107-1|40","e":"107-1","n":40,"c":1,"s":"測量成人病人脈搏時，發現速率超過100次／分鐘，間隔時間長短不一，其先後相繼無一定的節律，呈現跳幾下停一下的狀況，病人脈搏所呈現的脈律不整，下列何者最有可能？①二重脈 ②三重脈 ③間歇脈 ④心搏過速","o":["①③","①④","②④","③④"],"a":"D","k":"D","t":"","x":"脈搏跳動間隔時間長短不一、無固定節律，呈跳幾下停一下，為間歇脈（③）；成人脈搏速率超過100次/分為心搏過速（④），故選③④。二重脈為一強一弱交替出現，三重脈為兩次正常搏動後接一次較弱搏動，皆有固定節律。"},{"i":"107-1|41","e":"107-1","n":41,"c":1,"s":"血壓收縮壓146 mmHg，舒張壓82 mmHg，其脈搏壓為多少？","o":["52 mmHg","64 mmHg","76 mmHg","88 mmHg"],"a":"B","k":"B","t":"","x":"脈搏壓＝收縮壓－舒張壓＝146－82＝64 mmHg，故選(B)。脈搏壓可反映動脈管壁張力及心搏出量。"},{"i":"107-1|50","e":"107-1","n":50,"c":1,"s":"臨終病人的脈搏，較易測得的部位是：","o":["橈動脈","頸動脈","股動脈","足背動脈"],"a":"B","k":"B","t":"","x":"臨終病人血壓下降、周邊循環不良，周邊動脈脈搏微弱不易測得，頸動脈位置較接近心臟、血管較粗，較容易測得脈搏，故選(B)。測量時不可同時按壓雙側頸動脈。"},{"i":"106-2|40","e":"106-2","n":40,"c":1,"s":"決定血壓中舒張壓變動的主要因素，下列何者正確？","o":["周邊血管阻力","全身循環血量","血液黏稠度","心室收縮力"],"a":"A","k":"A","t":"","x":"周邊血管阻力與小動脈平滑肌的收縮有關，是造成舒張壓變動的主要因素，故選(A)。全身循環血量、血液黏稠度及心室收縮力雖然也會影響血壓，但並非決定舒張壓變動的主要因素。"},{"i":"106-2|41","e":"106-2","n":41,"c":1,"s":"身體散熱的主要途徑，下列何者正確？","o":["皮膚","呼吸","排尿","唾液"],"a":"A","k":"A","t":"","x":"皮膚散熱量約占總散熱量的70%，經由輻射、傳導、對流及蒸發散熱，為身體散熱的主要途徑，故選(A)。呼吸散熱約占29%，經由排尿、排便及唾液散熱僅約1%。"},{"i":"106-2|42","e":"106-2","n":42,"c":1,"s":"發燒初期（onset），病人出現的症狀，下列何者正確？①呼吸速率加快 ②呼吸速率不變 ③呼吸速率變慢 ④皮膚較蒼白 ⑤皮膚顏色不變 ⑥皮膚發紅","o":["①④","②⑤","③⑥","①⑥"],"a":"A","k":"A","t":"","x":"發燒初期（發作期）為了提高體溫至新的設定點，表皮血管收縮以保存體熱，皮膚呈現蒼白、冰冷（④）；同時新陳代謝率增加，二氧化碳產量上升，刺激呼吸中樞使呼吸變快變深（①），故選①④。皮膚發紅、發燙則出現於發熱期。"},{"i":"106-2|43","e":"106-2","n":43,"c":1,"s":"有關影響體溫的因素，下列何者正確？①甲狀腺素的分泌會使體溫升高 ②正常人一天當中體溫變動在0.5～2.5℃之間 ③排卵後，體溫上升 ④長期使用Morphine會使體溫下降 ⑤吸菸後，體溫會偏高","o":["①②③","①③⑤","②③④","①④⑤"],"a":"B","k":"B","t":"","x":"甲狀腺素會增加細胞代謝速率使體溫升高（①）；排卵後黃體素增加，使體溫上升約0.3～0.6℃（③）；吸菸會使體溫略微上升（⑤），故選①③⑤。正常人一天中體溫變動約在0.5～1℃之間，2.5℃過大，故②錯誤；④亦非正確敘述。"},{"i":"106-2|44","e":"106-2","n":44,"c":1,"s":"有關影響血壓的因素，下列何者錯誤？","o":["膀胱脹滿會使血壓上升","天氣寒冷會使血壓上升","顱內壓增高時，血壓上升","飲酒過多，血壓上升"],"a":"D","k":"D","t":"","x":"酒精會使周邊血管擴張，因而使血壓下降，故「飲酒過多，血壓上升」錯誤，選(D)。膀胱脹滿的不適刺激、寒冷使周邊血管收縮、顱內壓增高時的代償反應，皆會使血壓上升。"},{"i":"106-2|45","e":"106-2","n":45,"c":1,"s":"因心律不整造成缺血性中風，導致左側偏癱且右手點滴滴注的病人測量其血壓時，下列何者正確？","o":["可測量右下肢肢體血壓","血壓可連續測量三次，以最後一次數值為主","測量時放氣速度太慢易形成收縮壓偏高","測量時聽診器應放置於尺動脈處"],"a":"A","k":"A","t":"","x":"偏癱的患側及有靜脈注射的手臂皆禁止測量血壓，此病人左側偏癱且右手有點滴，雙上肢皆不適用，可改測下肢膝膕動脈的血壓，故選(A)。心律不整者宜連續測量三次取平均值；放氣速度太慢會造成靜脈充血，使舒張壓偏高；測量手臂血壓時聽診器應置於肱動脈處。"},{"i":"106-1|2","e":"106-1","n":2,"c":1,"s":"下列那一種健康問題會導致體溫過高？","o":["脫水","大出血","營養不良","酒精中毒"],"a":"A","k":"A","t":"","x":"脫水時體液不足，皮膚排汗及蒸發散熱減少，使體熱無法有效散失而造成體溫過高，故選(A)。大量出血、營養不良會使產熱減少、體溫下降；酒精會使周邊血管擴張而增加散熱，也易導致體溫過低。"},{"i":"106-1|37","e":"106-1","n":37,"c":1,"s":"陳先生剛從大陸返台，持續兩天高燒不退，至門診就醫治療，主訴：這兩天身體一直燙燙的，耳溫都約維持38.5～39.5℃。下列何者是陳先生可能的發燒型態？","o":["恆常熱（constant fever）","弛張熱（remittent fever）","回歸熱（relapsing fever）","間歇熱（intermittent fever）"],"a":"A","k":"A","t":"","x":"恆常熱為體溫持續處於高熱狀態，24小時內最高與最低溫差不超過1℃；陳先生兩天體溫持續維持在38.5～39.5℃，波動約1℃，最符合恆常熱，故選(A)。弛張熱24小時波動可達2℃以上；間歇熱為高熱與正常體溫交替；回歸熱為高熱數日後恢復正常，數日後又再發燒。"},{"i":"106-1|38","e":"106-1","n":38,"c":1,"s":"（情境：陳先生剛從大陸返台，持續兩天高燒不退，至門診就醫治療，主訴：這兩天身體一直燙燙的，耳溫都約維持38.5～39.5℃。）下列那些發燒的護理措施不恰當？","o":["維持室內溫度低於一般室溫","適時給予口腔衛生及清潔","請家屬多些人來陪伴，以減少病人焦慮不安的情緒","採少量多餐，並提供清淡與高熱量之營養食品"],"a":"C","k":"C","t":"","x":"發燒病人應臥床休息以減少產熱，請多位家屬陪伴會干擾休息，若為感染性疾病也增加傳染風險，故(C)不恰當。維持室溫略低於一般室溫有助散熱；口腔衛生可減少口乾與異味；少量多餐並提供清淡、高熱量、易消化的飲食為正確措施。"},{"i":"106-1|39","e":"106-1","n":39,"c":1,"s":"下列何者為造成血壓假性偏高的原因？","o":["壓脈帶包裹太鬆","視線高於水銀柱","壓脈帶太寬","被測量的手臂高於心臟"],"a":"A","k":"A","t":"","x":"壓脈帶包裹太鬆時，需要更大的壓力才能壓扁動脈，使測得的血壓假性偏高，故選(A)。視線高於水銀柱刻度會使讀值偏低；壓脈帶太寬會使血壓偏低；測量手臂高於心臟時，血壓亦會偏低。"},{"i":"106-1|40","e":"106-1","n":40,"c":1,"s":"熱中暑病人之救護措施，下列何者錯誤？","o":["移至陰涼處予以冷敷","採平躺，抬高上半身","限制活動以獲得充分休息","予以保暖促進流汗"],"a":"D","k":"D","t":"","x":"中暑為體溫調節失常、散熱障礙，處理原則為儘速降溫：移至陰涼處、冷敷、平躺並抬高上半身、限制活動充分休息。予以保暖會使體熱更無法散失，加重病情，故(D)錯誤。"},{"i":"106-1|41","e":"106-1","n":41,"c":1,"s":"照護1歲9個月的兒童時，測量生命徵象的順序，下列何者正確？","o":["呼吸→脈搏→體溫→血壓","血壓→體溫→呼吸→脈搏","體溫→血壓→呼吸→脈搏","脈搏→呼吸→血壓→體溫"],"a":"A","k":"A","t":"","x":"測量幼童生命徵象時，為避免哭鬧造成測量誤差，宜先測不需碰觸、最易受干擾的呼吸，再依序測量脈搏、體溫、血壓，故選(A)。"},{"i":"106-1|42","e":"106-1","n":42,"c":1,"s":"當血壓為146/82 mmHg時，平均動脈壓為多少？","o":["90 mmHg","98 mmHg","103 mmHg","113 mmHg"],"a":"C","k":"C","t":"","x":"平均動脈壓＝舒張壓＋1/3脈搏壓＝82＋(146－82)÷3＝82＋21.3≒103 mmHg，故選(C)。也可用1/3收縮壓＋2/3舒張壓計算，結果相同。"},{"i":"105-2|4","e":"105-2","n":4,"c":1,"s":"人體主要的散熱方式為何？","o":["經由皮膚傳導散熱","經由呼吸對流散熱","經由皮膚輻射散熱","經由皮膚和呼吸蒸發散熱"],"a":"C","k":"C","t":"","x":"人體大部分熱能經由皮膚散失，方式為輻射、傳導、對流及蒸發，其中休息狀態下約50～70%的熱能由輻射散失，為最主要的散熱方式，故選(C)。其餘依次為蒸發（約20～25%）、對流（約15%）及傳導（約3%）。"},{"i":"105-2|39","e":"105-2","n":39,"c":1,"s":"脈搏短絀（pulse deficit）的脈律特性為何？","o":["脈搏間隔時間長短不一，跳幾下停一下","脈搏快到無法測量且不規則","心尖脈與橈動脈的跳動不一致","有時脈動明顯，有時無法摸到"],"a":"C","k":"C","t":"","x":"脈搏短絀是心臟傳導功能異常，部分心搏無法有效將血液送至周邊，造成心尖脈次數多於橈動脈脈搏次數，兩者不一致，常見於心房纖維顫動，需同時測量心尖脈與橈動脈，故選(C)。(A)為間歇脈；(B)為跑脈。"},{"i":"105-2|40","e":"105-2","n":40,"c":1,"s":"有關呼吸型態的敘述，下列何者正確？","o":["庫斯摩爾氏呼吸（Kussmaul’s respiration）的呼吸次數經常大於20次/分，節律不規則","陳施氏呼吸（Cheyne-Stokes respiration），是淺而慢的規則型態","畢歐氏呼吸（Biot’s respiration），呼吸的頻率及深度規則","喟嘆式呼吸（Sighing respiration）常發生於大出血或臨終時"],"a":"D","k":"D","t":"","x":"嘆息式呼吸是深吸氣後再長長地吐氣，常見於過度換氣症候群、大出血或臨終病人，故(D)正確。庫斯摩爾氏呼吸為深而快且規則；陳施氏呼吸為由淺而深再變淺，接著呼吸暫停的週期性型態；畢歐氏呼吸的頻率與深度皆不規則，並夾雜呼吸暫停。"},{"i":"105-2|41","e":"105-2","n":41,"c":1,"s":"下列何種病人較不需要以測量一分鐘的心尖脈為脈搏值？","o":["新生兒","脈搏短絀者","一般5歲孩童","心律不整者"],"a":"C","k":"C","t":"","x":"心尖脈需聽診測足1分鐘，常用於新生兒、3歲以下嬰幼兒、服用毛地黃、心律不整、脈搏短絀需與橈動脈比較者等。一般5歲孩童可測量橈動脈脈搏，不一定需要測心尖脈，故選(C)。"},{"i":"105-2|42","e":"105-2","n":42,"c":1,"s":"熱中暑病人的生命徵象及臨床表徵，下列何者正確？","o":["皮膚蒼白濕冷","初期血壓上升","脈搏減緩","呼吸慢而深"],"a":"B","k":"B","t":"","x":"中暑時體溫調節中樞失調，初期交感神經興奮使脈搏加快、血壓上升，之後才因循環衰竭而血壓下降，故選(B)。中暑病人皮膚乾熱、潮紅而無汗；脈搏快而有力；呼吸快而淺。皮膚蒼白濕冷較符合熱衰竭表現。"},{"i":"105-2|43","e":"105-2","n":43,"c":1,"s":"寒流來襲，許先生將家中門窗緊閉，不久之後許先生感覺頭暈不適，造成病人此症狀之最可能原因為何？","o":["體內O2濃度上升，呼吸速率增快","體內CO2濃度上升，呼吸速率增快","體內O2濃度下降，呼吸速率減緩","換氣過度造成呼吸速率與深度增加"],"a":"B","k":"B","t":"","x":"門窗緊閉使室內空氣不流通，體內二氧化碳濃度上升，刺激化學接受器使呼吸速率增快，並可能出現頭暈不適，故選(B)。此情境為CO2濃度上升，不是O2上升；O2下降時呼吸也會代償性增快而非減慢；換氣過度則會使CO2排出過多。"},{"i":"105-2|56","e":"105-2","n":56,"c":1,"s":"腎臟衰竭病人，體溫38.7℃，下列衛教或護理措施，何者較不適當？","o":["維持室溫26℃","建議每日飲水3,000 c.c.","協助執行口腔護理","協助使用冰枕"],"a":"B","k":"B","t":"","x":"腎臟衰竭病人需依醫囑限制水分攝取，建議每日飲水3,000 c.c.會加重體液滯留與心腎負擔，故(B)較不適當。發燒病人可維持較低室溫、使用冰枕促進傳導散熱，並協助口腔護理以增進舒適。"},{"i":"105-1|40","e":"105-1","n":40,"c":1,"s":"下列針對發燒的護理措施，何者係依「輻射原理」所設計？","o":["依醫囑給予冰枕","維持病室空氣流通","移除過厚的衣物或被蓋","鼓勵攝取大量水分"],"a":"C","k":"C","t":"","x":"輻射是熱由一物體表面直接傳至另一物體，不需實質接觸，移除過厚衣物被蓋、穿著寬鬆衣物可增加輻射散熱，故選(C)。使用冰枕屬傳導散熱；維持空氣流通屬對流散熱；攝取水分是補充發燒時流失的體液，非輻射原理。"},{"i":"105-1|41","e":"105-1","n":41,"c":1,"s":"劇烈運動後，個體的呼吸會發生下列那一種反應？","o":["呼吸變深而快","呼吸變深而慢","呼吸變淺而快","呼吸由淺而快，逐漸變深而慢"],"a":"A","k":"A","t":"","x":"劇烈運動時肌肉代謝增加，耗氧量與二氧化碳產量上升，刺激化學接受器及呼吸中樞，使呼吸速率加快、深度加深，以增加氣體交換，故選(A)。"},{"i":"105-1|42","e":"105-1","n":42,"c":1,"s":"有關體溫測量的敘述，下列何者錯誤？","o":["協助嬰兒測量肛溫時，肛表插入深度為2吋","協助2歲兒童測量耳溫時，應將耳朵往下往後拉","耳溫測量的溫度與口溫相近","採用內科無菌技術"],"a":"A","k":"A","t":"","x":"嬰兒直腸短且黏膜脆弱，肛表僅需插入約0.5吋（約1.25公分），插入2吋過深易造成直腸損傷，故(A)錯誤。3歲以下幼兒測耳溫應將耳廓往下往後拉；耳溫與口溫相近；測量體溫屬清潔技術，採內科無菌原則。"},{"i":"105-1|43","e":"105-1","n":43,"c":1,"s":"有關生命徵象測量的敘述，下列何者錯誤？","o":["嬰幼兒需測量呼吸1分鐘","為兒童測量時，建議先測量呼吸","左手臂靠近心臟，所以左手臂測量的血壓會較右手臂為高","測量血壓時，需請病人勿談話及移動測量的肢體"],"a":"C","k":"C","t":"","x":"一般右手臂血壓較左手臂高約5～15 mmHg，首次測量應測雙手，之後以較高側為基準，故(C)錯誤。嬰幼兒呼吸不規則，需測足1分鐘；幼童宜依呼吸、脈搏、體溫、血壓順序測量，避免哭鬧影響；測血壓時談話或移動肢體會造成誤差。"},{"i":"105-1|44","e":"105-1","n":44,"c":1,"s":"有關人體維持血壓因素的敘述，下列何者正確？","o":["末梢血管阻力，會影響舒張壓的高低","當血比容大於50%時，會導致血壓下降","組織胺會使血管收縮，血壓上升","控制血管收縮和舒張的中樞位於下視丘"],"a":"A","k":"A","t":"","x":"周邊（末梢）血管阻力與小動脈平滑肌有關，是造成舒張壓變動的主要因素，故選(A)。血比容增加使血液黏滯性上升，血壓會上升；組織胺使血管擴張、血壓下降；血管運動中樞位於延腦而非下視丘。"},{"i":"105-1|45","e":"105-1","n":45,"c":1,"s":"有關耳溫槍測量體溫的敘述，下列何者正確？","o":["測量3歲以下兒童時，耳朵往上往後拉","耳道發炎病人耳溫槍應輕放於耳道入口","耳垢過多會影響耳溫數值","耳道溫度應高於肛溫"],"a":"C","k":"C","t":"","x":"耳溫槍以紅外線偵測耳膜的熱輻射，耳垢過多會阻擋偵測而影響數值，故選(C)。3歲以下幼兒應將耳廓往下往後拉；耳朵疾病為耳溫測量的禁忌；各部位體溫為肛溫最高，耳溫低於肛溫。"},{"i":"104-2|38","e":"104-2","n":38,"c":1,"s":"羅先生32歲因車禍外傷大量出血住院，測量個案呼吸時發現張口呼吸、鼻翼外展、使用呼吸輔助肌以及心跳速率增加，影響羅先生呼吸的因素，下列何者錯誤？","o":["交感神經受刺激","血壓突然上升","大量出血","疼痛"],"a":"B","k":"B","t":"","x":"大量出血使血量減少、血壓下降，呼吸速率會代償性增快；血壓突然上升則會刺激壓力接受器造成反射性呼吸減慢，與羅先生狀況不符，故B錯誤。疼痛與情緒刺激交感神經、血色素下降使攜氧能力降低，皆會使呼吸加快。"},{"i":"104-2|39","e":"104-2","n":39,"c":1,"s":"有關凍瘡的敘述，下列何者正確？","o":["常發生於身體之軀幹","凍瘡處可以使用烤燈增加溫度","可按摩凍瘡處，增加血液循環","凍瘡處可浸泡溫水，水溫由10℃～15℃開始浸泡"],"a":"D","k":"D","t":"","x":"凍瘡處理應浸泡溫水，由較低水溫開始逐漸回溫，且不可搓揉按摩以免摩擦造成組織傷害，故D正確。凍瘡好發於耳垂、鼻尖、手指、腳趾等末梢；凍瘡部位感覺遲鈍，使用烤燈易造成燙傷。"},{"i":"104-2|40","e":"104-2","n":40,"c":1,"s":"有關換氣過度的現象，下列敘述何者正確？","o":["常出現於焦慮害怕者","呼吸速率超過20次/分，但深度不變或是微減","常出現在麻醉劑使用過量者","常造成血液中氧氣下降，二氧化碳過多"],"a":"A","k":"A","t":"","x":"換氣過度常見於焦慮、害怕、情緒激動者，呼吸速率與深度均增加，使二氧化碳排出過多、血中二氧化碳分壓下降，導致呼吸性鹼中毒。麻醉劑過量會抑制呼吸造成呼吸過緩。"},{"i":"104-2|41","e":"104-2","n":41,"c":1,"s":"有關脈搏測量部位的敘述，下列何者正確？","o":["嬰幼兒較容易觸摸到搏動，且較常測量的部位為頸動脈","位在足內踝後方的測量部位為足背動脈","肱動脈位在手肘彎偏外側處","稍微彎曲膝蓋較容易測得膝膕動脈"],"a":"D","k":"D","t":"","x":"測量膝膕動脈時需稍微彎曲膝關節使膕窩肌肉放鬆，較容易觸摸到搏動。嬰幼兒宜聽心尖脈或測肱動脈，頸動脈不適合；足內踝後方為脛後動脈；肱動脈位於肘彎偏內側。"},{"i":"104-2|42","e":"104-2","n":42,"c":1,"s":"下列何項因素可能會導致病人體溫過低？","o":["甲狀腺機能亢進","身體有炎症反應","血糖過低","罹患癌症"],"a":"C","k":"C","t":"","x":"血糖過低時細胞缺乏代謝能量來源，產熱減少，並常伴隨大量出汗，可導致體溫下降；禁食、飢餓亦使體溫下降。甲狀腺機能亢進、炎症反應及惡性腫瘤會增加代謝或產生致熱原，使體溫上升。"},{"i":"104-2|43","e":"104-2","n":43,"c":1,"s":"陳先生因高血壓、心臟病引發缺血性中風造成左側肢體偏癱，右手0.9% NS 500 mL點滴滴注中，下列護理措施何者正確？","o":["血壓最好兩側上肢肢體輪流測量以免數值有偏差","測量脈搏數值宜以聽診器聽診心尖搏動","測量脈搏時間以15秒為宜","壓脈帶綁太緊時易造成血壓數值假性偏高"],"a":"B","k":"B","t":"","x":"陳先生有心臟病，脈搏可能不規則，宜以聽診器聽心尖脈並測足1分鐘，故B正確。左側偏癱、右手點滴，兩側上肢皆不宜測血壓，不可輪流測量；測脈搏不宜只測15秒；壓脈帶綁太緊會提早阻斷血流，使數值偏低而非偏高。"},{"i":"104-1|38","e":"104-1","n":38,"c":1,"s":"白先生，50歲，中風，左側偏癱，呼吸不規則，出現脈搏短絀，尿液呈現深琥珀色，入院治療。協助白先生測量生命徵象時，下列敘述何者錯誤？","o":["測量血壓時，壓脈帶需綁在右側上臂","測量耳溫時，需將耳朵往上往後拉","測量呼吸時，可將測30秒後之數值乘以2得之","測量血壓時，如需重複測量，可在休息3分鐘後，重新測量"],"a":"C","k":"C","t":"","x":"白先生呼吸不規則，應測量足1分鐘，不可測30秒再乘以2，故C錯誤。左側偏癱應測右上臂血壓；成人測耳溫需將耳廓往上往後拉；重複測量血壓需放鬆壓脈帶並休息後再測，以免靜脈充血影響數值。"},{"i":"104-1|39","e":"104-1","n":39,"c":1,"s":"（情境：白先生，50歲，中風，左側偏癱，呼吸不規則，出現脈搏短絀，尿液呈現深琥珀色，入院治療。）白先生出現脈搏短絀的情形，下列敘述何者錯誤？","o":["白先生可能有心臟傳導功能失效的問題","護理師需同時測量心尖脈及橈動脈才可判斷","白先生之橈動脈次數大於心尖脈次數","心尖脈與橈動脈次數的差距稱為「脈搏差」"],"a":"C","k":"C","t":"","x":"脈搏短絀是因心臟傳導功能失效，部分心搏無法有效將血液送至周邊，使心尖脈次數大於橈動脈次數（HR＞PR），故C錯誤。判斷時需同時測量心尖脈與橈動脈，兩者差距稱為脈搏差，常見於心房纖維顫動。"},{"i":"104-1|42","e":"104-1","n":42,"c":1,"s":"下列何種情況仍可測量該側的血壓？","o":["腋下淋巴摘除手術的患側上肢","靜脈注射之手臂","偏癱的患側","中心靜脈導管同側的肢體"],"a":"D","k":"D","t":"","x":"禁止測量血壓的部位包括靜脈注射的手臂、動靜脈瘻管側、乳房或腋下手術患側、上石膏或大型繃帶側及偏癱患側，以免影響輸液、循環或測值不準。中心靜脈導管多置於頸部或鎖骨下靜脈，不在上臂測壓處，仍可測量該側血壓。"},{"i":"104-1|43","e":"104-1","n":43,"c":1,"s":"測量服用毛地黃藥物之病人心跳時，下列敘述何者正確？","o":["橈動脈脈跳是52次／分時，應為正常現象","測量心尖脈為52次／分時，隔15分鐘後需再測量一次","測量心尖脈15秒為13次時，每分鐘心跳為52次","竇性心律不整是指吸氣時脈量減弱，呼氣時脈量增強"],"a":"B","k":"B","t":"","x":"服用毛地黃前應測量心尖脈足1分鐘，若心跳低於60次／分應暫停給藥，並隔一段時間再測量確認、報告醫師，故B正確。52次／分屬心搏過緩並非正常；服用毛地黃者不可只測15秒再乘以4；竇性心律不整是吸氣時脈率增快、呼氣時減慢，吸氣時脈搏消失是奇異脈。"},{"i":"103-2|25","e":"103-2","n":25,"c":1,"s":"有關人體輻射性散熱的敘述，下列何者正確？①人體在室溫中，以輻射方式散失的能量最多 ②人體表面血管擴張時可利用輻射原理降低體溫 ③人體皮膚顏色會影響輻射散熱程度 ④人體在室溫較高的環境中，輻射性散熱的比率也較高","o":["①②③","①②④","①③④","②③④"],"a":"A","k":"A","t":"","x":"休息狀態下約50～70%熱能由輻射散失，為最主要散熱方式；周邊血管擴張可增加輻射散熱；膚色、姿勢、衣服顏色均會影響輻射散熱，故①②③正確。輻射散熱取決於物體間溫度差，室溫越高溫差越小，輻射散熱反而減少，④錯誤。"},{"i":"103-2|36","e":"103-2","n":36,"c":1,"s":"下列何者為臨終病人常會出現的異常呼吸型態？","o":["呼吸過速（Tachypnea）","喟嘆式呼吸（Sighing Respiration）","陳施氏呼吸（Cheyne-Stokes Respiration）","哮鳴（Wheezing）"],"a":"B","k":"BC","t":"答B或C或BC皆給分","x":"臨終病人因呼吸中樞功能衰退，常出現深吸氣後長長吐氣的喟嘆式呼吸，以及呼吸由淺至深再轉淺並夾雜暫停的陳施氏呼吸，兩者皆屬常見，故官方B、C皆給分。呼吸過速多見於發燒、焦慮；哮鳴為小支氣管痙攣所致。"},{"i":"103-2|37","e":"103-2","n":37,"c":1,"s":"下列那一種荷爾蒙分泌增加時會使體溫降低？","o":["雄性激素（Testosterone）","動情激素（Estrogen）","甲狀腺素（Thyroxin）","腎上腺素（Adrenaline）"],"a":"B","k":"B","t":"","x":"女性月經週期中，排卵前動情素增加，體溫平均下降約0.3℃；排卵後黃體素增加使體溫上升。甲狀腺素、腎上腺素會增加細胞代謝率使體溫上升，雄性激素亦會提高代謝。"},{"i":"103-2|38","e":"103-2","n":38,"c":1,"s":"發燒初期病人會出現下列那一種生理反應？","o":["寒顫","頭痛","皮膚發紅","肌肉關節疼痛"],"a":"A","k":"A","t":"","x":"發燒開始期（發作期）因體溫設定點上升，骨骼肌顫抖以增加產熱，病人出現寒顫、皮膚蒼白冰冷。皮膚發紅發燙、肌肉關節疼痛、頭痛等多出現在體溫達最高點的發熱期。"},{"i":"103-1|9","e":"103-1","n":9,"c":1,"s":"（情境：白小姐，32歲，剖腹產後入住產後病房，主訴腹痛、微喘與心悸，護理師為她測量生命徵象，並觀察到白小姐臉色蒼白，呼吸急促，整片看護墊已沾滿血液。）以水銀血壓計測量白小姐的血壓，聽診器聽到下列聲音：壓脈帶充氣到140 mmHg後開始放氣，在108 mmHg時聽到第一個聲音（尖實的重聲），在100 mmHg時聲音開始轉變成瑟瑟聲，到88 mmHg時聲音比第一個聲音清脆，到76 mmHg時逐漸變成低沉聲，到60 mmHg時聲音完全消失。下列敘述何者正確？","o":["第一舒張壓為76 mmHg","血壓為140/60 mmHg","平均血壓為84 mmHg","脈搏壓為32 mmHg"],"a":"A","k":"A","t":"","x":"依科氏音分期：108 mmHg第一期為收縮壓，76 mmHg聲音變低沉（第四期）為第一舒張壓，60 mmHg聲音消失（第五期）為第二舒張壓，血壓記為108/76/60 mmHg，故A正確。140 mmHg只是充氣壓力；脈搏壓為收縮壓減舒張壓（108－60＝48 mmHg），平均動脈壓亦非84 mmHg。"},{"i":"103-1|16","e":"103-1","n":16,"c":1,"s":"下列那一個部位無法確實觀察到病人發紺的情形？","o":["皮膚","指甲床","嘴唇","鞏膜"],"a":"D","k":"D","t":"","x":"發紺是血中缺氧使皮膚黏膜呈青紫色，評估呼吸狀態時應觀察皮膚、指甲床、嘴唇及黏膜顏色。鞏膜為白色結締組織，主要用來觀察有無黃疸，無法確實觀察發紺。"},{"i":"103-1|39","e":"103-1","n":39,"c":1,"s":"孫女士因急性心衰竭入院，digoxin 0.5 mg 1# 口服，給藥前測量孫女士脈搏，下列敘述何者錯誤？","o":["需測量心尖脈，在第五肋間與左鎖骨中線交叉點","因顧慮個案隱私，所以測量30秒即可","需評估頻率、節律、脈壓及脈量","每次測量應採同一種姿勢"],"a":"B","k":"B","t":"","x":"服用毛地黃（digoxin）及心臟疾病病人應測量心尖脈，且必須測足1分鐘，不可只測30秒再乘以2，故B錯誤。心尖脈位於第五肋間與左鎖骨中線交叉處，應評估速率、節律、強度及脈量，並以相同姿勢測量以便比較。"},{"i":"103-1|40","e":"103-1","n":40,"c":1,"s":"嗎啡類藥物使用過量時的呼吸型態為：","o":["呼吸過速","換氣過度","呼吸過慢","呼吸短促"],"a":"C","k":"C","t":"","x":"嗎啡等麻醉性止痛劑（鴉片類藥物）會抑制延腦呼吸中樞，使呼吸速率變慢、變淺，過量時出現呼吸過緩甚至呼吸抑制。呼吸過速、換氣過度多與焦慮、發燒或缺氧有關。"},{"i":"103-1|41","e":"103-1","n":41,"c":1,"s":"林先生住院檢查後診斷為膽結石合併膽囊炎，接受膽囊切除手術治療，術後三天，體溫高高低低，有時正常有時發燒，則林先生的發燒類型為：","o":["恆常熱（constant fever）","弛張熱（remittent fever）","間歇熱（intermittent fever）","回歸熱（relapsing fever or recurrent fever）"],"a":"D","k":"D","t":"","x":"回歸熱（復發熱）是體溫急遽上升數日後恢復正常，再經數日又出現高熱，呈規律性反覆升降，常見於術後傷口感染，林先生術後體溫時高時正常即屬此型。恆常熱持續高溫且變化小於1℃；弛張熱24小時波動大於2℃但都高於正常；間歇熱常見於瘧疾、敗血症。"},{"i":"103-1|42","e":"103-1","n":42,"c":1,"s":"湯先生的脈壓屬於高壓脈，下列敘述何者正確？","o":["觸摸起來感覺血管軟且搏動不明顯","因動脈管壁鬆弛，血管內壓力下降所致","是一種異常脈壓，容易發生在心肌梗塞病人休克時","容易出現在老年人、動脈硬化、高血壓的病人"],"a":"D","k":"D","t":"","x":"高壓脈（硬脈）是指觸摸時血管硬、搏動有力，因動脈管壁彈性降低或血管內壓力上升所致，常見於老年人、動脈硬化及高血壓病人。血管軟、搏動不明顯、管壁鬆弛壓力下降及休克時出現的是低壓脈（軟脈）。"},{"i":"103-1|43","e":"103-1","n":43,"c":1,"s":"（情境：張老太太，79歲，心律不整，呼吸呈現畢歐氏呼吸（Biot’s respiration）。）為張老太太測量血壓時，下列方式何者正確？","o":["需將張老太太手臂支托墊高，使手臂與心臟同高","必須使用水銀血壓計測量","正常情況下，左手臂的血壓應較右手臂的血壓高10 mmHg","放氣的速度控制在每秒10 mmHg"],"a":"A","k":"A","t":"","x":"測量血壓時受測肢體應有支托並與心臟同高，若低於心臟會使測得值偏高、高於心臟則偏低。水銀血壓計已禁止生產，可用非液體或電子血壓計；正常右手臂血壓較左手高5～15 mmHg；放氣速度宜每秒2～3 mmHg，每秒10 mmHg過快。"},{"i":"103-1|44","e":"103-1","n":44,"c":1,"s":"（情境：張老太太，79歲，心律不整，呼吸呈現畢歐氏呼吸（Biot’s respiration）。）張老太太可能出現的呼吸型態為：","o":["呼吸速度及深度由緩而淺，逐漸增加速率及深度","呼吸節律規則，但深度增加，速率變快","呼吸速度及深度均不規則","呼吸深度變淺，速率變慢"],"a":"C","k":"C","t":"","x":"畢歐氏呼吸（Biot’s respiration）是呼吸速率與深度均不規則，並夾雜不定時的呼吸暫停，常見於腦部損傷。呼吸由淺而深再由深而淺並出現暫停，是陳施氏（潮式）呼吸；深度與速率增加而規則者為庫斯毛耳氏呼吸。"},{"i":"103-1|52","e":"103-1","n":52,"c":1,"s":"有關瀕死個案可能出現的呼吸型態改變，下列何者正確？①畢歐式呼吸（Biot’s respiration） ②潮氏呼吸（Cheyne-Stokes respiration）漸變強、變快 ③庫斯毛耳氏呼吸（Kussmaul’s breathing） ④喟嘆式呼吸（Sighing respiration）","o":["①②","②③","②④","③④"],"a":"C","k":"C","t":"","x":"瀕死病人因腦部缺氧、呼吸中樞功能衰退，常出現陳施氏（潮式）呼吸，呼吸由淺慢漸變深快再轉淺慢並夾雜暫停；也常見深吸氣後長長吐氣的喟嘆式呼吸，故選②④。畢歐氏呼吸多見於腦部損傷，庫斯毛耳氏呼吸則見於代謝性酸中毒。"},{"i":"102-2|20","e":"102-2","n":20,"c":1,"s":"有關發燒病患的護理措施，下列敘述何者正確？","o":["溫水拭浴的水溫為37.7～40℃","頭部使用冰枕時，則選擇測量腋溫","可選擇使用烤燈，以促進排汗降溫","可選擇25℃的冷水浸泡，以利降溫"],"a":"B","k":"B","t":"","x":"頭部使用冰枕會影響頭頸部（口腔、耳道）的溫度，宜改測腋溫以免誤差。溫水拭浴水溫為27～37℃而非37.7～40℃；烤燈僅用於發作期寒顫時保暖，不用於促進排汗降溫；以25℃冷水浸泡易引起寒顫反而增加產熱。"},{"i":"102-2|29","e":"102-2","n":29,"c":1,"s":"高血壓病患服用那一種藥物要特別注意血壓上升的變化？","o":["利尿劑","鎮靜劑","硝化甘油（nitroglycerin）","動情素"],"a":"D","k":"D","t":"","x":"腎上腺素、抗組織胺、動情素、皮質類固醇等藥物會使血管收縮而使血壓上升，高血壓病人服用時需特別注意。利尿劑、鎮靜劑及硝化甘油則會使血管擴張或血量減少而使血壓下降。"},{"i":"102-2|31","e":"102-2","n":31,"c":1,"s":"收縮壓為何處對血管壁所造成的壓力？","o":["右心室","右心房","左心室","左心房"],"a":"C","k":"C","t":"","x":"收縮壓是左心室收縮將血液打入主動脈時，血液對動脈管壁所造成的最高壓力。右心室負責肺循環，心房收縮壓力低，均不是體循環收縮壓的來源。"},{"i":"102-2|32","e":"102-2","n":32,"c":1,"s":"林先生主訴好冷，蓋被後仍不斷的發抖、寒顫，呼吸快且深，皮膚發紺，則林先生現正處於發燒過程的那一期？","o":["發作期","退熱期","發熱期","休止期"],"a":"A","k":"A","t":"","x":"發燒開始期（發作期）因體溫設定點上升，身體藉血管收縮與骨骼肌顫抖來保存及增加產熱，病人感覺寒冷、寒顫發抖、呼吸變快變深，皮膚蒼白冰冷甚至指甲床發紺。發熱期皮膚發紅發燙，退熱期則以出汗、皮膚潮紅為主。"},{"i":"102-2|52","e":"102-2","n":52,"c":1,"s":"下列何種情況，可測量口溫？","o":["氣喘","癲癇","急性腸炎","鼻竇炎剛手術後"],"a":"C","k":"C","t":"","x":"急性腸炎屬肛溫的禁忌，但不影響口溫測量。氣喘病人呼吸困難需張口呼吸、癲癇病人可能咬碎體溫計、鼻竇炎術後鼻腔填塞需經口呼吸，均不宜測量口溫。"},{"i":"102-1|15","e":"102-1","n":15,"c":1,"s":"有關呼吸情形的敘述，下列何者錯誤？","o":["腦膜炎病人通常會出現陳施氏呼吸型態（Cheyne-Stokes respiration）","抽菸會使呼吸速率加快","小孩呼吸速率高於成人","COPD病人屬於快而淺之呼吸型態"],"a":"D","k":"D","t":"","x":"慢性阻塞性肺疾病（COPD）病人因氣道阻塞，常有呼氣延長並採噘嘴呼吸，呈現較緩慢而深的呼吸型態，而非快而淺，故(D)錯誤。腦膜炎等中樞神經病變可出現陳施氏呼吸；長期抽菸會使呼吸速率加快；年齡與呼吸速率成反比，故小孩呼吸速率高於成人。"},{"i":"102-1|37","e":"102-1","n":37,"c":1,"s":"林先生體溫為38.6℃，護理師觀察到的生理反應，下列何者正確？","o":["皮膚蒼白發冷","呼吸加快","脈搏變慢","尿量變多"],"a":"B","k":"B","t":"","x":"發燒時新陳代謝率增加，二氧化碳產量增加刺激呼吸中樞，使呼吸加快加深，脈搏亦隨之加快。皮膚蒼白發冷出現在發燒開始期（寒顫期）；發熱期因出汗及體液喪失，尿量減少、顏色變深，而非尿量變多。"},{"i":"102-1|38","e":"102-1","n":38,"c":1,"s":"湯先生因高血壓入院治療，當護理師為其測量脈搏時發現速率為 68 次/分、強度為 3+、脈壓屬於高壓脈。依湯先生的情況來判斷，其可能出現的是下列何種脈搏類型？","o":["洪脈（bounding pulse）","弦脈（wiry pulse）","絲脈（thready pulse）","交替脈（pulse alternans）"],"a":"A","k":"A","t":"","x":"洪脈（bounding pulse）是心搏出量大、脈搏壓大時出現的強而有力、飽滿的脈搏，強度為3+，常見於高血壓、發燒或運動後。弦脈與絲脈為脈搏壓下降、搏出量減少的細弱脈；交替脈則為節律規則但強弱交替出現的脈搏。"},{"i":"102-1|39","e":"102-1","n":39,"c":1,"s":"王小弟出生滿8個月，測得的脈搏為120次/分，下列何者為其脈率？","o":["跑脈","心搏過速","正常脈搏","脈律不整"],"a":"C","k":"C","t":"","x":"年齡與脈搏速率成反比，嬰兒正常脈搏速率約為每分鐘100～160次，8個月大嬰兒測得120次／分屬正常範圍。跑脈為細、快、不規則且可達150次以上的脈搏；心搏過速需超過該年齡的正常範圍；題中並未提到節律不規則，故非脈律不整。"},{"i":"102-1|40","e":"102-1","n":40,"c":1,"s":"代謝性酸中毒病人會出現下列那一種呼吸型態？","o":["換氣不足（Hypoventilation）","畢歐氏呼吸（Biot’s respiration）","庫斯毛耳氏呼吸（Kussmaul’s respiration）","陳施氏呼吸（Cheyne-Stokes respiration）"],"a":"C","k":"C","t":"","x":"代謝性酸中毒（如糖尿病酮酸中毒）時，身體會以深而快的庫斯毛耳氏呼吸排出過多的二氧化碳，以代償血中過多的酸。換氣不足見於代謝性鹼中毒的代償；畢歐氏呼吸與陳施氏呼吸則多見於腦部損傷或臨終病人。"},{"i":"102-1|41","e":"102-1","n":41,"c":1,"s":"當病人血壓突然上升時，會發生下列何種呼吸反應？","o":["呼吸變快","呼吸變慢","出現喟嘆式呼吸（Sighing respiration）","出現庫斯毛耳氏呼吸（Kussmaul’s respiration）"],"a":"B","k":"B","t":"","x":"血壓突然上升時，壓力會作用於頸動脈竇和主動脈竇的壓力接受器，經反射使呼吸變慢；相反地，血壓下降時呼吸速率會上升。喟嘆式呼吸見於過度換氣症候群、大出血或臨終病人；庫斯毛耳氏呼吸則見於代謝性酸中毒。"},{"i":"102-1|42","e":"102-1","n":42,"c":1,"s":"下列那一因素會導致血壓下降？","o":["顱內壓上升","服用鎮靜劑","吸菸","急性疼痛"],"a":"B","k":"B","t":"","x":"鎮靜劑、安眠藥、麻醉劑、利尿劑及降血壓藥物等會使血管擴張，造成血壓下降。顱內壓上升時會出現血壓上升（庫欣氏反應）；吸菸時尼古丁使血管收縮而血壓上升；急性疼痛會刺激交感神經使血壓上升。"},{"i":"101-2|16","e":"101-2","n":16,"c":1,"s":"有關導致體溫過高的情況，下列敘述何者錯誤？","o":["熱痙攣係因身體劇烈運動後大量流汗，導致體內體液與氯化鈉喪失過多所致","發生熱衰竭時，個體常會出現臉色蒼白、皮膚濕冷、血壓降低、脈搏快且弱，但體溫可能接近正常","熱衰竭是個體暴露於高溫高濕環境中，因體液容積過多加上體溫調控不佳，無法排汗所造成的","中暑是因長期處於高溫的環境下，使身體的體溫調節中樞可能失去功能，無法順利排汗散熱所致"],"a":"C","k":"C","t":"","x":"熱衰竭是因長時間處於高溫環境，大量流汗導致體液與電解質喪失，使循環血量不足所致，常見臉色蒼白、皮膚濕冷、血壓下降、脈搏快而弱，體溫可接近正常；其原因是體液容積不足而非過多，故(C)錯誤。熱痙攣因大量流汗喪失鹽分；中暑則是體溫調節中樞失去功能，無法排汗散熱。"},{"i":"101-2|36","e":"101-2","n":36,"c":1,"s":"林先生因發燒住院，評估體溫變化，最低為38℃，最高到40.2℃。林先生的發燒類型是：","o":["回歸熱（relapsing fever or recurrent fever）","間歇熱（intermittent fever）","恆常熱（constant fever）","弛張熱（remittent fever）"],"a":"D","k":"D","t":"","x":"弛張熱是指體溫均高於正常，24小時內最高與最低溫差可達2℃以上，林先生最低38℃、最高40.2℃，溫差2.2℃且未降至正常，屬弛張熱。恆常熱溫差不超過1℃；間歇熱為高熱與正常體溫交替；回歸熱是高熱數日後恢復正常，數日後再度高熱。"},{"i":"101-2|37","e":"101-2","n":37,"c":1,"s":"當王先生剛從戶外散步回病房，測得脈搏為120次／分，護理師應該如何處置？","o":["讓王先生休息10-15分鐘後再測量脈搏","立即測量血壓，了解是否發生低血壓","測量心尖脈，以確認心臟功能","王先生有心搏過速的情形，必須立即通知醫師"],"a":"A","k":"A","t":"","x":"活動會使脈搏加快，測量前應評估病人是否剛從事影響脈搏的活動，若有應先讓病人休息一段時間（一般建議15～30分鐘）後再測量，才能得到準確數值。此時的快脈多為活動所致，不應立即判定為心搏過速而通知醫師，也不需先測血壓或心尖脈。"},{"i":"101-2|38","e":"101-2","n":38,"c":1,"s":"王先生有多年的高血壓病史，其脈搏可能會出現那些徵象？①搏動不明顯 ②搏動明顯 ③血管硬化 ④血管軟 ⑤洪脈 ⑥弦脈","o":["①④⑥","②③⑥","①③⑤","②③⑤"],"a":"D","k":"D","t":"","x":"長期高血壓會使動脈血管硬化、失去彈性，且脈搏壓增大，觸摸時搏動明顯且強而有力，呈現洪脈（②③⑤）。搏動不明顯、血管柔軟與高血壓的變化不符；弦脈則是心收縮力減弱、脈搏壓下降時的細小脈搏。"},{"i":"101-2|39","e":"101-2","n":39,"c":1,"s":"護理師發現陳先生出現深而快的呼吸現象，此種呼吸特徵屬於下列那一種呼吸型態？","o":["潮式呼吸（Tidal respiration）","呼吸過速（Tachypnea）","換氣過度（Hyperventilation）","畢歐氏呼吸（Biot’s respiration）"],"a":"C","k":"C","t":"","x":"換氣過度是指呼吸深而快，使二氧化碳排出過多，可能導致呼吸性鹼中毒。潮式呼吸為呼吸由淺而深再由深而淺並伴隨呼吸暫停的週期性變化；呼吸過速只是呼吸速率增加（成人大於24次／分）；畢歐氏呼吸則是不規則的呼吸與呼吸暫停交替出現。"},{"i":"101-2|40","e":"101-2","n":40,"c":1,"s":"有關科氏音（Korotkoff’s sound）的敘述，下列何者錯誤？","o":["第一個聽到的聲音為收縮壓","高血壓的病人易有聽診間隙","當聲音轉變為低音調即為成年人的舒張壓","當聽不到聲音時為第二舒張壓"],"a":"C","k":"C","t":"","x":"成年人的舒張壓應以柯氏音消失（第五期）時的讀數為準；聲音突然轉為低沉模糊（第四期）為第一舒張壓，主要作為兒童或特殊情況的舒張壓判讀，故(C)錯誤。第一個聽到的聲音為收縮壓；高血壓病人較易出現聽診間隙。"},{"i":"101-2|41","e":"101-2","n":41,"c":1,"s":"11歲的張小妹詢問護理師，為何她的血壓較爸爸的血壓低，下列回答何者適宜？","o":["因為妳沒有高血壓，血壓當然比較低","因為爸爸年紀大、血管彈性減少，因此血壓上升","因為爸爸年紀大，所以血壓高","一般而言，女生的血壓較男生低，所以爸爸的血壓比較高"],"a":"B","k":"B","t":"","x":"血壓與年齡成正比，主要是年齡增加使動脈管壁彈性減少，心臟須用更大的力量將血液送入動脈，因此血壓上升，這是最完整且正確的解釋。(C)只說年紀大而未說明原因；11歲女孩尚未到青春期後的性別差異，(D)解釋不適宜；(A)也未說明生理原因。"},{"i":"101-1|33","e":"101-1","n":33,"c":1,"s":"（情境：汪小姐，42歲，住院治療，住院3天體溫皆高於39℃，且最高溫及最低溫之差距並不超過1℃。）汪小姐發燒的型態屬於下列何者？","o":["恆常熱","弛張熱","間歇熱","回歸熱"],"a":"A","k":"A","t":"","x":"恆常熱是指體溫持續處於高熱狀態，溫度大於38.8℃，且24小時內最高溫與最低溫差距不超過1℃，汪小姐住院3天體溫皆高於39℃且溫差不超過1℃，符合恆常熱。弛張熱溫差可達2℃以上；間歇熱為高熱與正常體溫交替；回歸熱則高熱數日後恢復正常，再反覆出現。"},{"i":"101-1|34","e":"101-1","n":34,"c":1,"s":"（情境：汪小姐，42歲，住院治療，住院3天體溫皆高於39℃，且最高溫及最低溫之差距並不超過1℃。）汪小姐於發熱期（stadium or fastigium period）可能出現的症狀及徵象，下列敘述何者錯誤？","o":["脈率增加","呼吸變快","焦慮不安","尿比重下降"],"a":"D","k":"D","t":"","x":"發熱期因代謝率增加，會出現心跳加快、呼吸變快變深，以及焦慮不安、倦怠等神經精神症狀；此期因流汗及高溫使尿量減少、顏色變深、尿比重上升，尿比重下降是退熱期的表現，故(D)錯誤。"},{"i":"101-1|35","e":"101-1","n":35,"c":1,"s":"測量血壓時，當壓脈帶放氣太快容易發生：","o":["收縮壓及舒張壓假性偏低","收縮壓及舒張壓假性偏高","收縮壓假性偏低、舒張壓假性偏高","收縮壓假性偏高、舒張壓假性偏低"],"a":"C","k":"C","t":"","x":"壓脈帶放氣太快時，指針（汞柱）下降速度過快，聽到第一聲柯氏音時讀數已低於實際值，使收縮壓假性偏低；聲音消失時讀數已越過實際舒張壓的位置，則讀到較高數值，使舒張壓假性偏高。正確放氣速度約每秒2～3 mmHg。"},{"i":"101-1|36","e":"101-1","n":36,"c":1,"s":"有關血壓的變化，下列敘述何者正確？","o":["四季中，夏天與冬天血壓較高","早晨起床的血壓較傍晚低","飲酒過多，容易導致血管收縮而使血壓上升","留鹽激素會使血壓下降"],"a":"B","k":"B","t":"","x":"血壓有週期性的生理節律，以早晨醒來未起身前的血壓最低，午後或傍晚時最高。冬天因寒冷使血管收縮，血壓較高，夏天則較低；酒精會使周邊血管擴張而使血壓下降；留鹽激素（醛固酮）使鈉與水分滯留，會使血壓上升。"},{"i":"101-1|37","e":"101-1","n":37,"c":1,"s":"有關呼吸動作的敘述，下列何者正確？","o":["呼氣時橫膈膜收縮","呼氣時，第1秒時呼出的氣體最多","吸氣時肋骨下降","吸氣時內肋間肌收縮"],"a":"B","k":"B","t":"","x":"用力呼氣時第1秒鐘呼出的氣量最多，正常約占用力呼氣肺活量的75～80%以上。呼氣時橫膈膜放鬆上升；吸氣時外肋間肌收縮使肋骨上提、胸廓擴大，內肋間肌收縮則與用力呼氣有關，故其餘選項錯誤。"},{"i":"101-1|56","e":"101-1","n":56,"c":1,"s":"李先生發燒時，護理師使用冰枕協助降低其體溫，是應用下列那一種散熱原理？","o":["輻射","傳導","對流","蒸發"],"a":"B","k":"B","t":"","x":"傳導是指經由直接接觸，將熱由一個物體傳送至另一個物體，使用冰枕、冰敷、溫水拭浴皆是利用傳導散熱。輻射是不需直接接觸的熱傳送，如開冷氣；對流是經空氣流動散熱，如吹電風扇；蒸發則是液體轉為氣體帶走熱，如流汗。"},{"i":"100-2|39","e":"100-2","n":39,"c":1,"s":"陳女士因發燒入院治療，昨天體溫最高為 39.8℃，最低是 37.6℃，此種體溫變化的特性屬於下列那一種發燒型態？","o":["弛張熱（remittent fever）","間歇熱（intermittent fever）","恆常熱（constant fever）","回歸熱（relapsing fever）"],"a":"A","k":"A","t":"","x":"弛張熱是指體溫均高於正常，24小時內最高與最低溫差可達2℃以上，本例最高39.8℃、最低37.6℃，溫差2.2℃且未回到正常，屬弛張熱。恆常熱的24小時溫差不超過1℃；間歇熱為高熱期與無熱期交替出現；回歸熱則是高熱數日後恢復正常，數日後再度高熱。"},{"i":"100-2|41","e":"100-2","n":41,"c":1,"s":"因為心收縮力減弱，使心搏出量減少，造成脈搏壓下降，下列何者為此時所觸摸到的脈搏？","o":["洪脈（bounding pulse）","弦脈（wiry pulse）","絲脈（thready pulse）","交替脈（pulse alternans）"],"a":"B","k":"B","t":"","x":"弦脈（wiry pulse）是因心收縮力減弱、心搏出量減少，使脈搏壓下降，觸摸時脈搏細小、緊如琴弦。洪脈為心搏出量大、脈搏壓大的強脈；絲脈極微弱、幾乎摸不到，多見於休克或臨終；交替脈則是強弱交替出現的規則脈搏。"},{"i":"100-2|42","e":"100-2","n":42,"c":1,"s":"下列何種情況會導致心搏過速？","o":["缺氧","體力衰竭","顱內壓升高","血壓上升"],"a":"A","k":"A","t":"","x":"缺氧時身體會代償性加快心跳，以增加心輸出量與組織氧氣供應，故會導致心搏過速。體力衰竭時心肌無力，顱內壓升高會出現心搏過緩，血壓上升時亦會經壓力接受器反射使心跳減慢。"},{"i":"100-2|44","e":"100-2","n":44,"c":1,"s":"有關呼吸速率增加的情況，下列何者錯誤？","o":["血壓突然上升","體溫上升","急性感染","焦慮"],"a":"A","k":"A","t":"","x":"血壓突然上升時，壓力會作用於頸動脈竇和主動脈竇的壓力接受器，造成反射性呼吸減慢，故(A)錯誤。體溫上升與急性感染時代謝率增加，焦慮時刺激交感神經，皆會使呼吸速率增加。"},{"i":"100-2|45","e":"100-2","n":45,"c":1,"s":"有關呼氣的敘述，下列何者正確？","o":["為主動的過程","內肋間肌收縮","外肋間肌收縮","橫膈膜會收縮"],"a":"B","k":"B","t":"","x":"平靜呼氣是被動的過程，主要靠橫膈膜與外肋間肌放鬆、胸廓回彈；用力呼氣時則由內肋間肌及腹肌收縮，使胸廓下降、胸腔容積變小以排出氣體，故選(B)。外肋間肌與橫膈膜收縮是吸氣的動作。"},{"i":"100-2|46","e":"100-2","n":46,"c":1,"s":"李先生右手靜脈注射中，左手石膏固定，下列何者為理想測量血壓的部位？","o":["肱動脈","股動脈","橈動脈","膕動脈"],"a":"D","k":"D","t":"","x":"靜脈注射的手臂及上石膏的肢體皆禁止測量血壓，當兩側上肢都無法測量肱動脈血壓時，應改測下肢膕動脈血壓（協助俯臥，壓脈帶包裹於大腿中段）。橈動脈位於同一上肢，股動脈不是常規測血壓部位。"},{"i":"100-1|36","e":"100-1","n":36,"c":1,"s":"不同體溫測量法所測得的體溫，由高至低排列順序為何？","o":["口溫、腋溫、肛溫","肛溫、腋溫、口溫","腋溫、口溫、肛溫","肛溫、口溫、腋溫"],"a":"D","k":"D","t":"","x":"肛溫測量最接近核心溫度，數值最高；口溫次之；腋溫受外界環境影響較大，數值最低，因此各部位體溫高低順序為肛溫＞口溫（耳溫）＞腋溫。"},{"i":"100-1|38","e":"100-1","n":38,"c":1,"s":"有關身體散熱機制的敘述，下列何者錯誤？","o":["室溫休息狀態下，人體約有50~70%的熱是經輻射方式散失","發燒時使用冰枕就是利用熱傳導使身體降溫","吹電風扇就是利用對流使身體降溫","當環境溫度比體溫低時，蒸發是身體唯一的散熱方式"],"a":"D","k":"D","t":"","x":"當環境溫度高於體溫時，輻射、傳導、對流無法散熱，身體反而會吸收熱，此時蒸發成為唯一的散熱方式；環境溫度比體溫低時則可經輻射等多種方式散熱，故(D)錯誤。休息狀態下約50～70%熱能由輻射散失，冰枕是利用傳導、電風扇是利用對流散熱。"},{"i":"100-1|40","e":"100-1","n":40,"c":1,"s":"下列何者不會造成換氣過度（hyperventilation）的情況？","o":["發燒","糖尿病酮酸中毒","代謝性鹼中毒","害怕焦慮"],"a":"C","k":"C","t":"","x":"代謝性鹼中毒時血中鹼性物質過多，身體會以呼吸變慢、變淺（換氣不足）滯留二氧化碳來代償，不會造成換氣過度。發燒時代謝率上升使呼吸加快，糖尿病酮酸中毒時會出現深而快的庫斯莫耳呼吸以排出二氧化碳，害怕焦慮會刺激交感神經，皆可造成換氣過度。"},{"i":"100-1|44","e":"100-1","n":44,"c":1,"s":"有關正確測量血壓的方式，下列敘述何者正確？","o":["將壓脈帶置於肘關節上","將空氣打入壓脈帶，至橈動脈消失後再打30 mmHg","將聽診器鐘面置於肱動脈上","每次放氣8-10 mmHg"],"a":"B","k":"B","t":"","x":"為避免聽診間隙造成收縮壓誤判，測量血壓時應先觸診橈動脈，充氣至橈動脈搏動消失後再往上打30 mmHg。壓脈帶應置於肘窩上方約2.5公分（1吋）處而非肘關節上；聽診肱動脈血管音較常用膜面；放氣速度應為每秒2～3 mmHg，每次8～10 mmHg過快易造成誤差。"},{"i":"100-1|59","e":"100-1","n":59,"c":1,"s":"為確認一位因失血過多而造成低血容積休克的病患是否仍有脈動，最適合測量的部位為何？","o":["顳動脈","肱動脈","頸動脈","股動脈"],"a":"C","k":"C","t":"","x":"頸動脈接近心臟且管徑較大，當低血容積休克導致周邊血壓下降、周邊脈搏不易觸摸時，頸動脈仍較易測得脈動，是緊急或危急狀況下評估有無脈搏的最適部位。顳動脈、肱動脈屬周邊較小動脈，休克時常摸不到；股動脈位於鼠蹊部，較常用於評估下肢循環。"},{"i":"115-2|13","e":"115-2","n":13,"c":2,"s":"扁桃腺手術後，醫囑開立冰領使用，有關冷應用與照護的敘述，下列何者正確？","o":["此時使用冰領的最主要目的是降低病人新陳代謝率","為了達到最好的效果，每次用冷時間是40分鐘","使用冰領後，影響病人咽、喉對冷刺激的反應，此為交感性反應","用冷期間，護理師應至少每30分鐘觀察病人用冷部位皮膚狀況與反應"],"a":"C","k":"C","t":"","x":"冷刺激除了作用於局部，也會引起其他部位出現相同的反應，稱為交感性反應；冰領影響咽、喉對冷的反應即屬之。扁桃腺術後使用冰領，主要目的是止血與止痛；每次用冷約20～30分鐘，時間過長反而造成血管擴張；用冷期間應經常觀察皮膚，每30分鐘才看一次間隔太長。"},{"i":"115-2|14","e":"115-2","n":14,"c":2,"s":"有關電熱墊使用的注意事項，下列護理指導何者錯誤？","o":["電熱墊屬於乾熱的應用，容易使皮膚乾燥，仍然要注意可能造成燙傷","每次使用時間以20～30分鐘為宜","使用時最好用安全別針固定好，以免滑動產生摩擦生熱","應避免加壓或放在身體下，因為不容易散熱易造成燙傷"],"a":"C","k":"C","t":"","x":"電熱墊屬通電設備，不可用安全別針固定，以免刺穿電線造成觸電或短路，故C錯誤。乾熱易使皮膚乾燥，仍可能燙傷；每次使用20～30分鐘為宜；避免加壓或墊在身體下，以免熱不易散發而燙傷。"},{"i":"115-2|15","e":"115-2","n":15,"c":2,"s":"下列何種情況適合熱敷？","o":["持續性出血","非炎症性水腫","急性炎症反應","慢性下背痛"],"a":"D","k":"D","t":"","x":"熱敷可使血管擴張、肌肉放鬆、促進循環，適用於慢性下背痛等慢性疼痛。持續性出血用熱會加重出血；急性炎症期用熱會加重腫脹與疼痛；非炎症性水腫用熱會增加微血管通透性，使水腫加劇，三者皆為用熱的禁忌。"},{"i":"115-2|20","e":"115-2","n":20,"c":2,"s":"下列何者不屬於溫水坐浴之適用對象？","o":["自然產後者","解尿疼痛者","會陰手術後","痔瘡手術後"],"a":"B","k":"B","t":"","x":"溫水坐浴適用於產後會陰傷口、會陰及肛門部位手術後（如痔瘡手術），可促進循環、減輕疼痛與腫脹。單純解尿疼痛不是溫水坐浴的適用對象。"},{"i":"115-1|14","e":"115-1","n":14,"c":2,"s":"腳踝扭傷後三天，病人仍疼痛且患部有瘀青，但無水腫情況，給與該部位熱敷的作用機轉，下列敘述何者正確？","o":["增加微血管通透性，有利患部修復","使神經傳導受阻，可減少疼痛感","增加血液黏滯性，有助於血液凝固","減少結締組織伸展性，避免拉扯患部"],"a":"A","k":"A","t":"","x":"扭傷48小時後已無水腫，熱敷可使血管擴張、微血管通透性增加、血流加快，有利吸收瘀血與滲出液，促進組織修復。阻斷神經傳導以減少疼痛是用冷的作用；用熱會降低血液黏滯性，並增加結締組織的伸展性。"},{"i":"115-1|15","e":"115-1","n":15,"c":2,"s":"王太太生產會陰部有撕裂傷口，醫囑每天執行溫水坐浴（Sitz Bath）二次，下列敘述何者錯誤？","o":["透過麻痺末稍神經可達到止痛效果，以及避免體溫過低","使用1：100優碘（Beta-Iodine）溶液，可消毒預防感染","浸泡部位不只是會陰與肛門，需要包含整個臀部","浸泡時間約20分鐘，時間過長可能會導致低血壓"],"a":"A","k":"A","t":"","x":"溫水坐浴藉溫熱使血管擴張、肌肉放鬆而減輕疼痛，並不是麻痺末梢神經（那是用冷的作用），也與避免體溫過低無關，故A錯誤。1：100優碘可消毒；坐浴時應將整個臀部浸入；浸泡約15～20分鐘，時間過長會使骨盆腔血管擴張、血液積聚而導致低血壓。"},{"i":"115-1|16","e":"115-1","n":16,"c":2,"s":"（情境：王太太生產會陰部有撕裂傷口，醫囑每天執行溫水坐浴（Sitz Bath）二次。）王太太使用坐浴後，主訴頭暈、心跳加快、無力、臉色蒼白，此時最適切的護理措施為何？","o":["因循環變差，請王太太直接站起來活動再坐下","因水溫過高造成頭暈，坐浴盆內應添入冷水降溫","因姿勢性低血壓，協助其身體前傾，並使頭部低於心臟","因保暖不足故需提供毛毯，並告知可以繼續浸泡"],"a":"C","k":"C","t":"","x":"坐浴時骨盆腔血管擴張、血液積聚，回心血量減少，造成姿勢性低血壓，出現頭暈、心悸、無力、臉色蒼白。此時應停止坐浴，協助身體前傾、頭部低於心臟以增加腦部血流。直接站起會加重低血壓；症狀並非水溫過高或保暖不足所致，也不可繼續浸泡。"},{"i":"114-3|13","e":"114-3","n":13,"c":2,"s":"有關用熱的生理效應，下列敘述何者最適當？","o":["降低微血管通透性","降低血液黏稠度","減少組織代謝率","減輕心臟負擔"],"a":"B","k":"B","t":"","x":"用熱使組織溫度上升，血液黏稠度降低、血流加快，並使血管擴張、微血管通透性增加、組織代謝率上升。降低微血管通透性、減少組織代謝率是用冷的效應；用熱使周邊血管擴張、代謝增加，心臟負荷反而加重。"},{"i":"114-3|14","e":"114-3","n":14,"c":2,"s":"使用冷熱治療，病人對溫度耐受性的影響因素，下列敘述何者最適當？","o":["暴露冷熱的面積愈大，耐受力愈低，對身體影響也愈大","暴露的時間愈長，耐受力愈低，對身體危險性也增加","神經感覺功能不良的病人，耐受力較低，容易造成傷害","老人與小孩，耐受力皆較高，損傷風險也較高"],"a":"A","k":"A","t":"","x":"暴露於冷熱的面積愈大，受刺激的溫度接受器愈多，耐受力愈低，對全身的影響也愈大。暴露時間愈長，因適應作用而耐受力增加，卻更容易受傷；神經感覺功能不良者對溫度感覺遲鈍，易受傷害；老人與幼兒的耐受力較低，損傷風險較高。"},{"i":"114-3|17","e":"114-3","n":17,"c":2,"s":"使用冷、熱療法產生的生理反應，所達成的相同效果，下列敘述何者最適當？①減緩炎症反應②減緩疼痛③減緩關節僵硬④減緩充血與腫脹","o":["①②","②④","①③","③④"],"a":"B","k":"B","t":"","x":"冷療藉血管收縮減少充血與腫脹，並降低神經傳導速度而止痛；熱療可促進循環以吸收組織滲出液而消腫，並放鬆肌肉而止痛，因此兩者都能減緩疼痛及充血腫脹（②④）。抑制炎症反應主要是用冷的效果，減緩關節僵硬則是用熱的效果。"},{"i":"114-2|6","e":"114-2","n":6,"c":2,"s":"植皮供皮區需使用烤燈，有關其原理與使用原則，下列何者正確？","o":["屬於對流的熱傳導，以達保暖功效","25瓦烤燈，距離皮膚須14～18吋","使用時間至少30分鐘，才會有效果","使用前先清潔皮膚，並塗上凡士林保護，以防燙傷"],"a":"B","k":"B","t":"","x":"烤燈以輻射方式傳熱，25瓦烤燈與皮膚的距離應為14～18吋，瓦數越高距離應越遠。烤燈不屬於對流（A錯）；每次使用約20～30分鐘（C錯）；使用前皮膚應保持清潔乾燥，不可塗凡士林或油類，以免吸熱而燙傷（D錯）。"},{"i":"114-2|15","e":"114-2","n":15,"c":2,"s":"有關冷、熱的生理反應，下列敘述何者錯誤？","o":["冷、熱覺的傳遞，皆由外側脊髓視丘徑傳至下視丘的體溫調節中樞","杏仁核使人感覺外界溫度的變化，而增加或減少衣物","當皮膚碰觸到極熱刺激時，脊髓立即將衝動傳給運動神經產生反射動作","四肢皮膚對冷覺的反應比對熱覺敏感"],"a":"B","k":"B","t":"","x":"感覺外界溫度變化，並主動增減衣物，是大腦皮質察覺溫度後產生的意識性行為反應，與杏仁核無關（杏仁核主要與情緒有關），故B錯誤。冷、熱覺經外側脊髓視丘徑上傳；碰觸極熱刺激時，脊髓反射會立即產生縮回動作；皮膚冷接受器較多，對冷的反應較敏感。"},{"i":"114-2|16","e":"114-2","n":16,"c":2,"s":"病人打籃球時跌倒，右側足踝處扭傷並有出血、擦傷。急診X光確定沒有骨折，可返家休養。離院前的護理指導內容，下列何者最適當？","o":["交替使用冷熱敷，減輕疼痛","持續浸泡於冷水中，減緩出血","48小時內冰敷，減少關節僵硬","48小時後熱敷，促進血液循環"],"a":"D","k":"D","t":"","x":"扭傷後24～48小時內應冰敷，使血管收縮，減少出血、腫脹與疼痛；48小時後改為熱敷，促進血液循環以吸收瘀血。急性期交替冷熱會加重腫脹；持續浸泡冷水並不適合局部扭傷，也易凍傷；早期冰敷的目的是止血消腫，減輕關節僵硬是熱敷的效果。"},{"i":"114-2|17","e":"114-2","n":17,"c":2,"s":"自然產後婦女有會陰傷口，產後以41～43℃溫水執行坐浴，下列何者為其最主要目的？","o":["促進傷口血液循環","促進傷口肉芽形成","具傷口防腐作用","減少細菌繁殖"],"a":"A","k":"A","t":"","x":"41～43℃溫水坐浴可使會陰部血管擴張，促進局部血液循環，以減輕充血、腫脹與疼痛，並幫助傷口癒合。單純溫水不具防腐或抑菌作用，需加入高錳酸鉀等藥物才能抑菌；肉芽形成是循環改善後的結果，並非最主要目的。"},{"i":"114-1|17","e":"114-1","n":17,"c":2,"s":"有關溫水坐浴（Warm Sitz Bath）常用溶液及其使用目的之敘述，下列何者錯誤？","o":["1：8水溶性優碘（Beta-iodine），用於產後會陰部傷口之消毒","1：4,000高錳酸鉀（P.P. solution），用於肛門、會陰部傷口的消腫與抑菌","10～50%硫酸鎂（MgSO4），用於痔瘡切除術後傷口，具有收斂作用","38～40℃之溫水，用於清潔及促進傷口癒合"],"a":"A","k":"A","t":"","x":"會陰坐浴使用的優碘需充分稀釋（約1：100），1：8濃度過高，會刺激皮膚與黏膜，故A錯誤。1：4,000高錳酸鉀可消腫抑菌；硫酸鎂為高張溶液，具收斂、消腫作用，常用於痔瘡術後；溫水坐浴可清潔並促進局部循環與傷口癒合。"},{"i":"114-1|18","e":"114-1","n":18,"c":2,"s":"有關冷療的應用，下列何者正確？①濕冷敷較乾冷的
