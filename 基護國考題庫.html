話交談"],"a":"C","k":"C","t":"","x":"病人詢問醫師何時查房，背後可能有想問醫師的問題或需求，護理師以開放式的詢問「您找醫師有甚麼事嗎？」澄清其真正需要，再給予協助最適當。延後回答會讓病人感到不受重視；直接說醫師不會來查房缺乏確認；立刻打電話給醫師則未先了解病人需求。"},{"i":"101-1|13","e":"101-1","n":13,"c":4,"s":"下列何者不是護理師在觀察過程中所應扮演的角色？","o":["必須使用各種觀察技能","分析資料判斷個案問題","依據資料變更醫療處置","以報告及記錄方式與他人溝通"],"a":"C","k":"C","t":"","x":"護理師在觀察過程中應運用各種觀察技能收集資料、分析資料以判斷病人的健康問題，並以報告及記錄的方式與醫療團隊溝通。變更醫療處置屬於醫師的職責，護理師發現異常時應報告醫師，不可自行依資料變更醫療處置，故(C)錯誤。"},{"i":"100-2|9","e":"100-2","n":9,"c":4,"s":"一位罹患先天性心臟病病童的母親不停的抱怨：「這孩子怎麼這麼命苦！將來的日子還那麼長，他該怎麼辦！」下列何者是護理師最適宜的處置？","o":["傾聽","鼓勵她面對現實","告知她目前醫療科技日新月異，不用太擔心","和她一起儘早為病童擬定照護計畫"],"a":"A","k":"A","t":"","x":"母親正處於強烈情緒中，此時護理師最適當的處置是專注傾聽，讓她抒發感受並表達關懷，以了解其真正擔心的問題。立即要她面對現實屬批判性回應，告知「不用太擔心」為不適當保證，馬上擬定照護計畫則忽略其情緒，皆非最適宜。"},{"i":"100-2|10","e":"100-2","n":10,"c":4,"s":"有關評估的敘述，下列何者錯誤？","o":["視診是一種重要的觀察法","觸診主由指尖進行資料收集","叩診是評估胸腔的常用方法","嗅覺常用於分辨分泌物的氣味"],"a":"B","k":"B","t":"","x":"直接觀察法包括視診、觸診、叩診、聽診及嗅覺。觸診依目的使用手的不同部位，如以指腹感覺質地與脈搏、以手背感覺溫度、以手掌感覺震動，並非主要由指尖進行，故(B)錯誤。視診是重要的觀察法，叩診常用於評估胸腔，嗅覺可分辨分泌物或排泄物的氣味。"},{"i":"100-2|11","e":"100-2","n":11,"c":4,"s":"要達到正確觀察時必須符合下列那些條件？①擬定觀察計畫 ②加入主觀的判斷 ③不要預設目的 ④病患入院即持續進行","o":["①②","①④","②③","③④"],"a":"B","k":"B","t":"","x":"正確觀察須具備有目的、有計畫、客觀、有彈性及持續性等特性，因此應事先擬定觀察計畫（①），並從病人入院起持續進行（④）。觀察時應摒除個人主觀想法與偏見，且必須有目的，不能漫無目的地觀察，故②③錯誤。"},{"i":"100-2|12","e":"100-2","n":12,"c":4,"s":"有關護理師與個案間專業性人際關係的敘述，下列何者正確？","o":["信任感是在工作期（working phase）建立的","治療性人際關係結束代表病人要出院","在互動前期（preinteraction phase）需讓病人了解護理師的功能，方能達到更好的成效","護理師與病人是在開始期（orientation phase）進行第一次接觸"],"a":"D","k":"D","t":"","x":"護理師與病人的第一次接觸發生在開始期（認識期、介紹期），此期透過介紹開始認識並建立基本信任感。信任感於開始期建立而非工作期；互動前期尚未接觸病人，主要是護理師的自我探索與收集資料；治療性關係在目標達成時結束，不一定代表病人出院。"},{"i":"100-2|13","e":"100-2","n":13,"c":4,"s":"有關護病專業性人際關係開始期的敘述，下列何者正確？","o":["儘速讓病人了解自己對健康應負的責任","依據病人問題多給家屬一些照護建議","請教家屬對於病人本次住院的期待","教導病人及家屬均衡飲食和規律運動"],"a":"C","k":"C","t":"","x":"開始期（認識期）的重點在雙方介紹、互相認識、建立信任，並以開放式詢問確立需要與期望，請教家屬對本次住院的期待即屬此期工作。讓病人了解自身應負的健康責任、給予照護建議及衛教飲食運動，屬於工作期的護理指導重點。"},{"i":"100-1|2","e":"100-1","n":2,"c":4,"s":"護理交班時至病患單位檢視病患的目的，下列敘述何者錯誤？","o":["提供連續性觀察與護理措施","避免延誤護理師下班時間","確認當時病患的安全狀況","可助接班護理師與病患間建立關係"],"a":"B","k":"B","t":"","x":"每天交接班、巡視病房是觀察病人的重要時機，交班時至病人單位檢視可提供連續性的觀察與護理、確認病人當下的安全狀況，並協助接班護理師與病人建立關係。其目的在於病人照護的連續與安全，而非避免延誤護理師下班時間，故(B)錯誤。"},{"i":"100-1|11","e":"100-1","n":11,"c":4,"s":"下列何項溝通情境最符合治療性溝通的定義？","o":["一位護理師正在與醫師討論病患的病況","一位護理師正在與病患討論出院計畫","一位白班護理師正在向小夜班護理師交班","二位病患正在彼此分享住院經驗"],"a":"B","k":"B","t":"","x":"治療性溝通是護理師與病人之間有目標、有計畫、有時間限制且以病人需要為中心的互動，護理師與病人討論出院計畫最符合此定義。醫護之間討論病況或交班屬於工作溝通，病人之間分享經驗則屬於社交性溝通。"},{"i":"100-1|12","e":"100-1","n":12,"c":4,"s":"針對剛入院病患，運用同理心護理措施的敘述，下列何者正確？","o":["鼓勵病患描述住院的感想及其關心的議題","向病患多作一些自我介紹，幫助病患認識護理師","關心病患三代成員的性別、年齡及健康現況","鼓勵病患參與自我照顧，以期早日獨立"],"a":"A","k":"A","t":"","x":"同理心是進入病人的參考架構，去了解其經驗、想法與感受；鼓勵新入院病人描述住院感想及關心的議題，才能站在病人立場了解其感覺。多作自我介紹是建立關係的開場、了解家族成員屬資料收集、鼓勵自我照顧屬護理指導，皆非同理心的運用。"},{"i":"100-1|79","e":"100-1","n":79,"c":4,"s":"專業性人際關係不具有下列那一項特點？","o":["是用於協助解決個案問題而存在的關係","彼此間會隨著目標的完成而發生變化","必須有著一致的想法才能進行","以滿足個案需求為目標下成立的"],"a":"C","k":"C","t":"","x":"專業性人際關係是以滿足病人需求為目標而建立的助人關係，具有特定目的、短暫性，會隨目標達成而變化或結束。專業性人際關係不要求雙方信念一致，護理師應不批判地接受病人的信念與想法，彼此需有相同信念的是社交性人際關係，故(C)錯誤。"},{"i":"115-2|27","e":"115-2","n":27,"c":5,"s":"有關半坐臥時壓力性損傷的好發部位，下列何者錯誤？","o":["肩胛骨","腸骨嵴","薦骨","腳跟"],"a":"B","k":"B","t":"","x":"半坐臥時壓力性損傷好發部位為肩胛骨、手肘、薦骨、坐骨結節及腳跟。腸骨嵴是側臥時的受壓部位，故B錯誤。"},{"i":"115-1|19","e":"115-1","n":19,"c":5,"s":"有關翻身擺位之原則，下列何者正確？","o":["移動時用手抓握病人肢體","保持頭、頸與脊椎呈一直線","擺位時肢體互相重疊減少受壓面積","身體凹陷部位維持懸空避免壓迫皮膚"],"a":"B","k":"B","t":"","x":"翻身擺位時應保持頭、頸與脊椎呈一直線，維持良好身體排列。移動時應以手掌托住肢體而非抓握；肢體互相重疊會增加骨突處受壓，應以枕頭隔開；身體凹陷部位（如腰部、膝膕旁）應以枕頭或捲軸適度支托，不宜懸空。"},{"i":"115-1|23","e":"115-1","n":23,"c":5,"s":"有關協助病人採坐臥姿之敘述，下列何者錯誤？","o":["適用於腹水的病人","適用於腹部大出血病人","需預防病人發生姿位性低血壓","需預防薦骨處受壓"],"a":"B","k":"B","t":"","x":"坐臥姿會使血液滯留於下半身、減少回心血量，腹部大出血病人可能已有休克，應採仰臥或垂頭仰臥式，故B錯誤。腹水病人採坐臥姿可減輕腹水壓迫橫膈而改善呼吸；採坐臥姿時須注意姿位性低血壓及薦骨受壓。"},{"i":"114-3|19","e":"114-3","n":19,"c":5,"s":"下列那種姿勢擺位，需特別注意病人可能容易有胸部受壓的現象？","o":["膀胱截石術臥姿","截刀式臥姿","垂頭仰臥姿","辛式臥姿"],"a":"B","k":"B","t":"","x":"截刀式臥姿為俯臥並使臀部抬高、髖部屈曲，身體重量壓在胸部，容易造成胸部受壓與呼吸受限，需特別注意。膀胱截石術臥姿與垂頭仰臥姿為仰臥姿勢，胸部不受壓；辛式臥姿為半俯臥，胸前可置枕頭支托。"},{"i":"114-2|19","e":"114-2","n":19,"c":5,"s":"護理師為病人翻身擺位時，下列何者最為適當？","o":["每位臥床病人至少每四小時翻身一次","仰臥時在膝膕處放置軟枕可避免病人下滑至床尾","側臥時勿在病人的頸椎、腰部墊上軟枕以維持脊椎平直","協助採側卧時須加強肩部和髖部的皮膚護理"],"a":"D","k":"D","t":"","x":"側臥時肩部（肩峰突）及髖部（股骨大粗隆）為主要受壓骨突處，須加強皮膚觀察與護理。臥床病人至少每2小時翻身一次；膝膕處放軟枕會壓迫膕窩血管神經，預防下滑應適度搖高膝部或使用足托板；側臥時可於頸部、腰部墊小枕維持脊椎平直。"},{"i":"114-2|20","e":"114-2","n":20,"c":5,"s":"病人因肺炎住院，右手打點滴抗生素滴注，護理師協助更換衣服的步驟，下列何者較為適切？","o":["脫衣時先脫右側，穿衣時先穿左側","脫衣時先脫左側，穿衣時先穿右側","脫衣時先脫左側，穿衣時先穿左側","脫衣時先脫右側，穿衣時先穿右側"],"a":"B","k":"B","t":"","x":"右手有點滴時，更衣原則為先脫健側、先穿患側：脫衣先脫左側（健側），穿衣先穿右側（患側），可減少牽扯點滴管路與注射部位。"},{"i":"114-2|22","e":"114-2","n":22,"c":5,"s":"病人接受腰椎穿刺後，宜採用那一種姿勢最適當？","o":["俯臥","仰臥姿","坐姿","側姿"],"a":"B","k":"B","t":"","x":"腰椎穿刺後應採去枕平躺（仰臥）數小時，以減少腦脊髓液由穿刺處滲漏而引起穿刺後頭痛。坐姿、側姿會增加腦脊髓液外漏；俯臥並非常規建議姿勢。"},{"i":"114-1|19","e":"114-1","n":19,"c":5,"s":"有關臥姿與其目的之敘述，下列何者正確？","o":["採俯臥式可預防髖部關節攣縮","採屈膝仰臥式可改善子宮後傾引起的經痛","仰臥姿可用於接受痔瘡切除術病人","採膝胸臥姿可促使下腹部感染局部化"],"a":"A","k":"A","t":"","x":"俯臥式使髖關節伸展，可預防長期臥床或半坐臥造成的髖部屈曲攣縮。子宮後傾引起的經痛宜採膝胸臥式；痔瘡切除術常採截刀式臥姿；促使下腹部感染局部化應採半坐臥式，使分泌物積聚於骨盆腔。"},{"i":"113-3|8","e":"113-3","n":8,"c":5,"s":"病人因車禍昏迷入院，仰臥期間，護理師於病人兩腿外側用粗隆捲軸從腰部到膝蓋加以固定與支托，主要目的是預防病人髖關節產生下列何種情形？","o":["外旋","伸展","內收","屈曲"],"a":"A","k":"A","t":"","x":"仰臥時下肢易因重力而外倒，造成髖關節外旋；於兩腿外側自腰部至膝蓋放置粗隆捲軸支托，主要目的即預防髖關節外旋。伸展、內收與屈曲並非粗隆捲軸要預防的情形。"},{"i":"113-3|23","e":"113-3","n":23,"c":5,"s":"有關協助病人維持良好姿勢的原則，下列敘述何者正確？","o":["病人臥於氣墊床上，皮膚受壓減輕，不需要翻身","各種臥姿擺位，關節應微彎曲，避免肌肉過度緊張","病人身上有多條管路留置，建議不穿衣物，以被蓋直接覆蓋","全身癱瘓病人僅能維持平躺臥姿，避免其他姿勢造成對身體局部壓迫"],"a":"B","k":"B","t":"","x":"各種臥姿擺位時，關節應維持微彎的功能性位置，以避免肌肉過度緊張與攣縮。臥氣墊床仍須定時翻身；多管路留置者仍應穿著衣物（如開背式病人服）以維護隱私與保暖；全身癱瘓病人應定時變換仰臥、側臥等不同姿勢以分散受壓。"},{"i":"113-2|23","e":"113-2","n":23,"c":5,"s":"有關移動病人並協助擺位，下列敘述何者正確？","o":["護理人員搬動病人時使用小肌肉比大肌肉不易疲勞","病人仰臥時頭頸脊椎成一直線，大腿伸直並交叉","病人側臥時上側的髖關節及膝關節較下側的髖關節與膝關節彎曲","護理人員移動病人時應多利用拖、拉的方式，少用滾動的方式"],"a":"C","k":"C","t":"","x":"側臥時上側的髖關節及膝關節應較下側彎曲並置於枕頭上，可擴大支持面、維持穩定並避免兩腿重疊受壓。搬動病人應使用大肌肉群較不易疲勞；仰臥時大腿不可交叉；移動病人應多用滾動、轉動，少用拖拉以減少剪力與摩擦力。"},{"i":"112-3|21","e":"112-3","n":21,"c":5,"s":"病人身上有中央靜脈導管及左手留置靜脈管路，協助更衣方式，下列敘述何者最適當？","o":["脫衣時，先脫右上肢，再脫左上肢","穿衣時，先穿右上肢，再穿左上肢","直接反穿上衣，扣好背後鈕釦","不穿上衣，給予蓋上被單保暖"],"a":"A","k":"A","t":"","x":"左手有靜脈管路時，脫衣應先脫健側右上肢，再脫患側左上肢；穿衣則先穿左上肢再穿右上肢，以避免牽扯管路，故A最適當。直接反穿上衣或不穿上衣僅蓋被單，無法兼顧病人的隱私、保暖與舒適。"},{"i":"112-3|28","e":"112-3","n":28,"c":5,"s":"病人大部分時間平躺在床，下列那些是病人最容易發生壓力性損傷的部位？①枕骨 ②薦骨 ③肩峰突 ④股骨粗隆","o":["①②","②③","①④","③④"],"a":"A","k":"A","t":"","x":"平躺（仰臥）時最容易發生壓力性損傷的部位為枕骨、肩胛骨、手肘、薦骨及足跟，故選①②。肩峰突與股骨粗隆是側臥時的主要受壓部位。"},{"i":"112-2|34","e":"112-2","n":34,"c":5,"s":"接受痔瘡切除的病人最適合採取下列何種姿勢？","o":["屈膝仰臥","垂頭仰臥姿","截刀式臥姿","膀胱截石術臥姿"],"a":"C","k":"C","t":"","x":"痔瘡切除等肛門直腸手術常採截刀式臥姿（Jackknife position），使臀部抬高、肛門充分暴露。屈膝仰臥用於會陰沖洗、導尿；垂頭仰臥用於休克；膀胱截石術臥姿用於婦科檢查與生產。"},{"i":"112-2|35","e":"112-2","n":35,"c":5,"s":"王太太右側肢體偏癱，協助採側臥時，下列措施何者錯誤？","o":["側臥時，背部墊一個枕頭給予支持","維持病人頭、頸與脊椎呈彎曲弧度","用墊子保護外側足踝骨突處，減少受壓","胸前可抱枕頭，減輕胸部受壓"],"a":"B","k":"B","t":"","x":"側臥時應維持病人頭、頸與脊椎呈一直線，避免脊椎彎曲扭轉，故B錯誤。背部墊枕頭可支托身體；以墊子保護外側足踝等骨突處可減少受壓；胸前抱枕頭可支托上側手臂、減輕胸部受壓。"},{"i":"112-2|36","e":"112-2","n":36,"c":5,"s":"有關足托板使用之注意事項，下列敘述何者錯誤？","o":["使用時應保持足部背側屈曲狀態","足托板的底板高度要比腳趾低","足底要靠住底板","維持踝關節呈90度"],"a":"B","k":"B","t":"","x":"足托板的底板高度應高於腳趾，才能撐起被蓋、避免被蓋壓迫腳趾造成蹠屈，故B錯誤。使用時足底需緊靠底板，維持足部背側屈曲、踝關節90度，以預防垂足。"},{"i":"112-1|35","e":"112-1","n":35,"c":5,"s":"楊爺爺，罹患肺心症，呼吸每分鐘28～30次，護理師協助採取坐臥式（Fowler’s position）的理由，下列何者不適宜？","o":["促使橫膈下降","胸廓易於擴張","提升氧合功能","增加回心血量"],"a":"D","k":"D","t":"","x":"坐臥式可使橫膈下降、胸廓易於擴張而提升氧合功能；同時下肢血液滯留，回心血量減少，可減輕心臟負荷。因此「增加回心血量」並非採坐臥式的理由，故D不適宜。"},{"i":"112-1|36","e":"112-1","n":36,"c":5,"s":"為預防病人髖關節外旋，可使用下列何種支托物？①砂袋 ②粗隆捲軸 ③氣墊床 ④床上護架","o":["①②","②③","③④","①④"],"a":"A","k":"A","t":"","x":"預防髖關節外旋可在大腿外側使用砂袋或粗隆捲軸（由腰部至膝蓋）加以支托固定，故選①②。氣墊床用於分散壓力、預防壓傷；床上護架用於撐起被蓋避免壓迫患部，均無法預防髖關節外旋。"},{"i":"111-2|34","e":"111-2","n":34,"c":5,"s":"有關擺位的敘述，下列何者錯誤？","o":["行腰椎穿刺後適用俯臥式","懷孕胎位不正適用膝胸臥式","痔瘡切除採取截刀式臥姿","子宮頸抹片檢查採膀胱截石術臥姿"],"a":"A","k":"A","t":"","x":"腰椎穿刺後應採去枕平躺（仰臥）數小時，以減少腦脊髓液自穿刺處滲漏而引起頭痛，故A錯誤。懷孕胎位不正可採膝胸臥式；痔瘡切除採截刀式臥姿；子宮頸抹片檢查採膀胱截石術臥姿，皆正確。"},{"i":"111-2|35","e":"111-2","n":35,"c":5,"s":"陳小姐術後留置導尿管，月經來潮，協助執行床上會陰沖洗，下列敘述何者正確？","o":["沖洗前，先以棉球置放陰道口，避免清洗時液體進入陰道","順序應先沖洗中間尿道口及陰道口，然後清洗小陰唇、大陰唇","應避開清洗尿道口之導尿管置入處，以避免感染","應以棉棒來回擦拭沾附經血之會陰部，直到乾淨"],"a":"B","k":"B","t":"","x":"會陰沖洗應由中間往兩側，先清洗尿道口及陰道口，再清洗小陰唇、大陰唇。留置導尿管者，尿道口與導尿管置入處正是清潔重點，不可避開；擦拭時應由上往下單一方向，每枝棉棒只用一次，不可來回擦拭；沖洗壺嘴朝床尾由上往下沖即可，不需以棉球置放陰道口。"},{"i":"111-2|36","e":"111-2","n":36,"c":5,"s":"使用床上護架的情況，下列何者錯誤？","o":["可用於燒傷病人","可用於肢體石膏未乾的病人","目的是避免被蓋直接接觸患部","可用於固定病人姿勢"],"a":"D","k":"D","t":"","x":"床上護架用於撐起被蓋，避免被蓋直接接觸或壓迫患部，適用於燒傷、石膏未乾或皮膚病灶等病人。床上護架沒有固定病人姿勢的功能，固定姿勢需用枕頭、捲軸、砂袋等支托物，故D錯誤。"},{"i":"111-2|46","e":"111-2","n":46,"c":5,"s":"張先生長期仰臥在床上，若未採取預防措施，其髖關節最容易發生何種變化？","o":["外旋（exterenal rotation）","外展（abduction）","內旋（inteneral rotation）","內翻（inversion）"],"a":"A","k":"A","t":"","x":"長期仰臥時，下肢因重力及肌肉無力而自然向外倒，若未以粗隆捲軸或砂袋於大腿外側支托，髖關節最容易發生外旋變形。外展、內旋與內翻並非長期仰臥時髖關節的常見變化。"},{"i":"111-1|33","e":"111-1","n":33,"c":5,"s":"利用圓滾木翻身法協助病患翻向右側，下列敘述何者錯誤？","o":["常用於協助脊椎病人術後改變姿位","翻身時應保持病人身體脊椎平直","可利用翻身單以協助病人翻身","應於病人兩腳的膝膕處放置枕頭"],"a":"D","k":"D","t":"","x":"圓滾木翻身法常用於脊椎術後病人，可利用翻身單協助翻身，翻身時頭、頸與脊椎須保持平直如滾木。為維持下肢與脊椎平直，枕頭應放置於兩腿之間，而非膝膕處；膝膕處墊枕會使膝髖屈曲並壓迫膕窩血管，故D錯誤。"},{"i":"111-1|35","e":"111-1","n":35,"c":5,"s":"有關協助病人採辛氏臥姿（Sim’s Position）之敘述，下列何者錯誤？","o":["適用於肛門檢查的病人","肩膀皮膚是容易受壓的部位","可以加強背部肌肉張力","又稱3/4俯臥姿"],"a":"C","k":"C","t":"","x":"辛氏臥姿又稱3/4俯臥姿，適用於肛門檢查、灌腸及口鼻分泌物引流，下側肩膀是容易受壓的部位。此臥姿目的不在於加強背部肌肉張力，故C錯誤。"},{"i":"111-1|36","e":"111-1","n":36,"c":5,"s":"有關協助病人翻身擺位之注意事項，下列何者正確？","o":["膝膕處可用軟枕墊高，以預防受壓","頭頸部與脊柱應呈15º的擺位，以維持穩定","使用足托板時應保持足背側伸展","仰臥時，可用粗隆捲軸預防髖關節外旋"],"a":"D","k":"D","t":"","x":"仰臥時可用粗隆捲軸置於腰部至膝蓋兩側，預防髖關節外旋。膝膕處墊軟枕會壓迫膕窩血管神經並造成膝關節攣縮；頭頸部與脊柱應保持一直線；使用足托板應維持足部背側屈曲（踝關節90度）以預防垂足。"},{"i":"110-2|11","e":"110-2","n":11,"c":5,"s":"王先生因氣喘入院治療，為他安排最適當的臥姿為：","o":["仰臥式","坐臥式","膝胸臥式","俯臥式"],"a":"B","k":"B","t":"","x":"氣喘病人呼吸困難，宜採坐臥式，藉重力使橫膈下降、胸廓易於擴張，增加肺通氣量並使呼吸較輕鬆。仰臥式使腹腔臟器上推橫膈，限制呼吸；膝胸臥式與俯臥式也會壓迫胸部，不適合呼吸困難病人。"},{"i":"110-1|27","e":"110-1","n":27,"c":5,"s":"林小姐因腦血管損傷住院中，靜脈注射在右手背，欲幫林小姐更衣，正確的順序為何？","o":["右手先脫先穿","右手後脫先穿","左手先脫先穿","左手後脫先穿"],"a":"B","k":"B","t":"","x":"靜脈注射在右手背，更衣時應先脫健側左手、後脫患側右手；穿衣時先穿患側右手、再穿健側左手，即右手「後脫先穿」，以減少牽扯注射部位與管路。"},{"i":"110-1|48","e":"110-1","n":48,"c":5,"s":"長期側臥不動的病人，容易發生壓瘡部位為何？①耳朵 ②枕骨 ③腸骨嵴 ④尾椎骨 ⑤踝部","o":["①③⑤","②④⑤","①②③","①③④"],"a":"A","k":"A","t":"","x":"長期側臥時，受壓部位為耳朵、肩峰突、肋骨、腸骨嵴、股骨大粗隆、膝部內外側及踝部，故選①③⑤。枕骨與尾椎骨是仰臥時的受壓部位。"},{"i":"109-2|34","e":"109-2","n":34,"c":5,"s":"林女士腸道手術後，靜脈留置針位於左前臂，護理師應如何協助林女士更衣？①先脫右側 ②先脫左側 ③先穿右側 ④先穿左側","o":["①③","①④","②③","②④"],"a":"B","k":"B","t":"","x":"靜脈留置針在左前臂，更衣原則為先脫健側（右側）、先穿患側（左側），以避免牽扯或拉脫管路，故選①④。"},{"i":"109-2|37","e":"109-2","n":37,"c":5,"s":"蘇太太中風、肢體偏癱住院，家屬認為病人乃因天冷保暖不足才會中風，因此給予其穿四件衣服、戴毛帽，現病人冒汗，身上有異味，護理師欲協助減少衣物，但家屬拒絕，下列護理措施何者最為合適？","o":["告訴家屬對中風的理解有誤，強制給予減少病人身上衣物","給予病人使用爽身粉，吸附汗液促進皮膚乾燥","給予電扇調整室內溫度，以促進汗液蒸發","以乾毛巾擦拭病人身體，內層衣物如果潮濕就應更換"],"a":"D","k":"D","t":"","x":"病人冒汗且有異味時，應以乾毛巾擦乾身體，內層衣物潮濕即更換，以維持皮膚清潔乾燥並兼顧家屬保暖的期待。強制減少衣物未尊重家屬並易引起衝突；爽身粉遇汗易結塊刺激皮膚；吹電扇易使中風病人受涼。"},{"i":"109-1|33","e":"109-1","n":33,"c":5,"s":"協助王老先生執行床上擦澡，下列敘述何者正確？","o":["先脫靠近護理師側之衣袖，再脫護理師遠側衣袖","以同一條濕毛巾擦拭兩耳孔後再擦拭兩眼及鼻孔","毛巾由病人肢體近心端往遠心端進行擦拭","沐浴後，以少許50%酒精輕拍頸、背、臀部皮膚"],"a":"A","k":"A","t":"","x":"協助無管路或傷口的病人脫衣時，先脫靠近護理師側（近側）的衣袖，再脫遠側，可減少翻動病人、操作較省力。擦拭眼睛應最先進行且每眼使用毛巾不同部位；四肢應由遠心端往近心端擦拭；酒精易使皮膚乾燥，不宜用於老年人皮膚。"},{"i":"108-2|9","e":"108-2","n":9,"c":5,"s":"協助中風老人坐臥式擺位及目的，下列敘述何者不適當？","o":["高坐臥式可緩解呼吸困難","半坐臥式有助於放鬆腹肌","流鼻血時採坐臥式、頭向前傾","半坐臥式需抬高床頭45～60度"],"a":"D","k":"D","t":"","x":"半坐臥式床頭抬高約30～45度，坐臥式約45～60度，高坐臥式則為60～90度，故D不適當。高坐臥式可使橫膈下降而緩解呼吸困難；半坐臥式可放鬆腹肌；流鼻血時採坐姿頭向前傾，可避免血液流入咽喉。"},{"i":"108-2|39","e":"108-2","n":39,"c":5,"s":"下列何種臥位不適合意識不清病人口鼻腔分泌物之引流？","o":["俯臥","側臥","仰臥","辛氏臥位"],"a":"C","k":"C","t":"","x":"仰臥時口鼻腔分泌物容易積聚於咽喉並流入呼吸道，造成阻塞或吸入，不適合意識不清病人引流分泌物。俯臥、側臥與辛氏臥位皆可使分泌物藉重力由口鼻流出。"},{"i":"108-2|41","e":"108-2","n":41,"c":5,"s":"有關脊椎手術術後病人之移動與翻身擺位敘述，下列何者錯誤？","o":["以圓滾木翻身法搬動病人","採俯臥以利口鼻分泌物引流","移動時需保持病人脊柱平直","翻身時雙手抓緊病人肩及臀之翻身單"],"a":"B","k":"B","t":"","x":"脊椎手術後病人應以圓滾木翻身法、雙手抓緊肩及臀部之翻身單，使脊柱保持平直地移動。口鼻分泌物引流宜採側臥或辛氏臥式；脊椎術後病人不宜採俯臥來引流分泌物，俯臥也會限制胸部擴張並增加照護困難，故B錯誤。"},{"i":"108-2|42","e":"108-2","n":42,"c":5,"s":"病人採側臥，應留意側身肢體易受壓迫處皮膚狀態，下列何者除外？","o":["耳朵","肩峰突","髖骨側邊","足跟"],"a":"D","k":"D","t":"","x":"側臥時易受壓部位為耳朵、肩峰突、肋骨、髖骨側邊（股骨大粗隆）、膝部及內外踝。足跟是仰臥或半坐臥時的受壓部位，故側臥時除外。"},{"i":"108-1|35","e":"108-1","n":35,"c":5,"s":"協助病人更衣的步驟，下列敘述何者正確？","o":["協助右手受傷病人脫衣時，應先脫左手再脫右手衣袖","協助右手靜脈點滴注射之病人穿衣時，應先穿左手再穿右手衣袖","協助左腿受傷病人脫褲時，應先脫左側再脫右側褲管","協助左腿受傷病人穿褲時，應先穿右腿再穿左腿褲管"],"a":"A","k":"A","t":"","x":"更衣原則為先脫健側、後脫患側，先穿患側、後穿健側。右手受傷者脫衣應先脫左手（健側）再脫右手，故A正確。右手有點滴者穿衣應先穿右手；左腿受傷者脫褲應先脫右側、穿褲應先穿左腿，故B、C、D皆錯誤。"},{"i":"107-2|30","e":"107-2","n":30,"c":5,"s":"護理師執行會陰沖洗時，下列何者錯誤？","o":["沖洗前應先取得病人的同意","沖洗前，協助病人採屈膝仰臥式","沖洗的水溫約41℃","沖洗壺嘴應朝向床頭"],"a":"D","k":"D","t":"","x":"會陰沖洗時沖洗壺嘴應朝向床尾，由上往下沖洗，避免沖洗液及污物流入陰道與尿道，故D錯誤。沖洗前應解釋並取得同意、協助採屈膝仰臥式、水溫約41℃，皆為正確步驟。"},{"i":"107-2|47","e":"107-2","n":47,"c":5,"s":"楊先生昏迷多時，現口鼻部有大量分泌物，為他翻身時最適當的姿勢為：","o":["辛氏臥式","膝胸臥式","垂頭仰臥式","坐臥式"],"a":"A","k":"A","t":"","x":"昏迷病人口鼻有大量分泌物時，應採辛氏臥式（半俯臥），使頭側向一邊，分泌物可藉重力自口鼻流出，預防吸入性肺炎。膝胸臥式用於子宮後傾或胎位矯正；垂頭仰臥式用於休克；坐臥式不利於意識不清者的分泌物引流。"},{"i":"107-1|29","e":"107-1","n":29,"c":5,"s":"有關使用砂袋（sand bag）之敘述，下列何者錯誤？","o":["用於傷口加壓止血","用於固定腕部，預防垂腕","用於固定足部，預防外翻","用於術後病人，預防髖關節屈曲"],"a":"D","k":"D","t":"","x":"砂袋可用於傷口加壓止血、固定肢體（如固定腕部預防垂腕、固定足部預防外翻或髖關節外旋），但無法預防髖關節屈曲；預防髖關節屈曲攣縮應採俯臥或避免長時間床頭搖高，故D錯誤。"},{"i":"107-1|46","e":"107-1","n":46,"c":5,"s":"護理師欲將個案由床尾往床頭移動時，先將個案稍微抬起並避免直接拖拉移向床頭，其主要目的為何？","o":["減少剪力的發生","降低個案之不安全感","縮短移位的時間","利用物理原理省力"],"a":"A","k":"A","t":"","x":"將病人移向床頭時，若直接在床面拖拉，皮膚被床單固定而深層組織隨骨骼移動，會產生剪力並造成皮膚損傷與壓傷。因此應先將病人稍微抬起再移動，主要目的是減少剪力；降低不安全感、節省時間或省力都不是此步驟的主要目的。"},{"i":"106-2|35","e":"106-2","n":35,"c":5,"s":"為中風老人翻身側臥擺位時，下列敘述何者不適當？","o":["可促進口鼻的分泌物引流","胸前及兩腿中間放置軟枕","此擺位造成的受壓部位為枕骨及骶骨","此為餵食時可選擇的擺位"],"a":"C","k":"C","t":"","x":"側臥時主要受壓部位為耳朵、肩峰突、股骨大粗隆、膝部內外側及內外踝；枕骨與骶骨是仰臥時的受壓部位，故C不適當。側臥可促進口鼻分泌物引流，胸前及兩腿間放置軟枕可維持良好姿勢並減少骨突處互相壓迫。"},{"i":"106-1|34","e":"106-1","n":34,"c":5,"s":"女性會陰沖洗方式，下列敘述何者錯誤？","o":["應採屈膝仰臥姿勢","以41～43℃水溫沖洗","沖洗棉棒由上往下來回擦拭","應由陰道口依序向外沖洗"],"a":"C","k":"C","t":"","x":"會陰沖洗時棉棒應由上往下單一方向擦拭，每枝棉棒只用一次，不可來回擦拭，以免將肛門處污物帶至尿道與陰道口，故C錯誤。病人採屈膝仰臥姿勢、水溫約41～43℃、由陰道口（中間）依序向外清洗，皆為正確做法。"},{"i":"106-1|43","e":"106-1","n":43,"c":5,"s":"（情境：林先生為獨居老人，鄰居發現林先生倒臥在地板，入院接受治療，診斷為腦梗塞；病人現意識不清、完全臥床。）針對此病人狀況，下列護理措施何者不適當？","o":["以長捲軸置於身體兩側腰至膝蓋處避免髖部外旋","翻身時特別留意偏癱側肢體皮膚狀態","隨時評估病人的意識狀態變化","協助執行四肢關節加阻力運動"],"a":"D","k":"D","t":"","x":"林先生意識不清、完全臥床，無法配合主動運動，更不能執行需自主用力的加阻力運動，應改為被動全關節運動，故D不適當。以長捲軸置於兩側腰至膝蓋可避免髖部外旋；翻身時注意偏癱側皮膚狀態，並持續評估意識變化，皆為適當措施。"},{"i":"106-1|46","e":"106-1","n":46,"c":5,"s":"病人長時間採半坐臥姿勢，身體受壓處不包括下列那一部位？","o":["肩峰突","坐骨結節","薦骨","肩胛骨"],"a":"A","k":"A","t":"","x":"半坐臥時，身體受壓部位主要為肩胛骨、手肘、薦骨、坐骨結節及足跟。肩峰突是側臥時的受壓部位，故不包括在半坐臥姿勢的受壓處。"},{"i":"105-2|32","e":"105-2","n":32,"c":5,"s":"盧爺爺中風多年，GCS：E4M4V3，護理師協助仰臥擺位時，下列何者不適當？","o":["使用粗隆卷軸防髖關節外旋","腰下懸空以訓練腹部肌肉","小腿下墊軟枕以利血液循環","足底使用足托板預防垂足"],"a":"B","k":"B","t":"","x":"仰臥擺位時腰下應以小枕或捲軸支托，以維持腰椎正常弧度並減輕肌肉緊張，不可讓腰下懸空，故B不適當。粗隆捲軸可預防髖關節外旋；小腿下墊軟枕使足跟懸空可減少受壓；足托板可預防垂足。"},{"i":"105-1|34","e":"105-1","n":34,"c":5,"s":"王太太手術後，由恢復室回到病房，右手有點滴注射，主護護理師為王太太更換手術衣並穿衣服時，下列穿脫衣服方式何者正確？①先脫手術衣右側衣袖 ②先脫手術衣左側衣袖 ③先穿右側衣袖 ④先穿左側衣袖","o":["①③","②③","②④","①④"],"a":"B","k":"B","t":"","x":"右手有點滴時，脫衣應先脫健側（左側）衣袖，再脫患側（右側）；穿衣時先穿患側（右側），再穿健側，以減少患肢與管路的牽扯，故為②③。"},{"i":"104-2|29","e":"104-2","n":29,"c":5,"s":"（情境：陳小姐騎機車上班途中，突遇計程車開門，不慎撞上車門後昏厥，救護車送至醫院。）陳小姐清醒後發現四肢癱瘓，頸部以下完全無知覺，住院接受治療，當護理師協助床上翻身時，下列注意事項何者正確？","o":["側臥時上半身以舒適為主，下半身腰及臀部離床即可","以粗隆捲軸固定於雙下肢中間，避免下肢關節變形","以足托板固定腳部，預防垂足，非必要時不要拿開","以翻身單協助圓滾木方式翻身"],"a":"D","k":"D","t":"","x":"四肢癱瘓的頸髓損傷病人翻身時，應以翻身單協助採圓滾木翻身法，使頭、頸、脊椎保持一直線，避免扭轉再度傷害脊髓。側臥時全身須維持良好排列並給予支托，不可只顧上半身；粗隆捲軸應置於兩側大腿外側；足托板須定時移開以活動踝關節。"},{"i":"104-2|31","e":"104-2","n":31,"c":5,"s":"（情境：陳小姐騎機車上班途中，突遇計程車開門，不慎撞上車門後昏厥，救護車送至醫院。）陳小姐身上存留導尿管留置，護理師給予會陰部清潔。下列有關會陰部清潔之敘述何者較為合適？","o":["沖洗順序為尿道口→遠側小陰唇→近側小陰唇→遠側大陰唇→近側大陰唇","沖洗壺口朝向床尾，沖洗棉枝以沖洗至乾淨再丟棄","準備會陰沖洗用物，並協助採左側臥式","採內科無菌技術操作"],"a":"A","k":"A","t":"","x":"留置導尿管病人的會陰清潔應由最清潔處往外：先尿道口（含導尿管周圍），再依序遠側小陰唇、近側小陰唇、遠側大陰唇、近側大陰唇，故選(A)。沖洗棉棒每枝只用一次即丟棄；會陰沖洗應採屈膝仰臥式；留置導尿管病人的會陰沖洗使用無菌用物，依官方答案應以無菌技術操作，故D不適當。"},{"i":"104-2|33","e":"104-2","n":33,"c":5,"s":"護理師為使用氧氣鼻導管、心電圖監視儀及左手有靜脈輸液之重症病人更衣時，下列敘述何者不適當？","o":["先移除靜脈輸液管路及儀器，再脫衣","脫衣時，先脫右側再脫左側","穿衣時，先穿左側再穿右側","無法將衣服脫下時，可剪開"],"a":"A","k":"A","t":"","x":"重症病人更衣時不可為了方便而移除靜脈輸液管路及監測儀器，應保持管路通暢與持續監測，故A不適當。左手有輸液時，脫衣先脫健側（右）再脫患側（左），穿衣先穿患側（左）再穿健側；無法脫下時可剪開衣服以免牽扯管路。"},{"i":"104-2|34","e":"104-2","n":34,"c":5,"s":"為協助個案維護良好的姿勢，護理師所選擇的防護性設備，下列敘述何者不適當？","o":["呼吸困難時可伏趴於床上桌休息","燒傷者可使用床上支架，避免壓迫","使用足托板，可避免足部內旋","使用粗隆捲軸時，其長度以腰到膝蓋為佳"],"a":"C","k":"C","t":"","x":"足托板的作用是維持踝關節背側屈曲、預防垂足（足部蹠屈），而非避免足部內旋，故C不適當。呼吸困難者可伏趴於床上桌（端坐呼吸姿勢）；床上支架（護架）可避免被蓋壓迫燒傷部位；粗隆捲軸長度以腰部（腸骨嵴）至膝蓋為宜。"},{"i":"104-2|48","e":"104-2","n":48,"c":5,"s":"林小弟因用手摳鼻腔而有流鼻血的現象，則應協助他採取何種姿勢？","o":["仰臥姿，並墊高枕頭","側臥姿，維持頭頸一直線","坐姿、頭前傾的姿勢","屈膝仰臥式，並搖高床尾"],"a":"C","k":"C","t":"","x":"流鼻血時應採坐姿、頭稍向前傾，使血液由鼻孔流出，避免血液流入咽喉被吞下或吸入呼吸道，坐姿也可降低頭部靜脈壓。仰臥、側臥或搖高床尾均可能使血液倒流入咽喉並增加頭部充血，不適宜。"},{"i":"104-2|49","e":"104-2","n":49,"c":5,"s":"採坐臥的姿勢是將其身體重心放置於下列何部位？","o":["骨盆腔、膝蓋、足踝","薦骨、膝蓋、足踝","髖部、薦骨、足跟","薦骨、膝蓋、足跟"],"a":"C","k":"C","t":"","x":"坐臥姿時，身體重量主要落在髖部（坐骨結節）、薦骨及足跟，因此這些部位需加強支托並注意預防壓傷。膝蓋與足踝並非坐臥姿時承受身體重心的部位。"},{"i":"103-2|31","e":"103-2","n":31,"c":5,"s":"有關維持舒適姿勢的防護設備使用方式，下列敘述何者正確？","o":["氣墊床目的在分散熱度，以減少長期臥床病人體溫上升","手捲軸置於手掌面，主要目的為促進病人手部血液循環","足托板每天須取下一次，讓踝關節適度活動","足跟保護器目的為預防足部潰瘍，放置時須維持踝關節呈90度"],"a":"D","k":"D","t":"","x":"足跟保護器可減少足跟受壓、預防足部壓傷潰瘍，放置時應維持踝關節90度以防垂足。氣墊床目的在分散身體壓力而非熱度；手捲軸是維持手指與拇指的功能位置、預防攣縮；足托板應定時（如每數小時）取下活動踝關節，一天一次過少。"},{"i":"103-2|35","e":"103-2","n":35,"c":5,"s":"王太太剖腹生產後第一天，護理師幫王太太執行會陰沖洗時，正確的步驟為何？①分開小陰唇，由上往下輕拭至肛門口 ②輕拭遠側及近側小陰唇 ③輕拭遠側及近側大陰唇 ④拭乾左右大小陰唇、陰道口及肛門口","o":["②→①→③→④","②→③→①→④","①→②→③→④","③→②→①→④"],"a":"C","k":"C","t":"","x":"產後會陰沖洗應由清潔處往污染處、由中間往兩側：先分開小陰唇由上往下輕拭至肛門口（中間），再擦拭遠側及近側小陰唇，接著擦拭遠側及近側大陰唇，最後拭乾左右大小陰唇、陰道口及肛門口，故順序為①→②→③→④。"},{"i":"103-2|43","e":"103-2","n":43,"c":5,"s":"辛氏臥式的目的為何？","o":["用於會陰沖洗、導尿及床上使用便盆時","用於肛門、直腸檢查及手術","協助意識不清或吞嚥困難病人引流口鼻分泌物","使下腔血液回流，預防及治療休克"],"a":"C","k":"C","t":"","x":"辛氏臥式（Sims' position）又稱半俯臥式，頭側向一邊，有利於口鼻分泌物自然流出，適用於意識不清或吞嚥困難病人引流分泌物，也常用於灌腸、肛門檢查。會陰沖洗、導尿多採屈膝仰臥式；預防及治療休克採垂頭仰臥式。"},{"i":"103-2|49","e":"103-2","n":49,"c":5,"s":"可促進產後子宮復原的姿勢為：","o":["辛氏臥式","垂頭仰臥式","膝胸臥式","屈膝仰臥式"],"a":"C","k":"C","t":"","x":"膝胸臥式利用重力使子宮前傾回到正常位置，可促進產後子宮復原，也可用於矯正子宮後傾及胎位不正。辛氏臥式用於引流分泌物、灌腸；垂頭仰臥式用於休克；屈膝仰臥式用於會陰沖洗、導尿等。"},{"i":"103-2|52","e":"103-2","n":52,"c":5,"s":"當病患長期仰臥時，容易產生壓瘡的部位有那些？①耳朵 ②枕骨 ③肩峰突 ④尾骶骨 ⑤股骨粗隆","o":["①②","④⑤","②④","③⑤"],"a":"C","k":"C","t":"","x":"長期仰臥時，主要受壓部位為枕骨、肩胛骨、手肘、薦骨與尾骶骨及足跟，故選②④。耳朵、肩峰突與股骨粗隆是側臥時的主要受壓部位。"},{"i":"103-1|35","e":"103-1","n":35,"c":5,"s":"（情境：吳太太，75歲，因心臟手術住院多日，目前左手有靜脈點滴注射，無家屬陪伴，因傷口疼痛，大多臥床休息，且無法自我照顧，身體有異味。）為吳太太進行床上沐浴時，下列敘述何者正確？","o":["清洗四肢時，應由近心端向遠心端擦拭","背部護理時，可用50%酒精擦拭","脫衣服時，先脫右手","穿衣服時，先穿右手"],"a":"C","k":"C","t":"","x":"吳太太左手有靜脈點滴，更衣時應先脫健側（右手）、再脫患側（左手）；穿衣時先穿患側（左手）、再穿健側，以減少牽扯管路。清洗四肢應由遠心端往近心端擦拭以促進靜脈回流；酒精會使老年人皮膚更乾燥，不宜用於背部護理；穿衣應先穿左手。"},{"i":"103-1|36","e":"103-1","n":36,"c":5,"s":"（情境：吳太太，75歲，因心臟手術住院多日，目前左手有靜脈點滴注射，無家屬陪伴，因傷口疼痛，大多臥床休息，且無法自我照顧，身體有異味。）在為吳太太進行會陰沖洗時，下列敘述何者正確？","o":["病人應採半坐臥式","沖洗壺置於恥骨聯合口約5~6吋處","沖洗壺口朝向床頭，由恥骨聯合處往陰部沖洗","沖洗順序由上往下擦，先擦中間再擦左右"],"a":"D","k":"D","t":"","x":"會陰沖洗時以棉棒由上往下擦拭，先清洗中間（尿道口、陰道口），再清洗兩側小陰唇與大陰唇，以免將肛門細菌帶至尿道與陰道口。病人應採屈膝仰臥式而非半坐臥式；沖洗壺口應朝向床尾，由恥骨聯合處往下沖洗，故A、C錯誤。"},{"i":"103-1|47","e":"103-1","n":47,"c":5,"s":"使用足托板（foot board），是幫助病人維持足部何種姿勢？","o":["背側外展","背側外旋","背側屈曲","背側內收"],"a":"C","k":"C","t":"","x":"足托板（foot board）使足底緊靠底板，維持踝關節約90度的背側屈曲姿勢，以預防足部蹠屈造成的垂足。外展、外旋、內收均不是使用足托板所要維持的足部姿勢。"},{"i":"103-1|48","e":"103-1","n":48,"c":5,"s":"有關長期臥床病人姿勢維持的基本原則，下列敘述何者正確？","o":["各關節要保持伸展，以免關節及肌肉攣縮","為維持良好姿勢，身體各部位要給予適當支托","姿勢每四小時需更換一次","不管何種病人，姿勢改變時，關節均要做全範圍運動預防攣縮"],"a":"B","k":"B","t":"","x":"長期臥床病人應以枕頭、捲軸等支托物給予身體各部位適當支托，以維持良好的身體排列。關節應維持微彎的功能性位置而非完全伸展；姿勢至少每2小時更換一次；關節全範圍運動須視病情而定，有禁忌者（如骨折、脊椎損傷）不可一律執行。"},{"i":"103-1|49","e":"103-1","n":49,"c":5,"s":"（情境：張先生，25歲，騎機車上班途中發生車禍，造成脊椎受損接受脊椎手術，目前臥床休息。）護理師欲協助張先生翻向左側臥時，下列措施何者不適當？","o":["應採圓滾木翻身法","可利用翻身單的力量與支托，先將病人移至右側，拉起床欄","將病人右側手臂移至頭側，左側手臂橫放胸前，以助翻身","兩人執行時，需動作一致，保持病人脊椎平直"],"a":"C","k":"C","t":"","x":"脊椎手術後應採圓滾木翻身法，翻向左側時先以翻身單將病人移至床的右側再翻身，雙手應交叉置於胸前，翻身時保持頭、頸、脊椎成一直線。將右手臂上舉至頭側會牽動肩部與脊椎、造成扭轉，故C不適當；兩人動作一致、保持脊椎平直皆正確。"},{"i":"102-1|30","e":"102-1","n":30,"c":5,"s":"陳先生72歲，因腦中風住院，目前意識不清，無自理能力。針對陳先生採取的舒適姿勢之措施，下列敘述何者錯誤？","o":["至少每2小時翻身一次，以防止壓瘡的形成","仰臥姿勢時，可讓病人手握小捲軸，以防止腕關節過度屈曲造成垂腕","採側臥時，應注意最容易受壓的薦骨及足跟部位","使用足托板預防垂足時，至少需每4小時移開一次，以活動踝關節"],"a":"C","k":"C","t":"","x":"側臥時易受壓部位為耳朵、肩峰突、肋骨、股骨大粗隆、膝內外側及內外踝；薦骨與足跟是仰臥時的受壓部位，故C錯誤。意識不清者至少每2小時翻身；手握小捲軸可預防垂腕與手指攣縮；足托板須定時移開活動踝關節。"},{"i":"102-1|36","e":"102-1","n":36,"c":5,"s":"有關會陰沖洗的敘述，下列何者錯誤？","o":["每枝棉棒只使用一次，以免交互感染","沖洗壺口朝向床頭，以利沖淨陰道和尿道口","沖洗時沖洗液保持不間斷，以配合棉棒洗淨各區域","沖洗棉棒的方向由上往下，以避免將肛門處的細菌帶至陰道口"],"a":"B","k":"B","t":"","x":"會陰沖洗時沖洗壺口應朝向床尾（由上往下沖），避免沖洗液及污物逆流進入陰道與尿道口造成感染，故B錯誤。每枝棉棒只用一次、沖洗液持續不中斷配合棉棒清洗、由上往下擦拭避免將肛門細菌帶至陰道口，皆為正確原則。"},{"i":"102-1|49","e":"102-1","n":49,"c":5,"s":"吳小姐因車禍造成內出血疑似有休克狀況，護理師協助其改變姿勢，下列何者最適宜？","o":["垂頭仰臥式","屈膝仰臥式","半坐臥式","仰臥式"],"a":"A","k":"A","t":"","x":"休克病人宜採垂頭仰臥式（Trendelenburg position），利用重力使下肢及腹腔血液回流至心臟與腦部，增加回心血量與重要器官灌流。半坐臥式會使血液滯留下肢而加重休克；屈膝仰臥及一般仰臥無促進回流的效果。"},{"i":"101-2|47","e":"101-2","n":47,"c":5,"s":"王老先生意識不清，護理師給予翻身，當翻成仰臥姿勢時，則下列何者錯誤？","o":["頭、頸肩下可置枕頭，使個案較舒適","兩手各握一小捲軸，使手指彎曲","腰部到膝蓋外側以粗隆捲軸加以固定","膝膕正下方置放枕頭支托"],"a":"D","k":"D","t":"","x":"仰臥時不可在膝膕正下方直接放置枕頭，以免壓迫膕窩血管與神經、影響下肢循環並造成膝關節屈曲攣縮，可改墊於小腿下。頭頸肩下可放枕頭；手握小捲軸使手指微彎維持功能位置；以粗隆捲軸置於腰部至膝蓋外側可預防髖關節外旋。"},{"i":"100-2|37","e":"100-2","n":37,"c":5,"s":"陳老太太左側無力，今早護理師為她執行床上沐浴時，陳老太太堅持會陰部自己清理，下列處理何者最適當？","o":["委婉告知這是護理師的職責，請其配合完成工作","委婉告知因為她左手無力，可能無法清洗乾淨會陰部，請其配合完成工作","在尊重陳老太太的隱私下，協助她以右手完成會陰部清洗","離開病房，讓她獨自完成會陰部清洗"],"a":"C","k":"C","t":"","x":"會陰部清潔涉及隱私，病人雖左側無力但右手仍有能力，應尊重其意願與隱私，協助並鼓勵她以健側右手自行清洗，護理師在旁給予協助與確認清潔程度。強迫由護理師執行忽略病人自主性；完全離開病房則無法確保安全與清潔效果。"},{"i":"100-2|38","e":"100-2","n":38,"c":5,"s":"江先生患有心臟疾病，下列何者為護理師進行護理照護時安排其採坐臥姿勢的理由？","o":["使橫膈下降，胸廓易於擴張、回心血量少","使肺臟易於擴張、降低身體氧合功能","使心臟瓣膜依重力原理擴張，促進周邊血液循環","使周邊血液流速變慢，減少四肢冰冷，增加舒適"],"a":"A","k":"A","t":"","x":"坐臥姿（Fowler's position）利用重力使腹腔臟器下移、橫膈下降，胸廓容易擴張，改善呼吸；同時下肢血液滯留使回心血量減少，減輕心臟負荷，適合心臟病人。此姿勢可提升而非降低氧合功能，與心臟瓣膜擴張或減少四肢冰冷無關。"},{"i":"100-1|28","e":"100-1","n":28,"c":5,"s":"有關協助病患維持舒適的仰臥姿勢，下列敘述何者正確？","o":["維持頭、頸與脊柱呈一弧線形","於膝膕下放一個枕頭，預防膝關節攣縮","使用足托板，預防比目魚肌與腓腸肌不自主收縮，並可預防垂足","腰下不可置放支托物，以免影響脊椎的正常線條"],"a":"C","k":"C","t":"","x":"仰臥時使用足托板可使足部維持背側屈曲（踝關節約90度），避免比目魚肌與腓腸肌攣縮造成垂足。仰臥時頭、頸與脊柱應呈一直線而非弧線；膝膕正下方放枕頭會壓迫膕窩血管神經並導致膝關節屈曲攣縮；腰下可放小枕支托，以維持腰椎正常弧度。"},{"i":"115-2|19","e":"115-2","n":19,"c":6,"s":"食糜隨著結腸壁的收縮，將食糜推向下一個結腸袋，此為大腸的何種運動？","o":["攪拌運動","蠕動運動","質塊運動","擴張運動"],"a":"A","k":"A","t":"","x":"結腸袋攪拌運動是結腸袋壁收縮，把內容物推入下一個結腸袋並來回攪拌，以利水分吸收。蠕動運動是推進性收縮；質塊運動是一天數次的強力收縮，將糞便推向直腸；並沒有「擴張運動」。"},{"i":"115-2|21","e":"115-2","n":21,"c":6,"s":"成年病人尿瀦留原因，下列敘述何者最不適當？","o":["手術後泌尿道感染","手術麻醉藥物殘留影響","膀胱神經末梢受損","膀胱失去弛張力"],"a":"A","k":"A","t":"","x":"尿瀦留是膀胱內的尿液無法排出，常見原因有手術麻醉藥物殘留、膀胱神經受損、膀胱失去張力或尿道阻塞。泌尿道感染多引起頻尿、急尿、解尿疼痛，並不是尿瀦留的主要原因。"},{"i":"115-2|35","e":"115-2","n":35,"c":6,"s":"陳老太太，因12小時未自解尿液，單導後發現尿液呈現混濁、乳靡狀，下列何者為可能的原因？","o":["脂肪肝","念珠菌感染","酮酸中毒","脫水患者"],"a":"B","k":"B","t":"","x":"尿液混濁、呈乳白色，多表示尿中有膿細胞或微生物，提示泌尿道感染；長時間尿瀦留的老年人容易發生細菌或念珠菌感染。脂肪肝不會使尿液呈乳白色；酮酸中毒時尿中出現酮體；脫水時尿液濃縮，呈深琥珀色。"},{"i":"115-1|21","e":"115-1","n":21,"c":6,"s":"病人中風後左側肢體無力多年，活動量少、無法自己解便，家屬常以甘油球灌腸幫助排便。下列護理措施何者最適當？","o":["每日早餐後協助病人坐在馬桶上","糞便嵌塞時以肥皂水灌腸最有效","每日攝取2,500～3,000 mL的橘子汁","協助以手由左至右順著結腸按摩"],"a":"A","k":"A","t":"","x":"早餐後胃結腸反射最強，每天早餐後協助病人坐上馬桶，可利用重力與腹壓建立規律排便習慣，故選(A)。糞便嵌塞最有效的處理是以手指挖除（可先給予油類保留灌腸軟化），而非肥皂水灌腸；水分應以開水為主並增加纖維攝取，不宜只靠大量果汁；腹部按摩應由右向左順著結腸走向進行。"},{"i":"115-1|22","e":"115-1","n":22,"c":6,"s":"有關導尿管大小選擇原則，下列何者正確？","o":["男性成人一般使用20～22 Fr.導尿管","兒童使用12～14 Fr.導尿管","泌尿道手術病人的膀胱灌洗可使用18 Fr.以上導尿管","男、女性成人使用相同大小管徑的導尿管"],"a":"C","k":"C","t":"","x":"泌尿道手術後需膀胱灌洗以沖出血塊，宜選用管徑較粗（18 Fr.以上）的三路導尿管，以免阻塞。一般成人男性用16～18 Fr.、女性14～16 Fr.，兒童8～10 Fr.，男女所用管徑並不相同。"},{"i":"114-3|18","e":"114-3","n":18,"c":6,"s":"有關健康成人泌尿道的排泄，下列敘述何者最適當？","o":["尿道內擴約肌位於尿道內口，屬於不隨意控制","膀胱容量為600～800 c.c.，最多可容納2,000～3,000 c.c.","當尿液達200 c.c.時，膀胱內壓上升至150 mmH2O，產生排尿反射","男性尿道長度約為5～10公分"],"a":"A","k":"A","t":"","x":"尿道內括約肌位於尿道內口，由平滑肌構成，受自主神經支配，屬不隨意控制。成人膀胱容量約300～500 mL（最多約1,000～2,000 mL）；尿量約300 mL、內壓升至180 mmH2O時才產生排尿反射；男性尿道長約20公分，5公分左右是女性尿道的長度。"},{"i":"114-3|20","e":"114-3","n":20,"c":6,"s":"病人在快走、咳嗽或打噴嚏時常有少量尿液溢出，下列護理措施何者最不適當？","o":["指導每日做凱格爾氏運動（Kegel’s exercise）","指導外出時可使用護墊或尿布","建議建立規則間隔的解尿時間","指導增加茶或可可亞的攝取"],"a":"D","k":"D","t":"","x":"快走、咳嗽或打噴嚏時漏尿，屬應力性尿失禁。茶、可可亞含咖啡因，有利尿及刺激膀胱的作用，會加重頻尿與漏尿，應減少攝取，故D最不適當。凱格爾運動可強化骨盆底肌；外出時可用護墊保護；定時解尿可避免膀胱過度充盈。"},{"i":"114-3|21","e":"114-3","n":21,"c":6,"s":"病人術後6小時未自行解尿，護理人員欲協助誘尿，下列方法何者最不適當？","o":["聽流水聲刺激大腦皮質產生尿意","執行溫水坐浴以放鬆尿道括約肌","依醫囑於病人的膀胱部位放置熱水袋","足部施予熱敷刺激末梢神經"],"a":"D","k":"D","t":"","x":"誘尿方法包括聽流水聲、溫水坐浴或會陰沖洗以放鬆尿道括約肌、依醫囑在膀胱部位放熱水袋、撫摸大腿內側等。足部熱敷沒有直接誘發排尿反射的作用，是最不適當的方法。"},{"i":"114-3|22","e":"114-3","n":22,"c":6,"s":"有關一般病人腹瀉的護理措施，下列敘述何者最適當？","o":["急性期時增加高熱量食物攝取","補充鈉、鉀離子與水分","攝取高纖維軟質食物","肛門周圍皮膚塗抹類固醇軟膏"],"a":"B","k":"B","t":"","x":"腹瀉時大量水分與鈉、鉀等電解質隨糞便流失，應補充水分與電解質以防脫水。急性期應暫時禁食或採低渣清淡飲食，不宜高熱量；高纖維食物會刺激腸蠕動、加重腹瀉；肛門周圍皮膚應以溫水清潔，塗氧化鋅（ZnO）軟膏保護，不是使用類固醇軟膏。"},{"i":"114-3|35","e":"114-3","n":35,"c":6,"s":"有關疑似感染阿米巴痢疾病人的糞便檢體蒐集，下列敘述何者最適當？","o":["須立即放在檢體冰箱，再送到檢驗科","檢體保持近體溫狀態，於30分鐘內送到檢驗科","檢體放在護理站檢體蒐集盒，明天送到檢驗科","須使用浮膠貼紙蒐集檢體，再送到檢驗科"],"a":"B","k":"B","t":"","x":"阿米巴原蟲在接近體溫時才有活動力，容易在顯微鏡下辨識，冷卻後活動力喪失，所以檢體應保溫並在30分鐘內送檢。冷藏或延遲到隔天送檢都會使原蟲死亡而影響結果；透明膠紙（浮膠貼紙）是蟯蟲檢查使用的方法。"},{"i":"114-2|11","e":"114-2","n":11,"c":6,"s":"有關女性存留導尿法的敘述，下列何者錯誤？","o":["先鋪洞巾於會陰部後，再進行消毒","以水性潤滑液潤滑導尿管頭部5～7公分","確認導尿管可適當引流尿液時，以空針打入5～10 mL無菌蒸餾水","水球固定後，導尿管向外輕拉，直接固定於下腹部"],"a":"D","k":"D","t":"","x":"女性存留導尿管在水球固定、輕拉確認後，應以膠布固定於大腿內側；固定於下腹部是男性病人的做法，可減少陰莖陰囊交界處受壓，故D錯誤。女性導尿管潤滑長度約5～7公分；確認尿液流出後，再打入5～10 mL無菌蒸餾水固定水球。"},{"i":"114-2|21","e":"114-2","n":21,"c":6,"s":"間歇導尿法不適用於下列何種情況？","o":["留取無菌尿液標本","測餘尿量","尿失禁","手術後尿瀦留"],"a":"C","k":"C","t":"","x":"間歇（單次）導尿適用於導出膀胱尿液以減輕脹痛、取無菌尿液標本、測餘尿量，以及術後尿瀦留的處理。尿失禁病人若需保護皮膚與床褥，屬存留導尿的適用情況，不是間歇導尿的適應症。"},{"i":"114-1|20","e":"114-1","n":20,"c":6,"s":"有關灌腸的相關敘述，下列何者正確？","o":["保留灌腸溶液需在腸道內保留5〜10分鐘","保留灌腸常用於協助病人解除便秘","麻醉劑可使用保留灌腸方式給與","清潔灌腸是最常見的保留灌腸"],"a":"C","k":"C","t":"","x":"保留灌腸是由直腸供給藥物或水分的方法，溶液需在腸道內保留15～30分鐘以利吸收，麻醉劑、鎮靜劑即可用此法給予。保留5～10分鐘即排出的是非保留灌腸（A錯）；解除便祕主要使用清潔灌腸等非保留灌腸（B錯）；清潔灌腸屬非保留灌腸（D錯）。"},{"i":"114-1|21","e":"114-1","n":21,"c":6,"s":"有關尿液性質的敘述，下列何者錯誤？","o":["泌尿道感染病人尿液中的白血球可能高於正常值","糖尿病病人的尿液中可能出現葡萄糖","長期嘔吐者的尿液中可能出現酮體","肝臟疾病者的尿液中可能出現圓柱體"],"a":"D","k":"D","t":"","x":"尿中出現圓柱體多表示腎臟疾病，不是肝臟疾病；肝病或膽道阻塞時，尿中可能出現膽紅素，故D錯誤。泌尿道感染時尿液白血球增加；糖尿病病人可能出現尿糖；長期嘔吐、飢餓使脂肪分解增加，尿中可能出現酮體。"},{"i":"113-3|19","e":"113-3","n":19,"c":6,"s":"當脂肪取代醣類為身體能量的主要來源時，尿液中會出現那一種大量的物質？","o":["酮體","圓柱體","蛋白質","膽紅素"],"a":"A","k":"A","t":"","x":"當醣類攝取不足或無法利用（如飢餓、糖尿病控制不良）時，身體改以脂肪為主要能量來源，脂肪代謝產生大量酮體，經尿液排出形成酮尿。圓柱體多與腎臟疾病有關；蛋白尿見於腎絲球病變；膽紅素尿見於肝膽疾病。"},{"i":"113-3|20","e":"113-3","n":20,"c":6,"s":"下列那些藥物會造成便秘？①鐵劑 ②鈣離子阻斷劑 ③抗生素 ④含鎂制酸劑 ⑤鴉片類止痛藥","o":["①③④","②③④","①②⑤","②③⑤"],"a":"C","k":"C","t":"","x":"鐵劑、鈣離子阻斷劑及鴉片類止痛藥都會抑制腸道蠕動或使糞便變硬，易造成便祕，故①②⑤正確。抗生素常破壞腸道菌叢而引起腹瀉；含鎂制酸劑具有輕瀉作用，也較易造成腹瀉。"},{"i":"113-3|31","e":"113-3","n":31,"c":6,"s":"有關病人飲食衛教內容，下列敘述何者最適當？","o":["大腸鏡檢查前三天之低渣飲食，例如：去皮去筋的魚肉、雞肉","腸道手術準備之清流飲食，例如：果菜汁、無糖豆漿","膽囊炎初恢復期飲食，例如：酪梨、清蒸肉","中風後易嗆咳者學習吞嚥飲食，例如：鮮魚湯、鮮奶"],"a":"A","k":"A","t":"","x":"大腸鏡檢查前三天應採低渣飲食，減少腸道殘渣以利清腸及檢查視野，去皮去筋的魚肉、雞肉屬低渣食物，故A適當。果菜汁、豆漿不屬清流質；膽囊炎恢復期應低脂，酪梨脂肪含量高；吞嚥困難易嗆咳者應避免稀液體（如湯、鮮奶），宜選濃稠或糊狀食物。"},{"i":"113-2|20","e":"113-2","n":20,"c":6,"s":"尿液pH值過低的可能原因，下列何者正確？①呼吸性鹼中毒 ②代謝性酸中毒 ③飢餓 ④泌尿道感染","o":["①④","②③","①③","②④"],"a":"B","k":"B","t":"","x":"代謝性酸中毒時腎臟排出較多氫離子，尿液偏酸；飢餓時脂肪分解產生酮體，尿液亦偏酸，故②③正確。呼吸性鹼中毒時腎臟代償排出碳酸氫根，尿液偏鹼；泌尿道感染（尤其分解尿素的細菌）會使尿液偏鹼。"},{"i":"113-2|21","e":"113-2","n":21,"c":6,"s":"有關膀胱灌洗的目的，下列何者錯誤？","o":["沖除膀胱內的異物","保持尿路的通暢","預防泌尿系統手術後膀胱內血凝塊的形成","灌入藥物以治療腸胃系統的感染"],"a":"D","k":"D","t":"","x":"膀胱灌洗的目的為沖除膀胱內的血塊、黏液、沉澱物等異物，維持尿路通暢，預防泌尿道手術後血塊形成，以及灌入藥物治療膀胱感染或病變。膀胱灌洗作用於泌尿道，無法治療腸胃系統的感染，故D錯誤。"},{"i":"113-2|22","e":"113-2","n":22,"c":6,"s":"記錄導尿管留置病人的輸出入量時，發現3小時中尿袋內的尿量為零，應先執行下列何項處置？","o":["準備進行大量輸液","準備重新放置導尿管","通知醫生進行緊急處理","檢查導尿系統的通暢性"],"a":"D","k":"D","t":"","x":"留置導尿管的尿袋數小時無尿時，應先檢查導尿系統是否通暢，如管路是否扭曲、受壓、阻塞或尿袋位置不當。確認系統通暢後仍無尿，才考慮是否為少尿或無尿而通知醫師處理，不應直接重置導尿管或大量輸液。"},{"i":"113-2|34","e":"113-2","n":34,"c":6,"s":"李先生剛從開發中國家入境，因發燒不適住院，護理師協助收集糞便檢體，下列敘述何者正確？","o":["進行阿米巴原蟲糞便檢查前，應先排空膀胱","收集糞便細菌培養，可直接以棉棒挖取馬桶中糞便","收集蟯蟲檢體，應於晚間洗澡後立即採檢","收集糞便蟲卵檢體後，應儘快冷藏，30分鐘內送檢"],"a":"A","k":"A","t":"","x":"收集阿米巴原蟲糞便檢體前應先排空膀胱，避免尿液混入影響原蟲存活與檢驗結果。糞便不可從馬桶中挖取，應解於清潔便盆；蟯蟲檢體應在清晨起床、洗澡及排便前以透明膠帶黏取肛門口；需保溫（不可冷藏）並於30分鐘內送檢的是阿米巴原蟲（滋養體）檢體，一般蟲卵檢查並無「冷藏且30分鐘內送檢」的要求，故D錯誤。"},{"i":"113-1|19","e":"113-1","n":19,"c":6,"s":"脊髓損傷的病人，無法自行排空膀胱，下列護理措施何者最適當？","o":["限制液體攝入量1,000 mL/天","教導凱格爾氏（Kegel’s exercise）","教導以手向下壓迫膀胱部位","協助置入留置導尿管"],"a":"C","k":"C","t":"","x":"脊髓損傷造成神經性膀胱、無法自行排尿時，可教導以手由臍下往恥骨方向向下壓迫膀胱（Credé's手法）協助排空膀胱。限水會增加泌尿道感染及結石風險；凱格爾運動用於加強骨盆底肌、改善應力性尿失禁；長期留置導尿管感染風險高，宜優先考慮間歇導尿或手壓排尿。"},{"i":"113-1|20","e":"113-1","n":20,"c":6,"s":"有關結腸灌洗（colon irrigation）目的之相關敘述，下列何者錯誤？","o":["提供術前準備","減輕嚴重痔瘡疼痛","清除腸道內之糞便","降低體內氨之濃度"],"a":"B","k":"B","t":"","x":"結腸灌洗是以大量溶液反覆灌入並流出，用於清除腸道糞便、術前或檢查前準備、降低腸道產氨以減少血氨（如肝昏迷）等。嚴重痔瘡疼痛者插管易造成疼痛與出血，結腸灌洗並非減輕痔瘡疼痛的方法。"},{"i":"113-1|21","e":"113-1","n":21,"c":6,"s":"有關導尿管的選擇原則，下列何者錯誤？","o":["塑膠材質的導尿管使用期限可長達1個月","泌尿道手術的病人可使用18 Fr.以上的導尿管","當病人需要進行膀胱灌洗時應選擇三路導尿管","小孩大多選擇使用8～10 Fr.導尿管"],"a":"A","k":"A","t":"","x":"塑膠材質導尿管較硬、刺激性大，多用於單次導尿或短期使用，不適合長期留置1個月，故A錯誤；可長期使用約1個月的是矽膠導尿管。泌尿道手術後常用較粗（18 Fr以上）的導尿管以利血塊排出；膀胱灌洗需三路導尿管；兒童多用8～10 Fr。"},{"i":"113-1|33","e":"113-1","n":33,"c":6,"s":"護理師衛教病人收集24小時尿液檢體，下列敘述何者正確？","o":["於7 AM請病人解尿，此次尿液不要，之後開始收集每次解的尿液到次日7 AM","收集尿液期間如果有遺漏收集，則需持續收集到遺漏之時間點","隔日7 AM請病人解最後一次尿液，丟棄不收集","將24小時收集到尿液，栓緊容器瓶蓋，連同檢驗單儘速送檢"],"a":"A","k":"A","t":"","x":"收集24小時尿液時，於7 AM請病人解尿並丟棄，之後所有尿液都要收集至次日7 AM（含次日7 AM該次）。若中途遺漏應重新開始收集，而非延長補足；次日7 AM最後一次尿液必須收集；收集期間尿液應冷藏或加防腐劑保存。D未先記錄24小時總尿量並混勻，一般應記錄總量、混勻後依檢驗室規定送檢，故D不如A正確。"},{"i":"112-3|17","e":"112-3","n":17,"c":6,"s":"下列何者不是灌腸的禁忌症？","o":["產科安胎者","急性闌尾炎者","結腸造口者","直腸潰瘍者"],"a":"C","k":"C","t":"","x":"結腸造口者可經造口執行結腸灌洗或灌腸，並非灌腸的禁忌。安胎孕婦灌腸可能刺激子宮收縮，急性闌尾炎灌腸可能增加腸蠕動導致穿孔，直腸潰瘍則易因插管與溶液造成損傷，均屬禁忌。"},{"i":"112-3|18","e":"112-3","n":18,"c":6,"s":"有關成人尿液分析的結果，下列何者異常？","o":["尿液總量1,450 mL／天","葡萄糖2 mg/dL","尿蛋白質5 mg/dL","白血球20個／高倍視野"],"a":"D","k":"D","t":"","x":"正常尿液在高倍視野下白血球約0～5個，20個／高倍視野表示可能有泌尿道感染或發炎，屬異常。成人每日尿量約1,000～2,000 mL，1,450 mL正常；正常尿中可有微量葡萄糖與蛋白質，2 mg/dL及5 mg/dL仍在正常範圍。"},{"i":"112-3|19","e":"112-3","n":19,"c":6,"s":"預防因長期導尿管留置而引發感染，下列敘述何者正確？","o":["矽質尿管需每3個月更換1次","集尿袋內若有沉澱物，可以用清水清洗以保持清潔","如沒有限水，鼓勵每日攝取液體至少3,000 mL以上","女性病人每日以水溶性優碘執行會陰沖洗3次"],"a":"C","k":"C","t":"","x":"無限水時鼓勵每日攝取液體2,500～3,000 mL以上，可增加尿量沖洗泌尿道，預防感染。矽膠導尿管約1個月更換；集尿袋為密閉系統，不可打開以清水清洗；會陰清潔一般以清水或肥皂水每日2次即可，不需以優碘沖洗3次。"},{"i":"112-3|33","e":"112-3","n":33,"c":6,"s":"有關收集24小時尿液檢體的敘述，下列何者正確？","o":["主要目的是測試膀胱功能","當日7AM起收集，至次日7AM那一次尿液不留","收集的尿液應置於保溫箱內維持溫度","收集尿液期間如有遺漏，應隔天7AM重新收集"],"a":"D","k":"D","t":"","x":"收集24小時尿液期間若有遺漏，結果即不準確，須重新開始收集，故D正確。24小時尿液主要用於評估腎功能及尿中物質排出量；當日7 AM的尿液應丟棄，次日7 AM的最後一次尿液要收集；收集的尿液應冷藏或加入防腐劑，而非保溫。"},{"i":"112-2|29","e":"112-2","n":29,"c":6,"s":"關於清潔灌腸之敘述，下列何者正確？","o":["可利用清潔灌腸提供營養","生理食鹽水是最常用的灌腸溶液","溶液保留在腸道內30分鐘後排出","成人灌入量不超過240c.c."],"a":"B","k":"B","t":"","x":"生理食鹽水為等張溶液、對腸黏膜刺激小，是最常用的灌腸溶液。清潔灌腸目的在清除腸道糞便，不用來提供營養；溶液保留約5～10分鐘即排出；成人灌入量約750～1,000 mL，不超過240 mL的是小量灌腸。"},{"i":"112-2|30","e":"112-2","n":30,"c":6,"s":"尿液中出現膽紅素，可能是因為下列何種狀況所致？","o":["脫水","泌尿道感染","阻塞性黃疸","腎臟病"],"a":"C","k":"C","t":"","x":"尿液中正常不含膽紅素，若出現膽紅素表示結合型膽紅素經腎排出，常見於阻塞性黃疸或肝炎。脫水主要使尿液濃縮、比重上升；泌尿道感染多見白血球、細菌；腎臟病則以蛋白尿、圓柱體等為主。"},{"i":"112-2|31","e":"112-2","n":31,"c":6,"s":"病人解出黏液便，下列護理師的解釋何者較為適當？","o":["建議你多喝水就會正常","多吃蔬菜水果就會好","因為你被診斷為膽結石","醫師診斷疑似為腸道感染"],"a":"D","k":"D","t":"","x":"糞便中出現黏液表示腸道黏膜受刺激或發炎，常見於腸道感染或發炎性疾病，應向病人說明可能原因並配合檢查。單靠多喝水或多吃蔬果無法處理黏液便；膽結石阻塞膽道主要造成灰白色（陶土色）糞便，而非黏液便。"},{"i":"112-2|32","e":"112-2","n":32,"c":6,"s":"有關便秘的護理措施，下列何者正確？","o":["成人每日應攝取1,000～1,500 mL的液體","衛教每日早餐後自行用甘油灌腸","排便時由腹部左側順著腸道向右側按摩","鼓勵食用小紅莓汁以刺激腸蠕動"],"a":"D","k":"D","t":"","x":"梅子汁、檸檬汁、橘子汁、小紅莓汁等可刺激腸蠕動並軟化糞便，有助改善便祕。成人便祕時每日應攝取約2,000～2,500 mL液體；不宜長期常規自行灌腸以免形成依賴；腹部按摩應由右下腹往上、經橫結腸向左再往下，順著結腸走向由右向左進行。"},{"i":"112-1|29","e":"112-1","n":29,"c":6,"s":"當病人使用三路導尿管（3 Way Foley）時，有關其三個管腔作用的敘述，下列何者錯誤？","o":["固定","排氣","引流尿液","灌注治療用溶液"],"a":"B","k":"B","t":"","x":"三路導尿管的三個管腔分別用於引流尿液、注入液體使氣囊膨脹以固定、以及灌注治療用溶液（如膀胱灌洗），並沒有排氣的管腔，故B錯誤。"},{"i":"112-1|30","e":"112-1","n":30,"c":6,"s":"有關尿液特性之敘述，下列何者錯誤？","o":["尿比重正常值為1.030～1.050","尿液pH值正常為4.6～8.0","正常尿液不含膽紅素","混濁尿可能是泌尿道感染所致"],"a":"A","k":"A","t":"","x":"正常尿比重約為1.010～1.030，1.030～1.050超出正常範圍，故A錯誤。尿液pH值正常約4.6～8.0；正常尿液不含膽紅素；尿液混濁可能為泌尿道感染所致。"},{"i":"112-1|31","e":"112-1","n":31,"c":6,"s":"下列那些物質是糞便正常的成分？①脂肪 ②膽紅素 ③鈣、磷 ④剝落的死菌 ⑤紅血球","o":["①②④⑤","②③④⑤","①②③④","①②③⑤"],"a":"C","k":"C","t":"","x":"正常糞便成分包括水分、未消化的食物殘渣、脂肪、膽色素（膽紅素代謝物）、鈣磷等無機鹽、剝落的腸黏膜細胞及死菌等，故選①②③④。糞便中出現紅血球表示腸胃道出血，屬異常成分。"},{"i":"112-1|32","e":"112-1","n":32,"c":6,"s":"有關成人泌尿道感染的敘述，下列何者錯誤？","o":["大腸桿菌是常見的致病菌","輸尿管結石者易發生感染","常見症狀有解尿時燒灼感","鹼化尿液能抑制細菌生長"],"a":"D","k":"D","t":"","x":"細菌在鹼性尿液中較易生長，酸化尿液（如攝取蔓越莓汁、維生素C）才能抑制細菌生長，故D錯誤。大腸桿菌為泌尿道感染最常見的致病菌；結石阻塞易造成感染；常見症狀包括頻尿、急尿及解尿時燒灼感。"},{"i":"112-1|51","e":"112-1","n":51,"c":6,"s":"關於24小時尿液檢體收集（當日早晨7點至隔日早晨7點），下列敘述何者正確？①當日早晨7點的小便需要收集在尿瓶內 ②隔日早晨 7 點再解最後一次尿，並收集於瓶內 ③檢驗單上需註明病人24小時尿液總量 ④女性月經週期期間仍可收集24小時尿液檢體","o":["①②","②③","③④","①④"],"a":"B","k":"B","t":"","x":"收集24小時尿液時，開始時間（當日7 AM）應先解掉小便丟棄，結束時間（隔日7 AM）的最後一次尿液則須收集於瓶內，並於檢驗單上註明24小時尿液總量，故選②③。女性月經期間收集的尿液易受經血污染，應避開。"},{"i":"112-1|52","e":"112-1","n":52,"c":6,"s":"為身上有存留導尿管病人進行尿液培養檢體收集，下列敘述何者正確？","o":["將管夾或者止血鉗夾住導尿管15～30分鐘，以利取尿液檢體","分別以1%的水溶性優碘及75%酒精溶液的棉棒環形消毒導尿管接蓄尿袋的橡皮端","以清潔空針抽取11～15 mL的尿液檢體，以有足夠的量進行尿液培養","尿液檢體應於2小時內送檢，避免pH值下降"],"a":"A","k":"A","t":"","x":"存留導尿管病人收集尿液培養檢體時，可先以管夾夾住導尿管15～30分鐘使尿液蓄積，再以無菌空針從導尿管採檢處消毒後抽取，故A正確。應以無菌空針而非清潔空針抽取；消毒部位為導尿管採檢處；檢體應於30分鐘內儘速送檢。"},{"i":"111-2|3","e":"111-2","n":3,"c":6,"s":"有關使用直腸栓劑以助排便的敘述，下列何者錯誤？","o":["應將栓劑塞入直腸中約7公分深","藥物須留置體內約15～30分鐘","為利用胃結腸反射，宜於飯後1小時塞入","栓劑平時應儲存於冰箱"],"a":"C","k":"C","t":"","x":"使用栓劑助排便時，宜於飯前約30分鐘或預定排便時間前半小時塞入，使藥效發揮時正好配合進食後的胃結腸反射，故C飯後1小時塞入錯誤。栓劑應塞入直腸約7公分、留置約15～30分鐘，平時應冷藏保存。"},{"i":"111-2|29","e":"111-2","n":29,"c":6,"s":"有關灌腸時肛管插入的深度及大小的選擇，下列敘述何者正確？","o":["兒童肛管插入深度約2.5～4.5 公分","成人肛管插入深度約5～7 公分","兒童小量灌腸宜選用 19～20 Fr.的肛管","成人大量灌腸宜選用22～24 Fr.的肛管"],"a":"D","k":"D","t":"","x":"成人灌腸肛管宜選用22～24 Fr.，兒童14～18 Fr.，故D正確。肛管插入深度成人約7.5～10公分，兒童約5～7.5公分；兒童不宜選用19～20 Fr.的較粗肛管。"},{"i":"111-2|30","e":"111-2","n":30,"c":6,"s":"楊女士接受子宮全切除手術，術後使用Morphine PCA (patient controlled analgesia)和靜脈輸液持續滴注，術後第一天楊女士移除 foley 後 6 小時仍尚未解尿，觸診下腹部膀胱處鼓脹，下列何者不是有關其尿瀦留的原因？","o":["尿道括約肌收縮過強","Morphine藥物作用","手術導致膀胱組織受損","靜脈輸液量過少"],"a":"D","k":"D","t":"","x":"手術後尿瀦留的原因包括麻醉及Morphine等藥物抑制膀胱收縮、手術造成膀胱或神經受損、疼痛與焦慮使尿道括約肌收縮過強等。楊女士持續接受靜脈輸液，膀胱已鼓脹，尿液量並不少，故輸液量過少不是原因，選D。"},{"i":"111-2|31","e":"111-2","n":31,"c":6,"s":"尿液中紅血球增加的可能原因，下列何者錯誤？","o":["導尿受傷","尿路結石","肝膽疾病","輸血血型不合"],"a":"C","k":"C","t":"","x":"尿液中紅血球增加（血尿）可見於導尿損傷、尿路結石、泌尿道感染或腫瘤、輸血血型不合造成溶血等。肝膽疾病主要使尿液中膽紅素增加，尿色呈深茶色，並不會使紅血球增加，故選C。"},{"i":"111-2|32","e":"111-2","n":32,"c":6,"s":"下列那一種情況，病人的大便較不可能是黑色？","o":["十二指腸潰瘍","直腸出血","服用鐵劑","吃太多豬肝"],"a":"B","k":"B","t":"","x":"上腸胃道出血（如十二指腸潰瘍）的血液經消化後使糞便呈黑色柏油便，服用鐵劑或食用大量豬肝等含鐵、血的食物亦可能使糞便變黑。直腸出血屬下腸胃道出血，血液未經消化，糞便多呈鮮紅色，故選B。"},{"i":"111-2|52","e":"111-2","n":52,"c":6,"s":"有關糞便檢體之收集，下列敘述那些正確？①糞便常規檢查可以檢查細菌、寄生蟲等 ②利用糞便培養可以檢測出痢疾 ③利用糞便培養可以檢測出阿米巴原蟲 ④糞便潛血試驗可以檢測糞便中是否有潛血現象 ⑤收集痢疾檢體，需溫熱便盆 ⑥女性生理期間，潛血反應可能呈現偽陰性","o":["①②④","③④⑤","②④⑥","①③⑥"],"a":"A","k":"A","t":"","x":"糞便常規檢查可檢查細菌、寄生蟲等；糞便培養可檢出細菌性痢疾；潛血試驗可檢測糞便中有無潛血，故①②④正確。阿米巴原蟲需以溫熱便盆收集新鮮糞便並儘速送檢，而非以培養檢出；女性生理期間潛血反應易呈偽陽性而非偽陰性。"},{"i":"111-1|29","e":"111-1","n":29,"c":6,"s":"吳老先生住院多日未解便，醫囑給予意福灌腸液（EVAC enema）行小量灌腸，下列敘述何者正確？","o":["灌腸時病人採右側臥，並請其哈氣放輕鬆","灌腸器頂端與肛管之接合處，需以凡士林潤滑","灌腸器頂端軟管塞入肛門之深度為7.5～10 cm","灌腸中，病人出現痙攣腹痛，請其忍耐直到溶液灌完為止"],"a":"C","k":"C","t":"","x":"成人灌腸時肛管（灌腸器頂端）插入深度約7.5～10公分，故C正確。灌腸應採左側臥，使溶液順著乙狀結腸流入；潤滑劑應塗於軟管前端而非接合處；灌腸中出現腹痛痙攣時應暫停或放慢，請病人深呼吸，不可勉強忍耐。"},{"i":"111-1|30","e":"111-1","n":30,"c":6,"s":"放置存留導尿管的病人需收集尿液檢體進行細菌培養（urine culture），收集方式之敘述下列何者正確？","o":["以無菌空針從導尿管橡皮接頭處消毒後抽取尿液","自蓄尿袋開口流出一段尿液後，再收集檢體","將導尿管及蓄尿袋分開，由接口處收集尿液","拔掉存留導尿管，收集病人自解之中段尿"],"a":"A","k":"A","t":"","x":"存留導尿管病人收集尿液培養檢體，應以無菌空針從導尿管採檢處（橡皮接頭處）消毒後抽取尿液，故A正確。蓄尿袋內的尿液已久置，不可作培養；分開導尿管與蓄尿袋會破壞密閉系統，增加感染風險；不需拔管收集。"},{"i":"111-1|31","e":"111-1","n":31,"c":6,"s":"有關糞便特性之敘述，下列何者錯誤？","o":["糞便質地呈現鬆軟狀、水狀，可能原因為腸蠕動增加","糞便質地呈現乾、硬，可能原因為脫水或腸蠕動減慢","糞便呈現潛血反應，可能原因為大腸腫瘤","糞便形狀呈現扁平、鉛筆型或細線狀為正常"],"a":"D","k":"D","t":"","x":"正常糞便應呈圓柱狀，若呈扁平、鉛筆型或細線狀，可能表示腸道狹窄或有腫瘤阻塞，屬異常，故D錯誤。腸蠕動增加使糞便呈稀軟或水狀；脫水或腸蠕動慢使糞便乾硬；潛血反應陽性可能為腸道出血或腫瘤。"},{"i":"111-1|32","e":"111-1","n":32,"c":6,"s":"腸道內視鏡檢查之注意事項，下列何者正確？","o":["檢查前3天起採全流質飲食","檢查前需服用瀉劑或執行清潔灌腸","檢查時，採右側臥或膝胸臥式","檢查後，必須絕對臥床休息6小時"],"a":"B","k":"B","t":"","x":"腸道內視鏡（大腸鏡）檢查前需服用瀉劑或執行清潔灌腸，使腸道清空以利觀察，故B正確。檢查前1～2天採低渣或清流質飲食；檢查時多採左側臥；檢查後不需絕對臥床6小時，應觀察有無腹痛、出血等情形。"},{"i":"111-1|51","e":"111-1","n":51,"c":6,"s":"有關尿液培養採檢之敘述，下列何者正確？","o":["以清潔方式收集中段尿液於標本容器中","以導尿方式收集中段尿液於無菌標本容器中","晨起第一次解的尿液不要，收集當日7 AM～次日7 AM尿液","睡前最後一次解的尿液不要，收集當日9 PM～次日9 PM尿液"],"a":"B","k":"B","t":"","x":"尿液培養須以無菌方式收集，可採清潔中段尿或以導尿方式收集，並置於無菌容器中，故B正確。A未使用無菌容器盛裝，檢體易受污染；C、D為24小時尿液收集法，用於定量檢查，不適用於細菌培養。"},{"i":"111-1|52","e":"111-1","n":52,"c":6,"s":"護理師協助收集常規尿液檢查，發現尿液呈現螢光黃色，下列何者為最可能之原因？","o":["脂肪尿","服用維生素B12","綠膿桿菌感染","尿道結石"],"a":"B","k":"B","t":"","x":"正常尿液呈淡黃至琥珀色，服用維生素B群後尿液常呈螢光黃色，其中主要造成螢光黃的成分是維生素B2（核黃素）；選項以維生素B12代表，嚴格而言B12本身並非主要成因，但在四個選項中仍為最可能者，官方答案為B。脂肪尿多呈乳白混濁；綠膿桿菌感染可能使尿液呈綠色；尿道結石則常伴隨血尿而呈紅色。"},{"i":"110-2|4","e":"110-2","n":4,"c":6,"s":"有關執行存留導尿的技術，下列敘述何者錯誤？","o":["導尿管號碼越大，尺寸越大","成人個案一般會選用20 Fr.的導尿管","須確定氣囊整個進入膀胱後，才可以打入液體固定","導尿管插入的深度，男性約20公分，女性約5公分"],"a":"B","k":"B","t":"","x":"導尿管尺寸以Fr.表示，號碼越大管徑越粗；成人一般選用男性16～18 Fr.、女性14～16 Fr.，不常規選用20 Fr.，故B錯誤。氣囊須完全進入膀胱再注入液體固定，以免撐傷尿道；插入深度男性約20公分、女性約5公分。"},{"i":"110-2|5","e":"110-2","n":5,"c":6,"s":"病人術後6小時有排尿困難，下列何者誘尿方法需有醫囑才能執行？","o":["聽流水聲","手握冰塊","熱水袋熱敷膀胱","溫水會陰沖洗"],"a":"C","k":"C","t":"","x":"聽流水聲、手握冰塊或溫水沖洗會陰等誘尿法，護理師可獨立執行；在膀胱部位給予熱水袋或溼熱敷屬局部用熱，需有醫囑才能執行，故選C。"},{"i":"110-2|38","e":"110-2","n":38,"c":6,"s":"長期臥床病人若採取伐式操作法（Valsava’s maneuver）用力解便，可能導致下列何種情況？","o":["減少胸內壓","增加靜脈血回流至右心房","增加身體氧合功能","減低心搏出量"],"a":"D","k":"D","t":"","x":"伐氏操作是閉氣用力增加腹壓與胸內壓，使靜脈血回流至右心房減少，進而降低心搏出量，故D正確；放鬆時回心血量驟增，可能引發心律不整。因此心血管疾病、顱內壓升高者及老人應避免用力解便。"},{"i":"110-2|42","e":"110-2","n":42,"c":6,"s":"有關藥物使用對排便之影響，下列敘述何者正確？","o":["長期服用嗎啡（Morphine）止痛易導致腹瀉","高劑量含鋁的制酸劑易導致腹瀉","腸道攝影檢查服用鋇劑可能會解黑便","長期服用抗生素易破壞正常菌叢造成腹瀉"],"a":"D","k":"D","t":"","x":"長期服用抗生素會破壞腸道正常菌叢，易造成腹瀉，故D正確。嗎啡會抑制腸蠕動造成便祕；含鋁制酸劑易導致便祕；服用鋇劑後糞便會呈白色或灰白色，而非黑便。"},{"i":"110-2|43","e":"110-2","n":43,"c":6,"s":"下列病人情境，何者適合執行灌腸？","o":["王女士平日無便秘，不明原因腹絞痛兩天，有裏急後重感","王先生吃麻辣鍋後，肛門口痔瘡腫痛厲害，排便困難","王太太懷孕28週，住院臥床安胎，輕微宮縮，多日未解便","王太太下肢骨折住院，多日未解便，腹脹不適"],"a":"D","k":"D","t":"","x":"灌腸禁忌包括不明原因腹痛、疼痛性嚴重痔瘡、安胎產婦、直腸狹窄或潰瘍、急性闌尾炎及顱內壓升高者。下肢骨折臥床多日未解便且腹脹，無上述禁忌，適合灌腸；A為不明原因腹痛，B為痔瘡腫痛，C為安胎孕婦，皆不宜灌腸。"},{"i":"110-2|55","e":"110-2","n":55,"c":6,"s":"莊太太有貧血，預做糞便潛血試驗（化學法），下列措施何者錯誤？","o":["告知檢體收集前三天勿食用波菜、甘藍菜、紅肉和肝臟","告知常規服用的鐵劑於檢體收集前三天停止服用","檢體收集前需評估莊太太是否於經期","沾有尿液的糞便，仍可置入無菌容器送檢"],"a":"D","k":"D","t":"","x":"化學法糞便潛血試驗前三天應避免紅肉、肝臟、深綠色蔬菜及鐵劑，並評估是否為經期，以免偽陽性。糞便檢體不可混入尿液，以免影響檢驗結果，故D錯誤。"},{"i":"110-1|34","e":"110-1","n":34,"c":6,"s":"張女士62歲，懷孕7次，生了5個孩子。常常在大笑或咳嗽時排出少量尿液，屬於下列那一種尿失禁？","o":["急迫性尿失禁","壓力性尿失禁","反射性尿失禁","功能性尿失禁"],"a":"B","k":"B","t":"","x":"壓力性尿失禁常見於多產婦及停經後婦女，因骨盆底肌肉鬆弛，在咳嗽、大笑、打噴嚏等腹壓增加時漏出少量尿液，故選B。急迫性尿失禁為強烈尿意後無法忍住；反射性為脊髓損傷造成；功能性為行動或認知障礙無法及時如廁。"},{"i":"110-1|36","e":"110-1","n":36,"c":6,"s":"灌腸時肛管大小之選擇，下列何者正確？","o":["成人小量灌腸宜選用24～26 Fr.的肛管","成人大量灌腸宜選用18～20 Fr.的肛管","孩童宜選用14～18 Fr.的肛管","嬰幼兒宜選用5～6 Fr.的肛管"],"a":"C","k":"C","t":"","x":"灌腸肛管的選擇：成人22～24 Fr.、兒童14～18 Fr.、嬰兒約10 Fr.，故C正確。成人不論大量或小量灌腸皆不宜選用過細的18～20 Fr.肛管，嬰幼兒則不需小至5～6 Fr.。"},{"i":"110-1|37","e":"110-1","n":37,"c":6,"s":"正常成人之尿餘量應少於多少？","o":["200 c.c.","150 c.c.","100 c.c.","50 c.c."],"a":"D","k":"D","t":"","x":"正常成人排尿後的膀胱餘尿量應少於50 c.c.，可於病人解完小便後立即導尿測量；餘尿量超過此值表示有排尿不完全或尿瀦留情形，故選D。"},{"i":"110-1|51","e":"110-1","n":51,"c":6,"s":"吳小姐因懷疑有泌尿道感染，今欲留中段尿送檢，下列相關步驟之護理指導，何者正確？","o":["指導留尿前，須先以優碘棉棒由後往前消毒會陰部","先解掉前段小便以沖洗尿道口，再以無菌容器盛取中段小便","所需小便量至少要120 c.c.以上，檢驗才有意義","小便標本需留置至少4小時以上，才能送檢"],"a":"B","k":"B","t":"","x":"留取中段尿時，應先清潔會陰部（由前往後），先解掉前段小便沖洗尿道口，再以無菌容器盛接中段尿，故B正確。中段尿一般收集約5～10 c.c.即可，留取後應於30分鐘內儘速送檢，不可久置以免細菌繁殖影響結果。"},{"i":"109-2|9","e":"109-2","n":9,"c":6,"s":"有關需要更換存留導尿管情況之敘述，下列何者正確？①尿液pH值呈弱酸性 ②尿道分泌物有異臭味 ③出現絮狀沉澱物，致引流不暢 ④導管更換時間依材質而定 ⑤病人有尿液滲漏情形","o":["①②③④","②③④⑤","①③④⑤","①②③⑤"],"a":"B","k":"B","t":"","x":"存留導尿管若尿道分泌物有異臭味（感染）、出現絮狀沉澱物致引流不暢、病人有尿液滲漏，或已達依材質規定的更換時間（乳膠1～2週、矽膠約1個月），都應更換導尿管。正常尿液pH值4.5～8.0，呈弱酸性屬正常，不需更換。"},{"i":"109-2|33","e":"109-2","n":33,"c":6,"s":"林先生因意外造成頸椎受損、大小便失禁，有關尿失禁之護理措施，下列何者正確？","o":["教導排尿刺激技巧，例如：重複輕敲恥骨上方","每小時喝水300 mL，每3～4小時進行排尿刺激","當餘尿量少於250 mL，表示小便訓練成功","教導會陰部凱格式運動（Kegel’s exercise）"],"a":"A","k":"A","t":"","x":"頸椎損傷造成上運動神經元受損，屬反射性尿失禁，可教導排尿刺激技巧，如重複輕敲恥骨上方約1分鐘、撫摸大腿內側等以引發排尿。膀胱訓練每小時飲水約100～150 mL，訓練成功指餘尿少於100 mL；凱格爾運動適用於壓力性尿失禁。"},{"i":"109-2|38","e":"109-2","n":38,"c":6,"s":"執行成人女性無菌導尿技術之敘述，下列何者正確？","o":["消毒順序為中央尿道口→近側小陰唇內面→遠側小陰唇內面","存留導尿管水囊注入約12～15 mL的無菌生理食鹽水","單次導尿量不可超過1,000 mL，以免腹壓快速下降","存留導尿管應固定在大腿內側"],"a":"D","k":"D","t":"","x":"存留導尿管固定時，女性固定於大腿內側，男性則固定於下腹部，以避免牽扯尿道。消毒小陰唇應由遠側、近側再到中央尿道口，由上往下；氣囊注入約5～10 mL無菌蒸餾水；單次導尿一次不可導出超過500 mL，以免腹壓快速下降造成休克。"},{"i":"109-2|50","e":"109-2","n":50,"c":6,"s":"黃先生因排尿時疼痛求診，主訴：「近日來尿液常呈現暗紅色」，可能的原因：","o":["肝病變","念珠菌感染","綠膿桿菌感染","尿道結石"],"a":"D","k":"D","t":"","x":"尿液呈暗紅色且合併排尿疼痛，表示可能有血尿，常見原因為泌尿道結石摩擦損傷黏膜或泌尿道感染。肝病變多使尿液呈深黃或茶色（膽紅素尿）；念珠菌或綠膿桿菌感染則較常使尿液混濁或呈特殊顏色、氣味。"},{"i":"109-2|51","e":"109-2","n":51,"c":6,"s":"關於尿液培養（urine culture）之目的，下列何者正確？①檢查是否有細菌感染 ②測量腎小管再吸收能力 ③檢驗腎臟過濾與排泄功能 ④作為抗生素使用的依據","o":["①②","②③","③④","①④"],"a":"D","k":"D","t":"","x":"尿液培養的目的在檢查泌尿道是否有細菌感染、確認菌種，並經藥物敏感試驗作為選擇抗生素的依據。腎小管再吸收能力與腎臟過濾排泄功能需以尿比重、肌酸酐廓清率等檢查評估，並非尿液培養的目的。"},{"i":"109-2|53","e":"109-2","n":53,"c":6,"s":"收集男性病人的尿液標本進行尿液培養之敘述，下列何者正確？①將病人晨起第一次解尿的中段尿，置於乾淨尿杯 ②長期導尿者，打開尿袋底端開口，倒出尿液於標本試管內 ③收集好之尿液標本，需在30分鐘內送檢 ④懷疑有尿道感染者，宜先收集尿液檢體後再注射抗生素","o":["①②","②③","③④","①④"],"a":"C","k":"C","t":"","x":"尿液培養檢體應於30分鐘內送檢，避免細菌增生影響結果；懷疑尿道感染者應先收集檢體再使用抗生素。中段尿須收集於無菌容器，而非乾淨尿杯；長期導尿者應消毒導尿管採檢處後以無菌空針抽取，不可由尿袋倒出尿液。"},{"i":"109-1|13","e":"109-1","n":13,"c":6,"s":"有關造成尿瀦留的原因，下列何者正確？①腎臟尿液濃縮能力降低 ②膀胱出口阻塞 ③膀胱過度刺激 ④支配膀胱神經損傷：如脊髓損傷","o":["①③","①④","②③","②④"],"a":"D","k":"D","t":"","x":"尿瀦留是膀胱內充滿尿液卻無法排出，常見原因有膀胱出口阻塞（如攝護腺肥大、尿道狹窄）及支配膀胱的神經損傷（如脊髓損傷）使逼尿肌無法收縮。腎臟尿液濃縮能力降低會影響尿量與尿比重；膀胱過度刺激易造成頻尿或急迫性尿失禁，而非尿瀦留。"},{"i":"109-1|31","e":"109-1","n":31,"c":6,"s":"下列何種措施可預防泌尿道感染？①鼓勵膀胱漲尿後再解尿 ②以淋浴代替盆浴 ③執行 Kegel’s會陰肌肉運動 ④性活動前後均應解尿","o":["①④","①③","②③","②④"],"a":"D","k":"D","t":"","x":"以淋浴代替盆浴可避免洗澡水中的細菌經尿道口上行感染；性活動前後解尿可沖走進入尿道的細菌，皆能預防泌尿道感染。膀胱漲尿後才解尿易使細菌滋生，應每2小時排尿一次；凱格爾運動主要改善壓力性尿失禁。"},{"i":"109-1|32","e":"109-1","n":32,"c":6,"s":"吳爺爺因中風長期臥床，有長期便秘情形，目前Senokot（Senna）2＃po HS使用，近日肛門口會不自主滲出少量糞水、有便意感、腹痛，下列措施何者最適當？","o":["暫停Senokot（Senna）","給予止瀉劑","給予灌腸","肛門指診"],"a":"D","k":"D","t":"","x":"長期臥床便祕病人出現肛門不自主滲出少量糞水、持續便意與腹痛，為糞便嵌塞的典型症狀，應先行肛門指診確認直腸內是否有硬糞塊。此時不可誤判為腹瀉而給予止瀉劑；糞石阻塞於直腸時不易被溶液軟化，不宜灌腸，指挖除糞便才是最有效的處理。"},{"i":"109-1|34","e":"109-1","n":34,"c":6,"s":"王太太58歲，用力咳嗽或者大笑時就會出現滲尿，心情受影響情緒低落，下列何項護理措施不合適？","o":["告訴病人這是中年婦女正常現象，不要太在意","評估是否有壓力性尿失禁相關因子，例如：停經、肥胖","教導勿提重物、突然大笑等增加腹內壓之動作","教導骨盆底肌肉運動訓練，增加尿道括約肌張力"],"a":"A","k":"A","t":"","x":"咳嗽、大笑時滲尿為壓力性尿失禁，會影響病人心理與生活，護理師應同理其感受、鼓勵表達，不可告知為正常現象而忽視。應評估停經、肥胖等相關因子，教導避免增加腹內壓的動作，並執行凱格爾運動增強骨盆底肌肉與尿道括約肌張力。"},{"i":"109-1|35","e":"109-1","n":35,"c":6,"s":"有關糞便嵌塞使用手指挖除糞石之注意事項，下列敘述何者正確？","o":["挖除時易造成交感神經反應徵象","過程中病人主訴心悸為正常反應，可持續挖除動作","若糞石阻塞於直腸處宜使用灌腸","以含局部麻醉成分之潤滑液塗抹肛門後再執行指挖"],"a":"D","k":"D","t":"","x":"以手指挖除糞石前，應先以含局部麻醉成分的潤滑液塗抹肛門，以減輕疼痛與不適。指挖易刺激迷走神經（副交感）而非交感神經，若病人主訴頭痛、心悸應立即停止；糞石阻塞於直腸時不易被溶液軟化，不宜使用灌腸。"},{"i":"109-1|41","e":"109-1","n":41,"c":6,"s":"有關人體的胃結腸反射刺激排便，通常在何時反射作用最強？","o":["早晨睡醒時","早餐後","空腹時","晚上睡覺前"],"a":"B","k":"B","t":"","x":"胃結腸反射是食物進入胃部後引發結腸的質塊運動，將糞便推入直腸而產生便意，通常在早餐後反射作用最強，因此建議養成早餐後排便的習慣。早晨睡醒、空腹或睡前時，胃部並無食物刺激，反射作用較弱。"},{"i":"109-1|47","e":"109-1","n":47,"c":6,"s":"關於尿液培養（urine culture）的檢體收集，下列敘述何者錯誤？","o":["懷疑尿道感染時，應先使用抗生素再收集檢體","若30分鐘內無法送檢，應置於4～10℃冰箱保存","若病人無法自行解尿，需用導尿方式取得檢體","需以無菌方式取中段尿液於無菌的標本盒中"],"a":"A","k":"A","t":"","x":"懷疑泌尿道感染時，應在使用抗生素之前收集尿液培養檢體，否則抗生素會抑制細菌生長而造成偽陰性結果，故A錯。尿液培養需以無菌方式收集中段尿，無法自解者以導尿取得；若30分鐘內無法送檢，應冷藏保存。"},{"i":"109-1|50","e":"109-1","n":50,"c":6,"s":"收集病人的糞便標本進行常規檢查，下列敘述正確者為：①以壓舌板取糞便，量約為一顆花生米大小 ②腹瀉者，可解便於鋪有衛生紙之便盆，待衛生紙吸收水分後，再將大便放入收集盒內 ③做潛血檢查，須告知病人檢查前1天勿吃鐵劑 ④為避免尿液污染糞便檢體，請病人先排空膀胱再解便","o":["①②","②③","③④","①④"],"a":"D","k":"D","t":"","x":"常規糞便檢查以壓舌板取約花生米大小的糞便即可；為避免尿液污染檢體，應請病人先排空膀胱再解便。腹瀉者解於鋪衛生紙的便盆，水分被吸收會影響檢查結果；潛血檢查前約3天應避免食用鐵劑、紅肉、內臟等，1天並不足夠。"},{"i":"108-2|4","e":"108-2","n":4,"c":6,"s":"關於導尿管水球（氣囊）之敘述，下列何者正確？","o":["一般成人注入液體量約5~10 c.c.","注入之液體以生理食鹽水為主","注入過程中病人主述疼痛時應先將導尿管回拉兩公分後再回抽液體","病人如有漏尿情形應將注入液體量增加至30 c.c."],"a":"A","k":"A","t":"","x":"存留導尿管固定氣囊一般以10 c.c.空針抽取無菌蒸餾水，注入5～10 c.c.，不使用生理食鹽水以免結晶阻塞。注入時病人感到疼痛，表示氣囊頂在尿道頸，應先回抽液體，再將導尿管向內推約2公分；漏尿應找出原因處理，過量注入易造成膀胱痙攣或損傷。"},{"i":"108-2|5","e":"108-2","n":5,"c":6,"s":"有關膀胱灌洗的敘述，下列何者正確？","o":["連續性膀胱灌洗需使用雙腔導尿管","小量膀胱灌洗之灌洗瓶底部與病人恥骨的距離約75~90公分","小量膀胱灌洗是每次可以30 c.c.溶液來回灌洗","連續性膀胱灌洗溶液的溫度宜維持在41~42℃"],"a":"C","k":"C","t":"","x":"小量或簡易膀胱灌洗可用50 c.c.空針接導尿管，每次灌入30～50 c.c.灌洗液再抽出，來回灌洗。密閉式持續膀胱灌洗需使用三路導尿管；灌洗溶液液面高出膀胱約75～90公分是用於持續性灌洗，而非小量灌洗。"},{"i":"108-2|38","e":"108-2","n":38,"c":6,"s":"有關排便機轉之敘述，下列何者正確？","o":["當直腸內壓力接受器受到刺激，此訊息會傳導到骨盆之排便反射中樞","排便反射中樞位於人體腰椎 L3～L4，可將訊息傳至骨盆神經","骨盆神經之副交感神經傳導，使肛門之內、外括約肌放鬆而排便","骨盆神經之交感神經傳導刺激，使得直腸放鬆而排便"],"a":"A","k":"A","t":"","x":"糞便進入直腸使直腸壁壓力接受器受刺激，訊息經骨盆神經傳到位於薦髓S2～S4的排便反射中樞。骨盆神經（副交感）使直腸收縮、肛門內括約肌放鬆；外括約肌由會陰神經（體神經）支配，受意識控制。故B、C、D錯。"},{"i":"108-2|40","e":"108-2","n":40,"c":6,"s":"雙手尺骨骨折的病人，手術後6小時未解尿，觸診膀胱鼓脹，下列何者是最適當的獨立性護理功能？","o":["進行單次導尿","讓病人手握冰塊","按摩恥骨聯合上方","給予局部用熱"],"a":"C","k":"C","t":"","x":"術後未解尿且膀胱脹，可先以誘尿協助排尿，按摩恥骨聯合上方（順時鐘輕揉膀胱部位）不需醫囑，屬獨立性護理功能。導尿與局部用熱需有醫囑；病人雙手尺骨骨折無法手握冰塊，故C最適當。"},{"i":"108-2|53","e":"108-2","n":53,"c":6,"s":"張小姐住院期間需留取常規尿液檢體，下列敘述何者正確？①最好是清晨第一次的中段尿 ②檢體收集後，最好於室溫 3 小時內送檢 ③若正值生理期，可用導尿方式取得檢體 ④檢體若 3 小時內無法送檢，應置於冰箱","o":["①②","②④","①③","③④"],"a":"C","k":"C","t":"","x":"常規尿液檢查最好留取清晨第一次的中段尿，因尿液較濃縮、結果較準確；女性生理期時可用導尿方式取得清潔檢體，避免經血污染。尿液檢體應於收集後儘速（約30分鐘至1小時內）送檢，無法立即送檢時應冷藏，不宜在室溫放置至3小時，故②④不正確。"},{"i":"108-1|4","e":"108-1","n":4,"c":6,"s":"對於一位正常成人尿液性狀之敘述，下列何者錯誤？","o":["每日的尿量約為1200～1500 c.c.","pH值為3.5～4.5","尿比重為1.010～1.030","顏色呈現淡黃色，有氨味"],"a":"B","k":"B","t":"","x":"正常成人尿液pH值約為4.5～8.0，呈弱酸性，pH 3.5～4.5過酸並不正確。每日尿量約1,200～1,500 c.c.，尿比重1.010～1.030，新鮮尿液呈淡黃色、清澈，放置後尿素分解會產生氨味，A、C、D正確。"},{"i":"108-1|31","e":"108-1","n":31,"c":6,"s":"張太太產後4小時，無法自解小便，護理人員欲協助誘尿，下列何種方式錯誤？","o":["使用冷水沖洗會陰部","手握冰塊，刺激末梢神經","依醫囑給予於膀胱上方熱敷","順時鐘按摩膀胱部位"],"a":"A","k":"A","t":"","x":"誘尿可用聽流水聲、手握冰塊刺激末梢神經、依醫囑於膀胱上方熱敷、溫水坐浴、以溫熱水沖洗會陰，以及順時鐘輕揉膀胱部位等方法。以冷水沖洗會陰會使尿道括約肌收縮，反而不利排尿，故A錯誤。"},{"i":"108-1|32","e":"108-1","n":32,"c":6,"s":"常出現於打噴嚏、大笑、咳嗽及快速走路時，因腹壓增加排出少於 50 c.c.的尿液。這是屬於那一種尿失禁（incontinence of urine）？","o":["急迫性尿失禁（urge incontinence）","壓力性尿失禁（stress incontinence）","反射性尿失禁（reflex incontinence）","功能性尿失禁（functional incontinence）"],"a":"B","k":"B","t":"","x":"壓力性尿失禁是因骨盆底肌肉無力，當打噴嚏、大笑、咳嗽等使腹內壓增加時，不自主排出少於50 c.c.的尿液。急迫性尿失禁為逼尿肌不自主收縮、有強烈尿意即排尿；反射性尿失禁與神經損傷有關；功能性尿失禁則因身體或認知功能障礙而無法如廁。"},{"i":"108-1|33","e":"108-1","n":33,"c":6,"s":"協助心肌梗塞急性期病人使用便盆時，下列何項措施較適當？","o":["先溫暖便盆再給予使用，減少冷的刺激","教導伐式操作法（Valsalva’s maneuver）協助排便","為促進排便順暢，協助下床使用便盆椅","請病人自行抬高臀部，以利移遞便盆"],"a":"A","k":"A","t":"","x":"心肌梗塞急性期病人應減少心臟負荷，便盆可先溫暖再使用，以避免冷刺激引起血管收縮與不適。伐氏操作會使胸內壓上升、心輸出量改變，心血管疾病病人禁用；急性期應臥床休息，不宜下床使用便盆椅或自行用力抬高臀部。"},{"i":"108-1|34","e":"108-1","n":34,"c":6,"s":"病人因下腹劇痛數日且盜冷汗入院，主訴已有一週未解便，下列護理師的措施何者較不適當？","o":["評估病人過去排便型態","執行腹部視聽叩及輕觸診","詢問目前是否使用止痛藥","立即給予肥皂水清潔灌腸"],"a":"D","k":"D","t":"","x":"不明原因的腹痛為灌腸禁忌，可能是闌尾炎或腸阻塞、穿孔等急腹症，灌腸會增加腸道壓力而使病情惡化。病人下腹劇痛且一週未解便，應先評估過去排便型態、執行腹部視聽叩觸診並了解用藥（如止痛劑易致便祕），再依醫囑處理。"},{"i":"108-1|36","e":"108-1","n":36,"c":6,"s":"有關灌腸的禁忌症，下列何者錯誤？","o":["產科安胎者","長期導尿者","闌尾炎","疼痛性的嚴重痔瘡"],"a":"B","k":"B","t":"","x":"灌腸的禁忌症包括不明原因腹痛、疼痛性嚴重痔瘡、產科安胎者、直腸狹窄或潰瘍、急性闌尾炎及顱內壓升高者。長期導尿與灌腸並無衝突，不是灌腸的禁忌症。"},{"i":"108-1|37","e":"108-1","n":37,"c":6,"s":"關於留置導尿管護理之敘述，下列何者正確？①尿袋維持在膀胱以下 ②尿袋內尿量可超過 3/4 ③每日執行至少一次的導尿管護理 ④尿袋若無結晶、血塊或沉澱物不需定期更換","o":["①③","①④","②③","②④"],"a":"A","k":"A","t":"","x":"存留導尿時，尿袋須維持低於膀胱，以免尿液逆流造成感染；每日至少執行一次導尿管護理及會陰沖洗。尿袋應在1/2～2/3滿或每8小時排空，不可超過3/4；尿管與尿袋需依材質定期更換，並非無結晶或沉澱就不需更換。"},{"i":"107-2|28","e":"107-2","n":28,"c":6,"s":"解黑色糞便的可能原因為何？①服用鐵劑 ②脂肪吸收不良 ③進食較多豬肝 ④上腸胃道出血","o":["①③④","②③④","①②④","①②③"],"a":"A","k":"A","t":"","x":"服用鐵劑、進食較多豬肝等內臟，以及上腸胃道出血（血液經消化成焦油便），皆可能使糞便呈黑色。脂肪吸收不良則使糞便呈灰白色、油膩且有惡臭，不會造成黑便。"},{"i":"107-2|29","e":"107-2","n":29,"c":6,"s":"下列何種狀況下腸蠕動聲會增加？","o":["腹膜炎","腹股溝疝氣","腸麻痺","腹瀉"],"a":"D","k":"D","t":"","x":"腹瀉時腸蠕動增加，聽診可聞腸蠕動音增快。腹膜炎與腸麻痺時腸蠕動減弱或消失，腸蠕動音減少；腹股溝疝氣本身不會使腸蠕動音增加。"},{"i":"107-2|31","e":"107-2","n":31,"c":6,"s":"下列何者為人體的排泄器官（或系統）？①口腔 ②皮膚 ③肺臟 ④小腸","o":["①②","②③","③④","①③"],"a":"B","k":"B","t":"","x":"排泄是將新陳代謝產生的廢物排出體外，途徑包括腎臟（尿液）、大腸（糞便）、皮膚（汗液）及肺臟（呼出二氧化碳與水氣）。口腔為消化道入口，小腸主要負責消化吸收，皆非排泄器官。"},{"i":"107-2|32","e":"107-2","n":32,"c":6,"s":"有關預防便祕的護理指導，下列何者不適當？","o":["多吃蔬菜、水果及全穀類","養成定期灌腸的習慣","養成於早餐後排便的習慣","每日應攝取2,000 mL水分"],"a":"B","k":"B","t":"","x":"預防便祕應攝取高纖飲食、每日2,000～2,500 mL液體、適度運動，並養成早餐後固定排便的習慣。定期灌腸會使腸道依賴外力刺激、降低排便反射，反而加重便祕，不宜作為預防措施。"},{"i":"107-2|34","e":"107-2","n":34,"c":6,"s":"嬰幼兒進行清潔灌腸時，為避免產生體液電解質不平衡，選用下列何種溶液最適宜？","o":["0.2%肥皂水","生理食鹽水","清水","冰水"],"a":"B","k":"B","t":"","x":"嬰幼兒體液容量小，以清水（低張）灌腸可能被腸道吸收而造成水中毒，肥皂水刺激性亦較大。生理食鹽水為等張溶液，不易造成體液電解質失衡，最適合嬰幼兒清潔灌腸；冰水會引起腸道痙攣，不可使用。"},{"i":"107-2|35","e":"107-2","n":35,"c":6,"s":"可以增加尿道括約肌張力的訓練，下列何者正確？","o":["克萊台氏法","凱格氏運動","膀胱訓練","導尿管訓練"],"a":"B","k":"B","t":"","x":"凱格爾運動是反覆收縮、放鬆會陰部（骨盆底）肌肉，可增強尿道括約肌張力，適用於壓力性尿失禁。克萊台氏法是按壓膀胱部位增加腹壓以協助排尿；膀胱訓練主要在延長排尿間隔、增加膀胱容量。"},{"i":"107-2|44","e":"107-2","n":44,"c":6,"s":"長期臥床者在床上使用便盆時，易使用伐耳沙伐氏操作（Valsalva’s maneuver）用力排便，此時心血管系統會呈現何種改變？①胸內壓上升 ②靜脈血快速大量流回心臟 ③血壓下降 ④心輸出量減少","o":["①②","②③","③④","①④"],"a":"D","k":"D","t":"","x":"伐氏操作是閉氣用力，使胸內壓與腹內壓上升，壓迫大靜脈使靜脈回流減少，心輸出量隨之減少；放鬆時大量血液回流心臟，可能誘發心律不整，故心血管疾病病人禁用。閉氣用力期間靜脈回流並非增加，血壓初期反而上升。"},{"i":"107-1|31","e":"107-1","n":31,"c":6,"s":"下列何者為腸阻塞個案灌腸時較適當的姿勢？","o":["膝胸臥式","垂頭仰臥式","左側臥式","辛式臥式"],"a":"A","k":"A","t":"","x":"灌腸一般採左側臥；腸阻塞病人可採膝胸臥式，利用重力使溶液流入腸道，故選(A)。垂頭仰臥式易使溶液逆流且病人不適；辛式臥式（半俯臥）與左側臥類似，並非腸阻塞者的較佳姿勢。"},{"i":"107-1|32","e":"107-1","n":32,"c":6,"s":"劉太太60歲因大量膿尿而入院，醫囑 0.9% Normal Saline 1,000 mL膀胱灌洗q.8h.，下列敘述何者不適當？","o":["目的為降低感染及抑制發炎","每天需更換灌洗所使用之管路","灌洗溶液液面高出膀胱85公分","每次灌入量以Normal Saline 500 mL為宜"],"a":"D","k":"D","t":"","x":"膀胱灌洗每次灌入量以不超過300 c.c.為宜（約250 c.c.即有輕度尿意），每次灌入500 c.c.過多，易造成膀胱過度膨脹與不適，故(D)不適當。膀胱灌洗可清除膿液、抑制發炎；灌洗溶液及管路每天更換一次；灌洗液面需高出膀胱約75～90公分。"},{"i":"107-1|34","e":"107-1","n":34,"c":6,"s":"有關灌腸時肛管插入的深度，下列敘述何者正確？","o":["成人約7.5～10公分","孩童約2.5～4.5公分","嬰幼兒約1.5～2.0公分","依灌腸種類而有所差異"],"a":"A","k":"A","t":"","x":"灌腸時肛管插入深度：成人約7.5～10公分（3～4吋），兒童約5～7.5公分，嬰兒約2.5～3.75公分，故選(A)。插入深度依年齡而定，並非依灌腸種類而有所差異。"},{"i":"107-1|35","e":"107-1","n":35,"c":6,"s":"有關導致尿瀦留之因素，下列何者最不可能？","o":["男性前列腺肥大","女性子宮及膀胱脫垂","使用抗膽鹼激素藥物","使用麻醉劑"],"a":"B","k":"B","t":"","x":"女性子宮及膀胱脫垂多因骨盆底肌肉無力，較常導致腹壓增加時不自主漏尿的壓力性尿失禁，較不可能造成尿瀦留，故選(B)。男性前列腺肥大造成尿道阻塞；抗膽鹼激素藥物使膀胱逼尿肌鬆弛；麻醉劑抑制排尿反射，皆為尿瀦留的常見原因。"},{"i":"107-1|56","e":"107-1","n":56,"c":6,"s":"陳先生，意識清楚，診斷腎絲球腎炎，醫師開立收集24小時尿液作肌酸酐廓清（CCr）試驗之醫囑，下列尿液收集程序何者最正確？","o":["收集當日7AM第一次解的尿不要，之後每次解的尿液收集至次日7AM","收集期間若有尿液遺漏一次，檢驗單註明遺漏一次，繼續收集至次日7AM","協助插上存留導尿管，收集完24小時尿液後將導尿管拔除","將所使用的尿液收集桶放置廁所內，以利尿液收集"],"a":"A","k":"A","t":"","x":"收集24小時尿液時，應於開始時（如當日7AM）先排空膀胱並丟棄此次尿液，之後每次尿液皆收集，直到次日7AM最後一次排尿也收集進去，故選(A)。收集期間若遺漏一次，結果即不準確，須重新收集；意識清楚能自解者不需插存留導尿管；收集桶應依檢驗要求妥善放置並標示，不宜任意放於廁所以免被誤倒或污染。"},{"i":"106-2|31","e":"106-2","n":31,"c":6,"s":"有關教導臨床病人預防便秘的護理措施，下列何者錯誤？","o":["每日睡前使用瀉藥","每日攝取足夠的蔬果","養成每日定時排便的習慣","每日攝取液體2000～2500 c.c."],"a":"A","k":"A","t":"","x":"預防便秘應增加纖維攝取、每日攝取2,000～2,500 c.c.液體、養成定時排便習慣與適當運動；每日睡前使用瀉藥會造成依賴，使腸道失去正常張力與排便反射，故(A)錯誤。"},{"i":"106-2|32","e":"106-2","n":32,"c":6,"s":"在大量灌腸過程中，病人主訴感到輕微腹痛時，護理師採用的護理措施，下列何者正確？","o":["立即拔出肛管，通知醫生","停止灌腸，讓病人躺平休息","將灌腸筒提高，加快灌腸速度","暫停灌腸，等腹痛消失後再繼續"],"a":"D","k":"D","t":"","x":"大量灌腸時病人感到輕微腹痛，多為溶液流入引起腸道痙攣，應暫停灌腸或降低灌腸筒高度減緩速度，待腹痛消失後再繼續，故選(D)。輕微腹痛不需拔管通知醫師或停止灌腸；提高灌腸筒加快速度會加重痙攣與不適。"},{"i":"106-2|33","e":"106-2","n":33,"c":6,"s":"上腸胃道出血或服用鐵劑病人之糞便顏色，下列何者正確？","o":["紅色","黑色","灰白色","黃棕色"],"a":"B","k":"B","t":"","x":"上消化道出血時，血紅素經胃酸及消化酶作用變為黑色，使糞便呈黑色柏油狀；服用鐵劑亦會使糞便變黑、變硬，故選(B)。紅色多見於下消化道出血；灰白色見於膽道阻塞；黃棕色為正常成人糞便顏色。"},{"i":"106-2|36","e":"106-2","n":36,"c":6,"s":"蔣奶奶16小時未解尿，膀胱脹，經誘尿無效需導尿。下列護理措施何者較不適當？","o":["可採用單次導尿","選擇14 Fr.導尿管","導尿管插入5公分","一次導出所有尿液"],"a":"D","k":"D","t":"","x":"單次導尿時一次導出的尿液不可超過500 c.c.，以免腹壓快速下降導致休克（或膀胱出血），故「一次導出所有尿液」不適當，選(D)。膀胱脹且誘尿無效可採單次導尿；成人女性可選用14～16 Fr.導尿管，女性尿道長約3.8～5公分，導尿管插入約5公分。"},{"i":"106-2|38","e":"106-2","n":38,"c":6,"s":"使用下列何種藥物易導致便秘的問題？①長期使用抗生素 ②含鎂制酸劑 ③鐵劑 ④抗膽鹼激素藥物（如：Atropine） ⑤麻醉性止痛劑（如：Morphine）","o":["①②③","①②④","①③⑤","③④⑤"],"a":"D","k":"D","t":"","x":"鐵劑會使糞便變黑變硬（③）；抗膽鹼藥物如Atropine（④）及麻醉性止痛劑如Morphine（⑤）會使腸道平滑肌鬆弛、蠕動減少，皆易造成便秘，故選③④⑤。長期使用抗生素會破壞腸內正常菌叢而易致腹瀉；含鎂制酸劑亦易造成腹瀉。"},{"i":"106-2|39","e":"106-2","n":39,"c":6,"s":"下腸胃道出血病人糞便的顏色，下列何者正確？","o":["灰白色","黑色","紅色","褐色"],"a":"C","k":"C","t":"","x":"下消化道（如結腸、直腸）出血時，血液未經胃酸分解，糞便呈鮮紅或暗紅色，故選(C)。黑色多為上消化道出血或服用鐵劑；灰白色見於膽道阻塞；褐色為正常糞便顏色。"},{"i":"106-2|47","e":"106-2","n":47,"c":6,"s":"高纖維飲食的主要應用原理，下列何者錯誤？","o":["增加腸道內水分的吸收","減少腸道內的殘渣量","縮短腸道內殘渣停留時間","促進腸道的蠕動"],"a":"B","k":"B","t":"","x":"膳食纖維不易被人體消化，可增加腸道內的殘渣量與水分，使糞便體積增加、變軟，並刺激腸道蠕動、縮短殘渣停留時間，因此常用於便秘的護理；「減少腸道內的殘渣量」是低渣飲食的原理，故(B)錯誤。"},{"i":"106-2|52","e":"106-2","n":52,"c":6,"s":"陳小姐目前為月經來潮第三天，收集陳小姐尿液以進行常規檢查的方法，下列何者較適宜？","o":["以留置導尿管收集尿液檢體","以單次導尿方式收集尿液檢體","直接收集中段尿","先予以會陰沖洗後，再收集中段尿"],"a":"B","k":"B","t":"","x":"女性月經來潮時，經血會污染尿液檢體而影響檢查結果，此時需留取常規尿液檢查，可採單次導尿方式收集清潔的尿液標本，故選(B)。留置導尿管不需為一次檢查而放置；即使先會陰沖洗，中段尿仍可能混入經血。"},{"i":"106-1|30","e":"106-1","n":30,"c":6,"s":"林女士已 6 小時未解尿，主訴下腹部很脹，護理師可採取下列那些方法誘導林女士小便？①逆時鐘輕揉膀胱 ②聽流水聲 ③會陰沖洗 ④溫水坐浴","o":["①②③","①②④","①③④","②③④"],"a":"D","k":"D","t":"","x":"誘尿方法包括聽流水聲（②）、以溫熱水會陰沖洗（③）、溫水坐浴放鬆尿道括約肌（④）、手握冰塊、局部用熱等，故選②③④。局部按摩應以順時鐘方向輕揉膀胱部位，逆時鐘方向不正確（①錯）。"},{"i":"106-1|31","e":"106-1","n":31,"c":6,"s":"若尿液中出現膽紅素，其可能原因為：","o":["糖尿病","阻塞性黃疸","腎絲球腎炎","腎病症候群"],"a":"B","k":"B","t":"","x":"膽紅素正常不會出現在尿液中，阻塞性黃疸時膽汁排出受阻，結合型膽紅素回流入血並經腎臟排出，使尿中出現膽紅素、尿色呈深茶色，故選(B)。糖尿病常見尿糖、酮體；腎絲球腎炎與腎病症候群多見蛋白尿或血尿。"},{"i":"106-1|33","e":"106-1","n":33,"c":6,"s":"有關泌尿道感染女性病人之護理指導，下列何者不適宜？","o":["每次性活動前後均應解尿","排尿後清潔會陰時由前向後擦","鼓勵多食用鹼化尿液之食物","建議每日攝取水分2,000～3,000 c.c."],"a":"C","k":"C","t":"","x":"預防泌尿道感染應維持尿液呈酸性，以抑制細菌生長並增加泌尿道藥物效果，鼓勵食用鹼化尿液的食物不適宜，故選(C)。性活動前後解尿、排尿後由前往後擦拭、每日攝取2,000～3,000 c.c.水分稀釋尿液，皆為正確指導。"},{"i":"106-1|35","e":"106-1","n":35,"c":6,"s":"有關灌腸溶液溫度的敘述，下列何者正確？","o":["保留灌腸的溶液溫度應為41～43℃","非保留灌腸的溶液溫度應為37.8～40.6℃","溶液溫度過高時會造成腸蠕動過慢，而影響灌腸效果","溶液溫度過低時可能使肛門括約肌收縮痙攣"],"a":"D","k":"D","t":"","x":"灌腸溶液溫度過低會刺激肛門肌肉產生痙攣性收縮，造成不適，故(D)正確。溶液溫度過高會使腸道及腹腔血管擴張，導致腦部與心臟血液供應不足而昏厥，並可能損傷腸黏膜，而非使腸蠕動過慢。"},{"i":"106-1|36","e":"106-1","n":36,"c":6,"s":"為導尿管留置病人進行尿液培養之敘述，下列何者正確？","o":["由尿袋中倒出適量尿液以進行培養","拔除導尿管以收集病人自行解尿的中段尿液","以止血鉗夾住引流管，於30分鐘後打開尿管與引流管的銜接處留取尿液","夾住引流管30分鐘後，以優碘消毒橡皮接頭處，再以空針抽取所需尿液"],"a":"D","k":"D","t":"","x":"留置導尿管病人採集尿液培養檢體，應先夾住引流管約30分鐘使尿液積聚，再以優碘消毒導尿管的橡皮接頭（採檢口），以無菌空針抽取所需尿液，故選(D)。尿袋內的尿液已久置不可做培養；不可為留尿拔管；打開尿管與引流管銜接處會破壞密閉系統而增加感染。"},{"i":"105-2|5","e":"105-2","n":5,"c":6,"s":"有關正常排尿的敘述，下列何者錯誤？","o":["幼兒膀胱尿量＞50 ml即會產生排尿反射","排尿反射是一種自主性脊髓反射","尿道之內、外括約肌皆受意志控制","尿道之內、外括約肌鬆弛，尿液排出"],"a":"C","k":"C","t":"","x":"尿道內括約肌為平滑肌，受自主神經支配，不受意志控制；外括約肌為骨骼肌，才可受意志控制，故(C)錯誤。排尿反射為脊髓反射，膀胱達一定容量即引發，幼兒大腦控制尚未成熟，膀胱尿量少即會排尿；排尿時內、外括約肌皆鬆弛使尿液排出。"},{"i":"105-2|34","e":"105-2","n":34,"c":6,"s":"當病人上消化道出血時，其糞便通常為何種顏色？","o":["黑色","紅色","綠色","透明黏液"],"a":"A","k":"A","t":"","x":"上消化道出血時，血液經胃酸及消化酶作用，血紅素被分解，糞便呈黑色柏油狀（melena），故選(A)。紅色血便多見於下消化道出血；綠色多與膽汁或飲食有關；透明黏液見於腸道發炎。"},{"i":"105-2|35","e":"105-2","n":35,"c":6,"s":"灌腸中病人產生輕微腹痛之處理方式，下列何者較合適？","o":["停止繼續灌入溶液，並立即向醫師回報","可能是發生腸穿孔現象，應立即進行相關檢查","此為正常的灌腸反應，可加速灌入溶液","可能是溶液流入時引起腸道痙攣性收縮，宜減緩灌腸速度"],"a":"D","k":"D","t":"","x":"灌腸中出現輕微腹痛，多因溶液流入過快或量多引起腸道痙攣性收縮，應減緩灌入速度或暫停，請病人深呼吸放鬆，待不適緩解再繼續，故選(D)。輕微腹痛不需立即停止並報告醫師；加速灌入會加重痙攣；腸穿孔會有劇烈腹痛等表現。"},{"i":"105-2|36","e":"105-2","n":36,"c":6,"s":"關於結腸灌洗（colon irrigation）之敘述，下列何者錯誤？","o":["病人採左側臥式","灌洗筒液面至肛門口距離高於70公分","溶液溫度為41~43℃","灌入速度約為每分鐘100~150 c.c."],"a":"B","k":"B","t":"","x":"結腸灌洗液面至肛門的高度為45～60公分，與大量灌腸相同；高於70公分壓力過大，易造成腸道損傷或不適，故(B)錯誤。結腸灌洗採左側臥，溶液溫度41～43℃，灌入速度約每分鐘100～150 c.c.。"},{"i":"105-2|37","e":"105-2","n":37,"c":6,"s":"有關護理腹瀉病人的原則，下列敘述何者錯誤？","o":["教導病人注意活動時的安全，以免眩暈跌倒","限制病人每日的攝取水量，以免腹瀉情形加重","教導病人執行肛門的皮膚護理，以免皮膚破損","限制病人攝取的食物種類，必要時依醫囑NPO"],"a":"B","k":"B","t":"","x":"腹瀉會造成大量水分與電解質流失，應補充水分（約2,500～3,000 c.c./日）以維持體液平衡，不應限制水分，故(B)錯誤。腹瀉病人可能因體液流失而眩暈，須注意活動安全；應執行肛門周圍皮膚護理；急性期可依醫囑禁食，之後採低渣飲食。"},{"i":"105-1|10","e":"105-1","n":10,"c":6,"s":"（情境：張小姐，意識清楚，體溫 39.2℃，現入住病房。）依醫囑為張小姐留取常規尿液檢體，下列敘述何者錯誤？","o":["教導張小姐留取中段尿","儘量將尿液檢體於30分鐘內送檢","常規尿液檢體的檢驗值，可作為使用抗生素的依據","留取尿液前，須先評估張小姐目前月經是否來潮"],"a":"C","k":"C","t":"","x":"選擇抗生素須依據尿液培養及藥物敏感性試驗，常規尿液檢查僅能提供尿液物理、化學及顯微鏡檢查結果，不能作為使用抗生素的依據，故(C)錯誤。常規尿液宜留取中段尿並儘快送檢，以免久置細菌孳生或成分改變；月經來潮時血液會影響結果，需先評估。"},{"i":"105-1|33","e":"105-1","n":33,"c":6,"s":"有關甘油灌腸（glycerine enema）的敘述，下列何者正確？①主要目的是保護腸黏膜 ②灌入量90～180c.c. ③灌完後請病人儘量忍住便意 5～10分鐘 ④溶液成分為甘油和水","o":["①②③","①③④","②③④","①②④"],"a":"C","k":"C","t":"","x":"甘油灌腸為甘油與清水約1：1混合，溶液量約90～180 c.c.，灌完後請病人儘量忍住便意5～10分鐘，使溶液軟化糞便並刺激腸蠕動，故②③④正確。其主要目的是軟化糞便、促進排便（如直腸、會陰手術後），而非保護腸黏膜，故①錯誤。"},{"i":"105-1|35","e":"105-1","n":35,"c":6,"s":"有關排便的敘述，下列何者錯誤？","o":["排便過程受薦神經S2–4控制","直腸內壓上升引發排便反射","肛門括約肌收縮引起排便","意志可以控制肛門括約肌"],"a":"C","k":"C","t":"","x":"糞便進入直腸使直腸內壓上升，經薦神經S2～4引發排便反射，使直腸收縮、肛門內外括約肌鬆弛，糞便才得以排出，故「括約肌收縮引起排便」錯誤。肛門外括約肌為隨意肌，可受意志控制，排便反射亦受時間地點調控。"},{"i":"105-1|37","e":"105-1","n":37,"c":6,"s":"關於灌腸姿勢的敘述，下列何者錯誤？","o":["老年人可採坐式","髖關節受傷病人可採屈膝仰臥式","一般人應採左側臥式","腸阻塞病人可採膝胸臥式"],"a":"A","k":"A","t":"","x":"灌腸一般採左側臥，使溶液順著重力流入位於左側的降結腸；無法左側臥時，髖關節受傷可採屈膝仰臥，腸阻塞者可採膝胸臥式。坐姿時溶液只能停留於直腸、不易流入結腸且易流出，老年人不宜採坐式灌腸，故(A)錯誤。"},{"i":"105-1|38","e":"105-1","n":38,"c":6,"s":"關於保留灌腸之敘述，下列何者正確？","o":["成人灌入量約750～1,000c.c.","灌腸液溫度約41～43℃","保留在腸道內約30分鐘以上","灌入速度應迅速以利腸蠕動"],"a":"C","k":"C","t":"","x":"保留灌腸目的在由直腸供給水分或藥物，需讓溶液保留於腸道內一段時間（約30分鐘）以利吸收，故選(C)。其溶液量限制在90～180 c.c.，750～1,000 c.c.為成人大量灌腸量；灌入速度需相當緩慢，避免腸道膨脹產生便意而排出。"},{"i":"105-1|39","e":"105-1","n":39,"c":6,"s":"有關導尿管導致泌尿道感染之敘述，下列何者正確？","o":["與尿管放置天數無關","最常導致感染的細菌為大腸桿菌","通常不需積極治療，可自癒","每天進行膀胱灌洗可降低感染率"],"a":"B","k":"B","t":"","x":"導尿管相關泌尿道感染最常見的致病菌為大腸桿菌（屬內生性感染），故選(B)。放置天數越長感染風險越高，應避免長期留置；感染需依醫囑治療；常規膀胱灌洗會破壞導尿系統的密閉性，反而增加感染機會。"},{"i":"104-2|32","e":"104-2","n":32,"c":6,"s":"李小姐明天預行腹部手術，術前醫囑：「S. S. enema st.」，下列敘述何者正確？","o":["液面至肛門垂直距離30～40公分","灌腸時請李小姐右側臥","肛管插入肛門7.5～10公分","灌腸液保留在腸道15～30分鐘後再排出"],"a":"C","k":"C","t":"","x":"成人大量灌腸肛管插入深度約7.5～10公分（3～4吋）。灌腸筒液面距肛門應為45～60公分；病人應採左側臥以順應降結腸位置；肥皂水灌腸屬非保留灌腸，保留5～10分鐘即可排出，15～30分鐘是保留灌腸。"},{"i":"104-2|35","e":"104-2","n":35,"c":6,"s":"關於排尿功能障礙之用語及定義，下列敘述何者錯誤？","o":["少尿（oliguria）指尿量<400 mL/日","多尿（polyuria）指尿量>2500 mL/日","無尿（Anuria）指尿量<10 mL/日","遺尿（Enuresis）指發生於夜晚的尿失禁"],"a":"C","k":"C","t":"","x":"無尿是指24小時尿量少於100 mL（或完全無尿），並非小於10 mL，故C錯誤。少尿為每日尿量少於400 mL，多尿為每日尿量超過2500 mL，遺尿是發生於夜晚的尿失禁，最常見於兒童。"},{"i":"104-2|37","e":"104-2","n":37,"c":6,"s":"有關便秘病人之護理指導，下列敘述何者最不適宜？","o":["鼓勵病人多攝取高纖維食物","鼓勵病人喝大量含糖飲料以增加液體攝取","增加身體活動量以促進腸蠕動","排便時採蹲姿可使排便較順暢"],"a":"B","k":"B","t":"","x":"便祕病人應增加液體攝取，宜選擇白開水或梅子汁、柳橙汁等可刺激腸蠕動的飲品，大量含糖飲料並不適宜。多攝取高纖維食物、增加活動量及採蹲姿排便（增加腹內壓）皆可改善便祕。"},{"i":"104-2|56","e":"104-2","n":56,"c":6,"s":"為裝置有存留導尿管的病人蒐集尿液常規檢查（urinalysis）用檢體，最佳的檢體蒐集方式，下列敘述何者正確？","o":["為確保無菌，應採單次導尿法蒐集檢體","以空針自尿管及尿袋交接處抽取尿液，應採無菌蒐集原則","將存留導尿管和尿袋分開，自尿管接口處引流所需尿液","打開尿袋底端開口，倒出所需尿液"],"a":"B","k":"B","t":"","x":"留置導尿管病人收集尿液檢體時，應消毒尿管與尿袋交接處的採檢口，以無菌空針抽取新鮮尿液，維持密閉系統。不需另行單次導尿；分開導尿管與尿袋會破壞密閉系統增加感染；尿袋內尿液已存放一段時間，不適合送檢。"},{"i":"104-1|34","e":"104-1","n":34,"c":6,"s":"王老先生手術後，留置一條存留導尿管，下列護理措施何者正確？","o":["蓄尿袋應每天更換一次","導尿管應固定於下腹部或大腿前側","每班應執行導尿管護理一次","蓄尿袋全滿時才需排空尿袋內的尿液"],"a":"B","k":"B","t":"","x":"存留導尿管應固定於下腹部（男性）或大腿內側／前側，避免牽扯造成尿道口損傷或導尿管脫出。導尿管與蓄尿袋一般每週更換，不需每天；導尿管護理每日執行；蓄尿袋應每8小時或滿1/2～2/3時排空，以免逆流造成感染。"},{"i":"104-1|35","e":"104-1","n":35,"c":6,"s":"有關存留導尿的護理，下列敘述何者不適當？","o":["不宜長期放置以免膀胱肌肉失去張力","過程中導尿管滑出仍可繼續使用","固定導尿管之氣囊打5～10 c.c.的無菌蒸餾水","蓄尿袋需每8小時或＞1000 mL排空"],"a":"B","k":"B","t":"","x":"導尿管滑出尿道口至體外即已受汙染，不可繼續使用，應更換新的無菌導尿管，故B不適當。長期留置會使膀胱肌肉失去張力；固定氣囊注入5～10 c.c.無菌蒸餾水；蓄尿袋需定時排空，皆屬正確措施。"},{"i":"104-1|37","e":"104-1","n":37,"c":6,"s":"食物進入腸胃道後產生大腸蠕動是下列何種反射？","o":["胃十二指腸反射","十二指腸結腸反射","直腸反射","刺激交感神經衝動的反射"],"a":"B","k":"B","t":"","x":"食物進入十二指腸後經十二指腸結腸反射（與胃結腸反射）引發橫結腸的質塊運動，產生大腸蠕動，因此餐後常有便意。直腸反射是糞便由乙狀結腸進入直腸引起便意；交感神經興奮則會抑制腸蠕動。"},{"i":"104-1|40","e":"104-1","n":40,"c":6,"s":"有關護理師執行誘尿措施的敘述，下列何者錯誤？","o":["讓病人聽流水聲","讓病人手握冰塊","按摩病人的恥骨聯合上方","教導病人做凱格爾氏運動（Kegel’s Exercise）"],"a":"D","k":"D","t":"","x":"誘尿方法包括聽流水聲、手握冰塊、膀胱部位用熱、溫水坐浴、會陰沖洗及按摩膀胱部位（恥骨聯合上方）等。凱格爾氏運動是強化骨盆底肌肉以改善壓力性尿失禁的方法，並非誘尿措施。"},{"i":"104-1|41","e":"104-1","n":41,"c":6,"s":"有關尿道之敘述，下列何者錯誤？","o":["女性尿道長約10公分","女性尿道口位於陰蒂與陰道口之間","男性尿道長約20公分","男性尿道也是精液排出的管道"],"a":"A","k":"A","t":"","x":"女性尿道長約3.8～5公分，並非10公分，故A錯誤。女性尿道口位於陰蒂與陰道口之間；男性尿道長約16～20公分，兼具排尿與排出精液的功能。"},{"i":"104-1|52","e":"104-1","n":52,"c":6,"s":"進行蟯蟲檢查時，收集此檢體的方法為何？","o":["糞便標本置於衛生紙上，再放入收集盒","以棉棒沾取糞便，再放入收集盒","以吸管吸取糞便，再放入收集瓶","用收集之透明膠帶在肛門口附近輕壓沾黏"],"a":"D","k":"D","t":"","x":"蟯蟲雌蟲於夜間爬至肛門口產卵，檢查時應於清晨排便及沐浴前，以透明膠帶在肛門口附近輕壓沾黏蟲卵，再貼於玻片送檢。以衛生紙、棉棒或吸管收集糞便不易檢出蟯蟲卵。"},{"i":"103-2|30","e":"103-2","n":30,"c":6,"s":"王老先生因車禍，導致腦部出血昏迷住院治療，現個案已經清醒，下腹部尿脹凸起並表示尿急，但解不出來，護理師提供誘尿措施，下列敘述何者正確？","o":["請個案憋氣腹部用力","給予雙手握熱水袋","下腹部局部按摩","下腹部局部冷敷"],"a":"C","k":"C","t":"","x":"誘尿方法包括聽流水聲、手握冰塊、膀胱部位局部用熱、溫水坐浴、會陰沖洗及順時鐘輕揉膀胱部位等，故下腹部局部按摩正確。個案腦出血，憋氣用力（伐氏操作）會使顱內壓升高而禁用；手部應握冰塊而非熱水袋；下腹部應用熱而非冷敷。"},{"i":"103-2|32","e":"103-2","n":32,"c":6,"s":"有關泌尿道感染之症狀，下列何者正確？","o":["頻尿、血尿、解尿燒灼感","急尿、糖尿、解尿燒灼感","尿失禁、琥珀色尿、腹痛","尿瀦留、蛋白尿、側腰痛"],"a":"A","k":"A","t":"","x":"泌尿道感染常見症狀為頻尿、急尿、解尿疼痛或燒灼感、恥骨上壓痛，並可能出現血尿、膿尿或混濁有臭味的尿液。糖尿、蛋白尿、琥珀色尿及尿瀦留並非泌尿道感染的典型表現。"},{"i":"103-2|33","e":"103-2","n":33,"c":6,"s":"陳先生罹患膽道阻塞，其糞便可能的顏色為：","o":["綠色","黑色","灰白色","黃棕色"],"a":"C","k":"C","t":"","x":"膽道阻塞使膽汁無法進入腸道，糞便缺乏膽色素而呈灰白色（陶土色）。黃棕色為正常糞便顏色，黑色見於上腸胃道出血或服用鐵劑，綠色常見於食用大量綠色蔬菜或腸道蠕動過快。"},{"i":"103-2|34","e":"103-2","n":34,"c":6,"s":"有關連續性膀胱灌洗（continuous bladder irrigation）的敘述，下列何者正確？","o":["溶液溫度為41～43℃","灌洗液與膀胱的垂直距離約75～90公分","若為壓迫止血作用，則氣囊要注入5～10 c.c.之無菌蒸餾水","灌洗溶液及管路每三天更換一次"],"a":"B","k":"B","t":"","x":"膀胱灌洗溶液液面需高出膀胱約75～90公分，利用重力灌入。灌洗液約與體溫相近，不需加熱至41～43℃；一般固定氣囊注入5～10 c.c.，若要壓迫止血需注入較多量（約30 c.c.）；灌洗溶液及管路應每天更換。"},{"i":"103-2|55","e":"103-2","n":55,"c":6,"s":"教導陳小弟蟯蟲檢查之樣本收集，下列敘述何者錯誤？","o":["告知陳小弟要先排便後再採取檢體送檢","檢查時用膠帶輕壓肛門口以沾取蟲卵","收集到檢體應於30分鐘內儘快送檢","在留取檢體後，可將檢體收集器置於溫水杯中送檢"],"a":"A","k":"A","t":"","x":"蟯蟲雌蟲夜間爬至肛門口產卵，應於清晨起床後、排便及沐浴前，以透明膠帶輕壓肛門口沾取蟲卵，排便後採檢會使蟲卵被擦除而降低檢出率，故A錯誤。檢體應儘快送檢，必要時保溫以維持檢體品質。"},{"i":"103-1|32","e":"103-1","n":32,"c":6,"s":"（情境：護理師為成人男性病人執行間歇導尿以協助排尿。）執行間歇導尿的過程，下列何者錯誤？","o":["尿管插入遇有阻力時，應再更換管徑較粗的尿管再試","需以潤滑劑潤滑尿管約17.5~20公分再插入","導出的尿液不宜超過500 c.c.","導尿之尿管選擇16~18 Fr.為宜"],"a":"A","k":"A","t":"","x":"導尿管插入遇到阻力時不可強行插入或改用較粗的尿管，應請病人深呼吸放鬆、稍微旋轉尿管或改用較細的尿管，必要時通知醫師。男性尿道長約16～20公分，需潤滑約17.5～20公分；單次導出尿液不宜超過500 c.c.；成人男性選用16～18 Fr.。"},{"i":"103-1|33","e":"103-1","n":33,"c":6,"s":"（情境：護理師為成人男性病人執行間歇導尿以協助排尿。）護理師若導出480 c.c.尿液，評估下列何種尿液性質方為正常狀態？","o":["有少許血絲沉浮其中","尿比重為1.020","混濁狀尿液","暗褐色尿液"],"a":"B","k":"B","t":"","x":"正常尿液為淡黃色、清澈透明，尿比重約1.010～1.025，故1.020屬正常。尿中有血絲、混濁或暗褐色皆屬異常，可能與出血、感染、膿尿或膽紅素等有關。"},{"i":"103-1|34","e":"103-1","n":34,"c":6,"s":"王老太太表示在大笑、劇烈咳嗽或快速走路時，會有尿液滲出（滴出），她在排尿上可能有何種問題？","o":["反射性尿失禁","功能性尿失禁","急迫性尿失禁","壓力性尿失禁"],"a":"D","k":"D","t":"","x":"壓力性尿失禁是因骨盆底肌肉無力，當大笑、咳嗽、打噴嚏或提重物等腹內壓增加時，不自主排出少量（少於50 mL）尿液。急迫性尿失禁為強烈尿意後立即排尿；反射性多見於脊髓損傷；功能性則因身體或認知功能障礙無法及時如廁。"},{"i":"103-1|38","e":"103-1","n":38,"c":6,"s":"小量灌腸不具下列那一項作用？","o":["潤滑及軟化糞便","下腸道手術前準備","給藥","供給營養"],"a":"B","k":"B","t":"","x":"小量灌腸（不超過240 mL）包括油灌腸、安撫灌腸、驅風灌腸等，可潤滑軟化糞便、給藥或供給營養。下腸道手術前準備需徹底清潔腸道，應使用大量清潔灌腸，非小量灌腸的作用。"},{"i":"102-2|5","e":"102-2","n":5,"c":6,"s":"有關糞便檢體之收集，下列敘述何項錯誤？","o":["糞便量約為一顆花生米大小","若為水便或稀便，可用棉花棒沾取留存","若要做糞便培養，可利用無菌培養棉棒輕輕插入肛門1～2公分，旋轉一圈","可請病患先排空膀胱，避免尿液污染糞便檢體"],"a":"B","k":"B","t":"","x":"糞便標本約取花生米大小即可，若要做培養可用無菌培養棉棒插入肛門1～2公分旋轉取樣，並應先排空膀胱以免尿液汙染。水便或稀便應以乾淨容器或吸管收集適量液狀糞便，以棉花棒沾取量太少且水分易被棉花吸收，故B錯誤。"},{"i":"102-2|21","e":"102-2","n":21,"c":6,"s":"大強30歲，明天早上欲行腸道手術，醫師處方如下：S.S. Enema st.。當護理師執行灌腸時，下列敘述何者錯誤？","o":["溶液溫度在40.6～43.3℃（105～110℉）","病患須予左側臥","灌腸筒內液面與肛門的垂直距離不超過45～60公分","肛管插入肛門深度，約為5.0～7.0公分"],"a":"D","k":"D","t":"","x":"大量灌腸成人肛管插入深度約7.5～10公分（3～4吋），5～7公分過淺，故D錯誤。肥皂水灌腸溶液溫度約40.6～43.3℃，病人採左側臥以順應降結腸位置，灌腸筒液面距肛門45～60公分，均正確。"},{"i":"102-2|24","e":"102-2","n":24,"c":6,"s":"下列何種情況，病患的糞便顏色可能是白色的？","o":["腸道感染","膽道阻塞","食用過多甜菜","上腸胃道出血"],"a":"B","k":"B","t":"","x":"膽道阻塞時膽汁無法進入腸道，糞便缺乏膽色素而呈灰白色（陶土色），鋇劑檢查後亦可呈灰白色。腸道感染多呈綠色或水樣、食用甜菜或下腸胃道出血呈紅色、上腸胃道出血則呈黑色柏油便。"},{"i":"102-2|25","e":"102-2","n":25,"c":6,"s":"護理師執行大量灌腸後，應教導病患保留多久才可解出？","o":["5～10分鐘","30分鐘以上","越久越好","依醫囑而定"],"a":"A","k":"A","t":"","x":"肥皂水、生理食鹽水等大量灌腸屬非保留灌腸，溶液僅需在直腸或結腸保留5～10分鐘即可排出，以達到清潔腸道的效果。保留15～30分鐘是保留灌腸的要求，保留越久並非越好。"},{"i":"102-2|27","e":"102-2","n":27,"c":6,"s":"護理師為劉老先生執行存留導尿時，下列敘述何者正確？","o":["以內科無菌技術導尿，並使用碘酒消毒會陰及尿道口","選用合適的導尿管，一般應為16～18 Fr.","尿管插入約10 cm","插入導尿管後應打入20 c.c.蒸餾水於尿管球端，以防脫落"],"a":"B","k":"B","t":"","x":"成人男性導尿管選用16～18 Fr.為宜。導尿為侵入性治療，需以外科無菌技術執行，且不用碘酒消毒會陰；男性尿管插入約20公分；固定氣囊注入5～10 c.c.無菌蒸餾水，20 c.c.過多易造成膀胱痙攣或損傷。"},{"i":"102-2|28","e":"102-2","n":28,"c":6,"s":"王女士腹部手術後有留置導尿管，護理師執行會陰沖洗時，發現王女士的導尿管滑出尿道口且露出於體外，應立即採取下列何種措施？","o":["用優碘消毒導尿管後再插入","重新打入10 c.c.蒸餾水再固定導尿管","將導尿管移走換成尿布","更換新的導尿管"],"a":"D","k":"D","t":"","x":"存留導尿管一旦滑出尿道口至體外即已受汙染，不可消毒後再插入或重新打水固定，應更換新的無菌導尿管重新置入，以避免泌尿道感染。改用尿布則無法達到原本留置導尿的目的。"},{"i":"102-2|47","e":"102-2","n":47,"c":6,"s":"收集標本之前三天未告知不可進食內臟類食物，則下列那一項檢查結果，可能出現偽陽性？","o":["阿米巴原蟲檢查","細菌培養","寄生蟲檢查","潛血反應試驗"],"a":"D","k":"D","t":"","x":"糞便潛血反應試驗前三天應避免食用內臟、紅肉、深綠色蔬菜及鐵劑等，否則其中的血紅素或鐵質會造成偽陽性。阿米巴原蟲、細菌培養與寄生蟲檢查則不受進食內臟類食物影響。"},{"i":"102-2|49","e":"102-2","n":49,"c":6,"s":"尿液常規檢查的檢體收集後若無法於30分鐘內送檢，應放入何種溫度的冰箱內暫存？","o":["-5～-7℃","0℃","6～8℃","13～15℃"],"a":"C","k":"C","t":"","x":"尿液常規檢查檢體應於收集後30分鐘內送檢，以免細菌繁殖及尿液成分改變；若無法及時送檢，應置於冰箱冷藏（約6～8℃）暫存。零下溫度會使尿液結凍、破壞細胞，13～15℃則無法抑制細菌生長。"},{"i":"102-1|31","e":"102-1","n":31,"c":6,"s":"（情境：陳先生72歲，因腦中風住院，目前意識不清，無自理能力。）陳先生已3天未解大便，護理師欲評估陳先生的排便型態，下列敘述何者錯誤？","o":["正常腸音約5～15秒蠕動一次，便秘時腸音可能會減少","長期使用輕瀉劑可能導致排便反射遲緩而腹瀉","當乙狀結腸有糞便積聚時可觸摸到圓形硬塊","上腸胃道出血時，大便可能會呈黑色"],"a":"B","k":"B","t":"","x":"長期使用輕瀉劑會使腸道對刺激的反應變差、排便反射遲鈍，反而導致便祕，而非腹瀉，故(B)錯誤。正常腸蠕動音約每5～15秒一次，便祕時腸音可能減少；乙狀結腸積聚糞便時可觸摸到硬塊；上腸胃道出血時糞便可呈黑色焦油便。"},{"i":"102-1|32","e":"102-1","n":32,"c":6,"s":"（情境：陳先生72歲，因腦中風住院，目前意識不清，無自理能力。）護理師欲為陳先生進行小量灌腸，下列措施何者正確？","o":["協助病人採取右側臥姿勢","使用可棄式灌腸器灌腸時，不需排出空氣","可棄式灌腸器管身需插入肛門約7.5～10公分","灌腸結束後，即可立刻協助病人解便"],"a":"C","k":"C","t":"","x":"可棄式灌腸器的管身需插入肛門約7.5～10公分（成人），使溶液進入直腸。小量灌腸應採左側臥；使用前應先排出管內空氣，以免灌入空氣造成腹脹不適；灌腸後應請病人盡量忍住一段時間，使溶液充分作用後再解便。"},{"i":"102-1|33","e":"102-1","n":33,"c":6,"s":"要留取留置尿管病人小便檢體時，先以管夾夾住引流管10～15分鐘後，再以無菌技術進行下列何種措施？","o":["將蓄尿袋開啟引流所需之尿液","更換新的導尿管，並引流所需尿液","以空針自導尿管橡皮接頭處抽取所需尿液","將導尿管和蓄尿袋接口鬆開，引流所需尿液"],"a":"C","k":"C","t":"","x":"留置尿管病人收集尿液檢體時，應先夾住引流管10～15分鐘讓尿液蓄積，再以無菌技術消毒導尿管上的橡皮接頭（採檢口），以空針抽取所需尿液。蓄尿袋內的尿液已滯留一段時間，不適合送檢；不需為採檢而更換導尿管；鬆開導尿管與蓄尿袋接口會破壞密閉系統，增加感染風險。"},{"i":"102-1|34","e":"102-1","n":34,"c":6,"s":"王老先生70歲，因中風住院，現有導尿管留置，下列護理措施何者正確？①若有體溫升高，尿液混濁情形，應報告醫師 ②應給予足夠水分，維持正常尿量 ③每天須給予導尿管護理 ④每天須經導尿管灌洗膀胱一次","o":["①②③","①③④","①②④","②③④"],"a":"A","k":"A","t":"","x":"存留導尿病人若出現體溫升高、尿液混濁等感染徵象應報告醫師（①），並給予足夠水分維持尿量，以自然沖洗泌尿道（②），每日執行導尿管護理（③）。膀胱灌洗需有醫囑並視病情需要執行，不應常規每天灌洗，以免破壞密閉系統、增加感染機會，故④錯誤。"},{"i":"102-1|54","e":"102-1","n":54,"c":6,"s":"陳小姐因手臂蜂窩組織炎入院治療，目前意識清楚且可下床活動，有關協助其收集常規尿液檢查之敘述，下列何者錯誤？","o":["主要在檢驗尿液的一般性狀","尿液檢體應儘量於30分鐘內送檢","若未能立即送檢，可放於4～10℃冰箱內暫存且在2小時內送檢","最好以單次導尿收集陳小姐的尿液檢體送檢"],"a":"D","k":"D","t":"","x":"常規尿液檢查主要在檢驗尿液的一般性狀，一般請意識清楚、可下床活動的病人自行收集清潔的中段尿即可，不需以單次導尿收集，以免增加泌尿道感染的風險，故(D)錯誤。尿液檢體應盡快送檢，若無法立即送檢可暫存於冰箱，以免細菌增生或成分改變。"},{"i":"101-2|9","e":"101-2","n":9,"c":6,"s":"（情境：溫小姐，35歲，主訴解尿時疼痛、會陰部有燒灼感、憂慮緊張，外觀臉色潮紅，入院治療。）醫囑開立「Urine Culture」，下列敘述何者錯誤？","o":["使用無菌檢體收集瓶收集","收集尿液檢體的方法之一為導尿","檢體儘速送至檢驗室檢驗","必須收集清晨第一次的尿液標本"],"a":"D","k":"D","t":"","x":"尿液培養需以無菌檢體收集瓶收集無菌的中段尿，或以導尿方式取得檢體，並應盡速送檢，以免細菌增生影響結果。尿液培養不一定要收集清晨第一次尿液，清晨第一次尿液較常用於尿液常規等需濃縮尿液的檢查，故(D)錯誤。"},{"i":"101-2|30","e":"101-2","n":30,"c":6,"s":"（情境：潘先生，78歲，近日反覆出現腹瀉、便秘，家屬擔心個案結腸有異狀，與醫師討論後安排大腸鏡檢查，今天開始執行結腸灌洗。）護理師執行時，個案應採取何種姿位？","o":["垂頭仰臥式","膝胸臥式","左側臥式","右側臥式"],"a":"C","k":"C","t":"","x":"結腸灌洗與大量灌腸相同，應協助病人採左側臥式，因降結腸與乙狀結腸位於左側，藉地心引力使溶液順利流入結腸。膝胸臥式常用於大腸鏡等檢查，垂頭仰臥式與右側臥式不利於溶液流入降結腸。"},{"i":"101-2|31","e":"101-2","n":31,"c":6,"s":"（情境：潘先生，78歲，近日反覆出現腹瀉、便秘，家屬擔心個案結腸有異狀，與醫師討論後安排大腸鏡檢查，今天開始執行結腸灌洗。）護理師協助潘先生執行結腸灌洗時，有關灌腸注意事項之敘述，下列何者錯誤？","o":["每次灌入量約為500 c.c.，回流盡後再灌入第二次","灌洗溶液應與室溫接近，約27.8℃-28.8℃","灌洗溶液液面至肛門距離約45-60公分","肛管插入深度成人約為7.5-10公分"],"a":"B","k":"B","t":"","x":"結腸灌洗的溶液溫度應為41～43℃，接近室溫的27.8～28.8℃過低，易刺激腸道並引起肛門肌肉痙攣、病人不適，故(B)錯誤。結腸灌洗每次灌入約500 c.c.，回流盡後再灌入；液面距肛門45～60公分；成人肛管插入深度約7.5～10公分。"},{"i":"101-2|32","e":"101-2","n":32,"c":6,"s":"林女士產後 6 小時還末解尿，主訴下腹部很脹，護理師誘導林女士小便，仍未解出，經醫師評估後醫囑予以單次導尿；護理師執行導尿之技術時，下列敘述何者錯誤？","o":["先予會陰沖洗再行導尿","尿道口消毒，應先擦中間尿道口，再擦兩側小陰唇","尿道口消毒後，一個棉球只能用一次，且須由上向下擦拭","一次導尿量以不超過500 c.c.為原則"],"a":"B","k":"B","t":"","x":"女性導尿消毒尿道口時，應先擦拭兩側（遠側、近側）小陰唇，最後再擦中間的尿道口，由上往下擦拭，且一個棉球只用一次，先擦中間尿道口會將兩側的細菌帶至尿道口，故(B)錯誤。導尿前先行會陰沖洗；單次導尿一次導出量不超過500 c.c.，以防腹壓驟降造成休克。"},{"i":"101-2|33","e":"101-2","n":33,"c":6,"s":"在執行存留導尿的過程，當液體打入存留導尿管的氣囊時病人表示疼痛，下列那一項護理措施最合宜？","o":["先抽出液體，再將導尿管向內推入2公分，使氣囊整個進入膀胱後，再打入液體","告訴病人這是正常現象，請其張口哈氣以轉移注意力","移除導尿管，重新插入","向病人解釋因液體較易引起疼痛，故改注入等量空氣"],"a":"A","k":"A","t":"","x":"注入液體於氣囊時病人感到疼痛，表示氣囊仍位於尿道內（頂在尿道頸），應先回抽氣囊內液體，再將導尿管向內推入約2公分，使氣囊完全進入膀胱後再注入液體。不可視為正常現象繼續注入，以免損傷尿道；不需移除重插，也不應改注入空氣。"},{"i":"101-1|26","e":"101-1","n":26,"c":6,"s":"（情境：王太太，50歲，因胸悶住院進行心導管檢查，術後須維持平躺6小時，不可下床，且傷口處須砂袋使用4小時。）王太太抱怨想解尿但解不出來，護理師給予誘尿，下列敘述何者錯誤？","o":["可以逆時鐘方向，輕揉膀胱部位","手握冰塊，可利用冷刺激使反射傳至大腦皮質","可準備溫水執行會陰沖洗，放鬆尿道括約肌","聽流水聲，可刺激大腦皮質產生尿意"],"a":"A","k":"A","t":"","x":"誘尿時可順時鐘方向輕揉膀胱部位，以促進排尿，逆時鐘方向不正確，故(A)錯誤。手握冰塊是以冷刺激反射至大腦皮質；以溫水會陰沖洗可放鬆尿道括約肌；聽流水聲可刺激大腦產生尿意，皆為適當的誘尿方法。"},{"i":"101-1|27","e":"101-1","n":27,"c":6,"s":"（情境：王太太，50歲，因胸悶住院進行心導管檢查，術後須維持平躺6小時，不可下床，且傷口處須砂袋使用4小時。）經過誘尿後，王太太仍然無法自行解尿，護理師欲執行單次導尿法，下列敘述何者錯誤？","o":["協助王太太採屈膝仰臥式","須採無菌技術，戴上無菌手套，將潤滑劑擠在紗布上，再以紗布潤滑導尿管頭部2~3公分","消毒尿道口時，須由上而下擦拭，順序為：遠側小陰唇，近側小陰唇，中間尿道口","每次導尿量不可超過500 c.c."],"a":"B","k":"B","t":"","x":"執行導尿須遵守無菌技術，女性導尿管插入深度約5公分，潤滑長度約5～7公分（約2吋），僅潤滑頭部2～3公分長度不足，故(B)錯誤。女性導尿採屈膝仰臥；消毒尿道口由上往下擦拭，順序為遠側小陰唇、近側小陰唇、中間尿道口；單次導尿一次不可導出超過500 c.c.，以防腹壓驟降造成休克。"},{"i":"101-1|28","e":"101-1","n":28,"c":6,"s":"正常尿液的酸鹼（pH）值為：","o":["2.5-7.0","3.5-7.5","4.5-7.5","5.5-8.5"],"a":"C","k":"C","t":"","x":"正常尿液略呈酸性，pH值下限約4.5，一般範圍為4.5～8.0（平均約6），選項中以4.5～7.5最符合正常範圍。pH大於8.0可能為泌尿道感染，小於4.5則見於飢餓、脫水或代謝性酸中毒；其餘選項下限過低或過高。"},{"i":"101-1|38","e":"101-1","n":38,"c":6,"s":"護理人員執行灌腸技術時，若溶液之水溫過高，會引起下列那些反應？①暈厥 ②腸黏膜損傷 ③腸蠕動過速 ④肛門肌肉收縮痙攣","o":["①②④","①③④","②③④","①②③"],"a":"D","k":"D","t":"","x":"灌腸溶液溫度過高會使腸道與腹腔血管擴張，導致腦部與心臟血液供應不足而引起暈厥（①），並會損傷腸黏膜（②）、刺激腸蠕動過速（③）。肛門肌肉痙攣性收縮是溶液溫度過低所引起，故④錯誤。"},{"i":"100-2|14","e":"100-2","n":14,"c":6,"s":"柯太太在拔除導尿管後 6 個小時仍未解尿，觸診下腹可摸到膀胱，醫師開立給予導尿之醫囑，護理師在執行此活動時，下列何者正確？","o":["立即到病人單位執行導尿","執行導尿前再評估一次個案解尿之情形","護理師先將導尿包準備好，協助醫師執行導尿","先告知病人要行導尿，請其選擇適當時間再執行"],"a":"B","k":"B","t":"","x":"執行導尿為侵入性措施，即使已有醫囑，執行前仍應再評估病人的解尿情形與膀胱脹滿程度，若病人已能自解則可避免不必要的導尿。導尿可由護理師依醫囑執行，不需協助醫師進行；也不應未評估就立即導尿，或因尿瀦留而延後由病人選擇時間。"},{"i":"100-2|30","e":"100-2","n":30,"c":6,"s":"護理師為女性病人執行會陰沖洗及導尿時，應協助其採用下列何種姿勢？","o":["辛氏臥式","膝胸臥式","截刀臥式","屈膝仰臥式"],"a":"D","k":"D","t":"","x":"為女性病人執行會陰沖洗及導尿時，應協助採屈膝仰臥式，雙腳屈膝分開，可充分暴露會陰部並方便操作。辛氏臥式（側臥）常用於灌腸或肛門給藥，膝胸臥式用於大腸鏡等檢查，截石臥式則多用於婦科內診或生產。"},{"i":"100-2|31","e":"100-2","n":31,"c":6,"s":"有關執行成人大量灌腸技術的敘述，下列何者正確？①適當的肛管尺寸為14~18 Fr. ②肛管插入的深度為 7.5~10 cm ③灌腸筒液面高度與肛門的垂直距離約 45~60 cm ④灌完後請個案儘量忍住便意5~10分鐘","o":["①②③","①②④","①③④","②③④"],"a":"D","k":"D","t":"","x":"成人大量灌腸時，肛管插入深度約7.5～10公分（②），灌腸筒液面距肛門高度約45～60公分（③），灌完後請病人盡量忍住便意5～10分鐘，使溶液充分軟化糞便（④）。成人肛管應選用22～24 Fr.，14～18 Fr.適用於兒童，故①錯誤。"},{"i":"100-2|32","e":"100-2","n":32,"c":6,"s":"使用直腸栓劑去除糞便阻塞之過程，下列何者正確？","o":["宜於飯前30分鐘塞入","應用食指將栓劑塞入約2.5~3公分至直腸中","塞入時教導病人作Valsava maneuver動作","塞入後請病人忍5~15分鐘後解出"],"a":"A","k":"A","t":"","x":"使用直腸栓劑促進排便，宜配合病人排便習慣，於飯前約30分鐘塞入，可結合進食後的胃結腸反射促進排便。成人栓劑應以戴手套的食指推入肛門約6.5～7.5公分，超過肛門內括約肌；塞入時請病人張口哈氣放鬆，而非做伐氏操作；塞入後應盡量忍住讓栓劑融化作用，5～15分鐘即解出效果不佳。"},{"i":"100-2|34","e":"100-2","n":34,"c":6,"s":"照護主訴無法解尿的病人，護理師可獨立自主使用的誘尿方法包括：①讓病人聽流水聲 ②讓病人手握冰塊 ③為病人執行會陰沖洗 ④在病人膀胱部位放置熱水袋熱敷","o":["①②③","①②④","①③④","②③④"],"a":"A","k":"A","t":"","x":"聽流水聲、手握冰塊（冷刺激）及以溫水會陰沖洗，皆是護理師可獨立執行的誘尿方法（①②③）。在膀胱部位放置熱水袋屬於局部用熱，需有醫囑才能執行，故④不屬於可獨立執行的措施。"},{"i":"100-2|35","e":"100-2","n":35,"c":6,"s":"可預防發生泌尿道感染之護理措施包括：①可以多飲用柳橙汁、蔓越梅汁等富含維生素 C 的果汁酸化尿液 ②每日攝取2000~3000 c.c.水分 ③鼓勵每日溫水坐浴2次 ④指導性活動前、後均應解尿","o":["①②","①③","②③","②④"],"a":"D","k":"D","t":"","x":"預防泌尿道感染應大量攝取液體每日2,000～3,000 c.c.以增進泌尿道自然沖洗（②），並在性活動前、後解尿（④）。柳橙汁等柑橘類果汁代謝後反而使尿液偏鹼，酸化尿液宜選蔓越莓汁；盆浴或坐浴易使細菌進入尿道，應以淋浴代替，故①③錯誤。"},{"i":"100-2|53","e":"100-2","n":53,"c":6,"s":"林小姐行腹腔手術前，需採用低渣飲食，下列何者是其可以進食的食物？","o":["白粥","熱燕麥粥","加牛奶的咖啡","果菜汁"],"a":"A","k":"A","t":"","x":"低渣飲食是減少膳食纖維及會在腸道留下殘渣的食物，以減少糞便量與腸道刺激，白粥屬於低渣食物。燕麥為全穀類、含高纖維；牛奶及乳製品會增加腸道殘渣；果菜汁含蔬果纖維，皆不適合低渣飲食。"},{"i":"100-1|4","e":"100-1","n":4,"c":6,"s":"大量灌腸採左側臥的理由為何？","o":["降結腸位於左側腹部","降低結腸痙攣的機會","病患會感到比較舒適","協助降低心臟壓力"],"a":"A","k":"A","t":"","x":"大量灌腸應採左側臥，因降結腸與乙狀結腸位於左側腹部，左側臥可藉地心引力使溶液順勢流入降結腸及乙狀結腸，灌腸效果較好。其主要理由是解剖位置，而非降低腸痙攣、舒適或減輕心臟壓力。"},{"i":"100-1|15","e":"100-1","n":15,"c":6,"s":"護理師執行女病患存留導尿的技術時，下列敘述何者正確？","o":["使用水溶性潤滑劑潤滑","潤滑導尿管前端4~5吋","會陰消毒由下往上擦拭","插入導尿管後應注入20 c.c.蒸餾水於尿管球端，以防脫落"],"a":"A","k":"A","t":"","x":"執行導尿時應使用水溶性潤滑劑潤滑導尿管前端，避免油性潤滑劑造成阻塞或刺激。女病人潤滑長度約1～2吋（5公分左右），4～5吋偏長；會陰消毒應由上往下、由前往後擦拭，以免將肛門細菌帶至尿道口；存留導尿管氣囊通常注入5～10 c.c.無菌蒸餾水，不需20 c.c.。"},{"i":"100-1|27","e":"100-1","n":27,"c":6,"s":"護理師觀察到術後 2 小時病患的存留導尿管之蓄尿袋中完全無尿液，下列何種護理措施應該最優先執行？","o":["重新放置留置導尿管","立刻通知醫生做緊急處理","檢查留置導尿系統的通暢性","執行誘尿措施，以誘使解尿"],"a":"C","k":"C","t":"","x":"術後病人存留導尿管的蓄尿袋中完全無尿時，應先檢查導尿系統是否通暢，如管路有無扭曲、受壓、阻塞或接頭鬆脫，排除機械性原因後再評估病人狀況與通知醫師。病人已有存留導尿管，不需執行誘尿；未確認原因前也不應直接重新放置導尿管。"},{"i":"100-1|32","e":"100-1","n":32,"c":6,"s":"教導壓力性尿失禁的病患，訓練其膀胱排尿功能的最佳運動是：","o":["腹部按摩運動","抬臀運動","仰臥起坐運動","凱格爾氏運動（Kegel’s Exercise）"],"a":"D","k":"D","t":"","x":"壓力性尿失禁是因骨盆底肌肉無力，腹內壓增加時不自主漏尿，應指導病人做凱格爾氏運動（Kegel’s exercise），重複收縮再放鬆會陰部肌肉，以強化骨盆底肌肉張力。腹部按摩、抬臀及仰臥起坐運動無法直接強化會陰部肌肉。"},{"i":"100-1|33","e":"100-1","n":33,"c":6,"s":"病患陳先生，預做直腸攝影，而服用鋇劑，則其檢查後的糞便可能呈現何種顏色？","o":["灰白色","黃色","暗紅色","黑色"],"a":"A","k":"A","t":"","x":"服用鋇劑做腸胃道攝影後，鋇劑會隨糞便排出，使糞便呈灰白色（灰白色亦見於缺乏膽汁）。黑色焦油便見於上腸胃道出血或服用鐵劑，暗紅色或紅色見於下腸胃道出血，黃色則為正常成人糞便顏色。"},{"i":"100-1|35","e":"100-1","n":35,"c":6,"s":"有關保留灌腸（retention enema）的敘述，下列何者錯誤？","o":["溶液溫度為38~41℃","0.2%肥皂水為最佳的溶液選擇","所使用的溶液量一般不超過240 c.c.","溶液保留在腸道的時間約為15~30分鐘"],"a":"B","k":"B","t":"","x":"保留灌腸是由直腸給予藥物或水分，需讓溶液保留在腸道15～30分鐘，溶液量少（不超過240 mL）且流速慢，以免刺激便意。肥皂水會刺激腸黏膜引起排便，屬於非保留灌腸（清潔灌腸）用液，不適用於保留灌腸，故(B)錯誤。"},{"i":"100-1|63","e":"100-1","n":63,"c":6,"s":"有關尿液培養的敘述，下列何者正確？","o":["檢查目的是測腎小管再吸收能力","應收集24小時尿液量","水腫病患禁做","可作為抗生素選用的指標"],"a":"D","k":"D","t":"","x":"尿液培養可確認泌尿道感染的致病菌種，並配合藥物敏感試驗作為選用抗生素的依據。測腎小管再吸收能力為尿比重或濃縮試驗；尿液培養需收集無菌的中段尿或導尿標本，不需收集24小時尿液；水腫病人並非禁忌。"},{"i":"100-1|65","e":"100-1","n":65,"c":6,"s":"協助王先生進行糞便常規檢查之敘述，下列何者錯誤？","o":["檢驗的目的在檢查糞便的一般性狀","請王先生不需排空膀胱，直接解於便盆中","以取便匙挖取少許糞便放入標本收集器送檢","提醒王先生不可將衛生紙置於糞便檢體上"],"a":"B","k":"B","t":"","x":"收集糞便標本時，應請病人先排空膀胱再解便於便盆中，避免尿液混入糞便影響檢驗結果，故(B)錯誤。糞便常規檢查主要是檢查糞便的一般性狀，以取便匙挖取少許糞便置入標本容器送檢，並提醒病人勿將衛生紙置於糞便上。"},{"i":"115-2|9","e":"115-2","n":9,"c":7,"s":"有關給藥常用縮寫的涵義，下列何者錯誤？","o":["S.C.皮內注射","O.U.雙眼","q.o.d.每隔一天","A.C.飯前"],"a":"A","k":"A","t":"","x":"S.C.是皮下注射，皮內注射應為I.D.（或I.C.），故A錯誤。O.U.為雙眼、q.o.d.為每隔一天、A.C.為飯前，皆正確。"},{"i":"115-2|10","e":"115-2","n":10,"c":7,"s":"醫囑「Rinteron solution 1gtt. O.U. Q6h」及「Tetracycline oint. O.U. Q6h」，下列給藥的敘述何者錯誤？","o":["將藥物使用於病人雙眼，且應每6小時使用1次","先給予Rinteron solution後約5分鐘，再使用Tetracycline oint.","使用Tetracycline oint.時，將藥物由眼尾塗往內眥","滴眼藥水後，病人閉眼轉動眼球，並輕壓鼻淚管30～60秒"],"a":"C","k":"C","t":"","x":"眼藥膏應由內眥往外眥（眼尾）方向擠入下結膜囊，以免把分泌物或藥物帶往鼻淚管，故C錯誤。O.U. Q6h表示雙眼每6小時一次；同時使用時先滴水劑，間隔約5分鐘再用藥膏；滴藥後閉眼轉動眼球，並輕壓鼻淚管以減少全身吸收。"},{"i":"115-2|11","e":"115-2","n":11,"c":7,"s":"醫囑Ampicillin 2,000 mg IVD Q4H，此藥物為每vial含有Ampicillin 500 mg，下列給藥敘述何者正確？","o":["每次取用2個vial","一天需給藥4次","一天給藥總量是24個vial","途徑為肌肉注射"],"a":"C","k":"C","t":"","x":"每次2,000 mg ÷ 500 mg/vial＝4 vials；Q4H一天給藥6次，總量4 × 6＝24 vials。IVD是靜脈滴注，不是肌肉注射。"},{"i":"115-2|12","e":"115-2","n":12,"c":7,"s":"服用Warfarin的病人，須注意藥物與食物之交互作用，下列何者最適當？","o":["鼓勵增加柑橘類和菠菜等深綠色蔬菜","避免增加菠菜等深綠色蔬菜和蛋黃、動物內臟","避免增加豆類及豆製品的攝取，但鼓勵攝取動物內臟","鼓勵增加柑橘類，但避免豆類及豆製品的攝取"],"a":"B","k":"B","t":"","x":"Warfarin是維生素K拮抗劑，大量攝取富含維生素K的食物（如菠菜等深綠色蔬菜、蛋黃、動物內臟）會降低抗凝血效果，應避免突然增加攝取量，維持穩定。鼓勵多吃深綠色蔬菜或動物內臟都會拮抗藥效。"},{"i":"115-2|32","e":"115-2","n":32,"c":7,"s":"醫囑「Morphine 40 mg I.V. drip p.r.n. for pain」，護理師在確認醫囑時，下列何者必須先向開立醫囑醫師澄清？","o":["藥物名稱","藥物劑量","給藥途徑","給藥時間"],"a":"D","k":"D","t":"","x":"PRN醫囑必須註明給藥間隔（如Q4H、Q6H），此醫囑沒有寫給藥時間；Morphine又是管制藥品，必須先向開立醫師澄清。藥物名稱、劑量、途徑在醫囑中都已寫明。"},{"i":"115-1|10","e":"115-1","n":10,"c":7,"s":"有關給藥醫囑縮寫的意義，下列何者正確？①A.U.是指雙眼②A.S.是指左耳③S.C.是指「皮下注射」④Q4H表示每天四次","o":["①②","②③","③④","①④"],"a":"B","k":"B","t":"","x":"A.S.為左耳（②）、S.C.為皮下注射（③）。A.U.是雙耳，雙眼應為O.U.；Q4H是每4小時一次，每天四次應為QID。"},{"i":"115-1|11","e":"115-1","n":11,"c":7,"s":"Gentamycin®每1 mL含40 mg，若醫囑需要100 mg，則應抽取該藥多少c.c.？","o":["1.0","1.5","2.0","2.5"],"a":"D","k":"D","t":"","x":"藥量換算可用比例式：40 mg：1 mL＝100 mg：X mL，X＝100 ÷ 40＝2.5 mL（c.c.），故答D。1.0 mL只含40 mg、2.0 mL含80 mg，劑量都不足；抽藥後應再核對劑量，避免換算錯誤。"},{"i":"115-1|12","e":"115-1","n":12,"c":7,"s":"下列何者為適用於鼻胃管灌食的藥物劑型？","o":["舌下錠","口含錠","軟膠囊","口服懸浮劑"],"a":"D","k":"D","t":"","x":"口服懸浮劑為液態，可直接經鼻胃管灌入，前後以溫開水沖管即可。舌下錠、口含錠須經口腔黏膜吸收，由鼻胃管灌入會失去療效；軟膠囊內含油性液體，不易磨粉，且容易殘留黏附、阻塞管路。"},{"i":"115-1|13","e":"115-1","n":13,"c":7,"s":"醫囑：tacrolimus 1 mg/cap 1 cap. QD P.O. 為持續性藥效膠囊，其正確的服用方式為何？","o":["整顆吞服","剝半吞服","磨粉後灌食","咬碎後吞服"],"a":"A","k":"A","t":"","x":"持續性藥效（緩釋）膠囊的設計是讓藥物在體內緩慢釋放，必須整顆吞服。若剝開、磨粉或咬碎，藥物會快速釋放吸收，增強藥性及副作用。"},{"i":"114-3|10","e":"114-3","n":10,"c":7,"s":"肛門栓劑使用後，遇體溫溶解，主要是藉由下列何者解剖位置的吸收，產生功效？","o":["肛門括約肌","直腸黏膜","乙狀結腸","降結腸"],"a":"B","k":"B","t":"","x":"肛門栓劑塞入後經體溫融化，主要經由血管豐富的直腸黏膜吸收，產生局部或全身作用。肛門括約肌是肌肉構造，不負責吸收；栓劑插入深度只到直腸，不會到達乙狀結腸或降結腸。"},{"i":"114-3|11","e":"114-3","n":11,"c":7,"s":"醫囑為「Digoxin 0.5#PO QOD」，下列敘述何者最適當？","o":["每次藥物劑量為0.5 mg","給藥途徑是舌下含服","早晚給藥各一次","兩天給藥一次"],"a":"D","k":"D","t":"","x":"QOD是每隔一天（兩天一次）給藥。0.5#表示半顆，實際劑量依錠劑規格而定，不一定是0.5 mg；PO為口服，不是舌下含服；早晚各一次是BID。Digoxin給藥前並須測量心尖脈。"},{"i":"114-3|12","e":"114-3","n":12,"c":7,"s":"使用Corticosteroids乾粉吸入劑治療的病人，下列何者為用藥後需漱口的主要理由？","o":["避免念珠菌感染","去除不好的味道","避免口腔黏膜受損","避免牙齒變色"],"a":"A","k":"A","t":"","x":"含類固醇的吸入劑使用後，藥物容易殘留在口咽，抑制局部免疫力而引發口腔念珠菌感染，所以每次使用後一定要漱口。去除味道、避免黏膜受損或牙齒變色都不是主要理由。"},{"i":"114-2|7","e":"114-2","n":7,"c":7,"s":"護理師執行醫囑「Dopamine（200 mg/5 mL/amp）4 amp in NS 500 c.c., IV Drip, pump 使用」時，下列敘述何者錯誤？","o":["需要準備Dopamine 1000 mg，打入生理食鹽水500 mL中","使用點滴pump持續滴注","醫囑不完整，應再與開立醫師確認","給藥後需要密切監測血壓的變化"],"a":"A","k":"A","t":"","x":"每安瓿含Dopamine 200 mg，4 amp共800 mg，而非1,000 mg，故A錯誤。Dopamine為強效升壓劑，須以輸液幫浦持續精確滴注，並密切監測血壓；此醫囑未註明輸注速率或劑量，屬不完整醫囑，應與開立醫師確認。"},{"i":"114-2|10","e":"114-2","n":10,"c":7,"s":"有關給藥五對的敘述，下列何者錯誤？","o":["病人對","作用對","劑量對","途徑對"],"a":"B","k":"B","t":"","x":"給藥五對是指病人對、藥物對、劑量對、途徑對、時間對，並沒有「作用對」，故B錯誤。執行時須配合三讀，在取藥、備藥及歸還藥物時逐一核對。"},{"i":"114-2|12","e":"114-2","n":12,"c":7,"s":"有關蒸氣吸入給藥法的相關敘述，下列何者最不適當？","o":["將熱以蒸氣方式應用於呼吸道，以便濕潤呼吸道黏膜及稀釋其分泌物","電動式噴霧器的噴霧治療瓶，需每天更換生理食鹽水，避免滋生病菌","教導病人使用手持噴霧器吸入藥物的同時，應採取慢而深的呼吸方式","手持噴霧器不須以無菌技術操作，且病人使用後以清水清洗晾乾即可"],"a":"B","k":"B","t":"","x":"電動式噴霧器的噴霧治療瓶應每天更換「無菌蒸餾水」，以避免滋生病菌，不是使用生理食鹽水，故B最不適當。蒸氣吸入可濕潤呼吸道黏膜、稀釋分泌物；吸入時應慢而深地呼吸，使藥物到達深部；手持噴霧器不需無菌技術，使用後以清水洗淨晾乾即可。"},{"i":"114-2|13","e":"114-2","n":13,"c":7,"s":"醫囑為「NTG 1 tab S.L. prn if chest pain」，下列敘述何者正確？","o":["每次給藥劑量為1#、途徑為口服","每次給藥劑量為1#、胸痛時舌下含用","飯後服用、途徑為舌下含用","飯前舌下含用、胸痛時使用"],"a":"B","k":"B","t":"","x":"S.L.為舌下含服，prn if chest pain表示胸痛時需要才給，每次1錠（1#），故B正確。NTG經舌下黏膜快速吸收，若口服吞下易被肝臟首渡效應破壞而失效；此醫囑屬需要時使用，與飯前、飯後無關。"},{"i":"114-1|10","e":"114-1","n":10,"c":7,"s":"下列何者為執行一次就自動失效的醫囑？①Dulcolax 1# supp. HS②Ketoprofen 1 amp. I.M. STAT③Valium 1# P.O. HS SOS④Demerol 40 mg I.M. Q6H PRN","o":["①③","①④","②③","②④"],"a":"C","k":"C","t":"","x":"STAT為立即給藥一次、SOS為必要時給予一次，兩者執行一次後即自動失效，屬臨時醫囑（②③）。①HS為每晚睡前給藥，屬長期醫囑；④PRN為需要時給予，可在醫囑有效期間依間隔重複使用，不會執行一次即失效。"},{"i":"114-1|11","e":"114-1","n":11,"c":7,"s":"小樂3歲，持續發燒不適，拒絕服藥，醫師開立Voren® 12.5 mg/supp 1# supp. STAT，護理師衛教小樂媽媽肛門栓劑的使用，下列敘述何者錯誤？","o":["肛門栓劑應保存在冰箱中冷藏","可在栓劑前端塗抹少量潤滑劑","栓劑插入肛門內約2吋深","塞入後維持原姿勢或右側臥15分鐘"],"a":"D","k":"D","t":"","x":"肛門栓劑應協助病人採左側臥（辛氏臥姿），順著直腸、乙狀結腸的走向塞入，塞入後維持左側臥約15～20分鐘，以利藥物吸收並避免滑出，故D錯誤。栓劑平時須冷藏避免軟化；前端可塗潤滑劑減少不適；需插入越過肛門內括約肌，幼兒約2吋深即可。"},{"i":"114-1|12","e":"114-1","n":12,"c":7,"s":"就藥物劑型而言，下列口服藥物何種吸收最快？","o":["acetylcysteine powders","acetaminophen tablet","brown mixture syrup","ampicillin capsule"],"a":"C","k":"C","t":"","x":"口服劑型吸收速度由快至慢為：溶液＞懸液劑＞粉劑＞軟膠囊＞錠劑＞硬膠囊。brown mixture糖漿屬溶液劑型，不需崩解即可吸收，速度最快；粉劑次之，錠劑與膠囊需先崩解溶離，吸收較慢。"},{"i":"114-1|13","e":"114-1","n":13,"c":7,"s":"醫囑開立oxacillin 1 gm Q6H I.V. drip，oxacillin藥瓶標示為250 mg/vial，每次給藥時應抽幾瓶（vial）？","o":["1","2.5","4","6"],"a":"C","k":"C","t":"","x":"每次劑量1 gm＝1,000 mg，1,000 mg ÷ 250 mg/vial＝4 vials。Q6H表示每6小時給藥一次，與每次抽取的瓶數無關，故答C。"},{"i":"113-3|5","e":"113-3","n":5,"c":7,"s":"核對醫囑應注意的內容，下列敘述何者錯誤？","o":["有無註明藥品的外觀與顏色","開立醫囑的日期與時間","藥物名稱、劑量、給藥時間與途徑","開立醫囑醫師的職稱與姓名"],"a":"A","k":"A","t":"","x":"核對醫囑應確認病人姓名、開立日期與時間、藥名、劑量、給藥途徑、給藥時間及醫師簽名等，藥品的外觀與顏色不屬醫囑應註明的內容，故A錯誤。"},{"i":"113-3|10","e":"113-3","n":10,"c":7,"s":"醫囑：「RI 6 IU S.C. TID AC 30’」、「NPH 5 IU S.C. HS」。下列有關執行前述醫囑的敘述，何者正確？①需立刻給予RI 6 IU ②每天晚上睡前給予NPH 5 IU ③飯後30分鐘給予RI 6 IU，一天四次 ④飯前30分鐘給予RI 6 IU，一天三次","o":["①③","②④","①④","②③"],"a":"B","k":"B","t":"","x":"TID AC 30'為一天三次、飯前30分鐘給予RI 6 IU；HS為睡前，即每晚睡前給予NPH 5 IU，故②④正確。醫囑中沒有STAT，不需立刻給藥；AC為飯前而非飯後，且TID為一天三次而非四次。"},{"i":"113-3|11","e":"113-3","n":11,"c":7,"s":"有關床邊給藥電子化作業之流程，下列何者正確？①以條碼掃描機刷病人手圈條碼 ②確認給藥訊息 ③以條碼掃描機刷藥品上的條碼 ④電腦出現藥物視窗 ⑤給藥後，儲存所有紀錄","o":["②→①→⑤→④→③","④→②→①→③→⑤","①→④→③→②→⑤","③→①→⑤→④→②"],"a":"C","k":"C","t":"","x":"床邊條碼給藥流程：先掃描病人手圈條碼確認身分，電腦出現該病人的藥物視窗，再掃描藥品條碼比對，確認給藥訊息無誤後給藥，給藥後儲存紀錄，順序為①→④→③→②→⑤。"},{"i":"113-3|12","e":"113-3","n":12,"c":7,"s":"有關經鼻胃管給藥的敘述，下列何者錯誤？","o":["使用氣切或氣管內管的病人，灌食前要先將氣囊放氣，以免造成吸入性肺炎","灌食前反抽物若為咖啡或暗紅色，應抽出並通知醫師","若遇不可磨粉之劑型，應詢問醫師以開立相同療效而可以研磨的劑型來替代","容易潮解、變質的藥物，在給藥前才研磨以免影響藥效"],"a":"A","k":"A","t":"","x":"使用氣切或氣管內管的病人經鼻胃管灌食或給藥時，氣囊應保持充氣，以防胃內容物逆流吸入氣道，放氣反而增加吸入性肺炎風險，故A錯誤。反抽物呈咖啡色或暗紅色疑似出血應通知醫師；不可磨粉的劑型應請醫師更換；易潮解的藥物應在給藥前才研磨。"},{"i":"113-2|10","e":"113-2","n":10,"c":7,"s":"有關給藥後的敘述，下列何者正確？①親自給藥親自記錄，不可在給藥前記錄 ②若病人拒服藥物，應記錄之，待醫師查房再報告 ③p.r.n.藥物給予後，待觀察病人反應後再完成給藥記錄 ④給藥後，若病人出現不適，應立即停藥並觀察生命徵象","o":["①②","③④","①④","②③"],"a":"C","k":"C","t":"","x":"給藥須親自給藥、親自記錄，且應在給藥後才記錄；病人用藥後出現不適應立即停藥、觀察生命徵象並報告，故①④正確。病人拒服藥物應立即報告醫師，不可等查房；PRN藥物給予後應立即記錄，以免重複給藥。"},{"i":"113-2|11","e":"113-2","n":11,"c":7,"s":"有關給藥的禁忌，下列敘述何者錯誤？","o":["鐵劑應避免與茶葉水併服，因茶葉中的鞣酸遇鐵會形成沉澱物","服藥時不可與酒精類飲料併服，因酒精會影響藥物的代謝過程","抗組織胺類藥物配合
