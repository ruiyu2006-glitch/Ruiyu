：每天至少三次鬆散液狀便、腸蠕動音增快、排便急促、腹痛、腸痙攣。"},{"i":"b3-14","e":"","n":0,"c":6,"s":"下列何者是「排便失禁」的定義性特徵？","o":["每天解出三次以上鬆散液狀便，並有腸蠕動音增快","糞便沾污衣服或床墊，且無法感受到直腸脹滿感","觸摸到直腸的硬塊，且排便次數減少","排出乾硬的成形便，且排便時需用力"],"a":"B","k":"B","t":"","x":"排便失禁特徵：持續排出軟便、糞便有臭味、無能力延緩排便、排便急促、無法感受直腸脹滿感、糞便沾污衣服或床墊、肛門周圍皮膚發紅等。"},{"i":"b3-15","e":"","n":0,"c":6,"s":"下列何者『不屬於』排便問題病人的護理目標？","o":["促進適當運動的習慣","維持病人皮膚的完整性","依賴瀉劑或灌腸維持每日排便","維持病人正向的身體心像"],"a":"C","k":"C","t":"","x":"護理目標：加強對正常排便的了解、維持適當液體與食物攝取、促進運動習慣、促進正常排便習慣與功能、維護舒適、維持皮膚完整性、維持正向身體心像。"},{"i":"b3-16","e":"","n":0,"c":6,"s":"無禁忌下，成人便祕病人每日液體攝取量宜為多少？","o":["500～1,000 mL","1,000～1,500 mL","2,000～2,500 mL","4,000～5,000 mL"],"a":"C","k":"C","t":"","x":"成人每日應攝取 2,000～2,500 mL 液體；梅子汁、檸檬汁、橘子汁、小紅莓汁等能刺激腸蠕動、軟便。"},{"i":"b3-17","e":"","n":0,"c":6,"s":"便祕病人的飲食指導，下列何者最適當？","o":["減少纖維攝取以降低腸道刺激，並避免蔬菜水果","多吃精緻白麵包、白米飯及起司，減少蔬菜水果","限制水分攝取以避免頻尿，並增加高蛋白食物","增加蔬菜、水果及全穀類，並可適量飲用梅子汁"],"a":"D","k":"D","t":"","x":"便祕護理：增加適量纖維、鼓勵吃蔬菜水果及全穀類，並攝取足夠水分。"},{"i":"b3-18","e":"","n":0,"c":6,"s":"腹部等長收縮運動可促進腸蠕動，但下列何者『不適合』執行？","o":["心臟病病人","骨盆腔肌肉張力不足者","久坐少動的便祕上班族","腹部無傷口的年輕便祕者"],"a":"A","k":"A","t":"","x":"充足運動：增強腹肌和骨盆腔肌肉張力，採腹部等長收縮運動促進腸蠕動；心臟病患者不能做。"},{"i":"b3-19","e":"","n":0,"c":6,"s":"為促進便祕病人順利排便，在情緒與環境方面的護理措施為何？","o":["催促病人加快排便，以縮短占用時間","在多人病室不拉圍簾，直接使用便盆","排便時護理人員持續在旁觀看情形","避免情緒緊張不安，並提供隱蔽性環境"],"a":"D","k":"D","t":"","x":"便祕護理措施第 6 項：避免情緒緊張不安並提供隱蔽性環境。"},{"i":"b3-20","e":"","n":0,"c":6,"s":"便祕護理措施中，「腸道療法」是指下列何者？","o":["採腹部等長收縮運動","以手自右向左沿結腸按摩","依醫囑使用瀉劑或灌腸","鼓勵早餐後排便"],"a":"C","k":"C","t":"","x":"便祕護理措施第 9 項「腸道療法」：依醫囑使用瀉劑或灌腸等；鼓勵早餐後排便屬「養成規律的排便習慣」，腹部等長收縮運動屬「充足的運動」，自右向左沿結腸按摩屬「適當的排便姿勢及按摩」。"},{"i":"b3-21","e":"","n":0,"c":6,"s":"下列何種排便姿勢最有利於增加腹內壓、促進排便？","o":["仰臥","右側臥","蹲姿","站姿"],"a":"C","k":"C","t":"","x":"腹肌收縮可增加腹內壓，最好的排便姿勢是蹲姿；但髖關節置換術後勿乘坐過低的椅子或蹲式馬桶。p.24、p.25"},{"i":"b3-22","e":"","n":0,"c":6,"s":"臥床便祕病人使用便盆排便時，適當的姿勢為何？","o":["採頭低腳高姿勢，利用重力促進糞便向下移動","採左側臥姿並屈曲雙膝，使腹部放鬆、減少腹內壓","平躺並將雙腿伸直，以放鬆腹部肌肉、減少腹部壓力","床頭抬高採高坐臥姿，並將身體向前傾以增加腹內壓"],"a":"D","k":"D","t":"","x":"臥床病人：床頭抬高，採高坐臥姿，並將身體向前傾以增加腹內壓。"},{"i":"b3-23","e":"","n":0,"c":6,"s":"以手按摩腹部促進排便，正確的方向為何？","o":["沿結腸解剖位置，由右向左（右下腹→右上腹→左上腹→左下腹）做機械性按摩","在肚臍周圍以逆時鐘方向輕柔畫圓按摩，不沿結腸解剖位置移動","由上往下沿腹中線做直線按壓，按壓路徑與結腸走向無關","沿結腸解剖位置，由左向右（左下腹→左上腹→右上腹→右下腹）做輕柔按摩"],"a":"A","k":"A","t":"","x":"手自右沿著結腸解剖位置向左行機械性按摩，以增加腹壓、促進排便。"},{"i":"b3-24","e":"","n":0,"c":6,"s":"施行髖關節置換術的病人如廁時，下列護理指導何者正確？","o":["雙腿交叉坐穩後，髖關節彎曲超過 90 度，並以雙手撐住膝蓋協助用力","髖關節彎曲不可超過 90 度，必要時加高便器座位高度，且身體勿前傾","鼓勵採蹲姿並身體前傾，以增加腹內壓，並盡量縮短坐在便器上的時間","降低便器座位高度以方便起身，並鼓勵身體前傾、盡量彎腰用力排便"],"a":"B","k":"B","t":"","x":"髖關節不可過度彎曲超過 90 度，避免人工髖關節脫位；必要時加高便器座位，且如廁時身體勿前傾。"},{"i":"b3-25","e":"","n":0,"c":6,"s":"便祕病人為維護肛門周圍皮膚的完整性，護理指導為何？","o":["排便後以肥皂用力搓洗肛門周圍皮膚","避免用力排便，以免肛門周圍皮膚裂傷","排便後以粗糙衛生紙反覆擦拭至乾淨","鼓勵病人持續用力，直到糞便排出為止"],"a":"B","k":"B","t":"","x":"便祕護理措施第 8 項「維護皮膚的完整性」：避免用力排便，造成肛門周圍皮膚的裂傷。"},{"i":"b3-26","e":"","n":0,"c":6,"s":"施行髖關節置換術的病人，下列姿勢或擺位何者正確？","o":["坐椅時雙膝併攏，以維持髖關節穩定","雙腿交叉，使患肢保持內收","髖關節屈曲大於 90 度，以放鬆肌肉","雙大腿間夾枕，使患肢保持外展"],"a":"D","k":"D","t":"","x":"髖關節置換術後 O：雙大腿夾枕保持患肢外展、保持雙膝分開、被子放身旁；X：髖關節屈曲勿大於 90 度、勿雙腿交叉、勿乘坐過低的椅子或蹲式馬桶。"},{"i":"b3-27","e":"","n":0,"c":6,"s":"下列何者是髖關節置換術後病人『應避免』的行為？","o":["雙大腿間夾枕保持患肢外展","坐椅時保持雙膝分開","乘坐過低的椅子或蹲式馬桶","將被子放在身體旁邊"],"a":"C","k":"C","t":"","x":"髖關節置換術後 O：雙大腿夾枕保持患肢外展、保持雙膝分開、被子放身旁；X：髖關節屈曲大於 90 度、雙腿交叉、乘坐過低的椅子或蹲式馬桶。"},{"i":"b3-28","e":"","n":0,"c":6,"s":"糞便嵌塞最主要的形成原因為何？","o":["長期腹瀉使腸黏膜受損，糞便黏附於直腸壁，逐漸乾硬而難以排出","肛門括約肌長期鬆弛，糞便無法保留，長期積在直腸內而難以排出","大量攝取膳食纖維與水分，使糞便體積過大，長期堵塞於直腸內","便祕未解除，糞便長期積在直腸內，水分被不斷吸收而堅硬難排出"],"a":"D","k":"D","t":"","x":"糞便嵌塞：因便祕未解除，糞便長期積在直腸內，水分不斷被吸收，造成糞便堅硬、難以排出。"},{"i":"b3-29","e":"","n":0,"c":6,"s":"糞便嵌塞病人可能出現的症狀為何？","o":["肛門流出少量糞水、持續性想解便、直腸疼痛與膨脹感","腹部凹陷、腸蠕動音亢進，無直腸疼痛與膨脹感","大量水瀉、腸蠕動音增快，且血壓下降","解出大量成形硬便後症狀立即緩解，無直腸脹滿感"],"a":"A","k":"A","t":"","x":"糞便嵌塞症狀：肛門流出少量糞水、持續性欲解便、直腸疼痛、膨脹感、噁心、嘔吐、血壓升高。"},{"i":"b3-30","e":"","n":0,"c":6,"s":"下列何者『不是』講義所列糞便嵌塞可能出現的症狀？","o":["血壓下降","直腸疼痛與膨脹感","噁心、嘔吐","持續性欲解便"],"a":"A","k":"A","t":"","x":"糞便嵌塞症狀：肛門流出少量糞水、持續性欲解便、直腸疼痛、膨脹感、噁心、嘔吐、血壓升高（非下降）。p.26"},{"i":"b3-31","e":"","n":0,"c":6,"s":"糞便嵌塞最有效的處理方法為何？","o":["給予大量肥皂水灌腸，使糞石軟化後自行排出，並觀察腹脹情形","以手指挖除糞便（先以含局部麻醉成分的潤滑液塗抹肛門）","口服高劑量軟便劑，並臥床休息等待糞便自行排出，同時記錄排便次數","增加膳食纖維與水分攝取，並鼓勵下床活動等待糞便自然排出"],"a":"B","k":"B","t":"","x":"以手指挖除糞便是最有效的處理方法，使用含局部麻醉成分的潤滑液塗抹肛門後再進行指挖。"},{"i":"b3-32","e":"","n":0,"c":6,"s":"護理師為病人執行指挖糞便時，病人主訴頭痛、心悸，最適當的處置為何？","o":["請病人深呼吸後繼續挖除","給予止痛藥後繼續挖除","立即停止挖除","加快動作盡速完成"],"a":"C","k":"C","t":"","x":"指挖可造成迷走神經反應徵象（頭痛、心悸等），一旦出現須立即停止挖除。"},{"i":"b3-33","e":"","n":0,"c":6,"s":"糞石阻塞於直腸時，為何不宜使用灌腸？","o":["糞石不易被溶液軟化","灌腸容易造成腸道感染","灌腸會使糞石移入結腸更深處","灌腸會使血壓急速下降"],"a":"A","k":"A","t":"","x":"糞石阻塞於直腸，因不易被溶液軟化，故不宜使用灌腸。"},{"i":"b3-34","e":"","n":0,"c":6,"s":"腹瀉病人為補充水分與電解質，每日水分補充量約為多少？","o":["500～1,000 mL","1,000～1,500 mL","1,500～2,000 mL","2,500～3,000 mL"],"a":"D","k":"D","t":"","x":"腹瀉護理：注意體液電解質平衡，補充水分 2,500～3,000 mL。"},{"i":"b3-35","e":"","n":0,"c":6,"s":"腹瀉病人的飲食護理，下列何者正確？","o":["急性期鼓勵高纖維飲食，藉此加速排出腸道內毒素","急性期立即恢復一般飲食並增加粗纖維，促進腸道功能","急性期大量飲用牛奶與乳製品，以補充營養及蛋白質","急性期應 NPO，可進食時採低渣飲食以減少腸蠕動及刺激"],"a":"D","k":"D","t":"","x":"適當飲食：急性期應 NPO（禁食），可進食時採低渣飲食，以減少腸道蠕動及刺激。"},{"i":"b3-36","e":"","n":0,"c":6,"s":"腹瀉病人肛門周圍皮膚的護理，下列何者最適當？","o":["以肥皂用力搓洗直到乾淨，再以熱風吹乾皮膚","以溫水清洗，並塗抹潤滑油或氧化鋅（ZnO）軟膏","以酒精棉片擦拭消毒，並讓皮膚長時間暴露在空氣中","局部熱敷促進循環，並塗抹含酒精的乳液"],"a":"B","k":"B","t":"","x":"皮膚護理：溫水清洗肛門及周圍皮膚，可塗以潤滑油或氧化鋅（ZnO）軟膏。"},{"i":"b3-37","e":"","n":0,"c":6,"s":"關於腹瀉病人的護理，下列何者『錯誤』？","o":["評估腹瀉原因，如抗生素、制酸劑","依醫囑給予止瀉劑及鎮靜劑","為避免刺激，應限制病人補充水分","注意活動安全，以免眩暈跌倒"],"a":"C","k":"C","t":"","x":"腹瀉時應補充水分與電解質（2,500～3,000 mL），而非限制；其餘三項為講義所列措施。"},{"i":"b3-38","e":"","n":0,"c":6,"s":"為排便失禁病人建立排便訓練，下列作法何者正確？","o":["排便時間前半小時給予止瀉劑，以避免滲便","排便時間前一小時禁止飲水，以減少糞便量","排便時間隨病人心情隨時調整，不固定時段","排便時間前半小時服用軟便劑或使用軟便栓劑"],"a":"D","k":"D","t":"","x":"排便訓練：評估正常排泄型態、了解失禁原因並訓練排便習慣時間；排便時間前半小時服用軟便劑或使用軟便栓劑；於指定時間協助如廁。"},{"i":"b3-39","e":"","n":0,"c":6,"s":"排便失禁的訓練中，為刺激腸蠕動，在排便時間前可採用何種方式？","o":["喝熱飲料或冷果汁","服用止瀉劑","禁止進食與飲水","進食精緻米飯與白麵包"],"a":"A","k":"A","t":"","x":"排便時間前喝熱飲料或冷果汁，可刺激腸蠕動。"},{"i":"b3-40","e":"","n":0,"c":6,"s":"排便失禁病人的皮膚護理原則為何？","o":["每小時以肥皂用力搓洗肛門，以保持皮膚清潔","避免更換衣物與床單，以免刺激肛門周圍皮膚","隨時保持皮膚、床單與衣服的清潔、乾燥","使用不透氣塑膠墊持續包覆，以避免床單污染"],"a":"C","k":"C","t":"","x":"滲便造成肛門外皮膚易受刺激，須隨時保持皮膚、床單衣服的清潔、乾燥。"},{"i":"b3-41","e":"","n":0,"c":6,"s":"協助排便失禁病人如廁時，設定的排便時間約多久？","o":["約 1～2 分鐘","約 5～10 分鐘","約 15～20 分鐘","約 45～60 分鐘"],"a":"C","k":"C","t":"","x":"提供隱蔽排便環境，設定排便時間約 15～20 分鐘；如廁時上身前傾、雙手向腹部施壓以刺激腸道排空。"},{"i":"b3-42","e":"","n":0,"c":6,"s":"排便失禁病人如廁時，下列何種方式可協助刺激腸道排空？","o":["身體後仰並憋氣","上身前傾，雙手向腹部施壓","平躺於床上不用力","雙腿伸直坐於低矮便盆"],"a":"B","k":"B","t":"","x":"如廁時上身前傾，雙手向腹部施壓以刺激腸道的排空。"},{"i":"b3-43","e":"","n":0,"c":6,"s":"排便失禁病人在能力範圍內，除鼓勵正常活動外，還應教導執行下列何種訓練？","o":["伐氏操作","骨盆肌肉訓練","上肢肌力訓練","膀胱訓練"],"a":"B","k":"B","t":"","x":"排便失禁護理第 (9) 項：在病人能力範圍內鼓勵正常活動，教導執行骨盆肌肉訓練。"},{"i":"b3-44","e":"","n":0,"c":6,"s":"排便失禁病人的飲食護理，下列何者正確？","o":["限制液體攝取，並採低纖維質飲食","以高油脂、高蛋白食物取代蔬果","提供適量的液體及含纖維質的飲食","以流質飲食為主，並避免蔬菜水果"],"a":"C","k":"C","t":"","x":"排便失禁護理第 (8) 項：提供適量的液體和含纖維質的飲食。"},{"i":"b4-1","e":"","n":0,"c":6,"s":"Dulcolax 栓劑促進排便的作用方式為何？","o":["直接刺激直腸末梢，引發腸蠕動","藉滲透作用使腸道膨脹","潤滑腸壁並軟化糞便","增加糞便體積與水分"],"a":"A","k":"A","t":"","x":"Dulcolax 為臨床常用栓劑，作用方式是直接刺激直腸末梢，並引發腸蠕動，促進排便。"},{"i":"b4-2","e":"","n":0,"c":6,"s":"灌腸是藉何種作用使腸道膨脹並刺激黏膜壁，以清洗下腸道或供給藥物？","o":["主動運輸","擴散作用","過濾作用","滲透作用"],"a":"D","k":"D","t":"","x":"灌腸（Enema）定義：藉滲透作用使腸道膨脹及刺激黏膜壁，以清洗下腸道或供給藥物。"},{"i":"b4-3","e":"","n":0,"c":6,"s":"下列何者『不是』灌腸的目的？","o":["止瀉","協助診斷，如鋇劑灌腸","給藥","清潔腸道、協助排便"],"a":"A","k":"A","t":"","x":"灌腸目的：①清潔腸道、協助排便；②給藥；③協助診斷（如鋇劑灌腸）。"},{"i":"b4-4","e":"","n":0,"c":6,"s":"成人大量灌腸的溶液灌入量約為多少？","o":["150～250 mL","300～500 mL","500～750 mL","750～1,000 mL"],"a":"D","k":"D","t":"","x":"大量灌腸灌入量：嬰兒 150～250 mL（一般 60～120 mL）、幼兒及學齡前期 250～350 mL、學齡期 300～500mL、青少年 500～750 mL、成人 750～1,000 mL。"},{"i":"b4-5","e":"","n":0,"c":6,"s":"學齡期兒童大量灌腸的灌入量約為多少？","o":["150～250 mL","300～500 mL","500～750 mL","750～1,000 mL"],"a":"B","k":"B","t":"","x":"學齡期兒童大量灌腸灌入量為 300～500 mL。"},{"i":"b4-6","e":"","n":0,"c":6,"s":"下列各年齡層大量灌腸灌入量的配對，何者正確？","o":["幼兒 500～750 mL；學齡期 250～350 mL","青少年 750～1,000 mL；成人 1,500～2,000 mL","幼兒及學齡前期 250～350 mL；青少年 500～750 mL","嬰兒 300～500 mL；成人 500～750 mL"],"a":"C","k":"C","t":"","x":"嬰兒 150～250 mL、幼兒及學齡前期 250～350 mL、學齡期 300～500 mL、青少年 500～750 mL、成人 750～1,000 mL。"},{"i":"b4-7","e":"","n":0,"c":6,"s":"下列何者屬於「大量灌腸」？","o":["油灌腸","興奮劑灌腸","安撫灌腸","肥皂水灌腸"],"a":"D","k":"D","t":"","x":"大量灌腸：肥皂水灌腸、生理食鹽水灌腸、清潔灌腸等（p.32）；小量灌腸：油灌腸、安撫灌腸、興奮劑灌腸等，灌入量不超過 240 mL（p.33）。"},{"i":"b4-8","e":"","n":0,"c":6,"s":"小量灌腸的灌入液體量不宜超過多少？","o":["120 mL","240 mL","500 mL","750 mL"],"a":"B","k":"B","t":"","x":"小量灌腸灌入液體量不超過 240 mL。"},{"i":"b4-9","e":"","n":0,"c":6,"s":"非保留灌腸的溶液，通常在直腸或結腸內保留多久即排出？","o":["1～2 分鐘","5～10 分鐘","15～30 分鐘","60 分鐘以上"],"a":"B","k":"B","t":"","x":"非保留灌腸：灌入大量溶液，僅在直腸或結腸保留 5～10 分鐘即排出，如肥皂水或生理食鹽水。"},{"i":"b4-10","e":"","n":0,"c":6,"s":"下列何者屬於非保留灌腸的用途？","o":["解除便祕、排氣，或腸道檢查與治療前的清潔","在腸道內保留 15～30 分鐘以吸收藥物","給予麻醉劑或鎮靜劑","由直腸供給水分或藥物"],"a":"A","k":"A","t":"","x":"非保留灌腸常用於解除便祕、排氣、腸道檢查或治療前之清潔法，協助寄生蟲之排出等。"},{"i":"b4-11","e":"","n":0,"c":6,"s":"保留灌腸的溶液量限制為多少，以免大腸膨脹而產生便意？","o":["30～60 mL","90～180 mL","240～360 mL","500～1,000 mL"],"a":"B","k":"B","t":"","x":"保留灌腸溶液量限制 90～180 mL，使大腸不致膨脹產生便意，流速需相當慢。"},{"i":"b4-12","e":"","n":0,"c":6,"s":"保留灌腸的溶液需在腸道內保留多久？","o":["5～10 分鐘","15～30 分鐘","60～90 分鐘","2～4 小時"],"a":"B","k":"B","t":"","x":"保留灌腸需於腸道內保留 15～30 分鐘。"},{"i":"b4-13","e":"","n":0,"c":6,"s":"保留灌腸限制溶液量為 90～180 mL，並需緩慢灌入，主要目的為何？","o":["避免溶液被腸黏膜吸收過快，造成中毒反應","減少腸道細菌繁殖，並降低直腸黏膜受損機會","避免大腸膨脹而產生便意，使溶液得以保留","避免灌腸筒內壓力過高，使肛管被擠出肛門"],"a":"C","k":"C","t":"","x":"保留灌腸限制溶液量並緩慢灌入，使大腸不致膨脹產生便意，才能順利保留。"},{"i":"b4-14","e":"","n":0,"c":6,"s":"保留灌腸最常使用的溶液為何？","o":["清水","肥皂水","50% 硫酸鎂","生理食鹽水"],"a":"D","k":"D","t":"","x":"保留灌腸是由直腸供給水分或藥物的方法之一，生理食鹽水為最常用的溶液。"},{"i":"b4-15","e":"","n":0,"c":6,"s":"病人需經肛門給予麻醉劑或鎮靜劑，護理師應如何準備？","o":["給藥前 1 小時先做清潔灌腸，以清潔腸道","給藥前 30 分鐘先做保留灌腸，以清潔腸道","給藥前 1 小時先口服瀉劑，以清潔腸道","給藥前一天開始禁食並限制飲水，以清潔腸道"],"a":"A","k":"A","t":"","x":"麻醉劑及鎮靜劑等藥物需在肛門給藥前 1 小時，先做清潔灌腸，以清潔腸道。"},{"i":"b4-16","e":"","n":0,"c":6,"s":"清潔灌腸常用的肥皂水（S. S. enema）濃度為何？","o":["0.02%","0.2%","2%","10%"],"a":"B","k":"B","t":"","x":"清潔灌腸常用 0.2% 肥皂水；常用配法：取 2% 肥皂凍 100 mL 或 10% 肥皂凍 20 mL，加溫水至 1,000 mL。p.36"},{"i":"b4-17","e":"","n":0,"c":6,"s":"肥皂水灌腸中，肥皂的主要作用為何？","o":["殺滅腸道內細菌，避免術後感染","提高溶液滲透壓，將組織液吸出至腸道稀釋糞便","減低水的表面張力，使糞便迅速與水結合而軟化","吸附糞便中的毒素，並使腸黏膜收縮止血"],"a":"C","k":"C","t":"","x":"肥皂可減低水之表面張力，使糞便可迅速與水結合而軟化。"},{"i":"b4-18","e":"","n":0,"c":6,"s":"護理師需配製 1,000 mL、0.2% 的肥皂水灌腸液，現有濃度 10% 的肥皂凍，應取多少 mL？","o":["2 mL","20 mL","100 mL","200 mL"],"a":"B","k":"B","t":"","x":"1,000 mL × 0.2% ＝ 2 g 肥皂；2 g ÷ 10% ＝ 20 mL 肥皂凍，再加溫水至 1,000 mL。"},{"i":"b4-19","e":"","n":0,"c":6,"s":"欲配製 1,000 mL、0.2% 的肥皂水灌腸液，若使用濃度 2% 的肥皂凍，應取多少 mL？","o":["10 mL","20 mL","100 mL","200 mL"],"a":"C","k":"C","t":"","x":"所需肥皂 2 g ÷ 2% ＝ 100 mL，與講義「2% 肥皂凍 100 c.c.」相符。"},{"i":"b4-20","e":"","n":0,"c":6,"s":"醫囑要求配製 500 mL、0.2% 的肥皂水，使用 10% 肥皂凍，應取多少 mL？","o":["5 mL","10 mL","20 mL","50 mL"],"a":"B","k":"B","t":"","x":"500 mL × 0.2% ＝ 1 g 肥皂；1 g ÷ 10% ＝ 10 mL 肥皂凍，再加溫水至 500 mL。"},{"i":"b4-21","e":"","n":0,"c":6,"s":"配製肥皂水灌腸液時，為避免泡沫產生，正確作法為何？","o":["先加肥皂凍，再快速倒入冰水","先加肥皂凍，再加入熱水並用力攪拌","加入少量酒精以消除泡沫","先加清水，再加入肥皂凍"],"a":"D","k":"D","t":"","x":"備註：先加清水再加肥皂凍，避免泡沫產生。"},{"i":"b4-22","e":"","n":0,"c":6,"s":"下列何種灌腸溶液對血液而言為等張溶液、不會產生刺激，是最常用的灌腸液？","o":["生理食鹽水","0.2% 肥皂水","50% 硫酸鎂","清水"],"a":"A","k":"A","t":"","x":"生理食鹽水（N. S. enema）對血液而言是等張溶液，不會產生刺激，是最常用的灌腸液。"},{"i":"b4-23","e":"","n":0,"c":6,"s":"大量灌入清水（plain water）灌腸，可能造成什麼危險？","o":["腸黏膜脫水乾裂，造成肛門括約肌鬆弛無力","水分被腸壁排斥而無法保留，造成腸道過度膨脹破裂","水分迅速進入血管稀釋血液，造成體液與電解質不平衡","血液被濃縮並造成高血鈉，導致細胞脫水"],"a":"C","k":"C","t":"","x":"清水為低張溶液，大量灌入後會迅速進入血管而稀釋血液，造成體液與電解質的不平衡，使用不慎可能招致危險。"},{"i":"b4-24","e":"","n":0,"c":6,"s":"下列何者為清潔灌腸的目的？","o":["止血並使腸組織收縮，協助檢查出血現象，適用於腸道黏膜出血者","潤滑並保護腸黏膜，減輕局部刺激，適用於腸黏膜發炎或潰瘍者","提供葡萄糖、蛋白質等營養，使其由直腸黏膜緩慢吸收，以維持能量","軟化糞便並刺激腸道，或於下腸道檢查、灌入顯影劑及手術前清潔腸道"],"a":"D","k":"D","t":"","x":"清潔灌腸目的：軟化糞便並刺激腸道以解除便祕；下腸道檢查（乙狀結腸鏡、直腸或經腸攝影灌入顯影劑前）或手術前之腸道清潔；協助排除寄生蟲。"},{"i":"b5-1","e":"","n":0,"c":6,"s":"下列灌腸溶液與其張力的配對，何者正確？","o":["生理食鹽水：低張；清水：高張；50% 硫酸鎂：等張","生理食鹽水：等張；清水：低張；50% 硫酸鎂：高張","生理食鹽水：等張；清水：高張；50% 硫酸鎂：低張","生理食鹽水：高張；清水：等張；50% 硫酸鎂：低張"],"a":"B","k":"B","t":"","x":"生理食鹽水對血液而言是等張溶液；清水為低張溶液，大量灌入後會迅速進入血管而稀釋血液；50% 硫酸鎂為高張溶液，能把組織液吸出至腸道、稀釋糞便。"},{"i":"b5-2","e":"","n":0,"c":6,"s":"下列何種病人屬於灌腸的禁忌症？","o":["預定接受乙狀結腸鏡檢查的病人","手術前需要清潔腸道的病人","經檢查確認腸內有寄生蟲的病人","有疼痛性嚴重痔瘡的病人"],"a":"D","k":"D","t":"","x":"灌腸禁忌症：不明原因的腹痛、疼痛性的嚴重痔瘡、產科安胎者、直腸狹窄或潰瘍、急性闌尾炎、顱內壓升高（IICP）病人（不宜大量灌腸）；乙狀結腸鏡等下腸道檢查前、手術前的腸道清潔及協助排除寄生蟲，則是清潔灌腸的目的。"},{"i":"b5-3","e":"","n":0,"c":6,"s":"驅蟲灌腸（anthelmintic enema）常用的溶液為何？","o":["澱粉溶液（starch）","50% 硫酸鎂溶液","明礬溶液（alum solution）","苦木液（quassia）"],"a":"D","k":"D","t":"","x":"驅蟲灌腸：苦木液 15 g 加水至 200～250 mL，目的為排出寄生蟲。"},{"i":"b5-4","e":"","n":0,"c":6,"s":"驅蟲灌腸的溶液需停留 15～30 分鐘後排出，之後護理師應特別注意什麼？","o":["協助病人平躺 1 小時，使藥效持續作用","詳細檢查糞便（是否有排出蟲體）","立即再灌入清水沖洗，並將排出物倒棄","立即給予止瀉劑，並限制水分攝取"],"a":"B","k":"B","t":"","x":"驅蟲灌腸停留 15～30 分鐘後排出，需詳細檢查糞便；溶液產生局部作用。"},{"i":"b5-5","e":"","n":0,"c":6,"s":"收斂灌腸（astringent enema）的目的與常用溶液，下列何者正確？","o":["潤滑並保護腸黏膜、減輕局部刺激；常用澱粉溶液","排出寄生蟲、需詳細檢查糞便；常用苦木液","排氣、減輕腹脹、稀釋糞便；常用 50% 硫酸鎂","止血、協助檢查出血現象、使腸組織收縮；常用明礬水或冰水"],"a":"D","k":"D","t":"","x":"收斂灌腸：止血、協助檢查出血現象、使腸組織收縮；明礬水（solution of alum）200～300 mL 或冰水 200～300 mL。"},{"i":"b5-6","e":"","n":0,"c":6,"s":"收斂灌腸的灌入速度與保留時間，下列何者正確？","o":["緩慢灌入，需保留 15～30 分鐘","灌入速度需緩慢，不必保留，可立即排出","快速灌入，需保留 30 分鐘","快速灌入並立即排出"],"a":"B","k":"B","t":"","x":"收斂灌腸灌入速度需緩慢，不必保留，可立即排出，產生局部作用。"},{"i":"b5-7","e":"","n":0,"c":6,"s":"安撫灌腸（emollient enema）的常用溶液為何？","o":["澱粉溶液","硫酸鋇","明礬水","苦木液"],"a":"A","k":"A","t":"","x":"安撫灌腸具潤滑作用，可保護腸黏膜、減輕局部刺激；澱粉 4 g 加冷水 60 mL 混合均勻後，再加開水至 180mL。"},{"i":"b5-8","e":"","n":0,"c":6,"s":"依講義 p.37，甘油灌腸（glycerine enema）中，甘油與清水的比例為何？","o":["1：1","1：5","1：10","5：1"],"a":"A","k":"A","t":"","x":"甘油灌腸：甘油與清水比例 1：1，溶液量約 90～180 mL（p.37）。p.40 小量灌腸表另列「1：1 或 1：2」，兩處寫法略有不同，本題以"},{"i":"b5-9","e":"","n":0,"c":6,"s":"下列哪一類病人較適合以甘油灌腸軟化糞便，使其易於排出？","o":["急性闌尾炎病人","準備接受鋇劑攝影的病人","疑似消化道出血病人","直腸手術或會陰手術後的病人"],"a":"D","k":"D","t":"","x":"甘油灌腸用於直腸手術、會陰手術後，軟化糞便、易於排出。"},{"i":"b5-10","e":"","n":0,"c":6,"s":"依講義 p.37 備註，油類灌腸的溶液溫度，下列何者正確？","o":["需加溫至 48～52°C","不需加溫，溫度不可太高","需加溫至 44～46°C","應使用冰水，以刺激腸蠕動"],"a":"B","k":"B","t":"","x":"油類灌腸溫度不可太高，不需加溫（p.37 甘油灌腸備註）。p.40 小量灌腸表的溫度欄寫「同上」，講義略有出入，本題以"},{"i":"b5-11","e":"","n":0,"c":6,"s":"下列灌腸種類與其目的的配對，何者正確？","o":["驅風灌腸：協助排氣、減輕腹脹","安撫灌腸：止血並使腸組織收縮","收斂灌腸：排出寄生蟲、詳細檢查糞便","驅蟲灌腸：潤滑並保護腸黏膜"],"a":"A","k":"A","t":"","x":"驅風灌腸的目的為排氣、減輕腹脹；收斂灌腸為止血、協助檢查出血現象、使腸組織收縮；驅蟲灌腸為排出寄生蟲；安撫灌腸具潤滑作用、可保護腸黏膜、減輕局部刺激。"},{"i":"b5-12","e":"","n":0,"c":6,"s":"驅蟲灌腸的溶液配製，下列何者正確？","o":["澱粉 15 g 加水至 750～1,000 mL","苦木液 15 g 加水至 200～250 mL","明礬 15 g 加水至 500～750 mL","苦木液 4 g 加水至 60～180 mL"],"a":"B","k":"B","t":"","x":"驅蟲灌腸：苦木液（quassia）15 g 加水至 200～250 mL，目的為排出寄生蟲；停留 15～30 分鐘後排出，需詳細檢查糞便。"},{"i":"b5-13","e":"","n":0,"c":6,"s":"安撫灌腸的澱粉溶液，配製方式為何？","o":["澱粉 15 g 加冷水 60 mL 混合均勻後，再加開水至 250 mL","澱粉 4 g 加開水 60 mL 混合均勻後，再加冷水至 180 mL","澱粉 4 g 加冷水 60 mL 混合均勻後，再加開水至 180 mL","澱粉 4 g 加冷水 180 mL 混合均勻後，再加開水至 240 mL"],"a":"C","k":"C","t":"","x":"安撫灌腸（emollient enema）：澱粉 4 g 加冷水 60 mL，混合均勻後再加入開水至 180 mL；具潤滑作用，可保護腸黏膜、減輕局部刺激。"},{"i":"b5-14","e":"","n":0,"c":6,"s":"收斂灌腸使用冰水時，下列敘述何者正確？","o":["溫度低於體溫，以病人能接受為依據；灌入速度緩慢，不必保留，可立即排出","溫度與體溫相同（約 37°C）；灌入速度緩慢，灌入後保留 5～10 分鐘","溫度低於體溫，以病人能接受為依據；灌入後保留 15～30 分鐘，使腸組織充分收縮","溫度為 41～43°C，與大量灌腸相同；灌入後立即排出"],"a":"A","k":"A","t":"","x":"收斂灌腸可用明礬水或冰水（各 200～300 mL）；冰水溫度低於體溫，以病人能接受之溫度為依據，灌入速度需緩慢、不必保留，可立即排出。"},{"i":"b5-15","e":"","n":0,"c":6,"s":"甘油灌腸的溶液量與保留時間，下列何者正確？","o":["500～1,500 mL；保留 5～10 分鐘","750～1,000 mL；保留 15～30 分鐘","90～180 mL；保留 5～10 分鐘","90～180 mL；保留 60 分鐘以上"],"a":"C","k":"C","t":"","x":"甘油灌腸：甘油與清水的比例為 1：1（p.40 表另列 1：1 或 1：2），溶液量約 90～180 mL，保留 5～10 分鐘，目的為軟化糞便、易於排出。"},{"i":"b5-16","e":"","n":0,"c":6,"s":"驅風灌腸「1-2-3 enema（M. G. W. enema）」的組成為何？","o":["50% 硫酸鎂 30 mL、甘油 60 mL、清水 90 mL","50% 硫酸鎂 90 mL、甘油 60 mL、清水 30 mL","50% 硫酸鎂 60 mL、甘油 30 mL、清水 90 mL","10% 硫酸鎂 30 mL、甘油 60 mL、清水 90 mL"],"a":"A","k":"A","t":"","x":"1-2-3 的口訣即硫酸鎂（M）：甘油（G）：清水（W）＝ 30：60：90 mL（1：2：3）。"},{"i":"b5-17","e":"","n":0,"c":6,"s":"「1-2-3-4 enema」比「1-2-3 enema」多加入的成分為何？","o":["苦木液（quassia）15 g 加水至 200～250 mL","澱粉（starch）4 g 加冷水 60 mL","明礬水（alum solution）200～300 mL","松節油（turpentine oil）8 mL"],"a":"D","k":"D","t":"","x":"1-2-3-4 enema：50% 硫酸鎂 30 mL、甘油 60 mL、清水 90 mL、松節油 8 mL 之混合液。"},{"i":"b5-18","e":"","n":0,"c":6,"s":"50% 硫酸鎂灌腸液的溶液性質與作用，下列何者正確？","o":["為低張溶液，水分會迅速進入血管並造成水中毒","為高張溶液，能把組織液吸出至腸道，稀釋糞便","為高張溶液，可使腸組織收縮、減少出血並收斂黏膜","為等張溶液，水分不會移動，也不會產生刺激"],"a":"B","k":"B","t":"","x":"50% 硫酸鎂為高張溶液，能把組織液吸出至腸道，稀釋糞便，達到排氣、減輕腹脹的效果。"},{"i":"b5-19","e":"","n":0,"c":6,"s":"驅風灌腸溶液中加入甘油的作用為何？","o":["易附著在腸黏膜，較水分停留在腸內時間長，可促進排泄","使溶液快速被腸黏膜吸收，使腸內殘留的水分減少而變乾硬","直接殺滅腸內產氣的細菌，使氣體產生減少而減輕腹脹","吸附腸內氣體，使氣體隨糞便一併排出，並減輕腹部脹氣"],"a":"A","k":"A","t":"","x":"甘油易附著在腸黏膜，較水分停留在腸內時間長，可促進排泄。"},{"i":"b5-20","e":"","n":0,"c":6,"s":"鋇劑灌腸（診斷性灌腸）所使用的顯影劑為何？","o":["硫酸鈣（calcium sulfate）","硫酸鎂（magnesium sulfate）","硫酸亞鐵（ferrous sulfate）","硫酸鋇（barium sulfate）"],"a":"D","k":"D","t":"","x":"診斷性灌腸藉 X 光攝影使直腸、結腸顯影；硫酸鋇 X 光無法穿透，可與空氣對比觀看腸形狀，不被黏膜吸收，可自肛門排出。"},{"i":"b5-21","e":"","n":0,"c":6,"s":"診斷性灌腸（鋇劑灌腸）的灌入量約為多少？","o":["50～150 mL","240～360 mL","500～1,500 mL","3,000～5,000 mL"],"a":"C","k":"C","t":"","x":"診斷性灌腸：硫酸鋇灌入量為 500～1,500 mL。"},{"i":"b5-22","e":"","n":0,"c":6,"s":"病人預定接受鋇劑灌腸檢查，護理師應如何準備？","o":["檢查前三天給予高纖維飲食，檢查當日再口服一次瀉劑","檢查前一晚依處方給予瀉劑，檢查當日先做清潔灌腸","檢查前一晚以大量肥皂水灌腸，並禁水三天","檢查前一晚禁食，檢查當日灌入鋇劑後攝影"],"a":"B","k":"B","t":"","x":"診斷性灌腸備註：檢查前一晚依處方給予瀉劑，檢查當日需做清潔灌腸。"},{"i":"b5-23","e":"","n":0,"c":6,"s":"硫酸鋇適合作為診斷性灌腸的顯影劑，主要是具備下列何項特性？","o":["X 光可以穿透，且不被腸黏膜吸收、可自肛門排出","X 光可以穿透，但會被腸黏膜吸收後由腎臟排出","X 光無法穿透，但會被腸黏膜吸收後由腎臟排出","X 光無法穿透，且不被腸黏膜吸收、可自肛門排出"],"a":"D","k":"D","t":"","x":"硫酸鋇 X 光無法穿透，可與空氣對比觀看胃腸形狀；不被黏膜吸收，可自肛門排出，對腸胃系統不具副作用。p.38"},{"i":"b5-24","e":"","n":0,"c":6,"s":"驅風灌腸「1-2-3 enema」又稱 M. G. W. enema，其中 M、G、W 分別代表下列何者？","o":["硫酸鎂（MgSO4）、甘油（glycerine）、清水（water）","硫酸鎂（MgSO4）、甘油（glycerine）、松節油（turpentine oil）","苦木液（quassia）、甘油（glycerine）、清水（water）","硫酸鎂（MgSO4）、葡萄糖（glucose）、清水（water）"],"a":"A","k":"A","t":"","x":"1-2-3 enema（M. G. W. enema）：50% 硫酸鎂（MgSO4）30 mL、甘油（glycerine）60 mL、清水 90 mL 之混合液；松節油 8 mL 為 1-2-3-4 enema 另加的成分。"},{"i":"b5-25","e":"","n":0,"c":6,"s":"大量清潔灌腸的溶液溫度宜為何？","o":["20～25°C","30～35°C","41～43°C","48～52°C"],"a":"C","k":"C","t":"","x":"大量灌腸（清潔灌腸）溶液溫度 41～43°C（105～110°F）。"},{"i":"b5-26","e":"","n":0,"c":6,"s":"灌腸溶液溫度過高，可能造成什麼後果？","o":["肛門肌肉痙攣性收縮，使溶液無法灌入，並造成肛門周圍劇烈疼痛及腹脹","腸蠕動停止，造成腸阻塞及腹部劇烈絞痛，並使體溫明顯下降","腸道與腹腔血管收縮，導致血壓急速升高、頭痛、心跳變慢及臉部潮紅","腸道與腹腔血管擴張，導致腦與心臟血液供應不足而昏厥，並損傷腸黏膜"],"a":"D","k":"D","t":"","x":"液溫過高：腸道與腹腔內血管擴張，導致腦部與心臟血液供應不足而引起昏厥，同時亦會損傷腸黏膜。"},{"i":"b5-27","e":"","n":0,"c":6,"s":"灌腸溶液溫度過低，最可能造成什麼問題？","o":["腸黏膜灼傷","肛門肌肉痙攣性收縮","昏厥","腸道血管擴張"],"a":"B","k":"B","t":"","x":"液溫過低：使肛門肌肉痙攣性收縮。"},{"i":"b5-28","e":"","n":0,"c":6,"s":"依講義 p.39「灌腸的種類」表，驅風灌腸的溶液溫度與保留時間，下列何者正確？","o":["48～52°C；保留 15～30 分鐘","冰水（低於體溫）；保留 5～10 分鐘","41～43°C（105～110°F）；保留 5～10 分鐘","37.8～40.6°C；保留 15～30 分鐘"],"a":"D","k":"D","t":"","x":"灌腸的種類表：驅蟲灌腸與驅風灌腸的溶液溫度均為 37.8～40.6°C、保留 15～30 分鐘（驅風灌腸灌入量 60～180 mL）；41～43°C、5～10 分鐘則為大量（清潔）灌腸。p.104 將小量灌腸溫度寫成 37.8～41°C，講義兩處略有出入，本題以"},{"i":"b5-29","e":"","n":0,"c":6,"s":"意福（Fleet）灌腸的溶液特性與成人灌入量，下列何者正確？","o":["高張溶液，成人約 1,000 mL","低張溶液，成人約 500 mL","高張溶液，成人約 120 mL","等張溶液，成人約 750 mL"],"a":"C","k":"C","t":"","x":"意福灌腸液為高張溶液，可軟化糞便、利腸道內容物排空；室溫、保留 15～30 分鐘，成人 120 mL、孩童 60mL。"},{"i":"b5-30","e":"","n":0,"c":6,"s":"下列何種灌腸現今已較少採用？","o":["營養灌腸、鎮靜灌腸與興奮灌腸","清水灌腸與生理食鹽水灌腸","診斷性（鋇劑）灌腸與清潔灌腸","甘油灌腸與肥皂水灌腸"],"a":"A","k":"A","t":"","x":"講義註：營養、鎮靜及興奮灌腸現今已較少採用。"},{"i":"b5-31","e":"","n":0,"c":6,"s":"意福（Fleet）灌腸的溶液溫度與保留時間，下列何者正確？","o":["37.8～40.6°C；保留 15～30 分鐘","41～43°C；保留 5～10 分鐘","室溫；保留 15～30 分鐘","冰水；灌入後立即排出"],"a":"C","k":"C","t":"","x":"意福灌腸液為高張溶液，可軟化糞便、利腸道內容物排空；溫度為室溫、保留 15～30 分鐘，成人 120 mL、孩童60 mL。"},{"i":"b5-32","e":"","n":0,"c":6,"s":"下列灌腸種類與常用溶液的配對，何者正確？","o":["鎮靜灌腸：氯醛、溴化鈉、副醛","營養灌腸：咖啡、白蘭地、生理食鹽水","興奮灌腸：葡萄糖、蛋白質、鹽類","興奮灌腸：氯醛、溴化鈉、副醛"],"a":"A","k":"A","t":"","x":"營養灌腸：葡萄糖、蛋白質、鹽類（提供營養）；鎮靜灌腸：氯醛、溴化鈉、副醛（鎮靜作用、促進睡眠）；興奮灌腸：咖啡、白蘭地、生理食鹽水（興奮作用）；三者現今已較少採用。"},{"i":"b5-33","e":"","n":0,"c":6,"s":"執行大量灌腸時，病人的適當擺位與原因為何？","o":["仰臥雙腿伸直；因便於觀察腹部及肛門周圍情形","半坐臥；因可利用重力使溶液直接流入橫結腸","左側臥；因降結腸在左側腹，可利用重力使溶液流入","右側臥；因升結腸在右側腹，可利用重力使溶液流入"],"a":"C","k":"C","t":"","x":"擺位：應採左側臥姿，因降結腸在左側腹（因地心引力的作用）。"},{"i":"b5-34","e":"","n":0,"c":6,"s":"病人因髖關節受傷或腸阻塞而無法採左側臥姿，灌腸時可採何種姿勢？","o":["俯臥並墊高臀部，或屈膝仰臥","採半坐臥姿並將雙腿伸直","坐於便盆上並身體向後傾","採站立彎腰姿勢並扶住床欄"],"a":"A","k":"A","t":"","x":"無法採左側臥姿時，可以俯臥並墊高臀部，或屈膝仰臥姿（髖關節受傷或腸阻塞）。"},{"i":"b5-35","e":"","n":0,"c":6,"s":"灌腸過程中，協助病人放鬆的方法，下列何者正確？","o":["請病人繃緊腹部肌肉並用力憋住，以避免溶液流出而弄髒床單","請病人閉口憋氣並用力收縮肛門括約肌，以減輕腹部不適感","加快灌入速度以縮短不適時間，並請病人保持安靜、不要說話","請病人深呼吸、微張口、說「啊」，或與病人交談以轉移注意力"],"a":"D","k":"D","t":"","x":"灌腸時請病人深呼吸、微張口、說「啊」，或與病人交談，轉移病人的注意力，幫助病人放鬆。"},{"i":"b5-36","e":"","n":0,"c":6,"s":"成人大量灌腸時，灌腸筒液面至肛門的垂直距離應為多少？","o":["15～20 公分","30～40 公分","45～60 公分","75～90 公分"],"a":"C","k":"C","t":"","x":"灌腸壓力＝灌腸筒液面至肛門之垂直距離：大量灌腸成人 45～60 公分（18～24 吋）、兒童 37.5～45 公分；小量灌腸 15～20 公分。"},{"i":"b5-37","e":"","n":0,"c":6,"s":"小量灌腸時，灌腸筒液面至肛門的垂直距離約為多少？","o":["15～20 公分","30～40 公分","45～60 公分","75～90 公分"],"a":"A","k":"A","t":"","x":"小量灌腸的灌腸壓力為 15～20 公分（6～8 吋）。"},{"i":"b5-38","e":"","n":0,"c":6,"s":"下列肛管插入深度與對象的配對，何者正確？","o":["成人 15～20 公分；兒童 10～15 公分；嬰兒 5～7.5 公分","成人 7.5～10 公分；兒童 5～7.5 公分；嬰兒 2.5～3.75 公分","成人 2.5～3.75 公分；兒童 5～7.5 公分；嬰兒 7.5～10 公分","成人 5～7.5 公分；兒童 7.5～10 公分；嬰兒 2.5～3.75 公分"],"a":"B","k":"B","t":"","x":"肛管插入深度：成人約 7.5～10 公分（3～4 吋）、兒童約 5～7.5 公分（2～3 吋）、嬰兒約 2.5～3.75 公分（1～1.5 吋）。"},{"i":"b5-39","e":"","n":0,"c":6,"s":"兒童執行大量灌腸時，灌腸壓力（灌腸筒液面至肛門之垂直距離）約為多少？","o":["15～20 公分","22.5～30 公分","37.5～45 公分","45～60 公分"],"a":"C","k":"C","t":"","x":"灌腸壓力＝灌腸筒液面至肛門之垂直距離：大量灌腸兒童 37.5～45 公分（15～18 吋）、成人 45～60 公分（18～24 吋）；小量灌腸 15～20 公分（6～8 吋）。"},{"i":"b5-40","e":"","n":0,"c":6,"s":"下列肛管尺寸與對象的配對，何者正確？","o":["成人 14～18 Fr.；兒童 22～24 Fr.；嬰兒 10 Fr.","成人 16～18 Fr.；兒童 8～10 Fr.；嬰兒 22～24 Fr.","成人 22～24 Fr.；兒童 14～18 Fr.；嬰兒 10 Fr.","成人 10 Fr.；兒童 14～18 Fr.；嬰兒 22～24 Fr."],"a":"C","k":"C","t":"","x":"選擇肛管：成人 22～24 Fr.（依體型調整）、兒童 14～18 Fr.、嬰兒 10 Fr.。"},{"i":"b5-41","e":"","n":0,"c":6,"s":"下列何者『不是』灌腸的禁忌症？","o":["單純習慣性便祕、無合併症","直腸狹窄或潰瘍的病人","急性闌尾炎發作中的病人","不明原因腹痛且未診斷者"],"a":"A","k":"A","t":"","x":"灌腸禁忌症：不明原因腹痛、疼痛性嚴重痔瘡、產科安胎者、直腸狹窄或潰瘍、急性闌尾炎、顱內壓升高病人（不宜大量灌腸）。"},{"i":"b5-42","e":"","n":0,"c":6,"s":"顱內壓升高（IICP）病人發生便祕時，灌腸的處理原則為何？","o":["立即給予大量肥皂水灌腸，使糞便盡快排出","暫不處理，等待病人自行排便，不使用甘油球灌腸","給予大量生理食鹽水灌腸，以稀釋並軟化糞便","適時給予甘油球灌腸，但不宜執行大量灌腸"],"a":"D","k":"D","t":"","x":"IICP 病人適時給予甘油球灌腸，防因便祕造成顱內壓升高，但不宜執行大量灌腸。"},{"i":"b5-43","e":"","n":0,"c":6,"s":"一位妊娠 30 週、有早產跡象而需安胎的孕婦出現便祕，關於灌腸的處置，下列何者最適當？","o":["先給予清水灌腸後臥床休息，並觀察胎心音","灌腸屬於安胎者的禁忌，應改採其他方式並報告醫師","立即給予大量肥皂水灌腸解除便祕，再觀察子宮收縮","減慢灌入速度並降低灌腸筒高度後，即可安全執行灌腸"],"a":"B","k":"B","t":"","x":"產科安胎者為灌腸禁忌症之一。"},{"i":"b5-44","e":"","n":0,"c":6,"s":"依「各種灌腸、灌洗法比較表」，下列何者正確？","o":["結腸灌洗溶液溫度 37.8～41°C，每次灌入 30～50 mL","連續性膀胱灌洗每次灌入不超過 500 mL","結腸灌洗溶液溫度 41～43°C，每次灌入 500 mL","小量灌腸液面至肛門 45～60 公分"],"a":"C","k":"C","t":"","x":"結腸灌洗：45～60 公分、41～43°C、4,000～40,000 mL、每次 500 mL；小量灌腸：15～20 公分、37.8～41°C、不超過 240 mL；連續性膀胱灌洗：液面至膀胱 75～90 公分、每次不超過 300 mL。"},{"i":"b5-45","e":"","n":0,"c":6,"s":"依「各種灌腸、灌洗法比較表」，結腸灌洗的溶液總量與每次灌入量，下列何者正確？","o":["總量 1,000～5,000 mL；每次灌入不超過 300 mL","總量 4,000～40,000 mL；每次灌入 500 mL","總量 4,000～40,000 mL；每次灌入 30～50 mL","總量 1,000～5,000 mL；每次灌入 500 mL"],"a":"B","k":"B","t":"","x":"結腸灌洗：液面至肛門 45～60 公分、41～43°C、總量 4,000～40,000 mL、每次灌入 500 mL；總量 1,000～5,000 mL、每次不超過 300 mL 為連續性膀胱灌洗；每次 30～50 mL 為簡易膀胱灌洗。"},{"i":"b6-1","e":"","n":0,"c":6,"s":"下列何者『不是』講義所列排便（腸道排泄）護理評值的項目？","o":["病人維持正向的身體心像","病人培養出適當的運動習慣","病人皮膚維持完整性","病人維持理想的體重"],"a":"D","k":"D","t":"","x":"護理評值共 8 項：了解正常的排便；維持適當的液體和食物攝取；培養出適當的運動習慣；維持正常的排便習慣；維持正常的排便功能；維持病人的舒適；皮膚維持完整性；維持正向的身體心像；體重控制不在其中。"},{"i":"b6-2","e":"","n":0,"c":6,"s":"關於腎臟位置，下列何者正確？","o":["右腎比左腎低","兩側腎臟高度相同","左腎比右腎低","兩側腎臟位於骨盆腔內"],"a":"A","k":"A","t":"","x":"講義：右腎低。"},{"i":"b6-3","e":"","n":0,"c":6,"s":"腎元中的「腎小體」含鮑氏囊與腎絲球，主要功能為何？","o":["再吸收","分泌激素","儲存尿液","過濾"],"a":"D","k":"D","t":"","x":"腎元是腎臟製造尿液的功能單位：腎小體（鮑氏囊＋腎絲球）進行過濾作用；腎小管進行再吸收。"},{"i":"b6-4","e":"","n":0,"c":6,"s":"腎元中的腎小管，主要功能為何？","o":["再吸收","過濾","產生排尿反射","儲存尿液"],"a":"A","k":"A","t":"","x":"腎小管具再吸收功能。"},{"i":"b6-5","e":"","n":0,"c":6,"s":"成人腎臟每日排出的尿液量約為多少？","o":["400～600 mL","800～1,000 mL","1,200～1,500 mL","2,500～3,000 mL"],"a":"C","k":"C","t":"","x":"腎臟尿液排泄量約 1,200～1,500 mL／天。"},{"i":"b6-6","e":"","n":0,"c":6,"s":"一般成人膀胱的儲尿量為 300～500 mL，最多可容納多少？","o":["500～800 mL","1,000～2,000 mL","2,500～3,000 mL","4,000～5,000 mL"],"a":"B","k":"B","t":"","x":"一般成人膀胱儲尿量 300～500 mL，最多可容納 1,000～2,000 mL。"},{"i":"b6-7","e":"","n":0,"c":6,"s":"成人男女尿道長度，下列何者正確？","o":["女性 16～20 公分；男性 3.8～5 公分","女性與男性皆約 10 公分","女性 7～8 公分；男性 1.5～2 公分","女性 3.8～5 公分；男性 16～20 公分"],"a":"D","k":"D","t":"","x":"女性尿道 3.8～5 公分（1.5～2 吋）；男性尿道長 16～20 公分（7～8 吋）。"},{"i":"b6-8","e":"","n":0,"c":6,"s":"腎臟製造尿液的「功能單位」為下列何者？","o":["腎小體","腎盞","腎元","腎小管"],"a":"C","k":"C","t":"","x":"腎元是腎臟製造尿液的功能單位，包含腎小體（含鮑氏囊及腎絲球，進行過濾作用）與腎小管（再吸收功能）。p.46"},{"i":"b6-9","e":"","n":0,"c":6,"s":"膀胱排空後，膀胱內壓力約為多少？","o":["0 mmH₂O","50 mmH₂O","150 mmH₂O","300 mmH₂O"],"a":"C","k":"C","t":"","x":"排空膀胱後，膀胱內壓力為 150 mmH₂O；尿量達 250 mL 時壓力上升、有輕度尿意；貯尿量達 300 mL 時壓力升至 180 mmH₂O，產生排尿反射（圖中另標示尿量達 350～400 c.c. 時刺激壓力接受器，與說明框的 300 mL 不一致，本題以說明框為準）。"},{"i":"b6-10","e":"","n":0,"c":6,"s":"膀胱尿量約達多少時，會產生輕度尿意感？","o":["100 mL","150 mL","250 mL","500 mL"],"a":"C","k":"C","t":"","x":"當尿量達到 250 mL 時，膀胱壓力上升，有輕度尿意感。"},{"i":"b6-11","e":"","n":0,"c":6,"s":"依講義說明框，當膀胱貯尿量達 300 mL 時，膀胱壓力約升至多少而產生排尿反射？","o":["100 mmH₂O","150 mmH₂O","180 mmH₂O","250 mmH₂O"],"a":"C","k":"C","t":"","x":"貯尿量達 300 mL 時，壓力升至 180 mmH₂O（會產生排尿反射）；圖中另標示膀胱尿量達 350～400 c.c. 時刺激壓力接受器，本題以說明框的 300 mL／180 mmH₂O 為準。"},{"i":"b6-12","e":"","n":0,"c":6,"s":"排尿反射的傳出路徑，下列何者正確？","o":["會陰神經使尿道外括約肌放鬆；骨盆神經使膀胱逼尿肌收縮並使尿道內括約肌放鬆","交感神經使膀胱逼尿肌收縮並使尿道內括約肌放鬆；會陰神經使尿道外括約肌收縮","會陰神經使膀胱逼尿肌收縮；骨盆神經使尿道外括約肌放鬆並使內括約肌收縮","會陰神經使尿道內括約肌收縮；骨盆神經使膀胱逼尿肌放鬆並使外括約肌放鬆"],"a":"A","k":"A","t":"","x":"排尿反射中樞位於 S2～S4；會陰神經（體神經）→尿道外括約肌放鬆；骨盆神經（副交感神經）→膀胱逼尿肌收縮、尿道內括約肌放鬆→排尿。"},{"i":"b6-13","e":"","n":0,"c":6,"s":"正常排尿機轉中，「會陰神經」屬於哪一類神經？其作用為何？","o":["副交感神經，使尿道內括約肌放鬆","體神經，使膀胱逼尿肌收縮","副交感神經，使尿道外括約肌放鬆","體神經，使尿道外括約肌放鬆"],"a":"D","k":"D","t":"","x":"排尿機制圖：排尿反射中樞（S2～S4）→會陰神經（體神經）→尿道外括約肌放鬆；另一條傳出路徑為骨盆神經（副交感神經）→膀胱逼尿肌收縮、尿道內括約肌放鬆→排尿。"},{"i":"b6-14","e":"","n":0,"c":6,"s":"排尿機轉中，膀胱壓力接受器受刺激後，感覺傳導經由下列何條神經傳入排尿反射中樞（S2～S4）？","o":["骨盆神經","坐骨神經","會陰神經","迷走神經"],"a":"A","k":"A","t":"","x":"排尿機制圖：膀胱尿量增加→刺激膀胱壓力接受器→感覺傳導→骨盆神經→排尿反射中樞（S2～S4），並經脊髓上傳至大腦皮質。"},{"i":"b6-15","e":"","n":0,"c":6,"s":"泌尿道排泄需要的護理評估（收集資料）中，「整體性評估」需收集下列何項資料？","o":["每日呼吸次數、一日體溫變化、心跳速率","每日排尿次數、一日水分攝取量、排尿量","每日排便次數、一日纖維攝取量、排便量","每日活動時間、一日睡眠時數、皮膚溫度"],"a":"B","k":"B","t":"","x":"護理評估（收集資料）：一、整體性評估——收集資料包括病人每日排尿次數、一日水分攝取量、排尿量；二、身體檢查。"},{"i":"b6-16","e":"","n":0,"c":6,"s":"正常情況下，膀胱是否能在恥骨聯合處觸摸到？若可觸摸到代表什麼？","o":["正常無法觸摸到；若可觸摸到，表示可能有尿瀦留，應以叩診評估膀胱膨脹情形","正常可觸摸到；若觸摸不到，表示可能有尿失禁，應以視診評估","正常可觸摸到；若觸摸到硬塊，表示可能有膀胱炎，應以聽診評估","正常無法觸摸到；若可觸摸到，表示可能脫水，應增加水分攝取並觀察尿量"],"a":"A","k":"A","t":"","x":"正常膀胱無法在恥骨聯合處觸摸到；如可觸摸到，表示可能有尿瀦留，應以叩診評估膀胱膨脹情形。"},{"i":"b6-17","e":"","n":0,"c":6,"s":"正常女性尿道口的位置與外觀為何？","o":["位於陰蒂之上，呈蒼白色","位於陰道口之下，呈鮮紅色圓形","位於肛門與陰道口之間，呈暗褐色","位於陰道口之上，呈粉紅色裂隙狀"],"a":"D","k":"D","t":"","x":"正常的尿道口位置在陰道口之上，呈粉紅色之裂隙狀。"},{"i":"b6-18","e":"","n":0,"c":6,"s":"護理評估的身體檢查中，「腎臟」的評估內容為何？","o":["評估皮膚是否完整，及有無水腫與尿霜的情形","觸診是否能在恥骨聯合處摸到，並以叩診評估膀胱膨脹情形","觸診評估位置、堅實度、大小，及有無壓痛或叩診時疼痛","檢查位置是否在陰道口之上，及是否呈粉紅色裂隙狀"],"a":"C","k":"C","t":"","x":"身體檢查：腎臟——觸診評估位置、堅實度、大小、有無壓痛或叩診時疼痛；膀胱——正常無法在恥骨聯合處觸摸到；尿道口——位置在陰道口之上，呈粉紅色裂隙狀；另需評估皮膚是否完整，有無水腫及尿霜。"},{"i":"b6-19","e":"","n":0,"c":6,"s":"成人 24 小時尿量小於 1,200 mL，可能的原因為何？","o":["液體攝入量減少、腎衰竭","液體攝入量增加","使用利尿劑","糖尿病"],"a":"A","k":"A","t":"","x":"24 小時尿量 <1,200 mL：液體攝入量減少、腎衰竭；>1,500 mL：糖尿病、使用利尿劑、液體攝入量增加。p.51"},{"i":"b6-20","e":"","n":0,"c":6,"s":"成人 24 小時尿量大於 1,500 mL，可能的原因為何？","o":["泌尿道阻塞、休克、燒傷造成體液流失","腎衰竭、液體攝入量不足、大量流汗","液體攝入量減少、腎衰竭、嚴重脫水","糖尿病、使用利尿劑、液體攝入量增加"],"a":"D","k":"D","t":"","x":"24 小時尿量 >1,500 mL 的原因：糖尿病、使用利尿劑、液體攝入量增加。"},{"i":"b6-21","e":"","n":0,"c":6,"s":"尿液呈暗琥珀色，最可能的原因為何？","o":["泌尿道感染","大量飲水造成尿液稀釋","液體攝入量不足致尿液濃縮","疾病引發的尿中含血"],"a":"C","k":"C","t":"","x":"正常尿液為淡黃色、琥珀色；暗琥珀色多因液體攝入不足使尿液濃縮；混濁提示感染；尿中含血則因疾病引發。p.51"},{"i":"b6-22","e":"","n":0,"c":6,"s":"尿液外觀混濁，最可能代表下列何種問題？","o":["泌尿道感染","液體攝入過多","阻塞性黃疸","使用利尿劑"],"a":"A","k":"A","t":"","x":"尿液顏色異常：暗琥珀色（濃縮）、混濁（感染）、含血（疾病引發）。"},{"i":"b6-23","e":"","n":0,"c":6,"s":"正常尿液的顏色為何？","o":["紅色、含血","暗琥珀色、深褐色","混濁、乳白色","淡黃色、琥珀色"],"a":"D","k":"D","t":"","x":"常規尿液檢查：正常尿液顏色為淡黃色、琥珀色；異常為暗琥珀色（液體攝入量不足致尿液濃縮）、混濁（感染）、尿中含血（疾病引發）。"},{"i":"b6-24","e":"","n":0,"c":6,"s":"尿液呈膿尿（pyuria），代表什麼？","o":["血糖過高，超過腎臟再吸收閾值","液體攝入不足造成尿液濃縮","腎絲球濾過功能失常，使蛋白質濾出","泌尿系統受感染引起發炎、化膿"],"a":"D","k":"D","t":"","x":"膿尿：含膿液、微生物，為泌尿系統受感染引起發炎、化膿。"},{"i":"b6-25","e":"","n":0,"c":6,"s":"正常尿液 pH 值範圍為何？","o":["2.0～3.5","4.5～8.0","8.5～10.0","10.0～12.0"],"a":"B","k":"B","t":"","x":"正常尿液 pH 值 4.5～8.0。"},{"i":"b6-26","e":"","n":0,"c":6,"s":"尿液 pH 值大於 8.0，最可能的原因為何？","o":["代謝性酸中毒","泌尿道感染","飢餓","脫水"],"a":"B","k":"B","t":"","x":"pH >8.0：泌尿道感染（講義另列未控制的糖尿病）；pH <4.5：飢餓、脫水、代謝性酸中毒。"},{"i":"b6-27","e":"","n":0,"c":6,"s":"尿液 pH 值小於 4.5，可能的原因為何？","o":["泌尿道感染、尿液停留過久","腎絲球腎炎、腎病症候群","飢餓、脫水、代謝性酸中毒","長期素食與大量攝取蔬果"],"a":"C","k":"C","t":"","x":"pH <4.5：飢餓、脫水、代謝性酸中毒。"},{"i":"b6-28","e":"","n":0,"c":6,"s":"正常尿液的成分與氣味為何？","o":["尿液清澈，略有腥味或氨味","尿液清澈，但帶有明顯臭味","尿液黏稠，略有腥味或氨味","尿液含黏液栓，帶有明顯臭味"],"a":"A","k":"A","t":"","x":"常規尿液檢查：成分——正常清澈，異常為黏液栓、黏、濃（感染）；氣味——正常略有腥味、氨味，異常為臭味（感染）。"},{"i":"b6-29","e":"","n":0,"c":6,"s":"尿比重的正常範圍為何？","o":["0.950～1.000","1.010～1.030","1.050～1.080","1.100～1.200"],"a":"B","k":"B","t":"","x":"尿比重正常值 1.010～1.030。"},{"i":"b6-30","e":"","n":0,"c":6,"s":"尿比重小於 1.010，可能的原因為何？","o":["尿崩症、水分攝取過多或水中毒","腎臟病或糖尿病導致尿液濃縮","水分不足","嚴重脫水"],"a":"A","k":"A","t":"","x":"尿比重 <1.010：尿崩症、水分攝取過多、水中毒；>1.030：腎臟病、糖尿病、水分不足。"},{"i":"b6-31","e":"","n":0,"c":6,"s":"尿比重大於 1.030，可能的原因為何？","o":["水分攝取過多或水中毒（亦見於低鈉血症）","尿崩症或水分攝取過多（亦見於服用利尿劑）","尿崩症或水中毒（亦見於大量飲水）","水分不足（亦見於腎臟病、糖尿病）"],"a":"D","k":"D","t":"","x":"尿比重 >1.030：腎臟病、糖尿病、水分不足。"},{"i":"b6-32","e":"","n":0,"c":6,"s":"尿液白血球高於正常值（正常小於 5/hpf），最可能代表下列何者？","o":["泌尿道結石（如腎結石、輸尿管結石）","泌尿系統感染（如膀胱炎、尿道炎、腎盂炎）","糖尿病（如血糖控制不良、糖尿病酮酸中毒）","阻塞性黃疸（如膽道阻塞、肝炎）"],"a":"B","k":"B","t":"","x":"白血球增加：泌尿系統感染，如急、慢性腎盂炎、膀胱炎、尿道炎、腎膿腫、腎結核；另有淋病、梅毒。"},{"i":"b6-33","e":"","n":0,"c":6,"s":"尿液紅血球的正常值為何？","o":["6～9/hpf","1～3/hpf","10～20/hpf","50～100/hpf"],"a":"B","k":"B","t":"","x":"尿液紅血球正常值 1～3/hpf，高於正常值稱為血尿（hematuria）。"},{"i":"b6-34","e":"","n":0,"c":6,"s":"下列何者『不是』血尿（hematuria）的可能原因？","o":["尿路結石","輸血血型不合","阻塞性黃疸","導尿受傷"],"a":"C","k":"C","t":"","x":"血尿：腎臟疾病（腎絲球或腎小管損傷、腎腫瘤、腎絲球腎炎）、尿路結石、輸血血型不合、月經期間、導尿受傷；阻塞性黃疸會出現尿膽紅素。"},{"i":"b6-35","e":"","n":0,"c":6,"s":"下列何者被列為尿液白血球高於正常值的可能原因？","o":["肝炎、阻塞性黃疸","淋病、梅毒","糖尿病、妊娠","飢餓、嘔吐"],"a":"B","k":"B","t":"","x":"尿液白血球正常小於 5/hpf；高於正常值的原因為泌尿系統感染（如急、慢性腎盂炎、膀胱炎、尿道炎、腎膿腫、腎結核）及淋病、梅毒。"},{"i":"b6-36","e":"","n":0,"c":6,"s":"尿液出現酮體，下列何者是可能的原因？","o":["腎絲球腎炎、腎病症候群","阻塞性黃疸、肝炎","泌尿道感染、腎盂腎炎、膀胱炎","糖尿病酮酸中毒、飢餓、嘔吐或腹瀉"],"a":"D","k":"D","t":"","x":"酮體正常為無；出現時可見於糖尿病酮酸中毒、飢餓、嘔吐與腹瀉、服用藥物過多（如 aspirin）。"},{"i":"b6-37","e":"","n":0,"c":6,"s":"飢餓時尿液出現酮體的機轉為何？","o":["脂肪取代醣類成為身體能量的主要來源","蛋白質合成增加，使含氮廢物經尿液排出","腎絲球過濾率增加，使血中酮體被大量濾出","膽紅素代謝增加，使膽色素經尿液排出"],"a":"A","k":"A","t":"","x":"飢餓：脂肪取代醣類成為身體能量的主要來源時，尿中會出現酮體。"},{"i":"b6-38","e":"","n":0,"c":6,"s":"尿液中偵測到膽紅素，最可能代表下列何者？","o":["泌尿道感染","阻塞性黃疸或肝炎","脫水","糖尿病"],"a":"B","k":"B","t":"","x":"膽紅素：試紙反應正常呈陰性；偵測到膽紅素見於阻塞性黃疸、肝炎。"},{"i":"b6-39","e":"","n":0,"c":6,"s":"尿液出現葡萄糖（糖尿，glucosuria），下列何者是可能的原因？","o":["腎衰竭少尿、腎絲球腎炎、腎動脈硬化或高血壓","肝炎、阻塞性黃疸、膽道阻塞、肝硬化、膽結石","糖尿病、進食高濃度葡萄糖食物、血糖過高或妊娠","尿路結石、導尿受傷、輸血血型不合、腎絲球腎炎"],"a":"C","k":"C","t":"","x":"葡萄糖：正常無或 2～20 mg/dL；糖尿見於糖尿病、進食高濃度葡萄糖食物、血糖過高、妊娠。"},{"i":"b6-40","e":"","n":0,"c":6,"s":"尿液葡萄糖的正常值為何？","o":["無或 0.2～1 mg/dL","無或 2～20 mg/dL","無或 30～50 mg/dL","無或 100～200 mg/dL"],"a":"B","k":"B","t":"","x":"尿液葡萄糖正常為「無或 2～20 mg/dL」；高於正常值稱為糖尿（glucosuria），可見於糖尿病、進食高濃度的葡萄糖食物、血糖過高、妊娠。"},{"i":"b6-41","e":"","n":0,"c":6,"s":"下列何者屬於「生理性（暫時性）」蛋白尿的原因？","o":["心衰竭或系統性紅斑性狼瘡等全身疾病","腎絲球腎炎導致濾過功能失常","腎病症候群或腎動脈硬化","劇烈活動後或攝入大量蛋白質後"],"a":"D","k":"D","t":"","x":"蛋白尿：生理性為劇烈活動後或攝入大量蛋白質後的暫時性蛋白尿；病理性為腎絲球過濾功能失常（如腎絲球腎炎）、各種腎臟疾病與全身性疾病。"},{"i":"b6-42","e":"","n":0,"c":6,"s":"尿液中出現圓柱體，最可能提示何種問題？","o":["腎臟疾病","糖尿病","尿道結石","膀胱炎"],"a":"A","k":"A","t":"","x":"圓柱體正常為無，出現時提示腎臟疾病。"},{"i":"b6-43","e":"","n":0,"c":6,"s":"尿液中出現結晶體時，講義建議的後續處理為何？","o":["限制水分攝取，以減少結晶形成","進一步做尿液培養，以確定原因","導尿並以生理食鹽水灌洗膀胱","給予利尿劑，以沖出結晶體"],"a":"B","k":"B","t":"","x":"結晶體正常為無；出現時需做進一步尿液培養，以確定原因。"},{"i":"b6-44","e":"","n":0,"c":6,"s":"尿液蛋白質的正常值為何？","o":["150 mg／天或低於 30 mg/dL","300 mg／天或低於 10 mg/dL","500 mg／天或低於 50 mg/dL","150 mg／天或低於 10 mg/dL"],"a":"D","k":"D","t":"","x":"尿液蛋白質正常為 150 mg／天或低於 10 mg/dL；高於正常值稱為蛋白尿（albuminuria）。"},{"i":"b6-45","e":"","n":0,"c":6,"s":"講義所列病理性蛋白尿的「全身性疾病」原因，除心衰竭、系統性紅斑性狼瘡外，還包括下列何者？","o":["缺鐵性貧血","腎病症候群","多發性骨髓瘤","腎動脈硬化"],"a":"C","k":"C","t":"","x":"蛋白尿（albuminuria）病理性原因：腎絲球過濾功能失常（如腎絲球腎炎）；各種腎臟疾病（如腎炎、腎病症候群、腎動脈硬化）；全身性疾病（如心衰竭、系統性紅斑性狼瘡、多發性骨髓瘤）；缺鐵性貧血不在講義所列原因中。p.55Q7 異常排尿症狀、尿瀦留與尿失禁分類"},{"i":"b7-1","e":"","n":0,"c":6,"s":"下列何者『不屬於』講義所列泌尿排泄相關護理診斷／健康問題？","o":["尿瀦留","排尿型態障礙","急迫性尿失禁","感受性便祕"],"a":"D","k":"D","t":"","x":"講義所列：排尿型態障礙、尿瀦留、壓力性尿失禁、急迫性尿失禁、失能相關尿失禁；感受性便祕屬於排便問題（見"},{"i":"b7-2","e":"","n":0,"c":6,"s":"成人 24 小時尿液少於多少 mL，稱為「無尿（閉尿，anuria）」？","o":["50 mL","100 mL","200 mL","400 mL"],"a":"B","k":"B","t":"","x":"無尿或閉尿：24 小時尿液少於 100 mL；少尿：少於 400 mL；多尿：多於 2,500 mL。"},{"i":"b7-3","e":"","n":0,"c":6,"s":"成人 24 小時尿液少於多少 mL，稱為「少尿（oliguria）」？","o":["100 mL","400 mL","800 mL","1,200 mL"],"a":"B","k":"B","t":"","x":"少尿：排尿量減少，24 小時尿液少於 400 mL。"},{"i":"b7-4","e":"","n":0,"c":6,"s":"成人 24 小時尿液多於多少 mL，稱為「多尿（polyuria）」？","o":["1,500 mL","2,000 mL","2,500 mL","3,500 mL"],"a":"C","k":"C","t":"","x":"多尿：排尿量增加，24 小時尿液多於 2,500 mL。"},{"i":"b7-5","e":"","n":0,"c":6,"s":"下列何者是「少尿」的可能原因？","o":["休克或燒傷（體液容積減少）","糖尿病（血糖過高造成滲透性利尿）","ADH 分泌減少（如尿崩症）","使用利尿劑或攝取大量水分"],"a":"A","k":"A","t":"","x":"少尿原因：液體攝入減少或大量流汗（脫水）、腎功能減低或泌尿道阻塞、休克、燒傷（體液容積減少）。"},{"i":"b7-6","e":"","n":0,"c":6,"s":"下列何者『不是』多尿的可能原因？","o":["糖尿病","飲用大量咖啡或酒精性飲料","使用利尿劑","休克或燒傷"],"a":"D","k":"D","t":"","x":"多尿原因：液體攝入增加或喝咖啡、酒等利尿性飲料、使用利尿劑、荷爾蒙不平衡（如糖尿病、ADH 分泌減少）；休克、燒傷會使體液容積減少而致少尿。"},{"i":"b7-7","e":"","n":0,"c":6,"s":"夜尿（nocturia）的定義為何？","o":["晚上起來如廁 2 次以上","夜間無法排尿","夜間尿量少於 100 mL","夜間發生的尿失禁"],"a":"A","k":"A","t":"","x":"夜尿：晚上起來如廁 2 次以上；夜間發生的尿失禁稱為遺尿。"},{"i":"b7-8","e":"","n":0,"c":6,"s":"下列何者可能造成夜尿？","o":["燒傷造成大量體液流失，使尿量減少","休克使腎臟血流減少而尿液濃縮","大量流汗造成脫水而尿液濃縮","充血性心衰竭病人平躺使回心血量增加"],"a":"D","k":"D","t":"","x":"夜尿原因：腎臟尿液濃縮能力降低（如腎衰竭早期）、膀胱出口阻塞（如前列腺肥大）、膀胱過度刺激（如泌尿道感染）、充血性心衰竭者因平躺導致回心血量增加。"},{"i":"b7-9","e":"","n":0,"c":6,"s":"頻尿（frequency of urine）的特徵為何？","o":["只在夜間需要起床排尿，且每次尿量偏多、次數不多","排尿次數減少，每次排尿量多，常大於 550 mL","排尿次數頻繁，每次排尿量少，約 50～100 mL","24 小時尿量少於 400 mL，且排尿次數減少"],"a":"C","k":"C","t":"","x":"頻尿：排尿次數頻繁，每次排尿量少（約 50～100 mL）；原因如孕婦膀胱受壓、膀胱過度刺激（泌尿道感染）、心理因素（緊張、焦慮）。"},{"i":"b7-10","e":"","n":0,"c":6,"s":"發生於夜晚的尿失禁，最常見於兒童期，稱為何？","o":["遺尿","夜尿","頻尿","尿瀦留"],"a":"A","k":"A","t":"","x":"遺尿：發生於夜晚的尿失禁，最常見於兒童期；夜尿則是晚上起來如廁 2 次以上。"},{"i":"b7-11","e":"","n":0,"c":6,"s":"「必須馬上排出尿液的感覺」稱為何？","o":["頻尿（frequency）","急尿（urgency）","排尿困難（dysuria）","排尿遲疑（hesitancy）"],"a":"B","k":"B","t":"","x":"急尿（urgency）：必須馬上排出尿液的感覺；原因如膀胱過度刺激（泌尿道感染）、心理因素（緊張、焦慮）。頻尿為排尿次數頻繁、每次量少；排尿遲疑為開始排尿困難、排一點點又停頓；排尿困難為尿液不易解出、過程中有不適感。"},{"i":"b7-12","e":"","n":0,"c":6,"s":"腎衰竭早期會出現夜尿，其主要原因為何？","o":["抗利尿激素分泌增加","膀胱容量增加","腎臟尿液濃縮能力降低","腎小管再吸收水分的能力增強"],"a":"C","k":"C","t":"","x":"夜尿的原因：腎臟尿液濃縮能力降低（如腎衰竭早期）、膀胱出口阻塞（如前列腺肥大）、膀胱過度刺激（如泌尿道感染）、充血性心衰竭者因平躺導致回心血量增加。"},{"i":"b7-13","e":"","n":0,"c":6,"s":"下列何者『不是』護理診斷「排尿型態障礙」的定義性特徵？","o":["想解尿卻解不出來","夜尿","血尿","急尿"],"a":"C","k":"C","t":"","x":"排尿型態障礙的定義性特徵：尿失禁、急尿、夜尿、想解尿卻解不出來、頻尿、解尿困難、尿瀦留；血尿不在此列。"},{"i":"b7-14","e":"","n":0,"c":6,"s":"尿液不易解出、排尿過程中有不適感覺，稱為何？","o":["急尿（urgency）","膿尿（pyuria）","排尿遲疑（hesitancy）","排尿困難（dysuria）"],"a":"D","k":"D","t":"","x":"排尿困難：尿液不易解出、過程中有不適的感覺，原因如膀胱出口阻塞（前列腺肥大、結石）、泌尿道感染。p.57"},{"i":"b7-15","e":"","n":0,"c":6,"s":"開始排尿時很困難，排尿過程中排一點點又停頓，稱為何？","o":["血尿","尿失禁","排尿遲疑（hesitancy）","排尿困難（dysuria）"],"a":"C","k":"C","t":"","x":"排尿遲疑：開始排尿時很困難排出，過程中排一點點尿液又停頓；原因如膀胱出口阻塞（前列腺肥大、結石）。p.57"},{"i":"b7-16","e":"","n":0,"c":6,"s":"尿中有膿，呈白色混濁狀且有臭味，稱為何？","o":["膿尿（pyuria）","血尿（hematuria）","糖尿（glucosuria）","蛋白尿（albuminuria）"],"a":"A","k":"A","t":"","x":"膿尿：尿中有膿，呈白色混濁狀且有臭味，常見原因為泌尿道感染。"},{"i":"b7-17","e":"","n":0,"c":6,"s":"下列何者最可能造成排尿困難與排尿遲疑？","o":["使用利尿劑，造成尿量增加及排尿頻繁","尿崩症造成大量稀釋尿及多尿現象","長期大量飲水造成尿量過多、排尿頻繁","膀胱出口阻塞（如前列腺肥大、結石）"],"a":"D","k":"D","t":"","x":"排尿困難與排尿遲疑的共同原因：膀胱出口阻塞（前列腺肥大、結石）；排尿困難另可見於泌尿道感染。"},{"i":"b7-18","e":"","n":0,"c":6,"s":"尿瀦留（urinary retention，又稱尿滯留）的定義為何？","o":["排尿次數頻繁但每次量少，約 50～100 mL","尿液蓄積在膀胱內不易排出或無法排出，使餘尿量增加","24 小時尿液少於 100 mL，膀胱內無尿液可排","尿液不自主地漏出，病人無法控制排尿時間"],"a":"B","k":"B","t":"","x":"尿瀦留：尿液蓄積在膀胱內不易排出或無法排出，使得餘尿量增加（正常餘尿量應少於 50 mL）。"},{"i":"b7-19","e":"","n":0,"c":6,"s":"正常膀胱排尿後的餘尿量應少於多少？","o":["10 mL","50 mL","100 mL","200 mL"],"a":"B","k":"B","t":"","x":"正常餘尿量應少於 50 c.c.。p.85 的「解尿後餘尿少於 100 mL」是膀胱訓練成功的標準，不是正常值。p.57、p.85、p.102"},{"i":"b7-20","e":"","n":0,"c":6,"s":"下列何者『不是』尿瀦留的常見原因？","o":["麻醉藥物或 Atropine 的副作用","前列腺肥大","使用利尿劑","脊髓損傷"],"a":"C","k":"C","t":"","x":"尿瀦留原因：支配膀胱神經障礙（糖尿病、脊髓損傷）、膀胱出口阻塞（前列腺肥大、膀胱腫瘤）、心理因素（會陰部或肛門手術後怕痛）、藥物副作用（手術麻醉藥、Atropine）。"},{"i":"b7-21","e":"","n":0,"c":6,"s":"會陰部或肛門手術後，病人因怕痛而不敢排尿，導致尿瀦留，屬於哪一類原因？","o":["心理因素","膀胱出口阻塞","支配膀胱的神經障礙","藥物副作用"],"a":"A","k":"A","t":"","x":"尿瀦留的心理因素：如會陰部或肛門手術後怕痛。"},{"i":"b7-22","e":"","n":0,"c":6,"s":"病人只能自行排出約 25～50 mL 尿液，排尿後仍感到膀胱膨脹，屬於何種尿瀦留？","o":["完全性尿瀦留","暫時性尿瀦留","功能性尿瀦留","溢出性尿瀦留"],"a":"D","k":"D","t":"","x":"尿瀦留三型：完全性（完全無法自行排尿）、暫時性（可藉導尿解除，如手術後麻醉所致）、溢出性（只能自行排出約 25～50 mL，排尿後仍感到膀胱膨脹）。"},{"i":"b7-23","e":"","n":0,"c":6,"s":"手術後因麻醉導致、可藉由導尿解除的尿瀦留，屬於哪一型？","o":["溢出性尿瀦留","暫時性尿瀦留","慢性尿瀦留","完全性尿瀦留"],"a":"B","k":"B","t":"","x":"暫時性尿瀦留：可藉由導尿解除，例如手術後因麻醉所導致。"},{"i":"b7-24","e":"","n":0,"c":6,"s":"因骨盆底肌肉組織無力，腹內壓增高（如咳嗽、打噴嚏、提重物）時，不自主排出少於 50 mL 尿液，屬於哪一型尿失禁？","o":["急迫性尿失禁","滿溢性尿失禁","壓力性尿失禁","功能性尿失禁"],"a":"C","k":"C","t":"","x":"壓力性尿失禁：骨盆底肌肉組織無力、腹內壓增高，不自主排出少於 50 mL 尿液。"},{"i":"b7-25","e":"","n":0,"c":6,"s":"膀胱逼尿肌不自主收縮，每次排尿量可能大於 550 mL 或小於 100 mL，攝入過多酒精和咖啡因會加重，屬於哪一型尿失禁？","o":["急迫性尿失禁","滿溢性尿失禁","壓力性尿失禁","功能性尿失禁"],"a":"A","k":"A","t":"","x":"急迫性尿失禁：膀胱逼尿肌不自主收縮，每次排尿量可能大於 550 mL 或小於 100 mL；酒精與咖啡因會刺激膀胱並利尿。"},{"i":"b7-26","e":"","n":0,"c":6,"s":"常見於下運動神經元受損（逼尿肌無法收縮），膀胱餘尿可超過 700 mL，屬於哪一型尿失禁？","o":["反射性尿失禁","急迫性尿失禁","壓力性尿失禁","滿溢性尿失禁"],"a":"D","k":"D","t":"","x":"滿溢性尿失禁：膀胱過度飽脹而不自主漏出尿液，常見下運動神經元受損（逼尿肌無法收縮），膀胱餘尿超過 700mL。"},{"i":"b7-27","e":"","n":0,"c":6,"s":"老年失智症病人因無法辨識廁所位置，來不及到達廁所而漏尿，屬於哪一型尿失禁？","o":["滿溢性尿失禁","功能性尿失禁","壓力性尿失禁","急迫性尿失禁"],"a":"B","k":"B","t":"","x":"功能性尿失禁：個人無法及時到達廁所而發生不自主排尿，如行動不便、老年癡呆意識不正常等。"},{"i":"b7-28","e":"","n":0,"c":6,"s":"同時存在兩種或兩種以上尿失禁類型症狀（如壓力性合併急迫性）者，稱為何？","o":["反射性尿失禁","功能性尿失禁","混合型尿失禁","滿溢性尿失禁"],"a":"C","k":"C","t":"","x":"混合型尿失禁：存在兩種或兩種以上尿失禁類型的症狀。"},{"i":"b7-29","e":"","n":0,"c":6,"s":"下列何者是功能性尿失禁的定義性特徵？","o":["感覺需要排尿，且可完全排空膀胱","無排尿的感覺，也無感覺到膀胱脹滿","膀胱餘尿超過 700 mL，排尿後仍排不乾淨","主訴或被觀察到，當腹壓增加時有滴尿的情形"],"a":"A","k":"A","t":"","x":"功能性尿失禁的定義性特徵：急於排尿但到達廁所的時間超過所能忍受的時間、未到達廁所前尿液已排出、可能僅在清晨會有尿失禁、感覺需要排尿、可完全排空膀胱。無排尿感覺且無膀胱脹滿感屬反射性；腹壓增加時滴尿屬壓力性；餘尿超過 700 mL 屬滿溢性。"},{"i":"b7-30","e":"","n":0,"c":6,"s":"急迫性尿失禁的定義為何？","o":["膀胱達一定容量時，尿液在可預期的時間間隔內不自主地排出","膀胱過度飽脹而不自主地漏出尿液，餘尿超過 700 mL","個人在感受到強烈的急尿感後，立即不自主地排出尿液","腹壓增加（如咳嗽）時，不自主地排出不足 50 mL 的尿液"],"a":"C","k":"C","t":"","x":"急迫性尿失禁的定義：個人在感受到強烈的急尿感後，立即不自主地排出尿液。反射性為膀胱達一定容量時於可預期時間間隔內不自主排出；壓力性為腹壓增加時排出不足 50 c.c.；滿溢性為膀胱過度飽脹而漏尿、餘尿超過 700 mL。p.58、p.59、p.60"},{"i":"b7-31","e":"","n":0,"c":6,"s":"反射性尿失禁的定義為何？","o":["當膀胱達一定容量時，尿液可在可預期的時間間隔內不自主排出","腹壓增加（如咳嗽、打噴嚏）時，不自主排出不足 50 mL 的尿液","個人感受到強烈急尿感後，無法忍住而立即不自主地排出尿液","個人因認知障礙或行動不便，無法及時到達廁所而發生不自主排尿"],"a":"A","k":"A","t":"","x":"反射性尿失禁：當膀胱達一定容量時，尿液可在可預期時間間隔內不自主排出；病人無排尿感覺、無膀胱脹滿感。"},{"i":"b7-32","e":"","n":0,"c":6,"s":"反射性尿失禁病人，若神經損傷位置在橋腦排尿中樞以上，排尿的結果為何？","o":["會不完全排空尿液","無法排尿","會持續滴尿而不排空","會完全排空尿液"],"a":"D","k":"D","t":"","x":"損傷在橋腦排尿中樞以上時，會完全排空尿液；損傷在薦髓排尿中樞以上時，會不完全排空尿液。"},{"i":"b7-33","e":"","n":0,"c":6,"s":"下列何者是壓力性尿失禁的相關因素？","o":["酒精與咖啡因刺激膀胱，使逼尿肌不自主收縮或痙攣","肥胖或妊娠子宮使腹內壓增加、骨盆肌與支持結構虛弱","神經病變破壞膀胱脹滿的反射傳導，使逼尿肌無法收縮","認知障礙以致找不到廁所，或行動不便無法及時如廁"],"a":"B","k":"B","t":"","x":"壓力性尿失禁相關因素：骨盆肌和支持構造虛弱無力、老化使組織退化、腹內壓增加（如肥胖、妊娠的子宮）、括約肌功能不良。"},{"i":"b7-34","e":"","n":0,"c":6,"s":"下列何者是反射性尿失禁的相關因素？","o":["視覺障礙、認知障礙或環境因素的改變","酒精、咖啡因或液體攝取量增加","由於年齡漸長使骨盆肌及組織的支持構造退化","放射性膀胱炎或根除性骨盆手術造成組織損傷"],"a":"D","k":"D","t":"","x":"反射性尿失禁的相關因素：因放射性膀胱炎、膀胱發炎或根除性骨盆手術而導致組織損傷；薦椎或橋腦排尿中樞以上的神經功能障礙。骨盆肌及組織退化屬壓力性；視覺、認知障礙與環境改變屬功能性；酒精、咖啡因與液體攝取增加屬急迫性。"},{"i":"b7-35","e":"","n":0,"c":6,"s":"壓力性尿失禁的定義性特徵，除了腹壓增加時有滴尿的情形外，還包括下列何者？","o":["夜尿（每晚超過 2 次）","頻尿（間隔不到 2 小時）","無法到達廁所後才排尿","每次排出量過多（>550 mL）"],"a":"B","k":"B","t":"","x":"壓力性尿失禁的定義性特徵：主訴或被觀察到當腹壓增加時有滴尿的情形、頻尿（間隔不到 2 小時）、急尿。夜尿（每晚超過 2 次）、每次排出量 >550 mL 或 <100 mL、無法到達廁所後才排尿為急迫性尿失禁的特徵。"},{"i":"b7-36","e":"","n":0,"c":6,"s":"下列何者『不是』急迫性尿失禁的相關因素？","o":["骨盆肌和支持構造虛弱無力","攝入過多酒精與咖啡因","膀胱容量減少，如曾有腹部手術","膀胱張力接受器受刺激引發痙攣"],"a":"A","k":"A","t":"","x":"急迫性尿失禁的相關因素：酒精、咖啡因、膀胱容量減少（如曾有骨盆腔發炎、腹部手術、尿管留置）、液體攝取增加、尿液濃度增加、膀胱張力接受器受到刺激引發痙攣（如膀胱感染）、膀胱過度膨脹；骨盆肌和支持構造虛弱無力屬壓力性尿失禁的相關因素。"},{"i":"b7-37","e":"","n":0,"c":6,"s":"下列何者是滿溢性尿失禁的定義性特徵？","o":["每次排出量過多（>550 mL）或過少（<100 mL）","主訴或被觀察到，當腹壓增加時有滴尿的情形","在可預期的時間間隔內不自主地排出尿液","無察覺到有尿失禁的情形，且無法察覺會陰或膀胱的脹滿"],"a":"D","k":"D","t":"","x":"滿溢性尿失禁的定義性特徵：在不預期的時間內持續排出尿液、夜尿、難醫治的尿失禁、無察覺到有尿失禁的情形、無法察覺會陰或膀胱的脹滿。在可預期的時間間隔內不自主排出屬反射性（滿溢性為不預期時間）；腹壓增加時滴尿屬壓力性；每次排出量 >550 mL 或 <100 mL 屬急迫性。"},{"i":"b7-38","e":"","n":0,"c":6,"s":"下列何者是急迫性尿失禁的定義性特徵？","o":["無排尿的感覺、無感覺到膀胱脹滿，可預期時間排尿","當腹壓增加（如咳嗽、打噴嚏、提重物）時漏尿，量少於 50 mL","急尿、頻尿（間隔不到 2 小時）、夜尿每晚超過 2 次","膀胱餘尿超過 700 mL，並持續少量滴尿、下腹部脹滿"],"a":"C","k":"C","t":"","x":"急迫性尿失禁特徵：急尿、膀胱收縮或痙攣、頻尿（間隔不到 2 小時）、每次排出量過多（>550 mL）或過少（<100 mL）、夜尿（每晚超過 2 次）、無法到達廁所後才排尿。"},{"i":"b7-39","e":"","n":0,"c":6,"s":"下列何者是護理診斷「尿瀦留」的相關因素？","o":["尿液濃度增加或液體攝取增加","逼尿肌虛弱，引起尿道壓力增高","膀胱容量小，儲尿量不足","膀胱括約肌不自主地鬆弛"],"a":"B","k":"B","t":"","x":"尿瀦留（無法完全排空膀胱）的相關因素：尿路阻塞、逼尿肌虛弱引起尿道壓力增高、反射弧受到抑制、括約肌收縮過強。膀胱括約肌不自主鬆弛、膀胱容量小為潛在危險性急迫性尿失禁的相關因素；尿液濃度增加、液體攝取增加為急迫性尿失禁的相關因素。"},{"i":"b7-40","e":"","n":0,"c":6,"s":"下列何者為護理診斷「尿瀦留」的定義性特徵？","o":["膀胱膨脹、滴尿、排尿困難、尿殘餘及膀胱脹滿感","腹壓增加時排出不足 50 mL 尿液","無排尿感覺且可預期時間排尿","排尿次數減少且每次尿量大於 550 mL"],"a":"A","k":"A","t":"","x":"尿瀦留（無法完全排空膀胱）特徵：膀胱膨脹、排尿次數增加但量少或無尿量、滴尿、排尿困難、滿溢性尿失禁、尿殘餘、膀胱脹滿感。"},{"i":"b8-1","e":"","n":0,"c":6,"s":"嬰兒排尿是反射作用，不受意志控制，約幾歲以後才能自我控制排尿？","o":["6 個月","1歲","3歲","5歲"],"a":"C","k":"C","t":"","x":"嬰兒排尿是反射作用所產生，不受意志控制，3 歲以後才能自我控制。"},{"i":"b8-2","e":"","n":0,"c":6,"s":"下列老年人排尿變化的敘述，何者正確？","o":["膀胱肌肉張力差易頻尿；男性罹患前列腺肥大時可能有尿瀦留","膀胱容量增加，排尿間隔變長；女性因骨盆肌強而易有尿瀦留","尿道括約肌力量增強，不易漏尿；男性因前列腺萎縮而易有多尿","腎絲球過濾率增加，尿量增多；膀胱容量增加，排尿間隔變長"],"a":"A","k":"A","t":"","x":"老年人因膀胱肌肉張力差易頻尿；男性老人罹患前列腺肥大時，會有尿瀦留。"},{"i":"b8-3","e":"","n":0,"c":6,"s":"廁所無門遮蔽，對大多數病人是無法適應的，講義指出常因此引起下列何種排泄問題？","o":["多尿（polyuria）","無尿（anuria）","血尿（hematuria）","尿瀦留（retention）"],"a":"D","k":"D","t":"","x":"社會文化因素：不同的文化背景、環境、設備等都會影響排尿；排尿為隱蔽性行為，如廁所無門遮蔽，對大多數病人是無法適應的，故常引起尿瀦留等排泄問題。"},{"i":"b8-4","e":"","n":0,"c":6,"s":"下列何種情況會使尿量「減少」？","o":["食用含水分多的水果與蔬菜","天氣寒冷","飲用咖啡、茶與酒精性飲料","天氣炎熱，排汗多"],"a":"D","k":"D","t":"","x":"環境：天氣熱則排汗多故尿量少，反之則尿量多；咖啡、茶與酒精性飲料有利尿作用。"},{"i":"b8-5","e":"","n":0,"c":6,"s":"抗利尿激素（ADH）、腎上腺皮質類固醇與正腎上腺素，會影響腎小管的哪一項功能？","o":["過濾","再吸收","排出","儲存"],"a":"B","k":"B","t":"","x":"激素影響：ADH、腎上腺皮質類固醇、正腎上腺素均可影響腎小管之再吸收能力。"},{"i":"b8-6","e":"","n":0,"c":6,"s":"下列何者會使腎絲球過濾率（GFR）降低而導致尿量減少？","o":["出血、休克或嚴重脫水","使用利尿劑或飲用咖啡","天氣寒冷或飲酒過量","大量飲水或輸入大量液體"],"a":"A","k":"A","t":"","x":"血流量改變：腎絲球微血管的血流量與尿量息息相關，GFR 降低，尿量亦會減少，如出血、休克或嚴重脫水時。p.64"},{"i":"b8-7","e":"","n":0,"c":6,"s":"泌尿道感染最常見的致病菌為何？女性為何更易感染？","o":["白色念珠菌；因女性膀胱容量較小、排尿次數較少","金黃色葡萄球菌；因女性尿道較長且較彎曲","結核桿菌；因女性免疫力較低且水分攝取較少","大腸桿菌（E. coli）；因女性尿道較短"],"a":"D","k":"D","t":"","x":"感染：常見的細菌為大腸桿菌（E. coli），因女性尿道短，更易引起泌尿系統感染。"},{"i":"b8-8","e":"","n":0,"c":6,"s":"情緒焦慮會使副交感神經興奮，而導致下列何種排尿症狀？","o":["血尿","頻尿","膿尿","無尿"],"a":"B","k":"B","t":"","x":"情緒焦慮會使副交感神經興奮，而致頻尿。"},{"i":"b8-9","e":"","n":0,"c":6,"s":"膽鹼激素性藥物（cholinergic drug）對排尿的影響為何？","o":["抑制逼尿肌收縮而致尿瀦留","使腎小管再吸收增加","刺激逼尿肌收縮而促進排尿","使尿道外括約肌收縮"],"a":"C","k":"C","t":"","x":"膽鹼激素性藥物會刺激逼尿肌收縮以致排尿；利尿劑增加排尿；止痛劑和鎮定劑抑制中樞神經系統，減低神經反射作用而干擾排尿。"},{"i":"b8-10","e":"","n":0,"c":6,"s":"止痛劑與鎮定劑影響排尿的機轉為何？","o":["抑制中樞神經系統，減低神經反射作用而干擾排尿","增加腎絲球過濾率，使尿液生成量增加","刺激逼尿肌收縮，使排尿次數與尿量增加","增加腎小管再吸收，使尿液濃縮而量減少"],"a":"A","k":"A","t":"","x":"止痛劑和鎮定劑會抑制中樞神經系統，減低神經反射的作用而干擾排尿。"},{"i":"b8-11","e":"","n":0,"c":6,"s":"若腎臟功能產生障礙（如腎病症候群），會造成下列何種現象？","o":["遺尿或尿失禁","少尿或無尿","頻尿或急尿","排尿遲疑或排尿困難"],"a":"B","k":"B","t":"","x":"血液流入腎動脈，經腎元的腎絲球過濾及腎小管再吸收，將廢物濃縮成尿液排出；若腎臟功能產生障礙（如腎病症候群），則造成少尿或無尿現象。"},{"i":"b8-12","e":"","n":0,"c":6,"s":"手術壓力所造成的激素變化，對尿液製造的影響為何？","o":["最初減少尿液製造，之後尿量更加減少","最初尿量沒有變化，之後才減少尿液製造","最初大量利尿，之後尿液製造減少","最初減少尿液製造，之後才有利尿作用"],"a":"D","k":"D","t":"","x":"手術壓力所造成的激素變化最初是減少尿液製造，但後來便有利尿作用。"},{"i":"b8-13","e":"","n":0,"c":6,"s":"手術後發生尿瀦留的可能原因，下列何者正確？","o":["術後交感神經活性下降，使尿道括約肌鬆弛而不易蓄尿","術後尿液製造速度減慢，或麻醉劑、止痛劑抑制感覺與運動反射通路","術後大量飲水造成膀胱過度收縮，反而使尿液無法順利排出","術後腎絲球過濾率增加，使尿液製造過多而膀胱過度脹滿"],"a":"B","k":"B","t":"","x":"尿瀦留是手術後可能發生的問題，原因是尿液製造速度減慢，或因麻醉劑、止痛劑對感覺與運動反射通路的抑制作用。"},{"i":"b8-14","e":"","n":0,"c":6,"s":"接受膀胱鏡等診斷性檢查後，病人可能出現尿瀦留的原因為何？","o":["檢查造成腎小管再吸收功能增強，使尿量減少","檢查使腎絲球過濾率增加，使膀胱過度膨脹","檢查時尿道被戳傷，導致排尿疼痛、血尿及尿道腫脹","檢查使抗利尿激素分泌減少，使尿液排出過多"],"a":"C","k":"C","t":"","x":"診斷性檢查：接受膀胱鏡檢查時被戳傷，導致排尿疼痛、血尿及尿道腫脹而引起尿瀦留等排尿問題。"},{"i":"b8-15","e":"","n":0,"c":6,"s":"因中風而無法移動身體的病人，較可能出現何種排尿問題？","o":["因無法獨自到廁所或呼叫協助，而發生尿失禁或尿瀦留","因年老使膀胱肌肉張力變差，而發生頻尿與夜尿","因抗利尿激素分泌減少，使尿液濃縮不足而發生多尿","因腎絲球過濾率降低，使尿液製造量減少而發生少尿"],"a":"A","k":"A","t":"","x":"運動感覺障礙：活動受限、被約束或中風而無法移動身體的病人，會因尿急時無法獨自到廁所或馬上召喚別人協助，而引發尿失禁或尿瀦留。"},{"i":"b9-1","e":"","n":0,"c":6,"s":"誘尿時請病人向前彎腰以增加腹內壓，此法適用於哪類病人？","o":["下運動神經元尿失禁病人","功能性尿失禁病人","壓力性尿失禁病人","急迫性尿失禁病人"],"a":"A","k":"A","t":"","x":"請病人向前彎腰以增加腹內壓，適於下運動神經元尿失禁患者（p.58：滿溢性尿失禁常見下運動神經元受損、逼尿肌無法收縮）。"},{"i":"b9-2","e":"","n":0,"c":6,"s":"為維持腎臟正常功能，飲食原則為何？","o":["高蛋白飲食，並增加鈉與鉀的攝取","高蛋白飲食，並限制鈉與鉀的攝取","低蛋白飲食，並增加鈉與鉀的攝取","低蛋白飲食，並限制鈉與鉀的攝取"],"a":"D","k":"D","t":"","x":"維持腎臟正常功能：低蛋白飲食（減少含氮廢物）、限制鈉和鉀的攝取；並協助增加食慾、告知遵循醫囑攝取飲食和液體。"},{"i":"b9-3","e":"","n":0,"c":6,"s":"腎功能不佳者採低蛋白飲食的目的為何？","o":["減少蛋白質代謝後含氮廢物的產量","降低血糖，避免糖尿病腎病變惡化","減少鈉離子滯留，避免水腫發生","增加尿液排出量，並促進鈣質吸收"],"a":"A","k":"A","t":"","x":"低蛋白飲食可減少蛋白質代謝後含氮廢物的產量，減輕腎臟負擔。"},{"i":"b9-4","e":"","n":0,"c":6,"s":"腎功能不佳者需限制鈉與鉀的攝取，主要理由為何？","o":["鈉會使尿液變鹼，鉀會使腎小管萎縮","鈉會造成貧血，鉀會抑制尿液產生","鈉與鉀都會使含氮廢物增加","鈉會使體液滯留，鉀會使神經肌肉功能障礙"],"a":"D","k":"D","t":"","x":"限制鈉和鉀：因鈉會使體液滯留，鉀使神經肌肉功能障礙。"},{"i":"b9-5","e":"","n":0,"c":6,"s":"為使腎臟獲得休息，可採用下列何種方式？","o":["血液透析（人工洗腎）","持續膀胱灌洗沖出廢物","長期留置導尿管引流","大量灌腸清除腸道毒素"],"a":"A","k":"A","t":"","x":"腎臟需休息時，可臥床休息減少活動以降低細胞代謝，並行血液透析（人工洗腎）。"},{"i":"b9-6","e":"","n":0,"c":6,"s":"維持腎臟正常功能時，讓病人臥床休息、減少活動的目的為何？","o":["增加腎臟過濾負荷","促進蛋白質合成","增加細胞代謝","降低細胞代謝"],"a":"D","k":"D","t":"","x":"維持腎臟正常功能：臥床休息減少活動，以降低細胞代謝。"},{"i":"b9-7","e":"","n":0,"c":6,"s":"為維持正常排尿，成人每日液體攝入量（含液體及食物）約為多少？","o":["300～500 mL","800～1,000 mL","1,200～1,500 mL","3,500～4,000 mL"],"a":"C","k":"C","t":"","x":"攝入適量液體：1,200～1,500 c.c./day（包含液體及食物）維持正常的排泄狀況。"},{"i":"b9-8","e":"","n":0,"c":6,"s":"長期不活動的病人，為避免結石或感染，每日液體攝入量宜為多少？","o":["1,000～1,500 mL","1,500～1,800 mL","2,000～3,000 mL","4,000～5,000 mL"],"a":"C","k":"C","t":"","x":"長期不活動病人：2,000～3,000 c.c./天，避免結石或感染。"},{"i":"b9-9","e":"","n":0,"c":6,"s":"重建病人排尿模式時，下列作法何者正確？","o":["依病房作息安排固定排尿時間，不依個人平時習慣，並鼓勵使用便盆排尿","鼓勵病人忍尿至膀胱脹滿以增加膀胱容量，並改採臥姿排尿，以避免尿液外濺及污染","改採臥姿使用便盆排尿，以減少跌倒與尿液外濺，並請病人在床上等候護理人員協助","了解平時排尿時間與所需時間，鼓勵採原有排尿姿勢，並依原有習慣協助按時排尿"],"a":"D","k":"D","t":"","x":"重建排尿模式：了解平時排尿時間、需多久時間才能排乾淨；鼓勵採原有排尿姿勢；依原有排尿習慣按時排尿；膀胱訓練。"},{"i":"b9-10","e":"","n":0,"c":6,"s":"產後多久內一定要解尿，否則會影響子宮收縮？","o":["1 小時","2 小時","4 小時","12 小時"],"a":"C","k":"C","t":"","x":"產後 4 小時（因會影響子宮收縮）及手術後 6～8 小時一定得解尿液。"},{"i":"b9-11","e":"","n":0,"c":6,"s":"手術後多久內一定得解尿？","o":["1～2 小時","3～4 小時","6～8 小時","24 小時"],"a":"C","k":"C","t":"","x":"手術後 6～8 小時一定得解尿液；若未解尿，可先用誘尿方法。"},{"i":"b9-12","e":"","n":0,"c":6,"s":"下列何者『不是』誘尿的方法？","o":["聽流水聲（如打開水龍頭）以引發尿意","限制水分攝取，讓膀胱維持脹滿","以溫水坐浴或會陰沖洗放鬆括約肌","以手握冰塊等冷刺激，誘發尿意"],"a":"B","k":"B","t":"","x":"誘尿方法：聽流水聲、冷刺激（手握冰塊）、局部用熱（需醫囑）、溫水坐浴（放鬆尿道括約肌）、會陰沖洗、局部按摩、改變姿勢。"},{"i":"b9-13","e":"","n":0,"c":6,"s":"局部使用熱敷（熱水袋或濕熱敷）於膀胱部位誘尿，需具備何種條件？","o":["需有醫囑才可執行","需同時搭配冰敷使用","由護理師視情況自行決定","需先由家屬簽署同意書"],"a":"A","k":"A","t":"","x":"局部用熱：需有醫囑，在膀胱部位給予熱水袋或溼熱敷。"},{"i":"b9-14","e":"","n":0,"c":6,"s":"溫水坐浴協助誘尿的機轉為何？","o":["增加腎絲球過濾率","刺激逼尿肌強力收縮","抑制排尿反射","放鬆尿道括約肌"],"a":"D","k":"D","t":"","x":"溫水坐浴：放鬆尿道括約肌。"},{"i":"b9-15","e":"","n":0,"c":6,"s":"誘尿時使用冷刺激（手握冰塊），其原理為何？","o":["冰刺激使尿道括約肌放鬆，讓尿液易流出","冰刺激使膀胱血管擴張，增加膀胱收縮","末梢神經最敏感，冰刺激反射到大腦皮質","冰刺激使腎絲球過濾率上升，使尿量增加"],"a":"C","k":"C","t":"","x":"用冷刺激：手握冰塊（末梢神經最敏感，冰刺激使反射到大腦皮質）；放鬆尿道括約肌的是溫水坐浴。"},{"i":"b9-16","e":"","n":0,"c":6,"s":"Credé's method（克萊台）的正確作法為何？","o":["雙手由右向左沿結腸方向，機械性按摩整個腹部，以刺激腸蠕動排尿","雙手順著輸尿管向內、向下呈「V」字型，按摩恥骨聯合處擠壓膀胱部位","單手在上腹部用力向下按壓，以擠壓膀胱，並請病人閉氣用力排尿","雙手拍打腰部兩側腎臟區，以刺激腎臟產生尿液，增加腹壓利排尿"],"a":"B","k":"B","t":"","x":"Credé's method：雙手順著輸尿管向內、向下呈「V」字型，按摩恥骨聯合處擠壓膀胱部位，以增加腹壓利排尿。"},{"i":"b9-17","e":"","n":0,"c":6,"s":"協助病人排尿時，姿勢的選擇，下列何者正確？","o":["女性用站姿，男性用坐姿","兩性皆採仰臥姿","兩性皆採左側臥姿","女性用坐姿，男性用站姿"],"a":"D","k":"D","t":"","x":"改變病人姿勢：女性用坐姿，男性則採站姿。"},{"i":"b9-18","e":"","n":0,"c":6,"s":"局部按摩膀胱部位以協助誘尿時，輕揉的方向為何？","o":["順時鐘方向輕揉","逆時鐘方向輕揉","左右來回直線輕揉","上下來回直線輕揉"],"a":"A","k":"A","t":"","x":"誘尿的局部按摩：(a) 順時鐘方向輕揉膀胱部位；(b) Credé's method（克萊台）增加腹壓以利排尿；(c) 請病人向前彎腰以增加腹內壓。"},{"i":"b9-19","e":"","n":0,"c":6,"s":"腎功能降低、含氮廢物增加的病人，護理師應特別預防何種意外？","o":["呼吸過度造成鹼中毒，而引起手足抽搐的意外","頭痛、嗜睡、失去方向感甚至昏迷所造成的意外","高血壓造成腦出血，而引起昏迷與癱瘓的意外","低血糖造成抽搐或跌倒，而引起頭部外傷的意外"],"a":"B","k":"B","t":"","x":"預防意外：因腎功能降低、含氮廢物增加，可出現頭痛、嗜睡，嚴重者失去方向感、呈現昏迷。"},{"i":"b9-20","e":"","n":0,"c":6,"s":"慢性腎衰竭病人氮廢物經汗液代謝，在皮膚形成的白色粉狀物稱為何？","o":["尿霜","脫屑","黃疸","痱子"],"a":"A","k":"A","t":"","x":"慢性腎衰竭病人氮廢物經汗液代謝，皮膚形成白色粉狀的尿霜，會發癢和異味，須經常沐浴保持皮膚清潔舒適。p.72"},{"i":"b9-21","e":"","n":0,"c":6,"s":"水腫病人的皮膚護理，下列何者正確？","o":["可用熱水袋熱敷水腫的下肢，以促進血液循環","水腫處可貼密不透氣的敷料，以防止水分蒸發","皮膚較厚不易受損，水腫處可用力按摩以促進吸收","皮膚較薄易受損，骶骨部及下肢踝關節處避免受壓"],"a":"D","k":"D","t":"","x":"水腫病人皮膚變薄、水分過多而較易受損，骶骨部及下肢踝關節處避免受壓。"},{"i":"b9-22","e":"","n":0,"c":6,"s":"慢性腎衰竭病人皮膚出現白色粉狀的尿霜，並有發癢與異味，適當的護理為何？","o":["以酒精反覆擦拭皮膚，去除粉狀物與異味","須經常沐浴，以保持皮膚的清潔與舒適","以厚粉劑撲抹皮膚，吸收汗液與異味","以乾毛巾用力摩擦皮膚，去除粉狀物"],"a":"B","k":"B","t":"","x":"慢性腎衰竭病人氮廢物經汗液代謝，皮膚形成白色粉狀的尿霜，會發癢和異味，須經常沐浴保持皮膚清潔舒適。p.72"},{"i":"b9-23","e":"","n":0,"c":6,"s":"閉尿病人的護理措施，下列何者正確？","o":["增加蛋白質與鹽分攝取，以修復組織並維持血壓","臥床休息，限制鹽分、蛋白質及水分攝入，並依醫囑治療","大量飲水以沖刷泌尿道，並鼓勵增加蛋白質攝取","鼓勵下床活動並增加運動量，以促進尿液排出"],"a":"B","k":"B","t":"","x":"閉尿護理：臥床休息，限制鹽分、蛋白質及水分之攝入；按醫囑治療（如結腸灌洗、利尿劑、腹膜透析術等）以增加排泄。"},{"i":"b9-24","e":"","n":0,"c":6,"s":"閉尿病人依醫囑治療以增加排泄，講義所舉的例子『不包括』下列何者？","o":["使用利尿劑","膀胱訓練","腹膜透析術","結腸灌洗"],"a":"B","k":"B","t":"","x":"閉尿：按醫囑治療（如結腸灌洗、用利尿劑、腹膜透析術等）以增加排泄；膀胱訓練的對象是頻尿、急迫性尿失禁、膀胱過動或脊髓損傷病人。"},{"i":"b9-25","e":"","n":0,"c":6,"s":"尿瀦留病人膀胱脹滿時，叩診膀胱區會呈現何種聲音？","o":["濁音","清音","鼓音","過度共鳴音"],"a":"A","k":"A","t":"","x":"尿瀦留身體評估：叩診呈現濁音。"},{"i":"b9-26","e":"","n":0,"c":6,"s":"臥床的尿瀦留病人，協助排尿的體位為何？","o":["平躺並將雙腿伸直，使腹部肌肉與尿道括約肌放鬆，以利尿液流出","採頭低腳高姿勢，利用重力使尿液由膀胱流向尿道口，以增加尿量","側臥並屈膝縮成一團，使腹部肌肉放鬆，並避免用力與加壓腹部","略抬高上身或坐起，鼓勵身體前傾，以手加壓腹部增加腹內壓"],"a":"D","k":"D","t":"","x":"調整排尿體位與姿勢：如臥床病人，協助略抬高上身或坐起，鼓勵身體前傾，以手加壓腹部以增加腹內壓。p.74"},{"i":"b9-27","e":"","n":0,"c":6,"s":"下列何者『不是』尿瀦留病人的護理措施？","o":["提供隱蔽的排尿環境與溫暖的便器","評估造成尿瀦留的原因","依醫囑導尿，以引流膀胱內尿液","限制水分攝取，以減少膀胱脹滿"],"a":"D","k":"D","t":"","x":"尿瀦留護理：評估原因、叩診濁音、提供隱蔽的排尿環境與溫暖的便器、調整體位姿勢、鼓勵至少喝水 1,500c.c.（而非限制水分）、使用誘尿方法、按醫囑導尿、藥物治療。"},{"i":"b9-28","e":"","n":0,"c":6,"s":"尿瀦留病人在無禁忌下，鼓勵至少喝水多少，以產生足夠尿液、藉反射作用排尿？","o":["500 c.c.","1,000 c.c.","1,500 c.c.","3,000 c.c."],"a":"C","k":"C","t":"","x":"鼓勵至少喝水 1,500 c.c.，產生足夠的尿液，藉反射作用來排尿。"},{"i":"b9-29","e":"","n":0,"c":6,"s":"尿瀦留病人可依醫囑使用何種藥物促進膀胱收縮？","o":["利尿劑（如 furosemide、spironolactone）","膽素激素性藥物（如 bethanechol、neostigmine）","抗膽鹼藥物（如 atropine、scopolamine）","鎮靜劑（如 diazepam、lorazepam）"],"a":"B","k":"B","t":"","x":"尿瀦留藥物治療：膽素激素性藥物（即擬膽鹼藥物，如 bethanechol 或 neostigmine）會刺激膀胱收縮。p.75"},{"i":"b9-30","e":"","n":0,"c":6,"s":"尿失禁病人的共同護理措施，下列何者正確？","o":["指導定期排空膀胱、減少茶等刺激性食物、每日水分攝取約 2,000 mL","鼓勵多喝濃茶與咖啡以增加膀胱張力，並減少白天如廁次數及總排尿量","限制水分至每日 500 mL 以下，以減少漏尿次數，並避免夜間排尿","全天使用尿布並避免如廁，以減少皮膚與衣物污染，並限制水分攝取"],"a":"A","k":"A","t":"","x":"尿失禁共同護理：指導定期排空膀胱、減少刺激性食物（如茶）、水分攝取 2,000 mL／day、鼓勵說出內心感受、安排適當如廁環境、教導抬腿運動、皮膚護理。"},{"i":"b9-31","e":"","n":0,"c":6,"s":"為增強腹肌力量，尿失禁病人的共同護理中會教導何種運動？","o":["深呼吸運動","肩頸伸展運動","手指抓握運動","抬腿運動"],"a":"D","k":"D","t":"","x":"尿失禁共同護理：教導抬腿運動以增強腹肌力量。"},{"i":"b9-32","e":"","n":0,"c":6,"s":"下列何者『不屬於』講義所列的尿失禁共同護理？","o":["限制病人下床活動以減少漏尿","鼓勵病人說出尿失禁的內心感受","協助病人進行皮膚護理","為病人安排適當的如廁環境"],"a":"A","k":"A","t":"","x":"尿失禁共同護理：指導定期排空膀胱、減少刺激性食物（如茶）、水分攝取 2,000 mL/day、鼓勵病人說出尿失禁內心感受、安排適當的如廁環境、教導抬腿運動以增強腹肌力量、皮膚護理；限制下床活動不在其列。"},{"i":"b9-33","e":"","n":0,"c":6,"s":"壓力性尿失禁病人的護理，下列何者正確？","o":["建議多飲用咖啡以增加尿意感知，並減少如廁","教導凱格爾氏運動，避免增加腹壓的活動，肥胖者需減重","有尿意時先忍耐一段時間再解尿，以增加膀胱容量","鼓勵提重物運動以增強腹肌，並增加腹壓活動"],"a":"B","k":"B","t":"","x":"壓力性尿失禁：避免從事增加腹壓的活動、肥胖需減重、指導凱格爾氏運動、起床後與有尿意時立即解尿並定時提醒。"},{"i":"b9-34","e":"","n":0,"c":6,"s":"凱格爾氏運動（Kegel's exercise）的作法為何？","o":["重複收縮會陰部肌肉再放鬆，以強化會陰肌肉","雙腳抬高離床 45 度並維持，以強化腹肌力量","重複收縮腹直肌再放鬆，以強化腹部肌肉","快速深呼吸並憋氣用力，以增加腹內壓"],"a":"A","k":"A","t":"","x":"凱格爾氏運動：練習重複收縮會陰部肌肉再放鬆，以強化會陰肌肉。"},{"i":"b9-35","e":"","n":0,"c":6,"s":"壓力性尿失禁病人需定時提醒其解尿，一開始以多久為間隔，再逐步延長？","o":["15 分鐘","2 小時","4 小時","6 小時"],"a":"B","k":"B","t":"","x":"有尿意時立即解尿，並提醒病人解尿（開始以 2 小時為間隔），然後再延長時間。"},{"i":"b9-36","e":"","n":0,"c":6,"s":"壓力性尿失禁病人的解尿時機，下列何者正確？","o":["起床後先大量飲水，有尿意時先忍耐至膀胱脹滿再解尿","起床後立即解尿，有尿意時先忍耐至膀胱脹滿再解尿","起床後立即解尿，有尿意時也立即解尿","起床後暫不解尿，有尿意時也立即解尿"],"a":"C","k":"C","t":"","x":"壓力性尿失禁：起床後須立即解尿，有尿意時立即解尿，並提醒病人解尿（開始以 2 小時為間隔），然後再延長時間。"},{"i":"b9-37","e":"","n":0,"c":6,"s":"下列尿失禁類型與其護理措施的配對，何者正確？","o":["壓力性尿失禁：重複輕敲恥骨約一分鐘，以利刺激排空膀胱","急迫性尿失禁：協助實施膀胱訓練，並調整方便如廁的環境","急迫性尿失禁：撫摸大腿內側、拉陰毛，藉以引發排尿反射","反射性尿失禁：指導做凱格爾氏運動，以強化會陰部肌肉"],"a":"B","k":"B","t":"","x":"急迫性尿失禁：協助實施膀胱訓練、調整方便如廁的環境（p.79）；凱格爾氏運動用於壓力性尿失禁（p.78）；輕敲恥骨、撫摸大腿內側、拉陰毛用於反射性尿失禁（p.80）。"},{"i":"b9-38","e":"","n":0,"c":6,"s":"急迫性尿失禁病人晚上幾點後應限制飲水，以免夜尿？","o":["下午 3 點","下午 5 點","晚上 7 點","晚上 10 點"],"a":"C","k":"C","t":"","x":"急迫性尿失禁：日間分成數次飲用適量液體，晚上 7 點後限制飲水，以免夜尿。"},{"i":"b9-39","e":"","n":0,"c":6,"s":"急迫性尿失禁病人如廁途中發生失禁，護理師可引導病人如何做？","o":["立即蹲下並用力排尿，以減輕膀胱壓力","用力憋氣並收縮腹部，以壓住尿液","停下腳步、深呼吸，避免因焦慮使膀胱收縮","加快腳步趕往廁所，避免尿液漏出"],"a":"C","k":"C","t":"","x":"如廁中途失禁，可引導病人停下腳步、深呼吸，避免因焦慮而使膀胱收縮。"},{"i":"b9-40","e":"","n":0,"c":6,"s":"急迫性尿失禁病人的飲水與飲食護理，下列何者正確？","o":["日間集中一次大量飲水，並多喝咖啡等利尿飲料","日間減少飲水量，以減少排尿次數並避免夜尿","睡前鼓勵多喝水，以免夜間口渴而影響睡眠","日間分成數次適量飲水，避免刺激膀胱的食物"],"a":"D","k":"D","t":"","x":"急迫性尿失禁：日間分成數次飲用適量液體，晚上 7 點後限制飲水以免夜尿；避免刺激膀胱或利尿食物。"},{"i":"b9-41","e":"","n":0,"c":6,"s":"反射性尿失禁病人可用哪些方法引發排尿？","o":["大量飲水並憋尿至疼痛感出現，再一次用力排出尿液，以刺激膀胱收縮","熱敷腰背部並減少水分攝取，以放鬆膀胱逼尿肌，並每 2 小時導尿一次","執行凱格爾氏運動並增加腹部用力，以強化會陰肌肉張力，並減少水分攝取","重複輕敲恥骨上方約 1 分鐘、撫摸大腿內側、拉陰毛或敲擊鼠蹊韌帶上方腹部"],"a":"D","k":"D","t":"","x":"反射性尿失禁：重複輕敲恥骨一分鐘（約每 5 秒 7～8 次）、撫摸大腿內側、拉陰毛、敲擊鼠蹊韌帶上方腹部以引發排尿；若可自行控制腹肌，可使用 Valsalva 方式。"},{"i":"b9-42","e":"","n":0,"c":6,"s":"反射性尿失禁病人重複輕敲恥骨一分鐘以刺激排空膀胱，其速度約為何？","o":["每 5 秒約 1～2 次","每 5 秒約 3～4 次","每 5 秒約 7～8 次","每 5 秒約 12～15 次"],"a":"C","k":"C","t":"","x":"反射性尿失禁：重複輕敲恥骨一分鐘（約每 5 秒 7～8 次的速度），以利刺激排空膀胱。"},{"i":"b9-43","e":"","n":0,"c":6,"s":"反射性尿失禁病人若可自行控制腹肌，可使用何種方式協助排尿？","o":["Valsalva 方式（憋氣用力）","膀胱灌洗（以無菌溶液沖洗膀胱）","深呼吸放鬆（緩慢吸吐以降低膀胱收縮）","凱格爾氏運動（重複收縮會陰部肌肉）"],"a":"A","k":"A","t":"","x":"反射性尿失禁：若病人可自行控制腹肌，可使用 Valsalva 方式（憋氣用力增加腹壓）協助排尿。"},{"i":"b9-44","e":"","n":0,"c":6,"s":"預防泌尿道感染，每日液體攝取量宜為多少？","o":["500～1,000 c.c.","1,000～1,500 c.c.","2,000～3,000 c.c.","4,000～5,000 c.c."],"a":"C","k":"C","t":"","x":"大量攝取液體（2,000～3,000 c.c./day），以稀釋尿液，增進自然的泌尿道沖洗。"},{"i":"b9-45","e":"","n":0,"c":6,"s":"預防泌尿道感染，鼓勵病人白天至少每幾小時排尿一次？","o":["每 2 小時","每 4 小時","每 6 小時","每 8 小時"],"a":"A","k":"A","t":"","x":"鼓勵病人白天至少每 2 小時排尿一次，夜晚 1～2 次，以免膀胱膨脹而引起膀胱發炎或感染。"},{"i":"b9-46","e":"","n":0,"c":6,"s":"下列預防泌尿道感染的護理，何者『錯誤』？","o":["維持尿液呈酸性以抑制細菌生長","建議以盆浴代替淋浴","女性宜穿吸汗性強的純棉製品且勿穿過緊褲子","性活動前後應解尿"],"a":"B","k":"B","t":"","x":"預防泌尿道感染：大量攝取液體、白天至少每 2 小時排尿、性活動前後解尿、維持尿液酸性、女性穿純棉透氣衣物、注意會陰部擦拭方式、建議以淋浴代替盆浴。"},{"i":"b9-47","e":"","n":0,"c":6,"s":"預防泌尿道感染時，維持尿液呈酸性的目的為何？","o":["減少蛋白質代謝後所產生的含氮廢物","稀釋尿液，增進泌尿道的自然沖洗作用","抑制細菌生長，並增加泌尿道藥物效果","避免膀胱過度膨脹，以免引起膀胱發炎"],"a":"C","k":"C","t":"","x":"維持尿液呈酸性，以抑制細菌生長及增加泌尿道藥物的效果；稀釋尿液、沖洗泌尿道是大量攝取液體的目的，避免膀胱膨脹是定時排尿的目的。"},{"i":"b9-48","e":"","n":0,"c":6,"s":"預防泌尿道感染，鼓勵病人夜晚排尿約幾次，以免膀胱膨脹而引起發炎或感染？","o":["0次","1～2 次","3～4 次","5～6 次"],"a":"B","k":"B","t":"","x":"鼓勵病人白天至少每 2 小時排尿一次，夜晚 1～2 次，以免膀胱膨脹而引起膀胱發炎或感染。"},{"i":"b10-1","e":"","n":0,"c":6,"s":"膀胱訓練的原理與目標，下列何者正確？","o":["利用時間控制、適量液體、誘尿及間歇導尿，延長排尿間隔至 3～4 小時","每 15 分鐘定時導尿，使膀胱維持排空，並縮短排尿間隔至 15 分鐘","長期留置導尿管，使膀胱肌肉充分休息並恢復張力，以避免尿瀦留及感染","限制水分攝取，使膀胱逐漸縮小，以增加排尿頻率並縮短排尿間隔"],"a":"A","k":"A","t":"","x":"膀胱訓練利用時間控制、攝入適量液體、誘尿及間歇導尿法，促進隨意控制排尿機能、增加膀胱容量、延長排尿間隔至 3～4 小時、減少排尿頻率。"},{"i":"b10-2","e":"","n":0,"c":6,"s":"下列哪一類病人適合接受膀胱訓練？","o":["頻尿、急迫性尿失禁、膀胱過動或脊髓損傷的病人","膀胱破裂或泌尿道手術後急性期的病人","泌尿道大量出血或急性腎衰竭無尿的病人","尿道嚴重狹窄或急性尿瀦留合併膀胱過脹的病人"],"a":"A","k":"A","t":"","x":"膀胱訓練的對象：頻尿、急迫性尿失禁、膀胱過動或脊髓損傷病人。"},{"i":"b10-3","e":"","n":0,"c":6,"s":"膀胱訓練期間，每日 7AM～7PM 的飲水量至少應為多少？","o":["500～800 c.c.","1,000～1,200 c.c.","1,500～2,500 c.c.","3,500～4,500 c.c."],"a":"C","k":"C","t":"","x":"每日 7AM～7PM 飲水量至少 1,500～2,500 c.c.（100～150 c.c./hr），以定期產生足夠尿液，使膀胱膨脹，產生排尿反射，並記錄量和時間。"},{"i":"b10-4","e":"","n":0,"c":6,"s":"膀胱訓練中，協助病人排尿或間歇性導尿的間隔為何？","o":["每 5～10 分鐘","每 30 分鐘～2 小時","每 4～6 小時","每 8～12 小時"],"a":"B","k":"B","t":"","x":"每 30 分鐘～2 小時協助病人排尿或間歇性導尿，再依膀胱容量與解尿型態建立規則排尿時間。"},{"i":"b10-5","e":"","n":0,"c":6,"s":"膀胱訓練時，應教導病人在急迫性尿意感發生前多久如廁？","o":["5 分鐘","15 分鐘","30 分鐘","60 分鐘"],"a":"C","k":"C","t":"","x":"教導病人在急迫性尿意感發生前 30 分鐘如廁。"},{"i":"b10-6","e":"","n":0,"c":6,"s":"膀胱訓練中，若病人已能自行控制 2 小時才解尿，下一步應如何進行？","o":["一次延長至 8 小時，以盡快達到訓練目標","停止訓練並留置導尿管，讓膀胱充分休息","逐漸延長 30 分鐘，最後拉長至 3～4 小時","立即改為每 30 分鐘排尿一次，以增加訓練強度"],"a":"C","k":"C","t":"","x":"訓練過程中，若病人能自行控制 2 小時才解尿，逐漸延長 30 分鐘，最後拉長至 3～4 小時。"},{"i":"b10-7","e":"","n":0,"c":6,"s":"下列何者是膀胱訓練成功的指標？","o":["解尿後餘尿大於 200 mL，或自解尿量與餘尿比為 1：3","解尿後餘尿大於 300 mL，或自解尿量與餘尿比為 1：2","解尿後餘尿大於 100 mL，或自解尿量與餘尿比為 1：1","解尿後餘尿少於 100 mL，或自解尿量與餘尿比為 3：1"],"a":"D","k":"D","t":"","x":"訓練成功：解尿後餘尿少於 100 mL，或自解尿量與餘尿比 3：1。"},{"i":"b10-8","e":"","n":0,"c":6,"s":"膀胱訓練期間，白天定時攝取足量水分（100～150 c.c./hr）的主要目的為何？","o":["定期產生足夠尿液，使膀胱膨脹產生排尿反射","使膀胱容量逐漸縮小，以縮短排尿的間隔時間","使膀胱持續保持排空，以避免產生尿意感","稀釋血中藥物濃度，以減輕腎臟的代謝負擔"],"a":"A","k":"A","t":"","x":"膀胱訓練：每日 7AM～7PM 飲水量至少 1,500～2,500 c.c.（100～150 c.c./hr），以定期產生足夠的尿液，使膀胱膨脹，產生排尿反射，並記錄量和時間。"},{"i":"b10-9","e":"","n":0,"c":6,"s":"留置導尿管病人進行膀胱訓練，應於尿管拔除前多久開始？","o":["1 小時","6 小時","12 小時","24 小時"],"a":"D","k":"D","t":"","x":"若病人裝置導尿管時進行膀胱訓練：於尿管拔除前 24 小時進行膀胱訓練。"},{"i":"b10-10","e":"","n":0,"c":6,"s":"留置導尿管病人夾管進行膀胱訓練，定時每 2～3 小時應開放管夾多久？","o":["1 分鐘","5 分鐘","30 分鐘","2 小時"],"a":"B","k":"B","t":"","x":"管夾夾住尿管，定時每 2～3 小時開放管夾 5 分鐘，依水分攝取量之不同，管夾開放時間可彈性調整，晚間應放開管夾，以免影響睡眠。"},{"i":"b10-11","e":"","n":0,"c":6,"s":"病人使用利尿劑並進行導尿管夾管膀胱訓練時，應如何處理？","o":["照常夾管，並減少水分攝取","不宜夾管，以免發生膀胱過脹","夜間也夾管以維持訓練","延長夾管時間以加強訓練"],"a":"B","k":"B","t":"","x":"若病人使用利尿劑則不宜夾管，以免發生膀胱過脹；水分攝入量多時，管夾開放間隔時間縮短 1～2 小時。p.86"},{"i":"b10-12","e":"","n":0,"c":6,"s":"留置導尿病人進行夾管式膀胱訓練，晚間管夾應如何處理？","o":["應夾管至清晨，以延長膀胱訓練時間","應每小時開放管夾 5 分鐘一次","應放開管夾，以免影響睡眠","應與白天相同，每 2～3 小時開放管夾 5 分鐘"],"a":"C","k":"C","t":"","x":"夾管式膀胱訓練：管夾夾住尿管，定時每 2～3 小時開放管夾 5 分鐘；晚間應放開管夾，以免影響睡眠。"},{"i":"b10-13","e":"","n":0,"c":6,"s":"留置導尿病人夾管進行膀胱訓練時，若水分攝入量較多，管夾開放的間隔時間應如何調整？","o":["延長 3～4 小時","延長 1～2 小時","維持每 2～3 小時不變","縮短 1～2 小時"],"a":"D","k":"D","t":"","x":"夾管式膀胱訓練：一般每 2～3 小時開放管夾 5 分鐘；若水分攝入量多，管夾開放間隔時間縮短 1～2 小時。p.86"},{"i":"b10-14","e":"","n":0,"c":6,"s":"導尿法的定義與原理，下列何者正確？","o":["以無菌技術將導尿管經由尿道置入膀胱，藉重力原理引流出尿液","以潔淨技術將導尿管經由尿道置入腎盂，藉幫浦抽出尿液","以潔淨技術將導尿管經由尿道置入膀胱，藉滲透壓原理引流尿液","以無菌技術將導尿管經由尿道置入輸尿管，藉負壓吸出尿液"],"a":"A","k":"A","t":"","x":"導尿法：以無菌技術將導尿管經由尿道置入於膀胱，藉重力原理引流出尿液。"},{"i":"b10-15","e":"","n":0,"c":6,"s":"存留導尿法中，導尿管通常於何時才拔除？","o":["病人可自主解尿，或不需持續準確監測排尿量時","每日尿液排出量已達 2,000 c.c. 以上時","膀胱內的尿液一經排空，就立即抽出導尿管","蓄尿袋內的尿液已積存達 1/2～2/3 滿時"],"a":"A","k":"A","t":"","x":"存留導尿法：導尿管留置於膀胱一段時間，直至病人可以自主解尿，或是不需持續準確監測排尿量，才拔除導尿管；單次導尿法則於尿液排空後即抽出導尿管。"},{"i":"b10-16","e":"","n":0,"c":6,"s":"下列何者屬於「單次導尿法（間歇導尿）」的適用情境？","o":["保護尿失禁病人的皮膚及床褥，預防壓力性損傷","需連續準確監測每小時排尿量的重症病人","取得無菌尿液培養標本，特別是月經來潮的女病人","長期膀胱減壓引流的病人"],"a":"C","k":"C","t":"","x":"單次導尿法適用：導出膀胱內尿液以減輕脹痛不適；取無菌尿液培養或獲得清潔尿液標本（特別是女病人月經來潮時）；測餘尿量。"},{"i":"b10-17","e":"","n":0,"c":6,"s":"以導尿測量餘尿量，導尿的時機為何？","o":["病人解小便前先導尿","病人飲水後 30 分鐘導尿","病人睡前導尿","病人解完小便後立即導尿"],"a":"D","k":"D","t":"","x":"測餘尿量（正常餘尿量為 50 c.c.）：病人解完小便後，立即給予導尿，以測量餘尿量。"},{"i":"b10-18","e":"","n":0,"c":6,"s":"下列何者『不是』存留導尿法的適用情境？","o":["需持續準確監測排尿量的病人","解完小便後，測量膀胱內的餘尿量","病人無法自行解出尿液而需引流","肛門或會陰部手術後，預防傷口感染"],"a":"B","k":"B","t":"","x":"存留導尿法適用於：無法自解尿液者；避免膀胱、肛門、會陰部等處手術後傷口感染；保護尿失禁病人皮膚及床褥；膀胱減壓；監測排尿量。解完小便後立即導尿測餘尿量屬於單次導尿法。"},{"i":"b10-19","e":"","n":0,"c":6,"s":"下列何者屬於「存留導尿法」的適用情境？","o":["取得無菌尿液培養標本，特別是月經來潮的女病人","保護尿失禁病人皮膚及床褥，預防壓力性損傷","單次測量餘尿量，測完後立即抽出導尿管","暫時減輕膀胱脹痛，排空尿液後即抽出導尿管"],"a":"B","k":"B","t":"","x":"存留導尿適用：無法自解尿液者；避免膀胱、肛門、會陰部等處手術後傷口感染；保護尿失禁病人皮膚及床褥；膀胱減壓；監測排尿量。"},{"i":"b10-20","e":"","n":0,"c":6,"s":"單路導尿管的用途為何？","o":["放入膀胱導出尿液，用於單次導尿，尿液排空後即抽出","專用於長期留置膀胱，以固定氣囊持續引流尿液","可同時導出尿液、固定氣囊，並經第三路灌洗或加藥","一路導出尿液，另一路注入無菌液固定導尿管，供留置使用"],"a":"A","k":"A","t":"","x":"導尿管種類：單路導尿管用於單次導尿，放入膀胱導出尿液。"},{"i":"b10-21","e":"","n":0,"c":6,"s":"二路（雙腔）存留導尿管，兩路的用途分別為何？","o":["一路用於膀胱灌洗，另一路用於加入藥物治療","兩路皆用於導出尿液，以加快尿液引流速度","一路導出尿液，另一路注入無菌溶液以固定導尿管","一路導出尿液，另一路用於灌洗膀胱或加入藥物"],"a":"C","k":"C","t":"","x":"二路導尿管：一路導出尿液，另一路注入無菌溶液固定導尿管（氣囊）。"},{"i":"b10-22","e":"","n":0,"c":6,"s":"三路導尿管比二路導尿管多的一路，可用於何種用途？","o":["抽血檢驗","注入空氣固定氣囊","測量膀胱壓力","灌洗或加藥"],"a":"D","k":"D","t":"","x":"三路導尿管：除二路導尿管的用途外，還多一路可灌洗或加藥。"},{"i":"b10-23","e":"","n":0,"c":6,"s":"存留導尿管固定氣囊，一般注入何種液體？","o":["含抗生素的生理食鹽水","無菌蒸餾水","70% 酒精","優碘溶液"],"a":"B","k":"B","t":"","x":"存留導尿管之固定氣囊：打入液體（一般使用無菌蒸餾水）。"},{"i":"b10-24","e":"","n":0,"c":6,"s":"關於導尿管尺寸，下列敘述何者正確？","o":["號碼越大，尺寸越大；應選能維持引流功能的最小管徑","尺寸由病人意願決定，號碼與管徑大小無關","為利引流，應選能通過尿道的最大管徑以避免導尿管阻塞","號碼越大，尺寸越小；應選能維持引流功能的最大管徑"],"a":"A","k":"A","t":"","x":"導尿管尺寸：號碼越大，尺寸越大，以能維持引流功能的最小管徑導尿管為選擇使用之依據。"},{"i":"b10-25","e":"","n":0,"c":6,"s":"成人導尿管一般尺寸，下列何者正確？","o":["男性 22～24 Fr.、女性 22～24 Fr.","男性 14～16 Fr.、女性 16～18 Fr.","男性 16～18 Fr.、女性 14～16 Fr.","男性 8～10 Fr.、女性 8～10 Fr."],"a":"C","k":"C","t":"","x":"導尿管尺寸：成人男性 16～18 Fr.、女性 14～16 Fr.、兒童 8～10 Fr.。"},{"i":"b10-26","e":"","n":0,"c":6,"s":"1 Fr.（French）等於多少 mm？","o":["1/3 mm","1/2 mm","1 mm","3 mm"],"a":"A","k":"A","t":"","x":"1 Fr. ＝ 1/3 mm，號碼越大導尿管外徑越大。"},{"i":"b10-27","e":"","n":0,"c":6,"s":"泌尿道手術或出血的病人需作引流或膀胱灌洗，建議使用多大的導尿管？","o":["8～10 Fr.","12 Fr.","14～16 Fr.","18 Fr. 以上"],"a":"D","k":"D","t":"","x":"泌尿道手術、出血的病人需作引流或膀胱灌洗，建議使用 18 Fr. 以上的導尿管，以免造成尿道的傷害。"},{"i":"b10-28","e":"","n":0,"c":6,"s":"依比較表，兒童使用的導尿管與肛管尺寸，下列何者正確？","o":["導尿管 14～16 Fr.；肛管 10 Fr.","導尿管 16～18 Fr.；肛管 22～24 Fr.","導尿管 8～10 Fr.；肛管 14～18 Fr.","導尿管 14～18 Fr.；肛管 8～10 Fr."],"a":"C","k":"C","t":"","x":"比較表：兒童導尿管 8～10 Fr.、兒童肛管 14～18 Fr.（成人導尿管：男 16～18 Fr.、女 14～16 Fr.；成人肛管 22～24 Fr.；嬰兒肛管 10 Fr.）。"},{"i":"b10-29","e":"","n":0,"c":6,"s":"乳膠導尿管的特性，下列何者正確？","o":["不會引起過敏、不易變硬，適合長期使用，最多可放置 3 個月再更換","價格昂貴，質地堅硬，僅適合單次導尿，不可長期留置膀胱使用","質地較軟，長期放置後不會變硬，適合長期使用，可 1 個月更換一次","價格便宜，易刺激過敏、易變硬，不適合長期使用，需 1～2 週更換"],"a":"D","k":"D","t":"","x":"乳膠導尿管：價格便宜，易刺激過敏，易變硬，不適合長期使用，需 1～2 週更換。"},{"i":"b10-30","e":"","n":0,"c":6,"s":"矽膠導尿管的特性，下列何者正確？","o":["價格便宜，但易變硬、易刺激過敏，不適合長期使用，需 1～2 週更換","質地較乳膠軟，長期放置不會變硬，適合長期使用，可 1 個月更換","價格便宜，易引起過敏，不適合長期使用，需每週更換一次","質地堅硬易刺激過敏，適用於單次導尿，不可留置於膀胱"],"a":"B","k":"B","t":"","x":"矽膠導尿管：質地較乳膠軟且長期放置後不會變硬，適合長期使用，可 1 個月更換一次。"},{"i":"b11-1","e":"","n":0,"c":6,"s":"下列關於長期留置導尿管的敘述，何者正確？","o":["長期放置可訓練膀胱張力，應盡量延長留置時間以減少更換","應避免長期放置，以免膀胱失去張力、喪失控制排尿能力","尿管固定位置應固定不變，以免尿道口反覆受刺激","為避免感染，蓄尿袋開口應保持開放，使尿液持續流出"],"a":"B","k":"B","t":"","x":"避免長期放置留存導尿管，使膀胱肌肉失去張力，喪失控制排尿能力；尿管固定位置需輪流更換；更換頻率依材質不同（p.94 乳膠 1～2 週、矽膠 1 個月；p.98 一般每週更換一次），本題不考更換頻率；蓄尿袋開口應隨時關閉，以免受到污染。"},{"i":"b11-2","e":"","n":0,"c":6,"s":"留置導尿病人為減少泌尿道感染，每日水分攝取量與目標尿量為何？","o":["每日約 3,000 c.c. 水分，使尿液排出量維持在 2,000 c.c. 以上，並維持尿液呈酸性","每日限水 1,500 c.c.，以免膀胱脹滿，並維持尿液呈鹼性","每日約 1,000 c.c. 水分，使尿液排出量維持在 500 c.c. 以上，並維持尿液呈鹼性","每日約 5,000 c.c. 水分，使尿液排出量維持在 4,000 c.c. 以上，並維持尿液呈酸性"],"a":"A","k":"A","t":"","x":"導尿注意事項：鼓勵病人每日攝取約 3,000 c.c. 的水分，使尿液排出量維持在 2,000 c.c. 以上，維持尿液呈酸性，減少泌尿道感染的機會。"},{"i":"b11-3","e":"","n":0,"c":6,"s":"導尿管插入的深度，成年男性與女性分別約為多少？","o":["男性與女性皆約 10 公分","男性約 5 公分；女性約 20 公分","男性約 7.5～10 公分；女性約 2.5～3.75 公分","男性約 20 公分；女性約 5 公分"],"a":"D","k":"D","t":"","x":"導尿管插入深度：男病人約 20 公分；女病人約 5 公分（肛管才是成人 7.5～10 公分）。"},{"i":"b11-4","e":"","n":0,"c":6,"s":"單次導尿法一次導出的尿液量不可多於多少？","o":["200 c.c.","300 c.c.","500 c.c.","1,500 c.c."],"a":"C","k":"C","t":"","x":"單次導尿法：導出的尿液一次不可多於 500 c.c.，以防腹壓快速下降而造成休克。"},{"i":"b11-5","e":"","n":0,"c":6,"s":"單次導尿一次導出過多尿液，可能造成什麼後果？","o":["腹壓快速下降而造成休克","尿道狹窄而造成排尿困難","膀胱破裂而造成腹膜炎","逼尿肌肥大而造成尿瀦留"],"a":"A","k":"A","t":"","x":"一次導出尿液過多，腹壓快速下降，可能造成休克。"},{"i":"b11-6","e":"","n":0,"c":6,"s":"固定存留導尿管氣囊時，正確的作法為何？","o":["以空針抽取 50 c.c. 無菌生理食鹽水，注入 30～50 c.c. 於固定氣囊中","以空針抽取 10 c.c. 無菌蒸餾水，注入 5～10 c.c. 於固定氣囊中","以空針抽取 20 c.c. 無菌蒸餾水，注入 15～20 c.c. 於固定氣囊中","以空針抽取 3 c.c. 無菌蒸餾水，注入 1～3 c.c. 於固定氣囊中"],"a":"B","k":"B","t":"","x":"固定導尿管氣囊：空針抽取 10 c.c. 無菌蒸餾水，注入 5～10 c.c. 於導尿管的固定氣囊中。"},{"i":"b11-7","e":"","n":0,"c":6,"s":"注入液體於氣囊時，病人感到疼痛，最適當的處置為何？","o":["繼續注入液體直到疼痛消失，使氣囊固定於尿道口","拔除導尿管並更換較大號導尿管，以減輕尿道刺激","暫不處理，觀察病人疼痛是否於 30 分鐘內自行緩解","回抽氣囊內的液體，將導尿管再向內推約 2 公分"],"a":"D","k":"D","t":"","x":"注入液體時病人疼痛，表示氣囊頂在尿道頸，尿道口受刺激使病人一直有尿意感，應回抽氣囊內的液體，將導尿管再向內推約 2 公分。"},{"i":"b11-8","e":"","n":0,"c":6,"s":"固定氣囊時注入過多液體，可能造成什麼問題？","o":["氣囊過大造成膀胱痙攣、膀胱損傷","氣囊過小造成導尿管容易滑出尿道","尿液回流至腎臟，造成腎盂腎炎","尿道括約肌鬆弛，造成持續滲尿"],"a":"A","k":"A","t":"","x":"避免注入過多液體於氣囊，以免氣囊過大造成膀胱痙攣、膀胱損傷。"},{"i":"b11-9","e":"","n":0,"c":6,"s":"為存留導尿管的氣囊注入液體時，病人感到疼痛且一直有尿意感，表示何種情形？","o":["導尿管的管徑選擇過小，而刺激了尿道壁","氣囊已順利進入膀胱內，並固定良好","氣囊內注入的液體量過少，致使氣囊鬆脫","氣囊頂在尿道頸，使尿道口受到刺激"],"a":"D","k":"D","t":"","x":"注入液體於氣囊時病人感到疼痛，表示氣囊頂在尿道頸，尿道口會受刺激使病人一直有尿意感；此時應回抽氣囊內的液體，將導尿管再向內推約 2 公分。"},{"i":"b11-10","e":"","n":0,"c":6,"s":"留置導尿管意外滑出尿道口至體外，正確的處理為何？","o":["消毒後將原導尿管重新插回","回抽氣囊液體後直接推入","以膠帶固定於原位並觀察","需更換新的導尿管"],"a":"D","k":"D","t":"","x":"若導尿管滑出尿道口至體外，需更換新的導尿管（維持無菌）。"},{"i":"b11-11","e":"","n":0,"c":6,"s":"留置導尿管的日常照護，下列何者正確？","o":["每日打開尿袋接頭沖洗管路，以保持引流通暢及清潔","每日執行導尿管護理及會陰沖洗，維持尿管密閉性及通暢","將導尿管盤繞壓在大腿下固定，以避免尿管被牽扯滑出","為避免刺激尿道口，減少導尿管護理與會陰沖洗的次數"],"a":"B","k":"B","t":"","x":"存留導尿：每日執行導尿管護理及會陰沖洗、維持尿管密閉性及通暢；勿扭曲、牽扯或壓到導尿管。"},{"i":"b11-12","e":"","n":0,"c":6,"s":"留置導尿管期間，勿扭曲、牽扯或壓到導尿管，主要是為了防止下列何種情形？","o":["尿液比重上升、尿液顏色明顯變深","尿道口受傷、導尿管脫出或阻塞","膀胱失去張力、喪失排尿控制能力","氣囊內的蒸餾水逐漸蒸發而縮小"],"a":"B","k":"B","t":"","x":"存留導尿法：勿扭曲、牽扯或壓到導尿管，以防止尿道口受傷、導尿管脫出或阻塞，或是尿袋與尿管的接合處鬆脫。"},{"i":"b11-13","e":"","n":0,"c":6,"s":"留置導尿病人因尿道疲乏鬆弛而滲尿，處理方式為何？","o":["拔除休息一段時間後再重新置放","更換較小號導尿管並減少氣囊水量","增加氣囊內的液體量並拉緊固定","持續加壓固定導尿管於大腿內側"],"a":"A","k":"A","t":"","x":"滲尿原因與處理：放置不當→重新更換；腹壓增加→避免腹部用力；牽扯導尿管→避免；尿道疲乏鬆弛→拔除休息一段時間後重新置放；逼尿肌過度收縮→使用藥物控制。"},{"i":"b11-14","e":"","n":0,"c":6,"s":"留置導尿病人因「膀胱逼尿肌過度收縮」而滲尿，處理方式為何？","o":["縮短蓄尿袋更換間隔","重新置放較大號導尿管","使用藥物控制","增加腹部用力"],"a":"C","k":"C","t":"","x":"膀胱逼尿肌過度收縮造成滲尿：使用藥物控制。"},{"i":"b11-15","e":"","n":0,"c":6,"s":"留置導尿病人發生滲尿時，下列「原因與處理」的配對，何者正確？","o":["放置不當：重新更換導尿管；腹壓增加：避免腹部用力之姿勢或動作","放置不當：使用藥物控制；腹壓增加：重新更換導尿管","放置不當：避免腹部用力之姿勢或動作；腹壓增加：使用藥物控制","放置不當：加大氣囊內的液體量；腹壓增加：拔除休息一段時間後再重新置放"],"a":"A","k":"A","t":"","x":"滲尿常見原因與處理：放置不當→重新更換導尿管；腹壓增加→避免腹部用力之姿勢或動作；牽扯導尿管（講義只列為原因）；尿道疲乏鬆弛→拔除休息一段時間後再重新置放；膀胱逼尿肌過度收縮→使用藥物控制。"},{"i":"b11-16","e":"","n":0,"c":6,"s":"下列何者『不是』泌尿護理的評值項目？","o":["重建病人的排尿模式並預防泌尿道感染","維持皮膚的完整性及腎功能正常","病人了解正常排尿型態和尿液的特性","病人須長期留置導尿管以取代自行排尿"],"a":"D","k":"D","t":"","x":"泌尿護理評值：病人了解正常排尿型態和尿液的特性、能正常排尿且排尿後餘尿量少於 50 c.c.、重建排尿模式、維持皮膚的完整性、維持腎功能正常、預防泌尿道感染；長期留置導尿管會使膀胱失去張力、喪失控制排尿能力，應避免。"},{"i":"b11-17","e":"","n":0,"c":6,"s":"蓄尿袋應每隔多久或積尿至多少時排空？","o":["每隔 1 小時，或滿 1/10 時","每隔 48 小時，或滿 3/4 時","每隔 24 小時，或裝滿時","每隔 8 小時，或滿 1/2～2/3 時"],"a":"D","k":"D","t":"","x":"蓄尿袋每隔 8 小時應排空一次，或滿 1/2～2/3 時應排空，以免過多尿液發生逆流而造成感染。"},{"i":"b11-18","e":"","n":0,"c":6,"s":"留置導尿病人下床活動時，蓄尿袋的正確放置方式為何？","o":["固定於腿上或用手提，位置低於膀胱","高舉過頭或高於膀胱以利尿液引流","掛在點滴架上，位置需高於膀胱以利引流","夾住尿袋開口，放在床上與膀胱同高處"],"a":"A","k":"A","t":"","x":"當病人下床活動時，蓄尿袋可固定於腿上或用手提，位置需低於膀胱，以免尿液回流引起感染。"},{"i":"b11-19","e":"","n":0,"c":6,"s":"留置導尿病人的蓄尿袋開口，平時應如何處理？","o":["應每小時開啟一次，以排出袋內空氣","應以無菌紗布覆蓋，並保持開放引流","應隨時關閉，以免蓄尿袋受到污染","應保持開放，使尿液持續順暢流出"],"a":"C","k":"C","t":"","x":"蓄尿袋護理：蓄尿袋開口應隨時關閉，以免受到污染。"},{"i":"b11-20","e":"","n":0,"c":6,"s":"下列何者『不是』膀胱灌洗的目的？","o":["維持尿液引流系統通暢","抑制發炎","補充體液與電解質","清潔膀胱，沖出結石或膿"],"a":"C","k":"C","t":"","x":"膀胱灌洗目的：清潔膀胱（將異物如結石或膿沖洗出體外）、抑制發炎、維持尿液引流系統通暢、用藥治療、訓練膀胱功能。"},{"i":"b11-21","e":"","n":0,"c":6,"s":"下列何者屬於膀胱灌洗的目的？","o":["取得無菌的尿液培養標本","用藥治療及訓練膀胱功能","降低血鉀及血中尿素氮濃度","測量排尿後的餘尿量"],"a":"B","k":"B","t":"","x":"膀胱灌洗目的：清潔膀胱（將異物如結石或膿沖洗出體外）、抑制發炎、維持尿液引流系統通暢、用藥治療、訓練膀胱功能。"},{"i":"b11-22","e":"","n":0,"c":6,"s":"進行密閉式持續性膀胱灌洗，最適合使用何種導尿管？","o":["二路導尿管","三路導尿管","單路導尿管","肛管"],"a":"B","k":"B","t":"","x":"三路導尿管可用於密閉之持續性或間歇性膀胱灌洗。"},{"i":"b11-23","e":"","n":0,"c":6,"s":"膀胱灌洗最常使用的溶液為何？","o":["50% 葡萄糖水","0.2% 肥皂水","蒸餾水","生理食鹽水（等張）"],"a":"D","k":"D","t":"","x":"生理食鹽水（等張）為最常用的灌洗溶液。"},{"i":"b11-24","e":"","n":0,"c":6,"s":"膀胱灌洗時，灌洗溶液的液面需高出膀胱約多少公分？","o":["15～20 公分","30～45 公分","45～60 公分","75～90 公分"],"a":"D","k":"D","t":"","x":"灌洗溶液之液面需高出膀胱約 75～90 公分。"},{"i":"b11-25","e":"","n":0,"c":6,"s":"膀胱灌洗每次灌入的量，以不超過多少為宜？","o":["100 c.c.","200 c.c.","300 c.c.","500 c.c."],"a":"C","k":"C","t":"","x":"灌洗總量通常在 1,000～5,000 c.c.，每次灌入不超過 300 c.c. 為宜（250 c.c. 有輕度尿意感）。"},{"i":"b11-26","e":"","n":0,"c":6,"s":"膀胱灌洗後，灌入的溶液如何引流出來？","o":["利用虹吸法","以幫浦加壓抽吸","自然蒸發吸收","以手用力按壓膀胱擠出"],"a":"A","k":"A","t":"","x":"利用虹吸法，將灌入之量引流出來。"},{"i":"b11-27","e":"","n":0,"c":6,"s":"膀胱灌洗的溶液及管路，更換頻率為何？","o":["每 2 小時一次","每 8 小時一次","每天一次","每週一次"],"a":"C","k":"C","t":"","x":"嚴格執行外科無菌技術，灌洗溶液及管路每天更換一次。"},{"i":"b11-28","e":"","n":0,"c":6,"s":"以 50 c.c. 空針接導尿管執行簡易膀胱灌洗，每次直接灌入的量約為多少？","o":["5～10 c.c.","30～50 c.c.","100～150 c.c.","300～500 c.c."],"a":"B","k":"B","t":"","x":"小量灌洗或簡易灌洗，可以使用 50 c.c. 空針接導尿管，每次直接灌入 30～50 c.c. 的灌洗液再抽出，來回灌洗。p.101、p.104"},{"i":"b11-29","e":"","n":0,"c":6,"s":"膀胱灌洗時應避免將空氣灌入，主要原因為何？","o":["以免導尿管氣囊破裂","以免溶液變質","以免造成膀胱脹氣不適","以免尿液顏色改變"],"a":"C","k":"C","t":"","x":"灌洗時避免將空氣灌入，以免脹氣不適。"},{"i":"b11-30","e":"","n":0,"c":6,"s":"膀胱灌洗的「灌洗總量」通常為多少？","o":["100～300 c.c.","300～800 c.c.","1,000～5,000 c.c.","10,000～20,000 c.c."],"a":"C","k":"C","t":"","x":"灌洗總量通常在 1,000～5,000 c.c.，每次灌入不超過 300 c.c. 為宜（比較表：結腸灌洗總量為 4,000～40,000c.c.）。"},{"i":"b11-31","e":"","n":0,"c":6,"s":"泌尿護理的評值指標中，排尿後餘尿量應為何？","o":["介於 100～200 c.c.","多於 500 c.c.","介於 300～400 c.c.","少於 50 c.c."],"a":"D","k":"D","t":"","x":"護理評值：病人能正常排尿且排尿後餘尿量少於 50 c.c.。"},{"i":"b11-32","e":"","n":0,"c":6,"s":"肛管與導尿管的「潤滑長度」，下列配對何者正確？","o":["肛管 2.5～3.75 公分；男病人導尿管 7.5～10 公分；女病人導尿管 1～1.5 公分","肛管 5～10 公分；男病人導尿管 17.5～20 公分；女病人導尿管 5～7 公分","肛管 17.5～20 公分；男病人導尿管 5～10 公分；女病人導尿管 5～7 公分","肛管 5～7 公分；男病人導尿管 5～10 公分；女病人導尿管 17.5～20 公分"],"a":"B","k":"B","t":"","x":"比較表：潤滑長度—肛管 5～10 公分（2～4 吋）；導尿管男病人 17.5～20 公分（8 吋）、女病人 5～7 公分（2吋）。"},{"i":"b11-33","e":"","n":0,"c":6,"s":"依比較表，成人肛管與導尿管的尺寸，下列何者正確？","o":["肛管 22～24 Fr.；男性導尿管 16～18 Fr.；女性導尿管 14～16 Fr.","肛管 10 Fr.；男性導尿管 14～16 Fr.；女性導尿管 16～18 Fr.","肛管 14～16 Fr.；男性導尿管 22～24 Fr.；女性導尿管 16～18 Fr.","肛管 16～18 Fr.；男性導尿管 22～24 Fr.；女性導尿管 22～24 Fr."],"a":"A","k":"A","t":"","x":"比較表：成人肛管 22～24 Fr.；成人男病人導尿管 16～18 Fr.、女病人 14～16 Fr.。"},{"i":"b11-34","e":"","n":0,"c":6,"s":"下列何種灌洗法，溶液液面需距離「膀胱」75～90 公分，且每次灌入不超過 300 c.c.？","o":["結腸灌洗","大量灌腸","連續性膀胱灌洗","小量灌腸"],"a":"C","k":"C","t":"","x":"比較表：連續性膀胱灌洗—液面至膀胱 75～90 公分（30～36 吋）、37.8～41°C、總量 1,000～5,000 c.c.、每次灌入不超過 300 c.c.。"},{"i":"b11-35","e":"","n":0,"c":6,"s":"依比較表，膀胱灌洗的灌洗溶液溫度宜為何？","o":["20～25°C（68～77°F）","37.8～41°C（100～105°F）","41～43°C（105～110°F）","45～50°C（113～122°F）"],"a":"B","k":"B","t":"","x":"比較表：連續性膀胱灌洗與簡易膀胱灌洗的液體溫度皆為 37.8～41°C（100～105°F）；大量灌腸與結腸灌洗則為41～43°C（105～110°F）。"},{"i":"gch0-0","e":"","n":0,"c":0,"s":"執行護理技術的目標，下列何者不包括在內？","o":["健康促進及預防疾病","協助病人恢復健康","以醫療團隊作業便利為優先考量","減輕病人的痛苦"],"a":"C","k":"C","t":"","x":"執行護理技術的三大目標為健康促進及預防疾病、協助病人恢復健康、減輕病人的痛苦，皆以病人為中心。以醫療團隊作業便利為優先考量並非護理技術的目標，且違背以病人福祉為核心的原則。"},{"i":"gch0-1","e":"","n":0,"c":0,"s":"護理師為新入院病人進行面談，並藉由觀察及身體檢查仔細收集資料，以確立其護理需求。此屬於執行護理技術時的哪一種技能？","o":["評估技能（Assessment Skill）","關懷技能（Caring Skill）","諮詢技能（Counseling Skill）","舒適技能（Comforting Skill）"],"a":"A","k":"A","t":"","x":"評估技能是仔細收集資料以評估病人的護理需求，方法包括面談、溝通、觀察及檢查。關懷技能重在使病人恢復或維持個別性的最佳功能；諮詢技能重在促進病人參與決策；舒適技能則為支持性護理，以建立信任、減輕害怕。"},{"i":"gch0-2","e":"","n":0,"c":0,"s":"護理師向第2型糖尿病病人及家屬說明胰島素注射與口服降血糖藥的優缺點，鼓勵他們提出疑問並由其自行決定照顧方式。此護理行為主要運用哪一種技能？","o":["諮詢技能","評估技能","舒適技能","關懷技能"],"a":"A","k":"A","t":"","x":"諮詢技能在於促進病人或家屬主動參與，並讓病人及家屬有權決定或選擇健康及疾病的照顧方式，本情境即屬之。評估技能為收集資料確立需求；舒適技能為支持性護理以減少害怕；關懷技能則著重恢復或維持個別性最佳功能。"},{"i":"gch0-3","e":"","n":0,"c":0,"s":"有關舒適技能（Comforting Skill）之敘述，下列何者正確？","o":["主要以面談、觀察及檢查來收集病人的健康資料","又稱支持性護理，可增進護病間信任並減少病人害怕","主要目的在讓病人及家屬有權選擇照顧的方式","著重於使病人恢復或維持其個別性的最佳功能"],"a":"B","k":"B","t":"","x":"舒適技能亦稱為支持性護理，能增進護理人員與病人之間的信任關係，進而減少病人的害怕與擔心。以面談、觀察、檢查收集資料屬評估技能；讓病人及家屬有權選擇照顧方式屬諮詢技能；恢復或維持個別性最佳功能屬關懷技能。"},{"i":"gch0-4","e":"","n":0,"c":0,"s":"有關醫療環境（health care environment）之敘述，下列何者正確？","o":["範圍僅限於各級醫院內的病房與加護單位","範圍包括各級醫療院所、護理之家、社區及家庭","目的只在協助病人恢復健康，不含促進健康","專指醫療院所的建築物、儀器及相關設備"],"a":"B","k":"B","t":"","x":"醫療環境是健康照護的治療性環境，讓病人在其中獲得協助以達恢復健康與促進健康的目的，範圍涵蓋各級醫療院所、療養院、護理之家、社區及家庭。故不僅限醫院病房，也不只指建築設備，且目的同時包含促進健康。"},{"i":"gch0-5","e":"","n":0,"c":0,"s":"下列何者不屬於醫療環境中的「物理環境」？","o":["空氣中的微生物","病室的光線","環境的氣壓","室內的溼度"],"a":"A","k":"A","t":"","x":"物理環境包括建築物、光線、聲音、溫度、溼度、氣壓等；微生物則歸屬於生物環境。因此光線、氣壓、溼度皆為物理環境的要素，只有空氣中的微生物不屬於物理環境。"},{"i":"gch0-6","e":"","n":0,"c":0,"s":"一般而言，人體感覺較適宜的室內溫度範圍為何？","o":["20～23.8℃（68～75℉）","24～26℃（75～79℉）","26～28℃（79～82℉）","28～30℃（82～86℉）"],"a":"A","k":"A","t":"","x":"人體感覺較適宜的室溫為20～23.8℃（68～75℉），再依年齡、病情及環境作調整。其餘選項溫度偏高，一般人久處其中易感覺悶熱，並非一般病室的適宜室溫，只有特殊族群（如嬰幼兒、老人）才需比一般室溫稍高。"},{"i":"gch0-7","e":"","n":0,"c":0,"s":"82歲的林爺爺住院後常向護理師抱怨病房太冷，下列解釋與處置何者最適當？","o":["老人基礎代謝率增加導致散熱較快，室溫應比一般稍低","老人體溫調節中樞尚未發育完全，應維持一般室溫即可","老人對冷的感覺多屬心理因素，應先轉介身心科評估","老人體溫調節中樞功能退化較易覺冷，室溫可比一般稍高"],"a":"D","k":"D","t":"","x":"老人因體溫調節中樞功能退化，較易覺得冷，故室溫需比一般室溫稍高。「體溫調節中樞尚未發育完全」是嬰幼兒的原因；老人並非代謝率增加，代謝率增加者（如發高燒、甲狀腺機能亢進）才需較低室溫；將其歸為心理因素並不恰當。"},{"i":"gch0-8","e":"","n":0,"c":0,"s":"下列哪一位病人的病室溫度宜調整得比一般室溫稍低？","o":["出生3個月因肺炎住院的嬰兒","甲狀腺機能亢進、心悸多汗的病人","85歲髖關節置換術後的老人","2歲因腸胃炎住院的幼兒"],"a":"B","k":"B","t":"","x":"燙傷、發高燒或甲狀腺機能亢進病人因新陳代謝率（B.M.R.）增加，較低的室溫可促進舒適。嬰幼兒體溫調節中樞未發育完全、老人體溫調節中樞功能退化，兩者皆易覺冷，室溫反而需比一般稍高。"},{"i":"gch0-9","e":"","n":0,"c":0,"s":"依「醫療機構設置標準」，手術室、產房、加護病房及嬰兒室等單位的室溫應維持在多少範圍？","o":["攝氏16～20℃","攝氏18～24℃","攝氏20～28℃","攝氏24～30℃"],"a":"C","k":"C","t":"","x":"「醫療機構設置標準」明定手術室、產房、加護病房、嬰兒室等單位應維持室溫攝氏20～28℃，並維持良好空調以減少空氣中微生物數量，降低病人與醫護人員感染風險。16～20℃過低、24～30℃上限過高，皆不符規定。"},{"i":"gch0-10","e":"","n":0,"c":0,"s":"溼度會影響人體對冷熱的耐受力，一般最適宜健康的相對溼度為何？","o":["10～20％","20～30％","30～40％","40～60％"],"a":"D","k":"D","t":"","x":"最適宜健康的相對溼度為40～60％，溼度太高或太低都會使人感到不適。10～20％是氣喘病人適用的低溼度，並非一般人的適宜溼度；20～40％偏乾，易造成口鼻黏膜及皮膚乾燥不適。"},{"i":"gch0-11","e":"","n":0,"c":0,"s":"陳先生因氣喘急性發作住院，有關其病室溼度的調整，下列何者最適當？","o":["調高至80％左右，以濕潤呼吸道並稀釋痰液","維持一般的40～60％，不需特別調整溼度","調高至50～80％，以避免室內產生靜電","調低至10～20％，因溼度過高易誘發氣喘發作"],"a":"D","k":"D","t":"","x":"氣喘病人的病室溼度應比一般低，以10～20％為宜，因溼度過高易使氣喘發作。80％溼度適用於支氣管炎及呼吸道傳染病病人；40～60％是一般人的適宜溼度；50～80％為手術室防靜電的溼度標準。"},{"i":"gch0-12","e":"","n":0,"c":0,"s":"5歲的小明因急性支氣管炎住院，咳嗽頻繁、呼吸速率加快並主訴口鼻乾燥，其病室溼度宜維持約多少？","o":["10～20％","30％","80％","40～60％"],"a":"C","k":"C","t":"","x":"支氣管炎或呼吸道傳染病病人因咳嗽、呼吸速率變快，口鼻黏膜易乾燥不適，溼度應比一般高，以80％為宜。10～20％是氣喘病人的建議溼度；30％過於乾燥；40～60％是一般人的適宜溼度，不足以改善黏膜乾燥。"},{"i":"gch0-13","e":"","n":0,"c":0,"s":"手術室的溼度宜調高並維持在50～80％，其主要目的為何？","o":["減少空氣中的微生物數量以預防術後感染","減少病人麻醉期間經由皮膚散失的體熱","防止空氣太乾燥增強靜電形成而產生火花","保持手術器械潤濕以延長器械使用壽命"],"a":"C","k":"C","t":"","x":"手術室溼度宜調高至50～80％，主要在防止因空氣太乾燥而增強靜電形成，導致火花產生的危險。減少空氣中微生物數量是維持良好空調的目的；預防體熱散失與器械潤濕並非調高溼度的主要理由。"},{"i":"gch0-14","e":"","n":0,"c":0,"s":"王太太接受白內障摘除手術後返回病房，有關其病室光線的安排，下列何者最適當？","o":["開啟全部照明以利觀察","室內光線宜調整得稍暗","拉開窗簾讓陽光照入室內","床頭燈直接照向病人臉部"],"a":"B","k":"B","t":"","x":"病人單位的光線強度需依病情、工作性質及病人習慣調整，接受眼科手術的病人，室內光線宜稍暗，以減少對眼睛的刺激。開啟全部照明、讓陽光照入或燈光直射臉部，都會使術後眼睛受到過強光線刺激而不適。"},{"i":"gch0-15","e":"","n":0,"c":0,"s":"慣用左手的護理師在護理站書寫護理紀錄，檯燈最適宜放置在何處？","o":["左後上方","左前上方","右後上方","右前下方"],"a":"C","k":"C","t":"","x":"光源應來自非慣用手的後上方，避免書寫時手部陰影遮住工作區。慣用左手者的非慣用手為右手，故檯燈宜置於右後上方。左後上方是慣用右手者的位置；光源來自前方則易產生眩光並影響視線。"},{"i":"gch0-16","e":"","n":0,"c":0,"s":"有關提供病人單位充足光線的措施，下列何者錯誤？","o":["老人居住的室內光線宜稍暗，以利其休息睡眠","角落、樓梯間及洗手間應裝置適當亮度的燈光","協助病人至室外或日光室晒太陽以促進身心舒適","執行護理活動時，以自然或人工光線提供足夠照明"],"a":"A","k":"A","t":"","x":"老人居住的室內光線宜明亮，以防老人跌倒，故「宜稍暗」錯誤。在角落、樓梯間及洗手間裝置適當亮度燈光可防跌倒；至室外或日光室晒太陽可促進身心舒適；執行護理活動時需有充分光線，皆屬正確措施。"},{"i":"gch0-17","e":"","n":0,"c":0,"s":"有關病室空氣調節的方法，下列何者正確？","o":["空調設備的空氣流動率應保持在10～80立方呎／分","病人出院後，以刺鼻味強的清潔劑徹底消毒病人單位","為維持室溫穩定，病室宜門窗緊閉並減少空氣交換","訪客可在病房陽台吸菸，以免影響室內空氣品質"],"a":"A","k":"A","t":"","x":"利用空調使室內與外界空氣持續交換，一般適當的空氣流動率應保持在10～80立方呎／分。病人出院後雖應徹底清潔，但應避免刺鼻味的清潔劑；病室需持續換氣而非門窗緊閉；醫院內禁止吸菸，應請病人及訪客配合。"},{"i":"gch0-18","e":"","n":0,"c":0,"s":"有關醫院噪音之敘述，下列何者正確？","o":["計算噪音的單位是赫茲（Hz），數值越大越吵","醫院內各單位科別的噪音量標準均完全相同","持續時間很短的聲音，不論多大都不致損傷聽力","噪音指不悅耳或足以引起心理、生理不愉快的聲音"],"a":"D","k":"D","t":"","x":"噪音是指不悅耳或足以引起人們心理、生理上不愉快的聲音，計算單位是分貝（dB），而非赫茲。醫院環境的噪音量因單位科別不同而有差異；突發性強大噪音頻率高、音量大，即使時間短也足以造成聽力損失。"},{"i":"gch0-19","e":"","n":0,"c":0,"s":"長期暴露於超過多少分貝以上的噪音，就會造成聽力傷害，並出現血壓升高、易怒等症狀？","o":["55分貝","65分貝","75分貝","85分貝"],"a":"D","k":"D","t":"","x":"長期暴露於超過85分貝以上的噪音，就會造成聽力傷害及血壓高、易怒等症狀。噪音危害程度還取決於音量、頻率、持續暴露時間與個人耐受性；55～75分貝雖可能干擾休息，但不是造成聽力傷害的界限值。"},{"i":"gch0-20","e":"","n":0,"c":0,"s":"噪音對人體危害的程度，需視下列哪些因素而定？①音量的高低 ②頻率的高低 ③持續暴露的時間 ④個人的耐受性 ⑤聲音是否來自醫療儀器","o":["①②③④","①②③","②③⑤","①③④⑤"],"a":"A","k":"A","t":"","x":"噪音危害的程度需視音量高低、頻率高低、持續暴露時間及個人耐受性而定，即①②③④。聲音是否來自醫療儀器與危害程度無關，只要音量大、頻率高或暴露時間長，不論聲源為何皆可能造成傷害，故⑤不屬之。"},{"i":"gch0-21","e":"","n":0,"c":0,"s":"手術室的被單及手術衣多採用藍綠色調，主要是因為此顏色具有何種作用？","o":["具興奮刺激作用","可使注意力集中","可使注意力分散","讓人感到溫馨"],"a":"B","k":"B","t":"","x":"藍綠色可使注意力集中，故手術室的被單和手術衣多採用此色調。具興奮刺激作用的是黃色；使注意力分散的是鮮紅色；讓人感到溫馨、降低焦慮的是粉紅色系，多用於產兒科病房。"},{"i":"gch0-22","e":"","n":0,"c":0,"s":"精神科病房欲為憂鬱症病人布置團體活動室，牆面主色調宜選擇下列何者？","o":["黃色","灰色","藍色","藍綠色"],"a":"A","k":"A","t":"","x":"黃色具興奮刺激的作用，對於憂鬱症患者有療效，適合用於其活動空間。灰色或藍色具鎮靜安撫效果，較適合躁動不安者；藍綠色可使注意力集中，多用於手術室，皆不符合提振憂鬱症病人情緒的需要。"},{"i":"gch0-23","e":"","n":0,"c":0,"s":"有關病房環境顏色的選擇，下列敘述何者錯誤？","o":["灰色或藍色具有鎮靜安撫的效果","粉紅色系令人溫馨，可降低產婦焦慮","鮮紅色可使注意力集中，適合加護病房使用","黃色具興奮刺激作用，對憂鬱症有療效"],"a":"C","k":"C","t":"","x":"鮮紅色會使注意力分散，並非使注意力集中，使注意力集中的是藍綠色，故該敘述錯誤。灰或藍色具鎮靜安撫效果；粉紅色系讓人感到溫馨並降低焦慮，多用於產兒科；黃色具興奮刺激作用，對憂鬱症有療效。"},{"i":"gch0-24","e":"","n":0,"c":0,"s":"有關醫院中病人跌倒的敘述，下列何者正確？","o":["最容易發生跌倒的時間是在中午用餐時","最常發生跌倒的地點為護理站前的走廊","跌倒在醫院意外事件中僅占少數比例","最容易發生跌倒的時間是在晚上及清晨"],"a":"D","k":"D","t":"","x":"跌倒是醫院中最常見的機械性傷害，約占醫院意外事件的89％；最容易發生於晚上及清晨，最常發生的地點是輪椅、床或床旁椅，以及浴廁和樓梯。中午用餐時間與護理站前走廊並非好發的時間與地點。"},{"i":"gch0-25","e":"","n":0,"c":0,"s":"下列住院病人中，何者發生跌倒的危險性最低？","o":["30歲因手部擦傷住院觀察、意識清楚且行動自如者","腦中風後左側半身麻痺的55歲病人","有姿位性低血壓、起身時常眩暈的病人","意識紊亂、記憶受損的失智症病人"],"a":"A","k":"A","t":"","x":"易跌倒病人包括感覺功能損傷（如半身麻痺）、身體狀況改變（如眩暈、姿位性低血壓）、認知功能問題或精神狀態改變（如意識紊亂、記憶受損）者。30歲、意識清楚、行動自如且無上述情形者，跌倒危險性最低。"},{"i":"gch0-26","e":"","n":0,"c":0,"s":"住院病人服用下列哪些藥物時，護理師應特別加強跌倒的預防？①降血糖藥 ②抗生素 ③瀉劑 ④鎮靜劑 ⑤制酸劑","o":["①②⑤","②③⑤","①②③","①③④"],"a":"D","k":"D","t":"","x":"易致跌倒的藥物包括降血壓藥、降血糖藥、利尿劑、瀉劑、鎮靜劑及麻醉劑等，可能引起低血糖、頻繁如廁、姿位性低血壓或意識改變，故為①③④。抗生素與制酸劑一般不會直接增加跌倒風險，不屬於此類藥物。"},{"i":"gch0-27","e":"","n":0,"c":0,"s":"病房走廊地面需要清潔時，下列哪一種做法最能預防病人跌倒？","o":["先拖一半，待乾燥後再拖另一半","一次將整條走廊拖完以縮短時間","於清晨病人仍在睡覺時全面濕拖","拖完後開窗通風，不需另外設置標示"],"a":"A","k":"A","t":"","x":"維持地面清潔與乾燥時，拖地應先拖一半，等乾燥後再拖另一半，讓病人始終有乾燥通道可走；若地面潮溼需設置警示標誌。整條走廊一次拖完會使地面全面潮溼；清晨本是跌倒好發時段；未設標示則無法提醒病人。"},{"i":"gch0-28","e":"","n":0,"c":0,"s":"有關病房浴廁的安全設置，下列何者錯誤？","o":["走廊、浴室及洗手間應裝設扶手","浴廁需加裝止滑設施及叫人鈴","浴室門口放一地毯，以減少地面潮溼","放置可移動的輕便塑膠椅，方便病人調整位置"],"a":"D","k":"D","t":"","x":"浴廁應加裝止滑設施、叫人鈴及「固定」的洗澡椅，使用可移動的椅子易滑動而造成跌倒，故錯誤。走廊、浴室及洗手間裝設扶手並鼓勵病人握住；浴室門口放地毯可減少地面潮溼，皆為正確的預防措施。"},{"i":"gch0-29","e":"","n":0,"c":0,"s":"張先生因頭部外傷意識紊亂，頻頻拉扯鼻胃管及點滴，有關使用約束的敘述，下列何者正確？","o":["約束屬護理獨立性功能，護理師可自行決定實施","需有醫囑，並視情況約束以防跌落及管路被扯落","約束可作為病人不配合治療時的處罰方式","只要已拉起床欄，即可完全取代約束的需要"],"a":"B","k":"B","t":"","x":"適當約束需有醫囑；如頭部受傷而意識紊亂的病人，需視情況加以約束，以防跌落及扯落鼻胃管或點滴而造成損傷。約束並非護理獨立功能，更不可作為處罰；床欄雖能防跌落，但無法防止病人拉扯管路。"},{"i":"gch0-30","e":"","n":0,"c":0,"s":"聽力及視力退化的李奶奶住院，有關她常用的眼鏡、助聽器、柺杖與便盆，下列安排何者最適當？","o":["置於病人容易取用之處","收入床旁櫃內以防遺失","交由護理站統一保管","由家屬帶回家中保管"],"a":"A","k":"A","t":"","x":"使用安全防護措施時，應將常用物品如眼鏡、助聽器、柺杖、便盆等置於病人易取之處，避免其為拿取物品而起身或伸手過度導致跌倒。收入櫃內、交護理站或家屬保管，都使病人需要時無法即時取得，反增跌倒風險。"},{"i":"gch0-31","e":"","n":0,"c":0,"s":"未執行治療時，為預防病人起身時跌倒，病床高度宜如何調整？","o":["調整至與護理師腰部同高以方便照護","調至最高，避免病人自行下床而跌倒","依病人喜好調整，高度不影響安全性","降至病人坐於床緣時兩腳可著地的高度"],"a":"D","k":"D","t":"","x":"不做治療時，病床高度應降至病人坐於床緣時兩隻腳可著地，以防起身時因反作用力前傾而跌倒。調至護理師腰部高度是執行治療時的工作高度；床面調高反而使病人下床落差變大，更易跌倒受傷。"},{"i":"gch0-32","e":"","n":0,"c":0,"s":"吳先生術後第一天首次下床，護理師協助其下床活動的方式，下列何者最適當？","o":["鼓勵病人一次快速起身，以縮短疼痛時間","直接扶病人站立後立即行走以促進循環","依坐起→站立→行走的順序漸進，動作放慢","先讓病人站立片刻，再坐回床緣休息"],"a":"C","k":"C","t":"","x":"下床活動應採漸進式，依坐起→站立→行走的順序進行，動作宜放慢，並盡量有家屬或他人協助，以避免因姿位性低血壓而跌倒。快速起身或直接站立行走皆可能造成頭暈；先站再坐則順序顛倒。"},{"i":"gch0-33","e":"","n":0,"c":0,"s":"有關病人活動時的安全措施，下列何者錯誤？","o":["應隨時將病床或輪椅的腳輪固定住","可扶著點滴架或床旁桌當作行走時的支撐","體重計加裝扶手，或於底部加裝止滑墊","乘坐輪椅及嬰兒推車時應給予適當固定"],"a":"B","k":"B","t":"","x":"應避免使用會傾斜或可能滑動的家具或設備作為支撐，點滴架與床旁桌皆有輪子易滑動，不可當作行走支撐，故錯誤。隨時固定床輪及輪椅腳輪、體重計加裝扶手或止滑墊、乘坐輪椅與推車時適當固定，皆為正確措施。"},{"i":"gch0-34","e":"","n":0,"c":0,"s":"針對經評估為高危險性跌倒的病人，下列措施何者最適當？","o":["為避免病人被標籤化，不告知家屬其跌倒風險","為確保安全，一律限制病人下床並給予約束","於病人單位插上高危險跌倒牌，或以手圈顏色標示","僅於交班時口頭提醒，不需其他明顯標示"],"a":"C","k":"C","t":"","x":"針對高危險性跌倒病人，可於病人單位插上高危險性跌倒的牌子，或於手圈上標示、以顏色區別，提醒家屬及醫護人員留意，並與病人及家屬討論預防方法。不告知家屬無法共同預防；約束需有醫囑，不可一律實施；只口頭提醒效果不足。"},{"i":"gch0-35","e":"","n":0,"c":0,"s":"王奶奶入院時，護理師進行預防跌倒的衛教，下列內容何者錯誤？","o":["建議穿著寬鬆加長的褲子，以保暖並保護下肢","詳細介紹病房周圍的環境","說明呼叫系統的使用方法，並放在適當位置","穿著平穩、防滑、厚底且大小適宜的鞋子"],"a":"A","k":"A","t":"","x":"應穿著大小合適的褲子，寬鬆加長的褲管易絆倒病人，故錯誤。入院時詳細介紹周圍環境、說明呼叫系統使用方法並放在適當位置，以及穿著平穩、防滑、厚底且大小適宜的鞋子，均為預防跌倒的正確衛教內容。"},{"i":"gch0-36","e":"","n":0,"c":0,"s":"氧氣貯存室、手術室及病人使用氧氣治療的附近多少範圍內，應有「嚴禁煙火」的警告標誌？","o":["3呎","6呎","12呎","20呎"],"a":"C","k":"C","t":"","x":"加強禁菸活動時，氧氣貯存室、手術室及病人使用氧氣治療附近12呎內，應有「嚴禁煙火」的警告標誌。氧氣具助燃性，範圍若僅3或6呎不足以確保安全；20呎並非規定的範圍。"},{"i":"gch0-37","e":"","n":0,"c":0,"s":"有關醫院預防火災的措施，下列何者錯誤？","o":["定期檢查電路，注意用電安全且不可超量用電","定期實施消防演練，熟悉病人搬運與疏散程序","規劃並標示火災逃生路線，並設置逃生輔助設施","為節省空間，可於太平門及走廊旁暫放備用物品"],"a":"D","k":"D","t":"","x":"定期安全檢查時應隨時保
