持緊急出口、太平門及走廊通暢，不可堆放物品阻礙逃生，故錯誤。定期檢查電路且不超量用電、定期實施消防演練、規劃並標示逃生路線及設置擔架、緩降器等逃生設施，皆為正確的預防措施。"},{"i":"gch0-38","e":"","n":0,"c":0,"s":"有關火災緊急應變RACE原則之敘述，下列何者正確？","o":["必須嚴格依照R→A→C→E的順序逐步執行","E是指評估（Evaluate）火災嚴重程度","C是指打開門窗，以利排出濃煙","不一定要依R→A→C→E的順序，需依當場情勢判斷"],"a":"D","k":"D","t":"","x":"RACE原則並非一定要照R→A→C→E的順序執行，仍需依當場情勢判斷。E是指滅火（Extinguish）或疏散（Evacuate），而非評估；C是侷限火勢（Contain），應關閉門窗、氧氣及電器設備，而非打開門窗。"},{"i":"gch0-39","e":"","n":0,"c":0,"s":"醫院火災時，有關護理師疏散病人的敘述，下列哪些正確？①能自行走動者應搭乘電梯迅速離開 ②搬運意識清醒的病人可採背扛法 ③不能走動者應留在原病房等待救援 ④體重較重的病人可採拖拉法","o":["①②","①③","③④","②④"],"a":"D","k":"D","t":"","x":"能自行走動者應遵循安全疏散路線離開火場，不可搭乘電梯；不能走動者應以床單、毛毯、輪椅、擔架等方式迅速送至安全區，不可留置等待。搬運意識清醒的病人可採背扛法，體重較重者可採拖拉法，故②④正確。"},{"i":"gch0-40","e":"","n":0,"c":0,"s":"護理師發現某病室起火，已將病人撤離並通報後，為「侷限火勢（Contain）」應採取下列何項措施？","o":["打開門窗以利濃煙排出","開啟空調送風以降低室溫","打開走廊防火門以利通行","關閉門窗、氧氣及電器設備"],"a":"D","k":"D","t":"","x":"侷限火勢是關閉門窗、氧氣及電器設備，將火域侷限在某一範圍內。打開門窗或開啟空調會引入空氣助長火勢並使煙火擴散；打開防火門則失去阻隔火煙的功能，皆不符合侷限火勢的原則。"},{"i":"gch0-41","e":"","n":0,"c":0,"s":"醫院中給錯藥物屬於何種傷害？目前許多醫院採用何種方法以確保病人用藥安全？","o":["機械性傷害；利用條碼技術（barcode）給藥","化學性傷害；利用條碼技術（barcode）給藥","化學性傷害；改由病人自行保管全部藥物","物理性傷害；由家屬負責核對藥名與劑量"],"a":"B","k":"B","t":"","x":"給錯藥物屬於化學性傷害，會危害病人健康、加重病情甚至威脅生命，醫護人員與藥劑師在給藥過程中應特別謹慎，目前許多醫院利用條碼技術給藥以確保用藥安全。機械性傷害代表為跌倒；由病人或家屬核對並非確保安全的方法。"},{"i":"gch0-42","e":"","n":0,"c":0,"s":"有關醫院放射線的安全管制措施，下列何者正確？","o":["照射劑量很小時，對病人與工作人員不具潛在危險","為避免造成民眾恐慌，輻射區不宜張貼警告標示","放射線治療室或X光攝影室可設於地下室，並以鉛牆遮蔽","放射線防護只需針對病人，工作人員不需特別防護"],"a":"C","k":"C","t":"","x":"醫院應做好遮蔽放射線的防護裝置（如鉛牆），或將放射線治療室、X光攝影室設在地下室，以減少對旁人的危害。不論病人或工作人員，只要暴露在放射線下，不管劑量多小都有潛在危險；有放射源的場所應有輻射警告標示。"},{"i":"gch0-43","e":"","n":0,"c":0,"s":"醫療廢棄物專用容器（如針頭回收筒）或垃圾桶，應於裝至何種程度時即綑紮或移除？","o":["二分之一滿","七分滿","八分滿","全滿"],"a":"C","k":"C","t":"","x":"醫療廢棄物專用容器（如針頭回收筒）或垃圾桶八分滿即應綑紮或移除。過早更換浪費容器資源；裝至全滿則封口困難，針頭等尖銳物易突出或溢出，增加針扎與感染風險。"},{"i":"gch0-44","e":"","n":0,"c":0,"s":"有關病人單位基本設備之敘述，下列何者正確？","o":["床旁椅宜小巧且無把手，以節省病室空間","病床較一般家用床高（約26吋），可調整高度並有床輪","床上桌僅供病人用餐，不宜作其他用途","病人單位的呼叫鈴直接連接至主治醫師辦公室"],"a":"B","k":"B","t":"","x":"病床較一般家用床高（約26吋），可調整上下高度並有床輪。床旁椅宜較寬大且有把手，使病人不易跌跤；床上桌可供呼吸困難者伏趴休息，以及坐於床上漱洗、用餐或書寫；呼叫鈴是連接護理站的訊號燈（對講機）。"},{"i":"gch0-45","e":"","n":0,"c":0,"s":"有關鋪床時維持病人安全舒適的原則，下列何者錯誤？","o":["床單應以正面接觸病人身體","鋪完床後應將床鋪維持在最高位置，以利下次操作","蓋單被的足部宜寬鬆，以免足部受壓或下垂","墊單需鋪得平整、緊固，以免背部受壓"],"a":"B","k":"B","t":"","x":"鋪完床後應將床鋪搖低、床輪固定好，以維護病人安全，維持高位易使病人跌落，故錯誤。床單以正面接觸病人；蓋單被足部宜寬鬆以免足部受壓或下垂；墊單鋪得平整緊固以免造成壓力性損傷，皆正確。"},{"i":"gch0-46","e":"","n":0,"c":0,"s":"護理師為臥床病人更換床單，需先將病人翻向其左側，護理師此時應站在何處？","o":["病人左側（欲翻向的那一側）床旁","病人右側（翻身後背對的一側）床旁","床頭處，以便同時照顧病人頭部","床尾處，以便觀察病人全身情形"],"a":"A","k":"A","t":"","x":"翻動病人時，護理師需站在欲翻向的那一側床旁，以保護病人避免跌落床下。站在對側時，病人翻向無人保護的一側，有跌落危險；站在床頭或床尾則無法有效扶持病人，也不利翻身的施力。"},{"i":"gch0-47","e":"","n":0,"c":0,"s":"鋪床時，下列哪些做法符合內科無菌原則？①拆床單時用力抖動以去除碎屑 ②拆下的髒床單勿碰到制服 ③髒床單可暫放在地板上 ④鋪床前後記得洗手","o":["①②","①③","②④","③④"],"a":"C","k":"C","t":"","x":"遵守內科無菌原則時，拆床單勿抖動以免散播微生物；髒床單勿碰到制服以免交互感染；勿將髒床單置於地板或其他病床上；鋪床前後要洗手。故②④正確，①抖動床單及③置於地板皆會造成微生物散播。"},{"i":"gch0-48","e":"","n":0,"c":0,"s":"護理師鋪床時，為維持正確姿勢以節省精力並避免受傷，下列何者錯誤？","o":["兩腳分開加大底面積，以彎曲膝關節調整工作高度","盡量使用背肌等小肌肉出力，以減少大肌肉疲乏","使用肘部而非肩部的力量，動作平穩且有節律","應面對工作方向，避免扭轉身體而造成拉傷"],"a":"B","k":"B","t":"","x":"應盡量利用大肌肉（如腹肌、臀肌）而非小肌肉（如背肌），以減少肌肉疲倦且較不易受傷，故錯誤。兩腳分開加大底面積並彎曲膝關節調整高度、使用肘部力量且動作平穩有節律、面對工作方向避免扭轉，皆為正確姿勢。"},{"i":"gch0-49","e":"","n":0,"c":0,"s":"護理師協助體重較重的臥床病人向床頭移位時，下列何種方式最能節省體力並避免扭傷？","o":["將病人整個抬起離開床面後再往床頭放下","以拉與滑動的方式，利用自身體重對抗病人重量","雙腳併攏、彎腰以背部力量將病人上提","扭轉上半身，以肩部力量將病人推向床頭"],"a":"B","k":"B","t":"","x":"移動病人時，應盡量使用拉與滑動的方式，並利用自己身體的重量來對抗病人的重量，以避免扭傷及節省體力。抬起病人較費力；雙腳併攏、彎腰使用背肌易受傷；扭轉身體易拉傷，且應使用肘部而非肩部力量。"},{"i":"gch1-0","e":"","n":0,"c":1,"s":"張先生入院時生命徵象皆在正常範圍，今晨10時測得口溫38.4℃，其餘數值正常。在無特殊醫囑下，護理師後續測量生命徵象的頻率，下列何者最適當？","o":["依病房常規每日測量2次即可","至少每4小時測量一次","每5～15分鐘測量一次","待體溫自行下降後再追蹤"],"a":"B","k":"B","t":"","x":"當生命徵象有一次或一次以上出現異常時，應至少每4小時測量一次，以追蹤變化。每日2次為生命徵象穩定時的常規頻率；每5～15分鐘適用於狀況不穩定或有急遽生理變化危險者；等體溫自行下降再測會延誤發現病情變化。"},{"i":"gch1-1","e":"","n":0,"c":1,"s":"李太太接受腹部手術返回病房後，血壓由130/80 mmHg急速降至86/50 mmHg，意識轉為嗜睡。此時護理師測量生命徵象的頻率，下列何者最適當？","o":["每5～15分鐘測量一次","每30分鐘測量一次","每1小時測量一次","每4小時測量一次"],"a":"A","k":"A","t":"","x":"病人狀況不穩定或有急遽生理變化的危險時，應每5～15分鐘測量一次生命徵象，以便及早發現惡化並處置。每30分鐘或每1小時間隔過長；每4小時是生命徵象曾出現異常但整體穩定時的最低頻率，不適用於血壓急降且意識改變的病人。"},{"i":"gch1-2","e":"","n":0,"c":1,"s":"夜班護理師測得病人血壓72/40 mmHg，因忙於其他工作而未通報醫師，直到早上交班才發現病人休克。此護理師的行為主要違反下列何種倫理原則？","o":["自主原則","公平原則","無傷害原則","誠實原則"],"a":"C","k":"C","t":"","x":"無傷害原則強調避免因疏忽或技術不成熟造成病人傷害，生命徵象值異常卻未及時向醫師反應正是典型違反情形。自主原則著重病人在充分了解下自行決定（知情同意）；公平原則與資源分配有關；誠實原則與據實告知有關，皆非本情境重點。"},{"i":"gch1-3","e":"","n":0,"c":1,"s":"有關核心溫度與體表溫度的敘述，下列何者正確？","o":["核心溫度是指皮膚及皮下組織的溫度","體表溫度較易隨外界環境冷熱而升降","核心溫度易隨環境溫度大幅波動","脂肪層的溫度屬於核心溫度"],"a":"B","k":"B","t":"","x":"體表溫度指皮膚、皮下組織及脂肪層的溫度，較易隨外界環境冷熱改變而升降。核心溫度是顱腔、胸腔、腹腔、骨盆腔等深部組織的溫度，相當恆定，不易隨環境大幅波動；皮膚、皮下組織與脂肪層皆屬體表溫度而非核心溫度。"},{"i":"gch1-4","e":"","n":0,"c":1,"s":"人體生理性體溫調節機轉中，負責整合訊息的「中央整合器」（體溫調節中樞）位於下列何處？","o":["延腦的呼吸中樞","橋腦","大腦皮質","下視丘的視前區"],"a":"D","k":"D","t":"","x":"體溫調節中樞即中央整合器，位於大腦下視丘的視前區（preoptic area），負責整合接受器傳來的冷熱訊息並啟動反應器。延腦與橋腦主要與呼吸節律調節有關；大腦皮質與意識性行為相關，並非體溫的中央整合器。"},{"i":"gch1-5","e":"","n":0,"c":1,"s":"有關體溫調節機轉的敘述，下列何者錯誤？","o":["溫度接受器僅分布於皮膚表層","皮膚的冷覺接受器數量多於熱覺接受器","反應器包括血管、骨骼肌及皮膚","天氣轉冷時主動添加衣物屬於行為調節"],"a":"A","k":"A","t":"","x":"溫度接受器除了皮膚外，還分布於腹部器官、脊柱及下視丘等處的神經終板，故「僅分布於皮膚」錯誤。冷覺接受器多於熱覺接受器，皮膚對冷較敏感；反應器為血管、骨骼肌、皮膚；依環境冷熱調整衣物受意識控制，屬行為調節機轉。"},{"i":"gch1-6","e":"","n":0,"c":1,"s":"人體散熱途徑中，經由呼氣及呼吸道蒸發作用所散失的熱量，約占總散熱量的多少？","o":["1%","15%","29%","70%"],"a":"C","k":"C","t":"","x":"經由呼氣及呼吸的蒸發作用散熱約占總散熱量29%。皮膚是最主要的散熱途徑，約占70%；唾液或大小便排出所釋放的熱量約1%；15%則是傳導散熱占的比例，與呼吸途徑無關。"},{"i":"gch1-7","e":"","n":0,"c":1,"s":"有關人體各種散熱方式與其約占熱能散失比例的配對，下列何者正確？","o":["傳導—20%","對流—15%","輻射—50～70%","蒸發—12%"],"a":"C","k":"C","t":"","x":"休息狀況下約有50～70%熱能由輻射散失，是皮膚散熱比例最高的方式。傳導約15%、對流約12%、蒸發約20%，選項中傳導、對流、蒸發的比例互相錯置。"},{"i":"gch1-8","e":"","n":0,"c":1,"s":"下列何者屬於「可察覺的蒸發」散熱？","o":["皮膚持續進行的水分蒸發","呼吸道黏膜的水分散失","口腔黏膜的水分蒸發","運動時的調節性出汗"],"a":"D","k":"D","t":"","x":"蒸發分為無感性蒸發與可察覺蒸發。流汗屬可察覺蒸發，調節性出汗可促進額外水分蒸發而具降溫作用。皮膚、呼吸道及口腔黏膜持續進行的水分蒸發，個體不易察覺，皆屬無感性蒸發。"},{"i":"gch1-9","e":"","n":0,"c":1,"s":"有關輻射散熱的敘述，下列何者錯誤？","o":["兩物體之間不需實質接觸或媒介物","物體間溫度差異越大，輻射散熱越快","膚色、姿勢及衣服顏色質料會影響輻射散熱","周邊血管收縮時可增加輻射散熱"],"a":"D","k":"D","t":"","x":"周邊血管擴張會增加輻射散熱，周邊血管收縮則減少輻射散熱，故此項錯誤。輻射是熱從物體表面直接傳到另一物體表面，不需接觸或媒介；溫差越大散熱越快；溫度、膚色、姿勢、衣服顏色及質料皆為影響因素。"},{"i":"gch1-10","e":"","n":0,"c":1,"s":"85歲的陳奶奶住在安養機構，家屬詢問為何奶奶的體溫常比家人低一些。護理師的解釋，下列何者最適當？","o":["老年人皮下脂肪變薄、新陳代謝率降低，體溫常較其他年齡層低","老年人體溫調節中樞尚未發育成熟","老年人對溫度變化較敏感，故會主動降低體溫","老年人體溫不易受外在環境溫度影響"],"a":"A","k":"A","t":"","x":"老年人因皮下脂肪變薄、活動量減少、新陳代謝率降低、體溫調節功能及對溫度的敏感性變差，體溫常低於其他年齡層，且易受外在環境溫度影響。體溫調節中樞未成熟是新生兒及嬰幼兒的特性；老年人對溫度變化是較不敏感。"},{"i":"gch1-11","e":"","n":0,"c":1,"s":"人體各部位的溫度不同，下列何者是溫度最低的部位及其約略溫度？","o":["肝臟，約38.8℃","血液，約37.8℃","耳垂，約32.2℃","直腸，約37.5℃"],"a":"C","k":"C","t":"","x":"身體各部位溫度不同，耳垂溫度最低約32.2℃；肝臟溫度最高約38.8℃；血液溫度約37.8℃。直腸測得的是接近核心溫度的肛溫，並非最低的部位，因此只有耳垂符合題意。"},{"i":"gch1-12","e":"","n":0,"c":1,"s":"依晝夜節律，健康成人一天當中體溫最低的時段通常為何時？","o":["清晨4～6點","中午12～2點","傍晚4～8點","晚間10～12點"],"a":"A","k":"A","t":"","x":"受週期性生理節律影響，24小時內體溫變動約0.5～1℃，以清晨4～6點最低，傍晚4～8點最高。中午與晚間皆非體溫最低點，傍晚4～8點反而是一天中體溫最高的時段。"},{"i":"gch1-13","e":"","n":0,"c":1,"s":"女性在排卵前，因體內何種荷爾蒙濃度增加，使體溫平均下降約0.3℃？","o":["黃體素","動情素","甲狀腺素","生長激素"],"a":"B","k":"B","t":"","x":"排卵前動情素增加，體溫平均下降約0.3℃；排卵後黃體素濃度增加，體溫上升約0.3～0.6℃，此變化可用於預測排卵。甲狀腺素與生長激素會增加細胞代謝速率而使體溫上升，與排卵前體溫下降無關。"},{"i":"gch1-14","e":"","n":0,"c":1,"s":"下列何種情況較可能使病人的體溫下降？","o":["甲狀腺機能亢進","飯後攝取熱飲","大面積燒傷","長期吸菸"],"a":"C","k":"C","t":"","x":"體溫調節中樞受損、大量出血、大面積燒傷、甲狀腺機能低下時會使體溫下降。甲狀腺機能亢進會增加代謝使體溫上升；食物消化及攝取熱飲使體溫上升；吸菸會使體溫略微上升，三者皆非體溫下降的原因。"},{"i":"gch1-15","e":"","n":0,"c":1,"s":"有關情緒與壓力對體溫影響的敘述，下列何者正確？","o":["焦慮緊張時，腎上腺素分泌增加使產熱增加、體溫上升","呈現冷漠及憂鬱傾向的病人，體溫常高於正常值","情緒波動只影響脈搏，不影響體溫","心理壓力會抑制交感神經而使體溫下降"],"a":"A","k":"A","t":"","x":"情緒波動與心理壓力會誘發交感神經系統，刺激腎上腺髓質分泌腎上腺素及正腎上腺素，使產熱增加、體溫上升。冷漠及憂鬱傾向的病人體溫會低於正常值；壓力是興奮而非抑制交感神經，情緒也會影響體溫。"},{"i":"gch1-16","e":"","n":0,"c":1,"s":"下列病人的體溫測量結果，何者已達到發燒的標準？","o":["肛溫37.8℃","口溫37.3℃","耳溫37.7℃","腋溫36.8℃"],"a":"C","k":"C","t":"","x":"發燒的判定為核心溫度（肛溫）超過38℃，口溫及耳溫超過37.5℃，或腋溫超過37℃。耳溫37.7℃已超過37.5℃，屬於發燒。肛溫37.8℃未超過38℃、口溫37.3℃未超過37.5℃、腋溫36.8℃未超過37℃，皆未達標準。"},{"i":"gch1-17","e":"","n":0,"c":1,"s":"母親帶1歲幼兒接種疫苗後，詢問是否要先給孩子吃退燒藥以預防發燒。護理師的回應，下列何者最適當？","o":["接種後應立即服用退燒藥，以免發燒","不建議預防性使用退燒藥，發燒是身體的防衛反應","只要體溫超過37℃就應立刻給予退燒藥","可在接種部位冰敷以預防全身發燒"],"a":"B","k":"B","t":"","x":"發燒是由疾病引發的身體防衛機轉，低於39℃的發燒並不會對身體造成傷害，因此打完疫苗後不建議預防性使用退燒藥。立即服藥或37℃即給藥都屬於不必要的用藥；局部冰敷注射部位無法預防全身性發燒。"},{"i":"gch1-18","e":"","n":0,"c":1,"s":"王先生突然主訴「好冷」，全身發抖、出現雞皮疙瘩，皮膚蒼白冰冷、乾燥無汗，耳溫37.9℃。此時最適當的護理措施為何？","o":["立即執行溫水拭浴","開啟電風扇增加對流散熱","移除被蓋並更換為單薄衣物","提供被蓋及溫熱飲料以減少體熱散失"],"a":"D","k":"D","t":"","x":"此為發燒開始期，致熱原使體溫設定點上升，身體以寒顫產熱、血管收縮保存體熱。此時應提供熱飲、衣物、被蓋以減少體熱散失，協助體溫到達新設定點。溫水拭浴、電風扇、移除被蓋等散熱措施應於寒顫消失後才使用。"},{"i":"gch1-19","e":"","n":0,"c":1,"s":"黃先生持續發燒，目前處於發熱期，下列何者為最可能出現的尿液變化？","o":["尿量增加，顏色變淺","尿量增加，尿比重下降","可能出現蛋白尿，尿比重上升","尿液顏色變淺，尿比重不變"],"a":"C","k":"C","t":"","x":"發熱期因高溫使體內蛋白質受破壞而可能出現蛋白尿，且尿量減少、顏色變深、尿比重上升。尿量增加、顏色變淺、尿比重下降是退熱期的尿液特徵，尿比重不變亦不符合發熱期的表現。"},{"i":"gch1-20","e":"","n":0,"c":1,"s":"病人服用解熱劑1小時後全身出汗，皮膚溫暖潮紅並有溼熱感，主訴口渴。有關此時發燒階段的判斷，下列何者正確？","o":["處於開始期，應加強保暖","處於退熱期，尿量會增加且尿比重下降","處於發熱期，尿比重上升","處於退熱期，表皮血管收縮以保存體熱"],"a":"B","k":"B","t":"","x":"出汗、皮膚溫暖潮紅、口渴為退熱期表現，此時設定點回復正常，身體藉血管擴張及流汗散熱，尿量較發熱期增加、顏色變淺、尿比重下降。開始期為寒顫、皮膚蒼白冰冷；退熱期是血管擴張而非收縮。"},{"i":"gch1-21","e":"","n":0,"c":1,"s":"病人持續高燒39.6℃，於數小時內體溫降至35.8℃，但同時血壓下降、脈搏細快、意識變差。下列判斷何者最適當？","o":["屬漸退，表示疾病逐漸復原","屬驟退，表示疾病有復原趨勢","屬驟退，需警覺可能有內出血或虛脫","屬正常退熱反應，僅需持續觀察"],"a":"C","k":"C","t":"","x":"體溫在數小時或24小時內突然下降稱為驟退。若體溫下降後症狀無好轉甚至惡化，可能有內出血、虛脫或瀕死現象，需立即通報處理。漸退是二、三天或一週內逐漸下降；症狀惡化不能視為復原趨勢或正常反應。"},{"i":"gch1-22","e":"","n":0,"c":1,"s":"發燒退熱形式中的「漸退（lysis）」，其特性為下列何者？","o":["體溫在數小時內突然降至正常","高熱期與無熱期交替出現","體溫持續高熱且變化極微","體溫在二、三天或一週內逐漸回復正常"],"a":"D","k":"D","t":"","x":"漸退是指體溫逐漸下降，在二、三天或一週內回復正常範圍，疾病症狀亦隨之減輕，代表逐漸復原。數小時內突然下降為驟退；高熱與無熱交替為間歇熱的特徵；持續高熱且變化極微為恆常熱，皆非退熱形式。"},{"i":"gch1-23","e":"","n":0,"c":1,"s":"下列何種疾病較常出現恆常熱（constant fever）的發燒型態？","o":["瘧疾","大葉性肺炎","傷寒","霍奇金氏病"],"a":"B","k":"B","t":"","x":"恆常熱為體溫持續高於38.8℃達數日或數週，24小時波動不超過1℃，常見於大葉性肺炎、急性粟粒性肺結核、兒童肺結核。瘧疾常見間歇熱；傷寒常見弛張熱；霍奇金氏病常見回歸熱。"},{"i":"gch1-24","e":"","n":0,"c":1,"s":"弛張熱（remittent fever）較常見於下列何種疾病？","o":["成人肺結核","瘧疾","術後傷口感染","兒童肺結核"],"a":"A","k":"A","t":"","x":"弛張熱是體溫均高於正常、24小時波動可相差2℃以上，常見於傷寒、成人肺結核、風溼熱、化膿性疾病。瘧疾屬間歇熱；術後傷口感染屬回歸熱；兒童肺結核屬恆常熱。"},{"i":"gch1-25","e":"","n":0,"c":1,"s":"陳先生術後傷口感染，體溫急遽上升至39.5℃，持續3天後恢復正常，數日後又再度出現高熱，呈規律性反覆升降。此發燒型態最可能為何？","o":["恆常熱","弛張熱","間歇熱","回歸熱"],"a":"D","k":"D","t":"","x":"回歸熱（復發熱）為體溫急遽上升達39℃以上，持續數日後恢復正常，數日後又再高熱，呈規律性反覆，常見於術後傷口感染、霍奇金氏病。恆常熱持續高熱且波動小於1℃；弛張熱始終高於正常；間歇熱為一天內高熱與無熱交替。"},{"i":"gch1-26","e":"","n":0,"c":1,"s":"有關發燒類型與其特徵的配對，下列何者正確？","o":["間歇熱—高熱期與無熱期交替出現，常見於瘧疾","恆常熱—24小時體溫波動超過2℃","弛張熱—體溫急遽升至39℃以上，數日後恢復正常","回歸熱—常見於大葉性肺炎"],"a":"A","k":"A","t":"","x":"間歇熱為高熱期與無熱期交替，變化幅度大，常見於瘧疾、敗血症、淋巴瘤、急性腎盂腎炎。恆常熱的波動不超過1℃；急遽升至39℃以上數日後恢復正常屬回歸熱；大葉性肺炎常見恆常熱而非回歸熱。"},{"i":"gch1-27","e":"","n":0,"c":1,"s":"依臨床常見的發燒處置常規（各醫院可能不同），病人體溫達到下列何值以上時，可能會進行血液、尿液、痰液培養？","o":["37.6℃","38℃","38.5℃","39℃"],"a":"C","k":"C","t":"","x":"常見發燒處置常規為：37.6℃以上鼓勵增加液體攝取；38℃以上使用冰枕；38.5℃以上可能做血液、尿液、痰液培養及使用藥物；39℃以上可能需溫水拭浴。因此培養檢查的時機為38.5℃以上。"},{"i":"gch1-28","e":"","n":0,"c":1,"s":"為發燒病人調整室內環境以促進散熱，提供感覺涼爽舒適的室溫約為多少？","o":["16～18℃","20～24℃","26～28℃","28～30℃"],"a":"B","k":"B","t":"","x":"促進散熱時應調整室內溫溼度並促進空氣流通，提供感覺涼爽且舒適的溫度約20～24℃，並維持較低溼度以利蒸發散熱。16～18℃低於建議範圍而過冷；26℃以上則室溫偏高，不利於病人散熱降溫。"},{"i":"gch1-29","e":"","n":0,"c":1,"s":"林小姐發燒39.2℃，依醫囑口服acetaminophen，1小時後大量流汗。護理師此時最需要特別監測的是下列何者？","o":["血壓下降、脈搏加快、四肢發冷","體溫是否於短時間內再度上升","呼吸是否變慢變淺、出現暫停","尿量是否明顯增加、顏色變淺"],"a":"A","k":"A","t":"","x":"解熱劑透過蒸發散熱降溫，用藥後常大量流汗，需注意是否因體液喪失過多而出現血壓下降、脈搏加快、四肢發冷等虛脫或休克狀況。體溫回升雖需追蹤但非此時最大危險；呼吸變慢及尿量增加均不是大量流汗後的主要風險。"},{"i":"gch1-30","e":"","n":0,"c":1,"s":"一位無心臟及腎臟疾病的發燒成人，護理師建議其每日液體攝取量，下列何者最適當？","o":["1,000～1,500 c.c.","1,500～2,000 c.c.","2,500～3,000 c.c.","4,000 c.c.以上"],"a":"C","k":"C","t":"","x":"無水分限制的發燒病人建議每日攝取2,500～3,000 c.c.液體，以補充代謝增加及過度流汗造成的水分喪失，並促進毒素及廢物排除。1,500 c.c.以下不足以補充發燒時的流失；若有心、腎衰竭則須依醫囑限制水量。"},{"i":"gch1-31","e":"","n":0,"c":1,"s":"有關發燒病人的飲食指導，下列何者最不適當？","o":["採高蛋白、高維生素飲食","選擇易消化的流質或半流質飲食","鼓勵少量多餐","鼓勵一次大量進食高脂肪食物以補充熱量"],"a":"D","k":"D","t":"","x":"發燒病人建議採適度的碳水化合物與脂肪、高蛋白、高維生素、易消化的流質或半流質飲食，並鼓勵少量多餐，同時注意食物色香味以增進食慾。一次大量進食高脂肪食物不易消化，且病人食慾下降、噁心，不適當。"},{"i":"gch1-32","e":"","n":0,"c":1,"s":"下列何者「不屬於」中暑的高危險群？","o":["服用利尿劑的長者","長時間於戶外工作的建築工人","甲狀腺機能低下者","酒癮患者"],"a":"C","k":"C","t":"","x":"中暑高危險群包括嬰兒及老年人、心血管疾病、糖尿病、甲狀腺機能亢進及酒癮患者、長時間在高溫環境活動者，以及使用鎮靜劑、利尿劑等影響散熱藥物者。甲狀腺機能低下使代謝與體溫偏低，並非高危險群。"},{"i":"gch1-33","e":"","n":0,"c":1,"s":"有關體溫過低（hypothermia）的敘述，下列何者正確？","o":["指核心溫度低於36℃即屬之","可能出現脈搏及呼吸變慢、血壓下降","因腎血流增加使尿量明顯增加","皮膚常呈潮紅、溫暖且出汗"],"a":"B","k":"B","t":"","x":"體溫過低是核心溫度低於35℃，症狀包括寒顫、心律不整、脈搏及呼吸變慢、體溫及血壓下降、尿量減少、皮膚冰冷呈蠟白色，嚴重時嗜睡至昏迷。定義為35℃而非36℃；尿量是減少；皮膚為冰冷蠟白而非潮紅。"},{"i":"gch1-34","e":"","n":0,"c":1,"s":"寒流期間登山客被救下山，手指呈蠟白色、觸診堅硬、麻木並失去感覺。有關此情況的處置，下列何者最適當？","o":["用力搓揉患部以促進血液循環","將手指直接靠近火爐烤熱","以冰塊敷於患部減輕腫脹","將患部浸泡於溫水中，避免搓揉"],"a":"D","k":"D","t":"","x":"此為凍瘡，好發於耳垂、鼻尖、手指、腳趾，表現為蠟白、堅硬、麻木、喪失感覺。處置為浸泡溫水，且不可搓揉，以防摩擦造成組織傷害；嚴重壞死時可能需擴創術或截肢。直接烤火易燙傷失去感覺的組織，冰敷則加重凍傷。"},{"i":"gch1-35","e":"","n":0,"c":1,"s":"下列何位病人最不適合以口溫測量體溫？","o":["意識清楚的30歲闌尾切除術後病人","5歲的扁桃腺發炎兒童","意識清楚的45歲肺炎病人","意識清楚的60歲糖尿病病人"],"a":"B","k":"B","t":"","x":"口溫是將體溫計置於舌下，禁忌症包括6歲以下嬰幼兒及有口腔相關疾病者。5歲兒童未滿6歲，且扁桃腺發炎屬口腔相關問題，最不適合測口溫。其他意識清楚、無口腔疾病的成人皆可測量口溫。"},{"i":"gch1-36","e":"","n":0,"c":1,"s":"有關腋溫測量的敘述，下列何者正確？","o":["體溫計置於腋中線處並夾緊手臂，測量5～10分鐘","腋溫測量結果是各種部位中最準確的","適用於肩關節損傷或虛弱的病人","護理記錄上應於數值旁以R註明"],"a":"A","k":"A","t":"","x":"腋溫是將體溫計置於腋中線處並夾緊手臂，測量時間5～10分鐘。其數值較不準確，最準確的是肛溫；腋下疾病、虛弱者及肩關節損傷者為禁忌；記錄時腋溫標註X，R是肛溫的標註方式。"},{"i":"gch1-37","e":"","n":0,"c":1,"s":"急性心肌梗塞病人入住加護病房，護理師避免為其測量肛溫，主要原因為何？","o":["肛溫數值偏低，無法反映核心溫度","測量時間過長，病人無法配合","易刺激迷走神經使心跳減慢，加重心肌受損","易引起交感神經興奮使血壓上升"],"a":"C","k":"C","t":"","x":"肛溫測量易刺激迷走神經，使心跳速率減緩、加重心肌受損，故心肌梗塞及心臟疾病者為禁忌。肛溫反而是最準確、數值最高的測量方式；測量時間為1～3分鐘並不長；刺激的是迷走神經而非交感神經。"},{"i":"gch1-38","e":"","n":0,"c":1,"s":"依測量體溫儀器的準確度，由高至低的排列順序，下列何者正確？","o":["感溫膠片＞單次拋棄式體溫計＞水銀式體溫計＞耳溫槍","水銀式體溫計＞耳溫槍＞感溫膠片＞單次拋棄式體溫計","單次拋棄式體溫計＞耳溫槍＞水銀式體溫計＞感溫膠片","耳溫槍與電子體溫計＞水銀式體溫計＞單次拋棄式體溫計＞感溫膠片"],"a":"D","k":"D","t":"","x":"測量體溫儀器準確度依序為：耳溫槍與電子體溫計＞水銀式體溫計（目前禁用）＞單次拋棄式體溫計＞感溫膠片。感溫膠片準確度最低，不可能排第一；水銀式體溫計準確度亦不及耳溫槍與電子體溫計。"},{"i":"gch1-39","e":"","n":0,"c":1,"s":"護理師為2歲幼兒測量耳溫，拉直外耳道的正確方式為何？","o":["耳廓向上向後拉","耳廓向下向後拉","耳廓向上向前拉","不需拉耳廓，直接插入即可"],"a":"B","k":"B","t":"","x":"3歲以下嬰幼兒的耳廓應向下向後拉；成人或3歲以上孩童則向上向後拉，以拉直外耳道使探頭對準耳膜。2歲幼兒應向下向後拉。不拉耳廓可能使探頭無法偵測耳膜熱輻射，造成數值不準確，且每次使用前須更換新護套。"},{"i":"gch1-40","e":"","n":0,"c":1,"s":"有關額溫槍的敘述，下列何者錯誤？","o":["利用紅外線感應太陽穴皮下動脈血管的溫度","額部暴露面積大，易受外界環境溫度影響","測量前應先擦拭額頭汗水及粉妝","測得溫度通常高於核心溫度1～2℃"],"a":"D","k":"D","t":"","x":"額溫槍因額部暴露面積大，易受環境溫度影響，實際測得溫度可能低於核心溫度1～2℃，而非高於。其原理為紅外線感應太陽穴皮下動脈溫度，偵測前額左側或右側，測前應擦去汗水及粉妝以減少誤差。"},{"i":"gch1-41","e":"","n":0,"c":1,"s":"有關顳溫槍測量的敘述，下列何者正確？","o":["可在額頭疤痕組織上進行測量","測得數值通常比口溫低0.4℃","若需立即重覆測量，兩次之間應間隔30秒","測量時不需撥開頭髮"],"a":"C","k":"C","t":"","x":"顳溫槍若需立即重覆測量，兩次之間需間隔30秒，以避免皮膚溫度偏低。不可在疤痕組織、開放性潰瘍或皮膚損傷處測量；其數據準確，與肛溫相似，比口溫高0.4℃而非低；測量時需撥開頭髮，自額頭中央滑至髮際線。"},{"i":"gch1-42","e":"","n":0,"c":1,"s":"某成人心搏出量（SV）為70 mL，心跳速率（HR）為80次／分，其心輸出量（CO）約為多少？","o":["1.5 L／分","5.6 L／分","7.0 L／分","8.0 L／分"],"a":"B","k":"B","t":"","x":"心輸出量＝心搏出量×心跳速率＝70 mL×80次／分＝5,600 mL／分，約5.6 L／分，與休息狀態下成人心輸出量4～6 L相符。1.5 L／分明顯低於正常範圍；7.0與8.0 L／分則是誤將70或80直接換算的錯誤結果。"},{"i":"gch1-43","e":"","n":0,"c":1,"s":"測量脈搏時發現病人每兩次正常脈動後，緊接著一次不成熟且較弱的搏動，此脈律稱為下列何者？","o":["二重脈","間歇脈","跑脈","三重脈"],"a":"D","k":"D","t":"","x":"三重脈為每兩次正常脈動後接著一次不成熟且較弱的搏動，即二正常一弱。二重脈為每次正常脈動後接一次較弱搏動，呈一強一弱；間歇脈為間隔長短不均、無固定節律；跑脈為細、快、不規則，每分鐘可達150次以上。"},{"i":"gch1-44","e":"","n":0,"c":1,"s":"20歲健康學生測量脈搏時，護理師發現其脈率在吸氣時稍微增快、呼氣時稍微減慢，此現象最可能為下列何者？","o":["奇異脈","柯利氏脈","竇性心律不整","間歇脈"],"a":"C","k":"C","t":"","x":"竇性心律不整是脈搏速率隨呼吸狀態輕微上升或下降，吸氣時心輸出量減少，脈率代償性增快，呼氣時下降。奇異脈是吸氣時脈搏消失、呼氣時出現強脈，見於心包填塞；柯利氏脈見於主動脈閉鎖不全；間歇脈則無固定節律。"},{"i":"gch1-45","e":"","n":0,"c":1,"s":"有關脈律與常見相關疾病的配對，下列何者正確？","o":["柯利氏脈—主動脈閉鎖不全","奇異脈—心房纖維顫動","脈搏短絀—心包填塞","跑脈—甲狀腺機能低下"],"a":"A","k":"A","t":"","x":"柯利氏脈是一種痙攣脈，脈搏一下跳得很滿、一下塌陷，見於主動脈閉鎖不全。奇異脈常見於心包填塞；脈搏短絀常見於心房纖維顫動；跑脈脈搏細快不規則，每分鐘可達150次以上，與甲狀腺機能低下的脈搏變慢不符。"},{"i":"gch1-46","e":"","n":0,"c":1,"s":"心房纖維顫動病人，護理師測得心尖脈112次／分、橈動脈88次／分。下列敘述何者正確？","o":["脈搏差為24次／分，宜同時監測心尖脈與橈動脈","脈搏差為24次／分，只需測量橈動脈即可","橈動脈次數大於心尖脈次數為其特徵","兩者差距屬正常範圍，不需記錄"],"a":"A","k":"A","t":"","x":"脈搏短絀是心臟傳導功能失效，使心尖脈次數大於橈動脈次數，兩者差距稱為脈搏差，本例為112－88＝24次／分。常見於心房纖維顫動，需同時監測心尖脈與橈動脈並記錄。只測橈動脈會低估心跳；橈動脈次數大於心尖脈的敘述相反。"},{"i":"gch1-47","e":"","n":0,"c":1,"s":"下列何者較可能使個體的脈搏速率變慢？","o":["由平躺改為站立姿勢","長期接受訓練的馬拉松選手","注射阿托平（Atropine）","血壓下降時"],"a":"B","k":"B","t":"","x":"專業運動員因訓練效應，心臟尺寸、強度及效能較佳，脈搏速率比一般人慢。坐或站時血液積聚於靜脈、回心血量減少，脈搏較平躺時高；阿托平會使心跳增快；血壓下降時脈搏會代償性增加。"},{"i":"gch1-48","e":"","n":0,"c":1,"s":"有關影響脈搏速率因素的敘述，下列何者錯誤？","o":["自嬰兒期至成年期，脈搏速率隨年齡增長而下降","身材高瘦者的脈搏速率較矮胖者慢","攝取刺激性食物會使脈搏增快","甲狀腺機能低下者的脈搏速率會增快"],"a":"D","k":"D","t":"","x":"甲狀腺機能亢進會使脈搏增加，甲狀腺機能低下則使脈搏下降，故此項錯誤。年齡與脈搏速率成反比；高瘦者脈搏較矮胖者慢；消化及攝取刺激性食物使脈搏增快，禁食與飢餓則使脈搏減慢。"},{"i":"gch1-49","e":"","n":0,"c":1,"s":"有關周邊脈搏測量部位的敘述，下列何者錯誤？","o":["顳動脈位於耳朵上方近太陽穴處","膕動脈位於膝膕窩，測量時需稍微彎曲膝關節","脛後動脈位於足內踝後方，水腫或肥胖者最容易觸摸","肱動脈位於肘彎偏內側，為測量手臂血壓時的聽診部位"],"a":"C","k":"C","t":"","x":"脛後動脈位於足內踝後方，可用來評估足部循環，但水腫或肥胖者較不容易觸摸，故此項錯誤。顳動脈在耳朵上方近太陽穴；膕動脈在膝膕窩且需稍彎曲膝關節；肱動脈在肘彎偏內側，為手臂血壓的聽診部位。"},{"i":"gch1-50","e":"","n":0,"c":1,"s":"為成人聽診心尖脈時，聽診器應放置的位置為下列何處？","o":["第二肋間胸骨右緣","第四肋間胸骨左緣","第五肋間左腋前線","第五肋間與左鎖骨中線交會處"],"a":"D","k":"D","t":"","x":"成人心尖脈聽診部位位於第五肋間與左鎖骨中線交會處，約在左乳頭下方，聽診時必須測足1分鐘。第二肋間胸骨右緣為主動脈瓣聽診區；第四肋間胸骨左緣與第五肋間左腋前線皆非心尖搏動的標準位置。"},{"i":"gch1-51","e":"","n":0,"c":1,"s":"在肺泡與肺泡壁微血管之間進行氣體交換的過程，稱為下列何者？","o":["內呼吸","外呼吸","細胞呼吸","組織呼吸"],"a":"B","k":"B","t":"","x":"外呼吸又稱肺呼吸，是在肺泡與肺泡壁微血管間進行氣體交換。內呼吸是微血管與組織細胞間的氧氣及二氧化碳交換，又稱細胞呼吸、組織呼吸或體呼吸，因此細胞呼吸與組織呼吸皆為內呼吸的別稱。"},{"i":"gch1-52","e":"","n":0,"c":1,"s":"具有「限制吸氣、促進呼氣」功能，以避免肺部脹滿過量空氣的呼吸中樞為下列何者？","o":["延腦的呼吸節律中樞","橋腦的呼吸調節中樞（pneumotaxic center）","橋腦的長吸式呼吸中樞（apneustic center）","大腦皮質的隨意呼吸控制中樞"],"a":"B","k":"B","t":"","x":"橋腦上方的呼吸調節中樞具限制吸氣、促進呼氣功能，避免肺部脹滿過量空氣。延腦呼吸節律中樞控制基本節律；橋腦下方的長吸式呼吸中樞作用相反，可延長吸氣、抑制呼氣；大腦皮質負責隨意控制呼吸。"},{"i":"gch1-53","e":"","n":0,"c":1,"s":"周邊化學接受器的位置為下列何處？","o":["主動脈體及頸動脈體","延腦腹側表面","橋腦上方","下視丘視前區"],"a":"A","k":"A","t":"","x":"化學接受器包括位於延腦的中樞化學接受器，以及位於主動脈體及頸動脈體的周邊化學接受器，可感應動脈血中O2、CO2、H＋等濃度變化。延腦為中樞化學接受器所在；橋腦上方為呼吸調節中樞；下視丘視前區則是體溫調節中樞。"},{"i":"gch1-54","e":"","n":0,"c":1,"s":"王先生騎車摔倒造成右前臂骨折，送至急診時主訴劇烈疼痛。此時其呼吸最可能出現下列何種變化？","o":["呼吸速率變慢且變深","呼吸速率變慢且變淺","呼吸速率不變，僅深度增加","呼吸速率加快且變淺"],"a":"D","k":"D","t":"","x":"急性疼痛會刺激交感神經系統，改變呼吸節律，使呼吸速率加快並變淺；突然劇痛甚至可能使呼吸暫停。慢性疼痛才會使呼吸速率變慢。骨折後的急性劇痛不會造成呼吸變慢或僅深度增加。"},{"i":"gch1-55","e":"","n":0,"c":1,"s":"有關正常成人呼吸特性的敘述，下列何者正確？","o":["吸氣與呼氣時間比率約為2：3","呼吸速率約為每分鐘20～28次","呼吸速率與心跳速率的比率約為1：2","平靜呼吸時潮氣容積約為150 c.c."],"a":"A","k":"A","t":"","x":"一般吸氣約2秒、呼氣約3秒，吸呼比率為2：3。正常成人呼吸速率約12～20次／分；呼吸與心跳速率比率約1：4～1：5；平靜呼吸時潮氣容積約500～700 c.c.，可用肺量計檢測。其餘選項數值皆不正確。"},{"i":"gch1-56","e":"","n":0,"c":1,"s":"護理師測得一位成人病人呼吸每分鐘28次，此呼吸型態的醫護術語為下列何者？","o":["bradypnea","tachypnea","apnea","orthopnea"],"a":"B","k":"B","t":"","x":"呼吸過速（tachypnea）指成人呼吸速率每分鐘大於24次，28次／分屬之。bradypnea為呼吸過緩，指成人每分鐘少於10次；apnea為呼吸暫停；orthopnea為端坐呼吸，指需坐起才能呼吸順暢，皆不符合。"},{"i":"gch1-57","e":"","n":0,"c":1,"s":"病人發生呼吸暫停（apnea），若持續超過多久即可能危及生命，造成腦部損傷或死亡？","o":["30秒","1～2分鐘","4～6分鐘","10～15分鐘"],"a":"C","k":"C","t":"","x":"呼吸暫停的時間若超過4～6分鐘，即會危及生命，造成腦部損傷或死亡，因此發現呼吸暫停須立即處置。30秒至2分鐘尚未達到造成不可逆腦損傷的時間；等到10～15分鐘才處理已延誤急救時機。"},{"i":"gch1-58","e":"","n":0,"c":1,"s":"有關具雜音之異常呼吸的敘述，下列何者錯誤？","o":["哮鳴（wheezing）因小支氣管或細支氣管痙攣所致","蟬鳴式呼吸是吸氣時發出尖銳刺耳、高音調的聲音","嘆息式呼吸為深吸氣後再長長吐氣，可見於臨終病人","鼾息式呼吸主要因細支氣管痙攣所致，常見於氣喘發作"],"a":"D","k":"D","t":"","x":"鼾息式呼吸常見於昏迷或神經科患者，因氣管及大支氣管積聚過多分泌物所致，而非細支氣管痙攣；細支氣管痙攣造成的是哮鳴。蟬鳴式為吸氣時高音調尖銳聲；嘆息式為深吸氣後長長吐氣，見於過度換氣症候群、大出血或臨終病人。"},{"i":"gch1-59","e":"","n":0,"c":1,"s":"病人血壓為120/75 mmHg，其平均動脈壓（MAP）約為多少？","o":["90 mmHg","95 mmHg","97.5 mmHg","105 mmHg"],"a":"A","k":"A","t":"","x":"平均動脈壓＝舒張壓＋1/3脈搏壓。脈搏壓＝120－75＝45 mmHg，MAP＝75＋45/3＝75＋15＝90 mmHg；亦可用1/3×120＋2/3×75＝40＋50＝90 mmHg驗證。97.5為收縮壓與舒張壓的算術平均，屬常見錯誤。"},{"i":"gch1-60","e":"","n":0,"c":1,"s":"有關影響血壓的血液流動因子，下列何者會使血壓上升？","o":["紅血球數目增多","動脈管壁彈性增加","循環血量減少","周邊血管擴張"],"a":"A","k":"A","t":"","x":"紅血球增多或血漿蛋白質濃度增加會使血液黏滯性上升、血流減緩，導致血壓上升。動脈管壁彈性下降（如粥狀硬化）才會使血壓升高；血量減少與周邊血管擴張使周邊阻力下降，均會讓血壓下降。"},{"i":"gch1-61","e":"","n":0,"c":1,"s":"有關影響血壓因素的敘述，下列何者正確？","o":["姿勢對血壓的影響為臥姿＞坐姿＞站姿","早晨醒來未起身前的血壓值最低","飲酒會使周邊血管收縮而血壓上升","更年期後男性血壓通常高於女性"],"a":"B","k":"B","t":"","x":"依週期性節律，早晨醒來未起身前血壓最低，午後或傍晚最高。姿勢影響為站姿＞坐姿＞臥姿；酒精使周邊血管擴張而血壓下降；青春期後男性高於女性，更年期後則女性高於男性。"},{"i":"gch1-62","e":"","n":0,"c":1,"s":"下列何種藥物會使血管收縮而導致血壓上升？","o":["硝化甘油（Nitroglycerin）","利尿劑","皮質類固醇","安眠鎮靜劑"],"a":"C","k":"C","t":"","x":"腎上腺素、抗組織胺、動情素、皮質類固醇等會使血管收縮，造成血壓上升。硝化甘油、利尿劑、安眠鎮靜劑、麻醉劑及抗高血壓藥物則會使血管擴張或降低血壓，服用者需注意血壓下降。"},{"i":"gch1-63","e":"","n":0,"c":1,"s":"80歲林爺爺臥床兩週，今天準備第一次下床，主訴曾在起身時頭暈。為評估其是否有姿位性低血壓，下列血壓測量方式何者最適當？","o":["分別測量臥姿、坐姿及站姿血壓，並於每次改變姿勢1～3分鐘後再測量","只需測量站立時的血壓即可","改變姿勢後立即測量，以免錯過血壓下降","僅需測量平躺時的血壓作為基準"],"a":"A","k":"A","t":"","x":"姿位性低血壓是由平躺突然改為坐或站時收縮壓迅速下降，常伴頭暈或昏厥，高危險群為老年人及長期臥床者。應測量臥、坐、站三種姿勢的血壓並比較，且每次改變姿勢1～3分鐘後再測。只測單一姿勢無法比較變化。"},{"i":"gch1-64","e":"","n":0,"c":1,"s":"病人上臂圍為30公分，選擇壓脈帶時，其橡皮充氣囊的寬度最適當約為多少？","o":["8公分","12公分","18公分","24公分"],"a":"B","k":"B","t":"","x":"橡皮充氣囊的正確寬度應為肢體圓周的40%，30公分×40%＝12公分，與一般成人充氣囊寬度12～14公分相符。8公分過窄會使血壓測值偏高；18公分或24公分過寬，則會使血壓測值偏低。"},{"i":"gch1-65","e":"","n":0,"c":1,"s":"護理師先觸診病人橈動脈，充氣至130 mmHg時橈動脈搏動消失。為避免聽診間隙造成誤差，接下來應將壓脈帶充氣至約多少mmHg？","o":["130 mmHg","140 mmHg","150 mmHg","160 mmHg"],"a":"D","k":"D","t":"","x":"為預防聽診間隙，應先觸診橈動脈，以每次約10 mmHg充氣至橈動脈消失後，再往上充氣30 mmHg，即130＋30＝160 mmHg。充氣不足可能因聽診間隙而聽不到真正的收縮壓，造成收縮壓偏低、舒張壓偏高的誤差。"},{"i":"gch1-66","e":"","n":0,"c":1,"s":"測量血壓時，下列何種情況會使測得的血壓值偏低？","o":["壓脈帶過窄","壓脈帶綁得太鬆","受測肢體高於心臟","受測手臂沒有支托"],"a":"C","k":"C","t":"","x":"受測肢體高於心臟時，受重力影響使測得的血壓偏低；肢體低於心臟則偏高。壓脈帶過窄或綁太鬆時，需要更大壓力才能壓扁動脈，使測值偏高；受測肢體沒有支托時，測得的血壓同樣會偏高。"},{"i":"gch1-67","e":"","n":0,"c":1,"s":"下列哪些部位不宜施行血壓測量？①血液透析用動靜脈瘻管的手臂　②乳房切除手術的患側手臂　③中風偏癱的患側手臂　④無管路且無傷口的健側手臂","o":["①②","②③④","①③④","①②③"],"a":"D","k":"D","t":"","x":"禁止施行血壓測量的部位包括：靜脈注射的手臂、動靜脈分流或瘻管的手臂、乳房或腋下手術的患側、上石膏或大型繃帶包紮的患側及半側偏癱的患側。故①②③皆不宜；④為無管路、無傷口的健側手臂，可作為測量部位。"},{"i":"gch1-68","e":"","n":0,"c":1,"s":"護理師為病人測量血壓後覺得數值可疑，需要重覆測量。下列做法何者最適當？","o":["放鬆壓脈帶並完全壓出氣囊內空氣，休息1～2分鐘後再測","不需放氣，直接再次充氣至原壓力測量","放氣至舒張壓以下後立即重新充氣測量","改測另一側手臂後，立即回原手臂重測"],"a":"A","k":"A","t":"","x":"重覆測量時應放鬆壓脈帶並完全壓出充氣囊內的空氣，待休息1～2分鐘後再測，目的在預防靜脈充血而影響判讀。未完全放氣或立即重新充氣，皆會造成肢體靜脈充血，使測值不準確。"},{"i":"gch1-69","e":"","n":0,"c":1,"s":"一位心律不整病人需測量血壓，下列做法何者最能提高數值的準確性？","o":["只測量一次，以第一次數值為準","測量兩次後取較高的數值","測量後再以觸診法估計收縮壓","連續測量三次血壓後取其平均值"],"a":"D","k":"D","t":"","x":"心律不整者因每次心搏出量不一致，血壓值波動較大，應連續測量三次後取其平均值，結果較準確。只測一次或取兩次中較高值，無法排除單次波動造成的誤差；觸診法只能估計收縮壓，無法提高整體準確性。"},{"i":"gch2-0","e":"","n":0,"c":2,"s":"病人發燒，醫囑使用冰枕。有關每次冰枕使用的時間，下列何者最適當？","o":["20～30分鐘","5～10分鐘","45～60分鐘","持續放置直到體溫恢復正常為止"],"a":"A","k":"A","t":"","x":"冰枕每次使用以20～30分鐘為宜，可達降溫效果又不致造成組織受損。5～10分鐘時間太短，降溫效果有限；45～60分鐘或持續放置，易引起反彈性血管擴張，並增加凍傷等局部組織傷害的危險。"},{"i":"gch2-1","e":"","n":0,"c":2,"s":"陳先生持續高燒，需長時間使用冰枕協助降溫。有關冰枕使用的安排，下列何者最適當？","o":["持續使用不間斷，冰塊融化時再更換即可","每次使用60分鐘後移除，間隔10分鐘再使用","持續使用至局部皮膚發紫、麻木時才移除","每次使用20～30分鐘後移除，間隔30～60分鐘再使用"],"a":"D","k":"D","t":"","x":"長時間用冷需間歇使用：每次20～30分鐘，移除後間隔30～60分鐘讓組織恢復再使用。持續不間斷或單次60分鐘過長，易發生反彈現象與組織傷害；皮膚發紫、麻木已是凍傷前兆，應立即停止而非等到出現才移除。"},{"i":"gch2-2","e":"","n":0,"c":2,"s":"護理師為體溫39.2℃的病人放置冰枕後，為評值降溫成效，應於何時再次測量體溫最適當？","o":["使用冰枕30分鐘後","放置冰枕後立即測量","使用冰枕5分鐘後","使用冰枕4小時後"],"a":"A","k":"A","t":"","x":"冰枕使用後30分鐘再測量體溫，才能反映用冷後的降溫成效，作為是否繼續處置的依據。放置後立即或5分鐘後測量，冷療效果尚未顯現；4小時後才測量則間隔過久，無法及時評值與調整措施。"},{"i":"gch2-3","e":"","n":0,"c":2,"s":"下列哪一位病人最適合依醫囑使用冰領？","o":["長期姿勢不良，頸部肌肉僵硬痠痛的病人","感冒畏寒、全身發抖的病人","頸部腫瘤接受放射線治療後，照射部位皮膚破損的病人","甲狀腺切除術後第一天，頸部傷口腫脹疼痛的病人"],"a":"D","k":"D","t":"","x":"冰領置於頸部，藉血管收縮達到止血、減輕腫脹與疼痛，常用於甲狀腺或扁桃腺手術後。肌肉僵硬痠痛宜用熱以鬆弛肌肉；畏寒發抖時用冷會加重寒顫；放射治療部位皮膚破損，感覺與耐受度差，不宜局部用冷。"},{"i":"gch2-4","e":"","n":0,"c":2,"s":"下列冷療法中，何者屬於「濕冷」法？","o":["低溫毯","冰領","溫水拭浴","冰囊"],"a":"C","k":"C","t":"","x":"濕冷是以水或液體直接接觸皮膚，如溫水拭浴、酒精拭浴、濕冷敷與冷水浸泡。低溫毯、冰枕、冰領及冰囊皆以容器或墊材隔開，冷媒不直接接觸皮膚，屬於乾冷法。"},{"i":"gch2-5","e":"","n":0,"c":2,"s":"林先生因高燒使用低溫毯降溫，有關照護措施，下列何者最適當？","o":["為加速降溫，應讓病人裸露背部直接躺在低溫毯上","病人出現寒顫時，應調低溫度以加強降溫效果","使用期間不需測量體溫，以免干擾低溫毯的運作","低溫毯上需覆蓋一層床單，避免直接接觸病人皮膚"],"a":"D","k":"D","t":"","x":"低溫毯屬乾冷，冷源不可直接接觸皮膚，需以床單隔開以防凍傷。直接躺在毯上易造成組織傷害；出現寒顫表示肌肉收縮產熱，應暫停或調整並保暖，而非加強降溫；使用期間須定時監測體溫，以評估成效並防體溫過低。"},{"i":"gch2-6","e":"","n":0,"c":2,"s":"張先生體溫39.4℃，醫囑給予溫水拭浴。護理師準備的水溫，下列何者最適當？","o":["32℃","20℃","40℃","45℃"],"a":"A","k":"A","t":"","x":"溫水拭浴水溫為27～37℃，32℃在此範圍內，可經傳導與蒸發散熱又不致引起寒顫。20℃過冷，易刺激血管收縮與寒顫，反而增加產熱；40℃、45℃已高於體表溫度，無法達到降溫目的，45℃更有燙傷之虞。"},{"i":"gch2-7","e":"","n":0,"c":2,"s":"執行溫水拭浴時應避免擦拭前胸部位，其主要理由為何？","o":["前胸皮膚較厚，散熱效果差","避免冷刺激引起反射性心跳變慢或心律不整","前胸沒有大血管通過，擦拭無降溫效果","避免水分流入腋下造成皮膚浸潤"],"a":"B","k":"B","t":"","x":"前胸部位受冷刺激，可能經反射作用使心跳變慢或引起心律不整，因此溫水拭浴應避開前胸。前胸皮膚並不特別厚；腋下反而是大血管處，拭浴時應多停留；浸潤並非避開前胸的理由。"},{"i":"gch2-8","e":"","n":0,"c":2,"s":"執行溫水拭浴時，於病人頭部放置冰枕、足部放置熱水袋，下列敘述何者正確？","o":["頭部冰枕的主要目的是預防拭浴過程中發生寒顫","頭部冰枕可防頭部充血引起頭痛，足部熱水袋可促進末梢血管擴張並增加舒適","足部熱水袋的目的是提高核心體溫，以免體溫過低","足部熱水袋可使血液集中於下肢，以降低病人血壓"],"a":"B","k":"B","t":"","x":"拭浴時頭部置冰枕可降低頭部溫度、預防頭部充血與頭痛；足部置熱水袋使末梢血管擴張，有助散熱並增加舒適感。冰枕不會預防寒顫，反而可能加重；足部熱水袋並非為提高核心體溫或降血壓而設。"},{"i":"gch2-9","e":"","n":0,"c":2,"s":"護理師為發燒病人執行溫水拭浴，在下列哪些部位應稍作停留以增加散熱效果？","o":["前胸與腹部","手掌與腳底","腋下與鼠蹊部","臉部與耳後"],"a":"C","k":"C","t":"","x":"腋下、鼠蹊、膕窩等處有表淺的大血管通過，拭浴時在此多停留，可經傳導及蒸發帶走較多熱量。前胸應避開以免反射性心律改變；手掌、腳底及臉部、耳後並非大血管表淺處，散熱效果有限。"},{"i":"gch2-10","e":"","n":0,"c":2,"s":"有關溫水拭浴的執行，下列敘述何者錯誤？","o":["以輕拍方式擦拭四肢及背部","擦拭腋下、鼠蹊等大血管處時稍作停留","拭浴結束後應立即測量體溫，以評值降溫成效","拭浴過程中觀察病人有無寒顫或皮膚發紫"],"a":"C","k":"C","t":"","x":"溫水拭浴後應等待30分鐘再測量體溫，立即測量無法反映真正成效，故此敘述錯誤。拭浴以輕拍方式進行四肢與背部，在大血管處多停留可增加散熱，過程中須觀察寒顫、發紫等不良反應，以上皆為正確做法。"},{"i":"gch2-11","e":"","n":0,"c":2,"s":"李奶奶75歲，罹患類風濕性關節炎多年，並有周邊血液循環障礙。今日發燒38.9℃，下列退燒措施何者最不適當？","o":["減少蓋被並維持室內通風","依醫囑給予退燒藥物","鼓勵增加水分攝取","全身溫水拭浴"],"a":"D","k":"D","t":"","x":"溫水拭浴的禁忌包括血液循環障礙及關節炎，冷刺激會使血管收縮，加重循環不良與關節疼痛，故最不適當。減少蓋被、維持通風可增加散熱；依醫囑給退燒藥與補充水分，皆為發燒時合宜的護理措施。"},{"i":"gch2-12","e":"","n":0,"c":2,"s":"護理師為發燒病人執行溫水拭浴時，病人突然出現寒顫、口唇發紫，此時最適當的處置為何？","o":["加快擦拭速度，盡快完成拭浴","改用溫度較低的水繼續擦拭","增加在大血管處停留的時間","停止拭浴，協助保暖並觀察生命徵象"],"a":"D","k":"D","t":"","x":"寒顫表示肌肉不自主收縮產熱，會使體溫回升並增加耗氧，口唇發紫則為周邊循環不良，應立即停止拭浴並保暖、觀察。加快速度、降低水溫或延長大血管處停留，都會加重冷刺激，使寒顫更明顯。"},{"i":"gch2-13","e":"","n":0,"c":2,"s":"醫囑給予發燒病人酒精拭浴，所使用的酒精濃度，下列何者最適當？","o":["10～15%","50～55%","70～75%","30～35%"],"a":"D","k":"D","t":"","x":"酒精拭浴使用30～35%的酒精，利用其易揮發的特性，經蒸發帶走體熱。濃度過低揮發慢、效果差；50%以上濃度刺激性大，易使皮膚過度乾燥，70～75%為消毒用濃度，不適合大面積擦拭皮膚。"},{"i":"gch2-14","e":"","n":0,"c":2,"s":"有關酒精拭浴可能產生的副作用，下列組合何者正確？①皮膚刺激 ②皮膚乾燥 ③噁心 ④皮膚浸潤軟化","o":["①②④","①②③","①③④","②③④"],"a":"B","k":"B","t":"","x":"酒精對皮膚具刺激性，揮發時會帶走皮膚油脂與水分而造成乾燥，其氣味也可能使病人噁心，故①②③正確。酒精易揮發，不會長時間停留於皮膚，不致造成浸潤軟化，皮膚浸潤是長時間濕敷的問題。"},{"i":"gch2-15","e":"","n":0,"c":2,"s":"王同學打籃球時扭傷右腳踝，30分鐘後到保健室，患部腫脹疼痛，無開放性傷口。此時最適當的處置為何？","o":["冰敷患部並抬高患肢","熱敷患部以促進血液循環","用力按摩患部以消除腫脹","冷敷與熱敷交替使用"],"a":"A","k":"A","t":"","x":"扭傷後24～48小時內應冰敷，使血管收縮以減少出血與腫脹，並減輕疼痛，抬高患肢可促進靜脈回流。急性期熱敷會使血管擴張而加重出血腫脹；按摩可能加重組織損傷；冷熱交替不適用於急性扭傷。"},{"i":"gch2-16","e":"","n":0,"c":2,"s":"陳小姐腳踝扭傷第3天，腫脹已消退，但患部仍有瘀青。此時改用熱敷，其主要目的為何？","o":["使血管擴張，促進瘀血吸收","使血管收縮，防止再次出血","降低微血管通透性，減少水腫","降低組織代謝，減輕炎症反應"],"a":"A","k":"A","t":"","x":"扭傷超過24～48小時、出血與腫脹穩定後，可改用熱敷，使血管擴張、血流增加，加速瘀血與滲出液的吸收。血管收縮、降低微血管通透性及降低代謝，皆為用冷的作用，適用於急性期。"},{"i":"gch2-17","e":"","n":0,"c":2,"s":"有關冷療法的方法與其適用情形，下列配對何者正確？","o":["冷水浸泡：適用於小範圍點狀部位","冰領：適用於腹部手術後止痛","冰敷：適用於小範圍部位","酒精拭浴：適用於局部止血"],"a":"C","k":"C","t":"","x":"冰敷適用於小範圍部位，如扭傷24～48小時內；冷水浸泡則用於較大範圍。冰領置於頸部，用於甲狀腺或扁桃腺術後，而非腹部手術；酒精拭浴是藉蒸發協助全身降溫，並非局部止血的方法。"},{"i":"gch2-18","e":"","n":0,"c":2,"s":"護理師為病人執行濕冷敷，下列措施何者最適當？","o":["敷布擰乾至不滴水，並經常更換以維持低溫","敷布越濕越好，以增加傳導效果","將冰塊直接放在皮膚上，再覆蓋濕敷布","患部下方不需鋪防水布，以免影響散熱"],"a":"A","k":"A","t":"","x":"濕冷敷布應擰乾至不滴水，避免弄濕床單與皮膚浸潤，且敷布會因體溫回暖，需經常更換以維持冷度。敷布過濕易造成浸潤；冰塊直接接觸皮膚易凍傷；下方應鋪防水布保護床單，並不影響治療。"},{"i":"gch2-19","e":"","n":0,"c":2,"s":"有關局部用冷所產生的生理反應，下列何者正確？","o":["微血管通透性增加","血液黏稠度增加","細胞新陳代謝增加","神經傳導速度加快"],"a":"B","k":"B","t":"","x":"局部用冷使血管收縮、血流減慢，血液黏稠度增加，有助於止血。用冷同時會降低微血管通透性與細胞代謝，並使神經傳導變慢而減輕疼痛；通透性增加、代謝增加則是用熱的反應。"},{"i":"gch2-20","e":"","n":0,"c":2,"s":"有關局部用熱所產生的生理反應，下列何者正確？","o":["血液黏稠度增加","微血管通透性增加，白血球活動力增強","肌肉張力增加","組織需氧量減少"],"a":"B","k":"B","t":"","x":"局部用熱使血管擴張、微血管通透性增加，白血球與淋巴流動增強，有助於炎症吸收與組織修復。用熱會降低血液黏稠度、使肌肉鬆弛張力下降，並因代謝增加而使組織需氧量增加。"},{"i":"gch2-21","e":"","n":0,"c":2,"s":"冷療法與熱療法皆可達到的治療效果，下列何者正確？","o":["減輕疼痛","減輕組織水腫","促進化膿","降低細胞代謝"],"a":"A","k":"A","t":"","x":"用冷可使神經傳導變慢、減輕腫脹壓迫；用熱可鬆弛肌肉、促進代謝產物移除，兩者皆能減輕疼痛。減輕組織水腫與降低細胞代謝為用冷的效果；促進化膿則為用熱的效果，並非兩者共同具有。"},{"i":"gch2-22","e":"","n":0,"c":2,"s":"病人足踝扭傷使用冰袋冷敷，因家屬忘記取下而持續使用很長一段時間，局部皮膚反而變得發紅、溫熱，此現象稱為：","o":["共感反應","適應現象","反彈現象","炎症反應"],"a":"C","k":"C","t":"","x":"長時間用冷後，身體為保護組織免於缺氧受損，會出現反射性血管擴張，使局部發紅溫熱，稱為反彈現象，故用冷須控制時間。共感反應是對側相對部位出現相同反應；適應現象是感受強度隨時間減弱。"},{"i":"gch2-23","e":"","n":0,"c":2,"s":"護理師為病人右手執行熱敷，一段時間後發現病人左手相對部位也出現血管擴張，此現象稱為：","o":["反彈現象","適應現象","牽涉痛","共感反應"],"a":"D","k":"D","t":"","x":"對身體一側應用冷或熱時，對側相對部位也會產生類似的血管反應，稱為共感反應。反彈現象是長時間用冷熱後出現相反的血管反應；適應現象是溫度感受隨時間變弱；牽涉痛是內臟疼痛反映於體表。"},{"i":"gch2-24","e":"","n":0,"c":2,"s":"局部用冷能減輕炎症反應，其主要原理為何？","o":["降低細胞代謝與微血管通透性","增加白血球的吞噬作用","使血液黏稠度降低","促進淋巴回流"],"a":"A","k":"A","t":"","x":"用冷使血管收縮、細胞代謝降低，並降低微血管通透性，減少液體與炎症物質滲出，因而減緩炎症反應與腫脹。增加白血球吞噬作用、降低血液黏稠度及促進淋巴回流，皆為用熱時的生理反應。"},{"i":"gch2-25","e":"","n":0,"c":2,"s":"病人局部冷敷期間，若評估出現下列何種情形，應立即停止冷敷？","o":["病人表示局部感覺涼爽舒適","局部皮膚呈斑駁狀發紫且有麻木感","局部皮膚溫度較冷敷前下降","局部腫脹程度較冷敷前減輕"],"a":"B","k":"B","t":"","x":"皮膚出現斑駁、發紫並伴隨麻木，表示組織循環不良、可能即將凍傷，應立即停止冷敷並評估。感覺涼爽、皮膚溫度下降是用冷的正常反應；腫脹減輕表示冷敷達到治療效果，可依計畫繼續。"},{"i":"gch2-26","e":"","n":0,"c":2,"s":"黃先生右下腹疼痛，醫師尚未診斷，疑似急性闌尾炎。病人要求使用熱水袋熱敷腹部止痛，護理師的回應何者最適當？","o":["可以熱敷，因熱可緩解腸道痙攣性疼痛","可以熱敷，但熱水袋外需包覆毛巾","不宜熱敷，因用熱會使全身血壓明顯上升","不宜熱敷，因用熱可能加速炎症進展而使闌尾破裂"],"a":"D","k":"D","t":"","x":"急性闌尾炎等腹部急性炎症不宜用熱，因熱使血管擴張、血流與代謝增加，可能加速炎症化膿而導致闌尾破裂。即使包覆毛巾也不能改變此風險；局部熱敷不會使全身血壓上升，並非禁忌的理由。"},{"i":"gch2-27","e":"","n":0,"c":2,"s":"下列何種情況最不宜使用局部熱療法？","o":["頸部肌肉痙攣疼痛","退化性關節炎晨間僵硬","惡性腫瘤部位","痔瘡腫脹疼痛"],"a":"C","k":"C","t":"","x":"惡性腫瘤部位不宜用熱，因熱會增加局部血流與細胞代謝，可能加速腫瘤生長與擴散。肌肉痙攣可藉熱降低肌肉張力；退化性關節炎的僵硬可藉熱增加組織延展性；痔瘡疼痛常以溫水坐浴緩解。"},{"i":"gch2-28","e":"","n":0,"c":2,"s":"病人鼻翼旁長了一個紅腫的癤，詢問可否熱敷加速消腫，護理師的回應下列何者最適當？","o":["可以熱敷，可促進化膿使其早日排膿","不宜熱敷，因此處感染可能經血管擴散至顱內","可以持續冰敷至紅腫完全消退","可以用烤燈近距離照射以促進癒合"],"a":"B","k":"B","t":"","x":"鼻翼旁屬顏面危險三角區，此處靜脈與顱內相通，用熱使血管擴張、血流增加，可能使感染擴散至顱內，故不宜熱敷。雖然熱可促進化膿，但在危險三角區風險過高；持續冰敷或近距離烤燈照射均不適當。"},{"i":"gch2-29","e":"","n":0,"c":2,"s":"下列何種病人最不適合使用局部冷療法？","o":["腳踝扭傷24小時內的運動員","雷諾氏症病人的手指","扁桃腺切除術後的兒童","大腿肌肉拉傷急性期的病人"],"a":"B","k":"B","t":"","x":"雷諾氏症病人遇冷易引起末梢血管痙攣、缺血，用冷會加重循環障礙，為冷療禁忌。扭傷24～48小時內、扁桃腺術後與肌肉拉傷急性期，皆可藉用冷使血管收縮，以減少出血、腫脹並減輕疼痛。"},{"i":"gch2-30","e":"","n":0,"c":2,"s":"下列何部位對溫度的感受最不敏感，對冷熱的耐受度較高？","o":["頸部","手腕內側","會陰部","腳底"],"a":"D","k":"D","t":"","x":"身體不同部位對冷熱的敏感度不同，皮膚較薄、神經分布較密的部位如頸部、手腕內側、前臂內側及會陰部較敏感；手掌、腳底角質層較厚，較不敏感、耐受度較高。因此在敏感部位用冷熱時應更謹慎。"},{"i":"gch2-31","e":"","n":0,"c":2,"s":"有關影響病人對冷熱耐受度的因素，下列敘述何者正確？","o":["冷熱應用的面積越大，耐受度越差","嬰幼兒對冷熱的耐受度較成人好","皮膚破損處對冷熱的耐受度較高","冷熱持續使用時間越長，溫度感受越強烈"],"a":"A","k":"A","t":"","x":"冷熱應用面積越大，身體受刺激範圍越廣，耐受度越差。嬰幼兒與老年人體溫調節及皮膚耐受度較差；皮膚破損處缺乏保護，對溫度更敏感；持續使用一段時間後會產生適應現象，感受反而變弱。"},{"i":"gch2-32","e":"","n":0,"c":2,"s":"趙女士腰部熱敷約15分鐘後，表示「已經不太覺得熱了，可以再換熱一點的嗎？」，護理師最適當的回應為何？","o":["立即更換溫度更高的熱水袋","延長熱敷時間至1小時以補足效果","改以烤燈近距離照射以增加熱度","說明這是皮膚對溫度的適應現象，不宜任意提高溫度以免燙傷"],"a":"D","k":"D","t":"","x":"溫度接受器對持續的刺激會逐漸適應，使感受減弱，但實際溫度與熱效應仍在。此時若提高溫度，容易在不自覺中造成燙傷，故應衛教並維持原溫度。延長時間或改用近距離烤燈同樣增加燙傷與反彈風險。"},{"i":"gch2-33","e":"","n":0,"c":2,"s":"吳伯伯72歲，糖尿病合併周邊神經病變，晚上覺得腳冷，要求使用熱水袋暖腳。護理師的處置何者最適當？","o":["使用熱水袋，並提高水溫以加快暖腳","使用熱水袋，直接接觸腳部以增加傳導","說明不宜使用熱水袋，建議穿著襪子或加蓋被子保暖","改用電熱墊放在腳下，整夜開啟保暖"],"a":"C","k":"C","t":"","x":"糖尿病周邊神經病變病人感覺遲鈍、循環較差，對溫度耐受度低，用熱易在不自覺中燙傷，宜以穿襪、加蓋被等方式保暖。提高水溫、直接接觸皮膚或整夜使用電熱墊，皆會大幅增加燙傷危險。"},{"i":"gch2-34","e":"","n":0,"c":2,"s":"裝灌熱水袋時，需將袋內空氣排出後再旋緊袋口，其主要理由為何？","o":["空氣為熱的不良導體，且會使袋子膨脹不易服貼於身體","避免熱水袋因空氣受熱膨脹而爆炸","空氣會加速熱水冷卻，縮短保溫時間","空氣會使熱水袋重量增加，造成病人不適"],"a":"A","k":"A","t":"","x":"空氣是熱的不良導體，袋內留有空氣會降低熱的傳導效果，並使袋身膨脹變硬、不易服貼於治療部位，因此需排出空氣。排氣的主要目的並非防止爆炸；空氣不會加速冷卻，也不會使熱水袋重量增加。"},{"i":"gch2-35","e":"","n":0,"c":2,"s":"有關冰枕的準備與使用，下列敘述何者錯誤？","o":["冰枕直接置於病人頭下，不需套上布套，以增加傳導效果","冰塊敲碎後以水沖去稜角再裝入","裝入冰塊後排出袋內空氣再旋緊","使用前倒置檢查是否漏水，並擦乾外部"],"a":"A","k":"A","t":"","x":"冰枕外應套上布套，避免冰冷表面直接接觸皮膚造成凍傷，並可吸收表面凝結的水珠，故此敘述錯誤。冰塊敲碎並沖去稜角可避免刺破冰枕、增加舒適；排出空氣可增加傳導；使用前檢查漏水並擦乾外部。"},{"i":"gch2-36","e":"","n":0,"c":2,"s":"林女士自然產後會陰有縫合傷口，醫囑使用烤燈照射會陰部，有關烤燈的敘述，下列何者正確？","o":["烤燈以傳導方式傳熱，需緊貼皮膚才有效果","烤燈以輻射方式傳熱，使用前照射部位皮膚需保持乾燥","使用前在照射部位塗抹凡士林以保護皮膚","燈泡越靠近皮膚效果越好，不需調整距離"],"a":"B","k":"B","t":"","x":"烤燈屬乾熱，以輻射方式傳熱，照射部位需清潔乾燥，避免水分或油脂聚熱造成燙傷。烤燈不需接觸皮膚；塗抹凡士林等油性物質反而增加燙傷風險；燈泡須依瓦數保持適當距離，過近易灼傷。"},{"i":"gch2-37","e":"","n":0,"c":2,"s":"有關電熱墊的使用，下列敘述何者正確？","o":["電熱墊應墊在病人身體下方，較能服貼","可與濕熱敷同時使用，以加強熱的效果","病人入睡時可開至最高溫，以維持保暖","不可使用安全別針固定電熱墊，以免觸電"],"a":"D","k":"D","t":"","x":"電熱墊內有電線，以安全別針固定可能刺破電線而導致觸電或短路。電熱墊應置於身體上方，墊在身體下方會使熱無法散出而易燙傷；與濕敷併用有觸電危險；入睡時無法反應不適，開最高溫易燙傷。"},{"i":"gch2-38","e":"","n":0,"c":2,"s":"有關濕熱與乾熱的比較，下列敘述何者正確？","o":["乾熱穿透力較濕熱強，作用可達深層組織","濕熱不受蒸發影響，保溫時間較乾熱長","濕熱穿透力較強，使用溫度應較乾熱低，以免燙傷","乾熱較濕熱容易造成皮膚浸潤"],"a":"C","k":"C","t":"","x":"水是良好的熱導體，濕熱穿透力較強、作用較深，但也較易燙傷，故使用溫度應比乾熱低。乾熱穿透力較弱；濕熱會因水分蒸發而較快降溫，乾熱保溫較久；皮膚浸潤是濕熱長時間使用的問題。"},{"i":"gch2-39","e":"","n":0,"c":2,"s":"林女士自然產後，會陰縫合處腫脹疼痛，醫囑溫水坐浴每日二次，其主要目的為何？","o":["使骨盆腔血管收縮，達到止血目的","藉由傳導作用降低全身體溫","刺激子宮收縮，預防產後出血","促進會陰部血液循環，減輕腫脹與疼痛並保持清潔"],"a":"D","k":"D","t":"","x":"溫水坐浴使會陰及骨盆腔血管擴張、血流增加，可促進傷口癒合、減輕腫脹與疼痛，並清潔會陰部。用熱會使血管擴張而非收縮；坐浴不以降低體溫為目的；促進子宮收縮應以按摩子宮等方式達成。"},{"i":"gch2-40","e":"","n":0,"c":2,"s":"病人在溫水坐浴過程中容易出現頭暈、臉色蒼白，其主要原因為何？","o":["骨盆腔血管收縮，使血壓急速上升","骨盆腔血管擴張，血液集中於下半身，使腦部血流減少","熱水刺激副交感神經，使心跳過快","水蒸氣吸入過多，造成呼吸性鹼中毒"],"a":"B","k":"B","t":"","x":"坐浴使大範圍的骨盆腔與下肢血管擴張，血液積聚於下半身，回心血量與腦部血流減少，因而出現頭暈、臉色蒼白、心跳加快等現象。用熱使血管擴張而非收縮；心跳加快屬代償反應，與水蒸氣吸入無關。"},{"i":"gch2-41","e":"","n":0,"c":2,"s":"劉先生痔瘡切除術後執行溫水坐浴，10分鐘後主訴頭暈無力，臉色蒼白、冒冷汗，護理師最適當的處置為何？","o":["加入熱水提高水溫，以改善病人發冷","立即停止坐浴，協助病人回床平躺並監測生命徵象","讓病人在坐浴盆內低頭坐著休息至症狀緩解","鼓勵病人繼續完成坐浴，以免影響治療效果"],"a":"B","k":"B","t":"","x":"頭暈、蒼白、冒冷汗為腦部血流不足的表現，應立即停止坐浴，協助病人回床平躺以增加腦部血流，並監測生命徵象。加入熱水會使血管更擴張而加重症狀；繼續坐在盆內或勉強完成坐浴，有昏倒跌傷的危險。"},{"i":"gch2-42","e":"","n":0,"c":2,"s":"有關溫水坐浴的護理，下列敘述何者錯誤？","o":["為增加療效，坐浴時間越長越好，可延長至1小時","坐浴前先協助病人排空膀胱","坐浴後以毛巾輕拍擦乾會陰部","坐浴過程中注意保暖並觀察病人臉色"],"a":"A","k":"A","t":"","x":"坐浴時間過長會使水溫下降而失去療效，且血管長時間擴張易發生頭暈、虛脫，因此並非越長越好，故此敘述錯誤。坐浴前排空膀胱可增加舒適；坐浴後輕拍擦乾以保持乾燥；過程中須保暖並觀察臉色等變化。"},{"i":"gch2-43","e":"","n":0,"c":2,"s":"下列冷熱應用方法中，主要藉由「蒸發」作用帶走體熱者為何？","o":["冰枕","酒精拭浴","烤燈","電熱墊"],"a":"B","k":"B","t":"","x":"酒精沸點低、易揮發，擦拭後迅速蒸發而帶走皮膚熱量，主要藉蒸發作用降溫。冰枕是將冷經由接觸傳導至身體；烤燈以輻射方式提供熱；電熱墊則藉接觸傳導熱，三者皆非以蒸發為主。"},{"i":"gch2-44","e":"","n":0,"c":2,"s":"下列冷熱應用方法，何者主要以「傳導」方式傳遞能量？①熱水袋 ②冰枕 ③烤燈 ④電熱墊","o":["①③④","①②④","②③④","①②③"],"a":"B","k":"B","t":"","x":"傳導是兩個直接接觸的物體間熱能的傳遞，熱水袋、冰枕及電熱墊皆接觸身體表面，藉傳導傳遞冷或熱，故為①②④。烤燈不需接觸皮膚，是以輻射方式將熱傳至身體，因此含③的組合皆不正確。"},{"i":"gch2-45","e":"","n":0,"c":2,"s":"病人泡溫泉等全身用熱時，可能出現下列哪些生理反應？①周邊血管擴張 ②血壓下降 ③脈搏加快 ④呼吸變慢","o":["①②③","①②④","①③④","②③④"],"a":"A","k":"A","t":"","x":"全身用熱使周邊血管廣泛擴張，周邊阻力下降而血壓降低，心臟為維持灌流使脈搏加快；同時代謝增加，呼吸也會加快而非變慢，故為①②③。這也是全身用熱後易出現頭暈、虛弱的原因。"},{"i":"gch2-46","e":"","n":0,"c":2,"s":"鄭先生久坐電腦前，主訴頸部肌肉痙攣、僵硬痠痛，無外傷。下列處置何者最適當？","o":["局部冰敷，以降低組織代謝","以酒精拭浴頸部，促進散熱","局部熱敷，以降低肌肉張力、緩解痙攣","使用冰領，以減少局部出血"],"a":"C","k":"C","t":"","x":"用熱可使肌肉鬆弛、降低肌肉張力，並增加血流以移除代謝產物，適合緩解肌肉痙攣與僵硬。冰敷會使肌肉更緊繃，降低代謝並非此時所需；酒精拭浴用於全身降溫；冰領用於頸部術後止血，皆不適用。"},{"i":"gch2-47","e":"","n":0,"c":2,"s":"病人臀部有一個紅腫、觸痛但尚未成熟的癤，醫囑予以熱敷，其主要目的為何？","o":["使血管收縮，抑制炎症擴散","降低神經傳導速度，達到麻醉效果","促進化膿，使感染局限化","增加血液黏稠度，避免出血"],"a":"C","k":"C","t":"","x":"用熱使血管擴張、血流與白血球增加，可加速炎症進程，促進化膿並使感染局限化，以利後續排膿。使血管收縮、神經傳導變慢及增加血液黏稠度，皆為用冷的生理作用，與熱敷目的不符。"},{"i":"gch2-48","e":"","n":0,"c":2,"s":"有關人體皮膚的溫度接受器，下列敘述何者正確？","o":["熱覺接受器的數目多於冷覺接受器，故對熱較敏感","冷覺與熱覺接受器數目相同，敏感度一致","冷覺接受器的數目多於熱覺接受器，故對冷較敏感","溫度接受器平均分布於全身，各部位敏感度相同"],"a":"C","k":"C","t":"","x":"皮膚中冷覺接受器的數目多於熱覺接受器，因此人體對冷的刺激較敏感。溫度接受器在身體各部位的分布並不平均，皮膚較薄、神經分布較密的部位如頸部、手腕內側較敏感，手掌、腳底則較不敏感。"},{"i":"gch2-49","e":"","n":0,"c":2,"s":"有關全身用冷時身體的生理反應，下列敘述何者正確？","o":["刺激副交感神經，引起寒顫與立毛","周邊血管擴張，使血壓下降","刺激交感神經，引起寒顫與立毛（雞皮疙瘩）","肌肉鬆弛，代謝率明顯下降"],"a":"C","k":"C","t":"","x":"全身用冷時交感神經興奮，周邊血管收縮以減少散熱，並引起豎毛肌收縮形成雞皮疙瘩，肌肉不自主收縮產生寒顫以增加產熱。此為交感而非副交感作用；周邊血管收縮會使血壓上升；寒顫時肌肉收縮而非鬆弛。"},{"i":"gch3-0","e":"","n":0,"c":3,"s":"有關醫療照護相關感染（healthcare-associated infection, HAI）的定義，下列敘述何者正確？","o":["病人入院時未發生、亦未處於潛伏期，而於住院或接受醫療照護期間得到的感染","住院期間任何部位培養出病原菌者，即使無症狀亦屬之","病人入院時已處於潛伏期，住院後才出現症狀者亦屬之","僅限於經由醫護人員雙手傳播所造成的感染才屬之"],"a":"A","k":"A","t":"","x":"HAI指病人入院時未發生、也不在潛伏期，而於住院或接受醫療照護時得到的感染。入院時已處潛伏期者不列入；僅培養出菌而無症狀屬移生，有菌不等於感染；HAI來源亦包括病人自身菌叢、訪客及消毒不當之器材，不限醫護人員雙手。"},{"i":"gch3-1","e":"","n":0,"c":3,"s":"下列何種病原體所造成的醫療照護相關感染，最可能屬於內生性（endogenous）感染？","o":["經醫護人員手部傳播的金黃色葡萄球菌","附著於消毒不當呼吸治療器材的綠膿桿菌","由探病訪客帶入病室的流感病毒","來自病人自身腸道菌叢的大腸桿菌"],"a":"D","k":"D","t":"","x":"內生性感染來自病人自身的皮膚、腸胃道、陰道等部位菌叢，例如大腸桿菌、念珠菌。經醫護人員手部傳播的金黃色葡萄球菌、器材消毒不當殘留的綠膿桿菌，以及訪客帶入的病原，都來自病人以外，屬外生性感染。"},{"i":"gch3-2","e":"","n":0,"c":3,"s":"有關醫療照護相關血流感染的判定，下列敘述何者錯誤？","o":["血流感染的發生與中心導管的使用高度相關","僅有中心導管尖端培養陽性，即可判定為原發性血流感染","血液培養出微生物且有動脈或靜脈感染，可判定為血流感染","無血液培養或培養陰性，但血管病灶處有膿液引流物者，歸為心臟血管系統感染"],"a":"B","k":"B","t":"","x":"僅導管尖端培養陽性，可能只是導管上的移生，不能作為原發性血流感染的依據，故此敘述錯誤。血流感染與中心導管使用高度相關；血液培養出微生物並有動靜脈感染可判定；無血液培養或陰性但血管病灶有膿液者，歸為心臟血管系統感染。"},{"i":"gch3-3","e":"","n":0,"c":3,"s":"陳太太入院時尿液培養陰性，留置導尿管第6天出現發燒38.6℃及恥骨上壓痛。下列哪一項尿液檢驗結果最能支持其為醫療照護相關泌尿道感染？","o":["尿液培養菌落數10⁵ cfu/ml，培養出1種微生物","尿液培養菌落數10³ cfu/ml，培養出1種微生物","尿液培養菌落數10⁵ cfu/ml，培養出4種微生物","導尿管尖端培養陽性，但尿液培養陰性"],"a":"A","k":"A","t":"","x":"泌尿道感染判定需至少一項臨床徵象（如發燒＞38℃、恥骨上壓痛），加上尿液培養菌落數≥10⁵ cfu/ml且微生物≤2種。10³ cfu/ml未達菌落數標準；培養出4種微生物超過2種，較可能為檢體汙染；僅導管尖端陽性而尿液陰性不符實驗室條件。"},{"i":"gch3-4","e":"","n":0,"c":3,"s":"為疑似醫療照護相關肺炎的病人留取痰液檢體，下列何者符合合格膿痰的品質標準？","o":["中性白血球≥10個，鱗狀上皮細胞≤25個","中性白血球≥25個，鱗狀上皮細胞≥25個","中性白血球≥25個，鱗狀上皮細胞≤10個","中性白血球≤10個，鱗狀上皮細胞≤10個"],"a":"C","k":"C","t":"","x":"合格膿痰需含≥25個中性白血球且≤10個鱗狀上皮細胞。中性白血球多代表下呼吸道發炎的膿性分泌物；鱗狀上皮細胞多表示檢體混有口腔唾液，不具代表性。其餘組合不是白血球不足，就是上皮細胞過多，均屬不合格檢體。"},{"i":"gch3-5","e":"","n":0,"c":3,"s":"王伯伯因腦中風住院，入院時胸部X光正常、無呼吸道症狀。住院第8天開始咳嗽、發燒38.4℃，痰液轉為黃綠色且黏稠。下列判斷與處置何者最適當？","o":["屬中風原有疾病的擴散，不列入醫療照護相關感染","屬移生現象，不需進一步檢查","症狀出現於住院7天以後，應判定為社區感染","可能為醫療照護相關肺炎，應觀察痰液性狀變化並協助留取痰液培養及胸部影像檢查"],"a":"D","k":"D","t":"","x":"王伯伯入院時無肺炎表現，住院期間才出現咳嗽、發燒及膿痰，符合醫療照護相關肺炎的可能，應以臨床症狀、胸部影像、痰液評估與培養判定，並觀察痰液顏色、黏稠度、氣味及量。中風並非感染；已有症狀不屬移生；住院後才發生的感染不是社區感染。"},{"i":"gch3-6","e":"","n":0,"c":3,"s":"判定病人為「入院時已有感染（present on admission, POA）」時，感染發生的時間範圍為何？","o":["入院前7日至入院當日","入院當日至住院第3日","入院前1日至住院第5日","入院前2日至入院次日"],"a":"D","k":"D","t":"","x":"POA指感染於入院前2日至入院次日之間已發生，屬於非醫療照護相關感染，例如因肺炎住院、入院當天已有發燒咳嗽及X光肺炎表現者。其餘時間範圍均與判定標準不符，若誤用會把入院前已存在的感染錯算為HAI，或漏算真正的HAI。"},{"i":"gch3-7","e":"","n":0,"c":3,"s":"張女士住院期間已診斷為泌尿道感染並接受治療，5天後再次送驗尿液培養，仍驗出病原菌。有關此結果的判定，下列何者正確？","o":["屬14天內同一部位的重複感染期間，不重複計算為新的醫療照護相關感染","應另計為一次新的醫療照護相關泌尿道感染","應改判為入院時已有感染（POA）","應改判為移生，視同無感染"],"a":"A","k":"A","t":"","x":"同一病人、同一部位、同一感染事件在14天內再次驗出病原菌，屬重複感染期間（RIT），不重複計算為新的HAI。另計新感染會造成重複通報；此感染是住院中發生，不是POA；病人已確診感染並非單純移生。"},{"i":"gch3-8","e":"","n":0,"c":3,"s":"林先生住院篩檢時鼻腔培養出抗藥性金黃色葡萄球菌（MRSA），但無發燒，鼻腔亦無紅腫或分泌物。此情形最適當的解讀為何？","o":["屬醫療照護相關上呼吸道感染，應通報感染","屬移生（colonization），有菌不等於有感染","屬潛伏感染再復發","屬內生性血流感染"],"a":"B","k":"B","t":"","x":"皮膚、黏膜或傷口雖有微生物存在，但沒有發燒、紅腫等感染症狀，稱為移生，有菌不等於有感染，不判定為HAI。無症狀不能通報為上呼吸道感染；潛伏感染再復發指原有感染復發；血流感染需血液培養等證據，本例均不符合。"},{"i":"gch3-9","e":"","n":0,"c":3,"s":"下列哪些情況「不」屬於醫療照護相關感染？①住院病人因免疫力下降，原本潛伏的帶狀疱疹再次發作 ②新生兒出生後第1天出現水泡，經檢驗確認為經產道感染的疱疹 ③住院第2天出現水痘，追溯為入院前已在社區暴露 ④入院時尿液培養陰性，留置導尿管第5天出現符合判定標準的泌尿道感染","o":["①②④","②③④","①②③","①③④"],"a":"C","k":"C","t":"","x":"潛伏感染再復發屬原有感染，不是新感染；新生兒經胎盤或產道感染屬原有感染；水痘為常見社區感染病原，入院前已暴露，三者皆非HAI。④入院時尿液培養陰性，住院留置導尿管後才出現符合標準的泌尿道感染，屬醫療照護相關感染。"},{"i":"gch3-10","e":"","n":0,"c":3,"s":"醫院中在單位內協助監控醫療照護相關感染、並提供同仁感染管制相關訊息的專職人員，稱為下列何者？","o":["個案管理師","感染管制連結護理師（Link Nurse）","專科護理師","出院準備服務護理師"],"a":"B","k":"B","t":"","x":"感染管制連結護理師（Link Nurse）是預防HAI的專職人員，負責監控HAI並提供感管相關訊息。個案管理師著重個案照護協調；專科護理師協助醫療處置；出院準備服務護理師負責出院規劃，三者都不是以監控感染為主要職責。"},{"i":"gch3-11","e":"","n":0,"c":3,"s":"有關一般病房護理師在預防醫療照護相關感染的角色，下列何者最不適當？","o":["評估病人的感染風險，採取適當的隔離措施","將感染管制政策落實於護理計畫中","衛教病人及家屬預防與控制感染的方法","依醫囑執行治療即可，觀察感染徵象屬感染管制人員的職責"],"a":"D","k":"D","t":"","x":"護理師預防HAI的角色包括確實洗手、確實執行無菌技術、觀察病人是否有感染徵象、評估感染風險並採取適當隔離、落實感管政策於護理計畫，以及衛教病人與家屬。觀察感染徵象是第一線護理師的職責，不能只交給感染管制人員。"},{"i":"gch3-12","e":"","n":0,"c":3,"s":"有關以清潔、消毒、滅菌控制醫療照護相關感染的原則，下列敘述何者正確？","o":["物品感染風險愈高，處理層級愈接近滅菌；風險愈低則以清潔即可","所有醫療物品一律採滅菌處理，最能有效預防感染","消毒可殺死包括芽孢在內的所有微生物，效果等同滅菌","物品分類對預防感染影響不大，重點在消毒劑濃度"],"a":"A","k":"A","t":"","x":"清潔、消毒、滅菌依感染風險由高至低，處理方式由滅菌到清潔，正確分類是預防HAI的關鍵。所有物品都滅菌不符成本，且部分物品不耐滅菌；消毒無法保證殺死芽孢，不等於滅菌；忽視分類只看消毒劑濃度並不正確。"},{"i":"gch3-13","e":"","n":0,"c":3,"s":"護理師清洗沾有血液的器械時，使用水溫應低於45℃，其主要目的為何？","o":["避免金屬器械受熱膨脹而變形","避免蛋白質物質凝結而附著於器械上","增強清潔劑的殺菌效果","避免清洗者發生燙傷"],"a":"B","k":"B","t":"","x":"清洗沾有血液、分泌物的物品時，水溫應低於45℃，以免血液等蛋白質物質遇熱凝結，牢牢附著在器械上而難以清除，影響後續消毒滅菌效果。45℃以下的水不至於使金屬變形；高溫並非為了增強殺菌；防燙傷不是此原則的主要目的。"},{"i":"gch3-14","e":"","n":0,"c":3,"s":"有關各類用物的清潔方法，下列何者正確？","o":["橡皮類用物以冷水清洗，洗淨後置於通風處晾乾","金屬器械清洗後宜靜置自然風乾，避免擦拭造成刮痕","金屬器械宜以硬毛鋼刷用力刷洗，才能徹底去除汙垢","橡皮類用物宜以熱水浸泡，以軟化附著的汙物"],"a":"A","k":"A","t":"","x":"橡皮類以冷水清洗，洗淨後放通風處晾乾。金屬類應以軟毛刷清洗，洗後馬上擦乾以免生鏽，也可用蒸餾水清洗避免腐蝕；自然風乾易生鏽，硬毛鋼刷易刮傷器械；以熱水處理橡皮類不符原則。"},{"i":"gch3-15","e":"","n":0,"c":3,"s":"病室地面上有病人嘔出的血性嘔吐物，下列清潔處理何者最適當？","o":["先以掃把清掃，再以清水拖地","直接以清水拖地，最後噴灑酒精","先以漂白水消毒血液汙染處，再以拖把拖地","以乾布擦拭後，開窗通風即可"],"a":"C","k":"C","t":"","x":"地面有血液或分泌物時，應先用漂白水消毒，再以拖把拖地；一般地面清潔也應使用拖把，避免用掃把掃地揚起塵埃與微生物。直接以清水拖地會擴大汙染範圍；僅以乾布擦拭加通風無法有效消毒。"},{"i":"gch3-16","e":"","n":0,"c":3,"s":"病房以流動蒸氣便盆沖洗器處理便盆，有關流動蒸氣消毒法，下列敘述何者正確？","o":["以100℃流動蒸氣消毒15～30分鐘","以121℃流動蒸氣消毒15～30分鐘","以100℃流動蒸氣消毒3～5分鐘","以62℃流動蒸氣消毒30分鐘"],"a":"A","k":"A","t":"","x":"流動蒸氣消毒法以100℃流動蒸氣消毒15～30分鐘，適用於便盆、餐盤等，臨床常見設備如流動蒸氣便盆沖洗器。121℃是高壓蒸氣的條件，一般流動蒸氣達不到；3～5分鐘時間不足；62℃屬低溫消毒的範圍，不是流動蒸氣法。"},{"i":"gch3-17","e":"","n":0,"c":3,"s":"護理師以2% chlorhexidine gluconate（CHG）進行皮膚消毒，與過去使用碘液消毒相比，下列敘述何者正確？","o":["消毒後仍需等待2分鐘，並重複消毒三次","消毒後應立即以生理食鹽水擦除，以免殘留","消毒後僅需等待約30秒，不需等待2分鐘及執行三消","消毒後需等待至少5分鐘，效果才會出現"],"a":"C","k":"C","t":"","x":"CHG是目前臨床常用的消毒液，取代過去碘液消毒需等待2分鐘且需執行三消的方式，2% chlorhexidine消毒後只需等待30秒。仍等2分鐘並三消是舊的碘液做法；消毒後立即擦除會影響消毒效果；不需等待5分鐘。"},{"i":"gch3-18","e":"","n":0,"c":3,"s":"新生兒加護病房中一名妊娠30週出生、出生第10天的早產兒需建立周邊靜脈管路。有關皮膚消毒液的考量，下列何者最適當？","o":["早產兒皮膚屏障已發育完整，2% chlorhexidine無特殊風險","chlorhexidine只對1歲以上幼兒具皮膚毒性，本案不受影響","使用2% chlorhexidine需特別謹慎，因可能造成早產兒嚴重的化學性灼傷","chlorhexidine對早產兒的主要風險為引起高血糖"],"a":"C","k":"C","t":"","x":"Chlorhexidine對早產兒及出生未滿2個月的嬰兒具皮膚毒性風險，可能造成嚴重的化學性灼傷，使用時需特別謹慎。早產兒皮膚屏障尚未成熟，並非無風險；風險族群是早產兒與未滿2個月嬰兒而非1歲以上；主要風險是皮膚灼傷，不是高血糖。"},{"i":"gch3-19","e":"","n":0,"c":3,"s":"下列哪一項物品最適合以乾熱氣滅菌法處理？","o":["棉質手術布單","凡士林","塑膠導尿管","光學內視鏡"],"a":"B","k":"B","t":"","x":"乾熱氣滅菌法適用於不耐水或蒸氣不易穿透的物品，如油類、粉類、凡士林、石蠟、玻璃類及尖銳器械，條件如180℃、30分鐘。棉質布單耐高溫耐濕，適合高壓蒸氣；塑膠導尿管與光學內視鏡不耐高溫，宜用氧化乙烯等低溫方式。"},{"i":"gch3-20","e":"","n":0,"c":3,"s":"有關高壓蒸氣滅菌法的注意事項，下列何者正確？","o":["適用於油脂、石蠟油類物品的滅菌","包裝不可太大、太密、太緊，以免影響蒸氣穿透","無法殺死細菌芽孢，僅能達到消毒效果","包裹愈緊密，愈能確保內部物品滅菌完全"],"a":"B","k":"B","t":"","x":"高壓蒸氣滅菌需有足夠飽和蒸氣，包裝不可太大、太密、太緊，以免蒸氣無法穿透。它利用高壓高溫的飽和蒸氣，可殺死包括芽孢在內的微生物；油脂、石蠟油與塑膠製品不適用；包裹過緊反而會讓滅菌不完全。"},{"i":"gch3-21","e":"","n":0,"c":3,"s":"下列哪些物品適合以高壓蒸氣滅菌法處理？①棉質手術衣 ②拋棄式塑膠空針 ③不鏽鋼手術器械 ④石蠟油","o":["①②","①③","②④","③④"],"a":"B","k":"B","t":"","x":"高壓蒸氣滅菌適用於手術衣、布單、手術器械等耐高溫又耐濕的物品。塑膠製品不耐高溫，不適用；大宗塑膠空針多在出廠時以伽瑪射線滅菌。石蠟油等油脂類蒸氣無法穿透，應改用乾熱氣滅菌法。"},{"i":"gch3-22","e":"","n":0,"c":3,"s":"醫院中使用的大量拋棄式塑膠空針、各式導管及紗布敷料，多在工廠製造時即以何種方法滅菌？","o":["乾熱氣滅菌法","伽瑪射線（γ-Ray）滅菌法","煮沸法","活化戊二醛浸泡法"],"a":"B","k":"B","t":"","x":"伽瑪射線滅菌法利用高穿透力的電磁游離輻射達到滅菌，主要用於大量工業製造的醫療用品，如塑膠空針、各式導管、紗布敷料，不是一般病房自行操作的方式。乾熱的高溫會讓塑膠變形；煮沸法只能消毒；戊二醛浸泡用於不耐熱器械，不適合大宗產品。"},{"i":"gch3-23","e":"","n":0,"c":3,"s":"護理師準備換藥時取出一個高壓蒸氣滅菌的包布，發現包外的化學指示帶仍為白色，未出現黑色線條。下列處置何者最適當？","o":["只要仍在有效期限內即可使用","打開包布檢查包內指示條，若已變色仍可使用","以75%酒精擦拭包布外面後再使用","視為滅菌不完全，不可使用，送回重新滅菌"],"a":"D","k":"D","t":"","x":"包外化學指示帶在溫度、濕度、時間達標準時，線條會由白色逐漸變為黑色；仍為白色表示滅菌條件未達成，應視為滅菌不完全並重新滅菌。效期內也不能代替指示帶結果；未確認滅菌就打開包布並不恰當；酒精擦拭外面無法彌補滅菌不完全。"},{"i":"gch3-24","e":"","n":0,"c":3,"s":"有關氧化乙烯（ethylene oxide, E.O.）氣體滅菌法，下列敘述何者錯誤？","o":["可殺死包括芽孢在內的微生物","滅菌後殘留氣體不具毒性，物品取出即可立即使用","適用於橡膠、塑膠、心導管及電氣器具等不耐高溫高壓的物品","滅菌條件約為37～60℃、3～6小時"],"a":"B","k":"B","t":"","x":"E.O.氣體有毒、易燃、易爆且具刺激性，滅菌後必須通氣，徹底排除殘留氣體才能使用，故取出即用的敘述錯誤。它以氣態化學物質干擾微生物代謝與複製，可殺死芽孢；適用於不耐高溫高壓的物品；條件約37～60℃、3～6小時。"},{"i":"gch3-25","e":"","n":0,"c":3,"s":"有關過氧化氫低溫電漿滅菌法，下列敘述何者正確？","o":["滅菌時間約45～75分鐘，最終產物為水與氧氣","適用於紗布、棉質布單等纖維材質","適用於液體類物品的滅菌","需以高溫蒸氣輔助，故不適合怕熱器材"],"a":"A","k":"A","t":"","x":"過氧化氫低溫電漿滅菌法是讓H₂O₂在真空中形成電漿來滅菌，速度快，約45～75分鐘，產物為H₂O與O₂，適合怕濕、怕熱的器材。它不適用於液體及紙、棉、木等纖維材質，器材尺寸也有限制；過程屬低溫，不需高溫蒸氣。"},{"i":"gch3-26","e":"","n":0,"c":3,"s":"內視鏡室護理師以活化戊二醛（Cidex®）處理使用後的內視鏡，下列作法何者正確？","o":["浸泡前不需清潔，戊二醛可直接分解有機汙物","欲達滅菌效果，室溫浸泡15～30分鐘即可","浸泡前先將內視鏡清潔乾淨，浸泡後再以無菌水充分沖洗","戊二醛無刺激性，操作時不需穿戴防護裝備"],"a":"C","k":"C","t":"","x":"使用Cidex®前需先清潔器械，浸泡後以無菌水充分沖洗。室溫浸泡15～30分鐘只達消毒，需3～10小時才達滅菌。戊二醛對呼吸道、黏膜與眼睛具刺激性，操作時需穿戴PPE；未先清潔則殘留的汙物會影響效果。"},{"i":"gch3-27","e":"","n":0,"c":3,"s":"依感染鏈的觀點，下列哪些人屬於易感宿主的高危險群？①長期使用類固醇的免疫低下者 ②剛接受手術的病人 ③營養狀態良好、無慢性病的年輕上班族 ④慢性腎臟病病人","o":["①②③","②③④","①②④","①③④"],"a":"C","k":"C","t":"","x":"易感宿主包括免疫差者、嬰幼兒及老人、營養缺乏、壓力過大、慢性病者及手術後病人。長期使用類固醇者免疫力低下、手術後病人、慢性腎臟病病人皆屬高危險群；營養良好且無慢性病的年輕成人不在高危險群之列。"},{"i":"gch3-28","e":"","n":0,"c":3,"s":"護理師妥善處理病人的痰液、嘔吐物及糞便等排泄物，並正確丟棄醫療廢棄物，此措施主要是阻斷感染鏈中的哪一環節？","o":["病原體離開傳染窩的出口","易感宿主","病原體進入宿主的入口","傳染窩本身的病原體繁殖"],"a":"A","k":"A","t":"","x":"血液、痰液、體液、嘔吐物、糞便是病原體離開傳染窩的出口，阻斷措施為洗手，以及分泌物、排泄物與醫療廢棄物的處理。易感宿主要靠增加抵抗力保護；進入宿主的入口以內外科無菌技術及防護來控制；傳染窩則靠環境衛生等減少病原體存在與繁殖。"},{"i":"gch3-29","e":"","n":0,"c":3,"s":"長期臥床的郭奶奶留置導尿管，為增加其抵抗力、保護天然防衛機轉，下列護理措施何者最適當？","o":["限制水分攝取，以減少尿液滯留於膀胱","減少翻身次數，以避免皮膚摩擦受損","鼓勵攝取足量水分以維持尿量，藉此沖洗膀胱及尿道","避免深呼吸及咳嗽，以減少體力消耗"],"a":"C","k":"C","t":"","x":"保護天然防衛機轉的措施包括攝取足量水分維持尿量以沖洗膀胱和尿道、鼓勵無法自行活動者多做深呼吸和咳嗽、活動受限者加強翻身。限制水分會增加泌尿道感染風險；減少翻身易致壓傷；避免深呼吸咳嗽則易造成肺部分泌物滯留。"},{"i":"gch3-30","e":"","n":0,"c":3,"s":"有關內科無菌技術（清潔技術），下列敘述何者正確？","o":["目的在保持滅菌物品及無菌區域於無菌狀態","主要用於導尿、注射、抽痰等侵入性治療","執行時所使用的物品均需經滅菌處理","目的在將微生物侷限在特定區域，項目包括洗手、口罩、手套及隔離衣等"],"a":"D","k":"D","t":"","x":"內科無菌技術又稱清潔技術，目的是將微生物侷限在特定區域，用於照顧傳染病人、接觸黏膜等時機，項目包括手部衛生、口罩護目鏡面罩、手套、隔離衣及單獨病室。保持無菌狀態、用於導尿注射抽痰及物品需滅菌，都是外科無菌技術的特點。"},{"i":"gch3-31","e":"","n":0,"c":3,"s":"下列哪些護理技術應採外科無菌技術？①單次導尿 ②肌肉注射 ③氣管內抽痰 ④協助病人床上沐浴","o":["①②④","①③④","②③④","①②③"],"a":"D","k":"D","t":"","x":"外科無菌技術是保持滅菌物品或無菌區於無菌狀態的技術，時機為侵入性治療（如導尿、注射、抽痰）、傷口處理及外科手術。單次導尿、肌肉注射及氣管內抽痰都屬侵入性處置；床上沐浴屬一般清潔照護，以內科無菌（清潔技術）即可。"},{"i":"gch3-32","e":"","n":0,"c":3,"s":"有關洗手在感染控制上的意義，下列敘述何者正確？","o":["能永久清除手上所有的常在菌與暫時菌","照護時已戴手套者，脫手套後不需再洗手","洗手主要目的是保護護理人員，對病人影響不大","是最簡單、最經濟、最有效的方法，能暫時性清除90%以上的細菌"],"a":"D","k":"D","t":"","x":"洗手是最簡單、最經濟、最有效的感染控制方法，能暫時清除90%以上的細菌，目的是去除手上汙垢及微生物、減少交互感染。洗手無法永久清除所有細菌；戴手套不能取代洗手，脫手套後仍需手部衛生；洗手同時保護病人與醫護人員。"},{"i":"gch3-33","e":"","n":0,"c":3,"s":"護理師進入病室為病人整理床旁桌並調整床欄，未接觸病人即離開病室。依洗手五時機，此時應執行手部衛生的時機屬於何者？","o":["接觸病人前","清潔／無菌操作技術前","暴觸病人體液風險後","接觸病人周遭環境後"],"a":"D","k":"D","t":"","x":"洗手五時機為接觸病人前、清潔或無菌操作前、暴觸病人體液風險後、接觸病人後，以及接觸病人周遭環境後。床旁桌與床欄屬病人周遭環境，護理師雖未碰觸病人，離開前仍需執行手部衛生。本情境未接觸病人、未執行技術，也沒有體液暴觸。"},{"i":"gch3-34","e":"","n":0,"c":3,"s":"護理師協助病人清除糞便後脫下手套，發現手背沾有少許糞便。下列手部衛生方式何者最適當？","o":["以酒精性乾洗手液搓揉至乾","以濕紙巾擦拭乾淨即可","以抗菌洗手液（如4% chlorhexidine）濕洗手","直接再戴上新手套繼續工作"],"a":"C","k":"C","t":"","x":"手部有明顯髒汙或沾有血液、體液時，需以濕洗手處理，暴觸病人體液風險後可使用4% chlorhexidine抗菌洗手液。酒精性乾洗手只用於手部無明顯髒汙時；濕紙巾擦拭無法有效去除微生物；戴手套不能取代洗手。"},{"i":"gch3-35","e":"","n":0,"c":3,"s":"護理師戴著手錶與戒指、穿著長袖工作服，準備在換藥前濕洗手，下列作法何者正確？","o":["先將洗手乳按壓於乾燥的雙手上，再沾水搓洗","衣袖需捲至肘關節上2吋以上，並取下手錶、戒指等飾物","每次按壓洗手乳約10～15 c.c.，以確保起泡","指甲長度不影響洗手效果，不需特別修剪"],"a":"B","k":"B","t":"","x":"洗手前應檢查雙手，確認指甲剪短、皮膚有無破損，並取下易藏汙納垢的飾物，衣袖捲至肘關節上2吋以上。之後先沾濕雙手，再按壓3～5 c.c.洗手乳搓洗至起泡。乾手給皂順序錯誤；10～15 c.c.用量過多；指甲需定期修剪。"},{"i":"gch3-36","e":"","n":0,"c":3,"s":"執行濕洗手的搓洗步驟時，下列何者符合原則？","o":["每個部位搓洗3次，全程約10秒","手腕只需洗至腕橫紋處即可","每個部位至少搓洗10次，手腕需洗至腕上約5公分（2吋）處","全程至少需搓洗3分鐘以上"],"a":"C","k":"C","t":"","x":"洗手時每個部位至少搓洗10次，全程約20～30秒，手腕部分需洗到手腕上5公分（2吋）處。每部位3次、全程10秒時間不足；只洗到腕橫紋範圍不夠；一般洗手不需搓洗3分鐘以上，時間過長也不符合臨床常規。"},{"i":"gch3-37","e":"","n":0,"c":3,"s":"有關內科無菌洗手法與外科無菌洗手法的沖水方式，下列敘述何者正確？","o":["兩者沖水時皆需指尖朝上，使水由指尖流向肘部","內科洗手雙手需高於肘部；外科洗手則指尖朝下、低於肘部","外科洗手沖水時，應使水由肘部往指尖方向流下","內科洗手沖水時指尖朝下、低於肘部；外科洗手雙手高於肘部，水由指尖經手掌流向肘部"],"a":"D","k":"D","t":"","x":"內科無菌洗手沖水時雙手指尖朝下、低於肘部，讓汙水由較乾淨處往下流走；外科無菌洗手需用刷子刷洗，雙手高於肘部，使水由指尖經手掌流向肘部，避免肘部汙水回流到最乾淨的指尖。其餘敘述將兩種方式顛倒或混淆。"},{"i":"gch3-38","e":"","n":0,"c":3,"s":"護理師照護流感病人時，病人突然咳嗽，口罩表面被飛沫噴濺沾濕。有關口罩的處理，下列何者正確？","o":["口罩潮濕、髒汙或受汙染時應立即更換，脫除後需洗手","先將口罩拉至頸部，待照護結束後再更換","外科口罩只需遮住口部，鼻部可露出以利呼吸","同一個口罩可整日連續使用，下班時再更換即可"],"a":"A","k":"A","t":"","x":"口罩濕、髒或受汙染時要立即更換；不用時應取下，勿掛在頸部周圍，脫除後需洗手。外科醫用口罩須完整遮住口、鼻，露出鼻部會失去防護效果。口罩不論時間長短，一旦潮濕或受汙染就要更換，不能整日連續使用。"},{"i":"gch3-39","e":"","n":0,"c":3,"s":"吳先生痰液抗酸菌塗片陽性，診斷為開放性肺結核，已安置於負壓隔離病房。護理師進入病室照護時，應選擇何種口罩？","o":["外科醫用口罩","一般棉布口罩","N95類型口罩","活性碳口罩"],"a":"C","k":"C","t":"","x":"開放性肺結核經空氣傳染，照護時需空氣傳染防護，應佩戴N95類型口罩，並執行密合度檢點。外科醫用口罩適用於飛沫防護及一般醫療照護，無法有效阻擋空氣傳播的微粒；棉布口罩與活性碳口罩都不是感染防護用的醫用口罩。"},{"i":"gch3-40","e":"","n":0,"c":3,"s":"有關負壓隔離病房的設置與管理，下列敘述何者錯誤？","o":["為維持空氣流通，房門宜保持開啟","設置高效能空氣過濾設備（HEPA filter），每小時至少6～12次新鮮空氣交換","負壓隔離病房不足時，可將同一感染症病人安排同住一間","病室內需有病人專屬的照護設備"],"a":"A","k":"A","t":"","x":"負壓隔離病房房門應隨時保持關閉，才能維持負壓，避免汙染空氣外流，故房門開啟的敘述錯誤。病房需設置HEPA filter，每小時至少6～12次新鮮空氣交換並排至室外；病房不足時可安排同一感染症病人同住；並需配置專屬照護設備。"},{"i":"gch3-41","e":"","n":0,"c":3,"s":"護理師為同一位病人先清理肛門周圍的糞便，接著要協助其執行口腔清潔。在兩項處置之間，下列作法何者最適當？","o":["以酒精擦拭原手套表面後繼續操作","原手套未破損，可直接繼續操作","在原手套外再加戴一層手套","脫除手套並執行手部衛生，再更換新手套"],"a":"D","k":"D","t":"","x":"同一病人由汙染部位轉到清潔部位時，必須更換手套並執行手部衛生，避免把糞便中的微生物帶到口腔。以酒精擦拭手套不能確保去除汙染；手套未破損不代表沒有汙染；外加一層手套時，外層仍有可能碰觸到汙染的內層。"},{"i":"gch3-42","e":"","n":0,"c":3,"s":"臨床上禁止使用含粉的醫用手套，其主要原因為何？","o":["含粉手套不易戴上，會延長操作時間","粉類經皮膚接觸或吸入可能引起過敏，並影響傷口癒合、增加感染風險","粉類會降低手套彈性而使手套容易破損","含粉手套價格較高，不符成本效益"],"a":"B","k":"B","t":"","x":"禁用含粉醫用手套，是因為皮膚接觸或吸入粉類可能導致過敏，粉類還會影響傷口癒合，增加發炎、沾黏及感染的風險。禁用的理由在於病人與醫護人員的健康安全，而非操作時間、手套彈性或成本考量。"},{"i":"gch3-43","e":"","n":0,"c":3,"s":"有關穿著隔離衣的原則，下列敘述何者正確？","o":["開口宜在前方，以方便快速穿脫","衣長以接觸地面為佳，才能完整覆蓋下肢","戴手套時，應將手套袖口塞入隔離衣袖口內","長度需及手腕與膝蓋，開口在背後，背後重疊以完全覆蓋工作服"],"a":"D","k":"D","t":"","x":"隔離衣應選擇適當大小，長度及手腕與膝蓋，衣服不可碰觸地面（至少離地一呎），開口在背後，並將背後重疊完全覆蓋工作服。戴手套時應讓手套覆蓋隔離衣袖口，避免手腕暴露；開口在前或衣擺觸地都不符原則。"},{"i":"gch3-44","e":"","n":0,"c":3,"s":"隔離衣以單次使用為原則。若需重複使用，脫下後的掛置方式何者正確？","o":["掛於病室內時清潔面（原內面）朝內；掛於前室時清潔面朝外","掛於病室內時清潔面朝外；掛於前室時清潔面朝內","不論掛於病室或前室，清潔面一律朝外","不論掛於病室或前室，清潔面一律朝內"],"a":"A","k":"A","t":"","x":"病室屬汙染區，掛於病室衣架時，汙染面朝外、清潔面（原內面）在內；前室相對清潔，掛於前室時清潔面朝外，避免汙染周圍環境。掛法須依所在區域調整，不能一律朝內或朝外，也不可將兩區的掛法顛倒。"},{"i":"gch3-45","e":"","n":0,"c":3,"s":"護理師準備進入病室照護COVID-19確診病人，其個人防護裝備（PPE）的穿戴順序何者正確？","o":["外科或N95口罩→防水隔離衣→面罩（護目鏡）→手套","手套→口罩→防水隔離衣→面罩（護目鏡）","防水隔離衣→手套→口罩→面罩（護目鏡）","面罩（護目鏡）→口罩→手套→防水隔離衣"],"a":"A","k":"A","t":"","x":"COVID-19的PPE穿戴順序為：外科或N95口罩→防水隔離衣→面罩（護目鏡）→手套。口罩要先戴妥，面罩才能覆蓋其上；手套最後戴，才能覆蓋隔離衣袖口。若先戴手套，後續穿戴其他裝備時容易汙染手套，也無法覆蓋袖口。"},{"i":"gch3-46","e":"","n":0,"c":3,"s":"依伊波拉病毒感染之個人防護裝備穿戴順序，第一個穿戴的項目為何？","o":["N95以上口罩","拋棄式防水性連身型防護衣","面罩（護目鏡）","內層手套"],"a":"D","k":"D","t":"","x":"伊波拉病毒的PPE穿戴順序為：內層手套→拋棄式防水長鞋套→拋棄式防水性連身型防護衣（先不戴帽）→N95以上口罩並做密合度檢點，再戴防護衣帽子→外層手套→視需要加穿防水隔離衣或圍裙→面罩。第一項是內層手套，面罩是最後一項。"},{"i":"gch3-47","e":"","n":0,"c":3,"s":"開放性肺結核隔離病人需至放射科做電腦斷層檢查，下列安排何者最適當？","o":["安排為當日第一位檢查者，以縮短等候時間","於一般候診區與其他病人一同依序等候檢查","為減少醫護人員接觸，由家屬陪同自行前往","經管制路線轉送，並安排為最後一位接受檢查者"],"a":"D","k":"D","t":"","x":"傳染性病人應減少移動或轉送；需要檢查或特殊治療時，應在管制路線下轉送，並安排為最後一位接受檢查或治療者，讓檢查室有足夠時間消毒環境。排第一位會使後續病人暴露；與他人同區候診增加傳播；由家屬自行前往則失去管制。"},{"i":"gch3-48","e":"","n":0,"c":3,"s":"護理師為病人完成肌肉注射後，對使用過的針頭應如何處理最適當？","o":["以雙手將針頭回套後，再丟入垃圾桶","丟棄前先將針頭彎曲，以防他人誤用","收集容器將滿時，可伸手取出部分針具以騰出空間","尖銳物品用後立即丟入就近的黃色防穿刺容器"],"a":"D","k":"D","t":"","x":"尖銳物品用後應立即丟入就近的黃色防穿刺容器，密封儲存並標示感染性廢棄物標誌。預防針扎的禁止行為包括針頭回套、彎曲針頭、針頭向著身體，以及從收集容器內取物；這些動作都會大幅增加被尖銳物刺傷的機會。"},{"i":"gch3-49","e":"","n":0,"c":3,"s":"護生在床旁協助醫師執行侵入性處置並鋪設無菌區，下列行為何者符合無菌原則？","o":["無菌物品可暫時夾於腋下，以騰出雙手操作","非無菌物品與無菌區應保持至少1～2吋的距離","無菌物品宜持於腰部以下，以減少落塵汙染","需要跨越無菌區取物時，動作宜迅速完成"],"a":"B","k":"B","t":"","x":"非無菌物品與無菌區至少保持1～2吋的距離。無菌物品應置於腰部以上、肩部以下的視線範圍內，不可抱在胸前或夾在腋下；腰部以下不在視線範圍內，視為汙染。無論動作多快，都不可跨越無菌面。"},{"i":"gch3-50","e":"","n":0,"c":3,"s":"有關無菌物品的儲存，下列敘述何者正確？","o":["置於離地≥10 cm、離牆≥5 cm、離天花板≥25 cm處，效期近者先用","可存放於水槽下方的櫃子，方便換藥時就近取用","置於離地≥25 cm、離牆≥5 cm、離天花板≥45 cm處，效期近者先用","新滅菌完成者放在前方，優先取用"],"a":"C","k":"C","t":"","x":"無菌物品應儲存於離地≥25 cm、離牆≥5 cm、離天花板≥45 cm處，避免放在水槽附近，以免潮濕汙染，並依效期輪替，效期近者先用。離地10 cm、離天花板25 cm的距離不足；水槽下方易受潮；新滅菌者優先使用會使舊品過期。"},{"i":"gch3-51","e":"","n":0,"c":3,"s":"護理師換藥時由無菌容器取出棉球，換藥後發現仍有2顆未使用，且無菌區包布的一角被生理食鹽水沾濕。下列處置何者正確？","o":["未使用的棉球可放回原無菌容器，供下一位病人使用","未使用的棉球不可放回原容器，被沾濕的無菌區視為汙染","包布潮濕處待其自然乾燥後，仍可視為無菌","剩餘棉球可保留在床旁桌，供同一病人下次換藥使用"],"a":"B","k":"B","t":"","x":"無菌物品取出後，未使用完的不可放回，也不可供其他病人使用；無菌物品須保持乾燥、完整，潮濕或破損即視為汙染，乾燥後也不能恢復無菌。剩餘棉球放在床旁桌已暴露於環境中，不能留待下次換藥使用。"},{"i":"gch3-52","e":"","n":0,"c":3,"s":"使用無菌有蓋容器時，下列作法何者正確？","o":["為方便取用，換藥全程讓容器蓋保持打開","容器已過期但外觀完整者，仍可繼續使用","取蓋時勿碰觸蓋子內面及邊緣，取用後盡速蓋上","取蓋時以手指扣住蓋子邊緣內側以防滑落"],"a":"C","k":"C","t":"","x":"使用無菌有蓋容器前應檢查效期，過期者需重新滅菌才可使用；需要時再開啟，用好盡速蓋上；取蓋時勿碰觸蓋子內面及邊緣。整個換藥過程開著蓋子會增加汙染；過期即使外觀完整也不可用；手指接觸蓋子邊緣內側會造成汙染。"},{"i":"gch3-53","e":"","n":0,"c":3,"s":"護生在示範室練習以無菌敷料鉗夾取無菌棉球，下列操作何者正確？","o":["握持敷料鉗中段，鉗尖朝上以便觀察是否夾穩","握持敷料鉗上1/3處，並保持鉗尖朝下","一個泡鑷罐可同時放置兩支敷料鉗以節省空間","取物時鉗尖宜朝上，避免消毒液滴落桌面"],"a":"B","k":"B","t":"","x":"拿取無菌敷料鉗時，應握在上1/3處並保持鉗尖朝下，以免消毒液從鉗尖倒流到握持處再流回，汙染鉗尖。鉗尖朝上會讓液體回流造成汙染；一個泡鑷罐只能放一支無菌敷料鉗，放兩支會互相碰觸而汙染。"},{"i":"gch3-54","e":"","n":0,"c":3,"s":"護生將無菌換藥包放在乾燥清潔的桌面上準備打開，下列打開包布的順序何者正確？","o":["近側端→左、右兩側→遠側端","遠側端→左、右兩側→近側端","左側→右側→近側端→遠側端","近側端→遠側端→左、右兩側"],"a":"B","k":"B","t":"","x":"打開無菌包時，先撕開滅菌指示帶，將該角放在遠側，依遠側端→左、右兩側→近側端的順序打開，避免手臂越過已打開的無菌區而增加汙染風險。先開近側端，之後打開遠側時手臂必然越過無菌區；開包時手也只能接觸包布四周的外面。"},{"i":"gch3-55","e":"","n":0,"c":3,"s":"護理師打開綁帶式無菌敷料包，取用部分紗布後，包內仍有剩餘敷料。下列處置何者正確？","o":["依原則重新包妥，綁帶平繞不打結以辨識已開封，並優先使用","重新包妥後將綁帶打死結，以防鬆脫汙染","包內剩餘敷料一律丟棄，不可再使用","重新包妥後放回無菌物品櫃，與未開封者一同依效期使用"],"a":"A","k":"A","t":"","x":"綁帶式無菌包若有剩餘敷料，應依原則重新包妥，綁帶以平繞方式而不打結，用以辨識此包已開封，並優先使用。打結會無法辨識已開封；只要未汙染，剩餘敷料可依原則保留；與未開封者混放管理，容易延誤使用而增加汙染風險。"},{"i":"gch3-56","e":"","n":0,"c":3,"s":"護理師換藥前需將無菌生理食鹽水倒入無菌容器，下列作法何者正確？","o":["倒溶液時，瓶口應緊貼無菌容器口以防溶液濺出","倒完後瓶口外流下的溶液，以無菌紗布來回擦拭","先倒少量溶液於彎盆以沖洗瓶口，再倒入無菌容器","溶液略為變色但仍在效期內者，可繼續使用"],"a":"C","k":"C","t":"","x":"倒無菌溶液前要確認名稱、濃度、效期與外包裝；倒時先倒少量於彎盆沖洗瓶口，再倒入無菌容器，且瓶口勿接觸容器口。溶液流出時，以無菌紗布或棉棒由瓶口向下擦拭，不可來回擦。過期、有雜質或變色者皆不可使用。"},{"i":"gch3-57","e":"","n":0,"c":3,"s":"護理師戴無菌手套為病人執行換藥，有關其戴、脫無菌手套的過程，下列何者正確？","o":["脫手套時，以已脫下手套的手插入另一手套套口內面，將其翻轉脫下","戴上無菌手套後，雙手可自然垂放於身體兩側待命","手套若僅有小破洞且未接觸傷口，可繼續使用","脫手套時，以未戴手套的手抓取另一手套的外側脫下"],"a":"A","k":"A","t":"","x":"脫無菌手套時，先以戴手套的手抓另一手套外側翻轉脫下，再用已脫手套的手插入另一手套套口內面翻轉脫下，全程手不碰觸手套外側。戴上手套後雙手應保持在腰部以上、視線範圍內；手套破損應重新更換；裸手抓手套外側會汙染雙手。"},{"i":"gch3-58","e":"","n":0,"c":3,"s":"執行無菌傷口換藥時，下列步驟的先後順序何者正確？","o":["戴無菌手套→打開無菌包→倒入無菌生理食鹽水→放入無菌紗布","倒入無菌生理食鹽水→戴無菌手套→打開無菌包→放入無菌紗布","打開無菌包建立無菌區→放入無菌紗布→倒入無菌生理食鹽水→戴無菌手套","打開無菌包→戴無菌手套→放入無菌紗布→倒入無菌生理食鹽水"],"a":"C","k":"C","t":"","x":"無菌傷口換藥流程為：洗手→準備換藥包→打開無菌包建立無菌區→投入無菌紗布→打開無菌有蓋容器、使用敷料鉗→倒入無菌生理食鹽水→戴無菌手套→清潔傷口換藥。戴無菌手套後若再碰觸包布外面或溶液瓶，手套即被汙染。"},{"i":"gch3-59","e":"","n":0,"c":3,"s":"有關組合式照護（bundle care）的概念，下列敘述何者正確？","o":["由約3～5項實證措施組成，需集體且確實執行才能改善病人結果","只要執行其中任一項措施，即可達到相同的預防效果","通常由10項以上的常規護理措施組成","以護理人員個人經驗為主，不需實證基礎"],"a":"A","k":"A","t":"","x":"依美國健康照護促進機構（IHI）的定義，組合式照護是一組通常3～5項的實證措施，集體且確實執行時，已證實能改善病人結果。只做其中一項無法達到組合式照護的效果；項目通常不多於5項；其核心在於實證基礎，而非個人經驗。"},{"i":"gch4-0","e":"","n":0,"c":4,"s":"有關觀察（observation）的敘述，下列何者正確？","o":["觀察所得資料主要供醫師診斷，與護理計畫較無關","護理觀察只運用視覺與聽覺，不包含嗅覺與觸覺","是有目的地運用個人感官去收集情境上的訊息資料","好的觀察者只需於病人入院時做一次完整觀察即可"],"a":"C","k":"C","t":"","x":"觀察是有目的地運用感官（視、聽、觸、嗅、味覺）收集情境訊息。護理觀察包含嗅覺與觸覺；觀察結果是擬訂與評值護理計畫的依據，不只供醫師參考；好的觀察者須謹慎、敏銳、有系統且持續觀察，並非只做一次。"},{"i":"gch4-1","e":"","n":0,"c":4,"s":"護理師照顧一位昏迷病人，於床旁觀察其胸廓起伏與呼吸型態，此屬於何種觀察？","o":["間接性觀察","參與性觀察","自省性觀察","旁觀性觀察"],"a":"D","k":"D","t":"","x":"昏迷病人無法與護理師互動，護理師在一旁觀察其呼吸型態，屬旁觀性（非參與性）觀察。參與性觀察須在執行護理活動時與病人互動；自省性觀察的對象是護理師自己；間接觀察是由病歷等資料取得訊息。"},{"i":"gch4-2","e":"","n":0,"c":4,"s":"有關參與性觀察（participant observation）的敘述，下列何者正確？","o":["最常運用於值夜班持手電筒巡視病房時","病人通常不會察覺自己正在被觀察","觀察對象為護理師自己的行為表現","於執行護理技術時運用，是觀察病人的最好時機"],"a":"D","k":"D","t":"","x":"參與性觀察是在執行護理技術（如翻身、擦澡）時參與病人活動並互動，可建立良好人際關係，是觀察病人的最好時機。病人不察覺、夜班巡視屬旁觀性觀察；以護理師自己為對象者為自省性觀察。"},{"i":"gch4-3","e":"","n":0,"c":4,"s":"護理師教導糖尿病病人自行注射胰島素，回覆示教時病人仍無法正確操作，護理師隨即回想自己的說明步驟與用詞是否過於艱深。此屬於何種觀察？","o":["旁觀性觀察","參與性觀察","自省性觀察","間接性觀察"],"a":"C","k":"C","t":"","x":"護理活動後病人反應不如預期，護理師重新檢視自己的行為表現以找出原因，屬自省性（內省性）觀察，有助自我成長。參與性與旁觀性觀察的對象都是病人；間接觀察是透過病歷資料取得訊息。"},{"i":"gch4-4","e":"","n":0,"c":4,"s":"護理師欲了解癌症病人接受化學治療後的反應，事先擬訂由誰、何時、觀察哪些項目及如何觀察。此作法最符合正確觀察的哪兩項特性？","o":["客觀的、有彈性","有目的、有計畫","有持續性、客觀的","有彈性、有持續性"],"a":"B","k":"B","t":"","x":"觀察化療反應屬特異性目的，即「有目的」；事先擬訂 who、when、what、where、how 屬「有計畫」，使觀察有系統、有組織。客觀指摒除偏見；彈性指視情況調整計畫；持續性指不間斷觀察，皆非本情境重點。"},{"i":"gch4-5","e":"","n":0,"c":4,"s":"接班時同事提醒某位病人「很愛抱怨、很難搞」，護理師接手後仍以平常心觀察並記錄病人實際的言行表現。此作法最符合正確觀察的哪一項特性？","o":["有持續性","有彈性","客觀的","有目的"],"a":"C","k":"C","t":"","x":"正確觀察須摒除個人主觀思想、偏見與刻板印象，以增加資料的真實性與客觀性。本題護理師不受他人評價影響、如實記錄，即符合「客觀的」。有彈性指依情況修改計畫，持續性指不中斷觀察，有目的指觀察有明確目標。"},{"i":"gch4-6","e":"","n":0,"c":4,"s":"有關正確觀察特性的敘述，下列何者錯誤？","o":["觀察計畫一旦擬訂即應嚴格執行，不宜任意更動","觀察時應摒除個人偏見與刻板印象","入院時收集一般健康資料屬於概略性目的","觀察必須持續進行，才能獲得完整的資料"],"a":"A","k":"A","t":"","x":"正確觀察雖須有計畫，但應「有彈性」，不死板，要視病人情況變化適時修改與調整，故「嚴格執行不宜更動」錯誤。摒除偏見屬客觀性；入院收集一般資料為概略性目的；持續觀察才能得到完整資料，皆正確。"},{"i":"gch4-7","e":"","n":0,"c":4,"s":"下列何者屬於間接觀察法可取得的資料？①會診檢查結果 ②叩診胸部的音調 ③護理記錄 ④醫囑 ⑤觸摸皮膚所得的溫度","o":["①②③","②④⑤","①③⑤","①③④"],"a":"D","k":"D","t":"","x":"間接觀察法是由病歷取得可供參考的資料，包括醫囑、檢驗報告、會診檢查結果、護理記錄及各項記錄圖表，故①③④正確。叩診與觸診是護理師運用感覺器官直接檢查病人所得，屬直接觀察法。"},{"i":"gch4-8","e":"","n":0,"c":4,"s":"運用嗅覺觀察病人時，下列敘述何者錯誤？","o":["尿液出現甜味或惡臭，屬泌尿系統的嗅覺觀察","呼吸帶過熟果香味（丙酮味）屬呼吸氣味的異常","傷口分泌物有特殊惡臭，需注意綠膿桿菌感染","口臭只見於呼吸道感染，與腸胃系統無關"],"a":"D","k":"D","t":"","x":"口腔異味屬腸胃系統的觀察，胃炎、牙齦發炎時都可能出現口臭，並非只見於呼吸道感染。呼吸時的過熟果香味、傷口綠膿桿菌感染的特殊惡臭、尿液甜味或惡臭，皆是嗅覺可探測的異常，敘述正確。"},{"i":"gch4-9","e":"","n":0,"c":4,"s":"護理師為新入院病人執行身體評估時，發現其雙下肢有多處瘀青，但病歷中並無相關紀錄。此時護理師最適當的作法為何？","o":["依臨床經驗推測可能原因後直接記錄","以口頭詢問方式向病人確認瘀青發生的經過","僅記錄瘀青大小，不需進一步了解原因","等待下次檢驗報告出來再一併判斷"],"a":"B","k":"B","t":"","x":"護理師對觀察所得內容有疑問或需確認健康問題時，應利用口頭詢問（問診）方式初步收集資料。依經驗推測違反客觀原則，易造成評估疏失；只記錄大小或拖延等待報告，都無法及時釐清病人的健康問題。"},{"i":"gch4-10","e":"","n":0,"c":4,"s":"護理師依「由遠而近」的層次觀察病人，下列敘述何者正確？","o":["先評估水分與電解質，最後才於測量生命徵象時評估循環","第一個層次是初次接觸病人時觀察其外觀與身材","觀察病人身體情況時，應由四肢→軀幹→頭部依序進行","接觸病人前先透過病歷，對病人基本資料及診斷有初步認知"],"a":"D","k":"D","t":"","x":"由遠而近的第一層次為間接性觀察，在接觸病人前透過病歷了解基本資料及診斷；第二層次初次接觸時形成基本印象；第三層次全面評估身體情況，由頭→軀幹→四肢，並於量生命徵象時評估循環、呼吸、皮膚，再評估水分電解質等。"},{"i":"gch4-11","e":"","n":0,"c":4,"s":"一般身體評估（腹部以外部位）的檢查順序，下列何者正確？","o":["聽診→視診→觸診→叩診","視診→聽診→叩診→觸診","觸診→視診→聽診→叩診","視診→觸診→叩診→聽診"],"a":"D","k":"D","t":"","x":"一般身體檢查順序為視診→觸診→叩診→聽診。視診→聽診→叩診→觸診是腹部評估的順序，因觸診與叩診可能刺激腸蠕動、改變腸音，故腹部須先聽診。其餘兩種順序不符合由視診開始的原則。"},{"i":"gch4-12","e":"","n":0,"c":4,"s":"護理師為主訴腹脹的病人執行腹部評估，下列檢查順序何者最適當？","o":["視診→觸診→叩診→聽診","視診→聽診→叩診→觸診","聽診→視診→叩診→觸診","視診→叩診→聽診→觸診"],"a":"B","k":"B","t":"","x":"腹部評估順序為視診→聽診→叩診→觸診，先聽診可避免叩診與觸診刺激腸道而影響腸蠕動音的判斷。視→觸→叩→聽為一般部位的順序；其他順序將叩診或觸診置於聽診之前，或未由視診開始，皆不適當。"},{"i":"gch4-13","e":"","n":0,"c":4,"s":"住院病人的床旁桌上堆放了許多家人帶來的書報與私人物品，經評估不會導致感染或意外事件。護理師最適當的處理為何？","o":["趁病人外出檢查時主動代為整理收納","依病人對環境的反應再決定，經其同意後才調整","告知病人依病房規定須立即全部清除","請家屬將所有私人物品帶回家中"],"a":"B","k":"B","t":"","x":"護理師應尊重病人的生活空間及領土權，除非病人同意或要求，才可清除或改變其周圍環境；若環境問題不會導致感染或意外，則依病人對環境的反應再決定。擅自整理、強制清除或要求帶回，皆忽視病人的領土權。"},{"i":"gch4-14","e":"","n":0,"c":4,"s":"護理師巡視病房時發現下列情形，何者必須盡快修正改善？","o":["病人希望白天將窗簾全部拉開","病人在床旁桌擺放家人的照片","病人習慣將室內拖鞋放在床尾地上","病床床輪未固定，且床面升至最高位置"],"a":"D","k":"D","t":"","x":"病床床輪未固定、床的高度不合宜，容易導致跌倒等意外事件，屬會造成意外的環境問題，必須盡快修正。擺放照片、拖鞋位置、拉開窗簾屬病人個人生活習慣，未明顯造成感染或意外，應尊重病人並依其反應再決定。"},{"i":"gch4-15","e":"","n":0,"c":4,"s":"下列何者屬於自覺症狀（subjective symptom）？","o":["病人冒冷汗","病人牙齒緊閉","病人口唇發紫","病人表示手腳麻木"],"a":"D","k":"D","t":"","x":"自覺（主觀）症狀是病人自己感受到的現象，如疼痛、癢、麻木、眩暈、口渴、心悸等，他人無法直接看見。牙齒緊閉、口唇發紫、冒冷汗是別人可感受到病人所發生的現象，屬他覺（客觀）症狀。"},{"i":"gch4-16","e":"","n":0,"c":4,"s":"急診病人主訴上腹部絞痛並感到噁心，護理師觀察到病人雙手壓住上腹部、閉眼皺眉，並測得脈搏 112 次/分。下列何者屬於客觀症狀？","o":["感到噁心","上腹部絞痛","雙手壓住上腹部","脈搏 112 次/分"],"a":"C","k":"C","t":"","x":"客觀症狀是不需特殊儀器或方法、別人即可看見的現象，如手壓住患部、閉眼皺眉。上腹部絞痛與噁心是病人自己的感受，屬主觀症狀；脈搏次數須以觸診等特殊方法測量，屬徵象（signs）。"},{"i":"gch4-17","e":"","n":0,"c":4,"s":"有關徵象（signs）的敘述，下列何者錯誤？","o":["病人主訴心悸屬於徵象","須使用特殊儀器或特殊方法測量檢查而得","經視診發現的肝性撲動屬於徵象","經觸診評估的水腫程度屬於徵象"],"a":"A","k":"A","t":"","x":"徵象是使用特殊儀器或特殊方法（視、觸、叩、聽診）具體測量檢查所得，如視診的肝性撲動、觸診的脈搏與水腫程度。心悸是病人自己感受到的現象，屬主觀症狀而非徵象。"},{"i":"gch4-18","e":"","n":0,"c":4,"s":"下列哪些屬於徵象（signs）？①血壓計測得 160/100 mmHg ②病人表示口渴 ③聽診心尖脈 96 次/分 ④臉色蒼白 ⑤顯微鏡檢查白血球數量","o":["①②③","①③⑤","②④⑤","③④⑤"],"a":"B","k":"B","t":"","x":"徵象須使用特殊儀器或方法測得：血壓計測血壓、聽診心尖脈次數、顯微鏡檢查白血球數量，故①③⑤正確。口渴是病人自覺的主觀症狀；臉色蒼白是他人肉眼即可看見的客觀症狀，皆不屬徵象。"},{"i":"gch4-19","e":"","n":0,"c":4,"s":"肺炎病人經抗生素治療後已退燒 2 天，今日下午體溫又上升至 38.8℃。此情況屬於需要報告的哪一類情形？","o":["強烈情緒反應或行為異常","意外事件","器官出現功能障礙","病程進步後再次發生的症狀"],"a":"D","k":"D","t":"","x":"病情已進步（退燒）後症狀再次出現，屬「病程進步後再次發生的症狀」，須報告。意外事件指跌傷、服錯藥等；器官功能障礙指突然不能走路、喪失聽力；強烈情緒反應指焦慮、自言自語等，皆與本情境不符。"},{"i":"gch4-20","e":"","n":0,"c":4,"s":"中風病人白天清醒、對答切題，傍晚護理師呼喚時，病人僅勉強睜眼且隨即又入睡。護理師最優先的處理為何？","o":["請家屬多陪病人說話以保持清醒","讓病人好好休息，待明晨再評估","於護理記錄中記載即可，不需報告","評估後立即報告，因病人出現意識程度改變"],"a":"D","k":"D","t":"","x":"病人由清醒轉為嗜睡，屬意識程度改變，是需要立即報告的情況之一，並應確實記錄。讓病人休息待明晨、僅記錄不報告，可能延誤處置；請家屬陪伴說話無法處理潛在的病情惡化。"},{"i":"gch4-21","e":"","n":0,"c":4,"s":"下列哪些情況需要報告？①病人服錯藥物 ②病人突然喪失聽力 ③病人終日自言自語、不與他人互動 ④病人衛教後能正確說出低鹽飲食原則","o":["①②③","①②④","①③④","②③④"],"a":"A","k":"A","t":"","x":"服錯藥物屬意外事件；突然喪失聽力屬器官出現功能障礙；自言自語、不與他人互動屬強烈情緒反應或行為異常，三者皆需報告。衛教後能正確說出低鹽飲食原則是預期中的學習成效，記錄即可。"},{"i":"gch4-22","e":"","n":0,"c":4,"s":"記錄病人精神狀態時所使用的 ABC 原則，指的是下列何者？","o":["外表、行為、言談","呼吸道、呼吸、循環","態度、信念、認知","評估、計畫、照護"],"a":"A","k":"A","t":"","x":"行為記錄的 ABC 原則指外表（appearance）、行為（behavior）與言談（conversation），用以描述病人的精神與行為狀態。呼吸道、呼吸、循環是急救評估的 ABC，與觀察記錄原則不同；其餘選項並非記錄原則。"},{"i":"gch4-23","e":"","n":0,"c":4,"s":"護理師詢問病人：「請問今天是幾月幾號？您現在在什麼地方？」此評估屬於 JOMAC 中的哪一項？","o":["M：記憶力","J：判斷力","O：定向感","C：計算能力"],"a":"C","k":"C","t":"","x":"JOMAC 分別為判斷（J）、定向（O）、記憶（M）、抽象（A）、計算（C）。詢問日期與所在地點是在評估病人對時間、地點的定向感（O）。判斷力、記憶力與計算能力需以其他問題評估，如情境判斷、回憶事件或數字運算。"},{"i":"gch4-24","e":"","n":0,"c":4,"s":"有關溝通基本概念的敘述，下列何者錯誤？","o":["溝通不僅傳送訊息內容，也包括判斷訊息的意義","溝通一詞源自拉丁文 communis，有「共同」之意","溝通是動態過程，說出的話可以收回重來","人際溝通的結果會創造關係"],"a":"C","k":"C","t":"","x":"溝通是動態的過程，不可能倒退，也不可能再重複，故說出的話無法收回重來。communication 源自拉丁文 communis，具共同之意；溝通是複雜過程，包含判斷訊息意義；人際溝通的結果會創造關係，三者皆正確。"},{"i":"gch4-25","e":"","n":0,"c":4,"s":"崔偉畢（Travelbee）對於溝通在護理中的看法，下列何者最符合？","o":["讓護病雙方需求同時獲得滿足的社交性互動","以提升護理師工作效率為中心，迅速完成護理活動","協助建立專業性治療性人際關係，必要時協助病人從痛苦經驗中尋找意義","單向傳達醫療決策，使病人遵從治療"],"a":"C","k":"C","t":"","x":"Travelbee 認為溝通是協助護理師與病人建立專業性、治療性人際關係，以完成護理目標的過程，可協助病人降低生病的經驗與痛苦，必要時從痛苦中尋找意義。治療性溝通以病人需要為中心，並非以效率或雙方需求為主，也不是單向命令。"},{"i":"gch4-26","e":"","n":0,"c":4,"s":"護理師與住院病人會談，請他說說對住院期間醫護人員照顧方式的感受與看法。此主要在達成治療性溝通的哪一項目的？","o":["得知病人對醫護人員的態度與看法","給予個別的護理指導","提升病人身心平衡狀態","收集資料以助擬訂護理計畫"],"a":"A","k":"A","t":"","x":"讓病人表達情緒，以及對疾病、醫療、護理的看法及反應，屬於「得知病人對醫護人員的態度與看法」。個別護理指導重在量身訂做衛教；提升身心平衡重在讓病人感到有價值與尊嚴；收集資料著重生活型態等以確立護理問題。"},{"i":"gch4-27","e":"","n":0,"c":4,"s":"依舒拉姆（Schramm）溝通模式，訊息傳遞的過程順序何者正確？","o":["製碼→來源→譯碼→傳播→反應","來源→傳播→製碼→反應→譯碼","來源→製碼→傳播→譯碼→反應","來源→譯碼→傳播→製碼→反應"],"a":"C","k":"C","t":"","x":"舒拉姆模式為：來源（有想讓人了解的觀念）→製碼為訊息（選擇文字、手勢等）→設法傳播（談話、書信等）→譯碼（接收者依自身態度、價值觀詮釋）→反應（贊成、反對等）。如同寫信、郵寄、讀信、回信。"},{"i":"gch4-28","e":"","n":0,"c":4,"s":"護理師告訴術後病人「要多咳嗽排痰」，病人因擔心咳嗽會使傷口裂開，便將這句話理解成「偶爾咳一兩下就好」。依舒拉姆（Schramm）溝通模式，此落差主要發生在哪一階段？","o":["傳播","製碼","譯碼","來源"],"a":"C","k":"C","t":"","x":"譯碼是接收者按自己的態度、價值觀、興趣詮釋及了解訊息；病人因自身擔憂而曲解訊息，屬譯碼階段的落差。製碼是發訊者選擇文字、手勢形成訊息；傳播是透過談話、書信等傳送；來源是發訊者原本的觀念。"},{"i":"gch4-29","e":"","n":0,"c":4,"s":"護理師以衛教單配合口頭說明，教導高血壓病人低鹽飲食，隔天病人點餐時主動選擇低鈉餐。依伯儂（Berlo）溝通模式，病人主動選擇低鈉餐屬於下列何者？","o":["回饋","訊息","途徑","收訊者"],"a":"A","k":"A","t":"","x":"伯儂模式中，回饋是訊息接收者在接收訊息後的行為反應，病人主動選擇低鈉餐即屬回饋。訊息是低鹽飲食的衛教內容；途徑是衛教單與口頭說明；收訊者是病人本身，而非其行為反應。"},{"i":"gch4-30","e":"","n":0,"c":4,"s":"有關伯恩（Berne）溝通分析的敘述，下列何者正確？","o":["此理論由伯儂（Berlo）於 1956 年提出","把人性看成自我狀態，分為父母式、成人式與兒童式","交錯溝通呈平行線，溝通可持續進行","曖昧溝通是指雙方表達一致、沒有隱藏的意思"],"a":"B","k":"B","t":"","x":"溝通分析由 Eric Berne 於 1956 年創立，把人性看成自我狀態（P-A-C：父母式、成人式、兒童式）。互補溝通才呈平行線、可持續進行；交錯溝通會立即產生障礙；曖昧溝通牽動表面與隱藏兩種自我狀態，話中有話。"},{"i":"gch4-31","e":"","n":0,"c":4,"s":"病人家屬嘴上對護理師說：「沒關係，你們慢慢來，反正我們也不急。」但語氣冷淡、頻頻看錶。依伯恩（Berne）溝通分析，此屬於何種溝通？","o":["曖昧溝通","互補溝通","交錯溝通","平行溝通"],"a":"A","k":"A","t":"","x":"曖昧溝通同時牽動表面的與內心隱藏的兩種自我狀態，表現為話中有話、口是心非；家屬口說不急、非語言卻顯露不耐，即屬此類。互補溝通呈平行、可持續；交錯溝通呈交錯狀並立即產生障礙；平行溝通非伯恩的分類名稱。"},{"i":"gch4-32","e":"","n":0,"c":4,"s":"有關語言溝通與非語言溝通的敘述，下列何者正確？","o":["非語言溝通約占 65%，往往表現出個人真實的看法與情緒","語言溝通僅指口語表達，不包含書寫方式","語言溝通能力與生理構造及認知發展程度無關","修飾與音調屬於語言溝通的範疇"],"a":"A","k":"A","t":"","x":"非語言溝通約占 65%，常表現出個人真實的看法、感受與情緒，語言溝通約占 35%。語言溝通包括口語與書寫（如信件、簡訊、LINE），且與生理構造是否健全及認知發展密切相關；修飾、音調屬非語言溝通。"},{"i":"gch4-33","e":"","n":0,"c":4,"s":"護理師為一位焦慮的術前病人說明手術流程時，下列非語言表現何者最適當？","o":["雙手抱胸、上身後仰地站在床旁說明","一邊說明一邊頻頻低頭看手錶","與病人保持適當眼神接觸，表情平和專注","快步進出病室，以急切的手勢加快說明"],"a":"C","k":"C","t":"","x":"眼神接觸可表達尊重與專注，病人會觀察護理師表情並與自身焦慮連結，故應保持平和專注。頻頻看錶表示無心再談；雙手抱胸、上身後仰是防衛性姿勢；匆忙姿態與急切手勢會讓病人覺得護理師沒時間或不關心。"},{"i":"gch4-34","e":"","n":0,"c":4,"s":"有關非語言溝通中修飾與音調的敘述，下列何者錯誤？","o":["護理師說話的音調會讓病人感受到是否友善","病人外表的修飾狀況可視為判斷其身體狀況的指標","修飾整齊的外表，通常表示個人很滿意、重視自己","生病時說話速度通常較快、音調較高"],"a":"D","k":"D","t":"","x":"音調可表達健康情形：生病時說話速度較慢、音調較低；健康時音調較高、速度較快，故該敘述錯誤。修飾狀況可作為判斷身體狀況的指標，修飾整齊通常表示重視自己；護理師的音調也會讓病人敏銳感受是否友善。"},{"i":"gch4-35","e":"","n":0,"c":4,"s":"護理師在護理站與同事討論下個月的排班事宜，依 Hall 的互動距離，此情境通常屬於哪一種距離？","o":["個人的距離，約 45～120 cm","社交的距離，約 120～360 cm","親密的距離，約 0～45 cm","公眾的距離，約 360～750 cm"],"a":"B","k":"B","t":"","x":"社交的距離約 120～360 cm（4～12 呎），用於業務聯繫、角色關係，如同事間一般社交。個人的距離 45～120 cm 用於摯友或與病人討論事情；親密距離用於配偶、親子；公眾距離用於演講、教室講課等公開場合。"},{"i":"gch4-36","e":"","n":0,"c":4,"s":"病人剛得知需接受截肢手術，處於高度焦慮狀態，護理師當下詳細說明術前準備事項，病人事後卻表示完全不記得內容。造成溝通不良最主要的因素為何？","o":["接受者的心智情緒狀況，高度焦慮致「視而不見，聽而不聞」","訊息內容不完整","發訊者身體狀況不佳","傳送途徑選擇錯誤"],"a":"A","k":"A","t":"","x":"接受者處於中高度焦慮、害怕、羞愧時，常會「視而不見，聽而不聞」，無法接收與解釋訊息，這是本情境的主因。題中未提及訊息不完整、護理師身體不適或途徑不當，因此應先處理病人的焦慮情緒，再進行說明。"},{"i":"gch4-37","e":"","n":0,"c":4,"s":"病人問護理師：「可以跟你聊幾分鐘嗎？」護理師一邊看錶、一邊匆忙回答：「可以啊。」此訊息未符合下列哪一項檢查點？","o":["完整","不相抵觸","有組織","能被了解"],"a":"B","k":"B","t":"","x":"護理師口頭回答「可以」，但看錶與匆忙的非語言行為傳達沒時間，語言與非語言訊息互相抵觸。完整指訊息內容齊全；有組織指前後關聯、因果連貫；能被了解指雙方使用能互通的語言，皆非本情境的問題。"},{"i":"gch4-38","e":"","n":0,"c":4,"s":"考量接受者接收訊息的能力，下列溝通方式何者最適當？","o":["給不識字的病人閱讀文字版衛教手冊","對聽障病人以書寫、圖片配合表情進行溝通","對只懂閩南語的病人以國語及醫學術語說明","請全喉切除術後的病人以口語回答問題"],"a":"B","k":"B","t":"","x":"溝通前應先評估接收訊息的狀況，再選擇適合途徑；聽障病人無法接收言語訊息，宜以書寫、圖片與表情輔助。給不識字者文字手冊、對只懂閩南語者講國語與術語，皆使接受者無法接收；喉切除病人無法以口語表達。"},{"i":"gch4-39","e":"","n":0,"c":4,"s":"有關正式會談的敘述，下列何者正確？","o":["由被約談者自由發表，會談者只適時給予反應","較具結構性且省時，能在短時間內獲得需要的資料","病人最能自由表達，較不會隱瞞真正的問題","內容較無主題及目標，結果可能與預期相差甚遠"],"a":"B","k":"B","t":"","x":"正式會談將目的擬成一系列問題由被約談者逐項回答，具結構性、省時；缺點是被約談者易感覺像受審而抗拒，可能避重就輕或隱瞞。由被約談者自由發表、病人可自由表達、內容不易控制等，皆為非正式會談的特性。"},{"i":"gch4-40","e":"","n":0,"c":4,"s":"傾聽的五個階段，下列順序何者正確？","o":["了解→接收→評估→記憶→反應","接收→記憶→了解→反應→評估","接收→了解→記憶→評估→反應","接收→評估→了解→記憶→反應"],"a":"C","k":"C","t":"","x":"傾聽依序為：接收所有語言及非語言訊息→了解並賦予正確意義→記憶（未記住則了解再多也枉然）→評估訊息的動機與真實性→反應（點頭、「嗯」等回饋，讓病人願意多講）。其他選項的順序皆不正確。"},{"i":"gch4-41","e":"","n":0,"c":4,"s":"護理師與病人會談時，只留意病人提到服藥的部分，對其談及家中照顧壓力的內容則未加注意，以致漏失重要資料。此屬於何種傾聽？","o":["非評斷傾聽","深層次傾聽","參與式傾聽","選擇性傾聽"],"a":"D","k":"D","t":"","x":"選擇性傾聽是只接收自己想聽的部分，容易漏失重要資料。深層次傾聽注意語言及非語言訊息，理解弦外之音；參與式傾聽雙方融入情境、雙向分享；非評斷傾聽以開放態度接納對方談話，三者皆不會造成本情境的漏失。"},{"i":"gch4-42","e":"","n":0,"c":4,"s":"有關床旁會談的姿勢與位置，下列何者最適當？","o":["站在床尾與病人保持較遠距離，以免病人有壓迫感","坐在病床前 1/3～1/2 處，視線與病人等高、身體稍向前傾","坐在病人床頭後方，避免與病人視線直接接觸","坐下後身體向後仰靠，以展現輕鬆的態度"],"a":"B","k":"B","t":"","x":"會談時應坐在約病床前 1/3～1/2 處，與病人視線等高、身體稍向前傾並面對病人，距離以看清表情、說話不費力為宜。站著會讓病人有壓迫感；避免視線接觸無法表達專注；身體後仰代表無心再談，病人會感到被拒絕。"},{"i":"gch4-43","e":"","n":0,"c":4,"s":"術後病人對護理師說：「孩子都在國外，開刀這麼大的事也沒有人來看我。」下列何者最符合同理心的回應？","o":["「別擔心，我們護理師都會好好照顧你的。」","「孩子在國外工作也是不得已的，要體諒他們。」","「你覺得很孤單，因為開刀時孩子都不在身邊。」","「你要不要打電話請孩子趕快回來？」"],"a":"C","k":"C","t":"","x":"同理心回應可用「你覺得（情緒字眼），因為（內容簡述）」，同時回應感覺並簡述語意，讓病人知道護理師了解其感受。要病人體諒子女帶有批判與建議；「別擔心」屬不當保證；直接給建議則未先回應病人情緒。"},{"i":"gch4-44","e":"","n":0,"c":4,"s":"病人術後第 2 天首次自行由病房走到護理站，下列護理師的回應何者最符合「讚賞」技巧？","o":["「你今天自己從病房走到護理站，比昨天走得更遠，真不錯！」","「你真是一個好病人。」","「這沒什麼，大部分病人都做得到。」","「繼續加油，明天要再走更多才行喔。」"],"a":"A","k":"A","t":"","x":"讚賞應先確定情境，針對具體行為做具體敘述，並真誠表達肯定。「你真是好病人」過於籠統，未說明具體行為；「大部分人都做得到」貶低病人努力；只要求明天走更多，未肯定病人當下的表現。"},{"i":"gch4-45","e":"","n":0,"c":4,"s":"有關會談中運用沉默的敘述，下列何者錯誤？","o":["沉默時溝通即暫停，雙方不會有任何訊息傳遞","病人表達有困難、試圖重整思緒時可使用沉默","病人情緒激動時，先保持沉默有助穩定情緒","應是感興趣、關心的沉默，而非不知所措的尷尬"],"a":"A","k":"A","t":"","x":"沉默時仍有非語言訊息或後溝通在進行，並非完全沒有訊息傳遞，護理師可藉此觀察病人非語言行為並檢視自己。病人表達困難、重整思緒或情緒激動時可運用沉默，且應是感興趣、關心的沉默，讓病人感到被接受。"},{"i":"gch4-46","e":"","n":0,"c":4,"s":"病人說：「醫生剛才講的那個我聽不太懂，反正就是那樣。」護理師運用「澄清」技巧時，下列回應何者最適當？","o":["「你說的『那個』，是指醫生說明中的哪一部分呢？」","「你說你聽不太懂醫生說的話。」","「你覺得呢？」","「醫生很忙，聽不懂沒有關係。」"],"a":"A","k":"A","t":"","x":"澄清是在訊息不明瞭或有疑問時提出，用字要具體，請病人說清楚，本題「那個」所指不明，故應具體詢問。複誦病人的話屬重述；「你覺得呢？」屬反映；「聽不懂沒關係」則忽略病人的困惑，屬非治療性回應。"},{"i":"gch4-47","e":"","n":0,"c":4,"s":"護理師想進一步了解病人的術後傷口疼痛情形，下列問句何者最符合開放式詢問？","o":["「是刺痛還是悶痛？」","「傷口現在還會痛嗎？」","「可以說說你的傷口痛起來是什麼感覺嗎？」","「會痛的話要不要打止痛針？」"],"a":"C","k":"C","t":"","x":"開放式詢問可避免預設答案，讓病人自由描述，收集較完整的資料。「還會痛嗎」「要不要打止痛針」只能回答會或不會、要或不要；「刺痛還是悶痛」限定病人只能二選一，皆屬封閉式問句，可能遺漏重要訊息。"},{"i":"gch4-48","e":"","n":0,"c":4,"s":"有關「反問或面質」技巧的敘述，下列何者正確？","o":["主要用於病人表達有困難、需要整理思緒時","適用於認識期，以便快速確認病人的問題","應以嚴厲語氣直接指出病人的錯誤","須在護病關係建立良好時才可使用，精神科較常使用"],"a":"D","k":"D","t":"","x":"反問或面質是針對病人不合現實之處，以冷靜態度說明真相或反問，須在關係建立良好時才可使用，精神科較常用。關係初期信任不足時不適用；語氣應冷靜而非嚴厲；病人表達困難、整理思緒時宜運用沉默。"},{"i":"gch4-49","e":"","n":0,"c":4,"s":"病人說：「最近總是吃不下飯。」護理師回答：「一定是因為擔心開刀，不要想太多就吃得下了。」此回應屬於何種非治療性會談技巧？","o":["切斷式的反應","改變話題","陳腔濫調","過早下結論"],"a":"D","k":"D","t":"","x":"護理師未深入了解病人吃不下的原因，就主觀判斷原因並提供解決方法，屬過早下結論。改變話題是忽略病人訊息轉談他事；陳腔濫調是空泛的安慰語；切斷式反應是在對方話未說完時插話打斷。"},{"i":"gch4-50","e":"","n":0,"c":4,"s":"下列非治療性會談技巧與其實例的配對，何者正確？","o":["初次見面即連續詢問住址、工作、假日消遣與興趣──超過負荷","「如果我是你，我會選擇開刀。」──完全的同意","「每個人都有不順心的時候，看開點！」──防禦性態度","口說「好看啊」卻露出不耐煩表情──陳腔濫調"],"a":"A","k":"A","t":"","x":"一次給太多資料或不斷問問題屬超過負荷。「如果我是你，我會…」是把自己價值觀加諸病人的建議性忠告；「每個人都有不順心」是空泛安慰的陳腔濫調；語言與身體行為互相矛盾屬不協調。"},{"i":"gch4-51","e":"","n":0,"c":4,"s":"護理師在與病人建立關係之初即告知：「我會在您這次住院期間負責照顧您，直到您出院。」此主要符合專業性人際關係的哪一項特性？","o":["有目的的","短暫的","專業的","可分期的"],"a":"B","k":"B","t":"","x":"專業性人際關係是短暫的，有一定的關係期限，且要事前說明，有助關係結束時順利進行。有目的的指雙方各有所得；專業的指雙方權利義務依倫理守則規定；可分期的指依互動前期至結束期發展。"},{"i":"gch4-52","e":"","n":0,"c":4,"s":"有關專業性人際關係與社交性人際關係的比較，下列何者正確？","o":["專業性關係由護病雙方共同負責關係的運作","專業性關係中，護理師的自我表露是助人的手段而非目的","專業性關係須雙方擁有相同信念才能進行","專業性關係可不經討論或計畫而隨時結束"],"a":"B","k":"B","t":"","x":"專業性關係中的自我表露是助人手段，對病人有助益才執行。專業性關係由護理師負責引導；不批判地接受病人信念，雙方信念未必相同；關係結束需經有計畫的審慎評估。雙方共同負責、信念相同、隨時結束皆屬社交性關係。"},{"i":"gch4-53","e":"","n":0,"c":4,"s":"病人請護理師保證「明天的手術一定會成功」，護理師回答：「手術結果我沒辦法保證，但我會告訴您術前要做的準備，並陪您一起面對。」此表現建立專業性人際關係的哪一項要素？","o":["面質","坦誠","自我開放","同情心"],"a":"B","k":"B","t":"","x":"坦誠（genuineness）是真心誠意，答應的事一定做到，且不給不適當的保證，本題護理師即誠實說明並提供實際協助。面質是直接坦白說出而不加判斷；自我開放是適度表露自己；同情心是主觀情緒性介入，並非建立關係的要素。"},{"i":"gch4-54","e":"","n":0,"c":4,"s":"護理師聆聽病人訴說喪子之痛時，自己也跟著痛哭失聲，下班後情緒仍久久無法平復。下列敘述何者正確？","o":["此屬同情心，主觀、情緒性地介入他人感覺，易使自己陷入需要幫助的情境","此屬同理心，是建立專業性人際關係的重要表現","此屬深層次傾聽，能理解病人話語中的弦外之音","此作法能以客觀角度幫助病人解決問題"],"a":"A","k":"A","t":"","x":"同情心是主觀的、情緒性的介入他人感覺或觀點，常使自己陷入需要幫助的情境中。同理心則是站在病人立場正確了解其感受並表達了解，以客觀角度協助病人解決問題，且應避免情感涉入太深，與本情境不同。"},{"i":"gch4-55","e":"","n":0,"c":4,"s":"有關專業性人際關係發展階段的敘述，下列何者錯誤？","o":["各階段必須依序連續發生，不能省略任何一期","依序為互動前期、認識期、工作期及結束期","有壓力存在時，可能退回上一期","在開始建立關係時就應準備結束期"],"a":"A","k":"A","t":"","x":"四個階段有一定順序，但不一定會連續，也可能省略某個階段，故「必須連續、不能省略」錯誤。依序為互動前期→認識期→工作期→結束期；有壓力時可能退回上一期；結束期應在開始建立關係時就準備，而非出院前才準備。"},{"i":"gch4-56","e":"","n":0,"c":4,"s":"下列何者屬於專業性人際關係「互動前期」的護理重點？","o":["與病人一起評值整個關係歷程及目標","為病人介紹醫院環境與住院常規","化解病人的試探行為","護理師自我探索與分析，了解自己的能力及限制"],"a":"D","k":"D","t":"","x":"互動前期是護理師尚未真正接觸病人的階段，重點為自我探索與分析、收集病人資料、計畫第一次會談。介紹醫院環境與化解試探行為屬認識期；與病人評值整個關係歷程及目標屬結束期。"},{"i":"gch4-57","e":"","n":0,"c":4,"s":"新入院病人第一天多次按紅燈，要求護理師重新調整點滴膠布位置，並留意護理師每次的反應。此最可能屬於專業性人際關係哪一期的表現？","o":["結束期的暫時性退化行為","工作期的依賴行為","認識期的試探行為","互動前期的準備行為"],"a":"C","k":"C","t":"","x":"認識期最常發生於入院時，病人可能出現試探行為（testing behavior），護理師應以尊重、傾聽及合宜解釋來化解。依賴行為見於工作期；暫時性退化行為見於結束期的分離失落；互動前期護理師尚未接觸病人。"},{"i":"gch4-58","e":"","n":0,"c":4,"s":"有關專業性人際關係「工作期」的敘述，下列何者正確？","o":["護理計畫由護理師單方面擬訂，病人配合執行即可","為避免干擾，此期不宜讓家屬參與照護計畫","病人最能接受護理指導，但部分病人會產生依賴，需謹慎處理","此期護理重點為介紹醫院環境與住院常規"],"a":"C","k":"C","t":"","x":"工作期病人已產生信任並了解問題所在，最能接受護理指導與配合措施，但部分病人會產生依賴，需謹慎處理。此期應鼓勵病人主動參與擬訂及執行護理計畫，並讓家屬共同參與，家屬是最好的支持者；介紹環境屬認識期。"},{"i":"gch4-59","e":"","n":0,"c":4,"s":"即將出院的病人對護理師說：「回家以後就見不到你們了……」並開始要求護理師協助他過去已能自行完成的進食與盥洗。護理師最適當的處理為何？","o":["立即滿足病人所有要求，以減少其失落感","了解此為分離失落的反應，鼓勵表達感受並協助確認出院後可尋求的資源","明確告訴病人已能自理，不可以再要求協助","建議醫師延後出院，等病人情緒穩定再說"],"a":"B","k":"B","t":"","x":"結束期病人可能出現分離失落感，甚至暫時性退化行為。護理師應鼓勵表達感受、給予鼓勵以加強自信，並協助確信出院後可尋求的資源。一味滿足要求會加深依賴；斥責忽略其情緒；延後出院無法解決問題。"},{"i":"gch5-0","e":"","n":0,"c":5,"s":"有關手捲軸（hand roll）的使用，下列敘述何者正確？","o":["置於手背，使腕關節維持掌屈以放鬆肌肉","主要目的在促進手部末梢血液循環","使手指完全伸直，以預防手指屈曲攣縮","置於手掌內，使拇指與四指呈對掌、手指微彎的功能位置"],"a":"D","k":"D","t":"","x":"手捲軸握於掌中，使拇指呈對掌、手指與腕關節維持微彎的功能位置，預防手指屈曲攣縮及爪形手。置於手背會使腕部掌屈變形；其目的在維持功能位置而非促進循環；手指完全伸直並非功能位置。"},{"i":"gch5-1","e":"","n":0,"c":5,"s":"有關足托板（foot board）的作用，下列何者正確？①維持踝關節約呈90度背屈 ②預防垂足 ③可撐起被蓋，避免足趾受壓 ④預防髖關節外旋","o":["①②③","①②","①④","②③④"],"a":"A","k":"A","t":"","x":"足托板使足底抵住板面，維持踝關節約90度背屈以預防垂足，板面高於足趾亦可撐起被蓋重量，避免足趾受壓。預防髖關節外旋需使用粗隆捲軸或砂袋置於大腿外側，並非足托板的功能。"},{"i":"gch5-2","e":"","n":0,"c":5,"s":"李先生雙下肢二度燒傷採暴露療法，為避免被蓋直接接觸傷口，宜選用下列何種設備？","o":["砂袋","床上護架","粗隆捲軸","足跟保護器"],"a":"B","k":"B","t":"","x":"床上護架（bed cradle）可撐起被蓋，避免被蓋直接接觸燒傷、石膏未乾或傷口部位。砂袋用於固定肢體或加壓止血；粗隆捲軸用於預防髖關節外旋；足跟保護器只保護足跟，無法撐起整條被蓋。"},{"i":"gch5-3","e":"","n":0,"c":5,"s":"張先生經右側股動脈行心導管檢查返室，醫囑於穿刺部位放置砂袋，其主要目的為何？","o":["加壓穿刺部位以預防出血","預防右側髖關節外旋","維持穿刺部位溫暖","預防右足垂足"],"a":"A","k":"A","t":"","x":"砂袋具重量，可置於動脈穿刺部位直接加壓，以預防出血或血腫形成。雖然砂袋也可置於大腿外側預防髖外旋，但此情境置於穿刺部位，目的為止血；砂袋不具保暖作用，預防垂足需用足托板。"},{"i":"gch5-4","e":"","n":0,"c":5,"s":"趙奶奶長期採仰臥姿勢，下列何部位較不屬於仰臥時的主要受壓處？","o":["枕骨","肩胛骨","足跟","股骨大粗隆"],"a":"D","k":"D","t":"","x":"仰臥時主要受壓部位為枕骨、肩胛骨、肘部、薦尾骨及足跟。股骨大粗隆位於大腿外側，為側臥時的主要受壓部位，仰臥時並非承重處，故為答案。"},{"i":"gch5-5","e":"","n":0,"c":5,"s":"病人採俯臥姿勢時，下列何部位最容易受壓？","o":["薦骨","膝蓋","枕骨","坐骨結節"],"a":"B","k":"B","t":"","x":"俯臥時身體前側承重，受壓處包括額頭或臉頰、耳朵、肩峰、胸部（女性乳房）、男性生殖器、膝蓋及足趾。薦骨與枕骨為仰臥受壓部位，坐骨結節為坐姿或坐臥時受壓部位。"},{"i":"gch5-6","e":"","n":0,"c":5,"s":"協助病人採側臥姿勢時，下列做法何者最適當？","o":["下側肩膀完全壓於身體下方以增加穩定","兩腿伸直上下重疊，以維持脊椎平直","上側腿的髖、膝關節彎曲置於前方枕頭上，避免兩腿重疊","頭部不墊枕，使頸部自然側彎以利呼吸"],"a":"C","k":"C","t":"","x":"側臥時上側腿屈髖屈膝置於身體前方枕上，避免兩腿骨突處互相壓迫並維持髖部正位。下側肩膀應稍往前拉出避免直接受壓；兩腿重疊會增加骨突受壓；頭應墊枕使頭頸與脊椎呈一直線。"},{"i":"gch5-7","e":"","n":0,"c":5,"s":"陳先生闌尾破裂併腹膜炎，術後放置腹腔引流管，護理師協助其採半坐臥式，主要目的為何？","o":["增加回心血量以預防休克","預防髖關節外旋","使腹腔滲出液積聚於骨盆腔，使感染局部化並利於引流","促進腸蠕動以預防腸阻塞"],"a":"C","k":"C","t":"","x":"半坐臥式可藉重力使腹腔滲出液流向骨盆腔，使感染局部化並利於引流，同時減輕腹部傷口張力。增加回心血量屬垂頭仰臥式的目的；預防髖外旋需靠粗隆捲軸；此姿勢主要目的並非促進腸蠕動。"},{"i":"gch5-8","e":"","n":0,"c":5,"s":"病人採半坐臥姿勢時經常滑向床尾，下列措施何者最適當？","o":["拉起床欄以防止病人滑動","將床頭再搖高至90度","將膝下床面稍微搖高，必要時足底以足托板支托","以約束帶將病人固定於床頭"],"a":"C","k":"C","t":"","x":"膝下稍微搖高可阻擋身體下滑，足托板則提供足底支撐，可減少下滑造成的剪力與薦尾部損傷。床欄無法防止往床尾滑；床頭搖得越高越容易下滑；約束並非處理下滑的適當方式。"},{"i":"gch5-9","e":"","n":0,"c":5,"s":"下列哪一位病人最不適合採垂頭仰臥式（Trendelenburg position）？","o":["下肺葉需行姿位引流者","低血容積性休克者","需使腹腔臟器移向上腹以利骨盆腔手術者","頭部外傷且顱內壓上升者"],"a":"D","k":"D","t":"","x":"垂頭仰臥式頭低腳高，會使頭部血流增加而升高顱內壓，故頭部外傷或顱內壓上升者禁用，呼吸困難者亦不宜。此姿勢可用於下肺葉姿位引流、增加回心血量以處理休克及骨盆腔手術時暴露手術視野。"},{"i":"gch5-10","e":"","n":0,"c":5,"s":"護理師協助胎位不正的孕婦採膝胸臥式，下列姿勢描述何者正確？","o":["胸部貼近床面，大腿與床面垂直，頭轉向一側","臀部低於胸部，雙膝伸直","大腿與床面呈45度並向前伸","雙膝伸直，俯臥於床上"],"a":"A","k":"A","t":"","x":"膝胸臥式為雙膝跪於床上，大腿與床面垂直，胸部貼近床面、頭轉向一側，臀部為身體最高點，可用於矯正胎位不正與子宮後傾。臀部低於胸部或大腿前伸都不是此姿勢；雙膝伸直俯臥則是俯臥式。"},{"i":"gch5-11","e":"","n":0,"c":5,"s":"協助病人採膀胱截石術臥姿（lithotomy position）時，下列何者正確？","o":["一次抬起一側下肢放入腳架，以減少病人用力","膝膕處直接頂於腳架上以增加穩定","檢查後先放下一腳，休息後再放下另一腳","雙腿同時抬起放入腳架並同時放下，膝膕處加墊保護"],"a":"D","k":"D","t":"","x":"截石術臥姿需同時抬起與放下雙腿，避免單側用力造成髖關節及骨盆韌帶拉傷；膝膕處有血管神經通過，應加墊保護避免受壓。單側操作與膝膕直接受壓皆為錯誤做法。"},{"i":"gch5-12","e":"","n":0,"c":5,"s":"下列臥姿與其適用情形之配對，何者正確？","o":["截刀式臥姿－子宮頸抹片檢查","膝胸臥式－腰椎穿刺","左側辛氏臥式－灌腸","垂頭仰臥式－顱內壓上升"],"a":"C","k":"C","t":"","x":"灌腸常採左側辛氏臥式，以順應降結腸與乙狀結腸位置。子宮頸抹片檢查採膀胱截石術臥姿；腰椎穿刺採側臥屈曲（蝦米狀）姿勢；顱內壓上升者禁用垂頭仰臥式，應抬高床頭。"},{"i":"gch5-13","e":"","n":0,"c":5,"s":"為病人執行灌腸時，協助採左側辛氏臥式，主要理由為何？","o":["順應乙狀結腸與降結腸的解剖位置，利於溶液流入","方便病人自行握住肛管","減少腹壓以預防休克","使肛門括約肌收縮以防溶液流出"],"a":"A","k":"A","t":"","x":"乙狀結腸與降結腸位於腹部左側，採左側臥可藉重力使灌腸液順著腸道流入，提高灌腸效果。肛管應由護理師執行操作；此姿勢與預防休克無關；肛門括約肌放鬆才利於插入肛管。"},{"i":"gch5-14","e":"","n":0,"c":5,"s":"護理師為女性病人執行單次導尿，最常協助病人採取下列何種姿勢？","o":["辛氏臥式","屈膝仰臥式","膝胸臥式","截刀式臥姿"],"a":"B","k":"B","t":"","x":"女性導尿、會陰沖洗及床上使用便盆，常採屈膝仰臥式，雙膝彎曲分開可充分暴露會陰部且病人較舒適。辛氏臥式用於灌腸及肛門檢查；膝胸臥式用於矯正子宮後傾；截刀式用於痔瘡等肛門手術。"},{"i":"gch5-15","e":"","n":0,"c":5,"s":"林伯伯慢性阻塞性肺病急性發作，坐在床上仍感呼吸困難，護理師宜協助採取何種姿勢？","o":["平躺仰臥以減少耗氧","垂頭仰臥式以增加腦部血流","右側臥並以枕頭支托背部","端坐呼吸姿勢，身體前傾伏於床上桌的枕頭上"],"a":"D","k":"D","t":"","x":"端坐呼吸姿勢使身體前傾伏於墊枕的床上桌，可使橫膈下降、胸廓擴張並利用呼吸輔助肌，緩解呼吸困難。平躺或側臥會使腹腔臟器上推橫膈；垂頭仰臥式會加重呼吸困難。"},{"i":"gch5-16","e":"","n":0,"c":5,"s":"有關床上拉桿（吊環，trapeze bar）的使用，下列敘述何者最適當？","o":["適用於上肢有力者，可協助其自行在床上移位或抬臀","適用於上肢癱瘓者，作為握力訓練","主要用於固定病人以避免跌落","用於撐起被蓋以避免壓迫傷口"],"a":"A","k":"A","t":"","x":"床上拉桿懸吊於床上方，病人以雙手抓握可自行抬起上身或移動，適用於上肢肌力良好、下肢活動受限者，可增加自主性。上肢癱瘓者無法使用；防跌落靠床欄；撐起被蓋則使用床上護架。"},{"i":"gch5-17","e":"","n":0,"c":5,"s":"協助病人採俯臥姿勢，下列敘述何者錯誤？","o":["頭轉向一側，必要時頭下墊薄枕","讓足背平貼床面，使踝關節維持伸直","小腿下墊枕或使足部懸於床墊末端，避免足趾受壓","腹部下可墊小枕，減少腰椎過度前凸"],"a":"B","k":"B","t":"","x":"俯臥時若足背平貼床面，踝關節會呈蹠屈，長期易造成垂足，應於小腿下墊枕或使足部懸於床墊末端。頭轉向一側可維持呼吸道通暢；腹下墊小枕可減少腰椎前凸及女性乳房受壓，均為正確做法。"},{"i":"gch5-18","e":"","n":0,"c":5,"s":"王先生意識不清長期臥床，已使用氣墊床，有關其翻身照護，下列敘述何者正確？","o":["已使用氣墊床，可不必翻身","每8小時翻身一次即可","仍應至少每2小時翻身一次，並評估骨突處皮膚","僅需於白天翻身，夜間避免干擾睡眠"],"a":"C","k":"C","t":"","x":"氣墊床只能分散壓力，不能取代翻身；長期臥床者仍需至少每2小時翻身並檢查骨突處皮膚，以預防壓力性損傷。不翻身、間隔8小時或夜間不翻身，都會使局部長時間受壓而增加損傷風險。"},{"i":"gch5-19","e":"","n":0,"c":5,"s":"護理師欲將病人往床頭移位時，下列何種方式最能減少剪力？","o":["抓住病人腋下往床頭拖拉","拉住病人雙臂往床頭拉","兩人以翻身單將病人抬離床面後，再移向床頭","搖高床頭後讓病人自行滑向床頭"],"a":"C","k":"C","t":"","x":"剪力來自皮膚與床面摩擦而深層組織移位，移位時應將病人抬離床面，利用翻身單平移，避免拖拉。抓腋下或拉手臂拖行會增加剪力，也可能造成肩關節受傷；搖高床頭反而使病人往床尾滑。"},{"i":"gch5-20","e":"","n":0,"c":5,"s":"擺位時『支托身體凹陷處』的原則，下列何者正確？","o":["凹陷處應保持懸空以利通風散熱","仰臥時可於腰部凹陷處墊小枕，維持脊柱的自然弧度","以厚支托物填滿凹陷處，並使各關節完全伸直","只有俯臥時才需要支托身體凹陷處"],"a":"B","k":"B","t":"","x":"身體凹陷處如頸部、腰部懸空會使肌肉緊張，應以適當支托物填補，維持脊柱自然弧度並增加支持面積。懸空不利放鬆；關節應維持微彎的功能位置而非完全伸直；各種臥姿皆需支托凹陷處。"},{"i":"gch5-21","e":"","n":0,"c":5,"s":"協助病人仰臥時，避免將枕頭直接墊於膝膕處，主要原因為何？","o":["會使病人往床頭方向滑動","會造成髖關節外旋","會造成足部外翻","會壓迫膕窩血管神經，影響下肢循環並增加靜脈栓塞風險"],"a":"D","k":"D","t":"","x":"膝膕處有膕動靜脈與神經通過，長時間直接受壓會影響下肢血液循環，增加深部靜脈栓塞風險，也易造成膝關節屈曲攣縮。此做法與病人往床頭滑動、髖外旋或足部外翻並無直接關係。"},{"i":"gch5-22","e":"","n":0,"c":5,"s":"頸椎受傷病人需以圓滾木翻身法翻身，下列何者最重要？","o":["讓病人自行抓床欄出力協助翻身","先翻轉上半身，再翻轉下半身","翻身前移除所有枕頭，讓頭部自然側轉","需有專人固定頭頸部，使頭頸與軀幹同時翻轉並維持一直線"],"a":"D","k":"D","t":"","x":"頸椎受傷者翻身時，必須由一人專責固定頭頸部，與其他人員同步翻轉，使頭、頸、軀幹如圓木般維持一直線，避免脊髓再受傷。病人自行用力、分段翻轉或讓頭部自然側轉都會造成頸椎扭轉。"},{"i":"gch5-23","e":"","n":0,"c":5,"s":"以圓滾木翻身法協助病人翻向左側，下列敘述何者錯誤？","o":["兩腿之間放置枕頭","利用翻身單，護理人員口令一致同時施力","先翻轉肩部，待穩定後再翻轉臀部","翻身後以枕頭支托背部維持姿勢"],"a":"C","k":"C","t":"","x":"圓滾木翻身法要求肩部與臀部同時翻轉，使脊椎維持平直不扭轉，分段翻轉會使脊柱扭曲，故錯誤。兩腿間放枕頭可維持下肢與髖部正位；翻身單配合口令同步施力及背後支托均為正確措施。"},{"i":"gch5-24","e":"","n":0,"c":5,"s":"護理師協助病人翻身時，下列何者符合身體力學原則？","o":["雙腳併攏，彎腰以背部肌肉出力","雙腳分開加大支持面，屈膝降低重心並靠近病人","遠離病人，以手臂伸直出力","扭轉腰部以帶動病人身體"],"a":"B","k":"B","t":"","x":"加大支持面、降低重心、靠近病人並使用腿部大肌肉，可增加穩定度並省力，減少下背受傷。雙腳併攏與彎腰會使支持面變小並以背肌出力；手臂伸直遠離會增加力矩；扭腰易造成腰部受傷。"},{"i":"gch5-25","e":"","n":0,"c":5,"s":"張先生右側偏癱，協助其仰臥時，右上肢的處置何者最適當？","o":["右上肢垂放於床緣外，以利肌肉伸展","以枕頭支托右上肢，手部略高於肘部，並讓手握捲軸","將右上肢壓於身體下方以固定位置","右手掌伸直平放，避免任何支托物"],"a":"B","k":"B","t":"","x":"偏癱側上肢以枕頭支托並略抬高，可促進靜脈回流減輕水腫、避免肩關節半脫位，手握捲軸維持功能位置。垂放床緣外會加重水腫及肩部牽拉；壓於身體下易受傷；手掌伸直平放易造成攣縮。"},{"i":"gch5-26","e":"","n":0,"c":5,"s":"有關維持病人良好姿勢的原則，下列敘述何者正確？","o":["關節維持微彎的功能位置，並適當支托身體各部位","所有關節均應維持完全伸直，以預防攣縮","肢體互相交叉重疊，可減少不自主移動","頭頸部應保持前屈，以利呼吸"],"a":"A","k":"A","t":"","x":"良好姿勢應使身體各部位維持正常排列，關節保持微彎的功能位置，並以支托物適當支撐。關節完全伸直易使肌肉緊張；肢體重疊會使骨突處互壓；頭頸應與脊椎呈一直線，前屈反而影響呼吸道通暢。"},{"i":"gch5-27","e":"","n":0,"c":5,"s":"李太太左前臂有靜脈輸液，護理師協助她脫下上衣，下列做法何者正確？","o":["先脫左側衣袖，再脫右側衣袖","暫停輸液並拔除留置針後再脫衣","將輸液瓶放低於注射部位，以利穿過衣袖","先脫右側衣袖，再將左側衣袖順手臂退下，輸液瓶由衣袖穿出並維持高於注射部位"],"a":"D","k":"D","t":"","x":"更衣原則為先脫健側（無管路側），再脫患側（點滴側）；脫點滴側時衣袖順手臂退下，再將輸液瓶穿過衣袖，過程中瓶身維持高於注射部位，避免回血阻塞。不可為更衣而拔針，也不可放低輸液瓶。"},{"i":"gch5-28","e":"","n":0,"c":5,"s":"協助右手背有點滴的病人穿上清潔衣服，下列步驟何者正確？","o":["先穿左手，再穿右手","先將點滴管路自留置針處分離再穿衣","先將點滴瓶穿過右側衣袖，再穿右手，最後穿左手","先穿左手，穿好後不需重新檢查點滴滴速"],"a":"C","k":"C","t":"","x":"穿衣時先穿患側（點滴側）：先將點滴瓶穿過衣袖，再將手臂穿入，最後穿健側，穿好後應檢查點滴滴速與注射部位。先穿健側會使患側穿衣困難；分離管路會增加感染與管路滑脫風險。"},{"i":"gch5-29","e":"","n":0,"c":5,"s":"陳先生左側偏癱，護理師協助更衣，下列何者正確？①先脫右側 ②先脫左側 ③先穿右側 ④先穿左側","o":["①④","②③","①③","②④"],"a":"A","k":"A","t":"","x":"偏癱病人更衣原則為「脫健穿患」：脫衣先脫健側（右側），使衣服鬆開後患側較易脫下；穿衣先穿患側（左側），再穿活動較佳的健側，可減少患側肢體被拉扯，避免關節受傷。"},{"i":"gch5-30","e":"","n":0,"c":5,"s":"王同學左小腿打石膏，協助其更換褲子時，下列何者正確？","o":["先脫右側褲管，先穿左側褲管","先脫左側褲管，先穿右側褲管","先脫左側褲管，先穿左側褲管","先脫右側褲管，先穿右側褲管"],"a":"A","k":"A","t":"","x":"下肢受傷時同樣依「脫健穿患」原則：脫褲先脫健側右腿，再小心褪下石膏側；穿褲先穿石膏側左腿，再穿右腿。如此可減少患肢活動與拉扯，避免疼痛及石膏受損。其餘選項的順序皆不符原則。"},{"i":"gch5-31","e":"","n":0,"c":5,"s":"為臥床且身上有多條管路的病人選擇衣服，下列何者最適當？","o":["套頭式緊身衣物，以固定管路","寬鬆、柔軟吸汗、前開襟或側開式的衣物","合成纖維材質衣物，以利快乾","不穿衣物，僅蓋被單以方便觀察"],"a":"B","k":"B","t":"","x":"臥床有管路者宜選寬鬆、柔軟、吸汗的棉質衣物，前開或側開設計方便穿脫及管路照護。套頭緊身衣不易穿脫且會壓迫管路；合成纖維吸汗差易刺激皮膚；不穿衣物會影響保暖與隱私。"},{"i":"gch5-32","e":"","n":0,"c":5,"s":"病人有留置導尿管，護理師協助其更換褲子時，下列何者最適當？","o":["引流袋與管路由導尿管側褲管穿過，過程中保持引流袋低於膀胱並避免拉扯","先分離導尿管與引流袋接頭再更換褲子","將引流袋暫置於病人腹部上以免掉落","先拔除導尿管，更衣後再重新置入"],"a":"A","k":"A","t":"","x":"更衣時引流袋視同管路肢體處理，由該側褲管穿過，並保持低於膀胱高度，以防尿液逆流造成感染，同時避免拉扯管路。分離密閉系統會增加感染；引流袋置於腹部高於膀胱；不應為更衣而拔管。"},{"i":"gch5-33","e":"","n":0,"c":5,"s":"協助病人更衣時，下列何者不適當？","o":["關門並拉上圍簾以維護隱私","調整室溫，並以被單覆蓋暴露部位","為求迅速，先將衣物全部脫下再一起換上","更衣同時觀察病人皮膚狀況"],"a":"C","k":"C","t":"","x":"更衣應分段進行，脫下一部分即覆蓋或換上，減少身體暴露以維護隱私及保暖，故全部脫下再換不適當。關門拉簾、調整室溫、以被單覆蓋皆為正確措施，更衣也是評估皮膚完整性的好時機。"},{"i":"gch5-34","e":"","n":0,"c":5,"s":"護理師協助點滴病人更衣後，發現點滴滴速明顯變慢，首先應如何處理？","o":["立即拔除留置針，重新注射","檢查管路是否扭折受壓、點滴瓶高度及注射部位","自行將滴速調快以補足輸液量","立即通知醫師更改醫囑"],"a":"B","k":"B","t":"","x":"更衣過程中管路易扭折、受壓，或點滴瓶位置降低，應先檢查管路通暢性、瓶高與注射部位有無腫脹，再依醫囑速率重新調整。未評估即拔針、自行加快補液或直接要求更改醫囑皆不恰當。"},{"i":"gch5-35","e":"","n":0,"c":5,"s":"有關會陰沖洗的目的，下列何者錯誤？","o":["清潔會陰部，去除分泌物與異味","促進子宮收縮，減少惡露量","預防泌尿生殖道感染","促進病人舒適"],"a":"B","k":"B","t":"","x":"會陰沖洗的目的在清潔會陰、去除分泌物與異味、預防泌尿生殖道感染並促進舒適，也可觀察會陰部狀況。促進子宮收縮需靠子宮按摩、哺乳或藥物等措施，並非會陰沖洗的目的。"},{"i":"gch5-36","e":"","n":0,"c":5,"s":"執行會陰沖洗時，沖洗液的適當溫度為何？","o":["35～37℃","45～48℃","41～43℃","50～52℃"],"a":"C","k":"C","t":"","x":"會陰沖洗液溫度以41～43℃為宜，接近或略高於體溫，病人感覺舒適而不致燙傷，使用前可以手腕內側測試。35～37℃偏涼，易使病人不適；45℃以上對會陰黏膜過熱，有燙傷危險。"},{"i":"gch5-37","e":"","n":0,"c":5,"s":"執行女性會陰沖洗時，沖洗壺的方向與沖洗方式何者正確？","o":["壺嘴朝向床頭，由肛門往恥骨方向沖洗","壺嘴直接對準陰道口加壓沖洗","先沖洗肛門周圍，再沖洗尿道口","壺嘴朝向床尾，由恥骨聯合處往下沖洗"],"a":"D","k":"D","t":"","x":"沖洗壺嘴應朝向床尾，沖洗液由恥骨聯合處往下流向肛門，使水流由清潔區流向污染區。壺嘴朝床頭或由肛門往前沖，會將肛門細菌帶至尿道口與陰道口；對準陰道口加壓沖洗可能使液體進入陰道。"},{"i":"gch5-38","e":"","n":0,"c":5,"s":"執行會陰沖洗時，有關棉棒的使用，下列何者正確？","o":["一枝棉棒來回擦拭至乾淨為止","每枝棉棒由上往下擦拭一次即丟棄","由肛門往尿道口方向擦拭","同一枝棉棒可先擦遠側再擦近側"],"a":"B","k":"B","t":"","x":"沖洗棉棒應由上往下（由前往後）擦拭，每枝只用一次即丟棄，避免將污染物帶回清潔區造成交互感染。來回擦拭、由肛門往前擦或一枝棉棒重複擦拭不同部位，都會增加泌尿道感染的風險。"},{"i":"gch5-39","e":"","n":0,"c":5,"s":"協助女性病人進行床上會陰沖洗的準備，下列何者正確？","o":["協助採左側臥，便盆置於臀部後方","不使用便盆，直接以看護墊吸收沖洗液","協助採屈膝仰臥，臀下放置便盆，以浴毯覆蓋只暴露會陰部","掀開被蓋使下半身完全暴露，以利操作"],"a":"C","k":"C","t":"","x":"會陰沖洗採屈膝仰臥式，雙腿分開以暴露會陰，臀下放便盆承接沖洗液，並以浴毯覆蓋雙腿，只暴露會陰部以維護隱私與保暖。側臥不利沖洗；看護墊無法承接大量沖洗液；下半身完全暴露不尊重隱私。"},{"i":"gch5-40","e":"","n":0,"c":5,"s":"為留置導尿管的病人執行會陰沖洗，下列何者正確？","o":["由導管遠端往尿道口方向擦拭","為避免感染，尿道口周圍不予清潔","清潔導尿管
